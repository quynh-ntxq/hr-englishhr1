<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>C&B English Coach - Luyện tiếng Anh HR/Payroll</title>
<meta name="theme-color" content="#0B3D5C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --navy:#0B3D5C;
    --navy-dark:#062638;
    --accent:#0F9D8C;
    --green:#1DB954;
    --orange:#E08A00;
    --bg1:#08283D;
    --bg2:#136B7A;
    --card:#ffffff;
    --text:#1f2430;
    --muted:#8a90a2;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    font-family:'Inter',system-ui,sans-serif;
    background:
      radial-gradient(circle at 15% 10%, rgba(255,255,255,0.10), transparent 40%),
      radial-gradient(circle at 90% 85%, rgba(255,255,255,0.08), transparent 45%),
      linear-gradient(135deg, var(--bg1), var(--bg2));
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding: clamp(10px, 4vw, 30px);
  }

  .app{
    width:100%;
    max-width:760px;
    margin-top: clamp(6px, 2vh, 24px);
  }

  .card{
    background: var(--card);
    border-radius: 24px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.25), 0 4px 12px rgba(0,0,0,0.08);
    padding: clamp(18px, 4vw, 34px);
    overflow:hidden;
    position:relative;
  }

  .brand{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-bottom: 4px;
  }
  .brand .logo-dot{
    width:14px;height:14px;border-radius:50%;
    background: linear-gradient(135deg, var(--accent), #ff8a00);
    flex-shrink:0;
  }
  .brand h1{
    font-family:'Poppins',sans-serif;
    font-weight:800;
    letter-spacing:0.5px;
    font-size: clamp(1.3em, 4.5vw, 1.7em);
    color: var(--navy);
    margin:0;
  }
  .subtitle{
    text-align:center;
    color: var(--muted);
    font-size: clamp(0.82em, 2.6vw, 0.95em);
    margin: 2px 0 18px;
  }

  /* SETTINGS GEAR + PANEL */
  .settings-toggle{
    position:absolute;
    top: clamp(14px, 3vw, 22px);
    right: clamp(14px, 3vw, 22px);
    width:36px;height:36px;
    border-radius:50%;
    border:none;
    background:#f0f1f6;
    color:var(--navy);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1em;
    transition: transform .3s ease, background .2s ease;
    z-index:2;
  }
  .settings-toggle.open{ transform: rotate(75deg); background:var(--navy); color:#fff; }

  .settings-panel{
    max-height:0;
    opacity:0;
    overflow:hidden;
    transition: max-height .3s ease, opacity .25s ease, margin .3s ease;
    background:#f7f8fd;
    border-radius:16px;
  }
  .settings-panel.open{
    max-height:420px;
    opacity:1;
    margin-bottom:16px;
    padding: 14px 16px;
  }
  .settings-row{ margin-bottom:12px; }
  .settings-row:last-child{ margin-bottom:0; }
  .settings-row label{
    display:block;
    font-size:0.78em;
    font-weight:600;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.05em;
    margin-bottom:6px;
  }
  .settings-row select{
    width:100%;
    padding:9px 10px;
    border-radius:10px;
    border:1.5px solid #e2e5f0;
    background:#fff;
    color:var(--text);
    font-size:0.85em;
    font-family:'Inter',sans-serif;
  }
  .settings-row select:disabled{ color:var(--muted); }
  .speed-options{ display:flex; gap:8px; }
  .speed-btn, .speed-btn-en{
    flex:1;
    border:1.5px solid #e2e5f0;
    background:#fff;
    color:#3a4160;
    font-weight:600;
    font-size:0.82em;
    padding:8px 6px;
    border-radius:10px;
    cursor:pointer;
    transition: all .15s ease;
  }
  .speed-btn.active, .speed-btn-en.active{
    background: var(--navy);
    border-color: var(--navy);
    color:#fff;
  }

  .speed-value-label{
    font-weight:700;
    color: var(--navy);
    margin-left:4px;
    text-transform:none;
  }
  .speed-slider{
    width:100%;
    height:6px;
    border-radius:999px;
    outline:none;
    appearance:none;
    -webkit-appearance:none;
    background: linear-gradient(to right, var(--navy) 0%, var(--navy) var(--fill, 50%), #e2e5f0 var(--fill, 50%), #e2e5f0 100%);
    margin-top:8px;
    cursor:pointer;
  }
  .speed-slider::-webkit-slider-thumb{
    appearance:none;
    -webkit-appearance:none;
    width:20px;height:20px;
    border-radius:50%;
    background:#fff;
    border:3px solid var(--navy);
    cursor:pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }
  .speed-slider::-moz-range-thumb{
    width:20px;height:20px;
    border-radius:50%;
    background:#fff;
    border:3px solid var(--navy);
    cursor:pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }
  .speed-slider::-moz-range-progress{
    background: var(--navy);
    height:6px;
    border-radius:999px;
  }

  /* MODE TABS */
  .mode-tabs{
    display:flex;
    gap:8px;
    margin-bottom:16px;
    background:#f0f1f6;
    border-radius:14px;
    padding:4px;
  }
  .mode-tab{
    flex:1;
    border:none;
    background:transparent;
    color:var(--muted);
    font-weight:700;
    font-size: clamp(0.8em, 2.8vw, 0.9em);
    padding:10px 8px;
    border-radius:10px;
    cursor:pointer;
    transition: all .18s ease;
  }
  .mode-tab.active{
    background:#fff;
    color:var(--navy);
    box-shadow: 0 3px 10px rgba(0,0,0,0.1);
  }

  /* LISTENING VIEW */
  .listen-card{
    background: linear-gradient(160deg, #f7f8fd, #eef0fb);
    border-radius: 18px;
    padding: clamp(18px, 4.5vw, 28px);
    margin-bottom: 16px;
  }
  .listen-title{
    font-family:'Poppins',sans-serif;
    font-weight:700;
    font-size: clamp(1.05em, 4vw, 1.3em);
    color: var(--navy);
    margin-bottom:4px;
  }
  .listen-type-badge{
    display:inline-block;
    font-size:0.72em;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.04em;
    color: var(--accent);
    background:#e5f7f4;
    padding:3px 10px;
    border-radius:999px;
    margin-bottom:12px;
  }
  .listen-play-row{
    display:flex;
    gap:10px;
    margin-bottom:14px;
  }
  .listen-play-btn{
    border:none;
    background: var(--navy);
    color:#fff;
    font-weight:700;
    font-size: clamp(0.68em, 3.2vw, 0.85em);
    padding:11px 8px;
    border-radius:12px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
    flex:1;
    justify-content:center;
    white-space:nowrap;
    overflow:hidden;
  }
  .listen-play-btn.secondary{
    background:#fff;
    color:var(--navy);
    border:1.5px solid #dfe2f0;
  }
  .listen-play-btn.playing{
    background:#c0392b;
  }
  .listen-play-btn.secondary.playing{
    background:#fdecea;
    color:#c0392b;
    border-color:#c0392b;
  }
  .transcript-toggle{
    border:none;
    background:none;
    color:var(--accent);
    font-weight:700;
    font-size:0.82em;
    cursor:pointer;
    padding:4px 0;
    margin-bottom:10px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .transcript-box{
    display:none;
    background:#fff;
    border-radius:14px;
    padding:14px 16px;
    margin-bottom:14px;
    max-height:280px;
    overflow-y:auto;
  }
  .transcript-box.show{ display:block; }
  .transcript-line{
    margin-bottom:10px;
    line-height:1.5;
  }
  .transcript-line:last-child{ margin-bottom:0; }
  .transcript-en{
    font-weight:600;
    color:var(--text);
    font-size:0.92em;
  }
  .transcript-vi{
    color:var(--muted);
    font-size:0.85em;
    margin-top:2px;
  }
  .speaker-tag{
    display:inline-block;
    font-size:0.72em;
    font-weight:700;
    color: var(--accent);
    margin-right:6px;
  }
  .quiz-wrap{
    margin-top:6px;
  }
  .quiz-q{
    font-weight:700;
    font-size:0.9em;
    color:var(--text);
    margin:14px 0 8px;
  }
  .quiz-q:first-child{ margin-top:0; }
  .quiz-opt{
    display:block;
    width:100%;
    text-align:left;
    border:1.5px solid #e2e5f0;
    background:#fff;
    color:var(--text);
    font-size:0.85em;
    padding:10px 12px;
    border-radius:10px;
    margin-bottom:8px;
    cursor:pointer;
    transition: all .15s ease;
  }
  .quiz-opt.correct{
    background:#e7f8ec;
    border-color: var(--green);
    color:#146c2e;
    font-weight:700;
  }
  .quiz-opt.wrong{
    background:#fdecea;
    border-color:#e0574a;
    color:#a02f24;
    font-weight:700;
  }
  .quiz-opt:disabled{ cursor:default; }

  /* TOPIC CHIPS */
  .topics-wrap{
    margin-bottom: 14px;
  }
  .topics-label{
    font-size:0.78em;
    color:var(--muted);
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.06em;
    margin-bottom:8px;
    display:block;
  }
  .topic-chips{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    max-height: 180px;
    overflow-y:auto;
    padding: 2px 2px 6px;
  }
  .chip{
    border: 1.5px solid #e2e5f0;
    background:#fafbff;
    color:#3a4160;
    font-size: clamp(0.76em, 2.4vw, 0.85em);
    font-weight:600;
    padding: 8px 14px;
    border-radius: 999px;
    cursor:pointer;
    white-space:nowrap;
    transition: all .18s ease;
    user-select:none;
  }
  .chip:active{ transform: scale(0.96); }
  .chip.selected{
    background: var(--navy);
    border-color: var(--navy);
    color:#fff;
  }
  .chip.all-chip{
    background:#fff3ee;
    border-color:#ffd2c2;
    color:var(--accent);
  }
  .chip.all-chip.selected{
    background: var(--accent);
    border-color: var(--accent);
    color:#fff;
  }
  .chip.stage-chip.selected{
    background: var(--accent);
    border-color: var(--accent);
    color:#fff;
  }
  .stage-desc{
    font-size:0.78em;
    color:var(--muted);
    font-style:italic;
    margin: 6px 2px 0;
  }

  /* QUESTION AREA */
  .stage{
    background: linear-gradient(160deg, #f7f8fd, #eef0fb);
    border-radius: 18px;
    padding: clamp(20px, 5vw, 34px) clamp(16px, 4vw, 26px);
    text-align:center;
    min-height: 190px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-bottom: 16px;
  }
  .question{
    font-family:'Poppins',sans-serif;
    font-weight:700;
    font-size: clamp(1.2em, 5vw, 1.7em);
    color: var(--text);
    line-height:1.35;
  }
  .question.compact{ font-size: clamp(1.05em, 4.2vw, 1.35em); }

  .replay-btn{
    border:none;
    background:#fff;
    color:var(--navy);
    width:38px;height:38px;
    border-radius:50%;
    box-shadow: 0 3px 10px rgba(0,0,0,0.12);
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-size:0.95em;
    transition: transform .15s ease;
  }
  .replay-btn:active{ transform: scale(0.9); }
  .replay-btn.muted{ background:#fdecea; color:#c0392b; }

  .answer-block{
    max-height:0;
    opacity:0;
    overflow:hidden;
    transition: max-height .35s ease, opacity .3s ease, margin .3s ease;
  }
  .answer-block.show{
    max-height:220px;
    opacity:1;
    margin-top:6px;
  }
  .answer{
    font-family:'Poppins',sans-serif;
    font-weight:600;
    font-size: clamp(1.05em, 4vw, 1.25em);
    color: var(--green);
  }
  .ipa{
    font-size: clamp(0.85em, 3vw, 1em);
    color: var(--orange);
    font-weight:600;
    margin-top:6px;
  }

  .answer .hl{background:linear-gradient(transparent 55%, rgba(250,204,21,.55) 55%);border-radius:2px}
  .empty-note{
    color: var(--muted);
    font-style: italic;
    font-size:0.82em;
    text-align:center;
    margin: -6px 0 12px;
  }

  /* PROGRESS */
  .progress-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:16px;
  }
  .progress-bar{
    flex:1;
    height:8px;
    background:#eceefa;
    border-radius:999px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background: linear-gradient(90deg, var(--navy), #5b6fd6);
    border-radius:999px;
    transition: width .3s ease;
  }
  .progress-text{
    font-size:0.82em;
    font-weight:700;
    color:var(--navy);
    white-space:nowrap;
    min-width:52px;
    text-align:right;
  }

  /* AUTO PLAY */
  .auto-row{
    display:grid;
    grid-template-columns: 3fr 3fr 4fr;
    gap:8px;
    margin-bottom:12px;
  }
  .auto-mode-btn{
    border:none;
    background:#f0f1f6;
    color:var(--muted);
    font-weight:700;
    font-size: clamp(0.72em, 3vw, 0.78em);
    padding:11px 4px;
    border-radius:12px;
    cursor:pointer;
    white-space:nowrap;
    overflow:hidden;
  }
  .auto-mode-btn.active{
    background:#fff;
    color:var(--navy);
    box-shadow: 0 0 0 1.5px var(--navy) inset;
  }
  .btn-autoplay{
    border:none;
    border-radius:12px;
    padding:11px 6px;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size: clamp(0.72em, 3vw, 0.85em);
    cursor:pointer;
    background: var(--orange);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    white-space:nowrap;
    overflow:hidden;
    transition: transform .12s ease;
  }
  .btn-autoplay:active{ transform: scale(0.97); }
  .btn-autoplay.running{
    background:#c0392b;
  }

  /* ACTION BUTTONS */
  .actions{
    display:flex;
    gap:12px;
  }
  .btn{
    flex:1;
    border:none;
    border-radius: 16px;
    padding: 15px 10px;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size: clamp(0.85em, 3vw, 1em);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition: transform .12s ease, box-shadow .2s ease;
  }
  .btn:active{ transform: scale(0.97); }
  .btn:disabled{ opacity:0.45; cursor:not-allowed; transform:none; }
  .btn-primary{
    background: var(--navy);
    color:#fff;
    box-shadow: 0 8px 20px rgba(0,47,135,0.3);
  }
  .btn-secondary{
    background: var(--green);
    color:#fff;
    box-shadow: 0 8px 20px rgba(29,185,84,0.3);
  }

  footer{
    text-align:center;
    color:rgba(255,255,255,0.75);
    font-size:0.78em;
    margin-top:16px;
    padding-bottom: 8px;
  }

  @media (max-width:480px){
    .actions{ flex-direction:column; }
  }
</style>
</head>
<body>
  <div class="app">
    <div class="card">
      <button class="settings-toggle" id="settingsToggle" title="Cài đặt giọng đọc"><i class="fa-solid fa-gear"></i></button>
      <div class="brand"><span class="logo-dot"></span><h1>C&amp;B ENGLISH COACH</h1></div>
      <p class="subtitle">Luyện tiếng Anh HR - Payroll - C&amp;B mỗi ngày, đủ 5 Stage từ cơ bản đến phản xạ tự nhiên</p>

      <div class="settings-panel" id="settingsPanel">
        <div class="settings-row">
          <label>Giọng đọc tiếng Việt</label>
          <select id="voiceViSelect"></select>
        </div>
        <div class="settings-row">
          <label>Giọng đọc tiếng Anh</label>
          <select id="voiceEnSelect"></select>
        </div>
        <div class="settings-row">
          <label>Tốc độ đọc câu hỏi tiếng Việt</label>
          <div class="speed-options">
            <button class="speed-btn" data-speed="0.8">Chậm</button>
            <button class="speed-btn" data-speed="1">Vừa</button>
            <button class="speed-btn" data-speed="1.3">Nhanh</button>
          </div>
        </div>
        <div class="settings-row">
          <label>Tốc độ đọc tiếng Anh <span id="enSpeedValue" class="speed-value-label">1.0x</span></label>
          <input type="range" id="enSpeedSlider" class="speed-slider" min="0.6" max="1" step="0.05" value="1">
        </div>
      </div>

      <div class="mode-tabs">
        <button class="mode-tab active" id="modeFlashcardBtn"><i class="fa-solid fa-layer-group"></i> Luyện câu</button>
        <button class="mode-tab" id="modeListenBtn"><i class="fa-solid fa-headphones"></i> Đoạn nghe</button>
      </div>

      <div id="flashcardMode">
        <div class="topics-wrap">
          <span class="topics-label">Chọn Stage</span>
          <div class="topic-chips" id="stageChips"></div>
          <div class="stage-desc" id="stageDesc"></div>
        </div>

        <div class="topics-wrap">
          <span class="topics-label">Chọn chủ đề</span>
          <div class="topic-chips" id="topicChips">Đang tải dữ liệu...</div>
        </div>

        <div class="stage">
          <div class="question" id="question">Chưa có dữ liệu.</div>
          <button class="replay-btn" id="replayBtn" title="Tắt/bật tiếng"><i class="fa-solid fa-volume-high"></i></button>
          <div class="answer-block" id="answerBlock">
            <div class="answer" id="answer"></div>
            <div class="ipa" id="ipa"></div>
          </div>
        </div>

        <div class="empty-note" id="emptyNote"></div>

        <div class="progress-row">
          <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
          <div class="progress-text" id="progressText">0/0</div>
        </div>

        <div class="auto-row">
          <button class="auto-mode-btn active" id="autoModeReflexBtn" data-mode="reflex">Phản xạ</button>
          <button class="auto-mode-btn" id="autoModeReadBtn" data-mode="read">Đọc câu</button>
          <button class="btn-autoplay" id="autoPlayBtn"><i class="fa-solid fa-play"></i> Tự động chạy</button>
        </div>

        <div class="actions">
          <button class="btn btn-primary" id="showAnswerBtn" disabled><i class="fa-solid fa-eye"></i> Xem đáp án</button>
          <button class="btn btn-secondary" id="nextBtn" disabled><i class="fa-solid fa-shuffle"></i> Câu tiếp theo</button>
        </div>
      </div>

      <div id="listenMode" style="display:none;">
        <div class="topics-wrap">
          <span class="topics-label">Chọn chủ đề</span>
          <div class="topic-chips" id="listenTopicChips">Đang tải dữ liệu...</div>
        </div>

        <div class="listen-card" id="listenCard">
          <div class="listen-type-badge" id="listenTypeBadge">Hội thoại</div>
          <div class="listen-title" id="listenTitle">Chưa chọn chủ đề</div>

          <div class="listen-play-row">
            <button class="listen-play-btn" id="listenPlayEnBtn"><i class="fa-solid fa-play"></i> Nghe tiếng Anh</button>
            <button class="listen-play-btn secondary" id="listenPlayViBtn"><i class="fa-solid fa-language"></i> Nghe bản dịch</button>
          </div>

          <button class="transcript-toggle" id="transcriptToggleBtn"><i class="fa-solid fa-file-lines"></i> Hiện transcript &amp; bản dịch</button>
          <div class="transcript-box" id="transcriptBox"></div>

          <div class="quiz-wrap" id="quizWrap"></div>
        </div>
      </div>
    </div>
    <footer>C&amp;B English Coach &middot; Luyện tiếng Anh chuyên ngành HR/Payroll mỗi ngày</footer>
  </div>

<script>
  // ===================
  // DỮ LIỆU & TRẠNG THÁI

n", "topicOrder": 1, "stage": 4, "vi": "Chúng tôi không thể gửi hôm nay, nhưng sẽ gửi sáng mai.", "en": "We're not able to send it today, but we'll send it tomorrow morning.", "ipa": "/wɪr nɑɾ‿ˈeɪbəl tə sɛnd‿ɪt təˈdeɪ, bət wil sɛnd‿ɪt təˈmɑroʊ ˈmɔrnɪŋ/", "hl": ["We're not able to", "but we'll send it"]}, {"topicRaw": "1-Email & Written Communication", "topicName": "Email & Written Communication", "topicOrder": 1, "stage": 4, "vi": "Tóm lại, email sẽ được gửi sau khi giám đốc duyệt.", "en": "So, to recap, the email goes out after the director approves it.", "ipa": "/soʊ, tə ˈriˌkæp, ði ˈimeɪl ɡoʊz‿aʊɾ‿ˈæftɚ ðə dəˈrɛktɚ‿əˈpruvz‿ɪt/", "hl": ["to recap", "after the director approves"]}, {"topicRaw": "1-Email & Written Communication", "topicName": "Email & Written Communication", "topicOrder": 1, "stage": 4, "vi": "Bước tiếp theo: tôi chỉnh lại bản nháp và gửi bạn trước 3 giờ.", "en": "Next step: I'll revise the draft and send it by 3 PM.", "ipa": "/nɛkst stɛp: aɪl rɪˈvaɪz ðə dræft‿ən sɛnd‿ɪt baɪ θri ˌpiˈɛm/", "hl": ["Next step", "send it by 3 PM"]}, {"topicRaw": "1-Email & Written Communication", "topicName": "Email & Written Communication", "topicOrder": 1, "stage": 5, "vi": "Thật lòng, email dài ít ai đọc hết; ý chính phải nằm đầu tiên.", "en": "Honestly, long emails rarely get read fully; the key point must come first.", "ipa": "/ˈɑnəstli, lɔŋ‿iˈmeɪlz ˈrɛrli ɡɛt rɛd ˈfʊli; ðə ki pɔɪnt mʌst kʌm fɝst/", "hl": ["Honestly", "the key point must come first"]}, {"topicRaw": "1-Email & Written Communication", "topicName": "Email & Written Communication", "topicOrder": 1, "stage": 5, "vi": "Theo kinh nghiệm, tiêu đề rõ ràng được trả lời nhanh hơn lời chào lịch sự.", "en": "In my experience, a clear subject line gets faster replies than a polite opening.", "ipa": "/ɪn maɪ ɪkˈspɪriəns, ə klɪr səbˈdʒɛkt laɪn ɡɛts ˈfæstɚ rɪˈplaɪz ðæn‿ə pəˈlaɪt‿ˈoʊpənɪŋ/", "hl": ["In my experience", "clear subject line", "faster replies"]}, {"topicRaw": "1-Email & Written Communication", "topicName": "Email & Written Communication", "topicOrder": 1, "stage": 5, "vi": "Suy cho cùng, mỗi email phải nói rõ cần gì và trước khi nào.", "en": "Ultimately, every email should state clearly what we need and by when.", "ipa": "/ˈʌltəmətli, ˈɛvri iˈmeɪl ʃʊd steɪt ˈklɪrli wʌt wi nid‿ən baɪ wɛn/", "hl": ["Ultimately", "what we need and by when"]}, {"topicRaw": "1-Email & Written Communication", "topicName": "Email & Written Communication", "topicOrder": 1, "stage": 5, "vi": "Điều tôi lo là gửi nhầm thông tin lương vì bấm trả lời tất cả.", "en": "My main worry is sending salary information to the wrong people by using reply-all.", "ipa": "/maɪ meɪn ˈwɝi ɪz ˈsɛndɪŋ ˈsæləri ˌɪnfɚˈmeɪʃən tə ðə rɔŋ ˈpipəl baɪ ˈjuzɪŋ rɪˈplaɪ ɔl/", "hl": ["My main worry", "reply-all"]}, {"topicRaw": "1-Email & Written Communication", "topicName": "Email & Written Communication", "topicOrder": 1, "stage": 5, "vi": "Nếu không chốt lại bằng email, thỏa thuận miệng thường bị quên sau 1 tuần.", "en": "Without written follow-up, verbal agreements are usually forgotten within a week.", "ipa": "/wɪˈθaʊt ˈrɪɾən ˈfɑloʊ ʌp, ˈvɝbəl‿əˈɡrimənts‿ɚ ˈjuʒəwəli fɚˈɡɑɾən wɪˈðɪn‿ə wik/", "hl": ["Without written follow-up", "verbal agreements"]}, {"topicRaw": "1-Email & Written Communication", "topicName": "Email & Written Communication", "topicOrder": 1, "stage": 5, "vi": "Tôi ngại góp ý nhạy cảm qua email, vì giọng văn dễ bị hiểu sai.", "en": "I'm not comfortable with sending sensitive feedback by email, because tone is easily misunderstood.", "ipa": "/aɪm nɑt ˈkʌmftɚbəl wɪθ ˈsɛndɪŋ ˈsɛnsɪɾɪv ˈfidbæk baɪ ˈimeɪl, bɪˈkɔz toʊn‿ɪz‿ˈizəli ˌmɪsəndɚˈstʊd/", "hl": ["I'm not comfortable with", "tone is easily misunderstood"]}, {"topicRaw": "1-Email & Written Communication", "topicName": "Email & Written Communication", "topicOrder": 1, "stage": 5, "vi": "Điều tôi lo nhất là yêu cầu gấp bị chìm trong chuỗi email dài.", "en": "My biggest concern is that urgent requests get lost in long email threads.", "ipa": "/maɪ ˈbɪɡɪst kənˈsɝn‿ɪz ðæɾ‿ˈɝdʒənt rɪˈkwɛsts ɡɛt lɔst‿ɪn lɔŋ‿ˈimeɪl θrɛdz/", "hl": ["My biggest concern", "get lost in long email threads"]}, {"topicRaw": "1-Email & Written Communication", "topicName": "Email & Written Communication", "topicOrder": 1, "stage": 5, "vi": "Tôi đề xuất một mẫu email đơn giản cho thông báo HR để thông điệp nhất quán.", "en": "My recommendation is a simple template for HR announcements, so every message stays consistent.", "ipa": "/maɪ ˌrɛkəmɛnˈdeɪʃən‿ɪz‿ə ˈsɪmpəl ˈtɛmplət fɚ‿ˌeɪtʃˈɑr‿əˈnaʊnsmənts, soʊ ˈɛvri ˈmɛsɪdʒ steɪz kənˈsɪstənt/", "hl": ["My recommendation is", "every message stays consistent"]}, {"topicRaw": "1-Email & Written Communication", "topicName": "Email & Written Communication", "topicOrder": 1, "stage": 6, "vi": "Viết ngắn là tôn trọng thời gian người đọc.", "en": "Short writing respects the reader's time.", "ipa": "/ʃɔrt ˈraɪɾɪŋ rɪˈspɛkts ðə ˈridɚz taɪm/"}, {"topicRaw": "1-Email & Written Communication", "topicName": "Email & Written Communication", "topicOrder": 1, "stage": 6, "vi": "Viết như thể ai cũng có thể đọc được.", "en": "Write as if anyone could read it.", "ipa": "/raɪɾ‿əz‿ɪf‿ˈɛniˌwʌn kʊd rid‿ɪt/"}, {"topicRaw": "1-Email & Written Communication", "topicName": "Email & Written Communication", "topicOrder": 1, "stage": 6, "vi": "Mỗi tháng có hơn 300 câu hỏi về lương, nghĩa là chính sách chưa đủ rõ.", "en": "We receive over 300 payroll queries monthly, so our policies aren't clear enough.", "ipa": "/wi rəˈsiv‿ˈoʊvɚ θri ˈhʌndrəd ˈpeɪˌroʊl ˈkwɪriz ˈmʌnθli, soʊ aʊɚ ˈpɑləsiz‿ˈɑrənt klɪr‿ɪˈnʌf/", "hl": ["payroll queries", "policies aren't clear enough"]}, {"topicRaw": "1-Email & Written Communication", "topicName": "Email & Written Communication", "topicOrder": 1, "stage": 6, "vi": "Một email gửi nhầm lương có thể gây khiếu nại và vi phạm bảo vệ dữ liệu.", "en": "One misdirected salary email could trigger complaints and a data protection breach.", "ipa": "/wʌn mɪsdɪˈrɛktɪd ˈsælɚi iˈmeɪl kʊd ˈtrɪɡɚ kəmˈpleɪnts‿ən‿ə ˈdeɪɾə prəˈtɛkʃən britʃ/", "hl": ["misdirected salary email", "data protection breach"]}, {"topicRaw": "1-Email & Written Communication", "topicName": "Email & Written Communication", "topicOrder": 1, "stage": 6, "vi": "Giận thì đừng bấm gửi.", "en": "Never hit send when you're angry.", "ipa": "/ˈnɛvɚ hɪt sɛnd wɛn jʊr‿ˈæŋɡri/"}, {"topicRaw": "1-Email & Written Communication", "topicName": "Email & Written Communication", "topicOrder": 1, "stage": 6, "vi": "Cổng hỏi đáp HR thường giảm khoảng 40% email lặp lại ngay năm đầu.", "en": "An HR helpdesk portal typically cuts repetitive emails by about 40% in year one.", "ipa": "/ən‿eɪtʃ ɑr ˈhɛlpˌdɛsk ˈpɔrtəl ˈtɪpɪkli kʌts rɪˈpɛɾɪtɪv‿iˈmeɪlz baɪ əˈbaʊt ˈfɔrɾi pərˈsɛnt‿ɪn jɪr wʌn/", "hl": ["typically cuts", "repetitive emails"]}, {"topicRaw": "1-Email & Written Communication", "topicName": "Email & Written Communication", "topicOrder": 1, "stage": 6, "vi": "Tôi đề xuất 10 mẫu chuẩn, giúp mỗi nhân viên HR tiết kiệm 3 giờ mỗi tuần.", "en": "I propose ten standard templates; they should save each HR officer three hours weekly.", "ipa": "/aɪ prəˈpoʊz tɛn ˈstændɚd ˈtɛmpləts; ðeɪ ʃʊd seɪv‿itʃ‿eɪtʃ ɑr‿ˈɔfəsɚ θri ˈaʊɚz ˈwikli/", "hl": ["I propose", "save each HR officer"]}, {"topicRaw": "1-Email & Written Communication", "topicName": "Email & Written Communication", "topicOrder": 1, "stage": 6, "vi": "Mục tiêu năm tới: trả lời mọi câu hỏi về lương trong 24 giờ.", "en": "Our goal next year is to answer every payroll query within 24 hours.", "ipa": "/aʊɚ ɡoʊl nɛkst jɪr‿ɪz tə ˈænsɚ ˈɛvri ˈpeɪˌroʊl ˈkwiri wɪˈðɪn ˈtwɛni fɔr‿ˈaʊɚz/", "hl": ["Our goal next year is to", "within 24 hours"]}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 1, "vi": "Báo cáo tháng này cho thấy headcount tăng 12 người, chủ yếu ở kho.", "en": "This month's HR report shows headcount up by 12, mostly in the warehouse.", "ipa": "/ðɪs mʌnθs‿ˌeɪtʃˈɑr rɪˈpɔrt ʃoʊz ˈhɛdˌkaʊnt‿ʌp baɪ twɛlv, ˈmoʊstli ɪn ðə ˈwɛrˌhaʊs/", "hl": ["headcount up by 12", "mostly in the warehouse"]}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 1, "vi": "Tỷ lệ nghỉ việc quý này là 4,2%, thấp hơn mục tiêu.", "en": "Turnover this quarter came in at 4.2%, below our target.", "ipa": "/ˈtɝˌnoʊvɚ ðɪs ˈkwɔrtɚ keɪm‿ɪn‿ət fɔr pɔɪnt tu pɚˈsɛnt, bɪˈloʊ ˈaʊɚ ˈtɑrɡɪt/", "hl": ["Turnover this quarter", "below our target"]}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 1, "vi": "Bạn muốn tôi cập nhật hằng tuần hay chỉ khi có vấn đề phát sinh?", "en": "Would you prefer weekly updates, or only when issues come up?", "ipa": "/wʊd ju prəˈfɝ ˈwikli əpˈdeɪts, ɚ‿ˈoʊnli wɛn‿ˈɪʃuz kʌm‿ʌp/", "hl": ["Would you prefer", "only when issues come up"]}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 1, "vi": "Bạn cần số liệu ở mức toàn công ty hay chi tiết theo phòng ban?", "en": "Do you need these figures at company level or broken down by department?", "ipa": "/du ju nid ðiz ˈfɪɡjɚz‿ət ˈkʌmpəni ˈlɛvəl‿ɚ ˈbroʊkən daʊn baɪ dɪˈpɑrtmənt/", "hl": ["company level", "broken down by department"]}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 1, "vi": "Vui lòng cho tôi biết hạn của ban giám đốc để tôi lùi lịch chuẩn bị.", "en": "Please let me know the board's deadline so I can plan the report backwards.", "ipa": "/pliz lɛt mi noʊ ðə bɔrdz ˈdɛdˌlaɪn soʊ aɪ kən plæn ðə rɪˈpɔrt ˈbækwɚdz/", "hl": ["let me know the board's deadline", "plan the report backwards"]}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 1, "vi": "Vui lòng xem phần tóm tắt trước, chi tiết nằm ở phụ lục.", "en": "Please start with the executive summary; the details are in the appendix.", "ipa": "/pliz stɑrt wɪθ ði ɪɡˈzɛkjəɾɪv ˈsʌmɚi; ðə ˈditeɪlz‿ɚ‿ɪn ði əˈpɛndɪks/", "hl": ["executive summary", "details are in the appendix"]}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 1, "vi": "Xin lỗi, số headcount hôm qua chưa loại trừ người đã nghỉ việc.", "en": "Sorry, yesterday's headcount figure didn't exclude employees who had already resigned.", "ipa": "/ˈsɑri, ˈjɛstɚdeɪz ˈhɛdˌkaʊnt ˈfɪɡjɚ ˈdɪdənt‿ɪksˈklud‿ɪmˈplɔɪiz hu hæd‿ɔlˈrɛdi rɪˈzaɪnd/", "hl": ["didn't exclude", "already resigned"]}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 1, "vi": "Tôi sẽ sửa số liệu và gửi bạn bản cập nhật trước trưa mai.", "en": "I'll correct the figure and send you a revised version by noon tomorrow.", "ipa": "/aɪl kəˈrɛkt ðə ˈfɪɡjɚ‿ən sɛnd ju ə rɪˈvaɪzd ˈvɝʒən baɪ nun təˈmɑroʊ/", "hl": ["correct the figure", "revised version by noon"]}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 2, "vi": "Theo quy định, số liệu nhân sự gửi ban giám đốc phải được HR Manager duyệt.", "en": "By policy, any HR data going to the board needs the HR manager's sign-off.", "ipa": "/baɪ ˈpɑləsi, ˈɛni ˌeɪtʃˈɑr ˈdeɪɾə ˈɡoʊɪŋ tə ðə bɔrd nidz ði ˌeɪtʃˈɑr ˈmænɪdʒɚz ˈsaɪn‿ɔf/", "hl": ["By policy", "sign-off"]}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 2, "vi": "Báo cáo tháng chốt số liệu ngày 25, đối chiếu với lương rồi mới gửi bạn.", "en": "The monthly report is cut off on the 25th, reconciled with payroll, then sent.", "ipa": "/ðə ˈmʌnθli riˈpɔrt‿ɪz kʌt‿ɔf‿ɑn ðə ˈtwɛni fɪfθ, ˈrɛkənˌsaɪld wɪθ ˈpeɪˌroʊl, ðɛn sɛnt/", "hl": ["cut off on the 25th", "reconciled with payroll"]}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 2, "vi": "Bạn cho tôi biết tổng giám đốc quan tâm nhất chỉ số nào được không?", "en": "Could you tell me which metrics the general director cares about most?", "ipa": "/kʊd ju tɛl mi wɪtʃ ˈmɛtrɪks ðə ˈdʒɛnɚəl dəˈrɛktɚ kɛrz‿əˈbaʊt moʊst/", "hl": ["which metrics", "cares about most"]}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 2, "vi": "Bạn có phiền dành 15 phút để tôi trình bày trước khi gửi chính thức không?", "en": "Would you mind giving me 15 minutes to walk you through it first?", "ipa": "/wʊd ju maɪnd ˈɡɪvɪŋ mi fɪfˈtin ˈmɪnəts tə wɔk ju θru ɪt fɝst/", "hl": ["walk you through it first"]}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 2, "vi": "Chi phí nhân sự tăng 6% do lương tối thiểu vùng điều chỉnh từ tháng 1.", "en": "Labor costs rose 6% because of the regional minimum wage increase in January.", "ipa": "/ˈleɪbɚ kɔsts roʊz sɪks pɚˈsɛnt bɪˈkɔz‿əv ðə ˈridʒənəl ˈmɪnəməm weɪdʒ‿ˈɪnkris‿ɪn ˈdʒænjuˌɛri/", "hl": ["Labor costs rose 6%", "regional minimum wage increase"]}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 2, "vi": "Nếu bạn trình bày bằng tiếng Anh, tôi sẽ chuẩn bị thêm bản song ngữ.", "en": "If you plan to present this in English, I'll prepare a bilingual version.", "ipa": "/ɪf ju plæn tə ˈprɛzənt ðɪs‿ɪn‿ˈɪŋɡlɪʃ, aɪl priˈpɛr‿ə baɪˈlɪŋɡwəl ˈvɝʒən/", "hl": ["If you plan to present", "bilingual version"]}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 2, "vi": "Rất tiếc, kế hoạch tuyển dụng chậm 3 tuần vì hai ứng viên cuối từ chối offer.", "en": "Unfortunately, the hiring plan will slip three weeks because two finalists declined our offers.", "ipa": "/ʌnˈfɔrtʃənətli, ðə ˈhaɪɚɪŋ plæn wɪl slɪp θri wiks bɪˈkɔz tu ˈfaɪnəlɪsts dɪˈklaɪnd‿ˈaʊɚ‿ˈɔfɚz/", "hl": ["will slip three weeks", "finalists declined"]}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 2, "vi": "Tôi xác nhận đã nhận góp ý và sẽ gửi bản cuối trước thứ Năm.", "en": "I confirm I've received your comments and will send the final version by Thursday.", "ipa": "/aɪ kənˈfɝm‿aɪv rəˈsivd jɚ ˈkɑmɛnts‿ən wɪl sɛnd ðə ˈfaɪnəl ˈvɝʒən baɪ ˈθɝzˌdeɪ/", "hl": ["I confirm", "send the final version"]}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 3, "vi": "Để tôi tóm tắt 3 điểm chính trước khi đi vào chi tiết.", "en": "Let me summarize the three key points before going into the details.", "ipa": "/lɛt mi ˈsʌməˌraɪz ðə θri ki pɔɪnts bɪˈfɔr ˈɡoʊɪŋ‿ˈɪntu ðə ˈditeɪlz/", "hl": ["summarize the three key points", "going into the details"]}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 3, "vi": "Để tôi làm rõ: chi phí tăng do tuyển thêm, không phải tăng lương.", "en": "Let me clarify: the cost increase comes from new hires, not pay raises.", "ipa": "/lɛt mi ˈklɛrəˌfaɪ: ðə kɔst‿ˈɪnkris kʌmz frəm nu haɪɚz, nɑt peɪ ˈreɪzɪz/", "hl": ["Let me clarify", "new hires, not pay raises"]}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 3, "vi": "Theo số liệu quý này, tỷ lệ nghỉ việc đã giảm 3%.", "en": "Based on this quarter's data, turnover has dropped by three percent.", "ipa": "/beɪst‿ɑn ðɪs ˈkwɔrɾɚz ˈdeɪɾə, ˈtɝˌnoʊvɚ hæz drɑpt baɪ θri pɚˈsɛnt/", "hl": ["Based on this quarter's data", "turnover has dropped"]}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 3, "vi": "Tôi đề xuất báo cáo bằng dashboard thay vì file Excel.", "en": "I recommend switching from Excel files to a live dashboard for reporting.", "ipa": "/aɪ ˌrɛkəˈmɛnd ˈswɪtʃɪŋ frəm‿ɪkˈsɛl faɪlz tu ə lɪv ˈdæʃˌbɔrd fɚ rɪˈpɔrɾɪŋ/", "hl": ["I recommend switching from", "live dashboard"]}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 3, "vi": "Tôi đề nghị họp 1-1 mỗi 2 tuần để cập nhật nhanh hơn.", "en": "I'd suggest a one-on-one every two weeks so I can update you faster.", "ipa": "/aɪd səˈdʒɛst‿ə wʌn‿ɑn wʌn‿ˈɛvri tu wiks soʊ aɪ kən‿ʌpˈdeɪt ju ˈfæstɚ/", "hl": ["I'd suggest", "update you faster"]}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 3, "vi": "Theo tôi, chúng ta nên ưu tiên dự án lương trước.", "en": "In my view, we should prioritize the payroll project over the others.", "ipa": "/ɪn maɪ vju, wi ʃʊd praɪˈɔrəˌtaɪz ðə ˈpeɪroʊl ˈprɑdʒɛkt‿ˈoʊvɚ ði ˈʌðɚz/", "hl": ["In my view", "prioritize the payroll project"]}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 3, "vi": "Tôi hiểu ý bạn, nhưng làm cả 2 cùng lúc sẽ rủi ro.", "en": "I see your point, but running both projects at once is risky.", "ipa": "/aɪ si jɚ pɔɪnt, bət ˈrʌnɪŋ boʊθ ˈprɑdʒɛkts‿ət wʌns‿ɪz ˈrɪski/", "hl": ["I see your point, but", "is risky"]}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 3, "vi": "Có lẽ nên mời đội IT tham gia từ đầu dự án.", "en": "It might be worth involving IT from the very start of the project.", "ipa": "/ɪt maɪt bi wɝθ‿ɪnˈvɑlvɪŋ‿ɪt frəm ðə ˈvɛri stɑrɾ‿əv ðə ˈprɑdʒɛkt/", "hl": ["It might be worth involving", "from the very start"]}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 4, "vi": "Chúng ta chuyển sang ngân sách nhân sự, vì cần chốt trước cuối quý.", "en": "Let's move on to the HR budget, since it needs sign-off before quarter-end.", "ipa": "/lɛts muv‿ɑn tə ði ˌeɪtʃˈɑr ˈbʌdʒɪt, sɪns‿ɪt nidz saɪn‿ɔf bɪˈfɔr ˈkwɔrɾɚ‿ɛnd/", "hl": ["Let's move on to", "sign-off before quarter-end"]}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 4, "vi": "Bạn chia sẻ ưu tiên tuyển dụng quý sau nhé?", "en": "Can you take me through your priorities for next quarter's hiring plan?", "ipa": "/kæn ju teɪk mi θru jɚ praɪˈɔrəɾiz fɚ nɛkst ˈkwɔrɾɚz ˈhaɪɚɪŋ plæn/", "hl": ["take me through", "hiring plan"]}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 4, "vi": "Có một điều tôi lo: team sẽ quá tải nếu nhận thêm dự án.", "en": "One thing worries me: the team will be overloaded if we take this on.", "ipa": "/wʌn θɪŋ ˈwɝiz mi: ðə tim wɪl bi ˈoʊvɚˌloʊdɪd‿ɪf wi teɪk ðɪs‿ɑn/", "hl": ["One thing worries me", "overloaded"]}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 4, "vi": "Tôi hiểu bạn cần kết quả sớm, tuy nhiên làm vội sẽ ảnh hưởng chất lượng.", "en": "I understand you need results soon; however, rushing will affect the quality.", "ipa": "/aɪ ˌʌndɚˈstænd ju nid rɪˈzʌlts sun; haʊˈɛvɚ, ˈrʌʃɪŋ wɪl‿əˈfɛkt ðə ˈkwɑləɾi/", "hl": ["I understand you need results soon; however", "rushing will affect the quality"]}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 4, "vi": "Hay chúng ta làm giai đoạn 1 trước rồi cùng đánh giá kết quả?", "en": "How about if we deliver phase one first and then review the results together?", "ipa": "/haʊ əˈbaʊɾ‿ɪf wi dɪˈlɪvɚ feɪz wʌn fɝst‿ən ðɛn rɪˈvju ðə rɪˈzʌlts təˈɡɛðɚ/", "hl": ["How about if we", "review the results together"]}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 4, "vi": "Không thể xong hết trong tháng, nhưng có thể xong phần quan trọng nhất.", "en": "We can't finish everything this month, but we can complete the most critical part.", "ipa": "/wi kænt ˈfɪnɪʃ‿ˈɛvriˌθɪŋ ðɪs mʌnθ, bət wi kən kəmˈplit ðə moʊst ˈkrɪɾɪkəl pɑrt/", "hl": ["We can't finish everything", "but we can complete"]}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 4, "vi": "Tóm lại, tôi cần bạn duyệt ngân sách và 1 vị trí tuyển mới.", "en": "To summarize, I need your approval on the budget and one new headcount.", "ipa": "/tu ˈsʌməˌraɪz, aɪ nid jɚ‿əˈpruvəl‿ɑn ðə ˈbʌdʒɪɾ‿ən wʌn nu ˈhɛdkaʊnt/", "hl": ["To summarize", "your approval on the budget"]}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 4, "vi": "Bước tiếp theo: tôi gửi đề xuất chi tiết và bảng chi phí trước thứ Sáu.", "en": "As a next step, I'll send the detailed proposal and cost breakdown before Friday.", "ipa": "/əz‿ə nɛkst stɛp, aɪl sɛnd ðə dɪˈteɪld prəˈpoʊzəl‿ən kɑst ˈbreɪkˌdaʊn bɪˈfɔr ˈfraɪdi/", "hl": ["As a next step", "cost breakdown"]}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 5, "vi": "Thật lòng, tôi nghĩ kế hoạch hiện tại quá tham vọng so với nguồn lực.", "en": "Honestly, I think the current plan is too ambitious for the resources we have.", "ipa": "/ˈɑnəstli, aɪ θɪŋk ðə ˈkɝənt plæn‿ɪz tu æmˈbɪʃəs fɚ ðə ˈrisɔrsɪz wi hæv/", "hl": ["Honestly", "too ambitious for the resources"]}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 5, "vi": "Theo kinh nghiệm, sếp nước ngoài muốn nghe kết luận trước, chi tiết sau.", "en": "In my experience, foreign managers want the conclusion first and the details later.", "ipa": "/ɪn maɪ ɪkˈspɪriəns, ˈfɔrən ˈmænɪdʒɚz wɑnt ðə kənˈkluʒən fɝst‿ən ðə ˈditeɪlz ˈleɪɾɚ/", "hl": ["In my experience", "conclusion first"]}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 5, "vi": "Điều quan trọng là nếu thiếu 1 người, dự án sẽ trễ 1 tháng.", "en": "What really matters is that without one more person, the project slips a month.", "ipa": "/wʌt ˈrɪli ˈmæɾɚz‿ɪz ðət wɪˈθaʊt wʌn mɔr ˈpɝsən, ðə ˈprɑdʒɛkt slɪps‿ə mʌnθ/", "hl": ["What really matters is that", "slips a month"]}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 5, "vi": "Rủi ro lớn nhất là trễ hạn khai bảo hiểm và bị phạt.", "en": "The main risk is missing the insurance filing deadline and being fined for it.", "ipa": "/ðə meɪn rɪsk‿ɪz ˈmɪsɪŋ ði ɪnˈʃʊrəns ˈfaɪlɪŋ ˈdɛdˌlaɪn‿ən ˈbiɪŋ faɪnd fɚ‿ɪt/", "hl": ["The main risk is", "being fined for it"]}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 5, "vi": "Chưa quyết trong tuần này, ta có thể mất ứng viên giỏi nhất cho đối thủ.", "en": "Unless we decide this week, we'll probably lose our strongest candidate to a competitor.", "ipa": "/ənˈlɛs wi dɪˈsaɪd ðɪs wik, wil ˈprɑbəbli luz‿ˈaʊɚ ˈstrɔŋɡəst ˈkændɪdət tu ə kəmˈpɛɾɪɾɚ/", "hl": ["Unless we decide this week", "lose our strongest candidate"]}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 5, "vi": "Tôi phản bác cắt ngân sách đào tạo, vì nó làm yếu năng lực dài hạn.", "en": "I'd challenge cutting the training budget, because it weakens our long-term capability.", "ipa": "/aɪd ˈtʃælɪndʒ ˈkʌɾɪŋ ðə ˈtreɪnɪŋ ˈbʌdʒɪt, bɪˈkɔz‿ɪt ˈwikənz‿ˈaʊɚ lɔŋ tɝm ˌkeɪpəˈbɪləɾi/", "hl": ["I'd challenge cutting", "long-term capability"]}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 5, "vi": "Điều tôi lo nhất là chúng ta báo cáo số liệu chưa ai kiểm tra lại.", "en": "What concerns me most is that we're reporting numbers that nobody has double-checked.", "ipa": "/wʌt kənˈsɝnz mi moʊst‿ɪz ðæt wɪr rɪˈpɔrɾɪŋ ˈnʌmbɚz ðæt ˈnoʊbɑdi hæz ˈdʌbəl tʃɛkt/", "hl": ["What concerns me most", "double-checked"]}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 5, "vi": "Tôi đề xuất dùng một mẫu báo cáo chung cho mọi phòng ban từ tháng sau.", "en": "What I'd propose is one reporting template for all departments from next month.", "ipa": "/wʌt‿aɪd prəˈpoʊz‿ɪz wʌn riˈpɔrtɪŋ ˈtɛmplət fɚ ɔl dɪˈpɑrtmənts frəm nɛkst mʌnθ/", "hl": ["What I'd propose is", "one reporting template"]}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 6, "vi": "Không có tin chưa chắc đã là tin tốt.", "en": "No news isn't always good news.", "ipa": "/noʊ nuz‿ˈɪzənt‿ˈɔlˌweɪz ɡʊd nuz/"}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 6, "vi": "Sếp không thích bất ngờ, kể cả tin tốt.", "en": "Managers don't like surprises, even good ones.", "ipa": "/ˈmænɪdʒɚz doʊnt laɪk sɚˈpraɪzɪz, ˈivən ɡʊd wʌnz/"}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 6, "vi": "Chi phí lương tăng 8%, doanh thu chỉ tăng 3%, nên doanh thu mỗi người đang giảm.", "en": "Payroll costs grew 8% while revenue grew 3%, so revenue per employee is falling.", "ipa": "/ˈpeɪˌroʊl kɑsts ɡru eɪt pərˈsɛnt waɪl ˈrɛvəˌnu ɡru θri pərˈsɛnt, soʊ ˈrɛvəˌnu pɝ ɛmˈplɔɪi ɪz ˈfɑlɪŋ/", "hl": ["revenue per employee is falling"]}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 6, "vi": "Nếu xu hướng này kéo dài thêm 2 quý, chi phí nhân sự sẽ vượt 40% doanh thu.", "en": "If this trend continues two more quarters, labor costs will exceed 40% of revenue.", "ipa": "/ɪf ðɪs trɛnd kənˈtɪnjuz tu mɔr ˈkwɔrtɚz, ˈleɪbɚ kɑsts wɪl‿ɪkˈsid ˈfɔrɾi pərˈsɛnt‿əv ˈrɛvəˌnu/", "hl": ["If this trend continues", "exceed 40% of revenue"]}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 6, "vi": "Đưa ra giải pháp, đừng chỉ đưa ra vấn đề.", "en": "Bring solutions, not just problems.", "ipa": "/brɪŋ səˈluʃənz, nɑt dʒʌst ˈprɑbləmz/"}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 6, "vi": "So với ngành, tỷ lệ chi phí nhân sự của ta cao hơn khoảng 5 điểm phần trăm.", "en": "Compared with industry peers, our labor cost ratio is about five percentage points higher.", "ipa": "/kəmˈpɛrd wɪθ‿ˈɪndəstri pɪrz, ˈaʊɚ ˈleɪbɚ kɔst ˈreɪʃiˌoʊ ɪz‿əˈbaʊt faɪv pɚˈsɛntədʒ pɔɪnts ˈhaɪɚ/", "hl": ["Compared with industry peers", "percentage points higher"]}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 6, "vi": "Tôi đề xuất tạm dừng tuyển vị trí không thiết yếu 6 tháng, tiết kiệm khoảng 2 tỷ.", "en": "I recommend freezing non-essential hiring for six months; that saves roughly 2 billion VND.", "ipa": "/aɪ ˌrɛkəˈmɛnd ˈfrizɪŋ nɑn ɛˈsɛnʃəl ˈhaɪrɪŋ fɚ sɪks mʌnθs; ðət seɪvz ˈrʌfli tu ˈbɪljən vi ɛn di/", "hl": ["I recommend freezing", "non-essential hiring"]}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 6, "vi": "Mục tiêu: đưa chi phí nhân sự xuống dưới 35% doanh thu vào cuối năm sau.", "en": "Our target is to bring labor costs below 35% of revenue by next year-end.", "ipa": "/aʊɚ ˈtɑrɡət‿ɪz tə brɪŋ ˈleɪbɚ kɑsts bɪˈloʊ ˈθɝɾi faɪv pərˈsɛnt‿əv ˈrɛvəˌnu baɪ nɛkst jɪr ɛnd/", "hl": ["Our target is to", "below 35% of revenue"]}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 1, "vi": "Hạn chốt dữ liệu lương tháng này dời lên ngày 18 vì nghỉ lễ.", "en": "This month's payroll cut-off moves up to the 18th because of the holiday.", "ipa": "/ðɪs mʌnθs ˈpeɪroʊl kʌɾ‿ɔf muvz‿ʌp tə ði eɪˈtinθ bɪˈkɔz‿əv ðə ˈhɑlədeɪ/", "hl": ["payroll cut-off moves up", "because of the holiday"]}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 1, "vi": "Báo cáo sử dụng lao động 6 tháng đầu năm phải nộp trước ngày 5/6.", "en": "The half-year labor usage report must be filed by June 5th.", "ipa": "/ðə hæf jɪr ˈleɪbɚ ˈjusədʒ rɪˈpɔrt mʌst bi faɪld baɪ dʒun fɪfθ/", "hl": ["must be filed by"]}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 1, "vi": "Đây là hạn cứng hay vẫn có thể linh hoạt?", "en": "Is this a hard deadline, or is there any flexibility?", "ipa": "/ɪz ðɪs‿ə hɑrd ˈdɛdˌlaɪn, ɚ‿ɪz ðɛr‿ˈɛni ˌflɛksəˈbɪləɾi/", "hl": ["hard deadline", "any flexibility"]}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 1, "vi": "Bạn cần bản nháp để góp ý trước, hay chỉ cần bản cuối?", "en": "Do you need a draft for comments first, or just the final version?", "ipa": "/du ju nid‿ə dræft fɚ ˈkɑmɛnts fɝst, ɚ dʒʌst ðə ˈfaɪnəl ˈvɝʒən/", "hl": ["draft for comments", "final version"]}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 1, "vi": "Vui lòng nộp bảng công đã duyệt chậm nhất là 12h trưa thứ Năm.", "en": "Please submit approved timesheets by noon Thursday at the latest.", "ipa": "/pliz səbˈmɪɾ‿əˈpruvd ˈtaɪmˌʃits baɪ nun ˈθɝzdeɪ ət ðə ˈleɪɾɪst/", "hl": ["approved timesheets", "at the latest"]}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 1, "vi": "Vui lòng báo sớm nếu có nguy cơ trễ hạn, đừng đợi đến phút cuối.", "en": "Please flag any risk of delay early instead of waiting until the last minute.", "ipa": "/pliz flæɡ‿ˈɛni rɪsk‿əv dɪˈleɪ ˈɝli ɪnˈstɛd‿əv ˈweɪɾɪŋ‿ənˈtɪl ðə læst ˈmɪnət/", "hl": ["flag any risk of delay early", "last minute"]}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 1, "vi": "Xin lỗi, chúng tôi đã nộp hồ sơ bảo hiểm trễ hạn 2 ngày.", "en": "Sorry, we missed the insurance filing deadline by two days.", "ipa": "/ˈsɑri, wi mɪst ði ɪnˈʃʊrəns ˈfaɪlɪŋ ˈdɛdˌlaɪn baɪ tu deɪz/", "hl": ["missed the insurance filing deadline"]}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 1, "vi": "Xác nhận: hạn cuối là 5h chiều thứ Sáu, sau đó không chỉnh sửa.", "en": "To confirm, the deadline is 5 PM Friday; no changes after that.", "ipa": "/tə kənˈfɝm, ðə ˈdɛdˌlaɪn‿ɪz faɪv pi ɛm ˈfraɪdeɪ; noʊ ˈtʃeɪndʒɪz‿ˈæftɚ ðæt/", "hl": ["To confirm", "no changes after that"]}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 2, "vi": "Theo luật, nếu trả lương chậm quá 15 ngày thì phải trả thêm tiền lãi.", "en": "By law, if salary is paid over 15 days late, interest must be added.", "ipa": "/baɪ lɔ, ɪf ˈsælɚi ɪz peɪd‿ˈoʊvɚ fɪfˈtin deɪz leɪt, ˈɪntrəst mʌst bi ˈædəd/", "hl": ["By law", "interest must be added"]}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 2, "vi": "Chốt công ngày 20, tính lương trước ngày 22, duyệt trước ngày 23.", "en": "Attendance cut-off on the 20th, calculation by the 22nd, approval by the 23rd.", "ipa": "/əˈtɛndəns kʌt ɔf‿ɑn ðə ˈtwɛniəθ, ˌkælkjəˈleɪʃən baɪ ðə ˈtwɛni ˈsɛkənd, əˈpruvəl baɪ ðə ˈtwɛni θɝd/", "hl": ["Attendance cut-off", "approval by the 23rd"]}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 2, "vi": "Bạn gửi trước phần dữ liệu đã có để tôi làm song song được không?", "en": "Could you send whatever data you have now so I can start in parallel?", "ipa": "/kʊd ju sɛnd ˌwʌˈtɛvɚ ˈdeɪɾə ju həv naʊ soʊ aɪ kən stɑrt‿ɪn ˈpɛrəˌlɛl/", "hl": ["send whatever data you have", "in parallel"]}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 2, "vi": "Bạn có phiền ưu tiên việc này trước báo cáo tuần không?", "en": "Would you mind prioritizing this over the weekly report for now?", "ipa": "/wʊd ju maɪnd praɪˈɔrəˌtaɪzɪŋ ðɪs‿ˈoʊvɚ ðə ˈwikli rɪˈpɔrt fɚ naʊ/", "hl": ["prioritizing this over"]}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 2, "vi": "Tôi xin lùi hạn 2 ngày vì dữ liệu chi nhánh Đà Nẵng chưa về.", "en": "I'm asking for a two-day extension because the Da Nang branch data hasn't arrived.", "ipa": "/aɪm‿ˈæskɪŋ fɚ‿ə ˈtuˌdeɪ ɪkˈstɛnʃən bɪˈkɔz ðə dɑ nɑŋ bræntʃ ˈdeɪɾə ˈhæzənt‿əˈraɪvd/", "hl": ["asking for a two-day extension", "hasn't arrived"]}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 2, "vi": "Nếu dữ liệu đến sau ngày 20, thay đổi sẽ vào kỳ lương sau.", "en": "If data arrives after the 20th, changes go into the next payroll cycle.", "ipa": "/ɪf ˈdeɪɾə ɚˈaɪvz‿ˈæftɚ ðə ˈtwɛniəθ, ˈtʃeɪndʒəz ɡoʊ ˈɪntu ðə nɛkst ˈpeɪˌroʊl ˈsaɪkəl/", "hl": ["If data arrives after the 20th", "next payroll cycle"]}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 2, "vi": "Rất tiếc, ta không thể dời ngày nộp tờ khai thuế vì đây là hạn luật định.", "en": "Unfortunately, we can't move the tax filing date, since it's a statutory deadline.", "ipa": "/ʌnˈfɔrtʃənətli, wi kænt muv ðə tæks ˈfaɪlɪŋ deɪt, sɪns‿ɪts‿ə ˈstætʃəˌtɔri ˈdɛdˌlaɪn/", "hl": ["Unfortunately", "statutory deadline"]}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 2, "vi": "Tôi sẽ nhắc từng trưởng phòng trước 2 ngày và báo bạn ai còn thiếu.", "en": "I'll remind each department head two days ahead and update you on who's pending.", "ipa": "/aɪl riˈmaɪnd‿itʃ dɪˈpɑrtmənt hɛd tu deɪz‿əˈhɛd‿ən‿əpˈdeɪt ju ɑn huz ˈpɛndɪŋ/", "hl": ["remind each department head", "who's pending"]}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 3, "vi": "Để tôi giải thích vì sao hạn này không thể đổi, dù chỉ một ngày.", "en": "Let me explain why this deadline can't change, even for one day.", "ipa": "/lɛt mi ɪkˈspleɪn waɪ ðɪs ˈdɛdˌlaɪn kænt tʃeɪndʒ, ˈivən fɚ wʌn deɪ/", "hl": ["Let me explain why", "can't change"]}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 3, "vi": "Để tôi làm rõ: hạn chót là 5 giờ chiều, không phải cuối ngày.", "en": "Let me clarify: the deadline is 5 PM, not end of day.", "ipa": "/lɛt mi ˈklɛrəˌfaɪ: ðə ˈdɛdˌlaɪn‿ɪz faɪv ˌpiˈɛm, nɑɾ‿ɛnd‿əv deɪ/", "hl": ["Let me clarify", "not end of day"]}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 3, "vi": "Theo kế hoạch, chúng ta đang chậm 2 ngày so với tiến độ.", "en": "Based on the project plan, we're currently two days behind schedule.", "ipa": "/beɪst‿ɑn ðə ˈprɑdʒɛkt plæn, wɪr ˈkɝəntli tu deɪz bɪˈhaɪnd ˈskɛdʒul/", "hl": ["Based on the project plan", "behind schedule"]}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 3, "vi": "Tôi đề xuất đặt hạn nội bộ sớm hơn hạn chính thức 3 ngày.", "en": "I recommend setting internal deadlines three days before the official ones.", "ipa": "/aɪ ˌrɛkəˈmɛnd ˈsɛɾɪŋ‿ɪnˈtɝnəl ˈdɛdˌlaɪnz θri deɪz bɪˈfɔr ði əˈfɪʃəl wʌnz/", "hl": ["I recommend setting internal deadlines", "before the official ones"]}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 3, "vi": "Tôi đề nghị dùng lịch chung để cả team theo dõi hạn chót.", "en": "I'd suggest a shared calendar so the whole team can track deadlines.", "ipa": "/aɪd səˈdʒɛst‿ə ʃɛrd ˈkæləndɚ soʊ ðə hoʊl tim kən træk ˈdɛdˌlaɪnz/", "hl": ["I'd suggest", "shared calendar", "track deadlines"]}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 3, "vi": "Theo tôi, team cần thêm người trong mùa cao điểm.", "en": "In my view, the team needs extra help during peak season.", "ipa": "/ɪn maɪ vju, ðə tim nidz‿ˈɛkstrə hɛlp ˈdʊrɪŋ pik ˈsizən/", "hl": ["In my view", "extra help during peak season"]}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 3, "vi": "Tôi hiểu ý bạn, nhưng hạn này do pháp luật quy định.", "en": "I see your point, but this deadline is set by law.", "ipa": "/aɪ si jɚ pɔɪnt, bət ðɪs ˈdɛdˌlaɪn‿ɪz sɛt baɪ lɔ/", "hl": ["I see your point, but", "set by law"]}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 3, "vi": "Có lẽ nên ưu tiên việc có hạn pháp lý trước, rồi đến hạn nội bộ.", "en": "It might be worth handling the legal deadlines first, then internal ones.", "ipa": "/ɪt maɪt bi wɝθ ˈhændlɪŋ ðə ˈliɡəl ˈdɛdˌlaɪnz fɝst, ðɛn‿ɪnˈtɝnəl wʌnz/", "hl": ["It might be worth handling", "legal deadlines first"]}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 4, "vi": "Chúng ta chuyển sang tiến độ hạn chót, vì có 2 việc đang trễ.", "en": "Let's turn to deadline status, since two tasks are already behind.", "ipa": "/lɛts tɝn tə ˈdɛdˌlaɪn ˈstæɾəs, sɪns tu tæsks‿ɚ‿ɔlˈrɛdi bɪˈhaɪnd/", "hl": ["Let's turn to", "already behind"]}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 4, "vi": "Bạn trình bày tiến độ hiện tại và việc nào đang có rủi ro nhé?", "en": "Would you mind going over the current timeline and which tasks are at risk?", "ipa": "/wʊd ju maɪnd ˈɡoʊɪŋ‿ˈoʊvɚ ðə ˈkɝənt ˈtaɪmlaɪn‿ən wɪtʃ tæsks‿ɚ‿ət rɪsk/", "hl": ["going over the current timeline", "at risk"]}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 4, "vi": "Tôi muốn nêu lo ngại: chúng ta có thể không kịp hạn chốt lương tuần này.", "en": "I'd like to raise a concern: we may miss this week's payroll cutoff.", "ipa": "/aɪd laɪk tə reɪz‿ə kənˈsɝn: wi meɪ mɪs ðɪs wiks ˈpeɪroʊl ˈkʌtɔf/", "hl": ["I'd like to raise a concern", "miss this week's payroll cutoff"]}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 4, "vi": "Tôi hiểu team đang quá tải, nhưng hạn này không thể dời.", "en": "I get that the team is overloaded; however, this deadline can't move.", "ipa": "/aɪ ɡɛt ðæt ðə tim‿ɪz‿ˈoʊvɚˌloʊdɪd; haʊˈɛvɚ, ðɪs ˈdɛdˌlaɪn kænt muv/", "hl": ["I get that", "however", "can't move"]}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 4, "vi": "Hay chúng ta chia việc cho 2 người để kịp thứ Sáu?", "en": "Would it help if we split the work between two people for Friday?", "ipa": "/wʊd‿ɪt hɛlp‿ɪf wi splɪt ðə wɝk bɪˈtwin tu ˈpipəl fɚ ˈfraɪdi/", "hl": ["Would it help if we split the work"]}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 4, "vi": "Chúng tôi không thể lùi cả dự án, nhưng có thể lùi phần báo cáo.", "en": "We can't delay the whole project, but we can delay the report.", "ipa": "/wi kænt dɪˈleɪ ðə hoʊl ˈprɑdʒɛkt, bət wi kən dɪˈleɪ ðə rɪˈpɔrt/", "hl": ["We can't delay", "but we can delay"]}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 4, "vi": "Tóm lại, hạn mới là thứ Hai và mỗi việc có người phụ trách rõ.", "en": "To wrap up, the new deadline is Monday, and every task has an owner.", "ipa": "/tə ræp‿ʌp, ðə nu ˈdɛdˌlaɪn‿ɪz ˈmʌndi, ən‿ˈɛvri tæsk həz‿ən‿ˈoʊnɚ/", "hl": ["To wrap up", "every task has an owner"]}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 4, "vi": "Bước tiếp theo: mọi người cập nhật tiến độ vào file chung trước 4h chiều mỗi ngày.", "en": "Next step: everyone updates their progress in the shared file by 4 PM daily.", "ipa": "/nɛkst stɛp: ˈɛvriˌwʌn‿ˈʌpˌdeɪts ðɛr ˈprɑɡrɛs‿ɪn ðə ʃɛrd faɪl baɪ fɔr ˌpiˈɛm ˈdeɪli/", "hl": ["Next step", "shared file", "by 4 PM daily"]}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 5, "vi": "Thật lòng, phần lớn trễ hạn do đầu vào trễ, không phải HR làm chậm.", "en": "To be frank, most missed deadlines come from late inputs, not slow HR work.", "ipa": "/tə bi fræŋk, moʊst mɪst ˈdɛdˌlaɪnz kʌm frəm leɪt‿ˈɪnˌpʊts, nɑt sloʊ eɪtʃ ɑr wɝk/", "hl": ["To be frank", "late inputs"]}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 5, "vi": "Theo kinh nghiệm, đặt hạn nội bộ sớm 3 ngày tránh được phần lớn sự cố phút chót.", "en": "What I've seen is that internal deadlines three days early prevent most last-minute problems.", "ipa": "/wʌɾ‿aɪv sin‿ɪz ðæɾ‿ɪnˈtɝnəl ˈdɛdˌlaɪnz θri deɪz‿ˈɝli prɪˈvɛnt moʊst læst ˈmɪnət ˈprɑbləmz/", "hl": ["What I've seen is that", "prevent most last-minute problems"]}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 5, "vi": "Mấu chốt là hạn chót không có người chịu trách nhiệm chỉ là mong muốn.", "en": "The bottom line: a deadline without a named owner is just a wish.", "ipa": "/ðə ˈbɑɾəm laɪn: ə ˈdɛdˌlaɪn wɪˈθaʊt‿ə neɪmd‿ˈoʊnɚ ɪz dʒʌst‿ə wɪʃ/", "hl": ["The bottom line", "named owner", "just a wish"]}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 5, "vi": "Rủi ro lớn nhất là trễ hạn pháp lý; cơ quan nhà nước không nhận lý do.", "en": "The biggest risk is missing a legal deadline; authorities don't accept excuses.", "ipa": "/ðə ˈbɪɡəst rɪsk‿ɪz ˈmɪsɪŋ‿ə ˈliɡəl ˈdɛdˌlaɪn; əˈθɔrətiz doʊnt‿ækˈsɛpt‿ɪksˈkjusɪz/", "hl": ["The biggest risk", "legal deadline", "accept excuses"]}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 5, "vi": "Nếu không báo trễ sớm, vấn đề sẽ dồn lên quản lý vào phút chót.", "en": "If we don't flag delays early, the problem lands on the manager last-minute.", "ipa": "/ɪf wi doʊnt flæɡ dɪˈleɪz‿ˈɝli, ðə ˈprɑbləm lændz‿ɑn ðə ˈmænədʒɚ læst ˈmɪnət/", "hl": ["If we don't flag delays early", "last-minute"]}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 5, "vi": "Tôi phản đối nhận mọi việc gấp, vì nó làm chậm việc thật sự quan trọng.", "en": "I'd push back on accepting every urgent request; it delays the work that matters.", "ipa": "/aɪd pʊʃ bæk‿ɑn‿ækˈsɛptɪŋ‿ˈɛvri ˈɝdʒənt rɪˈkwɛst; ɪt dɪˈleɪz ðə wɝk ðət ˈmæɾɚz/", "hl": ["I'd push back on", "urgent request"]}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 5, "vi": "Tôi lo cả nhóm phải làm khuya mỗi cuối tháng chỉ để kịp hạn.", "en": "What worries me is the team working late every month-end just to meet deadlines.", "ipa": "/wʌt ˈwɝiz mi ɪz ðə tim ˈwɝkɪŋ leɪt‿ˈɛvri mʌnθ ɛnd dʒʌst tə mit ˈdɛdˌlaɪnz/", "hl": ["What worries me", "working late every month-end"]}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 5, "vi": "Tôi đề xuất lịch hạn chung, có người phụ trách rõ và nhắc việc tự động.", "en": "My suggestion is a shared deadline calendar with clear owners and automatic reminders.", "ipa": "/maɪ səɡˈdʒɛstʃən‿ɪz‿ə ʃɛrd ˈdɛdˌlaɪn ˈkæləndɚ wɪθ klɪr‿ˈoʊnɚz‿ən‿ˌɔɾəˈmæɾɪk rɪˈmaɪndɚz/", "hl": ["My suggestion is", "clear owners", "automatic reminders"]}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 6, "vi": "Đừng để việc hôm nay sang ngày mai.", "en": "Never put off till tomorrow what you can do today.", "ipa": "/ˈnɛvɚ pʊɾ‿ɔf tɪl təˈmɑroʊ wʌt ju kən du təˈdeɪ/"}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 6, "vi": "Hạn chót tạo ra sự tập trung.", "en": "Deadlines create focus.", "ipa": "/ˈdɛdˌlaɪnz kriˈeɪt ˈfoʊkəs/"}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 6, "vi": "30% bảng công đến trễ, dồn việc tính lương vào 48 giờ cuối.", "en": "30% of timesheets arrived late, squeezing payroll into the final 48 hours.", "ipa": "/ˈθɝɾi pərˈsɛnt‿əv ˈtaɪmˌʃits‿ɚˈaɪvd leɪt, ˈskwizɪŋ ˈpeɪˌroʊl‿ˈɪntu ðə ˈfaɪnəl ˈfɔrɾi eɪt‿ˈaʊɚz/", "hl": ["arrived late", "squeezing payroll"]}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 6, "vi": "Nếu không thay đổi, một kỳ lương trễ có thể kéo theo tiền lãi và khiếu nại tập thể.", "en": "If nothing changes, a single late payroll could trigger interest payments and collective complaints.", "ipa": "/ɪf ˈnʌθɪŋ ˈtʃeɪndʒɪz, ə ˈsɪŋɡəl leɪt ˈpeɪroʊl kʊd ˈtrɪɡɚ‿ˈɪntrəst ˈpeɪmənts‿ən kəˈlɛktɪv kəmˈpleɪnts/", "hl": ["If nothing changes", "interest payments", "collective complaints"]}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 6, "vi": "Hứa ít, làm nhiều.", "en": "Under-promise, over-deliver.", "ipa": "/ˈʌndɚ ˈprɑmɪs, ˈoʊvɚ dɪˈlɪvɚ/"}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 6, "vi": "Công ty làm tốt chốt công ít nhất 5 ngày làm việc trước ngày trả lương.", "en": "Best-practice companies close attendance at least five working days before payday.", "ipa": "/bɛst ˈpræktɪs ˈkʌmpəniz kloʊs‿əˈtɛndəns‿ət list faɪv ˈwɝkɪŋ deɪz bɪˈfɔr ˈpeɪˌdeɪ/", "hl": ["Best-practice companies", "close attendance"]}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 6, "vi": "Tôi đề xuất chốt công sớm hơn kèm nhắc hạn tự động; có thể giảm 80% lần chạy lại.", "en": "I propose an earlier cut-off with automatic reminders; that should cut reruns by 80%.", "ipa": "/aɪ prəˈpoʊz‿ən‿ˈɝliɚ kʌt ɔf wɪθ‿ˌɔɾəˈmæɾɪk riˈmaɪndɚz; ðət ʃʊd kʌt ˈriˈrʌnz baɪ ˈeɪɾi pərˈsɛnt/", "hl": ["I propose", "earlier cut-off", "cut reruns by 80%"]}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 6, "vi": "Mục tiêu: 12 kỳ lương liên tiếp đúng hạn, không có kỳ điều chỉnh bổ sung.", "en": "The goal is twelve consecutive on-time payrolls with zero off-cycle corrections.", "ipa": "/ðə ɡoʊl‿ɪz twɛlv kənˈsɛkjəɾɪv‿ɑn taɪm ˈpeɪˌroʊlz wɪθ ˈzɪroʊ ˈɔf ˌsaɪkəl kəˈrɛkʃənz/", "hl": ["The goal is", "on-time payrolls", "zero off-cycle corrections"]}, {"topicRaw": "4-Errors & Problem Solving", "topicName": "Errors & Problem Solving", "topicOrder": 4, "stage": 1, "vi": "Lỗi phát sinh do công thức phụ cấp chưa cập nhật mức mới.", "en": "The error came from an allowance formula that wasn't updated to the new rate.", "ipa": "/ði ˈɛrɚ keɪm frəm‿ən‿əˈlaʊəns ˈfɔrmjələ ðæt ˈwʌzənt‿ʌpˈdeɪɾɪd tə ðə nu reɪt/", "hl": ["allowance formula", "wasn't updated to the new rate"]}, {"topicRaw": "4-Errors & Problem Solving", "topicName": "Errors & Problem Solving", "topicOrder": 4, "stage": 1, "vi": "Có 12 phiếu lương bị ảnh hưởng, tổng chênh lệch khoảng 18 triệu đồng.", "en": "Twelve payslips were affected, with a total variance of about 18 million VND.", "ipa": "/twɛlv ˈpeɪˌslɪps wɚ‿əˈfɛktɪd, wɪθ‿ə ˈtoʊɾəl ˈvɛriəns‿əv‿əˈbaʊɾ‿eɪˈtin ˈmɪljən ˌviɛnˈdi/", "hl": ["payslips were affected", "total variance"]}, {"topicRaw": "4-Errors & Problem Solving", "topicName": "Errors & Problem Solving", "topicOrder": 4, "stage": 1, "vi": "Lỗi này chỉ xảy ra kỳ này hay đã lặp lại từ các tháng trước?", "en": "Is this a one-off, or has it been happening in previous months too?", "ipa": "/ɪz ðɪs‿ə ˌwʌnˈɔf, ɚ hæz‿ɪt bɪn ˈhæpənɪŋ‿ɪn ˈpriviəs mʌnθs tu/", "hl": ["one-off", "previous months"]}, {"topicRaw": "4-Errors & Problem Solving", "topicName": "Errors & Problem Solving", "topicOrder": 4, "stage": 1, "vi": "Bạn đã tìm ra nguyên nhân gốc, hay mới xử lý phần ngọn?", "en": "Have you identified the root cause, or just fixed the symptom?", "ipa": "/hæv ju aɪˈdɛntəˌfaɪd ðə rut kɔz, ɚ dʒʌst fɪkst ðə ˈsɪmptəm/", "hl": ["root cause", "fixed the symptom"]}, {"topicRaw": "4-Errors & Problem Solving", "topicName": "Errors & Problem Solving", "topicOrder": 4, "stage": 1, "vi": "Vui lòng chưa phản hồi nhân viên cho đến khi xác nhận được số liệu đúng.", "en": "Please hold off replying to employees until we've confirmed the correct figures.", "ipa": "/pliz hoʊld‿ɔf rɪˈplaɪɪŋ tu ɪmˈplɔɪiz‿ənˈtɪl wiv kənˈfɝmd ðə kəˈrɛkt ˈfɪɡjɚz/", "hl": ["hold off replying", "correct figures"]}, {"topicRaw": "4-Errors & Problem Solving", "topicName": "Errors & Problem Solving", "topicOrder": 4, "stage": 1, "vi": "Vui lòng ghi lỗi vào nhật ký sự cố kèm ảnh chụp màn hình.", "en": "Please log the issue in the incident tracker with screenshots attached.", "ipa": "/pliz lɔɡ ði ˈɪʃu ɪn ði ˈɪnsɪdənt ˈtrækɚ wɪθ ˈskrinˌʃɑts‿əˈtætʃt/", "hl": ["log the issue", "incident tracker"]}, {"topicRaw": "4-Errors & Problem Solving", "topicName": "Errors & Problem Solving", "topicOrder": 4, "stage": 1, "vi": "Tôi xin lỗi; tôi đã bỏ bước kiểm tra chéo trước khi gửi, lỗi ở tôi.", "en": "I apologize; I skipped the cross-check before sending, and that's on me.", "ipa": "/aɪ əˈpɑləˌdʒaɪz; aɪ skɪpt ðə krɔs tʃɛk bɪˈfɔr ˈsɛndɪŋ, ən ðæts‿ɑn mi/", "hl": ["I apologize", "skipped the cross-check", "that's on me"]}, {"topicRaw": "4-Errors & Problem Solving", "topicName": "Errors & Problem Solving", "topicOrder": 4, "stage": 1, "vi": "Khoản thiếu sẽ được truy lĩnh trong kỳ lương tháng sau.", "en": "The shortfall will be paid retroactively in next month's payroll.", "ipa": "/ðə ˈʃɔrtˌfɔl wɪl bi peɪd ˌrɛtroʊˈæktɪvli ɪn nɛkst mʌnθs ˈpeɪroʊl/", "hl": ["shortfall", "paid retroactively"]}, {"topicRaw": "4-Errors & Problem Solving", "topicName": "Errors & Problem Solving", "topicOrder": 4, "stage": 2, "vi": "Theo quy định, thu hồi khoản trả thừa cần văn bản đồng ý của nhân viên.", "en": "Under our policy, recovering an overpayment requires the employee's written agreement.", "ipa": "/ˈʌndɚ‿ˈaʊɚ ˈpɑləsi, rəˈkʌvərɪŋ‿ən‿ˈoʊvɚˌpeɪmənt riˈkwaɪɚz ði ɪmˈplɔɪiz ˈrɪɾən‿əˈɡrimənt/", "hl": ["Under our policy", "overpayment", "written agreement"]}, {"topicRaw": "4-Errors & Problem Solving", "topicName": "Errors & Problem Solving", "topicOrder": 4, "stage": 2, "vi": "Khi phát hiện lỗi, chúng ta khoanh vùng, sửa, rồi rà lại toàn bộ bảng lương.", "en": "When we find an error, we contain it, fix it, then re-check the payroll.", "ipa": "/wɛn wi faɪnd‿ən‿ˈɛrɚ, wi kənˈteɪn‿ɪt, fɪks‿ɪt, ðɛn reɪ tʃɛk ðə ˈpeɪˌroʊl/", "hl": ["contain it, fix it", "re-check the payroll"]}, {"topicRaw": "4-Errors & Problem Solving", "topicName": "Errors & Problem Solving", "topicOrder": 4, "stage": 2, "vi": "Bạn có thể xuất dữ liệu chấm công gốc để tôi đối chiếu không?", "en": "Could you export the raw attendance data so I can reconcile it?", "ipa": "/kʊd ju ˈɛkspɔrt ðə rɑ əˈtɛndəns ˈdeɪɾə soʊ aɪ kən ˈrɛkənˌsaɪl‿ɪt/", "hl": ["export the raw attendance data", "reconcile it"]}, {"topicRaw": "4-Errors & Problem Solving", "topicName": "Errors & Problem Solving", "topicOrder": 4, "stage": 2, "vi": "Bạn có phiền gọi trực tiếp cho nhân viên đó để giải thích không?", "en": "Would you mind calling the employee directly to explain what happened?", "ipa": "/wʊd ju maɪnd ˈkɔlɪŋ ði ɪmˈplɔɪi dɪˈrɛktli tu ɪkˈspleɪn wʌt ˈhæpənd/", "hl": ["calling the employee directly", "what happened"]}, {"topicRaw": "4-Errors & Problem Solving", "topicName": "Errors & Problem Solving", "topicOrder": 4, "stage": 2, "vi": "Lỗi cứ lặp lại vì hệ thống không cảnh báo khi dữ liệu nhập bị thiếu.", "en": "The error keeps recurring because the system doesn't flag missing inputs.", "ipa": "/ði ˈɛrɚ kips rɪˈkɝrɪŋ bɪˈkɔz ðə ˈsɪstəm ˈdʌzənt flæɡ ˈmɪsɪŋ‿ˈɪnpʊts/", "hl": ["keeps recurring because", "flag missing inputs"]}, {"topicRaw": "4-Errors & Problem Solving", "topicName": "Errors & Problem Solving", "topicOrder": 4, "stage": 2, "vi": "Nếu chênh lệch dưới 100.000 đồng, chúng ta sẽ điều chỉnh vào kỳ sau.", "en": "If the variance is under 100,000 VND, we'll adjust it next cycle.", "ipa": "/ɪf ðə ˈvɛriəns‿ɪz‿ˈʌndɚ wʌn ˈhʌndrəd ˈθaʊzənd ˌviɛnˈdi, wil‿əˈdʒʌst‿ɪt nɛkst ˈsaɪkəl/", "hl": ["If the variance is under", "adjust it next cycle"]}, {"topicRaw": "4-Errors & Problem Solving", "topicName": "Errors & Problem Solving", "topicOrder": 4, "stage": 2, "vi": "Rất tiếc, lỗi này cũng ảnh hưởng tờ khai thuế nên ta sẽ nộp bản bổ sung.", "en": "Unfortunately, the error also affected the tax return, so we'll file an amendment.", "ipa": "/ənˈfɔrtʃənətli, ði ˈɛrɚ ˈɔlsoʊ əˈfɛktɪd ðə tæks rɪˈtɝn, soʊ wil faɪl‿ən‿əˈmɛndmənt/", "hl": ["Unfortunately", "file an amendment"]}, {"topicRaw": "4-Errors & Problem Solving", "topicName": "Errors & Problem Solving", "topicOrder": 4, "stage": 2, "vi": "Tôi sẽ theo dõi kỳ lương sau để chắc chắn lỗi không lặp lại.", "en": "I'll monitor next month's run to make sure the fix holds.", "ipa": "/aɪl ˈmɑnəɾɚ nɛkst mʌnθs rʌn tə meɪk ʃʊr ðə fɪks hoʊldz/", "hl": ["I'll monitor", "the fix holds"]}, {"topicRaw": "4-Errors & Problem Solving", "topicName": "Errors & Problem Solving", "topicOrder": 4, "stage": 3, "vi": "Để tôi giải thích lỗi xảy ra thế nào, ai bị ảnh hưởng.", "en": "Let me explain how the error happened and who was affected.", "ipa": "/lɛt mi ɪkˈspleɪn haʊ ði ˈɛrɚ ˈhæpənd‿ən hu wəz‿əˈfɛktɪd/", "hl": ["Let me explain how the error happened", "who was affected"]}, {"topicRaw": "4-Errors & Problem Solving", "topicName": "Errors & Problem Solving", "topicOrder": 4, "stage": 3, "vi": "Để tôi làm rõ: lỗi chỉ ảnh hưởng 12 người ở chi nhánh Hà Nội.", "en": "Let me clarify: the error affected only 12 employees in the Hanoi branch.", "ipa": "/lɛt mi ˈklɛrəˌfaɪ: ði ˈɛrɚ‿əˈfɛktɪd‿ˈoʊnli twɛlv‿ɪmˈplɔɪiz‿ɪn ðə hæˈnɔɪ bræntʃ/", "hl": ["Let me clarify", "affected only 12 employees"]}, {"topicRaw": "4-Errors & Problem Solving", "topicName": "Errors & Problem Solving", "topicOrder": 4, "stage": 3, "vi": "Theo kết quả kiểm tra, lỗi đến từ dữ liệu đầu vào.", "en": "Based on our check, the error came from input data.", "ipa": "/beɪst‿ɑn‿ˈaʊɚ tʃɛk, ði ˈɛrɚ keɪm frəm‿ˈɪnpʊt ˈdeɪɾə/", "hl": ["Based on our check", "input data"]}, {"topicRaw": "4-Errors & Problem Solving", "topicName": "Errors & Problem Solving", "topicOrder": 4, "stage": 3, "vi": "Tôi đề xuất thêm bước kiểm tra chéo trước khi chốt lương.", "en": "I recommend adding a second-person check before we finalize payroll.", "ipa": "/aɪ ˌrɛkəˈmɛnd‿ˈædɪŋ‿ə ˈsɛkənd ˈpɝsən tʃɛk bɪˈfɔr wi ˈfaɪnəˌlaɪz ˈpeɪroʊl/", "hl": ["I recommend adding a second-person check", "before we finalize payroll"]}, {"topicRaw": "4-Errors & Problem Solving", "topicName": "Errors & Problem Solving", "topicOrder": 4, "stage": 3, "vi": "Tôi đề nghị ghi mọi lỗi vào file theo dõi chung, kèm nguyên nhân gốc.", "en": "I'd suggest logging every error in a shared tracker with its root cause.", "ipa": "/aɪd səˈdʒɛst ˈlɔɡɪŋ‿ˈɛvri ˈɛrɚ‿ɪn‿ə ʃɛrd ˈtrækɚ wɪθ‿ɪts rut kɔz/", "hl": ["I'd suggest logging every error", "root cause"]}, {"topicRaw": "4-Errors & Problem Solving", "topicName": "Errors & Problem Solving", "topicOrder": 4, "stage": 3, "vi": "Theo tôi, nguyên nhân gốc là quy trình, không phải con người.", "en": "In my view, the root cause is the process, not the people.", "ipa": "/ɪn maɪ vju, ðə rut kɔz‿ɪz ðə ˈprɑsɛs, nɑt ðə ˈpipəl/", "hl": ["In my view", "root cause", "the process, not the people"]}, {"topicRaw": "4-Errors & Problem Solving", "topicName": "Errors & Problem Solving", "topicOrder": 4, "stage": 3, "vi": "Tôi hiểu ý bạn, nhưng sửa tạm sẽ gây lỗi khác.", "en": "I see your point, but a quick fix will create new errors.", "ipa": "/aɪ si jɚ pɔɪnt, bəɾ‿ə kwɪk fɪks wɪl kriˈeɪt nu ˈɛrɚz/", "hl": ["I see your point, but", "quick fix"]}, {"topicRaw": "4-Errors & Problem Solving", "topicName": "Errors & Problem Solving", "topicOrder": 4, "stage": 3, "vi": "Có lẽ nên tự động hóa bước nhập dữ liệu chấm công trong quý tới.", "en": "It might be worth automating the attendance data entry step next quarter.", "ipa": "/ɪt maɪt bi wɝθ‿ˈɔɾəˌmeɪɾɪŋ ði əˈtɛndəns ˈdeɪɾə ˈɛntri stɛp nɛkst ˈkwɔrɾɚ/", "hl": ["It might be worth automating", "attendance data entry"]}, {"topicRaw": "4-Errors & Problem Solving", "topicName": "Errors & Problem Solving", "topicOrder": 4, "stage": 4, "vi": "Chúng ta chuyển sang lỗi lương tháng này, vì nhiều nhân viên đang hỏi.", "en": "Next, let's look at this month's payroll errors, since many employees are asking.", "ipa": "/nɛkst, lɛts lʊk‿ət ðɪs mʌnθs ˈpeɪroʊl‿ˈɛrɚz, sɪns ˈmɛni ɪmˈplɔɪiz‿ɚ‿ˈæskɪŋ/", "hl": ["Next, let's look at", "payroll errors", "many employees are asking"]}, {"topicRaw": "4-Errors & Problem Solving", "topicName": "Errors & Problem Solving", "topicOrder": 4, "stage": 4, "vi": "Bạn trình bày nguyên nhân và cách khắc phục được không?", "en": "Could you walk us through the cause and the fix?", "ipa": "/kʊd ju wɔk‿əs θru ðə kɔz‿ən ðə fɪks/", "hl": ["walk us through", "the cause and the fix"]}, {"topicRaw": "4-Errors & Problem Solving", "topicName": "Errors & Problem Solving", "topicOrder": 4, "stage": 4, "vi": "Tôi muốn lưu ý một điểm: lỗi này có thể lặp lại.", "en": "I want to flag one issue: this error may happen again.", "ipa": "/aɪ wɑnt tə flæɡ wʌn‿ˈɪʃu: ðɪs‿ˈɛrɚ meɪ ˈhæpən‿əˈɡɛn/", "hl": ["I want to flag one issue", "may happen again"]}, {"topicRaw": "4-Errors & Problem Solving", "topicName": "Errors & Problem Solving", "topicOrder": 4, "stage": 4, "vi": "Tôi hiểu cần sửa nhanh, nhưng phải tìm đúng nguyên nhân trước.", "en": "I appreciate the urgency; however, we must find the root cause first.", "ipa": "/aɪ əˈpriʃiˌeɪt ði ˈɝdʒənsi; ˌhaʊˈɛvɚ, wi mʌst faɪnd ðə rut kɑz fɝst/", "hl": ["I appreciate the urgency; however", "root cause first"]}, {"topicRaw": "4-Errors & Problem Solving", "topicName": "Errors & Problem Solving", "topicOrder": 4, "stage": 4, "vi": "Hay chúng ta thử chạy lương song song 1 tháng?", "en": "What if we run a parallel payroll for one month?", "ipa": "/wʌɾ‿ɪf wi rʌn‿ə ˈpærəlɛl ˈpeɪroʊl fɚ wʌn mʌnθ/", "hl": ["What if we run", "parallel payroll"]}, {"topicRaw": "4-Errors & Problem Solving", "topicName": "Errors & Problem Solving", "topicOrder": 4, "stage": 4, "vi": "Chúng tôi không thể hoàn tiền hôm nay, nhưng sẽ xong trước thứ Sáu.", "en": "We're not able to refund it today, but it'll be done by Friday.", "ipa": "/wɪr nɑɾ‿ˈeɪbəl tə ˈrifʌnd‿ɪt təˈdeɪ, bəɾ‿ˈɪɾəl bi dʌn baɪ ˈfraɪdeɪ/", "hl": ["We're not able to", "it'll be done by Friday"]}, {"topicRaw": "4-Errors & Problem Solving", "topicName": "Errors & Problem Solving", "topicOrder": 4, "stage": 4, "vi": "Tóm lại, lỗi đã được sửa và nhân viên đã được thông báo.", "en": "So, to recap, the error is fixed and staff have been informed.", "ipa": "/soʊ, tə ˈriˌkæp, ði ˈɛrɚ‿ɪz fɪkst‿ən stæf hæv bɪn‿ɪnˈfɔrmd/", "hl": ["to recap", "staff have been informed"]}, {"topicRaw": "4-Errors & Problem Solving", "topicName": "Errors & Problem Solving", "topicOrder": 4, "stage": 4, "vi": "Bước tiếp theo: cập nhật quy trình và đào tạo lại team trước kỳ lương sau.", "en": "Next step: we'll update the process and retrain the team before next payroll.", "ipa": "/nɛkst stɛp: wil‿ʌpˈdeɪt ðə ˈprɑsɛs‿ən riˈtreɪn ðə tim bɪˈfɔr nɛkst ˈpeɪroʊl/", "hl": ["Next step", "update the process", "retrain the team"]}, {"topicRaw": "4-Errors & Problem Solving", "topicName": "Errors & Problem Solving", "topicOrder": 4, "stage": 5, "vi": "Thật lòng, ta đã có thể tránh lỗi này nếu làm đúng bảng kiểm của mình.", "en": "Honestly, we could have avoided this error by following our own checklist.", "ipa": "/ˈɑnəstli, wi kʊd həv‿əˈvɔɪdɪd ðɪs‿ˈɛrɚ baɪ ˈfɑloʊɪŋ‿aʊɚ oʊn ˈtʃɛˌklɪst/", "hl": ["Honestly", "could have avoided", "our own checklist"]}, {"topicRaw": "4-Errors & Problem Solving", "topicName": "Errors & Problem Solving", "topicOrder": 4, "stage": 5, "vi": "Theo kinh nghiệm, nhận lỗi sớm giữ được niềm tin; che giấu thì tệ hơn.", "en": "From my experience, admitting mistakes early keeps trust; hiding them makes things worse.", "ipa": "/frəm maɪ ɪkˈspɪriəns, ædˈmɪɾɪŋ mɪˈsteɪks‿ˈɝli kips trʌst; ˈhaɪdɪŋ ðɛm meɪks θɪŋz wɝs/", "hl": ["From my experience", "admitting mistakes early keeps trust"]}, {"topicRaw": "4-Errors & Problem Solving", "topicName": "Errors & Problem Solving", "topicOrder": 4, "stage": 5, "vi": "Mấu chốt là phải sửa quy trình, không chỉ sửa con số trên phiếu lương.", "en": "The bottom line: we must fix the process, not just the payslip number.", "ipa": "/ðə ˈbɑɾəm laɪn: wi mʌst fɪks ðə ˈprɑˌsɛs, nɑt dʒʌst ðə ˈpeɪˌslɪp ˈnʌmbɚ/", "hl": ["The bottom line", "fix the process", "not just the payslip number"]}, {"topicRaw": "4-Errors & Problem Solving", "topicName": "Errors & Problem Solving", "topicOrder": 4, "stage": 5, "vi": "Tôi lo nhân viên sẽ mất niềm tin vào bảng lương nếu một lỗi lặp lại.", "en": "My main worry is that employees stop trusting payroll if the same error repeats.", "ipa": "/maɪ meɪn ˈwɝi ɪz ðət‿ɛmˈplɔɪiz stɑp ˈtrʌstɪŋ ˈpeɪˌroʊl‿ɪf ðə seɪm‿ˈɛrɚ rɪˈpits/", "hl": ["My main worry", "stop trusting payroll"]}, {"topicRaw": "4-Errors & Problem Solving", "topicName": "Errors & Problem Solving", "topicOrder": 4, "stage": 5, "vi": "Nếu không tìm ra nguyên nhân gốc, lỗi này sẽ quay lại tháng sau.", "en": "If we don't find the root cause, the same error will return next month.", "ipa": "/ɪf wi doʊnt faɪnd ðə rut kɑz, ðə seɪm‿ˈɛrɚ wɪl rɪˈtɝn nɛkst mʌnθ/", "hl": ["If we don't find the root cause", "will return next month"]}, {"topicRaw": "4-Errors & Problem Solving", "topicName": "Errors & Problem Solving", "topicOrder": 4, "stage": 5, "vi": "Tôi ngại đổ lỗi cho một người; lỗ hổng thật nằm ở khâu rà soát.", "en": "I'm not comfortable blaming one person; the real gap is in our review process.", "ipa": "/aɪm nɑt ˈkʌmfɚtəbəl ˈbleɪmɪŋ wʌn ˈpɝsən; ðə ril ɡæp‿ɪz‿ɪn‿aʊɚ ˌriˈvju ˈprɑˌsɛs/", "hl": ["I'm not comfortable blaming", "review process"]}, {"topicRaw": "4-Errors & Problem Solving", "topicName": "Errors & Problem Solving", "topicOrder": 4, "stage": 5, "vi": "Tôi lo nhất là ta chỉ phát hiện lỗi sau khi nhân viên khiếu nại.", "en": "My biggest concern is that we found the error only after employees compl
