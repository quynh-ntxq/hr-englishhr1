<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>C&B English Coach - Luyện tiếng Anh HR/Payroll</title>
<meta name="theme-color" content="#0B3D5C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --navy:#0B3D5C;
    --navy-dark:#062638;
    --accent:#0F9D8C;
    --green:#1DB954;
    --orange:#E08A00;
    --bg1:#08283D;
    --bg2:#136B7A;
    --card:#ffffff;
    --text:#1f2430;
    --muted:#8a90a2;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    font-family:'Inter',system-ui,sans-serif;
    background:
      radial-gradient(circle at 15% 10%, rgba(255,255,255,0.10), transparent 40%),
      radial-gradient(circle at 90% 85%, rgba(255,255,255,0.08), transparent 45%),
      linear-gradient(135deg, var(--bg1), var(--bg2));
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding: clamp(10px, 4vw, 30px);
  }

  .app{
    width:100%;
    max-width:760px;
    margin-top: clamp(6px, 2vh, 24px);
  }

  .card{
    background: var(--card);
    border-radius: 24px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.25), 0 4px 12px rgba(0,0,0,0.08);
    padding: clamp(18px, 4vw, 34px);
    overflow:hidden;
    position:relative;
  }

  .brand{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-bottom: 4px;
  }
  .brand .logo-dot{
    width:14px;height:14px;border-radius:50%;
    background: linear-gradient(135deg, var(--accent), #ff8a00);
    flex-shrink:0;
  }
  .brand h1{
    font-family:'Poppins',sans-serif;
    font-weight:800;
    letter-spacing:0.5px;
    font-size: clamp(1.3em, 4.5vw, 1.7em);
    color: var(--navy);
    margin:0;
  }
  .subtitle{
    text-align:center;
    color: var(--muted);
    font-size: clamp(0.82em, 2.6vw, 0.95em);
    margin: 2px 0 18px;
  }

  /* SETTINGS GEAR + PANEL */
  .settings-toggle{
    position:absolute;
    top: clamp(14px, 3vw, 22px);
    right: clamp(14px, 3vw, 22px);
    width:36px;height:36px;
    border-radius:50%;
    border:none;
    background:#f0f1f6;
    color:var(--navy);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1em;
    transition: transform .3s ease, background .2s ease;
    z-index:2;
  }
  .settings-toggle.open{ transform: rotate(75deg); background:var(--navy); color:#fff; }

  .settings-panel{
    max-height:0;
    opacity:0;
    overflow:hidden;
    transition: max-height .3s ease, opacity .25s ease, margin .3s ease;
    background:#f7f8fd;
    border-radius:16px;
  }
  .settings-panel.open{
    max-height:420px;
    opacity:1;
    margin-bottom:16px;
    padding: 14px 16px;
  }
  .settings-row{ margin-bottom:12px; }
  .settings-row:last-child{ margin-bottom:0; }
  .settings-row label{
    display:block;
    font-size:0.78em;
    font-weight:600;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.05em;
    margin-bottom:6px;
  }
  .settings-row select{
    width:100%;
    padding:9px 10px;
    border-radius:10px;
    border:1.5px solid #e2e5f0;
    background:#fff;
    color:var(--text);
    font-size:0.85em;
    font-family:'Inter',sans-serif;
  }
  .settings-row select:disabled{ color:var(--muted); }
  .speed-options{ display:flex; gap:8px; }
  .speed-btn, .speed-btn-en{
    flex:1;
    border:1.5px solid #e2e5f0;
    background:#fff;
    color:#3a4160;
    font-weight:600;
    font-size:0.82em;
    padding:8px 6px;
    border-radius:10px;
    cursor:pointer;
    transition: all .15s ease;
  }
  .speed-btn.active, .speed-btn-en.active{
    background: var(--navy);
    border-color: var(--navy);
    color:#fff;
  }

  .speed-value-label{
    font-weight:700;
    color: var(--navy);
    margin-left:4px;
    text-transform:none;
  }
  .speed-slider{
    width:100%;
    height:6px;
    border-radius:999px;
    outline:none;
    appearance:none;
    -webkit-appearance:none;
    background: linear-gradient(to right, var(--navy) 0%, var(--navy) var(--fill, 50%), #e2e5f0 var(--fill, 50%), #e2e5f0 100%);
    margin-top:8px;
    cursor:pointer;
  }
  .speed-slider::-webkit-slider-thumb{
    appearance:none;
    -webkit-appearance:none;
    width:20px;height:20px;
    border-radius:50%;
    background:#fff;
    border:3px solid var(--navy);
    cursor:pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }
  .speed-slider::-moz-range-thumb{
    width:20px;height:20px;
    border-radius:50%;
    background:#fff;
    border:3px solid var(--navy);
    cursor:pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }
  .speed-slider::-moz-range-progress{
    background: var(--navy);
    height:6px;
    border-radius:999px;
  }

  /* MODE TABS */
  .mode-tabs{
    display:flex;
    gap:8px;
    margin-bottom:16px;
    background:#f0f1f6;
    border-radius:14px;
    padding:4px;
  }
  .mode-tab{
    flex:1;
    border:none;
    background:transparent;
    color:var(--muted);
    font-weight:700;
    font-size: clamp(0.8em, 2.8vw, 0.9em);
    padding:10px 8px;
    border-radius:10px;
    cursor:pointer;
    transition: all .18s ease;
  }
  .mode-tab.active{
    background:#fff;
    color:var(--navy);
    box-shadow: 0 3px 10px rgba(0,0,0,0.1);
  }

  /* LISTENING VIEW */
  .listen-card{
    background: linear-gradient(160deg, #f7f8fd, #eef0fb);
    border-radius: 18px;
    padding: clamp(18px, 4.5vw, 28px);
    margin-bottom: 16px;
  }
  .listen-title{
    font-family:'Poppins',sans-serif;
    font-weight:700;
    font-size: clamp(1.05em, 4vw, 1.3em);
    color: var(--navy);
    margin-bottom:4px;
  }
  .listen-type-badge{
    display:inline-block;
    font-size:0.72em;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.04em;
    color: var(--accent);
    background:#e5f7f4;
    padding:3px 10px;
    border-radius:999px;
    margin-bottom:12px;
  }
  .listen-play-row{
    display:flex;
    gap:10px;
    margin-bottom:14px;
  }
  .listen-play-btn{
    border:none;
    background: var(--navy);
    color:#fff;
    font-weight:700;
    font-size: clamp(0.68em, 3.2vw, 0.85em);
    padding:11px 8px;
    border-radius:12px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
    flex:1;
    justify-content:center;
    white-space:nowrap;
    overflow:hidden;
  }
  .listen-play-btn.secondary{
    background:#fff;
    color:var(--navy);
    border:1.5px solid #dfe2f0;
  }
  .listen-play-btn.playing{
    background:#c0392b;
  }
  .listen-play-btn.secondary.playing{
    background:#fdecea;
    color:#c0392b;
    border-color:#c0392b;
  }
  .transcript-toggle{
    border:none;
    background:none;
    color:var(--accent);
    font-weight:700;
    font-size:0.82em;
    cursor:pointer;
    padding:4px 0;
    margin-bottom:10px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .transcript-box{
    display:none;
    background:#fff;
    border-radius:14px;
    padding:14px 16px;
    margin-bottom:14px;
    max-height:280px;
    overflow-y:auto;
  }
  .transcript-box.show{ display:block; }
  .transcript-line{
    margin-bottom:10px;
    line-height:1.5;
  }
  .transcript-line:last-child{ margin-bottom:0; }
  .transcript-en{
    font-weight:600;
    color:var(--text);
    font-size:0.92em;
  }
  .transcript-vi{
    color:var(--muted);
    font-size:0.85em;
    margin-top:2px;
  }
  .speaker-tag{
    display:inline-block;
    font-size:0.72em;
    font-weight:700;
    color: var(--accent);
    margin-right:6px;
  }
  .quiz-wrap{
    margin-top:6px;
  }
  .quiz-q{
    font-weight:700;
    font-size:0.9em;
    color:var(--text);
    margin:14px 0 8px;
  }
  .quiz-q:first-child{ margin-top:0; }
  .quiz-opt{
    display:block;
    width:100%;
    text-align:left;
    border:1.5px solid #e2e5f0;
    background:#fff;
    color:var(--text);
    font-size:0.85em;
    padding:10px 12px;
    border-radius:10px;
    margin-bottom:8px;
    cursor:pointer;
    transition: all .15s ease;
  }
  .quiz-opt.correct{
    background:#e7f8ec;
    border-color: var(--green);
    color:#146c2e;
    font-weight:700;
  }
  .quiz-opt.wrong{
    background:#fdecea;
    border-color:#e0574a;
    color:#a02f24;
    font-weight:700;
  }
  .quiz-opt:disabled{ cursor:default; }

  /* TOPIC CHIPS */
  .topics-wrap{
    margin-bottom: 14px;
  }
  .topics-label{
    font-size:0.78em;
    color:var(--muted);
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.06em;
    margin-bottom:8px;
    display:block;
  }
  .topic-chips{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    max-height: 180px;
    overflow-y:auto;
    padding: 2px 2px 6px;
  }
  .chip{
    border: 1.5px solid #e2e5f0;
    background:#fafbff;
    color:#3a4160;
    font-size: clamp(0.76em, 2.4vw, 0.85em);
    font-weight:600;
    padding: 8px 14px;
    border-radius: 999px;
    cursor:pointer;
    white-space:nowrap;
    transition: all .18s ease;
    user-select:none;
  }
  .chip:active{ transform: scale(0.96); }
  .chip.selected{
    background: var(--navy);
    border-color: var(--navy);
    color:#fff;
  }
  .chip.all-chip{
    background:#fff3ee;
    border-color:#ffd2c2;
    color:var(--accent);
  }
  .chip.all-chip.selected{
    background: var(--accent);
    border-color: var(--accent);
    color:#fff;
  }
  .chip.stage-chip.selected{
    background: var(--accent);
    border-color: var(--accent);
    color:#fff;
  }
  .stage-desc{
    font-size:0.78em;
    color:var(--muted);
    font-style:italic;
    margin: 6px 2px 0;
  }

  /* QUESTION AREA */
  .stage{
    background: linear-gradient(160deg, #f7f8fd, #eef0fb);
    border-radius: 18px;
    padding: clamp(20px, 5vw, 34px) clamp(16px, 4vw, 26px);
    text-align:center;
    min-height: 190px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-bottom: 16px;
  }
  .question{
    font-family:'Poppins',sans-serif;
    font-weight:700;
    font-size: clamp(1.2em, 5vw, 1.7em);
    color: var(--text);
    line-height:1.35;
  }
  .question.compact{ font-size: clamp(1.05em, 4.2vw, 1.35em); }

  .replay-btn{
    border:none;
    background:#fff;
    color:var(--navy);
    width:38px;height:38px;
    border-radius:50%;
    box-shadow: 0 3px 10px rgba(0,0,0,0.12);
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-size:0.95em;
    transition: transform .15s ease;
  }
  .replay-btn:active{ transform: scale(0.9); }
  .replay-btn.muted{ background:#fdecea; color:#c0392b; }

  .answer-block{
    max-height:0;
    opacity:0;
    overflow:hidden;
    transition: max-height .35s ease, opacity .3s ease, margin .3s ease;
  }
  .answer-block.show{
    max-height:220px;
    opacity:1;
    margin-top:6px;
  }
  .answer{
    font-family:'Poppins',sans-serif;
    font-weight:600;
    font-size: clamp(1.05em, 4vw, 1.25em);
    color: var(--green);
  }
  .ipa{
    font-size: clamp(0.85em, 3vw, 1em);
    color: var(--orange);
    font-weight:600;
    margin-top:6px;
  }

  .empty-note{
    color: var(--muted);
    font-style: italic;
    font-size:0.82em;
    text-align:center;
    margin: -6px 0 12px;
  }

  /* PROGRESS */
  .progress-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:16px;
  }
  .progress-bar{
    flex:1;
    height:8px;
    background:#eceefa;
    border-radius:999px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background: linear-gradient(90deg, var(--navy), #5b6fd6);
    border-radius:999px;
    transition: width .3s ease;
  }
  .progress-text{
    font-size:0.82em;
    font-weight:700;
    color:var(--navy);
    white-space:nowrap;
    min-width:52px;
    text-align:right;
  }

  /* AUTO PLAY */
  .auto-row{
    display:grid;
    grid-template-columns: 3fr 3fr 4fr;
    gap:8px;
    margin-bottom:12px;
  }
  .auto-mode-btn{
    border:none;
    background:#f0f1f6;
    color:var(--muted);
    font-weight:700;
    font-size: clamp(0.72em, 3vw, 0.78em);
    padding:11px 4px;
    border-radius:12px;
    cursor:pointer;
    white-space:nowrap;
    overflow:hidden;
  }
  .auto-mode-btn.active{
    background:#fff;
    color:var(--navy);
    box-shadow: 0 0 0 1.5px var(--navy) inset;
  }
  .btn-autoplay{
    border:none;
    border-radius:12px;
    padding:11px 6px;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size: clamp(0.72em, 3vw, 0.85em);
    cursor:pointer;
    background: var(--orange);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    white-space:nowrap;
    overflow:hidden;
    transition: transform .12s ease;
  }
  .btn-autoplay:active{ transform: scale(0.97); }
  .btn-autoplay.running{
    background:#c0392b;
  }

  /* ACTION BUTTONS */
  .actions{
    display:flex;
    gap:12px;
  }
  .btn{
    flex:1;
    border:none;
    border-radius: 16px;
    padding: 15px 10px;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size: clamp(0.85em, 3vw, 1em);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition: transform .12s ease, box-shadow .2s ease;
  }
  .btn:active{ transform: scale(0.97); }
  .btn:disabled{ opacity:0.45; cursor:not-allowed; transform:none; }
  .btn-primary{
    background: var(--navy);
    color:#fff;
    box-shadow: 0 8px 20px rgba(0,47,135,0.3);
  }
  .btn-secondary{
    background: var(--green);
    color:#fff;
    box-shadow: 0 8px 20px rgba(29,185,84,0.3);
  }

  footer{
    text-align:center;
    color:rgba(255,255,255,0.75);
    font-size:0.78em;
    margin-top:16px;
    padding-bottom: 8px;
  }

  @media (max-width:480px){
    .actions{ flex-direction:column; }
  }
</style>
</head>
<body>
  <div class="app">
    <div class="card">
      <button class="settings-toggle" id="settingsToggle" title="Cài đặt giọng đọc"><i class="fa-solid fa-gear"></i></button>
      <div class="brand"><span class="logo-dot"></span><h1>C&amp;B ENGLISH COACH</h1></div>
      <p class="subtitle">Luyện tiếng Anh HR - Payroll - C&amp;B mỗi ngày, đủ 5 Stage từ cơ bản đến phản xạ tự nhiên</p>

      <div class="settings-panel" id="settingsPanel">
        <div class="settings-row">
          <label>Giọng đọc tiếng Việt</label>
          <select id="voiceViSelect"></select>
        </div>
        <div class="settings-row">
          <label>Giọng đọc tiếng Anh</label>
          <select id="voiceEnSelect"></select>
        </div>
        <div class="settings-row">
          <label>Tốc độ đọc câu hỏi tiếng Việt</label>
          <div class="speed-options">
            <button class="speed-btn" data-speed="0.8">Chậm</button>
            <button class="speed-btn" data-speed="1">Vừa</button>
            <button class="speed-btn" data-speed="1.3">Nhanh</button>
          </div>
        </div>
        <div class="settings-row">
          <label>Tốc độ đọc tiếng Anh <span id="enSpeedValue" class="speed-value-label">1.0x</span></label>
          <input type="range" id="enSpeedSlider" class="speed-slider" min="0.6" max="1" step="0.05" value="1">
        </div>
      </div>

      <div class="mode-tabs">
        <button class="mode-tab active" id="modeFlashcardBtn"><i class="fa-solid fa-layer-group"></i> Luyện câu</button>
        <button class="mode-tab" id="modeListenBtn"><i class="fa-solid fa-headphones"></i> Đoạn nghe</button>
      </div>

      <div id="flashcardMode">
        <div class="topics-wrap">
          <span class="topics-label">Chọn Stage</span>
          <div class="topic-chips" id="stageChips"></div>
          <div class="stage-desc" id="stageDesc"></div>
        </div>

        <div class="topics-wrap">
          <span class="topics-label">Chọn chủ đề</span>
          <div class="topic-chips" id="topicChips">Đang tải dữ liệu...</div>
        </div>

        <div class="stage">
          <div class="question" id="question">Chưa có dữ liệu.</div>
          <button class="replay-btn" id="replayBtn" title="Tắt/bật tiếng"><i class="fa-solid fa-volume-high"></i></button>
          <div class="answer-block" id="answerBlock">
            <div class="answer" id="answer"></div>
            <div class="ipa" id="ipa"></div>
          </div>
        </div>

        <div class="empty-note" id="emptyNote"></div>

        <div class="progress-row">
          <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
          <div class="progress-text" id="progressText">0/0</div>
        </div>

        <div class="auto-row">
          <button class="auto-mode-btn active" id="autoModeReflexBtn" data-mode="reflex">Phản xạ</button>
          <button class="auto-mode-btn" id="autoModeReadBtn" data-mode="read">Đọc câu</button>
          <button class="btn-autoplay" id="autoPlayBtn"><i class="fa-solid fa-play"></i> Tự động chạy</button>
        </div>

        <div class="actions">
          <button class="btn btn-primary" id="showAnswerBtn" disabled><i class="fa-solid fa-eye"></i> Xem đáp án</button>
          <button class="btn btn-secondary" id="nextBtn" disabled><i class="fa-solid fa-shuffle"></i> Câu tiếp theo</button>
        </div>
      </div>

      <div id="listenMode" style="display:none;">
        <div class="topics-wrap">
          <span class="topics-label">Chọn chủ đề</span>
          <div class="topic-chips" id="listenTopicChips">Đang tải dữ liệu...</div>
        </div>

        <div class="listen-card" id="listenCard">
          <div class="listen-type-badge" id="listenTypeBadge">Hội thoại</div>
          <div class="listen-title" id="listenTitle">Chưa chọn chủ đề</div>

          <div class="listen-play-row">
            <button class="listen-play-btn" id="listenPlayEnBtn"><i class="fa-solid fa-play"></i> Nghe tiếng Anh</button>
            <button class="listen-play-btn secondary" id="listenPlayViBtn"><i class="fa-solid fa-language"></i> Nghe bản dịch</button>
          </div>

          <button class="transcript-toggle" id="transcriptToggleBtn"><i class="fa-solid fa-file-lines"></i> Hiện transcript &amp; bản dịch</button>
          <div class="transcript-box" id="transcriptBox"></div>

          <div class="quiz-wrap" id="quizWrap"></div>
        </div>
      </div>
    </div>
    <footer>C&amp;B English Coach &middot; Luyện tiếng Anh chuyên ngành HR/Payroll mỗi ngày</footer>
  </div>

<script>
  // ===================
  // DỮ LIỆU & TRẠNG THÁI
  // ===================
  // ===================
  // DỮ LIỆU CÂU LUYỆN (nhúng trực tiếp, không cần file Excel)
  // ===================

cRaw": "1-Email & Written Communication", "topicName": "Email & Written Communication", "topicOrder": 1, "stage": 6, "vi": "Tôi đề xuất bộ 10 mẫu email chuẩn, giúp mỗi nhân viên HR tiết kiệm khoảng 3 giờ mỗi tuần.", "en": "I propose a library of ten standard templates, which should save each HR officer three hours a week.", "ipa": "/aɪ prəˈpoʊz‿ə ˈlaɪbrɛˌri əv tɛn ˈstændɚd ˈtɛmpləts, wɪtʃ ʃʊd seɪv‿itʃ‿ˌeɪtʃˈɑr‿ˈɔfəsɚ θri ˈaʊɚz‿ə wik/"}, {"topicRaw": "1-Email & Written Communication", "topicName": "Email & Written Communication", "topicOrder": 1, "stage": 6, "vi": "Mục tiêu năm tới là trả lời mọi câu hỏi về lương trong 24 giờ, không cần nhắc lại.", "en": "Our goal for next year is to answer every payroll query within 24 hours, with no follow-ups needed.", "ipa": "/ˈaʊɚ ɡoʊl fɚ nɛkst jɪr‿ɪz tu ˈænsɚ‿ˈɛvri ˈpeɪroʊl ˈkwiri wɪˈθɪn ˈtwɛntiˌfɔr‿ˈaʊɚz, wɪθ noʊ ˈfɑloʊ ʌps ˈnidəd/"}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 1, "vi": "Tháng này headcount tăng 12 người, chủ yếu ở kho.", "en": "Headcount rose 12 this month, mostly in the warehouse.", "ipa": "/ˈhɛdˌkaʊnt roʊz twɛlv ðɪs mʌnθ, ˈmoʊstli ɪn ðə ˈwɛrˌhaʊs/"}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 1, "vi": "Tỷ lệ nghỉ việc quý này là 4,2%, thấp hơn mục tiêu.", "en": "Turnover this quarter was 4.2%, below our target.", "ipa": "/ˈtɝˌnoʊvɚ ðɪs ˈkwɔrtɚ wəz fɔr pɔɪnt tu pərˈsɛnt, bɪˈloʊ aʊɚ ˈtɑrɡət/"}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 1, "vi": "Bạn muốn cập nhật hằng tuần hay chỉ khi có vấn đề?", "en": "Prefer weekly updates, or only when issues arise?", "ipa": "/prəˈfɝ ˈwikli əpˈdeɪts, ɚ ˈoʊnli wɛn‿ˈɪʃuz‿ɚˈaɪz/"}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 1, "vi": "Bạn cần số liệu toàn công ty hay chi tiết theo phòng ban?", "en": "Do you need company-level figures or a department breakdown?", "ipa": "/du ju nid ˈkʌmpəˌni ˈlɛvəl ˈfɪɡjɚz‿ɚ ə dɪˈpɑrtmənt ˈbreɪkˌdaʊn/"}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 1, "vi": "Vui lòng cho tôi biết hạn của ban giám đốc để tôi lùi lịch chuẩn bị.", "en": "Please share the board's deadline; I'll plan backwards.", "ipa": "/pliz ʃɛr ðə bɔrdz ˈdɛdˌlaɪn; aɪl plæn ˈbækwɚdz/"}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 1, "vi": "Vui lòng xem tóm tắt trước, chi tiết nằm ở phụ lục.", "en": "Start with the summary; details are in the appendix.", "ipa": "/stɑrt wɪθ ðə ˈsʌmɚi; dɪˈteɪlz‿ɚ ɪn ði əˈpɛndɪks/"}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 1, "vi": "Xin lỗi, số headcount hôm qua chưa loại trừ người đã nghỉ việc.", "en": "Sorry, yesterday's headcount still included people who'd resigned.", "ipa": "/ˈsɑri, ˈjɛstɚˌdeɪz ˈhɛdˌkaʊnt stɪl‿ˌɪnˈkludəd ˈpipəl hud rɪˈzaɪnd/"}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 1, "vi": "Tôi sẽ sửa số liệu và gửi lại bản cập nhật trước trưa mai.", "en": "I'll fix the figure and resend by noon tomorrow.", "ipa": "/aɪl fɪks ðə ˈfɪɡjɚ ən rɪˈzɛnd baɪ nun təˈmɑˌroʊ/"}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 2, "vi": "Theo quy định, mọi số liệu nhân sự gửi ban giám đốc phải được HR Manager duyệt.", "en": "By policy, HR data for the board needs HR manager sign-off.", "ipa": "/baɪ ˈpɑləsi, eɪtʃ ɑr ˈdeɪɾə fɚ ðə bɔrd nidz‿eɪtʃ ɑr ˈmænədʒɚ saɪn ɔf/"}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 2, "vi": "Báo cáo tháng chốt số liệu ngày 25, đối chiếu với lương rồi mới gửi bạn.", "en": "Monthly report cuts off on the 25th, reconciled with payroll first.", "ipa": "/ˈmʌnθli riˈpɔrt kʌts‿ɔf‿ɑn ðə ˈtwɛni fɪfθ, ˈrɛkənˌsaɪld wɪθ ˈpeɪˌroʊl fɝst/"}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 2, "vi": "Bạn có thể cho tôi biết tổng giám đốc quan tâm nhất đến chỉ số nào không?", "en": "Could you tell me which metrics the CEO cares about most?", "ipa": "/kʊd ju tɛl mi wɪtʃ ˈmɛtrɪks ðə si i oʊ kɛrz‿əˈbaʊt moʊst/"}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 2, "vi": "Tôi có thể dành 15 phút trình bày cho bạn trước khi gửi chính thức được không?", "en": "Could I take 15 minutes to walk you through it first?", "ipa": "/kʊd‿aɪ teɪk fɪfˈtin ˈmɪnəts tə wɔk ju θru ɪt fɝst/"}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 2, "vi": "Chi phí nhân sự tăng 6% do lương tối thiểu vùng tăng từ tháng 1.", "en": "Labor costs rose 6% because of January's minimum wage increase.", "ipa": "/ˈleɪbɚ kɑsts roʊz sɪks pərˈsɛnt bɪˈkɔz‿əv ˈdʒænjuˌɛriz ˈmɪnəməm weɪdʒ‿ˌɪnˈkris/"}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 2, "vi": "Nếu bạn trình bày bằng tiếng Anh, tôi sẽ chuẩn bị thêm bản song ngữ.", "en": "If you present in English, I'll prepare a bilingual version.", "ipa": "/ɪf ju ˈprɛzənt‿ɪn‿ˈɪŋɡlɪʃ, aɪl priˈpɛr‿ə baɪˈlɪŋɡwəl ˈvɝʒən/"}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 2, "vi": "Rất tiếc, tuyển dụng sẽ chậm 3 tuần vì hai ứng viên cuối đã từ chối offer.", "en": "Unfortunately, hiring slips three weeks; two finalists declined our offers.", "ipa": "/ənˈfɔrtʃənətli, ˈhaɪrɪŋ slɪps θri wiks; tu ˈfaɪnəlɪsts dɪˈklaɪnd‿aʊɚ ˈɔfɚz/"}, {"topicRaw": "2-Reporting to Manager", "topicName": "Reporting to Manager", "topicOrder": 2, "stage": 2, "vi": "Tôi xác nhận đã nhận góp ý và sẽ gửi bản cuối trước thứ Năm.", "en": "Confirming I got your comments; final version by Thursday.", "ipa": "/kənˈfɝmɪŋ‿aɪ ɡɑt jɚ ˈkɑmɛnts; ˈfaɪnəl ˈvɝʒən baɪ ˈθɝzˌdeɪ/ -Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 3, "vi": "Để tôi làm rõ: hạn chót là 5 giờ chiều, không phải cuối ngày.", "en": "Let me clarify: deadline is 5 PM, not end-of-day.", "ipa": "/lɛt mi ˈklɛrəˌfaɪ: ˈdɛdˌlaɪn‿ɪz faɪv pi ɛm, nɑt‿ɛnd əv deɪ/"}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 3, "vi": "Theo kế hoạch, chúng ta đang chậm 2 ngày so với tiến độ.", "en": "Based on the plan, we're two days behind schedule.", "ipa": "/beɪst‿ɑn ðə plæn, wɪr tu deɪz bɪˈhaɪnd ˈskɛdʒʊl/"}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 3, "vi": "Tôi đề xuất đặt hạn nội bộ sớm hơn hạn chính thức 3 ngày.", "en": "I recommend internal deadlines three days before the official ones.", "ipa": "/aɪ ˌrɛkəˈmɛnd‿ˌɪnˈtɝnəl ˈdɛdˌlaɪnz θri deɪz bɪˈfɔr ði əˈfɪʃəl wʌnz/"}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 3, "vi": "Tôi đề nghị dùng lịch chung để cả team theo dõi hạn chót.", "en": "I'd suggest a shared calendar so everyone tracks deadlines.", "ipa": "/aɪd səˈdʒɛst‿ə ʃɛrd ˈkæləndɚ soʊ ˈɛvriˌwʌn træks ˈdɛdˌlaɪnz/"}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 3, "vi": "Theo tôi, team cần thêm người trong mùa cao điểm.", "en": "In my view, we need extra help during peak season.", "ipa": "/ɪn maɪ vju, wi nid‿ˈɛkstrə hɛlp ˈdʊrɪŋ pik ˈsizən/"}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 3, "vi": "Tôi hiểu ý bạn, nhưng hạn này do pháp luật quy định.", "en": "I see your point, but the law sets this deadline.", "ipa": "/aɪ si jɚ pɔɪnt, bət ðə lɔ sɛts ðɪs ˈdɛdˌlaɪn/"}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 3, "vi": "Có lẽ nên xử lý hạn pháp lý trước, rồi đến hạn nội bộ.", "en": "It might be worth doing legal deadlines first, then internal.", "ipa": "/ɪt maɪt bi wɝθ ˈduɪŋ ˈliɡəl ˈdɛdˌlaɪnz fɝst, ðɛn‿ˌɪnˈtɝnəl/"}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 4, "vi": "Chúng ta chuyển sang tiến độ hạn chót, vì có 2 việc đang trễ.", "en": "Let's turn to deadline status, since two tasks are already behind.", "ipa": "/lɛts tɝn tə ˈdɛdˌlaɪn ˈstæɾəs, sɪns tu tæsks‿ɚ‿ɔlˈrɛdi bɪˈhaɪnd/"}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 4, "vi": "Bạn trình bày tiến độ hiện tại và việc nào đang có rủi ro nhé?", "en": "Would you mind going over the current timeline and which tasks are at risk?", "ipa": "/wʊd ju maɪnd ˈɡoʊɪŋ‿ˈoʊvɚ ðə ˈkɝənt ˈtaɪmlaɪn‿ən wɪtʃ tæsks‿ɚ‿ət rɪsk/"}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 4, "vi": "Tôi muốn nêu lo ngại: chúng ta có thể không kịp hạn chốt lương tuần này.", "en": "I'd like to raise a concern: we may miss this week's payroll cutoff.", "ipa": "/aɪd laɪk tə reɪz‿ə kənˈsɝn: wi meɪ mɪs ðɪs wiks ˈpeɪroʊl ˈkʌtɔf/"}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 4, "vi": "Tôi hiểu team đang quá tải, nhưng hạn này không thể dời.", "en": "I get that the team is overloaded; however, this deadline can't move.", "ipa": "/aɪ ɡɛt ðæt ðə tim‿ɪz‿ˈoʊvɚˌloʊdɪd; haʊˈɛvɚ, ðɪs ˈdɛdˌlaɪn kænt muv/"}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 4, "vi": "Hay chúng ta chia việc cho 2 người để kịp thứ Sáu?", "en": "Would it help if we split the work between two people to finish by Friday?", "ipa": "/wʊd‿ɪt hɛlp‿ɪf wi splɪt ðə wɝk bɪˈtwin tu ˈpipəl tə ˈfɪnɪʃ baɪ ˈfraɪdeɪ/"}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 4, "vi": "Chúng tôi không thể lùi cả dự án, nhưng có thể lùi phần báo cáo.", "en": "We can't delay the whole project, but we can delay the report.", "ipa": "/wi kænt dɪˈleɪ ðə hoʊl ˈprɑdʒɛkt, bət wi kən dɪˈleɪ ðə rɪˈpɔrt/"}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 4, "vi": "Tóm lại, hạn mới là thứ Hai và mỗi việc có người phụ trách rõ.", "en": "To wrap nes", "topicName": "Deadlines", "topicOrder": 3, "stage": 5, "vi": "Nếu không báo trễ sớm, vấn đề sẽ dồn lên quản lý vào phút chót.", "en": "If we fail to flag delays early, the problem lands on the manager's desk at the last minute.", "ipa": "/ɪf wi feɪl tə flæɡ dɪˈleɪz‿ˈɝli, ðə ˈprɑbləm lændz‿ɑn ðə ˈmænɪdʒɚz dɛsk‿ət ðə læst ˈmɪnət/"}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 5, "vi": "Tôi phản đối nhận mọi việc gấp, vì nó làm chậm việc thật sự quan trọng.", "en": "I'd push back on accepting every urgent request, because it delays the work that really matters.", "ipa": "/aɪd pʊʃ bæk‿ɑn‿əkˈsɛptɪŋ‿ˈɛvri ˈɝdʒənt rɪˈkwɛst, bɪˈkɔz‿ɪt dɪˈleɪz ðə wɝk ðæt ˈriəli ˈmæɾɚz/"}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 5, "vi": "Điều tôi lo nhất là cả nhóm phải làm khuya mỗi cuối tháng chỉ để kịp hạn.", "en": "What worries me is that the team works late every month-end just to stay on time.", "ipa": "/wʌt ˈwɝiz mi ɪz ðæt ðə tim wɝks leɪɾ‿ˈɛvri mʌnθ‿ɛnd dʒʌst tə steɪ ɑn taɪm/"}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 5, "vi": "Tôi đề xuất lịch hạn chung, có người phụ trách rõ và nhắc việc tự động.", "en": "My suggestion is a shared deadline calendar with clear owners and automatic reminders.", "ipa": "/maɪ səɡˈdʒɛstʃən‿ɪz‿ə ʃɛrd ˈdɛdˌlaɪn ˈkæləndɚ wɪθ klɪr‿ˈoʊnɚz‿ən‿ˌɔɾəˈmæɾɪk rɪˈmaɪndɚz/"}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 6, "vi": "Đừng để việc hôm nay sang ngày mai.", "en": "Never put off till tomorrow what you can do today.", "ipa": "/ˈnɛvɚ pʊɾ‿ɔf tɪl təˈmɑroʊ wʌt ju kən du təˈdeɪ/"}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 6, "vi": "Hạn chót tạo ra sự tập trung.", "en": "Deadlines create focus.", "ipa": "/ˈdɛdˌlaɪnz kriˈeɪt ˈfoʊkəs/"}, {"topicRaw": "3-Deadlines", "topicName": "Deadlines", "topicOrder": 3, "stage": 6, "vi": "Ba tháng qua, 30% bảng công đến trễ, dồn toàn bộ s rather than personal judgments.", "ipa": "/pliz ˈfoʊkəs‿ɑn spɪˈsɪfɪk bɪˈheɪvjɚz ˈræðɚ ðən ˈpɝsənəl ˈdʒʌdʒmənts/"}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 1, "vi": "Vui lòng không trao đổi việc này với đồng nghiệp trong lúc xác minh.", "en": "Please don't discuss this with colleagues during the investigation.", "ipa": "/pliz doʊnt dɪˈskʌs ðɪs wɪθ ˈkɑliɡz ˈdʊrɪŋ ði ˌɪnˌvɛstəˈɡeɪʃən/"}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 1, "vi": "Tôi xin lỗi vì phản hồi khiếu nại của bạn chậm hơn đã hứa.", "en": "I'm sorry our response took longer than promised.", "ipa": "/aɪm ˈsɑri aʊɚ rɪˈspɑns tʊk ˈlɔŋɡɚ ðæn ˈprɑməst/"}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 1, "vi": "Chúng ta gặp lại sau 2 tuần để đánh giá tiến triển nhé.", "en": "Let's meet again in two weeks to review progress.", "ipa": "/lɛts mit‿əˈɡɛn‿ɪn tu wiks tə ˌriˈvju ˈprɑˌɡrɛs/"}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 2, "vi": "Theo bộ quy tắc ứng xử, khiếu nại quấy rối phải được xử lý trong 5 ngày làm việc.", "en": "Our code requires harassment complaints be addressed within five working days.", "ipa": "/aʊɚ koʊd riˈkwaɪɚz hɚˈæsmənt kəmˈpleɪnts bi əˈdrɛst wɪˈðɪn faɪv ˈwɝkɪŋ deɪz/"}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 2, "vi": "HR gặp riêng từng bên trước, sau đó mới điều phối buổi trao đổi chung nếu phù hợp.", "en": "HR meets each party separately, then a joint talk if appropriate.", "ipa": "/eɪtʃ ɑr mits‿itʃ ˈpɑrti ˈsɛpɚətli, ðɛn‿ə dʒɔɪnt tɔk‿ɪf‿əˈproʊpriət/"}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 2, "vi": "Bạn có thể nêu một ví dụ cụ thể để tôi hiểu rõ hơn không?", "en": "Could you give a specific example so I understand better?", "ipa": "/kʊd ju ɡɪv‿ə spəˈsɪfɪk‿ɪɡˈzæmpəl soʊ aɪ ˌʌndɚˈstænd ˈbɛɾɚ/"}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 2, "vi": "Bạn có phiền ghi lại bằng văn bản nếu sự việc tái diễn không?", "en": "Would you mind keeping a written record if it recurs?", "ipa": "/wʊd ju maɪnd ˈkipɪŋ‿ə ˈrɪɾən rəˈkɔrd‿ɪf‿ɪt rɪˈkɝz/"}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 2, "vi": "Tôi đề nghị có người trung lập tham dự vì căng thẳng đã kéo dài nhiều tuần.", "en": "I'd suggest a neutral third party; tensions have built for weeks.", "ipa": "/aɪd səˈdʒɛst‿ə ˈnutrəl θɝd ˈpɑrti; ˈtɛntʃənz həv bɪlt fɚ wiks/"}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 2, "vi": "Nếu không đạt được thỏa thuận, vụ việc sẽ được chuyển lên ban giám đốc.", "en": "If we can't agree, the case goes to senior management.", "ipa": "/ɪf wi kænt‿əˈɡri, ðə keɪs ɡoʊz tə ˈsinjɚ ˈmænədʒmənt/"}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 2, "vi": "Rất tiếc, bằng chứng hiện có chưa đủ để xác nhận khiếu nại của bạn.", "en": "Unfortunately, the evidence we have isn't sufficient to substantiate your complaint.", "ipa": "/ʌnˈfɔrtʃənətli, ði ˈɛvɪdəns wi hæv‿ˈɪzənt səˈfɪʃənt tə səbˈstæntʃiˌeɪt jɚ kəmˈpleɪnt/"}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 2, "vi": "Tôi sẽ gửi biên bản cho cả hai bên ký xác nhận trước thứ Sáu.", "en": "I'll send the minutes to both parties for signature by Friday.", "ipa": "/aɪl sɛnd ðə ˈmɪnəts tə boʊθ ˈpɑrtiz fɚ ˈsɪɡnətʃɚ baɪ ˈfraɪdeɪ/"}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 3, "vi": "Để tôi giải thích quy trình xử lý khiếu nại gồm những bước nào.", "en": "Let me explain the steps we follow when handling complaints.", "ipa": "/lɛt mi ɪkˈspleɪn ðə stɛps wi ˈfɑloʊ wɛn ˈhændlɪŋ kəmˈpleɪnts/"}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 3, "vi": "Để tôi làm rõ: mục tiêu là giải pháp, không phải đổ lỗi.", "en": "Let me clarify: our goal is a solution, not blame.", "ipa": "/lɛt mi ˈklɛrəˌfaɪ: aʊɚ ɡoʊl‿ɪz‿ə səˈluʃən, nɑt bleɪm/"}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 3, "vi": "Theo những gì tôi nghe, đây là vấn đề giao tiếp.", "en": "Based on what I've heard, this is a communication issue.", "ipa": "/beɪst‿ɑn wʌɾ‿aɪv hɝd, ðɪs‿ɪz‿ə kəmˌjunəˈkeɪʃən‿ˈɪʃu/"}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 3, "vi": "Tôi đề xuất hai bên gặp nhau với HR làm trung gian.", "en": "I recommend a joint meeting with HR as neutral mediator.", "ipa": "/aɪ ˌrɛkəˈmɛnd‿ə dʒɔɪnt ˈmiɾɪŋ wɪθ‿eɪtʃ ɑr‿əz ˈnutrəl ˈmidiˌeɪɾɚ/"}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 3, "vi": "Tôi đề nghị thống nhất lại vai trò của từng người trong dự án.", "en": "I'd suggest clarifying each person's role on the project.", "ipa": "/aɪd səˈdʒɛst ˈklɛrəˌfaɪɪŋ‿itʃ ˈpɝsənz roʊl‿ɑn ðə ˈprɑdʒɛkt/"}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 3, "vi": "Theo tôi, cả hai bên đều có lý, nhưng cách giao tiếp khác nhau.", "en": "In my view, both sides are right but communicate differently.", "ipa": "/ɪn maɪ vju, boʊθ saɪdz‿ɚ raɪt bət kəˈmjunəˌkeɪt ˈdɪfrəntli/"}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 3, "vi": "Tôi hiểu cảm giác của bạn, nhưng cách phản ứng đó chưa phù hợp.", "en": "I understand how you feel, but that reaction wasn't appropriate.", "ipa": "/aɪ ˌʌndɚˈstænd haʊ ju fil, bət ðæt riˈækʃən ˈwʌzənt‿əˈproʊpriət/"}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 3, "vi": "Có lẽ nên tạm chuyển một người sang dự án khác.", "en": "It might be worth temporarily moving someone to another project.", "ipa": "/ɪt maɪt bi wɝθ ˌtɛmpɚˈɛrəli ˈmuvɪŋ ˈsʌmˌwʌn tə əˈnʌðɚ ˈprɑdʒɛkt/"}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 4, "vi": "Chúng ta chuyển sang tình hình của team, vì vấn đề đang lan rộng.", "en": "Let's move on to the team situation, because the issue is starting to spread.", "ipa": "/lɛts muv‿ɑn tə ðə tim ˌsɪtʃuˈeɪʃən, bɪˈkɔz ði ˈɪʃu ɪz ˈstɑrɾɪŋ tə sprɛd/"}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 4, "vi": "Bạn chia sẻ góc nhìn của mình và điều bạn mong muốn được không?", "en": "Can you take us through your perspective and what you'd like to change?", "ipa": "/kæn ju teɪk‿əs θru jɚ pɚˈspɛktɪv‿ən wʌt jud laɪk tə tʃeɪndʒ/"}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 4, "vi": "Có một điều tôi lo: mâu thuẫn này đang ảnh hưởng cả team.", "en": "One thing worries me: this conflict is affecting the whole team.", "ipa": "/wʌn θɪŋ ˈwɝiz mi: ðɪs ˈkɑnflɪkt‿ɪz‿əˈfɛktɪŋ ðə hoʊl tim/"}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 4, "vi": "Tôi hiểu bạn bức xúc, tuy nhiên chúng ta cần tôn trọng nhau.", "en": "I understand you're frustrated; however, we need to stay respectful.", "ipa": "/aɪ ˌʌndɚˈstænd jʊr ˈfrʌstreɪɾɪd; haʊˈɛvɚ, wi nid tə steɪ rɪˈspɛktfəl/"}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 4, "vi": "Hay chúng ta thống nhất quy tắc làm việc chung và rà soát sau 1 tháng?", "en": "How about if we agree on shared working rules and review them after a month?", "ipa": "/haʊ əˈbaʊɾ‿ɪf wi əˈɡri ɑn ʃɛrd ˈwɝkɪŋ rulz‿ən rɪˈvju ðəm‿ˈæftɚ‿ə mʌnθ/"}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 4, "vi": "Chúng tôi không thể đổi quản lý, nhưng có thể hỗ trợ coaching.", "en": "We won't be able to change your manager, but we can offer coaching.", "ipa": "/wi woʊnt bi ˈeɪbəl tə tʃeɪndʒ jɚ ˈmænɪdʒɚ, bət wi kən‿ˈɔfɚ ˈkoʊtʃɪŋ/"}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 4, "vi": "Tóm lại, hai bên đã đồng ý cách làm việc mới.", "en": "To summarize, both sides have agreed on a new way of working.", "ipa": "/tu ˈsʌməˌraɪz, boʊθ saɪdz hæv‿əˈɡrid‿ɑn‿ə nu weɪ əv ˈwɝkɪŋ/"}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 4, "vi": "Bước tiếp theo: HR sẽ gặp lại từng bên sau 2 tuần để kiểm tra tiến triển.", "en": "As a next step, HR will meet each side again in two weeks to check progress.", "ipa": "/æz‿ə nɛkst stɛp, ˌeɪtʃˈɑr wɪl miɾ‿itʃ saɪd‿əˈɡɛn‿ɪn tu wiks tə tʃɛk ˈprɑɡrɛs/"}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 5, "vi": "Thật lòng, né tránh mâu thuẫn nhiều tháng đã khiến việc này khó giải quyết hơn.", "en": "Honestly, avoiding this conflict for months has made the situation much harder to fix.", "ipa": "/ˈɑnəstli, əˈvɔɪdɪŋ ðɪs ˈkɑnflɪkt fɚ mʌnθs hæz meɪd ðə ˌsɪtʃuˈeɪʃən mʌtʃ ˈhɑrdɚ tə fɪks/"}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 5, "vi": "Theo kinh nghiệm, mâu thuẫn thường do vai trò không rõ, không phải do tính cách.", "en": "In my experience, most conflicts at work come from unclear roles, not from bad personalities.", "ipa": "/ɪn maɪ ɪkˈspɪriəns, moʊst ˈkɑnflɪkts‿ət wɝk kʌm frəm‿ʌnˈklɪr roʊlz, nɑt frəm bæd ˌpɝsəˈnæləɾiz/"}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 5, "vi": "Điều quan trọng là tập trung vào vấn đề, không phải ai đúng ai sai.", "en": "What really matters is that we should focus on the issue, not on who is right.", "ipa": "/wʌt ˈriəli ˈmæɾɚz‿ɪz ðæt wi ʃʊd ˈfoʊkəs‿ɑn ði ˈɪʃu, nɑɾ‿ɑn hu ɪz raɪt/"}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 5, "vi": "Rủi ro lớn nhất là người khác bắt đầu chọn phe và cả nhóm bị ảnh hưởng.", "en": "The main risk is that other team members start taking sides and the whole team suffers.", "ipa": "/ðə meɪn rɪsk‿ɪz ðæɾ‿ˈʌðɚ tim ˈmɛmbɚz stɑrt ˈteɪkɪŋ saɪdz‿ən ðə hoʊl tim ˈsʌfɚz/"}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 5, "vi": "Nếu không can thiệp ngay, một trong hai nhân viên giỏi này có thể sẽ nghỉ.", "en": "Unless we step in now, one of these two strong employees will probably resign.", "ipa": "/ənˈlɛs wi stɛp‿ɪn naʊ, wʌn‿əv ðiz tu strɔŋ‿ɪmˈplɔɪiz wɪl ˈprɑbəbli rɪˈzaɪn/"}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 5, "vi": "Tôi phản bác chuyển một người sang nhóm khác trước khi nghe cả hai bên.", "en": "I'd challenge moving one person to another team before we hear both sides.", "ipa": "/aɪd ˈtʃælɪndʒ ˈmuvɪŋ wʌn ˈpɝsən tu əˈnʌðɚ tim bɪˈfɔr wi hɪr boʊθ saɪdz/"}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 5, "vi": "Điều tôi lo nhất là quản lý thấy vấn đề nhưng chọn im lặng.", "en": "What concerns me most is that the manager sees the problem but prefers to stay silent.", "ipa": "/wʌt kənˈsɝnz mi moʊst‿ɪz ðæt ðə ˈmænɪdʒɚ siz ðə ˈprɑbləm bət prɪˈfɝz tə steɪ ˈsaɪlənt/"}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 5, "vi": "Tôi đề xuất họp có điều phối với cả hai người, rồi chốt thỏa thuận bằng văn bản.", "en": "What I'd propose is a facilitated meeting with both people, followed by a clear written agreement.", "ipa": "/wʌɾ‿aɪd prəˈpoʊz‿ɪz‿ə fəˈsɪləˌteɪɾɪd ˈmiɾɪŋ wɪθ boʊθ ˈpipəl, ˈfɑloʊd baɪ ə klɪr ˈrɪɾən‿əˈɡrimənt/"}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 6, "vi": "Một điều nhịn, chín điều lành.", "en": "A moment of patience prevents a lot of trouble.", "ipa": "/ə ˈmoʊmənt‿əv ˈpeɪʃəns prɪˈvɛnts‿ə lɑɾ‿əv ˈtrʌbəl/"}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 6, "vi": "Lắng nghe để hiểu, không phải để trả lời.", "en": "Listen to understand, not to reply.", "ipa": "/ˈlɪsən tu ˌʌndɚˈstænd, nɑt tə rɪˈplaɪ/"}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 6, "vi": "Năm nay có 14 khiếu nại nội bộ, gấp đôi năm ngoái, phần lớn liên quan đến quản lý trực tiếp.", "en": "We logged 14 internal grievances this year, double last year, mostly involving direct managers.", "ipa": "/wi lɔɡd ˈfɔrˈtin‿ɪnˈtɝnəl ˈɡrivənsəz ðɪs jɪr, ˈdʌbəl læst jɪr, ˈmoʊstli ɪnˈvɑlvɪŋ dɪˈrɛkt ˈmænɪdʒɚz/"}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 6, "vi": "Mâu thuẫn không được xử lý thường dẫn đến nghỉ việc và có thể leo thang thành tranh chấp lao động.", "en": "Unresolved conflicts tend to drive resignations and can escalate into formal labor disputes.", "ipa": "/ənrɪˈzɑlvd ˈkɑnflɪkts tɛnd tə draɪv ˌrɛzɪɡˈneɪʃənz‿ən kən‿ˈɛskəˌleɪɾ‿ˈɪntu ˈfɔrməl ˈleɪbɚ dɪˈspjuts/"}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 6, "vi": "Im lặng không có nghĩa là đồng ý.", "en": "Silence doesn't mean agreement.", "ipa": "/ˈsaɪləns ˈdʌzənt min‿əˈɡrimənt/"}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 6, "vi": "Ở những nhóm có quản lý đã học kỹ năng xử lý xung đột, khiếu nại giảm gần một nửa.", "en": "In teams whose managers completed conflict training, grievances dropped by almost half.", "ipa": "/ɪn timz huz ˈmænɪdʒɚz kəmˈpliɾɪd ˈkɑnflɪkt ˈtreɪnɪŋ, ˈɡrivənsəz drɑpt baɪ ˈɔlmoʊst hæf/"}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 6, "vi": "Tôi đề xuất 2 buổi đào tạo cho 25 quản lý cấp trung trong quý tới, chi phí khoảng 60 triệu.", "en": "I recommend two training sessions for our 25 middle managers next quarter, costing about 60 million VND.", "ipa": "/aɪ ˌrɛkəˈmɛnd tu ˈtreɪnɪŋ ˈsɛʃənz fɚ‿ˈaʊɚ ˈtwɛntiˌfaɪv ˈmɪdəl ˈmænɪdʒɚz nɛkst ˈkwɔrtɚ, ˈkɔstɪŋ‿əˈbaʊt ˈsɪksti ˈmɪljən ˌviɛnˈdi/"}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 6, "vi": "Mục tiêu là xử lý mọi khiếu nại trong 10 ngày và giảm 30% số vụ vào cuối năm.", "en": "Our aim is to resolve every grievance within 10 days and cut cases by 30% by year-end.", "ipa": "/ˈaʊɚ‿eɪm‿ɪz tə rɪˈzɑlv‿ˈɛvri ˈɡrivəns wɪˈθɪn tɛn deɪz‿ən kʌt ˈkeɪsɪz baɪ ˈθɝɾi pɚˈsɛnt baɪ jɪr‿ɛnd/"}, every weekend.", "ipa": "/maɪ ˈbɪɡɪst kənˈsɝn‿ɪz ðæt ˈmænɪdʒɚz sɛɾ‿ə bæd‿ɪɡˈzæmpəl baɪ ˈwɝkɪŋ‿ˈɛvri ˈwikɛnd/"}, {"topicRaw": "7-Work-life Balance", "topicName": "Work-life Balance", "topicOrder": 7, "stage": 5, "vi": "Tôi đề xuất quy định rõ về liên lạc ngoài giờ, quản lý phải làm gương trước.", "en": "My recommendation is a clear after-hours contact policy, and managers must follow it first.", "ipa": "/maɪ ˌrɛkəmɛnˈdeɪʃən‿ɪz‿ə klɪr‿ˈæftɚ‿ˈaʊɚz ˈkɑntækt ˈpɑləsi, ən ˈmænɪdʒɚz mʌst ˈfɑloʊ ɪt fɝst/"}, {"topicRaw": "7-Work-life Balance", "topicName": "Work-life Balance", "topicOrder": 7, "stage": 6, "vi": "Làm việc chăm chỉ, nghỉ ngơi đúng lúc.", "en": "Work hard, rest well.", "ipa": "/wɝk hɑrd, rɛst wɛl/"}, {"topicRaw": "7-Work-life Balance", "topicName": "Work-life Balance", "topicOrder": 7, "stage": 6, "vi": "Không thể rót nước từ một chiếc cốc rỗng.", "en": "You can't pour from an empty cup.", "ipa": "/ju kænt pɔr frəm‿ən‿ˈɛmpti kʌp/"}, {"topicRaw": "7-Work-life Balance", "topicName": "Work-life Balance", "topicOrder": 7, "stage": 6, "vi": "40% nhân viên còn hơn 8 ngày phép vào tháng 10, cho thấy mọi người không dám nghỉ.", "en": "Forty percent of staff still had over eight leave days in October, which suggests people don't feel able to rest.", "ipa": "/ˈfɔrti pɚˈsɛnt‿əv stæf stɪl hæd‿ˈoʊvɚ‿eɪt liv deɪz‿ɪn‿ɑkˈtoʊbɚ, wɪtʃ səˈdʒɛsts ˈpipəl doʊnt fil‿ˈeɪbəl tə rɛst/"}, {"topicRaw": "7-Work-life Balance", "topicName": "Work-life Balance", "topicOrder": 7, "stage": 6, "vi": "Kiệt sức kéo dài làm tăng nghỉ ốm và nghỉ việc, tốn kém hơn nhiều so với một tuần nghỉ phép.", "en": "Prolonged burnout drives up sick leave and turnover, which costs far more than a week of holiday.", "ipa": "/prəˈlɔŋd ˈbɝnaʊt draɪvz‿ʌp sɪk liv‿ən ˈtɝˌnoʊvɚ, wɪtʃ kɔsts fɑr mɔr ðən‿ə wik‿əv ˈhɑlədeɪ/"}, {"topicRaw": "7-Work-life Balance", "topicName": "Work-life Balance", "topicOrder": 7, "stage": 6, "vi": "Sếp làm gương, team làm theo.", "en": "Teams follow what leaders do.", "ipa": "/timz ˈfɑloʊ wʌ ", "ipa": "/ˈɑnəstli, ðə ˈkændɪdəɾ‿ˈænsɚd wɛl, bəɾ‿aɪ ˈdɪdənt hɪr‿ˈɛni ˈkɑnkrit rɪˈzʌlts frəm hɝ pæst roʊlz/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 5, "vi": "Theo kinh nghiệm, ứng viên biết đặt câu hỏi hay thường hòa nhập nhanh hơn.", "en": "In my experience, candidates who ask smart questions usually adapt faster after joining.", "ipa": "/ɪn maɪ ɪkˈspɪriəns, ˈkændɪdəts hu æsk smɑrt ˈkwɛstʃənz ˈjuʒuəli əˈdæpt ˈfæstɚ‿ˈæftɚ ˈdʒɔɪnɪŋ/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 5, "vi": "Điều quan trọng là kỹ năng đào tạo được, còn thái độ khó thay đổi hơn nhiều.", "en": "What really matters is that skills can be trained, but attitude is much harder to change.", "ipa": "/wʌt ˈriəli ˈmæɾɚz‿ɪz ðæt skɪlz kən bi treɪnd, bəɾ‿ˈæɾɪˌtud‿ɪz mʌtʃ ˈhɑrdɚ tə tʃeɪndʒ/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 5, "vi": "Rủi ro lớn nhất là tuyển vội, vì tuyển sai tốn hơn nhiều so với để trống.", "en": "The main risk is hiring too fast, because a wrong hire costs far more than an empty seat.", "ipa": "/ðə meɪn rɪsk‿ɪz ˈhaɪɚɪŋ tu fæst, bɪˈkɔz‿ə rɔŋ haɪɚ kɔsts fɑr mɔr ðən‿ən‿ˈɛmpti sit/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 5, "vi": "Nếu không phản hồi trong 1 tuần, ứng viên giỏi sẽ nhận offer nơi khác.", "en": "Unless we reply to candidates within a week, the best ones will accept other offers.", "ipa": "/ənˈlɛs wi rɪˈplaɪ tə ˈkændɪdəts wɪˈθɪn‿ə wik, ðə bɛst wʌnz wɪl‿əkˈsɛpt‿ˈʌðɚ‿ˈɔfɚz/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 5, "vi": "Tôi phản bác đánh giá ứng viên qua giọng tiếng Anh thay vì năng lực thật.", "en": "I'd challenge judging candidates by their English accent rather than their actual skills.", "ipa": "/aɪd ˈtʃælɪndʒ ˈdʒʌdʒɪŋ ˈkændɪdəts baɪ ðɛr‿ˈɪŋɡlɪʃ‿ˈæksɛnt ˈræðɚ ðən ðɛr‿ˈæktʃuəl skɪlz/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 5, "vi": "Điều tôi lo nhất là mỗi người phỏng vấn dùng tiêu chí khác nhau cho cùng vị trí.", "en": "What concerns me most is that each interviewer uses different criteria for the same role.", "ipa": "/wʌt kənˈsɝnz mi moʊst‿ɪz ðæɾ‿itʃ‿ˈɪntɚˌvjuɚ ˈjuzɪz ˈdɪfɚənt kraɪˈtɪriə fɚ ðə seɪm roʊl/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 5, "vi": "Tôi đề xuất phỏng vấn có cấu trúc, cùng bộ câu hỏi chính cho mọi ứng viên.", "en": "What I'd propose is a structured interview with the same core questions for every candidate.", "ipa": "/wʌɾ‿aɪd prəˈpoʊz‿ɪz‿ə ˈstrʌktʃɚd‿ˈɪntɚvju wɪθ ðə seɪm kɔr ˈkwɛstʃənz fɚ‿ˈɛvri ˈkændɪdət/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 6, "vi": "Tuyển chậm, sa thải nhanh.", "en": "Hire slow, fire fast.", "ipa": "/haɪɚ sloʊ, faɪɚ fæst/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 6, "vi": "Tuyển vì thái độ, đào tạo kỹ năng.", "en": "Hire for attitude, train for skills.", "ipa": "/haɪɚ fɚ‿ˈæɾɪˌtud, treɪn fɚ skɪlz/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 6, "vi": "Thời gian tuyển trung bình là 45 ngày, và 1/3 ứng viên giỏi rút lui trước vòng cuối.", "en": "Our average time-to-hire is 45 days, and a third of strong candidates drop out before the final round.", "ipa": "/ˈaʊɚ‿ˈævərɪdʒ taɪm tə haɪɚ‿ɪz ˈfɔrtiˌfaɪv deɪz, ən‿ə θɝd‿əv strɔŋ ˈkændɪdəts drɑp‿aʊt bɪˈfɔr ðə ˈfaɪnəl raʊnd/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 6, "vi": "Nếu quy trình vẫn chậm, chúng ta sẽ tiếp tục mất người giỏi vào tay đối thủ nhanh hơn.", "en": "If the process stays this slow, we'll keep losing top talent to competitors who move faster.", "ipa": "/ɪf ðə ˈprɑsɛs steɪz ðɪs sloʊ, wil kip ˈluzɪŋ tɑp ˈtælənt tə kəmˈpɛɾɪɾɚz hu muv ˈfæstɚ/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 6, "vi": "Câu hỏi hay mang lại câu trả lời thật.", "en": "Good questions get honest answers.", "ipa": "/ɡʊd ˈkwɛstʃənz ɡɛɾ‿ˈɑnəst‿ˈænsɚz/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 6, "vi": "Đối thủ chính chốt offer trong khoảng 3 tuần, nhanh gấp đôi chúng ta.", "en": "Our main competitor closes offers in about three weeks, twice as fast as we do.", "ipa": "/ˈaʊɚ meɪn kəmˈpɛɾɪɾɚ ˈkloʊzɪz‿ˈɔfɚz‿ɪn‿əˈbaʊt θri wiks, twaɪs‿əz fæst‿əz wi du/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 6, "vi": "Tôi đề xuất gộp 2 vòng phỏng vấn chuyên môn, rút thời gian tuyển xuống còn 25 ngày.", "en": "I propose merging the two technical rounds, which would cut time-to-hire to 25 days.", "ipa": "/aɪ prəˈpoʊz ˈmɝdʒɪŋ ðə tu ˈtɛknɪkəl raʊndz, wɪtʃ wʊd kʌt taɪm tə haɪɚ tə ˈtwɛntiˌfaɪv deɪz/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 6, "vi": "Năm sau, mục tiêu là tỷ lệ nhận offer đạt 85% và mọi ứng viên được phản hồi trong 48 giờ.", "en": "Next year, we're targeting an 85% offer acceptance rate and 48-hour feedback for every candidate.", "ipa": "/nɛkst jɪr, wɪr ˈtɑrɡəɾɪŋ‿ən‿ˈeɪɾi faɪv pɚˈsɛnt‿ˈɔfɚ‿ækˈsɛptəns reɪɾ‿ən ˈfɔrti eɪɾ‿aʊɚ ˈfidbæk fɚ‿ˈɛvri ˈkændɪdət/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 1, "vi": "Tôi đã đính kèm phiếu đánh giá năng lực của cả 3 ứng viên.", "en": "I've attached the competency scorecards for all three candidates.", "ipa": "/aɪv‿əˈtætʃt ðə ˈkɑmpəɾənsi ˈskɔrˌkɑrdz fɚ‿ɔl θri ˈkændɪdəts/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview rview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 1, "vi": "Tôi sẽ chuyển quyết định của bạn và bắt đầu soạn offer.", "en": "I'll relay your decision and start drafting the offer.", "ipa": "/aɪl ˈriˌleɪ jɚ dɪˈsɪʒən‿ən stɑrt ˈdræftɪŋ ði ˈɔfɚ/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 2, "vi": "Theo quy định, mọi quyết định tuyển dụng cần ít nhất 2 phiếu đánh giá độc lập.", "en": "Per policy, every hiring decision needs at least two independent scorecards.", "ipa": "/pɝ ˈpɑləsi, ˈɛvri ˈhaɪrɪŋ dɪˈsɪʒən nidz‿ət list tu ˌɪndɪˈpɛndənt ˈskɔrˌkɑrdz/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 2, "vi": "Sau vòng cuối, HR tổng hợp điểm, kiểm tra tham chiếu, rồi trình duyệt offer.", "en": "After the final round: HR consolidates scores, checks references, submits offer.", "ipa": "/ˈæftɚ ðə ˈfaɪnəl raʊnd: eɪtʃ ɑr kənˈsɑlɪˌdeɪts skɔrz, tʃɛks ˈrɛfɚənsɪz, ˌsʌbˈmɪts‿ˈɔfɚ/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 2, "vi": "Bạn có thể giải thích vì sao bạn chấm ứng viên này thấp ở tiêu chí giao tiếp không?", "en": "Could you explain why you scored this candidate low on communication?", "ipa": "/kʊd ju ɪkˈspleɪn waɪ ju skɔrd ðɪs ˈkændɪdət loʊ ɑn kəmˌjunəˈkeɪʃən/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 2, "vi": "Bạn có phiền tránh hỏi về kế hoạch kết hôn hay sinh con không? Đó là phân biệt đối xử.", "en": "Would you mind avoiding marriage or family-plan questions? They're discriminatory.", "ipa": "/wʊd ju maɪnd‿əˈvɔɪdɪŋ ˈmɛrɪdʒ‿ɚ ˈfæməli plæn ˈkwɛstʃənz ðɛr dɪˈskrɪmənəˌtɔri/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 2, "vi": "Tôi đề nghị thêm vòng 3 vì điểm của hai người phỏng vấn chênh nhau nhiều.", "en": "I'd suggest a third round; the two interviewers' scores differ widely.", "ipa": "/aɪd səˈdʒɛst‿ə θɝd raʊnd; ðə tu ˈɪnɾɚˌvjuɚz skɔrz ˈdɪfɚ ˈwaɪdli/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 2, "vi": "Nếu muốn trả cao hơn khung, bạn cần giám đốc duyệt ngoại lệ.", "en": "To offer above the range, you need director exception approval.", "ipa": "/tə ˈɔfɚ əˈbʌv ðə reɪndʒ, ju nid dɚˈɛktɚ ɪkˈsɛpʃən‿əˈpruvəl/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 2, "vi": "Rất tiếc, ứng viên bạn chọn đã nhận offer ở nơi khác sáng nay.", "en": "Unfortunately, your preferred candidate accepted another offer this morning.", "ipa": "/ʌnˈfɔrtʃənətli, jɚ prəˈfɝd ˈkændɪdəɾ‿əkˈsɛptɪd‿əˈnʌðɚ‿ˈɔfɚ ðɪs ˈmɔrnɪŋ/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 2, "vi": "Tôi sẽ gửi bạn danh sách dự phòng trước thứ Tư để không lỡ tiến độ.", "en": "I'll send the backup shortlist by Wednesday to stay on schedule.", "ipa": "/aɪl sɛnd ðə ˈbæˌkʌp ˈʃɔrtˌlɪst baɪ ˈwɛnzdi tə steɪ ɑn ˈskɛdʒʊl/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 3, "vi": "Để tôi giải thích cách dùng bảng chấm điểm cho từng tiêu chí.", "en": "Let me explain how to use the scorecard per competency.", "ipa": "/lɛt mi ɪkˈspleɪn haʊ tə jus ðə ˈskɔrˌkɑrd pɝ ˈkɑmpətɪnsi/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 3, "vi": "Để tôi làm rõ: \"chưa phù hợp\" cần đi kèm lý do cụ thể.", "en": "Let me clarify: \"not a fit\" needs a specific reason.", "ipa": "/lɛt mi ˈklɛrəˌfaɪ: nɑt‿ə fɪt nidz‿ə spəˈsɪfɪk ˈrizən/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 3, "vi": "Theo điểm đánh giá, ứng viên B cao hơn ở cả 4 tiêu chí.", "en": "Based on scores, candidate B leads on all four criteria.", "ipa": "/beɪst‿ɑn skɔrz, ˈkændədeɪt bi lidz‿ɑn‿ɔl fɔr kraɪˈtɪriə/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 3, "vi": "Tôi đề xuất phỏng vấn theo cặp để giảm thiên kiến cá nhân.", "en": "I recommend paired interviews to reduce individual bias in hiring.", "ipa": "/aɪ ˌrɛkəˈmɛnd pɛrd‿ˈɪntɚˌvjuz tə rəˈdus‿ˌɪndəˈvɪdʒəwəl ˈbaɪəs‿ɪn ˈhaɪrɪŋ/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 3, "vi": "Tôi đề nghị phản hồi ứng viên trong vòng 48 giờ sau phỏng vấn.", "en": "I'd suggest giving candidates feedback within 48 hours of interviews.", "ipa": "/aɪd səˈdʒɛst ˈɡɪvɪŋ ˈkændədeɪts ˈfidˌbæk wɪˈðɪn ˈfɔrɾi eɪt‿ˈaʊɚz‿əv‿ˈɪntɚˌvjuz/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 3, "vi": "Theo tôi, thái độ học hỏi quan trọng hơn kinh nghiệm ở đây.", "en": "In my view, learning attitude matters more than experience here.", "ipa": "/ɪn maɪ vju, ˈlɝnɪŋ‿ˈæɾəˌtud ˈmæɾɚz mɔr ðæn‿ɪkˈspɪriəns hɪr/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 3, "vi": "Tôi hiểu bạn cần người gấp, nhưng tuyển sai còn tốn hơn.", "en": "I understand the urgency, but a wrong hire costs more.", "ipa": "/aɪ ˌʌndɚˈstænd ði ˈɝdʒənsi, bət‿ə rɔŋ ˈhaɪɚ kɑsts mɔr/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 3, "vi": "Có lẽ nên thêm 1 bài tập tình huống ở vòng cuối.", "en": "It might be worth adding a final-round case exercise.", "ipa": "/ɪt maɪt bi wɝθ‿ˈædɪŋ‿ə ˈfaɪnəl raʊnd keɪs‿ˈɛksɚˌsaɪz/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 4, "vi": "Chúng ta chuyển sang nhận xét 3 ứng viên vòng cuối cho vị trí quản lý kinh doanh.", "en": "Let's turn to feedback on the three finalists for the sales manager role.", "ipa": "/lɛts tɝn tə ˈfidbæk‿ɑn ðə θri ˈfaɪnəlɪsts fɚ ðə seɪlz ˈmænɪdʒɚ roʊl/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 4, "vi": "Bạn trình bày điểm đánh giá và lý do chính được không?", "en": "Would you mind going over your scores and the main reasons behind them?", "ipa": "/wʊd ju maɪnd ˈɡoʊɪŋ‿ˈoʊvɚ jɚ skɔrz‿ən ðə meɪn ˈrizənz bɪˈhaɪnd ðɛm/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 4, "vi": "Tôi muốn nêu lo ngại: 2 người phỏng vấn cho ứng viên này điểm rất khác nhau.", "en": "I'd like to raise a concern: two interviewers gave this candidate very different scores.", "ipa": "/aɪd laɪk tə reɪz‿ə kənˈsɝn: tu ˈɪntɚˌvjuɚz ɡeɪv ðɪs ˈkændɪdət ˈvɛri ˈdɪfɚənt skɔrz/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 4, "vi": "Tôi hiểu bạn thích ứng viên này, nhưng cần bằng chứng cụ thể.", "en": "I get that you like this candidate; however, we need evidence, not just a feeling.", "ipa": "/aɪ ɡɛt ðæt ju laɪk ðɪs ˈkændɪdət; haʊˈɛvɚ, wi nid‿ˈɛvɪdəns, nɑt dʒʌst‿ə ˈfilɪŋ/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 4, "vi": "Hay mời 2 ứng viên tốt nhất làm thêm vòng bài tập tình huống ngắn?", "en": "Would it help if we invite the top two candidates to a short case study round?", "ipa": "/wʊd‿ɪt hɛlp‿ɪf wi ɪnˈvaɪt ðə tɑp tu ˈkændɪdəts tu ə ʃɔrt keɪs ˈstʌdi raʊnd/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 4, "vi": "Không thể nâng khung lương, nhưng có thể thưởng khi nhận việc.", "en": "We can't raise the salary range, but we can offer a sign-on bonus.", "ipa": "/wi kænt reɪz ðə ˈsæləri reɪndʒ, bət wi kən‿ˈɔfɚ‿ə saɪn‿ɑn ˈboʊnəs/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 4, "vi": "Tóm lại, ứng viên A là lựa chọn đầu tiên, ứng viên B là dự phòng.", "en": "To wrap up, candidate A is our first choice, and candidate B is the backup.", "ipa": "/tu ræp‿ʌp, ˈkændɪdəɾ‿eɪ ɪz‿ˈaʊɚ fɝst tʃɔɪs, ən ˈkændɪdət bi ɪz ðə ˈbækʌp/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 4, "vi": "Sau buổi họp này, HR kiểm tra tham chiếu và gửi offer trước thứ Năm.", "en": "After this meeting, HR will check references and send the offer by Thursday.", "ipa": "/ˈæftɚ ðɪs ˈmiɾɪŋ, ˌeɪtʃˈɑr wɪl tʃɛk ˈrɛfrənsɪz‿ən sɛnd ði ˈɔfɚ baɪ ˈθɝzdeɪ/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 5, "vi": "Thật lòng, nhận xét chỉ ghi phù hợp, tôi cần ví dụ cụ thể để phản hồi ứng viên.", "en": "Honestly, your feedback just says good fit, but I need specific examples to share with the candidate.", "ipa": "/ˈɑnəstli, jɚ ˈfidbæk dʒʌst sɛz ɡʊd fɪt, bəɾ‿aɪ nid spɪˈsɪfɪk‿ɪɡˈzæmpəlz tə ʃɛr wɪθ ðə ˈkændɪdət/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 5, "vi": "Theo kinh nghiệm, quản lý ghi chép khi phỏng vấn thường quyết định công bằng hơn.", "en": "What I've seen is that managers who take notes during interviews make fairer hiring decisions.", "ipa": "/wʌɾ‿aɪv sin‿ɪz ðæt ˈmænɪdʒɚz hu teɪk noʊts ˈdʊrɪŋ‿ˈɪntɚvjuz meɪk ˈfɛrɚ ˈhaɪɚɪŋ dɪˈsɪʒənz/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 5, "vi": "Mấu chốt là tuyển theo nhu cầu vị trí, không theo cảm tình cá nhân.", "en": "The bottom line is that we hire for the role's needs, not for personal chemistry.", "ipa": "/ðə ˈbɑɾəm laɪn‿ɪz ðæt wi haɪɚ fɚ ðə roʊlz nidz, nɑt fɚ ˈpɝsənəl ˈkɛmɪstri/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 5, "vi": "Rủi ro lớn nhất là mất ứng viên giỏi vì phản hồi mất hơn 1 tuần.", "en": "The biggest risk here is losing a strong candidate because the feedback took over a week.", "ipa": "/ðə ˈbɪɡɪst rɪsk hɪr‿ɪz ˈluzɪŋ‿ə strɔŋ ˈkændɪdət bɪˈkɔz ðə ˈfidbæk tʊk‿ˈoʊvɚ‿ə wik/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 5, "vi": "Nếu không thống nhất tiêu chí trước, mọi tranh luận sau đó sẽ thành chuyện cá nhân.", "en": "If we fail to agree on criteria before interviews, every debate afterward becomes personal.", "ipa": "/ɪf wi feɪl tu əˈɡri ɑn kraɪˈtɪriə bɪˈfɔr‿ˈɪntɚvjuz, ˈɛvri dɪˈbeɪɾ‿ˈæftɚwɚd bɪˈkʌmz ˈpɝsənəl/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 5, "vi": "Tôi phản đối loại cô ấy vì thừa kinh nghiệm, khi rõ ràng cô ấy muốn vị trí.", "en": "I'd push back on rejecting her as overqualified, since she clearly wants this role.", "ipa": "/aɪd pʊʃ bæk‿ɑn rɪˈdʒɛktɪŋ hɝ‿əz‿ˌoʊvɚˈkwɑləˌfaɪd, sɪns ʃi ˈklɪrli wɑnts ðɪs roʊl/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 5, "vi": "Điều tôi lo nhất là chúng ta cứ tuyển người suy nghĩ giống hệt cả nhóm.", "en": "What worries me is that we keep hiring people who think exactly like the team.", "ipa": "/wʌt ˈwɝiz mi ɪz ðæt wi kip ˈhaɪɚɪŋ ˈpipəl hu θɪŋk‿ɪɡˈzæktli laɪk ðə tim/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 5, "vi": "Tôi đề xuất phiếu chấm điểm đơn giản, mỗi người phỏng vấn điền trong 24 giờ.", "en": "My suggestion is a simple scorecard that every interviewer fills in within 24 hours.", "ipa": "/maɪ səɡˈdʒɛstʃən‿ɪz‿ə ˈsɪmpəl ˈskɔrˌkɑrd ðæɾ‿ˈɛvri ˈɪntɚˌvjuɚ fɪlz‿ɪn wɪˈθɪn ˌtwɛntiˈfɔr‿ˈaʊɚz/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 6, "vi": "Tuyển đúng người là quyết định quan trọng nhất của quản lý.", "en": "Hiring the right person is a manager's most important decision.", "ipa": "/ˈhaɪɚɪŋ ðə raɪt ˈpɝsən‿ɪz‿ə ˈmænɪdʒɚz moʊst‿ɪmˈpɔrɾənt dɪˈsɪʒən/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 6, "vi": "Dữ liệu tốt hơn cảm giác.", "en": "Evidence beats gut feeling.", "ipa": "/ˈɛvɪdəns bits ɡʌt ˈfilɪŋ/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 6, "vi": "30% người mới nghỉ trong 6 tháng đầu, và phần lớn chỉ được một người phỏng vấn.", "en": "Thirty percent of new hires left within six months, and most had been assessed by a single interviewer.", "ipa": "/ˈθɝɾi pɚˈsɛnt‿əv nu haɪɚz lɛft wɪˈθɪn sɪks mʌnθs, ən moʊst hæd bɪn‿əˈsɛst baɪ ə ˈsɪŋɡəl‿ˈɪntɚˌvjuɚ/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 6, "vi": "Một quyết định tuyển sai có thể tốn đến gấp 3 lần lương năm của vị trí đó.", "en": "A bad hire can cost up to three times the position's annual salary.", "ipa": "/ə bæd haɪɚ kən kɔst‿ʌp tə θri taɪmz ðə pəˈzɪʃənz‿ˈænjuəl ˈsæləri/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 6, "vi": "Đa dạng góc nhìn giúp quyết định tốt hơn.", "en": "Diverse r KPIs link to annual goals.", "ipa": "/lɛt mi ɪkˈspleɪn haʊ jɚ keɪ pi aɪz lɪŋk tə ˈænjuəl ɡoʊlz/"}, {"topicRaw": "11-KPI & Performance", "topicName": "KPI & Performance", "topicOrder": 11, "stage": 3, "vi": "Để tôi làm rõ: điểm 3 nghĩa là đạt yêu cầu, không phải kém.", "en": "Let me clarify: 3 means \"meets expectations\", not poor.", "ipa": "/lɛt mi ˈklɛrəˌfaɪ: θri minz mits‿ˌɛkspɛkˈteɪʃənz, nɑt pur/"}, {"topicRaw": "11-KPI & Performance", "topicName": "KPI & Performance", "topicOrder": 11, "stage": 3, "vi": "Theo dữ liệu quý này, team bạn đạt 4/5 KPI.", "en": "Quarterly data shows your team hit four of five KPIs.", "ipa": "/ˈkwɔrtɚli ˈdeɪɾə ʃoʊz jɚ tim hɪt fɔr‿əv faɪv keɪ pi aɪz/"}, {"topicRaw": "11-KPI & Performance", "topicName": "KPI & Performance", "topicOrder": 11, "stage": 3, "vi": "Tôi đề xuất trao đổi 1-1 hằng tháng thay vì chỉ cuối năm.", "en": "I recommend monthly one-on-ones instead of only year-end reviews.", "ipa": "/aɪ ˌrɛkəˈmɛnd ˈmʌnθli wʌn ɑn wʌnz‿ˌɪnˈstɛd‿əv‿ˈoʊnli jɪr ɛnd riˈvjuz/"}, {"topicRaw": "11-KPI & Performance", "topicName": "KPI & Performance", "topicOrder": 11, "stage": 3, "vi": "Tôi đề nghị thêm KPI phát triển nhân sự cho quản lý năm sau.", "en": "I'd suggest a people-development KPI for line managers next year.", "ipa": "/aɪd səˈdʒɛst‿ə ˈpipəl dɪˈvɛləpmənt keɪ pi aɪ fɚ laɪn ˈmænədʒɚz nɛkst jɪr/"}, {"topicRaw": "11-KPI & Performance", "topicName": "KPI & Performance", "topicOrder": 11, "stage": 3, "vi": "Theo tôi, KPI nên đo kết quả, không chỉ đo khối lượng việc.", "en": "In my view, KPIs should measure outcomes, not just workload.", "ipa": "/ɪn maɪ vju, keɪ pi aɪz ʃʊd ˈmɛʒɚ ˈaʊtˌkʌmz, nɑt dʒʌst ˈwɝˌkloʊd/"}, {"topicRaw": "11-KPI & Performance", "topicName": "KPI & Performance", "topicOrder": 11, "stage": 3, "vi": "Tôi hiểu ý bạn, nhưng mục tiêu này đã được ban giám đốc duyệt.", "en": "I see your point, but the board approved these targets.", "ipa": "/aɪ si jɚ pɔɪnt, bət ðə bɔrd‿əˈpruvd ðiz ˈtɑrɡəts/"}, {"topicRaw": "11-KPI & Performance", "topicName": "KPI & Performance", "topicOrder": 11, "stage": 3, "vi": "Có lẽ nên cân chỉnh điểm giữa các phòng trước khi chốt.", "en": "It might be worth calibrating scores across departments before finalizing.", "ipa": "/ɪt maɪt bi wɝθ ˈkælɪˌbreɪɾɪŋ skɔrz‿əˈkrɔs dɪˈpɑrtmənts bɪˈfɔr ˈfaɪnəˌlaɪzɪŋ/"}, {"topicRaw": "11-KPI & Performance", "topicName": "KPI & Performance", "topicOrder": 11, "stage": 4, "vi": "Chúng ta chuyển sang kết quả đánh giá, vì sắp phải chốt thưởng.", "en": "Let's move on to the review results, since bonus decisions are due soon.", "ipa": "/lɛts muv‿ɑn tə ðə rɪˈvju rɪˈzʌlts, sɪns ˈboʊnəs dɪˈsɪʒənz‿ɚ du sun/"}, {"topicRaw": "11-KPI & Performance", "topicName": "KPI & Performance", "topicOrder": 11, "stage": 4, "vi": "Bạn trình bày phân bổ điểm năm nay của từng phòng ban nhé?", "en": "Can you take us through the rating distribution for each department this year?", "ipa": "/kæn ju teɪk‿əs θru ðə ˈreɪɾɪŋ ˌdɪstrəˈbjuʃən fɚ‿itʃ dɪˈpɑrtmənt ðɪs jɪr/"}, {"topicRaw": "11-KPI & Performance", "topicName": "KPI & Performance", "topicOrder": 11, "stage": 4, "vi": "Có một điều tôi lo: 60% phòng kinh doanh được điểm cao nhất.", "en": "One thing worries me: 60% of the sales team received the top rating.", "ipa": "/wʌn θɪŋ ˈwɝiz mi: ˈsɪksti pɚˈsɛnt‿əv ðə seɪlz tim rɪˈsivd ðə tɑp ˈreɪɾɪŋ/"}, {"topicRaw": "11-KPI & Performance", "topicName": "KPI & Performance", "topicOrder": 11, "stage": 4, "vi": "Tôi hiểu quản lý muốn động viên team, tuy nhiên điểm cần công bằng.", "en": "I understand managers want to motivate people; however, ratings must stay fair.", "ipa": "/aɪ ˌʌndɚˈstænd ˈmænɪdʒɚz wɑnt tə ˈmoʊɾəˌveɪt ˈpipəl; haʊˈɛvɚ, ˈreɪɾɪŋz mʌst steɪ fɛr/"}, {"topicRaw": "11-KPI & Performance", "topicName": "KPI & Performance", "topicOrder": 11, "stage": 4, "vi": "Hay chúng ta tổ chức buổi cân chỉnh điểm với tất cả quản lý trước hạn chốt?", "en": "How about if we held a calibration session with all managers before the deadline?", "ipa": "/haʊ əˈbaʊɾ‿ɪf wi hɛld‿ə ˌkæl
