opicRaw": "14-Benefits", "topicName": "Benefits", "topicOrder": 14, "stage": 3, "vi": "Tôi đề nghị gửi bản tóm tắt phúc lợi 1 trang cho người mới.", "en": "I'd suggest sending every new joiner a one-page summary of their benefits.", "ipa": "/aɪd səˈdʒɛst ˈsɛndɪŋ‿ˈɛvri nu ˈdʒɔɪnɚ‿ə wʌn peɪdʒ ˈsʌmɚi əv ðɛr ˈbɛnɪfɪts/"}, {"topicRaw": "14-Benefits", "topicName": "Benefits", "topicOrder": 14, "stage": 3, "vi": "Theo tôi, nhân viên quý sự linh hoạt hơn quà tặng hay voucher.", "en": "In my view, employees value flexibility more than gifts or vouchers.", "ipa": "/ɪn maɪ vju, ɪmˈplɔɪiz ˈvælju ˌflɛksəˈbɪləɾi mɔr ðən ɡɪfts‿ɚ ˈvaʊtʃɚz/"}, {"topicRaw": "14-Benefits", "topicName": "Benefits", "topicOrder": 14, "stage": 3, "vi": "Tôi hiểu, nhưng phúc lợi mới sẽ tăng chi phí cố định.", "en": "I see your point, but a new benefit adds permanent fixed costs.", "ipa": "/aɪ si jɚ pɔɪnt, bəɾ‿ə nu ˈbɛnəfɪɾ‿ædz ˈpɝmənənt fɪkst kɔsts/"}, {"topicRaw": "14-Benefits", "topicName": "Benefits", "topicOrder": 14, "stage": 3, "vi": "Có lẽ nên khảo sát nhân viên trước khi đổi nhà bảo hiểm.", "en": "It might be worth surveying employees before we switch insurance providers.", "ipa": "/ɪt maɪt bi wɝθ sɚˈveɪɪŋ‿ɪmˈplɔɪiz bɪˈfɔr wi swɪtʃ‿ɪnˈʃʊrəns prəˈvaɪdɚz/"}, {"topicRaw": "14-Benefits", "topicName": "Benefits", "topicOrder": 14, "stage": 4, "vi": "Chúng ta chuyển sang gia hạn bảo hiểm, vì hợp đồng hết hạn tháng sau.", "en": "Let's move on to the insurance renewal, since the contract expires next month.", "ipa": "/lɛts muv‿ɑn tə ði ɪnˈʃʊrəns rɪˈnuəl, sɪns ðə ˈkɑntrækt‿ɪkˈspaɪɚz nɛkst mʌnθ/"}, {"topicRaw": "14-Benefits", "topicName": "Benefits", "topicOrder": 14, "stage": 4, "vi": "Bạn trình bày 3 báo giá và điểm khác nhau chính nhé?", "en": "Can you take us through the three quotes and their key differences?", "ipa": "/kæn ju teɪk‿əs θru ðə θri kwoʊts‿ən ðɛr ki ˈdɪfɚənsɪz/"}, {"topicRaw": "14-Benefits", "topicName": "Benefits", "topicOrder": 14, "stage": 4, "vi": "Có một điều tôi lo: phí bảo hiểm năm sau tăng 20%.", "en": "One thing worries me: next year's premium is going up by 20%.", "ipa": "/wʌn θɪŋ ˈwɝiz mi: nɛkst jɪrz ˈprimiəm‿ɪz ˈɡoʊɪŋ‿ʌp baɪ ˈtwɛnti pɚˈsɛnt/"}, {"topicRaw": "14-Benefits", "topicName": "Benefits", "topicOrder": 14, "stage": 4, "vi": "Tôi hiểu cần tiết kiệm, tuy nhiên cắt gói sức khỏe sẽ ảnh hưởng tinh thần.", "en": "I understand we need savings; however, cutting health cover would hurt morale.", "ipa": "/aɪ ˌʌndɚˈstænd wi nid ˈseɪvɪŋz; haʊˈɛvɚ, ˈkʌɾɪŋ hɛlθ ˈkʌvɚ wʊd hɝt məˈræl/"}, {"topicRaw": "14-Benefits", "topicName": "Benefits", "topicOrder": 14, "stage": 4, "vi": "Hay chúng ta giữ gói cơ bản và cho nhân viên tự mua thêm?", "en": "How about if we keep the basic plan and let staff buy extra cover?", "ipa": "/haʊ əˈbaʊɾ‿ɪf wi kip ðə ˈbeɪsɪk plæn‿ən lɛt stæf baɪ ˈɛkstrə ˈkʌvɚ/"}, {"topicRaw": "14-Benefits", "topicName": "Benefits", "topicOrder": 14, "stage": 4, "vi": "Không thể giữ nguyên mức phí, nhưng có thể đàm phán giảm 10%.", "en": "We can't keep the same premium, but we can negotiate a 10% discount.", "ipa": "/wi kænt kip ðə seɪm ˈprimiəm, bət wi kən nəˈɡoʊʃiˌeɪt‿ə tɛn pərˈsɛnt dɪˈskaʊnt/"}, {"topicRaw": "14-Benefits", "topicName": "Benefits", "topicOrder": 14, "stage": 4, "vi": "Tóm lại, chúng ta giữ nhà bảo hiểm cũ nếu họ giảm phí.", "en": "To summarize, we'll stay with our current insurer if they lower the premium.", "ipa": "/tu ˈsʌməˌraɪz, wil steɪ wɪθ‿ˈaʊɚ ˈkɝənt‿ɪnˈʃʊrɚ‿ɪf ðeɪ ˈloʊɚ ðə ˈprimiəm/"}, {"topicRaw": "14-Benefits", "topicName": "Benefits", "topicOrder": 14, "stage": 4, "vi": "Bước tiếp theo: HR gửi đề xuất cuối cho CFO trước thứ Năm.", "en": "Next step: HR sends the final proposal to the CFO by Thursday.", "ipa": "/nɛkst stɛp: eɪtʃ ɑr sɛndz ðə ˈfaɪnəl prəˈpoʊzəl tə ðə si ɛf oʊ baɪ ˈθɝzˌdeɪ/"}, {"topicRaw": "14-Benefits", "topicName": "Benefits", "topicOrder": 14, "stage": 5, "vi": "Thật lòng, nhiều nhân viên không biết nửa số phúc lợi công ty đang trả.", "en": "Honestly, many employees don't know half of the benefits we already pay for.", "ipa": "/ˈɑnəstli, ˈmɛni ɪmˈplɔɪiz doʊnt noʊ hæf‿əv ðə ˈbɛnɪfɪts wi ɔlˈrɛdi peɪ fɔr/"}, {"topicRaw": "14-Benefits", "topicName": "Benefits", "topicOrder": 14, "stage": 5, "vi": "Theo kinh nghiệm, phúc lợi linh hoạt được quý hơn phúc lợi đắt mà không ai chọn.", "en": "In my experience, flexible benefits are valued more than expensive ones that nobody chose.", "ipa": "/ɪn maɪ ɪkˈspɪriəns, ˈflɛksəbəl ˈbɛnɪfɪts‿ɚ ˈvæljud mɔr ðən‿ɪkˈspɛnsɪv wʌnz ðæt ˈnoʊbɑdi tʃoʊz/"}, {"topicRaw": "14-Benefits", "topicName": "Benefits", "topicOrder": 14, "stage": 5, "vi": "Điều quan trọng là phúc lợi chỉ có giá trị khi nhân viên hiểu và thật sự dùng.", "en": "What matters is that employees understand and actually use each benefit.", "ipa": "/wʌt ˈmæɾɚz‿ɪz ðət‿ɛmˈplɔɪiz‿ˌʌndɚˈstænd‿ən‿ˈækˌtʃuəli jus‿itʃ ˈbɛnəfɪt/"}, {"topicRaw": "14-Benefits", "topicName": "Benefits", "topicOrder": 14, "stage": 5, "vi": "Rủi ro lớn nhất là phí bảo hiểm sức khỏe năm sau tăng 20%, làm căng ngân sách.", "en": "The main risk: health insurance premiums rise 20% next year and squeeze our budget.", "ipa": "/ðə meɪn rɪsk: hɛlθ‿ˌɪnˈʃʊrəns ˈprimiəmz raɪz ˈtwɛni pərˈsɛnt nɛkst jɪr‿ən skwiz‿aʊɚ ˈbʌdʒɪt/"}, {"topicRaw": "14-Benefits", "topicName": "Benefits", "topicOrder": 14, "stage": 5, "vi": "Nếu không truyền thông phúc lợi tốt hơn, chúng ta tốn tiền mà không giữ được người.", "en": "Unless we communicate benefits better, we'll keep spending money without improving retention.", "ipa": "/ənˈlɛs wi kəˈmjunəkeɪt ˈbɛnɪfɪts ˈbɛɾɚ, wil kip ˈspɛndɪŋ ˈmʌni wɪˈθaʊɾ‿ɪmˈpruvɪŋ rɪˈtɛnʃən/"}, {"topicRaw": "14-Benefits", "topicName": "Benefits", "topicOrder": 14, "stage": 5, "vi": "Tôi phản bác cắt gói sức khỏe, vì đó là phúc lợi nhân viên quý nhất.", "en": "I'd challenge cutting the health package, because it's the benefit staff value most.", "ipa": "/aɪd ˈtʃælɪndʒ ˈkʌɾɪŋ ðə hɛlθ ˈpækɪdʒ, bɪˈkɔz‿ɪts ðə ˈbɛnəfɪt stæf ˈvælju moʊst/"}, {"topicRaw": "14-Benefits", "topicName": "Benefits", "topicOrder": 14, "stage": 5, "vi": "Điều tôi lo nhất là nhân viên thời vụ gần như không có phúc lợi dù làm cùng việc.", "en": "What concerns me most is that contract staff get almost no benefits.", "ipa": "/wʌt kənˈsɝnz mi moʊst‿ɪz ðət ˈkɑnˌtrækt stæf ɡɛt‿ˈɔlˌmoʊst noʊ ˈbɛnəfɪts/"}, {"topicRaw": "14-Benefits", "topicName": "Benefits", "topicOrder": 14, "stage": 5, "vi": "Tôi đề xuất khảo sát phúc lợi hằng năm để đầu tư đúng vào điều nhân viên cần.", "en": "What I'd propose is an annual benefits survey to invest in what people want.", "ipa": "/wʌt‿aɪd prəˈpoʊz‿ɪz‿ən‿ˈænjuəl ˈbɛnəfɪts sɚˈveɪ tə ˌɪnˈvɛst‿ɪn wʌt ˈpipəl wɑnt/"}, {"topicRaw": "14-Benefits", "topicName": "Benefits", "topicOrder": 14, "stage": 6, "vi": "Sức khỏe là vốn quý nhất.", "en": "Health is wealth.", "ipa": "/hɛlθ‿ɪz wɛlθ/"}, {"topicRaw": "14-Benefits", "topicName": "Benefits", "topicOrder": 14, "stage": 6, "vi": "Phúc lợi tốt nói lên công ty quan tâm thế nào.", "en": "Good benefits show how much we care.", "ipa": "/ɡʊd ˈbɛnɪfɪts ʃoʊ haʊ mʌtʃ wi kɛr/"}, {"topicRaw": "14-Benefits", "topicName": "Benefits", "topicOrder": 14, "stage": 6, "vi": "Phúc lợi chiếm 12% tổng chi phí nhân sự, nhưng chỉ 40% nhân viên hiểu rõ quyền lợi của mình.", "en": "Benefits are 12% of people costs, yet only 40% of employees understand them.", "ipa": "/ˈbɛnəfɪts‿ɚ twɛlv pərˈsɛnt‿əv ˈpipəl kɑsts, jɛt‿ˈoʊnli ˈfɔrɾi pərˈsɛnt‿əv‿ɛmˈplɔɪiz‿ˌʌndɚˈstænd ðɛm/"}, {"topicRaw": "14-Benefits", "topicName": "Benefits", "topicOrder": 14, "stage": 6, "vi": "Nếu nhân viên không thấy giá trị, phúc lợi chỉ là chi phí và không giúp giữ người.", "en": "If employees don't see the value, benefits become pure cost with no retention effect.", "ipa": "/ɪf‿ɪmˈplɔɪiz doʊnt si ðə ˈvælju, ˈbɛnɪfɪts bɪˈkʌm pjʊr kɔst wɪθ noʊ rɪˈtɛnʃən‿ɪˈfɛkt/"}, {"topicRaw": "14-Benefits", "topicName": "Benefits", "topicOrder": 14, "stage": 6, "vi": "Đúng nhu cầu quan trọng hơn nhiều lựa chọn.", "en": "The right fit beats more options.", "ipa": "/ðə raɪt fɪt bits mɔr‿ˈɑpʃənz/"}, {"topicRaw": "14-Benefits", "topicName": "Benefits", "topicOrder": 14, "stage": 6, "vi": "Các công ty có phúc lợi linh hoạt ghi nhận mức hài lòng cao hơn khoảng 25%.", "en": "Companies with flexible benefits report satisfaction scores roughly 25% higher.", "ipa": "/ˈkʌmpəniz wɪθ ˈflɛksəbəl ˈbɛnɪfɪts rɪˈpɔrt ˌsæɾəsˈfækʃən skɔrz ˈrʌfli ˈtwɛntiˌfaɪv pɚˈsɛnt ˈhaɪɚ/"}, {"topicRaw": "14-Benefits", "topicName": "Benefits", "topicOrder": 14, "stage": 6, "vi": "Tôi đề xuất chuyển sang phúc lợi linh hoạt với cùng ngân sách, kèm buổi giới thiệu cho từng phòng.", "en": "I propose flexible benefits within the same budget, with a briefing for each department.", "ipa": "/aɪ prəˈpoʊz ˈflɛksəbəl ˈbɛnəfɪts wɪˈðɪn ðə seɪm ˈbʌdʒɪt, wɪθ‿ə ˈbrifɪŋ fɚ itʃ dɪˈpɑrtmənt/"}, {"topicRaw": "14-Benefits", "topicName": "Benefits", "topicOrder": 14, "stage": 6, "vi": "Đến cuối năm sau, mục tiêu là 80% nhân viên hiểu và dùng ít nhất 3 phúc lợi.", "en": "By next year-end, we want 80% of staff using at least three benefits.", "ipa": "/baɪ nɛkst jɪr ɛnd, wi wɑnt‿ˈeɪɾi pərˈsɛnt‿əv stæf ˈjuzɪŋ‿ət list θri ˈbɛnəfɪts/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 1, "vi": "Từ tháng 7, khối vận hành sẽ báo cáo trực tiếp cho giám đốc vận hành.", "en": "From July, the operations division will report directly to the COO.", "ipa": "/frəm ˌdʒuˈlaɪ, ði ˌɑpəˈreɪʃənz dɪˈvɪʒən wɪl rɪˈpɔrt dɪˈrɛktli tə ðə ˌsioʊˈoʊ/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 1, "vi": "Sơ đồ tổ chức mới gồm 4 khối và 18 phòng ban.", "en": "The new org chart has four divisions and 18 departments.", "ipa": "/ðə nu ɔrɡ tʃɑrt hæz fɔr dɪˈvɪʒənz‿ən‿eɪˈtin dɪˈpɑrtmənts/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 1, "vi": "Sau tái cấu trúc, bạn quản lý trực tiếp bao nhiêu người?", "en": "How many direct reports do you have after the restructuring?", "ipa": "/haʊ ˈmɛni dɪˈrɛkt rɪˈpɔrts du ju hæv‿ˈæftɚ ðə riˈstrʌktʃɚɪŋ/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 1, "vi": "Vị trí này báo cáo trực tiếp hay gián tiếp cho giám đốc khu vực?", "en": "Is this role's link to the regional director a solid or dotted line?", "ipa": "/ɪz ðɪs roʊlz lɪŋk tə ðə ˈridʒənəl dəˈrɛktɚ‿ə ˈsɑlɪd‿ɚ ˈdɑɾəd laɪn/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 1, "vi": "Vui lòng cập nhật mô tả công việc theo cơ cấu mới trước cuối tháng.", "en": "Please update job descriptions to reflect the new structure by month-end.", "ipa": "/pliz‿ʌpˈdeɪt dʒɑb dɪˈskrɪpʃənz tə rɪˈflɛkt ðə nu ˈstrʌktʃɚ baɪ mʌnθ‿ɛnd/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 1, "vi": "Vui lòng giữ sơ đồ tổ chức dự thảo trong nhóm dự án.", "en": "Please keep the draft org chart within the project team for now.", "ipa": "/pliz kip ðə dræft‿ɔrɡ tʃɑrt wɪˈθɪn ðə ˈprɑdʒɛkt tim fɚ naʊ/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 1, "vi": "Xin lỗi, sơ đồ gửi hôm qua vẫn còn tên người đã nghỉ việc.", "en": "Sorry, yesterday's chart still listed people who have already left.", "ipa": "/ˈsɑri, ˈjɛstɚdeɪz tʃɑrt stɪl ˈlɪstɪd ˈpipəl hu hæv‿ɔlˈrɛdi lɛft/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 1, "vi": "Tôi sẽ gửi sơ đồ cập nhật cùng ma trận phân quyền trong tuần.", "en": "I'll circulate the updated chart and the delegation matrix this week.", "ipa": "/aɪl ˈsɝkjəˌleɪt ði ʌpˈdeɪɾɪd tʃɑrɾ‿ən ðə ˌdɛləˈɡeɪʃən ˈmeɪtrɪks ðɪs wik/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 2, "vi": "Theo luật, thay đổi cơ cấu ảnh hưởng nhiều người phải có phương án sử dụng lao động.", "en": "By law, restructuring that affects many employees requires a formal labor utilization plan.", "ipa": "/baɪ lɔ, riˈstrʌktʃɚɪŋ ðæɾ‿əˈfɛkts ˈmɛni ɪmˈplɔɪiz riˈkwaɪɚz‿ə ˈfɔrməl ˈleɪbɚ ˌjuɾələˈzeɪʃən plæn/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 2, "vi": "Thay đổi cơ cấu phải qua phân tích tác động và tham vấn công đoàn trước khi thông báo.", "en": "Structural changes go through impact analysis and union consultation before any announcement.", "ipa": "/ˈstrʌktʃɚəl ˈtʃeɪndʒɪz ɡoʊ θru ˈɪmpækt‿əˈnæləsɪs‿ən ˈjunjən ˌkɑnsəlˈteɪʃən bɪˈfɔr‿ˈɛni əˈnaʊnsmənt/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 2, "vi": "Bạn có thể xác nhận ai sẽ duyệt chi phí sau khi gộp phòng không?", "en": "Could you confirm who will hold budget approval after the departments merge?", "ipa": "/kʊd ju kənˈfɝm hu wɪl hoʊld ˈbʌdʒɪɾ‿əˈpruvəl‿ˈæftɚ ðə dɪˈpɑrtmənts mɝdʒ/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 2, "vi": "Bạn có phiền gặp từng nhân viên bị ảnh hưởng trước khi thông báo chung không?", "en": "Would you mind meeting each affected employee before the general announcement?", "ipa": "/wʊd ju maɪnd ˈmiɾɪŋ‿itʃ‿əˈfɛktɪd‿ɪmˈplɔɪi bɪˈfɔr ðə ˈdʒɛnɚəl‿əˈnaʊnsmənt/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 2, "vi": "Chúng tôi gộp 2 nhóm vì chức năng trùng lặp và chi phí quản lý cao.", "en": "We're merging the two teams because their roles overlap and overhead is high.", "ipa": "/wɪr ˈmɝdʒɪŋ ðə tu timz bɪˈkɔz ðɛr roʊlz‿ˈoʊvɚˌlæp‿ən‿ˈoʊvɚˈhɛd‿ɪz haɪ/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 2, "vi": "Nếu vị trí của bạn bị ảnh hưởng, HR sẽ ưu tiên xem xét bố trí công việc khác.", "en": "If your role is affected, HR will look at redeployment options first.", "ipa": "/ɪf jɚ roʊl‿ɪz‿əˈfɛktɪd, ˌeɪtʃˈɑr wɪl lʊk‿ət ˌridɪˈplɔɪmənt‿ˈɑpʃənz fɝst/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 2, "vi": "Rất tiếc, vị trí của bạn không còn trong cơ cấu mới, chúng ta cùng bàn phương án hỗ trợ.", "en": "Unfortunately, your role no longer exists in the new structure; let's discuss support options.", "ipa": "/ənˈfɔrtʃənətli, jɚ roʊl noʊ ˈlɔŋɡɚ ɪɡˈzɪsts‿ɪn ðə nu ˈstrʌktʃɚ; lɛts dɪˈskʌs səˈpɔrt‿ˈɑpʃənz/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 2, "vi": "Tôi sẽ giám sát việc bàn giao và cập nhật tiến độ cho bạn mỗi tuần.", "en": "I'll oversee the handover and give you a weekly progress update.", "ipa": "/aɪl‿ˈoʊvɚˌsi ðə ˈhændoʊvɚ‿ən ɡɪv ju ə ˈwikli ˈprɑɡrɛs‿ʌpˈdeɪt/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 3, "vi": "Để tôi giải thích vì sao cơ cấu mới có 3 khối.", "en": "Let me explain why the new structure is organized into three divisions.", "ipa": "/lɛt mi ɪkˈspleɪn waɪ ðə nu ˈstrʌktʃɚ‿ɪz‿ˈɔrɡəˌnaɪzd‿ˈɪntu θri dɪˈvɪʒənz/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 3, "vi": "Để tôi làm rõ: không ai mất việc trong đợt này.", "en": "Let me clarify: no one will lose their job in this restructuring.", "ipa": "/lɛt mi ˈklɛrəˌfaɪ: noʊ wʌn wɪl luz ðɛr dʒɑb‿ɪn ðɪs riˈstrʌktʃɚɪŋ/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 3, "vi": "Theo phân tích, 2 phòng đang làm trùng 30% công việc.", "en": "Based on our analysis, two departments overlap on about 30% of their work.", "ipa": "/beɪst‿ɑn‿ˈaʊɚ‿əˈnæləsɪs, tu dɪˈpɑrtmənts‿ˈoʊvɚˌlæp‿ɑn‿əˈbaʊt ˈθɝɾi pɚˈsɛnt‿əv ðɛr wɝk/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 3, "vi": "Tôi đề xuất gộp 2 nhóm hành chính thành một trung tâm dịch vụ chung.", "en": "I recommend merging the two admin teams into a single shared service.", "ipa": "/aɪ ˌrɛkəˈmɛnd ˈmɝdʒɪŋ ðə tu ˈædmɪn timz‿ˈɪntu ə ˈsɪŋɡəl ʃɛrd ˈsɝvɪs/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 3, "vi": "Tôi đề nghị báo quản lý trước rồi mới công bố cho nhân viên.", "en": "I'd suggest briefing managers before announcing the change to employees.", "ipa": "/aɪd səˈdʒɛst ˈbrifɪŋ ˈmænɪdʒɚz bɪˈfɔr‿əˈnaʊnsɪŋ ðə tʃeɪndʒ tu ɪmˈplɔɪiz/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 3, "vi": "Theo tôi, cơ cấu cần đi theo chiến lược, không theo con người.", "en": "In my view, our structure should follow strategy, not individual personalities.", "ipa": "/ɪn maɪ vju, ˈaʊɚ ˈstrʌktʃɚ ʃʊd ˈfɑloʊ ˈstræɾədʒi, nɑɾ‿ˌɪndəˈvɪdʒuəl ˌpɝsəˈnæləɾiz/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 3, "vi": "Tôi hiểu, nhưng thêm 1 cấp quản lý sẽ làm chậm quyết định.", "en": "I see your point, but adding another layer will slow down decisions.", "ipa": "/aɪ si jɚ pɔɪnt, bəɾ‿ˈædɪŋ‿əˈnʌðɚ ˈleɪɚ wɪl sloʊ daʊn dɪˈsɪʒənz/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 3, "vi": "Có lẽ nên thử cơ cấu mới ở 1 khối trước.", "en": "It might be worth piloting the new structure in one division first.", "ipa": "/ɪt maɪt bi wɝθ ˈpaɪləɾɪŋ ðə nu ˈstrʌktʃɚ‿ɪn wʌn dɪˈvɪʒən fɝst/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 4, "vi": "Chúng ta chuyển sang cơ cấu mới, vì phải công bố trước quý sau.", "en": "Let's turn to the new structure, since we must announce it before next quarter.", "ipa": "/lɛts tɝn tə ðə nu ˈstrʌktʃɚ, sɪns wi mʌst‿əˈnaʊns‿ɪt bɪˈfɔr nɛkst ˈkwɔrɾɚ/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 4, "vi": "Bạn trình bày tuyến báo cáo mới của từng khối nhé?", "en": "Would you mind going over the new reporting lines for each division?", "ipa": "/wʊd ju maɪnd ˈɡoʊɪŋ‿ˈoʊvɚ ðə nu rɪˈpɔrɾɪŋ laɪnz fɚ‿itʃ dɪˈvɪʒən/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 4, "vi": "Tôi muốn nêu lo ngại: 4 người sẽ báo cáo cho 2 quản lý cùng lúc.", "en": "I'd like to raise a concern: four people would report to two managers.", "ipa": "/aɪd laɪk tə reɪz‿ə kənˈsɝn: fɔr ˈpipəl wʊd riˈpɔrt tə tu ˈmænədʒɚz/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 4, "vi": "Tôi hiểu cần thay đổi nhanh, tuy nhiên nhân viên cần thời gian thích nghi.", "en": "I get that we need to move fast; however, people need time to adjust.", "ipa": "/aɪ ɡɛt ðæt wi nid tə muv fæst; haʊˈɛvɚ, ˈpipəl nid taɪm tu əˈdʒʌst/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 4, "vi": "Hay chúng ta chuyển đổi theo 2 giai đoạn trong 6 tháng?", "en": "Would it help to roll out the change in two phases over six months?", "ipa": "/wʊd‿ɪt hɛlp tə roʊl‿aʊt ðə tʃeɪndʒ‿ɪn tu ˈfeɪzəz‿ˈoʊvɚ sɪks mʌnθs/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 4, "vi": "Không thể giữ cả 2 trưởng phòng, nhưng có thể tạo vai trò chuyên gia.", "en": "We can't keep both head positions, but we can create a senior expert role.", "ipa": "/wi kænt kip boʊθ hɛd pəˈzɪʃənz, bət wi kən kriˈeɪɾ‿ə ˈsinjɚ‿ˈɛkspɚt roʊl/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 4, "vi": "Tóm lại, cơ cấu mới áp dụng từ quý 1 với 3 khối chính.", "en": "To wrap up, the new structure starts in Q1 with three main divisions.", "ipa": "/tu ræp‿ʌp, ðə nu ˈstrʌktʃɚ stɑrts‿ɪn ˌkjuˈwʌn wɪθ θri meɪn dɪˈvɪʒənz/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 4, "vi": "Sau buổi họp này, HR gặp từng quản lý bị ảnh hưởng trong tuần này.", "en": "After this meeting, HR will meet each affected manager individually this week.", "ipa": "/ˈæftɚ ðɪs ˈmiɾɪŋ, ˌeɪtʃˈɑr wɪl miɾ‿itʃ‿əˈfɛktɪd ˈmænɪdʒɚ‿ˌɪndəˈvɪdʒuəli ðɪs wik/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 5, "vi": "Thật lòng, cơ cấu quá nhiều tầng nên quyết định mất hàng tuần thay vì hàng ngày.", "en": "To be frank, too many layers mean decisions take weeks instead of days.", "ipa": "/tə bi fræŋk, tu ˈmɛni ˈleɪɚz min dɪˈsɪʒənz teɪk wiks‿ˌɪnˈstɛd‿əv deɪz/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 5, "vi": "Theo kinh nghiệm, tái cơ cấu thất bại khi nhân viên nghe tin đồn trước.", "en": "What I've seen is that restructuring fails when people hear rumors first.", "ipa": "/wʌt‿aɪv sin‿ɪz ðət riˈstrʌktʃɚɪŋ feɪlz wɛn ˈpipəl hir ˈrumɚz fɝst/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 5, "vi": "Mấu chốt là cơ cấu phải đi theo chiến lược, không phải ngược lại.", "en": "The bottom line is that structure should follow strategy, not the other way around.", "ipa": "/ðə ˈbɑɾəm laɪn‿ɪz ðæt ˈstrʌktʃɚ ʃʊd ˈfɑloʊ ˈstræɾədʒi, nɑt ði ˈʌðɚ weɪ əˈraʊnd/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 5, "vi": "Rủi ro lớn nhất là mất người giỏi khi chuyển đổi vì vai trò mới không rõ.", "en": "The biggest risk is losing key people during the transition if roles are unclear.", "ipa": "/ðə ˈbɪɡəst rɪsk‿ɪz ˈluzɪŋ ki ˈpipəl ˈdʊrɪŋ ðə trænˈzɪʃən‿ɪf roʊlz‿ɚ ənˈklɪr/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 5, "vi": "Nếu tuyến báo cáo không rõ, nhân viên sẽ nhận chỉ đạo trái ngược từ hai quản lý.", "en": "If we don't clarify reporting lines, people will get conflicting instructions.", "ipa": "/ɪf wi doʊnt ˈklɛrəˌfaɪ riˈpɔrtɪŋ laɪnz, ˈpipəl wɪl ɡɛt kənˈflɪktɪŋ‿ˌɪnˈstrʌkʃənz/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 5, "vi": "Tôi phản đối công bố cơ cấu mới trước khi trao đổi với các quản lý liên quan.", "en": "I'd push back on announcing the structure before talking to the affected managers.", "ipa": "/aɪd pʊʃ bæk‿ɑn‿əˈnaʊnsɪŋ ðə ˈstrʌktʃɚ bɪˈfɔr ˈtɔkɪŋ tə ði əˈfɛktɪd ˈmænədʒɚz/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 5, "vi": "Điều tôi lo nhất là 2 phòng đang làm cùng việc nhưng mục tiêu khác nhau.", "en": "What worries me is that two departments do the same work with different targets.", "ipa": "/wʌt ˈwɝiz mi ɪz ðət tu dɪˈpɑrtmənts du ðə seɪm wɝk wɪθ ˈdɪfɚənt ˈtɑrɡəts/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 5, "vi": "Tôi đề xuất triển khai thay đổi theo từng giai đoạn, bắt đầu với một nhóm thử nghiệm.", "en": "My suggestion is to roll out in phases, starting with a small pilot team.", "ipa": "/maɪ səˈdʒɛstʃən‿ɪz tə roʊl‿aʊt‿ɪn ˈfeɪzəz, ˈstɑrtɪŋ wɪθ‿ə smɔl ˈpaɪlət tim/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 6, "vi": "Cơ cấu theo sau chiến lược.", "en": "Structure follows strategy.", "ipa": "/ˈstrʌktʃɚ ˈfɑloʊz ˈstræɾədʒi/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 6, "vi": "Thay đổi là điều duy nhất không đổi.", "en": "Change is the only constant.", "ipa": "/tʃeɪndʒ‿ɪz ði ˈoʊnli ˈkɑnstənt/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 6, "vi": "Từ nhân viên đến CEO có 6 cấp, nên mỗi quyết định mất trung bình 2 tuần.", "en": "Six layers separate frontline staff from the CEO, so decisions take two weeks.", "ipa": "/sɪks ˈleɪɚz ˈsɛpɚˌeɪt ˈfrʌntˌlaɪn stæf frəm ðə si i oʊ, soʊ dɪˈsɪʒənz teɪk tu wiks/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 6, "vi": "Quá nhiều tầng nấc sẽ làm chậm phản ứng với thị trường và giữ chi phí quản lý ở mức cao.", "en": "Too many layers slow our response to the market and keep overhead costs high.", "ipa": "/tu ˈmɛni ˈleɪɚz sloʊ aʊɚ rɪˈspɑns tə ðə ˈmɑrkət‿ən kip‿ˈoʊvɚˈhɛd kɑsts haɪ/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 6, "vi": "Ít cấp hơn, quyết định nhanh hơn.", "en": "Fewer layers, faster decisions.", "ipa": "/ˈfjuɚ ˈleɪɚz, ˈfæstɚ dɪˈsɪʒənz/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 6, "vi": "Các đối thủ cùng quy mô chỉ có 4 cấp, khoảng 1 quản lý cho 8 nhân viên.", "en": "Competitors our size run four layers, with roughly one manager for every eight staff.", "ipa": "/kəmˈpɛɾɪɾɚz‿ˈaʊɚ saɪz rʌn fɔr ˈleɪɚz, wɪθ ˈrʌfli wʌn ˈmænɪdʒɚ fɚ‿ˈɛvri eɪt stæf/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 6, "vi": "Tôi đề xuất giảm còn 4 cấp trong 12 tháng, tiết kiệm khoảng 7% chi phí quản lý.", "en": "I propose reducing to four layers over 12 months, saving about 7% in overhead.", "ipa": "/aɪ prəˈpoʊz rəˈdusɪŋ tə fɔr ˈleɪɚz‿ˈoʊvɚ twɛlv mʌnθs, ˈseɪvɪŋ‿əˈbaʊt ˈsɛvən pɚˈsɛnt‿ɪn‿ˈoʊvɚˈhɛd/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 6, "vi": "Mục tiêu là mọi quyết định vận hành được chốt trong 3 ngày làm việc.", "en": "The goal is for every operational decision to be made within three working days.", "ipa": "/ðə ɡoʊl‿ɪz fɚ‿ˈɛvri ˌɑpəˈreɪʃənəl dɪˈsɪʒən tə bi meɪd wɪˈθɪn θri ˈwɝkɪŋ deɪz/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 1, "vi": "Theo Bộ luật Lao động, hợp đồng xác định thời hạn không quá 36 tháng.", "en": "Under the Labor Code, a fixed-term contract can't exceed 36 months.", "ipa": "/ˈʌndɚ ðə ˈleɪbɚ koʊd, ə fɪkst tɝm ˈkɑntrækt kænt‿ɪkˈsid ˈθɝɾi sɪks mʌnθs/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 1, "vi": "Hợp đồng của bạn có điều khoản bảo mật kéo dài 2 năm sau khi nghỉ việc.", "en": "Your contract has a confidentiality clause that lasts two years after you leave.", "ipa": "/jɚ ˈkɑntrækt hæz‿ə ˌkɑnfɪˌdɛnʃiˈæləɾi klɔz ðæt læsts tu jɪrz‿ˈæftɚ ju liv/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 1, "vi": "Đây là hợp đồng xác định thời hạn hay không xác định thời hạn?", "en": "Is this a fixed-term contract or an indefinite one?", "ipa": "/ɪz ðɪs‿ə fɪkst tɝm ˈkɑntrækt‿ɚ‿ən‿ɪnˈdɛfənət wʌn/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 1, "vi": "Bạn đã ký phụ lục điều chỉnh lương có hiệu lực từ tháng 1 chưa?", "en": "Have you signed the salary amendment annex effective January?", "ipa": "/hæv ju saɪnd ðə ˈsæləri əˈmɛndmənt‿ˈænɛks‿ɪˈfɛktɪv ˈdʒænjuˌɛri/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 1, "vi": "Vui lòng ký và gửi lại 1 bản hợp đồng gốc trong vòng 3 ngày.", "en": "Please sign and return one original copy of the contract within three days.", "ipa": "/pliz saɪn‿ən rɪˈtɝn wʌn‿əˈrɪdʒənəl ˈkɑpi əv ðə ˈkɑntrækt wɪˈθɪn θri deɪz/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 1, "vi": "Vui lòng đọc kỹ các điều khoản thử việc trước khi ký.", "en": "Please read the probation terms carefully before signing.", "ipa": "/pliz rid ðə proʊˈbeɪʃən tɝmz ˈkɛrfəli bɪˈfɔr ˈsaɪnɪŋ/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 1, "vi": "Xin lỗi, hợp đồng của bạn ghi sai chức danh, chúng tôi sẽ phát hành lại.", "en": "Sorry, your contract shows the wrong job title; we'll reissue it.", "ipa": "/ˈsɑri, jɚ ˈkɑntrækt ʃoʊz ðə rɔŋ dʒɑb ˈtaɪɾəl; wil riˈɪʃu ɪt/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 1, "vi": "Tôi sẽ gửi bạn bản scan khi hai bên đã ký đầy đủ.", "en": "I'll email you a scanned copy once both parties have signed.", "ipa": "/aɪl‿ˈimeɪl ju ə skænd ˈkɑpi wʌns boʊθ ˈpɑrtiz hæv saɪnd/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 2, "vi": "Nếu vẫn tiếp tục làm việc sau khi hết hạn, trong 30 ngày phải ký hợp đồng mới.", "en": "If work continues after expiry, a new contract must be signed within 30 days.", "ipa": "/ɪf wɝk kənˈtɪnjuz‿ˈæftɚ‿ɪkˈspaɪri, ə nu ˈkɑntrækt mʌst bi saɪnd wɪˈθɪn ˈθɝɾi deɪz/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 2, "vi": "Gia hạn cần quản lý đề xuất trước 45 ngày, HR soạn thảo và giám đốc ký.", "en": "Renewals need the manager's recommendation 45 days ahead; HR drafts, and the director signs.", "ipa": "/rɪˈnuəlz nid ðə ˈmænɪdʒɚz ˌrɛkəmɛnˈdeɪʃən ˈfɔrtiˌfaɪv deɪz‿əˈhɛd; ˌeɪtʃˈɑr dræfts, ən ðə dəˈrɛktɚ saɪnz/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 2, "vi": "Bạn có thể xác nhận muốn gia hạn hay chấm dứt hợp đồng của nhân viên này không?", "en": "Could you confirm whether you'd like to renew or end this employee's contract?", "ipa": "/kʊd ju kənˈfɝm ˈwɛðɚ jud laɪk tə rɪˈnu ɚ‿ɛnd ðɪs‿ɪmˈplɔɪiz ˈkɑntrækt/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 2, "vi": "Bạn có phiền ký phụ lục thay đổi nơi làm việc trước ngày điều chuyển không?", "en": "Would you mind signing the workplace change annex before your transfer date?", "ipa": "/wʊd ju maɪnd ˈsaɪnɪŋ ðə ˈwɝkˌpleɪs tʃeɪndʒ‿ˈænɛks bɪˈfɔr jɚ ˈtrænsfɚ deɪt/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 2, "vi": "Lần này phải ký không xác định thời hạn vì bạn đã ký 2 hợp đồng có thời hạn.", "en": "This contract must be indefinite because you've already had two fixed-term contracts.", "ipa": "/ðɪs ˈkɑntrækt mʌst bi ɪnˈdɛfənət bɪˈkɔz juv‿ɔlˈrɛdi hæd tu fɪkst tɝm ˈkɑntrækts/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 2, "vi": "Nếu bạn nghỉ việc khi đang có hợp đồng không xác định thời hạn, bạn cần báo trước 45 ngày.", "en": "If you resign under an indefinite contract, you must give 45 days' notice.", "ipa": "/ɪf ju rɪˈzaɪn‿ˈʌndɚ‿ən‿ɪnˈdɛfənət ˈkɑntrækt, ju mʌst ɡɪv ˈfɔrtiˌfaɪv deɪz ˈnoʊɾɪs/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 2, "vi": "Rất tiếc, hợp đồng của bạn sẽ không được gia hạn khi hết hạn vào cuối tháng sau.", "en": "Unfortunately, your contract won't be renewed when it expires next month.", "ipa": "/ənˈfɔrtʃənətli, jɚ ˈkɑnˌtrækt woʊnt bi rɪˈnud wɛn‿ɪt‿ɪkˈspaɪɚz nɛkst mʌnθ/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 2, "vi": "Tôi sẽ gửi bạn thông báo bằng văn bản cùng danh mục bàn giao.", "en": "I'll send you written notice along with the handover checklist.", "ipa": "/aɪl sɛnd ju ˈrɪɾən ˈnoʊɾɪs‿əˈlɔŋ wɪθ ðə ˈhændoʊvɚ ˈtʃɛklɪst/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 3, "vi": "Để tôi giải thích khác biệt giữa hợp đồng có thời hạn và không thời hạn.", "en": "Let me explain the key differences between fixed-term and indefinite contracts.", "ipa": "/lɛt mi ɪkˈspleɪn ðə ki ˈdɪfɚənsɪz bɪˈtwin fɪkst tɝm‿ən‿ɪnˈdɛfənət ˈkɑntrækts/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 3, "vi": "Để tôi làm rõ: điều khoản bảo mật vẫn áp dụng sau khi nghỉ.", "en": "Let me clarify: the confidentiality clause still applies after you leave the company.", "ipa": "/lɛt mi ˈklɛrəˌfaɪ: ðə ˌkɑnfɪˌdɛnʃiˈæləɾi klɔz stɪl‿əˈplaɪz‿ˈæftɚ ju liv ðə ˈkʌmpəni/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 3, "vi": "Theo rà soát, 8 hợp đồng sẽ hết hạn trong tháng sau.", "en": "Based on our review, eight contracts will expire within the next month.", "ipa": "/beɪst‿ɑn‿ˈaʊɚ rɪˈvju, eɪt ˈkɑntrækts wɪl‿ɪkˈspaɪɚ wɪˈθɪn ðə nɛkst mʌnθ/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 3, "vi": "Tôi đề xuất cập nhật mẫu hợp đồng theo luật mới.", "en": "I recommend updating our contract template to reflect the latest legal changes.", "ipa": "/aɪ ˌrɛkəˈmɛnd‿ʌpˈdeɪɾɪŋ‿ˈaʊɚ ˈkɑntrækt ˈtɛmplət tə rɪˈflɛkt ðə ˈleɪɾɪst ˈliɡəl ˈtʃeɪndʒɪz/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 3, "vi": "Tôi đề nghị dùng hợp đồng điện tử, tiết kiệm thời gian và tiền in.", "en": "I'd suggest switching to e-contracts to save time and printing costs.", "ipa": "/aɪd səˈdʒɛst ˈswɪtʃɪŋ tu i ˈkɑntrækts tə seɪv taɪm‿ən ˈprɪntɪŋ kɔsts/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 3, "vi": "Theo tôi, điều khoản không cạnh tranh cần viết rõ ràng và thực tế hơn.", "en": "In my view, the non-compete clause needs clearer and more realistic wording.", "ipa": "/ɪn maɪ vju, ðə nɑn kəmˈpit klɔz nidz ˈklɪrɚ‿ən mɔr ˌriəˈlɪstɪk ˈwɝdɪŋ/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 3, "vi": "Tôi hiểu, nhưng luật không cho thử việc 2 lần.", "en": "I see your point, but the law doesn't allow two probation periods.", "ipa": "/aɪ si jɚ pɔɪnt, bət ðə lɔ ˈdʌzənt‿əˈlaʊ tu proʊˈbeɪʃən ˈpɪriədz/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 3, "vi": "Có lẽ nên nhờ luật sư rà soát hợp đồng cấp quản lý.", "en": "It might be worth asking a lawyer to review senior management contracts.", "ipa": "/ɪt maɪt bi wɝθ‿ˈæskɪŋ‿ə ˈlɔjɚ tə rɪˈvju ˈsinjɚ ˈmænɪdʒmənt ˈkɑntrækts/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 4, "vi": "Chúng ta chuyển sang hợp đồng sắp hết hạn, vì có 8 trường hợp trong tháng này.", "en": "Next, let's look at the expiring contracts, since there are eight cases this month.", "ipa": "/nɛkst, lɛts lʊk‿ət ði ɪkˈspaɪɚɪŋ ˈkɑntrækts, sɪns ðɛr‿ɚ‿eɪt ˈkeɪsɪz ðɪs mʌnθ/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 4, "vi": "Bạn trình bày các thay đổi trong mẫu hợp đồng mới nhé?", "en": "Could you walk us through the main changes in the new contract template?", "ipa": "/kʊd ju wɔk‿əs θru ðə meɪn ˈtʃeɪndʒɪz‿ɪn ðə nu ˈkɑntrækt ˈtɛmplət/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 4, "vi": "Tôi muốn lưu ý một điểm: một số hợp đồng chưa có phụ lục lương mới.", "en": "I want to flag one issue: several contracts still lack updated salary annexes.", "ipa": "/aɪ wɑnt tə flæɡ wʌn‿ˈɪʃu: ˈsɛvrəl ˈkɑntrækts stɪl læk‿ʌpˈdeɪɾɪd ˈsæləri ˈænɛksɪz/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 4, "vi": "Tôi hiểu quản lý muốn linh hoạt, tuy nhiên hợp đồng phải đúng luật.", "en": "I appreciate that managers want flexibility; however, every contract must follow the law.", "ipa": "/aɪ əˈpriʃiˌeɪt ðæt ˈmænɪdʒɚz wɑnt ˌflɛksəˈbɪləɾi; haʊˈɛvɚ, ˈɛvri ˈkɑntrækt mʌst ˈfɑloʊ ðə lɔ/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 4, "vi": "Hay chúng ta cài nhắc tự động 45 ngày trước khi hết hạn?", "en": "What if we set automatic reminders 45 days before each contract expires?", "ipa": "/wʌɾ‿ɪf wi sɛɾ‿ˌɔɾəˈmæɾɪk rɪˈmaɪndɚz ˌfɔrɾiˈfaɪv deɪz bɪˈfɔr‿itʃ ˈkɑntrækt‿ɪkˈspaɪɚz/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 4, "vi": "Không thể sửa điều khoản này, nhưng có thể thêm phụ lục.", "en": "We can't change this clause, but we can add an annex to clarify it.", "ipa": "/wi kænt tʃeɪndʒ ðɪs klɔz, bət wi kən‿æd‿ən‿ˈæˌnɛks tə ˈklɛrəˌfaɪ ɪt/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 4, "vi": "Tóm lại, hợp đồng sắp hết hạn cần quyết định trước ngày 15.", "en": "So, to recap, every expiring contract needs a renewal decision by the 15th.", "ipa": "/soʊ, tə ˈriˌkæp, ˈɛvri ɪkˈspaɪɚɪŋ ˈkɑntrækt nidz‿ə rɪˈnuəl dɪˈsɪʒən baɪ ðə ˌfɪfˈtinθ/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 4, "vi": "Bước tiếp theo: quản lý gửi quyết định gia hạn cho HR trước thứ Sáu.", "en": "Next step: managers will send their renewal decisions to HR by Friday.", "ipa": "/nɛkst stɛp: ˈmænɪdʒɚz wɪl sɛnd ðɛr rɪˈnuəl dɪˈsɪʒənz tu ˌeɪtʃˈɑr baɪ ˈfraɪdeɪ/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 5, "vi": "Thật lòng, nhiều mẫu hợp đồng đã cũ, không còn đúng Bộ luật Lao động hiện hành.", "en": "Honestly, many contract templates are outdated and don't reflect the current Labor Code.", "ipa": "/ˈɑnəstli, ˈmɛni ˈkɑnˌtrækt ˈtɛmpləts‿ɚ ˈaʊtˌdeɪɾɪd‿ən doʊnt rɪˈflɛkt ðə ˈkɝənt ˈleɪbɚ koʊd/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 5, "vi": "Theo kinh nghiệm, tranh chấp hợp đồng thường bắt đầu từ mô tả công việc, điều khoản mơ hồ.", "en": "From my experience, most contract disputes start with vague job descriptions and unclear terms.", "ipa": "/frʌm maɪ ɪkˈspɪriəns, moʊst ˈkɑntrækt dɪˈspjuts stɑrt wɪθ veɪɡ dʒɑb dɪˈskrɪpʃənz‿ən‿ʌnˈklɪr tɝmz/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 5, "vi": "Suy cho cùng, hợp đồng rõ ràng bảo vệ cả công ty lẫn nhân viên.", "en": "Ultimately, a clear contract protects both the company and the employee.", "ipa": "/ˈʌltəmətli, ə klɪr ˈkɑnˌtrækt prəˈtɛkts boʊθ ðə ˈkʌmpəˌni ən ði ɛmˈplɔɪi/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 5, "vi": "Điều tôi lo là hợp đồng hết hạn tự thành không thời hạn mà ta không duyệt.", "en": "My main worry is that expired contracts automatically become indefinite ones without our approval.", "ipa": "/maɪ meɪn ˈwɝi ɪz ðæɾ‿ɪkˈspaɪɚd ˈkɑntrækts‿ˌɔɾəˈmæɾɪkli bɪˈkʌm‿ɪnˈdɛfənət wʌnz wɪˈθaʊɾ‿ˈaʊɚ‿əˈpruvəl/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 5, "vi": "Nếu không theo dõi ngày hết hạn, chúng ta sẽ tiếp tục gia hạn trễ.", "en": "If we don't track expiry dates, we'll keep renewing contracts after they've already expired.", "ipa": "/ɪf wi doʊnt træk‿ɪkˈspaɪri deɪts, wil kip rɪˈnuɪŋ ˈkɑntrækts‿ˈæftɚ ðeɪv‿ɔlˈrɛdi ɪkˈspaɪɚd/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 5, "vi": "Tôi e ngại điều khoản không cạnh tranh 2 năm, vì ở Việt Nam khó thực thi.", "en": "I'm not comfortable with a two-year non-compete clause; it's hard to enforce in Vietnam.", "ipa": "/aɪm nɑt ˈkʌmfɚtəbəl wɪθ‿ə tu jɪr nɑn kəmˈpit klɔz; ɪts hɑrd tə ɛnˈfɔrs‿ɪn viˌɛtˈnɑm/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 5, "vi": "Điều tôi lo nhất là vài quản lý hứa những điều không có trong hợp đồng.", "en": "My biggest concern is that some managers promise terms that aren't in the contract.", "ipa": "/maɪ ˈbɪɡəst kənˈsɝn‿ɪz ðət sʌm ˈmænədʒɚz ˈprɑməs tɝmz ðət‿ˈɑrənt‿ɪn ðə ˈkɑnˌtrækt/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 5, "vi": "Tôi đề xuất nhờ luật sư rà soát toàn bộ mẫu hợp đồng mỗi năm một lần.", "en": "My recommendation is to have a lawyer review all contract templates once a year.", "ipa": "/maɪ ˌrɛkəmɛnˈdeɪʃən‿ɪz tə hæv‿ə ˈlɔjɚ rɪˈvju ɔl ˈkɑntrækt ˈtɛmpləts wʌns‿ə jɪr/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 6, "vi": "Giấy trắng mực đen.", "en": "Put it in writing.", "ipa": "/pʊɾ‿ɪɾ‿ɪn ˈraɪɾɪŋ/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 6, "vi": "Hợp đồng rõ ràng giữ mối quan hệ tốt đẹp.", "en": "Clear contracts keep good relationships.", "ipa": "/klɪr ˈkɑntrækts kip ɡʊd rɪˈleɪʃənʃɪps/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 6, "vi": "22% hợp đồng sắp hết hạn chưa có quyết định gia hạn, có trường hợp đã quá 30 ngày.", "en": "22% of expiring contracts have no renewal decision; some are 30 days overdue.", "ipa": "/ˈtwɛni tu pərˈsɛnt‿əv‿ɪkˈspaɪrɪŋ ˈkɑnˌtrækts həv noʊ rɪˈnuəl dɪˈsɪʒən; sʌm‿ɚ ˈθɝɾi deɪz‿ˈoʊvɚˈdu/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 6, "vi": "Hợp đồng quá 30 ngày không ký mới sẽ thành không xác định thời hạn, làm giảm tính linh hoạt nhân sự.", "en": "Contracts left unsigned past 30 days become indefinite, reducing our workforce flexibility.", "ipa": "/ˈkɑntrækts lɛft‿ənˈsaɪnd pæst ˈθɝɾi deɪz bɪˈkʌm‿ɪnˈdɛfənət, rəˈdusɪŋ‿ˈaʊɚ ˈwɝkˌfɔrs ˌflɛksəˈbɪləɾi/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 6, "vi": "Hợp đồng tốt bảo vệ cả hai bên.", "en": "A good contract protects both sides.", "ipa": "/ə ɡʊd ˈkɑntrækt prəˈtɛkts boʊθ saɪdz/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 6, "vi": "Các công ty quản lý tốt cảnh báo từ 60 ngày trước hạn và gần như không có hợp đồng quá hạn.", "en": "Well-run companies trigger expiry alerts at 60 days and have almost no overdue contracts.", "ipa": "/wɛl rʌn ˈkʌmpəniz ˈtrɪɡɚ‿ɪkˈspaɪri əˈlɝts‿ət ˈsɪksti deɪz‿ən hæv‿ˈɔlmoʊst noʊ ˈoʊvɚˈdu ˈkɑntrækts/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 6, "vi": "Tôi đề xuất cảnh báo tự động trước 60 ngày và yêu cầu quản lý phản hồi trong 10 ngày.", "en": "I propose automatic 60-day alerts, with managers required to respond within 10 days.", "ipa": "/aɪ prəˈpoʊz‿ˌɔɾəˈmæɾɪk ˈsɪksti deɪ əˈlɝts, wɪθ ˈmænɪdʒɚz rɪˈkwaɪɚd tə rɪˈspɑnd wɪˈθɪn tɛn deɪz/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 6, "vi": "Mục tiêu là không còn hợp đồng quá hạn và 100% hồ sơ được số hóa trước quý 3.", "en": "We're targeting zero overdue contracts and fully digitized files by Q3.", "ipa": "/wɪr ˈtɑrɡəɾɪŋ ˈzɪroʊ ˈoʊvɚˈdu ˈkɑntrækts‿ən ˈfʊli ˈdɪdʒəˌtaɪzd faɪlz baɪ kju θri/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 1, "vi": "Nội quy có hiệu lực sau 15 ngày kể từ khi cơ quan lao động nhận hồ sơ.", "en": "Internal labor rules take effect 15 days after the authority receives the registration file.", "ipa": "/ɪnˈtɝnəl ˈleɪbɚ rulz teɪk‿ɪˈfɛkt ˌfɪfˈtin deɪz‿ˈæftɚ ði əˈθɔrəɾi rəˈsivz ðə ˌrɛdʒɪˈstreɪʃən faɪl/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 1, "vi": "Đoàn thanh tra lao động sẽ làm việc tại công ty vào tuần sau.", "en": "A labor inspection team will be on site next week.", "ipa": "/ə ˈleɪbɚ‿ɪnˈspɛkʃən tim wɪl bi ɑn saɪt nɛkst wik/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 1, "vi": "Chúng ta đã nộp báo cáo sử dụng lao động 6 tháng cuối năm chưa?", "en": "Have we filed the second-half labor usage report yet?", "ipa": "/hæv wi faɪld ðə ˈsɛkənd hæf ˈleɪbɚ ˈjusədʒ rɪˈpɔrt jɛt/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 1, "vi": "Công ty có thuộc diện phải đăng ký nội quy lao động không?", "en": "Are we required to register our internal labor rules with the authority?", "ipa": "/ɚ wi rɪˈkwaɪɚd tə ˈrɛdʒɪstɚ‿ˈaʊɚ‿ɪnˈtɝnəl ˈleɪbɚ rulz wɪθ ði əˈθɔrəɾi/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 1, "vi": "Vui lòng chuẩn bị bảng chấm công, bảng lương và hợp đồng của 12 tháng gần nhất.", "en": "Please prepare timesheets, payrolls, and contracts for the past 12 months.", "ipa": "/pliz priˈpɛr ˈtaɪmˌʃits, ˈpeɪˌroʊlz, ən ˈkɑntrækts fɚ ðə pæst twɛlv mʌnθs/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 1, "vi": "Vui lòng công bố thang bảng lương tại nơi làm việc trước khi áp dụng.", "en": "Please publish the wage scale at the workplace before it takes effect.", "ipa": "/pliz ˈpʌblɪʃ ðə weɪdʒ skeɪl‿ət ðə ˈwɝkˌpleɪs bɪˈfɔr‿ɪt teɪks‿ɪˈfɛkt/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 1, "vi": "Xin lỗi, nội quy của chúng ta chưa cập nhật quy định về quấy rối tình dục.", "en": "Sorry, our internal rules haven't been updated for the new sexual harassment requirements.", "ipa": "/ˈsɑri, ˈaʊɚ‿ɪnˈtɝnəl rulz ˈhævənt bɪn‿ʌpˈdeɪɾɪd fɚ ðə nu ˈsɛkʃuəl həˈræsmənt rɪˈkwaɪɚmənts/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 1, "vi": "Tôi sẽ lập danh sách các điểm cần khắc phục và gửi bạn trước thứ Hai.", "en": "I'll compile a list of gaps to fix and send it by Monday.", "ipa": "/aɪl kəmˈpaɪl‿ə lɪst‿əv ɡæps tə fɪks‿ən sɛnd‿ɪt baɪ ˈmʌndeɪ/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 2, "vi": "Theo luật, doanh nghiệp từ 10 lao động trở lên phải có nội quy lao động bằng văn bản.", "en": "By law, employers with 10 or more workers must have written internal labor rules.", "ipa": "/baɪ lɔ, ɪmˈplɔɪɚz wɪθ tɛn‿ɚ mɔr ˈwɝkɚz mʌst hæv ˈrɪɾən‿ɪnˈtɝnəl ˈleɪbɚ rulz/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 2, "vi": "Khi thanh tra đến, HR tiếp đoàn, pháp chế tham gia, tài liệu phải kiểm tra trước khi cung cấp.", "en": "When inspectors arrive, HR receives them, legal joins, and every document is checked first.", "ipa": "/wɛn‿ˌɪnˈspɛktɚz‿ɚˈaɪv, eɪtʃ ɑr rəˈsivz ðɛm, ˈliɡəl dʒɔɪnz, ən‿ˈɛvri ˈdɑkjəmɛnt‿ɪz tʃɛkt fɝst/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 2, "vi": "Bạn có thể rà soát toàn bộ hợp đồng ngắn hạn đang sử dụng không?", "en": "Could you review all the short-term contracts we're currently using?", "ipa": "/kʊd ju rɪˈvju ɔl ðə ˌʃɔrtˈtɝm ˈkɑntrækts wɪr ˈkɝəntli ˈjuzɪŋ/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 2, "vi": "Bạn có phiền giữ toàn bộ hồ sơ gốc ở một nơi đến khi thanh tra kết thúc không?", "en": "Would you mind keeping all original files in one place until the inspection ends?", "ipa": "/wʊd ju maɪnd ˈkipɪŋ‿ɔl‿əˈrɪdʒənəl faɪlz‿ɪn wʌn pleɪs‿ənˈtɪl ði ɪnˈspɛkʃən‿ɛndz/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 2, "vi": "Chúng ta bị nhắc nhở vì chưa tổ chức đối thoại định kỳ tại nơi làm việc.", "en": "We received a warning because we hadn't held periodic workplace dialogues.", "ipa": "/wi rɪˈsivd‿ə ˈwɔrnɪŋ bɪˈkɔz wi ˈhædənt hɛld ˌpɪriˈɑdɪk ˈwɝkˌpleɪs ˈdaɪəˌlɔɡz/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 2, "vi": "Nếu không khắc phục vi phạm đúng hạn, công ty có thể bị phạt và bị truy nộp.", "en": "Unfixed violations may bring fines and back payments.", "ipa": "/ʌnˈfɪkst vaɪəˈleɪʃənz meɪ brɪŋ faɪnz‿ən bæk ˈpeɪmənts/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 2, "vi": "Rất tiếc, đoàn thanh tra kết luận chúng ta đóng bảo hiểm thấp hơn mức quy định.", "en": "Unfortunately, the inspectors concluded that our insurance contributions were below the required level.", "ipa": "/ʌnˈfɔrtʃənətli, ði ɪnˈspɛktɚz kənˈkludəd ðæɾ‿ˈaʊɚ‿ɪnˈʃʊrəns ˌkɑntrəˈbjuʃənz wɚ bɪˈloʊ ðə rɪˈkwaɪɚd ˈlɛvəl/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 2, "vi": "Tôi sẽ theo dõi việc khắc phục và báo cáo đoàn thanh tra đúng hạn.", "en": "I'll track the corrective actions and report back to the inspectors on time.", "ipa": "/aɪl træk ðə kəˈrɛktɪv‿ˈækʃənz‿ən rɪˈpɔrt bæk tə ði ɪnˈspɛktɚz‿ɑn taɪm/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 3, "vi": "Để tôi giải thích những thay đổi chính của luật lao động mới năm nay.", "en": "Let me explain the main changes in the new labor regulations this year.", "ipa": "/lɛt mi ɪkˈspleɪn ðə meɪn ˈtʃeɪndʒɪz‿ɪn ðə nu ˈleɪbɚ ˌrɛɡjəˈleɪʃənz ðɪs jɪr/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 3, "vi": "Để tôi làm rõ: nội quy chỉ có hiệu lực sau khi đăng ký.", "en": "Let me clarify: internal rules only take effect once they're officially registered.", "ipa": "/lɛt mi ˈklɛrəˌfaɪ: ɪnˈtɝnəl rulz‿ˈoʊnli teɪk‿ɪˈfɛkt wʌns ðɛr‿əˈfɪʃəli ˈrɛdʒɪstɚd/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 3, "vi": "Theo kết quả kiểm tra nội bộ, có 3 điểm cần khắc phục.", "en": "Based on the internal audit, there are three issues we need to fix.", "ipa": "/beɪst‿ɑn ði ɪnˈtɝnəl‿ˈɔdɪt, ðɛr‿ɚ θri ˈɪʃuz wi nid tə fɪks/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 3, "vi": "Tôi đề xuất cập nhật nội quy theo Bộ luật Lao động mới.", "en": "I recommend updating our internal rules to match the latest Labor Code.", "ipa": "/aɪ ˌrɛkəˈmɛnd‿ʌpˈdeɪɾɪŋ‿ˈaʊɚ‿ɪnˈtɝnəl rulz tə mætʃ ðə ˈleɪɾɪst ˈleɪbɚ koʊd/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 3, "vi": "Tôi đề nghị bảng kiểm tuân thủ đơn giản hằng tháng cho mỗi quản lý chi nhánh.", "en": "I'd suggest a simple monthly compliance checklist for every branch manager to complete.", "ipa": "/aɪd səˈdʒɛst‿ə ˈsɪmpəl ˈmʌnθli kəmˈplaɪəns ˈtʃɛklɪst fɚ‿ˈɛvri bræntʃ ˈmænɪdʒɚ tə kəmˈplit/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 3, "vi": "Theo tôi, tuân thủ là trách nhiệm của mọi quản lý, không chỉ HR.", "en": "In my view, compliance is every manager's responsibility, not just HR's.", "ipa": "/ɪn maɪ vju, kəmˈplaɪəns‿ɪz‿ˈɛvri ˈmænɪdʒɚz rɪˌspɑnsəˈbɪləɾi, nɑt dʒʌst‿ˌeɪtʃˈɑrz/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 3, "vi": "Tôi hiểu ý bạn, nhưng cách làm đó có rủi ro pháp lý.", "en": "I see your point, but that approach carries real legal risk.", "ipa": "/aɪ si jɚ pɔɪnt, bət ðæɾ‿əˈproʊtʃ ˈkæriz ril ˈliɡəl rɪsk/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 3, "vi": "Có lẽ nên thuê đơn vị độc lập rà soát mỗi năm.", "en": "It might be worth hiring an external firm for an independent annual review.", "ipa": "/ɪt maɪt bi wɝθ ˈhaɪɚɪŋ‿ən‿ɪkˈstɝnəl fɝm fɚ‿ən‿ˌɪndɪˈpɛndənt‿ˈænjuəl rɪˈvju/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 4, "vi": "Chúng ta chuyển sang kết quả kiểm tra, vì thanh tra đến tháng sau.", "en": "Let's move on to the audit results, since labor inspectors are visiting next month.", "ipa": "/lɛts muv‿ɑn tə ði ˈɔdɪt rɪˈzʌlts, sɪns ˈleɪbɚ‿ɪnˈspɛktɚz‿ɚ ˈvɪzɪɾɪŋ nɛkst mʌnθ/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 4, "vi": "Bạn trình bày 3 điểm chưa tuân thủ và cách khắc phục nhé?", "en": "Can you take us through the three gaps and our plan to fix them?", "ipa": "/kən ju teɪk‿ʌs θru ðə θri ɡæps‿ən‿aʊɚ plæn tə fɪks ðɛm/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 4, "vi": "Có một điều tôi lo: 15 nhân viên chưa có hợp đồng bằng văn bản.", "en": "One thing worries me: 15 employees still don't have written contracts.", "ipa": "/wʌn θɪŋ ˈwɝiz mi: ˌfɪfˈtin‿ɪmˈplɔɪiz stɪl doʊnt hæv ˈrɪɾən ˈkɑntrækts/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 4, "vi": "Tôi hiểu các phòng đang bận, tuy nhiên hạn khắc phục là bắt buộc.", "en": "I understand departments are busy; however, the correction deadline is not optional.", "ipa": "/aɪ ˌʌndɚˈstænd dɪˈpɑrtmənts‿ɚ ˈbɪzi; haʊˈɛvɚ, ðə kəˈrɛkʃən ˈdɛdˌlaɪn‿ɪz nɑɾ‿ˈɑpʃənəl/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 4, "vi": "Hay chúng ta cử 1 đầu mối tuân thủ ở mỗi phòng ban để hỗ trợ HR?", "en": "What if each department appointed one compliance contact to support HR?", "ipa": "/wʌɾ‿ɪf‿itʃ dɪˈpɑrtmənt‿əˈpɔɪntɪd wʌn kəmˈplaɪəns ˈkɑntækt tə səˈpɔrɾ‿ˌeɪtʃˈɑr/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 4, "vi": "Không thể sửa hết trong tuần, nhưng có thể ưu tiên rủi ro cao trước.", "en": "We can't fix everything this week, but we can handle the high-risk items first.", "ipa": "/wi kænt fɪks‿ˈɛvriˌθɪŋ ðɪs wik, bət wi kən ˈhændəl ðə haɪ rɪsk‿ˈaɪɾəmz fɝst/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 4, "vi": "Tóm lại, cả 3 điểm phải được khắc phục trước khi thanh tra.", "en": "To summarize, all three gaps must be fixed before the inspection date.", "ipa": "/tu ˈsʌməˌraɪz, ɔl θri ɡæps mʌst bi fɪkst bɪˈfɔr ði ɪnˈspɛkʃən deɪt/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 4, "vi": "Bước tiếp theo: pháp chế rà soát hồ sơ và báo cáo trước ngày 20.", "en": "Next step: legal will review the files and report back by the 20th.", "ipa": "/nɛkst stɛp: ˈliɡəl wɪl ˌriˈvju ðə faɪlz‿ən riˈpɔrt bæk baɪ ðə ˈtwɛniəθ/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 5, "vi": "Thật lòng, chúng ta chỉ lo tuân thủ khi sắp thanh tra, vậy là quá muộn.", "en": "Honestly, we only take compliance seriously when an inspection is announced; that's too late.", "ipa": "/ˈɑnəstli, wi ˈoʊnli teɪk kəmˈplaɪəns ˈsɪriəsli wɛn‿ən‿ˌɪnˈspɛkʃən‿ɪz‿əˈnaʊnst; ðæts tu leɪt/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 5, "vi": "Theo kinh nghiệm, thiếu sót giấy tờ nhỏ bị phạt nhiều hơn vi phạm lớn.", "en": "In my experience, small paperwork gaps cause more fines than serious violations do.", "ipa": "/ɪn maɪ ɪkˈspɪriəns, smɔl ˈpeɪpɚˌwɝk ɡæps kɔz mɔr faɪnz ðən ˈsɪriəs ˌvaɪəˈleɪʃənz du/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 5, "vi": "Điều quan trọng là tuân thủ luôn rẻ hơn tiền phạt hay thiệt hại uy tín.", "en": "What really matters is that compliance costs less than any fine or reputational damage.", "ipa": "/wʌt ˈrɪli ˈmæɾɚz‿ɪz ðət kəmˈplaɪəns kɑsts lɛs ðæn‿ˈɛni faɪn‿ɚ ˌrɛpjəˈteɪʃənəl ˈdæmədʒ/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 5, "vi": "Rủi ro lớn nhất là luật mới có hiệu lực khi quy chế nội bộ chưa cập nhật.", "en": "The main risk is that new regulations take effect before our policies are updated.", "ipa": "/ðə meɪn rɪsk‿ɪz ðət nu ˌrɛɡjəˈleɪʃənz teɪk‿ɪˈfɛkt bɪˈfɔr‿aʊɚ ˈpɑləsiz‿ɚ əpˈdeɪɾɪd/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 5, "vi": "Nếu chưa đăng ký nội quy mới, không thể dùng nó để xử lý kỷ luật.", "en": "Unless we register the updated work rules, we can't legally use them for discipline.", "ipa": "/ənˈlɛs wi ˈrɛdʒɪstɚ ði əpˈdeɪɾɪd wɝk rulz, wi kænt ˈliɡəli jus ðɛm fɚ ˈdɪsəplən/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 5, "vi": "Tôi phản bác bỏ qua bước rà soát pháp lý, kể cả khi hạn rất gấp.", "en": "I'd challenge skipping the legal review, even if the deadline is very tight.", "ipa": "/aɪd ˈtʃælɪndʒ ˈskɪpɪŋ ðə ˈliɡəl rɪˈvju, ˈivən‿ɪf ðə ˈdɛdˌlaɪn‿ɪz ˈvɛri taɪt/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 5, "vi": "Điều tôi lo nhất là mỗi chi nhánh hiểu cùng một quy định theo cách khác nhau.", "en": "What concerns me most is that each branch interprets the same regulation differently.", "ipa": "/wʌt kənˈsɝnz mi moʊst‿ɪz ðət‿itʃ bræntʃ‿ˌɪnˈtɝprəts ðə seɪm ˌrɛɡjəˈleɪʃən ˈdɪfrəntli/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 5, "vi": "Tôi đề xuất bảng kiểm tuân thủ hằng quý, mỗi chi nhánh tự điền và ký.", "en": "What I'd propose is a quarterly compliance checklist that every branch completes and signs.", "ipa": "/wʌɾ‿aɪd prəˈpoʊz‿ɪz‿ə ˈkwɔrɾɚli kəmˈplaɪəns ˈtʃɛklɪst ðæɾ‿ˈɛvri bræntʃ kəmˈplits‿ən saɪnz/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 6, "vi": "Biết luật để không phạm luật.", "en": "Know the rules to stay within them.", "ipa": "/noʊ ðə rulz tə steɪ wɪˈθɪn ðɛm/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 6, "vi": "Tuân thủ rẻ hơn khắc phục.", "en": "Compliance costs less than correction.", "ipa": "/kəmˈplaɪəns kɔsts lɛs ðən kəˈrɛkʃən/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 6, "vi": "Đợt tự kiểm tra phát hiện 11 điểm chưa tuân thủ, trong đó 4 điểm có mức phạt đáng kể.", "en": "Our self-audit found 11 compliance gaps, four of which carry significant penalties.", "ipa": "/ˈaʊɚ sɛlf‿ˈɔdɪt faʊnd‿ɪˈlɛvən kəmˈplaɪəns ɡæps, fɔr‿əv wɪtʃ ˈkæri səɡˈnɪfɪkənt ˈpɛnəltiz/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 6, "vi": "Mức phạt với tổ chức gấp đôi cá nhân, nên mỗi vi phạm có thể lên đến hàng trăm triệu đồng.", "en": "Organizational fines are double individual fines; each violation costs hundreds of millions.", "ipa": "/ˌɔrɡənəˈzeɪʃənəl faɪnz‿ɚ ˈdʌbəl‿ˌɪndəˈvɪdʒəwəl faɪnz; itʃ vaɪəˈleɪʃən kɑsts ˈhʌndrədz‿əv ˈmɪljənz/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 6, "vi": "Làm đúng khi không ai nhìn mới là chính trực.", "en": "Integrity is doing right when no one is watching.", "ipa": "/ɪnˈtɛɡrəɾi ɪz ˈduɪŋ raɪt wɛn noʊ wʌn‿ɪz ˈwɑtʃɪŋ/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 6, "vi": "Các doanh nghiệp FDI trong khu công nghiệp của ta tự kiểm tra 2 lần mỗi năm và hiếm khi bị phạt.", "en": "FDI companies in our industrial park self-audit twice a year and are rarely fined.", "ipa": "/ˌɛfdiˈaɪ ˈkʌmpəniz‿ɪn‿ˈaʊɚ‿ˌɪnˈdʌstriəl pɑrk sɛlf‿ˈɔdɪt twaɪs‿ə jɪr‿ən‿ɚ ˈrɛrli faɪnd/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 6, "vi": "Tôi đề xuất khắc phục 4 điểm rủi ro cao trong 30 ngày, chi phí dưới 50 triệu.", "en": "I propose fixing the four high-risk gaps within 30 days, under 50 million VND.", "ipa": "/aɪ prəˈpoʊz ˈfɪksɪŋ ðə fɔr haɪ rɪsk ɡæps wɪˈðɪn ˈθɝɾi deɪz, ˈʌndɚ ˈfɪfti ˈmɪljən vi ɛn di/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 6, "vi": "Mục tiêu là không có kết luận vi phạm nào trong đợt thanh tra năm tới.", "en": "Our goal is a clean result, with zero findings, at next year's inspection.", "ipa": "/ˈaʊɚ ɡoʊl‿ɪz‿ə klin rɪˈzʌlt, wɪθ ˈzɪroʊ ˈfaɪndɪŋz, ət nɛkst jɪrz‿ɪnˈspɛkʃən/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 1, "vi": "Thời hiệu xử lý kỷ luật là 6 tháng kể từ ngày xảy ra vi phạm.", "en": "The statute of limitations for discipline is six months from the violation.", "ipa": "/ðə ˈstætʃuɾ‿əv ˌlɪmɪˈteɪʃənz fɚ ˈdɪsəplɪn‿ɪz sɪks mʌnθs frəm ðə ˌvaɪəˈleɪʃən/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 1, "vi": "Có 4 hình thức: khiển trách, kéo dài thời hạn nâng lương, cách chức và sa thải.", "en": "There are four measures: reprimand, delayed pay raise, removal from position, and dismissal.", "ipa": "/ðɛr‿ɚ fɔr ˈmɛʒɚz: ˈrɛprəˌmænd, dɪˈleɪd peɪ reɪz, rɪˈmuvəl frəm pəˈzɪʃən, ən dɪsˈmɪsəl/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 1, "vi": "Bạn đã thu thập đủ bằng chứng và lập biên bản vi phạm chưa?", "en": "Have you gathered enough evidence and documented the violation in writing?", "ipa": "/hæv ju ˈɡæðɚd‿ɪˈnʌf‿ˈɛvɪdəns‿ən ˈdɑkjəmɛntɪd ðə ˌvaɪəˈleɪʃən‿ɪn ˈraɪɾɪŋ/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 1, "vi": "Nhân viên này có đại diện công đoàn mà chúng ta cần mời không?", "en": "Does this employee have a union representative we need to invite?", "ipa": "/dʌz ðɪs‿ɪmˈplɔɪi hæv‿ə ˈjunjən ˌrɛprɪˈzɛntəɾɪv wi nid tu ɪnˈvaɪt/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 1, "vi": "Vui lòng lập biên bản ngay khi xảy ra sự việc, có chữ ký người chứng kiến.", "en": "Please record the incident immediately, with a witness signature.", "ipa": "/pliz ˈrɛkɚd ði ˈɪnsɪdənt‿ɪˈmidiətli, wɪθ‿ə ˈwɪtnəs ˈsɪɡnətʃɚ/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 1, "vi": "Vui lòng không trừ lương thay cho kỷ luật, vì luật cấm việc này.", "en": "Please don't cut wages as a punishment; the law prohibits it.", "ipa": "/pliz doʊnt kʌt ˈweɪdʒəz‿əz‿ə ˈpʌnɪʃmənt; ðə lɔ proʊˈhɪbəts‿ɪt/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 1, "vi": "Xin lỗi, thông báo họp kỷ luật gửi trễ nên chúng ta phải dời lịch.", "en": "Sorry, the hearing notice was sent too late, so we must reschedule.", "ipa": "/ˈsɑri, ðə ˈhɪrɪŋ ˈnoʊɾɪs wəz sɛnt tu leɪt, soʊ wi mʌst riˈskɛdʒul/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 1, "vi": "Quyết định sẽ được gửi cho nhân viên và công đoàn sau buổi họp.", "en": "The decision will go to the employee and the union after the hearing.", "ipa": "/ðə dɪˈsɪʒən wɪl ɡoʊ tə ði ɪmˈplɔɪi ən ðə ˈjunjən‿ˈæftɚ ðə ˈhɪrɪŋ/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 2, "vi": "Theo luật, không được xử lý kỷ luật lao động nữ trong thời gian mang thai.", "en": "By law, an employee can't be disciplined while she's pregnant.", "ipa": "/baɪ lɔ, ən‿ɪmˈplɔɪi kænt bi ˈdɪsəplənd waɪl ʃiz ˈprɛɡnənt/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 2, "vi": "Quy trình gồm lập biên bản, thông báo, họp xử lý có người đại diện, rồi ra quyết định.", "en": "The process: document the breach, give notice, hold a hearing with representation, then decide.", "ipa": "/ðə ˈprɑˌsɛs: ˈdɑkjəmɛnt ðə britʃ, ɡɪv ˈnoʊɾəs, hoʊld‿ə ˈhirɪŋ wɪθ ˌrɛprəzɛnˈteɪʃən, ðɛn ˌdɪˈsaɪd/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 2, "vi": "Bạn có thể xác nhận trước đây nhân viên này đã bị nhắc nhở bằng văn bản chưa?", "en": "Could you confirm whether this employee received a written reminder before?", "ipa": "/kʊd ju kənˈfɝm ˈwɛðɚ ðɪs‿ɪmˈplɔɪi rɪˈsivd‿ə ˈrɪɾən rɪˈmaɪndɚ bɪˈfɔr/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 2, "vi": "Bạn có phiền tham dự buổi họp với vai trò người chứng kiến không?", "en": "Would you mind attending the hearing as a witness?", "ipa": "/wʊd ju maɪnd‿əˈtɛndɪŋ ðə ˈhɪrɪŋ‿əz‿ə ˈwɪtnəs/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 2, "vi": "Chúng ta phải hoãn họp vì nhân viên đang nghỉ ốm có xác nhận của cơ sở y tế.", "en": "We have to postpone the hearing because the employee is on certified sick leave.", "ipa": "/wi hæv tə poʊstˈpoʊn ðə ˈhɪrɪŋ bɪˈkɔz ði ɪmˈplɔɪi ɪz‿ɑn ˈsɝɾəˌfaɪd sɪk liv/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 2, "vi": "Nếu nhân viên vắng mặt sau 3 lần thông báo hợp lệ, buổi họp vẫn có thể tiến hành.", "en": "If the employee fails to attend after three valid notices, the hearing can proceed.", "ipa": "/ɪf ði ɪmˈplɔɪi feɪlz tu əˈtɛnd‿ˈæftɚ θri ˈvælɪd ˈnoʊɾəsəz, ðə ˈhɪrɪŋ kən prəˈsid/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 2, "vi": "Rất tiếc, hành vi này thuộc trường hợp sa thải theo nội quy đã đăng ký.", "en": "Unfortunately, this conduct qualifies for dismissal under our registered work rules.", "ipa": "/ʌnˈfɔrtʃənətli, ðɪs ˈkɑndəkt ˈkwɑləˌfaɪz fɚ dɪsˈmɪsəl‿ˈʌndɚ‿ˈaʊɚ ˈrɛdʒɪstɚd wɝk rulz/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 2, "vi": "Tôi sẽ lưu toàn bộ hồ sơ và theo dõi thời điểm được xóa kỷ luật.", "en": "I'll file all the records and track when the disciplinary record can be cleared.", "ipa": "/aɪl faɪl‿ɔl ðə ˈrɛkɚdz‿ən træk wɛn ðə ˈdɪsəpləˌnɛri ˈrɛkɚd kən bi klɪrd/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 3, "vi": "Để tôi giải thích quy trình xử lý kỷ luật theo luật lao động.", "en": "Let me explain the disciplinary process required under the Labor Code.", "ipa": "/lɛt mi ɪkˈspleɪn ðə ˈdɪsəpləˌnɛri ˈprɑsɛs rɪˈkwaɪɚd‿ˈʌndɚ ðə ˈleɪbɚ koʊd/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 3, "vi": "Để tôi làm rõ: thư nhắc nhở chưa phải là hình thức kỷ luật.", "en": "Let me clarify: a written reminder isn't a formal disciplinary action yet.", "ipa": "/lɛt mi ˈklɛrəˌfaɪ: ə ˈrɪɾən rɪˈmaɪndɚ‿ˈɪzənt‿ə ˈfɔrməl ˈdɪsəpləˌnɛri ˈækʃən jɛt/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 3, "vi": "Theo hồ sơ, đây là lần vi phạm thứ 3 trong 6 tháng.", "en": "Based on the records, this is the third violation in six months.", "ipa": "/beɪst‿ɑn ðə ˈrɛkɚdz, ðɪs‿ɪz ðə θɝd ˌvaɪəˈleɪʃən‿ɪn sɪks mʌnθs/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 3, "vi": "Tôi đề xuất ghi nhận bằng văn bản trước khi xử lý kỷ luật.", "en": "I recommend documenting each incident in writing before any formal action.", "ipa": "/aɪ ˌrɛkəˈmɛnd ˈdɑkjəˌmɛntɪŋ‿itʃ‿ˈɪnsɪdənt‿ɪn ˈraɪɾɪŋ bɪˈfɔr‿ˈɛni ˈfɔrməl‿ˈækʃən/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 3, "vi": "Tôi đề nghị cho bạn ấy 30 ngày cải thiện trước khi xử lý nặng hơn.", "en": "I'd suggest giving him a 30-day improvement plan before we escalate.", "ipa": "/aɪd səˈdʒɛst ˈɡɪvɪŋ hɪm‿ə ˈθɝɾi deɪ ɪmˈpruvmənt plæn bɪˈfɔr wi ˈɛskəˌleɪt/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 3, "vi": "Theo tôi, quản lý nên nói sớm, đừng đợi nghiêm trọng.", "en": "In my view, managers should address issues early, before they become serious.", "ipa": "/ɪn maɪ vju, ˈmænɪdʒɚz ʃʊd‿əˈdrɛs‿ˈɪʃuz‿ˈɝli, bɪˈfɔr ðeɪ bɪˈkʌm ˈsɪriəs/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 3, "vi": "Tôi hiểu, nhưng không thể sa thải khi thiếu bằng chứng.", "en": "I see your point, but we can't dismiss anyone without solid evidence.", "ipa": "/aɪ si jɚ pɔɪnt, bət wi kænt dɪsˈmɪs‿ˈɛniˌwʌn wɪˈθaʊt ˈsɑlɪd‿ˈɛvɪdəns/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 3, "vi": "Có lẽ nên nhờ pháp chế xem hồ sơ trước buổi họp.", "en": "It might be worth asking legal to review the file before the hearing.", "ipa": "/ɪt maɪt bi wɝθ‿ˈæskɪŋ ˈliɡəl tə rɪˈvju ðə faɪl bɪˈfɔr ðə ˈhɪrɪŋ/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 4, "vi": "Chúng ta chuyển sang vụ việc ở kho, vì thời hiệu xử lý sắp hết.", "en": "Let's turn to the warehouse case, since the legal time limit is running out.", "ipa": "/lɛts tɝn tə ðə ˈwɛrˌhaʊs keɪs, sɪns ðə ˈliɡəl taɪm ˈlɪmɪɾ‿ɪz ˈrʌnɪŋ‿aʊt/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 4, "vi": "Bạn trình bày diễn biến sự việc và bằng chứng đã có nhé?", "en": "Would you mind going over what happened and the evidence we have so far?", "ipa": "/wʊd ju maɪnd ˈɡoʊɪŋ‿ˈoʊvɚ wʌt ˈhæpənd‿ən ði ˈɛvɪdəns wi hæv soʊ fɑr/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 4, "vi": "Tôi muốn nêu lo ngại: chưa có biên bản lần vi phạm đầu.", "en": "I'd like to raise a concern: we don't have minutes from the first incident.", "ipa": "/aɪd laɪk tə reɪz‿ə kənˈsɝn: wi doʊnt hæv ˈmɪnəts frəm ðə fɝst‿ˈɪnsɪdənt/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 4, "vi": "Tôi hiểu quản lý muốn sa thải ngay, tuy nhiên phải đúng quy trình.", "en": "I get that the manager wants a dismissal; however, we must follow the process.", "ipa": "/aɪ ɡɛt ðæt ðə ˈmænɪdʒɚ wɑnts‿ə dɪsˈmɪsəl; haʊˈɛvɚ, wi mʌst ˈfɑloʊ ðə ˈprɑsɛs/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 4, "vi": "Hay chúng ta áp dụng kéo dài thời hạn nâng lương 6 tháng?", "en": "Would it help to delay his next pay raise by six months instead?", "ipa": "/wʊd‿ɪt hɛlp tə dɪˈleɪ hɪz nɛkst peɪ reɪz baɪ sɪks mʌnθs‿ˌɪnˈstɛd/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 4, "vi": "Không thể sa thải lần này, nhưng có thể khiển trách bằng văn bản.", "en": "We can't dismiss him this time, but we can issue a formal written reprimand.", "ipa": "/wi kænt dɪsˈmɪs hɪm ðɪs taɪm, bət wi kən‿ˈɪʃu ə ˈfɔrməl ˈrɪɾən ˈrɛprəˌmænd/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 4, "vi": "Tóm lại, buổi họp kỷ luật sẽ diễn ra có mặt công đoàn.", "en": "To wrap up, the disciplinary hearing will go ahead with the union present.", "ipa": "/tu ræp‿ʌp, ðə ˈdɪsəpləˌnɛri ˈhɪrɪŋ wɪl ɡoʊ əˈhɛd wɪθ ðə ˈjunjən ˈprɛzənt/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 4, "vi": "Sau buổi họp, HR gửi thông báo họp trước ít nhất 5 ngày làm việc.", "en": "After this meeting, HR will send him the hearing notice five working days ahead.", "ipa": "/ˈæftɚ ðɪs ˈmiɾɪŋ, eɪtʃ ɑr wɪl sɛnd hɪm ðə ˈhirɪŋ ˈnoʊɾəs faɪv ˈwɝkɪŋ deɪz‿əˈhɛd/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 5, "vi": "Thật lòng, nhiều quản lý né nói chuyện khó cho đến khi quá muộn.", "en": "To be frank, many managers avoid difficult conversations until the problem is too big.", "ipa": "/tə bi fræŋk, ˈmɛni ˈmænədʒɚz‿əˈvɔɪd ˈdɪfəkəlt ˌkɑnvɚˈseɪʃənz‿ənˈtɪl ðə ˈprɑbləm‿ɪz tu bɪɡ/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 5, "vi": "Theo kinh nghiệm, phần lớn tranh chấp kỷ luật thua vì sai quy trình, không phải sự việc.", "en": "What I've seen is that most disciplinary disputes are lost on procedure, not facts.", "ipa": "/wʌt‿aɪv sin‿ɪz ðət moʊst ˈdɪsəpləˌnɛri dɪsˈpjuts‿ɚ lɔst‿ɑn prəˈsidʒɚ, nɑt fækts/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 5, "vi": "Mấu chốt là kỷ luật phải công bằng, nhất quán và có hồ sơ.", "en": "The bottom line is that discipline must be fair, consistent, and properly documented.", "ipa": "/ðə ˈbɑɾəm laɪn‿ɪz ðæt ˈdɪsəplɪn mʌst bi fɛr, kənˈsɪstənt, ən ˈprɑpɚli ˈdɑkjəmɛntɪd/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 5, "vi": "Rủi ro lớn nhất là bị kiện và công ty phải nhận lại người, trả lương những ngày nghỉ.", "en": "The biggest risk is a lawsuit forcing reinstatement with back pay.", "ipa": "/ðə ˈbɪɡəst rɪsk‿ɪz‿ə ˈlɔˌsut ˈfɔrsɪŋ ˌriɪnˈsteɪtmənt wɪθ bæk peɪ/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 5, "vi": "Nếu không xử lý vi phạm nhỏ, cả team sẽ nghĩ nội quy không quan trọng.", "en": "If we ignore small violations, the whole team will think the rules don't matter.", "ipa": "/ɪf wi ˌɪɡˈnɔr smɔl vaɪəˈleɪʃənz, ðə hoʊl tim wɪl θɪŋk ðə rulz doʊnt ˈmæɾɚ/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 5, "vi": "Tôi phản đối sa thải ngay, vì chúng ta chưa có đủ bằng chứng.", "en": "I'd push back on an immediate dismissal, because we don't have enough evidence yet.", "ipa": "/aɪd pʊʃ bæk‿ɑn‿ən‿ɪˈmidiət dɪsˈmɪsəl, bɪˈkɔz wi doʊnt hæv‿ɪˈnʌf‿ˈɛvɪdəns jɛt/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 5, "vi": "Điều tôi lo nhất là mỗi quản lý xử lý cùng lỗi một cách khác.", "en": "What worries me is that each manager handles the same violation differently.", "ipa": "/wʌt ˈwɝiz mi ɪz ðæɾ‿itʃ ˈmænɪdʒɚ ˈhændəlz ðə seɪm ˌvaɪəˈleɪʃən ˈdɪfrəntli/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 5, "vi": "Tôi đề xuất đào tạo quản lý về quy trình kỷ luật trong quý này.", "en": "My suggestion is to train all managers on the disciplinary process this quarter.", "ipa": "/maɪ səɡˈdʒɛstʃən‿ɪz tə treɪn‿ɔl ˈmænɪdʒɚz‿ɑn ðə ˈdɪsəpləˌnɛri ˈprɑsɛs ðɪs ˈkwɔrɾɚ/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 6, "vi": "Công bằng không có nghĩa là giống nhau cho tất cả.", "en": "Fair doesn't always mean the same for everyone.", "ipa": "/fɛr ˈdʌzənt‿ˈɔlˌweɪz min ðə seɪm fɚ‿ˈɛvriˌwʌn/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 6, "vi": "Kỷ luật là để sửa sai, không phải để trừng phạt.", "en": "Discipline is for correction, not punishment.", "ipa": "/ˈdɪsəplɪn‿ɪz fɚ kəˈrɛkʃən, nɑt ˈpʌnɪʃmənt/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 6, "vi": "3 trong 5 vụ sa thải năm ngoái bị khiếu nại, và cả 3 đều sai thủ tục.", "en": "Three of last year's five dismissals were challenged, and all three had procedural flaws.", "ipa": "/θri əv læst jɪrz faɪv dɪˈsmɪsəlz wɚ ˈtʃæləndʒd, ən‿ɔl θri hæd prəˈsidʒɚəl flɔz/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 6, "vi": "Sa thải trái luật có thể buộc công ty nhận lại người, trả lương những ngày không làm và bồi thường thêm.", "en": "Unlawful dismissal can force us to reinstate the employee, pay back wages, and compensate.", "ipa": "/ənˈlɔfəl dɪˈsmɪsəl kən fɔrs‿ʌs tə ˌriɪnˈsteɪt ði ɛmˈplɔɪi, peɪ bæk ˈweɪdʒəz, ən ˈkɑmpənˌseɪt/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 6, "vi": "Đúng quy trình quan trọng không kém đúng lý do.", "en": "The right process matters as much as the right reason.", "ipa": "/ðə raɪt ˈprɑsɛs ˈmæɾɚz‿əz mʌtʃ‿əz ðə raɪt ˈrizən/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 6, "vi": "Các công ty dùng checklist kỷ luật chuẩn hiếm khi thua vì lý do thủ tục.", "en": "Companies that use a standard disciplinary checklist rarely lose on procedural grounds.", "ipa": "/ˈkʌmpəniz ðæt juz‿ə ˈstændɚd ˈdɪsəpləˌnɛri ˈtʃɛklɪst ˈrɛrli luz‿ɑn prəˈsidʒɚəl ɡraʊndz/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 6, "vi": "Tôi đề xuất HR thẩm định mọi hồ sơ trước khi họp, kèm đào tạo quản lý trong tháng tới.", "en": "I propose HR vets every case before the hearing, plus manager training next month.", "ipa": "/aɪ prəˈpoʊz‿eɪtʃ ɑr vɛts‿ˈɛvri keɪs bɪˈfɔr ðə ˈhirɪŋ, plʌs ˈmænədʒɚ ˈtreɪnɪŋ nɛkst mʌnθ/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 6, "vi": "Mục tiêu năm tới là không có quyết định kỷ luật nào bị hủy vì sai thủ tục.", "en": "The goal is zero disciplinary decisions overturned on procedural grounds next year.", "ipa": "/ðə ɡoʊl‿ɪz ˈzɪroʊ ˈdɪsəpləˌnɛri dɪˈsɪʒənz‿ˈoʊvɚˌtɝnd‿ɑn prəˈsidʒɚəl ɡraʊndz nɛkst jɪr/"}, {"topicRaw": "19-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 1, "vi": "Người vào làm giữa tháng được tính lương theo số ngày công thực tế.", "en": "Mid-month joiners are paid pro-rata, based on actual working days.", "ipa": "/mɪd mʌnθ ˈdʒɔɪnɚz‿ɚ peɪd proʊ ˈræɾə, beɪst‿ɑn‿ˈæktʃuəl ˈwɝkɪŋ deɪz/"}, {"topicRaw": "19-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 1, "vi": "Bảng lương tháng này đã được đối chiếu với dữ liệu chấm công và bảo hiểm.", "en": "This month's payroll has been reconciled against attendance and insurance data.", "ipa": "/ðɪs mʌnθs ˈpeɪroʊl hæz bɪn ˈrɛkənˌsaɪld‿əˈɡɛnst‿əˈtɛndəns‿ən‿ɪnˈʃʊrəns ˈdeɪɾə/"}, {"topicRaw": "19-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 1, "vi": "Khoản điều chỉnh này đưa vào kỳ lương thường hay chi bổ sung ngoài kỳ?", "en": "Should this adjustment go into the regular run or an off-cycle payment?", "ipa": "/ʃʊd ðɪs‿əˈdʒʌstmənt ɡoʊ ˈɪntu ðə ˈrɛɡjəlɚ rʌn‿ɚ‿ən‿ˈɔf ˌsaɪkəl ˈpeɪmənt/"}, {"topicRaw": "19-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 1, "vi": "Chênh lệch quỹ lương so với tháng trước đã có giải trình chưa?", "en": "Have we explained the month-on-month variance in total payroll?", "ipa": "/hæv wi ɪkˈspleɪnd ðə mʌnθ‿ɑn mʌnθ ˈvɛriəns‿ɪn ˈtoʊɾəl ˈpeɪroʊl/"}, {"topicRaw": "19-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 1, "vi": "Vui lòng gửi mọi thay đổi lương kèm quyết định đã ký trước ngày 20.", "en": "Please send all salary changes with signed approvals by the 20th.", "ipa": "/pliz sɛnd‿ɔl ˈsæləri ˈtʃeɪndʒɪz wɪθ saɪnd‿əˈpruvəlz baɪ ðə ˈtwɛntiəθ/"}, {"topicRaw": "19-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 1, "vi": "Vui lòng xác nhận thông tin tài khoản ngân hàng trước khi chúng tôi gửi lệnh chi.", "en": "Please verify bank details before we release the payment file.", "ipa": "/pliz ˈvɛrəˌfaɪ bæŋk ˈditeɪlz bɪˈfɔr wi riˈlis ðə ˈpeɪmənt faɪl/"}, {"topicRaw": "19-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 1, "vi": "Xin lỗi, phụ cấp ca đêm của 8 người bị tính thiếu trong kỳ này.", "en": "Sorry, night shift allo % from last month.", "ipa": "/beɪst‿ɑn ðə ˈfɪɡjɚz, ðɪs mʌnθs ˈpeɪroʊl kɔst‿ɪz‿ʌp faɪv pɚˈsɛnt frəm læst mʌnθ/"}, {"topicRaw": "19-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 3, "vi": "Tôi đề xuất chấm công tự động để giảm lỗi nhập liệu.", "en": "I recommend switching to automated timekeeping to reduce manual entry errors.", "ipa": "/aɪ ˌrɛkəˈmɛnd ˈswɪtʃɪŋ tu ˈɔɾəˌmeɪɾɪd ˈtaɪmˌkipɪŋ tə rɪˈdus ˈmænjuəl‿ˈɛntri ˈɛrɚz/"}, {"topicRaw": "19-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 3, "vi": "Tôi đề nghị chốt dữ liệu sớm 2 ngày trong tháng có lễ.", "en": "I'd suggest moving the cut-off two days earlier in months with public holidays.", "ipa": "/aɪd səˈdʒɛst ˈmuvɪŋ ðə kʌɾ‿ɔf tu deɪz‿ˈɝliɚ‿ɪn mʌnθs wɪθ ˈpʌblɪk ˈhɑləˌdeɪz/"}, {"topicRaw": "19-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 3, "vi": "Theo tôi, cần người thứ 2 kiểm tra bảng lương trước khi chi.", "en": "In my view, a second person should check payroll before any payment goes out.", "ipa": "/ɪn maɪ vju, ə ˈsɛkənd ˈpɝsən ʃʊd tʃɛk ˈpeɪroʊl bɪˈfɔr‿ˈɛni ˈpeɪmənt ɡoʊz‿aʊt/"}, {"topicRaw": "19-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 3, "vi": "Tôi hiểu bạn cần gấp, nhưng bảng lương chưa được CFO duyệt.", "en": "I see your point, but the payroll hasn't been approved by the CFO yet.", "ipa": "/aɪ si jɚ pɔɪnt, bət ðə ˈpeɪroʊl ˈhæzənt bɪn‿əˈpruvd baɪ ðə ˌsiɛfˈoʊ jɛt/"}, {"topicRaw": "19-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 3, "vi": "Có lẽ nên gửi phiếu lương qua ứng dụng HR thay vì email.", "en": "It might be worth sending payslips through the HR app instead of email.", "ipa": "/ɪt maɪt bi wɝθ ˈsɛndɪŋ ˈpeɪslɪps θru ði ˌeɪtʃˈɑr‿æp‿ɪnˈstɛd‿əv‿ˈimeɪl/"}, {"topicRaw": "19-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 4, "vi": "Chúng ta chuyển sang mục lương nhé, vì chỉ còn 10 phút.", "en": "Next, let's look at payroll, since we only have 10 minutes left.", "ipa": "/nɛkst, lɛts lʊk‿ət ˈpeɪroʊl, sɪns wi ˈoʊnli hæv tɛn ˈmɪn
