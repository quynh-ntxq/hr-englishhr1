ˈliɡəl ˈbeɪsəs fɚ itʃ ˈpeɪˌslɪp dɪˈdʌkʃən/"}, {"topicRaw": "23-Deductions", "topicName": "Deductions", "topicOrder": 23, "stage": 1, "vi": "Vui lòng ký xác nhận số tạm ứng còn lại trước ngày làm việc cuối cùng.", "en": "Please sign off on your outstanding advance before leaving.", "ipa": "/pliz saɪn‿ɔf‿ɑn jɚ ˌaʊtˈstændɪŋ‿ədˈvæns bɪˈfɔr ˈlivɪŋ/"}, {"topicRaw": "23-Deductions", "topicName": "Deductions", "topicOrder": 23, "stage": 1, "vi": "Xin lỗi, kỳ này bảo hiểm của bạn bị trừ theo mức lương cũ.", "en": "Sorry, your insurance was deducted on your old salary.", "ipa": "/ˈsɑri, jɚ ˌɪnˈʃʊrəns wəz dɪˈdʌktɪd‿ɑn jɚ oʊld ˈsælɚi/"}, {"topicRaw": "23-Deductions", "topicName": "Deductions", "topicOrder": 23, "stage": 1, "vi": "Khoản trừ thiếu sẽ được điều chỉnh trong kỳ lương tháng sau.", "en": "The under-deduction will be corrected in next month's payroll.", "ipa": "/ði ˈʌndɚ dɪˈdʌkʃən wɪl bi kəˈrɛktɪd‿ɪn nɛkst mʌnθs ˈpeɪroʊl/"}, {"topicRaw": "23-Deductions", "topicName": "Deductions", "topicOrder": 23, "stage": 2, "vi": "Theo luật, khấu trừ bồi thường không vượt 30% tiền lương tháng sau bảo hiểm và thuế.", "en": "By law, damage deductions can't exceed 30% of post-tax, post-insurance pay.", "ipa": "/baɪ lɔ, ˈdæmədʒ dɪˈdʌkʃənz kænt‿ɪkˈsid ˈθɝɾi pərˈsɛnt‿əv poʊst tæks, poʊst ˌɪnˈʃʊrəns peɪ/"}, {"topicRaw": "23-Deductions", "topicName": "Deductions", "topicOrder": 23, "stage": 2, "vi": "Quy trình là: đánh giá thiệt hại, họp xử lý, ra quyết định, rồi mới khấu trừ.", "en": "Process: assess damage, hold a hearing, issue a decision, then deduct.", "ipa": "/ˈprɑˌsɛs: əˈsɛs ˈdæmədʒ, hoʊld‿ə ˈhirɪŋ, ˈɪʃu ə dɪˈsɪʒən, ðɛn dɪˈdʌkt/"}, {"topicRaw": "23-Deductions", "topicName": "Deductions", "topicOrder": 23, "stage": 2, "vi": "Bạn có thể gửi bảng tính thiệt hại để tôi kiểm tra số tiền không?", "en": "Could you provide the damage calculation to verify the amount?", "ipa": "/kʊd ju prəˈvaɪd ðə ˈdæmədʒ ˌkælkjəˈleɪʃən tə ˈvɛrəˌfaɪ ði əˈmaʊnt/"}, {"topicRaw": "23-Deductions", "topicName": "Deductions", "topicOrder": 23, "stage": 2, "vi": "Bạn có phiền chia khoản khấu trừ ra nhiều tháng để nhân viên đỡ áp lực không?", "en": "Would you mind spreading the deduction over months to ease pressure?", "ipa": "/wʊd ju maɪnd ˈsprɛdɪŋ ðə dɪˈdʌkʃən‿ˈoʊvɚ mʌnθs tə iz ˈprɛʃɚ/"}, {"topicRaw": "23-Deductions", "topicName": "Deductions", "topicOrder": 23, "stage": 2, "vi": "Lương thực nhận giảm vì mức đóng bảo hiểm tăng theo lương mới.", "en": "Your take-home pay dropped as insurance rose with your new salary.", "ipa": "/jɚ teɪk hoʊm peɪ drɑpt‿əz‿ˌɪnˈʃʊrəns roʊz wɪθ jɚ nu ˈsælɚi/"}, {"topicRaw": "23-Deductions", "topicName": "Deductions", "topicOrder": 23, "stage": 2, "vi": "Nếu nghỉ việc khi còn nợ tạm ứng, khoản này sẽ được cấn trừ vào khoản thanh toán cuối cùng.", "en": "If you leave owing an advance, it's offset against final pay.", "ipa": "/ɪf ju liv‿ˈoʊɪŋ‿ən‿ədˈvæns, ɪts‿ɔfˈsɛt‿əˈɡɛnst ˈfaɪnəl peɪ/"}, {"topicRaw": "23-Deductions", "topicName": "Deductions", "topicOrder": 23, "stage": 2, "vi": "Rất tiếc, đoàn phí đã trừ không thể hoàn lại vì đã nộp cho công đoàn.", "en": "Unfortunately, union dues can't be refunded; they've already been remitted.", "ipa": "/ənˈfɔrtʃənətli, ˈjunjən duz kænt bi rɪˈfʌndɪd; ðeɪv‿ɔlˈrɛdi bɪn riˈmɪɾɪd/"}, {"topicRaw": "23-Deductions", "topicName": "Deductions", "topicOrder": 23, "stage": 2, "vi": "Tôi sẽ gửi bạn bảng chi tiết các khoản trừ kèm căn cứ trong hôm nay.", "en": "I'll send an itemized deduction list, with the basis, today.", "ipa": "/aɪl sɛnd‿ən‿ˈaɪɾəˌmaɪzd dɪˈdʌkʃən lɪst, wɪθ ðə ˈbeɪsəs, təˈdeɪ/"}, {"topicRaw": "23-Deductions", "topicName": "Deductions", "topicOrder": 23, "stage": 3, "vi": "Để tôi giải thích từng khoản trừ trên phiếu lương, từng dòng một.", "en": "Let me explain each payslip deduction, line by line.", "ipa": "/lɛt mi ɪkˈspleɪn‿itʃ ˈpeɪˌslɪp dɪˈdʌkʃən, laɪn baɪ laɪn/"}, {"topicRaw": "23-Deductions", "topicName": "Deductions", "topicOrder": 23, "stage": 3, "vi": "Để tôi làm rõ: BHXH tính theo lương đóng, không phải tổng thu nhập.", "en": "Let me clarify: insurance uses contribution salary, not total income.", "ipa": "/lɛt mi ˈklɛrəˌfaɪ: ˌɪnˈʃʊrəns ˈjusəz ˌkɑntrəˈbjuʃən ˈsælɚi, nɑt ˈtoʊɾəl‿ˈɪnˌkʌm/"}, {"topicRaw": "23-Deductions", "topicName": "Deductions", "topicOrder": 23, "stage": 3, "vi": "Theo đối chiếu, 5 nhân viên bị trừ sai phí công đoàn.", "en": "Based on reconciliation, five employees had wrong union fees deducted.", "ipa": "/beɪst‿ɑn ˌrɛkənˌsɪliˈeɪʃən, faɪv‿ɛmˈplɔɪiz həd rɔŋ ˈjunjən fiz dɪˈdʌktɪd/"}, {"topicRaw": "23-Deductions", "topicName": "Deductions", "topicOrder": 23, "stage": 3, "vi": "Tôi đề xuất giải thích khoản trừ mới trước ngày lương, không sau.", "en": "I recommend explaining new deductions before payday, not after.", "ipa": "/aɪ ˌrɛkəˈmɛnd‿ɪkˈspleɪnɪŋ nu dɪˈdʌkʃənz bɪˈfɔr ˈpeɪˌdeɪ, nɑt‿ˈæftɚ/"}, {"topicRaw": "23-Deductions", "topicName": "Deductions", "topicOrder": 23, "stage": 3, "vi": "Tôi đề nghị một mẫu đồng ý khấu trừ chuẩn cho mọi trường hợp.", "en": "I'd suggest one standard deduction consent form for every case.", "ipa": "/aɪd səˈdʒɛst wʌn ˈstændɚd dɪˈdʌkʃən kənˈsɛnt fɔrm fɚ ˈɛvri keɪs/"}, {"topicRaw": "23-Deductions", "topicName": "Deductions", "topicOrder": 23, "stage": 3, "vi": "Theo tôi, khoản trừ bất ngờ làm mất niềm tin nhanh nhất.", "en": "In my view, unexpected deductions erode trust fastest.", "ipa": "/ɪn maɪ vju, ˌʌnɪkˈspɛktɪd dɪˈdʌkʃənz‿ɪˈroʊd trʌst ˈfæstəst/"}, {"topicRaw": "23-Deductions", "topicName": "Deductions", "topicOrder": 23, "stage": 3, "vi": "Tôi hiểu, nhưng không có căn cứ pháp lý thì không được trừ.", "en": "I see, but we can't deduct without a legal basis.", "ipa": "/aɪ si, bət wi kænt dɪˈdʌkt wɪˈθaʊt‿ə ˈliɡəl ˈbeɪsəs/"}, {"topicRaw": "23-Deductions", "topicName": "Deductions", "topicOrder": 23, "stage": 3, "vi": "Có lẽ nên thêm ghi chú ngắn ngay trên phiếu lương.", "en": "It might be worth adding a short payslip note.", "ipa": "/ɪt maɪt bi wɝθ‿ˈædɪŋ‿ə ʃɔrt ˈpeɪˌslɪp noʊt/"}, {"topicRaw": "23-Deductions", "topicName": "Deductions", "topicOrder": 23, "stage": 4, "vi": "Chúng ta chuyển sang khoản trừ lương, vì tháng này nhiều người hỏi.", "en": "Let's move on to deductions, since several staff have asked about them this month.", "ipa": "/lɛts muv‿ɑn tə dɪˈdʌkʃənz, sɪns ˈsɛvrəl stæf hæv‿æskt‿əˈbaʊt ðəm ðɪs mʌnθ/"}, {"topicRaw": "23-Deductions", "topicName": "Deductions", "topicOrder": 23, "stage": 4, "vi": "Bạn trình bày cách trừ khoản tạm ứng lương được không?", "en": "Can you take us through how the salary advance will be deducted?", "ipa": "/kæn ju teɪk‿əs θru haʊ ðə ˈsæləri ədˈvæns wɪl bi dɪˈdʌktɪd/"}, {"topicRaw": "23-Deductions", "topicName": "Deductions", "topicOrder": 23, "stage": 4, "vi": "Có một điều tôi lo: vài khoản bị trừ khi chưa có văn bản đồng ý.", "en": "One thing worries me: some deductions were made without written consent.", "ipa": "/wʌn θɪŋ ˈwɝiz mi: səm dɪˈdʌkʃənz wɚ meɪd wɪˈθaʊt ˈrɪɾən kənˈsɛnt/"}, {"topicRaw": "23-Deductions", "topicName": "Deductions", "topicOrder": 23, "stage": 4, "vi": "Tôi hiểu có thiệt hại, nhưng mức trừ không được vượt giới hạn luật.", "en": "I understand the loss is real; however, the deduction can't exceed the legal limit.", "ipa": "/aɪ ˌʌndɚˈstænd ðə lɔs‿ɪz ril; haʊˈɛvɚ, ðə dɪˈdʌkʃən kænt‿ɪkˈsid ðə ˈliɡəl ˈlɪmɪt/"}, {"topicRaw": "23-Deductions", "topicName": "Deductions", "topicOrder": 23, "stage": 4, "vi": "Hay chúng ta trừ tạm ứng trong 3 tháng thay vì 1 tháng?", "en": "How about if we deduct the advance over three months instead of just one?", "ipa": "/haʊ əˈbaʊɾ‿ɪf wi dɪˈdʌkt ði ədˈvæns‿ˈoʊvɚ θri mʌnθs‿ɪnˈstɛd‿əv dʒʌst wʌn/"}, {"topicRaw": "23-Deductions", "topicName": "Deductions", "topicOrder": 23, "stage": 4, "vi": "Chúng tôi không thể hủy khoản trừ, nhưng có thể chia ra nhiều tháng.", "en": "We won't be able to cancel the deduction, but we can spread it over several months.", "ipa": "/wi woʊnt bi ˈeɪbəl tə ˈkænsəl ðə dɪˈdʌkʃən, bət wi kən sprɛd‿ɪɾ‿ˈoʊvɚ ˈsɛvrəl mʌnθs/"}, {"topicRaw": "23-Deductions", "topicName": "Deductions", "topicOrder": 23, "stage": 4, "vi": "Tóm lại, mỗi khoản trừ cần căn cứ pháp lý và chứng từ đầy đủ.", "en": "To summarize, every deduction needs a legal basis and proper documentation.", "ipa": "/tu ˈsʌməˌraɪz, ˈɛvri dɪˈdʌkʃən nidz‿ə ˈliɡəl ˈbeɪsɪs‿ən ˈprɑpɚ ˌdɑkjəmɛnˈteɪʃən/"}, {"topicRaw": "23-Deductions", "topicName": "Deductions", "topicOrder": 23, "stage": 4, "vi": "Bước tiếp theo: bộ phận lương gửi từng nhân viên bảng chi tiết khoản trừ.", "en": "As a next step, payroll will send each affected employee a detailed deduction note.", "ipa": "/æz‿ə nɛkst stɛp, ˈpeɪroʊl wɪl sɛnd‿itʃ‿əˈfɛktɪd‿ɪmˈplɔɪi ə dɪˈteɪld dɪˈdʌkʃən noʊt/"}, {"topicRaw": "23-Deductions", "topicName": "Deductions", "topicOrder": 23, "stage": 5, "vi": "Thật lòng, phần lớn khiếu nại về khoản trừ là do chúng ta giải thích quá muộn.", "en": "Honestly, most deduction complaints happen because we explain the numbers too late.", "ipa": "/ˈɑnəstli, moʊst dɪˈdʌkʃən kəmˈpleɪnts ˈhæpən bɪˈkɔz wi ɪkˈspleɪn ðə ˈnʌmbɚz tu leɪt/"}, {"topicRaw": "23-Deductions", "topicName": "Deductions", "topicOrder": 23, "stage": 5, "vi": "Theo kinh nghiệm, một dòng ghi chú trên phiếu lương ngăn được hầu hết tranh chấp.", "en": "In my experience, a short note on the payslip prevents most deduction disputes.", "ipa": "/ɪn maɪ ɪkˈspɪriəns, ə ʃɔrt noʊɾ‿ɑn ðə ˈpeɪslɪp prɪˈvɛnts moʊst dɪˈdʌkʃən dɪˈspjuts/"}, {"topicRaw": "23-Deductions", "topicName": "Deductions", "topicOrder": 23, "stage": 5, "vi": "Điều quan trọng là không khoản trừ nào được làm nhân viên bất ngờ vào ngày lương.", "en": "What really matters is that no deduction should ever surprise an employee on payday.", "ipa": "/wʌt ˈriəli ˈmæɾɚz‿ɪz ðæt noʊ dɪˈdʌkʃən ʃʊd‿ˈɛvɚ sɚˈpraɪz‿ən‿ɪmˈplɔɪi ɑn ˈpeɪˌdeɪ/"}, {"topicRaw": "23-Deductions", "topicName": "Deductions", "topicOrder": 23, "stage": 5, "vi": "Rủi ro lớn nhất là bị khiếu nại, vì trừ lương trái phép là vi phạm luật.", "en": "The main risk is a labor complaint, because unauthorized deductions clearly violate the law.", "ipa": "/ðə meɪn rɪsk‿ɪz‿ə ˈleɪbɚ kəmˈpleɪnt, bɪˈkɔz‿ʌnˈɔθəˌraɪzd dɪˈdʌkʃənz ˈklɪrli ˈvaɪəˌleɪt ðə lɔ/"}, {"topicRaw": "23-Deductions", "topicName": "Deductions", "topicOrder": 23, "stage": 5, "vi": "Nếu không có văn bản đồng ý, có thể phải hoàn lại toàn bộ số đã trừ.", "en": "Unless we get written consent, we may have to refund every deducted amount.", "ipa": "/ənˈlɛs wi ɡɛt ˈrɪɾən kənˈsɛnt, wi meɪ hæv tə ˈrifʌnd‿ˈɛvri dɪˈdʌktɪd‿əˈmaʊnt/"}, {"topicRaw": "23-Deductions", "topicName": "Deductions", "topicOrder": 23, "stage": 5, "vi": "Tôi phản bác trừ thiệt hại một lần, vì lương của nhân viên này khá thấp.", "en": "I'd challenge deducting the damage in one go, given the employee's low salary.", "ipa": "/aɪd ˈtʃælɪndʒ dɪˈdʌktɪŋ ðə ˈdæmɪdʒ‿ɪn wʌn ɡoʊ, ˈɡɪvən ði ɪmˈplɔɪiz loʊ ˈsæləri/"}, {"topicRaw": "23-Deductions", "topicName": "Deductions", "topicOrder": 23, "stage": 5, "vi": "Điều tôi lo nhất là quản lý hứa trừ lương mà không kiểm tra giới hạn luật.", "en": "What concerns me most is that managers promise deductions without checking the legal limits first.", "ipa": "/wʌt kənˈsɝnz mi moʊst‿ɪz ðæt ˈmænɪdʒɚz ˈprɑmɪs dɪˈdʌkʃənz wɪˈθaʊt ˈtʃɛkɪŋ ðə ˈliɡəl ˈlɪmɪts fɝst/"}, {"topicRaw": "23-Deductions", "topicName": "Deductions", "topicOrder": 23, "stage": 5, "vi": "Tôi đề xuất mẫu đồng ý chuẩn cho khoản tạm ứng và các khoản trừ tự nguyện.", "en": "What I'd propose is a standard consent form for advances and other voluntary deductions.", "ipa": "/wʌɾ‿aɪd prəˈpoʊz‿ɪz‿ə ˈstændɚd kənˈsɛnt fɔrm fɚr‿ədˈvænsɪz‿ən ˈʌðɚ ˈvɑlənˌtɛri dɪˈdʌkʃənz/"}, {"topicRaw": "23-Deductions", "topicName": "Deductions", "topicOrder": 23, "stage": 6, "vi": "Niềm tin đến bằng bước chân, ra đi bằng ngựa phi.", "en": "Trust arrives on foot and leaves on horseback.", "ipa": "/trʌst‿əˈraɪvz‿ɑn fʊɾ‿ən livz‿ɑn ˈhɔrsbæk/"}, {"topicRaw": "23-Deductions", "topicName": "Deductions", "topicOrder": 23, "stage": 6, "vi": "Mỗi đồng bị trừ đều cần một lý do rõ ràng.", "en": "Every dong deducted needs a clear reason.", "ipa": "/ˈɛvri dɔŋ dɪˈdʌktɪd nidz‿ə klɪr ˈrizən/"}, {"topicRaw": "23-Deductions", "topicName": "Deductions", "topicOrder": 23, "stage": 6, "vi": "40% thắc mắc về lương năm nay liên quan đến khoản trừ, chủ yếu do giải thích chưa rõ.", "en": "Forty percent of this year's payroll queries were about deductions, mostly due to poor explanations.", "ipa": "/ˈfɔrti pɚˈsɛnt‿əv ðɪs jɪrz ˈpeɪroʊl ˈkwɪriz wɚ‿əˈbaʊt dɪˈdʌkʃənz, ˈmoʊstli du tə pʊr‿ˌɛkspləˈneɪʃənz/"}, {"topicRaw": "23-Deductions", "topicName": "Deductions", "topicOrder": 23, "stage": 6, "vi": "Một khoản trừ trái luật có thể dẫn đến khiếu nại, buộc hoàn trả và bị phạt hành chính.", "en": "An unlawful deduction can lead to complaints, mandatory refunds, and administrative fines.", "ipa": "/ən‿ənˈlɔfəl dɪˈdʌkʃən kən lid tə kəmˈpleɪnts, ˈmændəˌtɔri ˈrifʌndz, ən‿ədˈmɪnəˌstreɪɾɪv faɪnz/"}, {"topicRaw": "23-Deductions", "topicName": "Deductions", "topicOrder": 23, "stage": 6, "vi": "Phiếu lương là để giải thích, không phải để gây thắc mắc.", "en": "A payslip should answer questions, not create them.", "ipa": "/ə ˈpeɪslɪp ʃʊd‿ˈænsɚ ˈkwɛstʃənz, nɑt kriˈeɪt ðɛm/"}, {"topicRaw": "23-Deductions", "topicName": "Deductions", "topicOrder": 23, "stage": 6, "vi": "Các công ty ghi chú khoản trừ ngay trên phiếu lương giảm hơn một nửa số câu hỏi liên quan.", "en": "Companies that annotate deductions on payslips cut related queries by more than half.", "ipa": "/ˈkʌmpəniz ðæɾ‿ˈænəˌteɪt dɪˈdʌkʃənz‿ɑn ˈpeɪˌslɪps kʌt rɪˈleɪɾɪd ˈkwɪriz baɪ mɔr ðən hæf/"}, {"topicRaw": "23-Deductions", "topicName": "Deductions", "topicOrder": 23, "stage": 6, "vi": "Tôi đề xuất thêm cột giải thích trên phiếu lương, chi phí gần như bằng 0.", "en": "I propose adding an explanation column to the payslip; the cost is almost zero.", "ipa": "/aɪ prəˈpoʊz‿ˈædɪŋ‿ən‿ˌɛkspləˈneɪʃən ˈkɑləm tə ðə ˈpeɪˌslɪp; ðə kɔst‿ɪz‿ˈɔlmoʊst ˈzɪroʊ/"}, {"topicRaw": "23-Deductions", "topicName": "Deductions", "topicOrder": 23, "stage": 6, "vi": "Mục tiêu là giảm một nửa số thắc mắc về khoản trừ trong 6 tháng.", "en": "We're aiming to halve deduction queries within six months.", "ipa": "/wɪr‿ˈeɪmɪŋ tə hæv dɪˈdʌkʃən ˈkwɪriz wɪˈθɪn sɪks mʌnθs/"}, {"topicRaw": "24-Social Insurance", "topicName": "Social Insurance", "topicOrder": 24, "stage": 1, "vi": "Tiền lương đóng bảo hiểm xã hội tối đa bằng 20 lần mức tham chiếu.", "en": "Contribution salary caps at 20 times the reference level.", "ipa": "/ˌkɑntrəˈbjuʃən ˈsælɚi kæps‿ət ˈtwɛni taɪmz ðə ˈrɛfɚəns ˈlɛvəl/"}, {"topicRaw": "24-Social Insurance", "topicName": "Social Insurance", "topicOrder": 24, "stage": 1, "vi": "Công ty đóng tổng cộng 21,5% cho bảo hiểm xã hội, y tế và thất nghiệp.", "en": "Employer contribution: 21.5% for social, health, unemployment insurance.", "ipa": "/ɛmˈplɔɪɚ ˌkɑntrəˈbjuʃən: ˈtwɛni wʌn pɔɪnt faɪv pərˈsɛnt fɚ ˈsoʊʃəl, hɛlθ, ˌʌnɪmˈplɔɪmənt‿ˌɪnˈʃʊrəns/"}, {"topicRaw": "24-Social Insurance", "topicName": "Social Insurance", "topicOrder": 24, "stage": 1, "vi": "Hồ sơ báo tăng cho nhân viên mới tháng này đã nộp chưa?", "en": "Have we filed new joiners' insurance registrations this month?", "ipa": "/həv wi faɪld nu ˈdʒɔɪnɚz‿ˌɪnˈʃʊrəns ˌrɛdʒɪˈstreɪʃənz ðɪs mʌnθ/"}, {"topicRaw": "24-Social Insurance", "topicName": "Social Insurance", "topicOrder": 24, "stage": 1, "vi": "Bạn đã chốt quá trình đóng bảo hiểm cho người nghỉ việc tháng trước chưa?", "en": "Have you closed insurance records for last month's leavers?", "ipa": "/həv ju kloʊzd‿ˌɪnˈʃʊrəns rəˈkɔrdz fɚ læst mʌnθs ˈlivɚz/"}, {"topicRaw": "24-Social Insurance", "topicName": "Social Insurance", "topicOrder": 24, "stage": 1, "vi": "Vui lòng nộp giấy nghỉ hưởng BHXH trong vòng 45 ngày kể từ khi đi làm lại.", "en": "Submit your leave certificate within 45 days of returning.", "ipa": "/səbˈmɪt jɚ liv sɚˈtɪfɪkət wɪˈðɪn ˈfɔrɾi faɪv deɪz‿əv rɪˈtɝnɪŋ/"}, {"topicRaw": "24-Social Insurance", "topicName": "Social Insurance", "topicOrder": 24, "stage": 1, "vi": "Vui lòng kiểm tra quá trình đóng trên VssID và báo nếu có sai lệch.", "en": "Please check your VssID contribution history and flag discrepancies.", "ipa": "/pliz tʃɛk jɚ vi ɛs ɛs aɪ di ˌkɑntrəˈbjuʃən ˈhɪstɚi ən flæɡ dɪˈskrɛpənsiz/"}, {"topicRaw": "24-Social Insurance", "topicName": "Social Insurance", "topicOrder": 24, "stage": 1, "vi": "Xin lỗi, hồ sơ thai sản của bạn bị trả về vì thiếu giấy khai sinh của bé.", "en": "Sorry, your maternity claim was returned: birth certificate missing.", "ipa": "/ˈsɑri, jɚ məˈtɝnɪti kleɪm wəz rɪˈtɝnd: bɝθ sɚˈtɪfɪkət ˈmɪsɪŋ/"}, {"topicRaw": "24-Social Insurance", "topicName": "Social Insurance", "topicOrder": 24, "stage": 1, "vi": "Tôi sẽ nộp lại hồ sơ ngay khi nhận đủ giấy tờ từ bạn.", "en": "I'll resubmit the claim once I have your documents.", "ipa": "/aɪl ˌrisəbˈmɪt ðə kleɪm wʌns‿aɪ həv jɚ ˈdɑkjəmənts/"}, {"topicRaw": "24-Social Insurance", "topicName": "Social Insurance", "topicOrder": 24, "stage": 2, "vi": "Theo luật, chậm đóng bảo hiểm sẽ bị tính lãi và có thể bị phạt.", "en": "By law, late insurance contributions incur interest and possible fines.", "ipa": "/baɪ lɔ, leɪt‿ˌɪnˈʃʊrəns ˌkɑntrəˈbjuʃənz‿ˌɪnˈkɝ ˈɪntrəst‿ən ˈpɑsəbəl faɪnz/"}, {"topicRaw": "24-Social Insurance", "topicName": "Social Insurance", "topicOrder": 24, "stage": 2, "vi": "HR nộp hồ sơ cho cơ quan bảo hiểm, rồi trợ cấp được chuyển vào tài khoản bạn.", "en": "HR files your claim, then benefits are paid into your account.", "ipa": "/eɪtʃ ɑr faɪlz jɚ kleɪm, ðɛn ˈbɛnəfɪts‿ɚ peɪd‿ˈɪntu jɚ əˈkaʊnt/"}, {"topicRaw": "24-Social Insurance", "topicName": "Social Insurance", "topicOrder": 24, "stage": 2, "vi": "Bạn có thể gửi hợp đồng mới để tôi điều chỉnh mức đóng không?", "en": "Could you send the new contract so I can adjust contributions?", "ipa": "/kʊd ju sɛnd ðə nu ˈkɑnˌtrækt soʊ aɪ kən‿əˈdʒʌst ˌkɑntrəˈbjuʃənz/"}, {"topicRaw": "24-Social Insurance", "topicName": "Social Insurance", "topicOrder": 24, "stage": 2, "vi": "Bạn có phiền xác nhận ngày dự kiến bắt đầu nghỉ thai sản không?", "en": "Would you mind confirming your planned maternity leave start date?", "ipa": "/wʊd ju maɪnd kənˈfɝmɪŋ jɚ plænd məˈtɝnəɾi liv stɑrt deɪt/"}, {"topicRaw": "24-Social Insurance", "topicName": "Social Insurance", "topicOrder": 24, "stage": 2, "vi": "Mức đóng của bạn tăng vì phụ cấp trách nhiệm mới đã được đưa vào lương đóng.", "en": "Your contribution rose because the new responsibility allowance is now included.", "ipa": "/jɚ ˌkɑntrəˈbjuʃən roʊz bɪˈkɔz ðə nu riˌspɑnsəˈbɪləti əˈlaʊəns‿ɪz naʊ ˌɪnˈkludəd/"}, {"topicRaw": "24-Social Insurance", "topicName": "Social Insurance", "topicOrder": 24, "stage": 2, "vi": "Nếu nghỉ không lương từ 14 ngày làm việc trở lên trong tháng, tháng đó không phải đóng.", "en": "Unpaid leave of 14 working days or more means no contribution.", "ipa": "/ənˈpeɪd liv‿əv fɔrˈtin ˈwɝkɪŋ deɪz‿ɚ mɔr minz noʊ ˌkɑntrəˈbjuʃən/"}, {"topicRaw": "24-Social Insurance", "topicName": "Social Insurance", "topicOrder": 24, "stage": 2, "vi": "Rất tiếc, bạn chưa đóng đủ 6 tháng trong 12 tháng gần nhất nên chưa đủ điều kiện.", "en": "Unfortunately, without six months' contributions in 12 months, you don't qualify.", "ipa": "/ənˈfɔrtʃənətli, wɪˈθaʊt sɪks mɑnθs ˌkɑntrəˈbjuʃənz‿ɪn twɛlv mʌnθs, ju doʊnt ˈkwɑləˌfaɪ/"}, {"topicRaw": "24-Social Insurance", "topicName": "Social Insurance", "topicOrder": 24, "stage": 2, "vi": "Tôi sẽ theo dõi hồ sơ và báo bạn khi trợ cấp được chi trả.", "en": "I'll track the claim and tell you when it's paid.", "ipa": "/aɪl træk ðə kleɪm‿ən tɛl ju wɛn‿ɪts peɪd/"}, {"topicRaw": "24-Social Insurance", "topicName": "Social Insurance", "topicOrder": 24, "stage": 3, "vi": "Để tôi giải thích cách tính và chi trả chế độ thai sản.", "en": "Let me explain how maternity benefits are calculated and paid.", "ipa": "/lɛt mi ɪkˈspleɪn haʊ məˈtɝnɪti ˈbɛnəfɪts‿ɚ ˈkælkjəˌleɪɾɪd‿ən peɪd/"}, {"topicRaw": "24-Social Insurance", "topicName": "Social Insurance", "topicOrder": 24, "stage": 3, "vi": "Để tôi làm rõ: BHYT vẫn có hiệu lực khi nghỉ thai sản.", "en": "Let me clarify: health insurance stays active during maternity leave.", "ipa": "/lɛt mi ˈklɛrəˌfaɪ: hɛlθ‿ˌɪnˈʃʊrəns steɪz‿ˈæktɪv ˈdʊrɪŋ məˈtɝnɪti liv/"}, {"topicRaw": "24-Social Insurance", "topicName": "Social Insurance", "topicOrder": 24, "stage": 3, "vi": "Theo các vụ trước đây, đăng ký trễ thường bị phạt và tính lãi.", "en": "Based on past cases, late registration means fines and interest.", "ipa": "/beɪst‿ɑn pæst ˈkeɪsəz, leɪt ˌrɛdʒɪˈstreɪʃən minz faɪnz‿ən‿ˈɪntrəst/"}, {"topicRaw": "24-Social Insurance", "topicName": "Social Insurance", "topicOrder": 24, "stage": 3, "vi": "Tôi đề xuất mỗi năm rà soát lương đóng bảo hiểm cho chính xác.", "en": "I recommend reviewing everyone's contribution salary yearly for accuracy.", "ipa": "/aɪ ˌrɛkəˈmɛnd riˈvjuɪŋ‿ˈɛvriˌwʌnz ˌkɑntrəˈbjuʃən ˈsælɚi ˈjɪrli fɚ ˈækjɚəsi/"}, {"topicRaw": "24-Social Insurance", "topicName": "Social Insurance", "topicOrder": 24, "stage": 3, "vi": "Tôi đề nghị gửi hướng dẫn VssID đơn giản cho mọi nhân viên mới.", "en": "I'd suggest sending every new joiner a simple VssID guide.", "ipa": "/aɪd səˈdʒɛst ˈsɛndɪŋ‿ˈɛvri nu ˈdʒɔɪnɚ ə ˈsɪmpəl vi ɛs ɛs aɪ di ɡaɪd/"}, {"topicRaw": "24-Social Insurance", "topicName": "Social Insurance", "topicOrder": 24, "stage": 3, "vi": "Theo tôi, nhiều nhân viên chưa hiểu rõ quyền lợi bảo hiểm của mình.", "en": "In my view, many employees don't understand their insurance benefits.", "ipa": "/ɪn maɪ vju, ˈmɛni ɛmˈplɔɪiz doʊnt‿ˌʌndɚˈstænd ðɛr‿ˌɪnˈʃʊrəns ˈbɛnəfɪts/"}, {"topicRaw": "24-Social Insurance", "topicName": "Social Insurance", "topicOrder": 24, "stage": 3, "vi": "Tôi hiểu, nhưng hợp đồng từ 1 tháng phải đóng bảo hiểm.", "en": "I see, but contracts from one month require insurance.", "ipa": "/aɪ si, bət ˈkɑnˌtrækts frəm wʌn mʌnθ ˌriˈkwaɪɚ ˌɪnˈʃʊrəns/"}, {"topicRaw": "24-Social Insurance", "topicName": "Social Insurance", "topicOrder": 24, "stage": 3, "vi": "Có lẽ nên tổ chức buổi ngắn giải thích quyền lợi bảo hiểm.", "en": "It might be worth a short session on insurance benefits.", "ipa": "/ɪt maɪt bi wɝθ‿ə ʃɔrt ˈsɛʃən‿ɑn‿ˌɪnˈʃʊrəns ˈbɛnəfɪts/"}, {"topicRaw": "24-Social Insurance", "topicName": "Social Insurance", "topicOrder": 24, "stage": 4, "vi": "Chúng ta chuyển sang tuân thủ BHXH nhé, vì tháng sau có kiểm tra.", "en": "Let's turn to social insurance compliance, since the audit is next month.", "ipa": "/lɛts tɝn tə ˈsoʊʃəl‿ɪnˈʃʊrəns kəmˈplaɪəns, sɪns ði ˈɔdɪɾ‿ɪz nɛkst mʌnθ/"}, {"topicRaw": "24-Social Insurance", "topicName": "Social Insurance", "topicOrder": 24, "stage": 4, "vi": "Bạn trình bày tình hình đăng ký mới tháng này được không?", "en": "Would you mind going over the status of this month's new registrations?", "ipa": "/wʊd ju maɪnd ˈɡoʊɪŋ‿ˈoʊvɚ ðə ˈstæɾəs‿əv ðɪs mʌnθs nu ˌrɛdʒɪˈstreɪʃənz/"}, {"topicRaw": "24-Social Insurance", "topicName": "Social Insurance", "topicOrder": 24, "stage": 4, "vi": "Tôi muốn nêu lo ngại: 4 người mới vẫn chưa được đăng ký bảo hiểm.", "en": "I'd like to raise a concern: four new hires haven't been registered yet.", "ipa": "/aɪd laɪk tə reɪz‿ə kənˈsɝn: fɔr nu haɪɚz ˈhævənt bɪn ˈrɛdʒɪstɚd jɛt/"}, {"topicRaw": "24-Social Insurance", "topicName": "Social Insurance", "topicOrder": 24, "stage": 4, "vi": "Tôi hiểu áp lực chi phí, nhưng bảo hiểm phải đóng trên lương hợp đồng.", "en": "I get that costs are tight; however, insurance must be paid on the full contract salary.", "ipa": "/aɪ ɡɛt ðæt kɔsts‿ɚ taɪt; haʊˈɛvɚ, ɪnˈʃʊrəns mʌst bi peɪd‿ɑn ðə fʊl ˈkɑntrækt ˈsæləri/"}, {"topicRaw": "24-Social Insurance", "topicName": "Social Insurance", "topicOrder": 24, "stage": 4, "vi": "Hay chúng ta đặt hạn nội bộ ngày 20 cho mọi hồ sơ bảo hiểm?", "en": "Would it help if we set an internal deadline on the 20th for all insurance files?", "ipa": "/wʊd‿ɪt hɛlp‿ɪf wi sɛɾ‿ən‿ɪnˈtɝnəl ˈdɛdˌlaɪn‿ɑn ðə ˈtwɛntiəθ fɚ‿ɔl‿ɪnˈʃʊrəns faɪlz/"}, {"topicRaw": "24-Social Insurance", "topicName": "Social Insurance", "topicOrder": 24, "stage": 4, "vi": "Không thể lùi hạn đóng, nhưng có thể chia khoản truy đóng làm 2 tháng.", "en": "We can't delay the payment, but we can split the back payment into two months.", "ipa": "/wi kænt dɪˈleɪ ðə ˈpeɪmənt, bət wi kən splɪt ðə bæk ˈpeɪmənt‿ˈɪntu tu mʌnθs/"}, {"topicRaw": "24-Social Insurance", "topicName": "Social Insurance", "topicOrder": 24, "stage": 4, "vi": "Tóm lại, tuần này đăng ký đủ cho người mới và cập nhật trên VssID.", "en": "To wrap up, all new hires will be registered this week and updated on VssID.", "ipa": "/tu ræp‿ʌp, ɔl nu haɪɚz wɪl bi ˈrɛdʒɪstɚd ðɪs wik‿ən‿ʌpˈdeɪɾɪd‿ɑn ˌviɛsɛsaɪˈdi/"}, {"topicRaw": "24-Social Insurance", "topicName": "Social Insurance", "topicOrder": 24, "stage": 4, "vi": "Sau buổi họp, HR gửi báo cáo bảo hiểm cho giám đốc tài chính trước thứ Sáu.", "en": "After this meeting, HR will send the insurance report to the finance director by Friday.", "ipa": "/ˈæftɚ ðɪs ˈmiɾɪŋ, ˌeɪtʃˈɑr wɪl sɛnd ði ɪnˈʃʊrəns rɪˈpɔrt tə ðə ˈfaɪnæns dəˈrɛktɚ baɪ ˈfraɪdeɪ/"}, {"topicRaw": "24-Social Insurance", "topicName": "Social Insurance", "topicOrder": 24, "stage": 5, "vi": "Thật lòng, đóng bảo hiểm trên mức lương thấp tiết kiệm trước mắt nhưng rủi ro về sau.", "en": "To be frank, paying insurance on a lower salary base saves money now but creates bigger risks later.", "ipa": "/tu bi fræŋk, ˈpeɪɪŋ‿ɪnˈʃʊrəns‿ɑn‿ə ˈloʊɚ ˈsæləri beɪs seɪvz ˈmʌni naʊ bət kriˈeɪts ˈbɪɡɚ rɪsks ˈleɪɾɚ/"}, {"topicRaw": "24-Social Insurance", "topicName": "Social Insurance", "topicOrder": 24, "stage": 5, "vi": "Theo kinh nghiệm, hồ sơ thai sản bị từ chối thường do đăng ký trễ.", "en": "What I've seen is that late registration is the most common reason maternity claims get rejected.", "ipa": "/wʌɾ‿aɪv sin‿ɪz ðæt leɪt ˌrɛdʒɪˈstreɪʃən‿ɪz ðə moʊst ˈkɑmən ˈrizən məˈtɝnəɾi kleɪmz ɡɛt rɪˈdʒɛktɪd/"}, {"topicRaw": "24-Social Insurance", "topicName": "Social Insurance", "topicOrder": 24, "stage": 5, "vi": "Mấu chốt là bảo hiểm bảo vệ nhân viên, nên tuân thủ là bắt buộc.", "en": "The bottom line is that insurance protects employees, so compliance is never optional.", "ipa": "/ðə ˈbɑɾəm laɪn‿ɪz ðæɾ‿ɪnˈʃʊrəns prəˈtɛkts‿ɪmˈplɔɪiz, soʊ kəmˈplaɪəns‿ɪz ˈnɛvɚ‿ˈɑpʃənəl/"}, {"topicRaw": "24-Social Insurance", "topicName": "Social Insurance", "topicOrder": 24, "stage": 5, "vi": "Rủi ro lớn nhất là bị truy đóng cả năm, cộng thêm tiền lãi chậm đóng.", "en": "The biggest risk here is a back payment for the whole year, plus late-payment interest.", "ipa": "/ðə ˈbɪɡɪst rɪsk hɪr‿ɪz‿ə bæk ˈpeɪmənt fɚ ðə hoʊl jɪr, plʌs leɪt ˈpeɪmənt‿ˈɪntrəst/"}, {"topicRaw": "24-Social Insurance", "topicName": "Social Insurance", "topicOrder": 24, "stage": 5, "vi": "Nếu đóng sai mức lương, nhân viên sẽ mất một phần lương hưu sau này.", "en": "If we fail to use the correct salary base, employees will lose part of their future pension.", "ipa": "/ɪf wi feɪl tə juz ðə kəˈrɛkt ˈsæləri beɪs, ɪmˈplɔɪiz wɪl luz pɑrɾ‿əv ðɛr ˈfjutʃɚ ˈpɛnʃən/"}, {"topicRaw": "24-Social Insurance", "topicName": "Social Insurance", "topicOrder": 24, "stage": 5, "vi": "Tôi phản đối chờ hết thử việc mới đóng bảo hiểm khi thử việc ghi trong HĐLĐ.", "en": "I'd push back on delaying insurance until after probation when probation is part of the labor contract.", "ipa": "/aɪd pʊʃ bæk‿ɑn dɪˈleɪɪŋ ɪnˈʃʊrəns ənˈtɪl‿ˈæftɚ proʊˈbeɪʃən wɛn proʊˈbeɪʃən‿ɪz pɑrt‿əv ðə ˈleɪbɚ ˈkɑntrækt/"}, {"topicRaw": "24-Social Insurance", "topicName": "Social Insurance", "topicOrder": 24, "stage": 5, "vi": "Điều tôi lo nhất là nhân viên chỉ phát hiện vấn đề khi cần hưởng chế độ.", "en": "What worries me is that employees only discover the problem when they need a benefit.", "ipa": "/wʌt ˈwɝiz mi ɪz ðæɾ‿ɪmˈplɔɪiz‿ˈoʊnli dɪˈskʌvɚ ðə ˈprɑbləm wɛn ðeɪ nid‿ə ˈbɛnəfɪt/"}, {"topicRaw": "24-Social Insurance", "topicName": "Social Insurance", "topicOrder": 24, "stage": 5, "vi": "Tôi đề xuất đối chiếu lương và dữ liệu bảo hiểm hằng tháng trước mỗi lần nộp.", "en": "My suggestion is a monthly check between payroll and insurance records before each filing.", "ipa": "/maɪ səɡˈdʒɛstʃən‿ɪz‿ə ˈmʌnθli tʃɛk bɪˈtwin ˈpeɪroʊl‿ən‿ɪnˈʃʊrəns ˈrɛkɚdz bɪˈfɔr‿itʃ ˈfaɪlɪŋ/"}, {"topicRaw": "24-Social Insurance", "topicName": "Social Insurance", "topicOrder": 24, "stage": 6, "vi": "Phòng bệnh hơn chữa bệnh.", "en": "Prevention is better than cure.", "ipa": "/prɪˈvɛnʃən‿ɪz ˈbɛɾɚ ðən kjʊr/"}, {"topicRaw": "24-Social Insurance", "topicName": "Social Insurance", "topicOrder": 24, "stage": 6, "vi": "Bảo hiểm là lời hứa dài hạn với người lao động.", "en": "Insurance is a long-term promise to our people.", "ipa": "/ɪnˈʃʊrəns‿ɪz‿ə lɔŋ tɝm ˈprɑmɪs tu ˈaʊɚ ˈpipəl/"}, {"topicRaw": "24-Social Insurance", "topicName": "Social Insurance", "topicOrder": 24, "stage": 6, "vi": "Đối chiếu cho thấy 9% nhân viên đang đóng bảo hiểm thấp hơn lương hợp đồng.", "en": "Our reconciliation shows 9% of employees contributing below their contract salary.", "ipa": "/ˈaʊɚ ˌrɛkənsɪliˈeɪʃən ʃoʊz naɪn pɚˈsɛnt‿əv‿ɪmˈplɔɪiz kənˈtrɪbjuɾɪŋ bɪˈloʊ ðɛr ˈkɑntrækt ˈsæləri/"}, {"topicRaw": "24-Social Insurance", "topicName": "Social Insurance", "topicOrder": 24, "stage": 6, "vi": "Nếu bị thanh tra, công ty phải truy đóng, nộp lãi chậm đóng và chịu phạt, chưa kể ảnh hưởng uy tín.", "en": "In an audit, we'd owe back contributions, late interest, and fines, plus reputational damage.", "ipa": "/ɪn‿ən‿ˈɔdɪt, wid‿oʊ bæk ˌkɑntrəˈbjuʃənz, leɪɾ‿ˈɪntrəst, ən faɪnz, plʌs ˌrɛpjəˈteɪʃənəl ˈdæmɪdʒ/"}, {"topicRaw": "24-Social Insurance", "topicName": "Social Insurance", "topicOrder": 24, "stage": 6, "vi": "Bảo hiểm là quyền lợi, không phải chi phí.", "en": "Insurance is a benefit, not just a cost.", "ipa": "/ɪnˈʃʊrəns‿ɪz‿ə ˈbɛnəfɪt, nɑt dʒʌst‿ə kɔst/"}, {"topicRaw": "24-Social Insurance", "topicName": "Social Insurance", "topicOrder": 24, "stage": 6, "vi": "Các doanh nghiệp đối chiếu bảo hiểm hằng tháng gần như không có chênh lệch cuối năm.", "en": "Companies that reconcile insurance monthly see almost no variances at year-end.", "ipa": "/ˈkʌmpəniz ðæt ˈrɛkənˌsaɪl‿ɪnˈʃʊrəns ˈmʌnθli si ˈɔlmoʊst noʊ ˈvɛriənsɪz‿ət jɪr‿ɛnd/"}, {"topicRaw": "24-Social Insurance", "topicName": "Social Insurance", "topicOrder": 24, "stage": 6, "vi": "Tôi đề xuất điều chỉnh mức đóng ngay từ tháng sau, chi phí tăng khoảng 45 triệu mỗi tháng.", "en": "I recommend correcting the contribution base from next month, costing about 45 million VND monthly.", "ipa": "/aɪ ˌrɛkəˈmɛnd kəˈrɛktɪŋ ðə ˌkɑntrəˈbjuʃən beɪs frəm nɛkst mʌnθ, ˈkɔstɪŋ‿əˈbaʊt ˈfɔrtiˌfaɪv ˈmɪljən ˌviɛnˈdi ˈmʌnθli/"}, {"topicRaw": "24-Social Insurance", "topicName": "Social Insurance", "topicOrder": 24, "stage": 6, "vi": "Mục tiêu là mức đóng khớp hoàn toàn lương hợp đồng và không có sai lệch đối chiếu hằng tháng.", "en": "We're targeting full alignment with contract salaries and zero reconciliation variances every month.", "ipa": "/wɪr ˈtɑrɡəɾɪŋ fʊl‿əˈlaɪnmənt wɪθ ˈkɑntrækt ˈsæləriz‿ən ˈzɪroʊ ˌrɛkənsɪliˈeɪʃən ˈvɛriənsɪz‿ˈɛvri mʌnθ/"}, {"topicRaw": "25-Personal Income Tax", "topicName": "Personal Income Tax", "topicOrder": 25, "stage": 1, "vi": "Người không cư trú chịu thuế suất 20% trên thu nhập phát sinh tại Việt Nam.", "en": "Non-residents pay a flat 20% on Vietnam-sourced income.", "ipa": "/nɑn ˈrɛzɪdənts peɪ ə flæt ˈtwɛni pərˈsɛnt‿ɑn viˌɛtˈnɑm sɔrst‿ˈɪnˌkʌm/"}, {"topicRaw": "25-Personal Income Tax", "topicName": "Personal Income Tax", "topicOrder": 25, "stage": 1, "vi": "Thưởng Tết được cộng vào thu nhập chịu thuế của tháng chi trả.", "en": "The Tet bonus is taxable in the month paid.", "ipa": "/ðə tɛt ˈboʊnəs‿ɪz ˈtæksəbəl‿ɪn ðə mʌnθ peɪd/"}, {"topicRaw": "25-Personal Income Tax", "topicName": "Personal Income Tax", "topicOrder": 25, "stage": 1, "vi": "Bạn đã ở Việt Nam đủ 183 ngày trong năm tính thuế chưa?", "en": "Have you spent 183 days in Vietnam this year?", "ipa": "/həv ju spɛnt wʌn ˈhʌndrəd ˈeɪɾi θri deɪz‿ɪn viˌɛtˈnɑm ðɪs jɪr/"}, {"topicRaw": "25-Personal Income Tax", "topicName": "Personal Income Tax", "topicOrder": 25, "stage": 1, "vi": "Lương này gross hay net, để tôi biết cần quy đổi không?", "en": "Is this gross or net, so I can convert?", "ipa": "/ɪz ðɪs ɡroʊs‿ɚ nɛt, soʊ aɪ kən ˈkɑnvɚt/"}, {"topicRaw": "25-Personal Income Tax", "topicName": "Personal Income Tax", "topicOrder": 25, "stage": 1, "vi": "Vui lòng gửi giấy tờ chứng minh người phụ thuộc trước ngày chốt lương.", "en": "Please send dependent proof before the payroll cut-off.", "ipa": "/pliz sɛnd dɪˈpɛndənt pruf bɪˈfɔr ðə ˈpeɪˌroʊl kʌt ɔf/"}, {"topicRaw": "25-Personal Income Tax", "topicName": "Personal Income Tax", "topicOrder": 25, "stage": 1, "vi": "Vui lòng cập nhật số định danh cá nhân, nay dùng thay cho mã số thuế cũ.", "en": "Update your ID number; it replaces your tax code.", "ipa": "/əpˈdeɪt jɚ aɪ di ˈnʌmbɚ; ɪt rɪˈpleɪsɪz jɚ tæks koʊd/"}, {"topicRaw": "25-Personal Income Tax", "topicName": "Personal Income Tax", "topicOrder": 25, "stage": 1, "vi": "Xin lỗi, thuế tính sai vì chưa áp dụng mức giảm trừ mới.", "en": "Sorry, tax was miscalculated; new deductions weren't applied.", "ipa": "/ˈsɑri, tæks wəz mɪˈskælkjəˌleɪɾɪd; nu dɪˈdʌkʃənz ˈwɝənt‿əˈplaɪd/"}, {"topicRaw": "25-Personal Income Tax", "topicName": "Personal Income Tax", "topicOrder": 25, "stage": 1, "vi": "Số thuế khấu trừ thừa sẽ được bù trừ trong kỳ lương sau.", "en": "Over-withheld tax will be offset in next month's payroll.", "ipa": "/ˈoʊvɚ wɪθˈhɛld tæks wɪl bi ɔfˈsɛt‿ɪn nɛkst mʌnθs ˈpeɪˌroʊl/"}, {"topicRaw": "25-Personal Income Tax", "topicName": "Personal Income Tax", "topicOrder": 25, "stage": 2, "vi": "Từ năm 2026, giảm trừ gia cảnh là 15,5 triệu cho bản thân và 6,2 triệu mỗi người phụ thuộc.", "en": "From 2026, family deductions: 15.5 million personal, 6.2 million per dependent.", "ipa": "/frəm tu ˈθaʊzənd ˈtwɛni sɪks, ˈfæməli dɪˈdʌkʃənz: fɪfˈtin pɔɪnt faɪv ˈmɪljən ˈpɝsɪnəl, sɪks pɔɪnt tu ˈmɪljən pɝ dɪˈpɛndənt/"}, {"topicRaw": "25-Personal Income Tax", "topicName": "Personal Income Tax", "topicOrder": 25, "stage": 2, "vi": "Với nhân viên hưởng lương net, chúng tôi quy đổi ra gross trước rồi mới tính thuế.", "en": "For net-salary employees, we gross up first, then calculate tax.", "ipa": "/fɚ nɛt ˈsælɚi ɛmˈplɔɪiz, wi ɡroʊs‿ʌp fɝst, ðɛn ˈkælkjəˌleɪt tæks/"}, {"topicRaw": "25-Personal Income Tax", "topicName": "Personal Income Tax", "topicOrder": 25, "stage": 2, "vi": "Bạn có thể xác nhận các khoản công ty mẹ ở nước ngoài trả cho bạn không?", "en": "Could you confirm any income paid by the overseas parent company?", "ipa": "/kʊd ju kənˈfɝm‿ˈɛni ˈɪnˌkʌm peɪd baɪ ði ˈoʊvɚˈsiz ˈpɛrənt ˈkʌmpəˌni/"}, {"topicRaw": "25-Personal Income Tax", "topicName": "Personal Income Tax", "topicOrder": 25, "stage": 2, "vi": "Bạn có phiền gửi chứng từ khấu trừ thuế của công ty cũ không?", "en": "Would you mind sending your previous employer's withholding certificate?", "ipa": "/wʊd ju maɪnd ˈsɛndɪŋ jɚ ˈpriviəs‿ɪmˈplɔɪɚz wɪθˈhoʊldɪŋ sɚˈtɪfɪkət/"}, {"topicRaw": "25-Personal Income Tax", "topicName": "Personal Income Tax", "topicOrder": 25, "stage": 2, "vi": "Thuế tháng này tăng vì lợi ích nhà ở của bạn vượt mức được miễn.", "en": "This month's tax rose: housing benefit exceeded the exempt limit.", "ipa": "/ðɪs mʌnθs tæks roʊz: ˈhaʊzɪŋ ˈbɛnəfɪt‿ɪkˈsidəd ði ɪɡˈzɛmpt ˈlɪmət/"}, {"topicRaw": "25-Personal Income Tax", "topicName": "Personal Income Tax", "topicOrder": 25, "stage": 2, "vi": "Nếu hợp đồng dưới 3 tháng, công ty khấu trừ 10% trên mỗi lần chi từ ngưỡng quy định.", "en": "Contracts under three months: we withhold 10% on payments above threshold.", "ipa": "/ˈkɑnˌtrækts‿ˈʌndɚ θri mʌnθs: wi wɪθˈhoʊld tɛn pərˈsɛnt‿ɑn ˈpeɪmənts‿əˈbʌv ˈθrɛˌʃoʊld/"}, {"topicRaw": "25-Personal Income Tax", "topicName": "Personal Income Tax", "topicOrder": 25, "stage": 2, "vi": "Rất tiếc, học phí của con không được trừ khi tính thuế TNCN.", "en": "Unfortunately, children's school fees aren't deductible for personal income tax.", "ipa": "/ʌnˈfɔrtʃənətli, ˈtʃɪldrənz skul fiz‿ɑrnt dɪˈdʌktəbəl fɚ ˈpɝsənəl‿ˈɪnˌkʌm tæks/"}, {"topicRaw": "25-Personal Income Tax", "topicName": "Personal Income Tax", "topicOrder": 25, "stage": 2, "vi": "Tôi sẽ gửi bạn bảng tính thuế chi tiết để bạn đối chiếu.", "en": "I'll send a detailed tax computation for you to check.", "ipa": "/aɪl sɛnd‿ə dɪˈteɪld tæks ˌkɑmpjəˈteɪʃən fɚ ju tə tʃɛk/"}, {"topicRaw": "25-Personal Income Tax", "topicName": "Personal Income Tax", "topicOrder": 25, "stage": 3, "vi": "Để tôi giải thích cách tính thuế trên phiếu lương của bạn, từng bước.", "en": "Let me explain your payslip tax calculation, step by step.", "ipa": "/lɛt mi ɪkˈspleɪn jɚ ˈpeɪˌslɪp tæks ˌkælkjəˈleɪʃən, stɛp baɪ stɛp/"}, {"topicRaw": "25-Personal Income Tax", "topicName": "Personal Income Tax", "topicOrder": 25, "stage": 3, "vi": "Để tôi làm rõ: thưởng Tết cũng là thu nhập chịu thuế.", "en": "Let me clarify: the Tet bonus is also taxable income.", "ipa": "/lɛt mi ˈklɛrəˌfaɪ: ðə tɛt ˈboʊnəs‿ɪz‿ˈɔlsoʊ ˈtæksəbəl‿ˈɪnˌkʌm/"}, {"topicRaw": "25-Personal Income Tax", "topicName": "Personal Income Tax", "topicOrder": 25, "stage": 3, "vi": "Theo đối chiếu, 12 nhân viên chưa đăng ký người phụ thuộc.", "en": "Based on our records, 12 employees haven't registered dependents yet.", "ipa": "/beɪst‿ɑn‿aʊɚ rəˈkɔrdz, twɛlv‿ɛmˈplɔɪiz ˈhævənt ˈrɛdʒɪstɚd dɪˈpɛndənts jɛt/"}, {"topicRaw": "25-Personal Income Tax", "topicName": "Personal Income Tax", "topicOrder": 25, "stage": 3, "vi": "Tôi đề xuất nhắc đăng ký người phụ thuộc vào đầu mỗi năm.", "en": "I recommend reminding staff to register dependents early each year.", "ipa": "/aɪ ˌrɛkəˈmɛnd riˈmaɪndɪŋ stæf tə ˈrɛdʒɪstɚ dɪˈpɛndənts‿ˈɝli itʃ jɪr/"}, {"topicRaw": "25-Personal Income Tax", "topicName": "Personal Income Tax", "topicOrder": 25, "stage": 3, "vi": "Tôi đề nghị gửi bảng tính thuế mẫu cho nhân viên mới.", "en": "I'd suggest sending new joiners a sample tax calculation.", "ipa": "/aɪd səˈdʒɛst ˈsɛndɪŋ nu ˈdʒɔɪnɚz‿ə ˈsæmpəl tæks ˌkælkjəˈleɪʃən/"}, {"topicRaw": "25-Personal Income Tax", "topicName": "Personal Income Tax", "topicOrder": 25, "stage": 3, "vi": "Theo tôi, phiếu lương nên ghi rõ thu nhập chịu thuế và khoản trừ.", "en": "In my view, payslips should show taxable income and deductions.", "ipa": "/ɪn maɪ vju, ˈpeɪˌslɪps ʃʊd ʃoʊ ˈtæksəbəl‿ˈɪnˌkʌm‿ən dɪˈdʌkʃənz/"}, {"topicRaw": "25-Personal Income Tax", "topicName": "Personal Income Tax", "topicOrder": 25, "stage": 3, "vi": "Tôi hiểu, nhưng khoản thưởng này vẫn phải tính thuế.", "en": "I see your point, but this bonus is still taxable.", "ipa": "/aɪ si jɚ pɔɪnt, bət ðɪs ˈboʊnəs‿ɪz stɪl ˈtæksəbəl/"}, {"topicRaw": "25-Personal Income Tax", "topicName": "Personal Income Tax", "topicOrder": 25, "stage": 3, "vi": "Có lẽ nên tổ chức buổi hỏi đáp về thuế trước kỳ quyết toán.", "en": "It might be worth a tax Q&A session before finalization.", "ipa": "/ɪt maɪt bi wɝθ‿ə tæks kju ən eɪ ˈsɛʃən bɪˈfɔr ˌfaɪnələˈzeɪʃən/"}, {"topicRaw": "25-Personal Income Tax", "topicName": "Personal Income Tax", "topicOrder": 25, "stage": 4, "vi": "Chúng ta chuyển sang thuế TNCN, vì luật mới thay đổi biểu thuế.", "en": "Next, let's look at personal income tax, since the new law changes the brackets.", "ipa": "/nɛkst, lɛts lʊk‿ət ˈpɝsənəl‿ˈɪnˌkʌm tæks, sɪns ðə nu lɔ ˈtʃeɪndʒɪz ðə ˈbrækɪts/"}, {"topicRaw": "25-Personal Income Tax", "topicName": "Personal Income Tax", "topicOrder": 25, "stage": 4, "vi": "Bạn trình bày tác động của biểu thuế mới đến lương net nhé?", "en": "Could you walk us through how the new tax brackets affect net pay?", "ipa": "/kʊd ju wɔk‿əs θru haʊ ðə nu tæks ˈbrækɪts‿əˈfɛkt nɛt peɪ/"}, {"topicRaw": "25-Personal Income Tax", "topicName": "Personal Income Tax", "topicOrder": 25, "stage": 4, "vi": "Tôi muốn lưu ý một điểm: nhiều nhân viên chưa hiểu thay đổi này.", "en": "I want to flag one issue: many employees don't understand these changes yet.", "ipa": "/aɪ wɑnt tə flæɡ wʌn‿ˈɪʃu: ˈmɛni ɪmˈplɔɪiz doʊnt‿ˌʌndɚˈstænd ðiz ˈtʃeɪndʒɪz jɛt/"}, {"topicRaw": "25-Personal Income Tax", "topicName": "Personal Income Tax", "topicOrder": 25, "stage": 4, "vi": "Tôi hiểu cần thông báo nhanh, tuy nhiên số liệu phải kiểm tra trước.", "en": "I appreciate that we need to announce it quickly; however, the numbers must be checked first.", "ipa": "/aɪ əˈpriʃiˌeɪt ðæt wi nid tu əˈnaʊns‿ɪt ˈkwɪkli; haʊˈɛvɚ, ðə ˈnʌmbɚz mʌst bi tʃɛkt fɝst/"}, {"topicRaw": "25-Personal Income Tax", "topicName": "Personal Income Tax", "topicOrder": 25, "stage": 4, "vi": "Hay chúng ta gửi mỗi người bảng so sánh thuế trước và sau?", "en": "What if we sent everyone a before-and-after tax comparison for their salary?", "ipa": "/wʌɾ‿ɪf wi sɛnt‿ˈɛvriˌwʌn‿ə bɪˈfɔr‿ən‿ˈæftɚ tæks kəmˈpɛrɪsən fɚ ðɛr ˈsæləri/"}, {"topicRaw": "25-Personal Income Tax", "topicName": "Personal Income Tax", "topicOrder": 25, "stage": 4, "vi": "Không thể tư vấn thuế cá nhân, nhưng có thể giải thích quy định chung.", "en": "We're not able to give personal tax advice, but we can explain the general rules.", "ipa": "/wɪr nɑɾ‿ˈeɪbəl tə ɡɪv ˈpɝsənəl tæks‿ədˈvaɪs, bət wi kən‿ɪkˈspleɪn ðə ˈdʒɛnɚəl rulz/"}, {"topicRaw": "25-Personal Income Tax", "topicName": "Personal Income Tax", "topicOrder": 25, "stage": 4, "vi": "Tóm lại, biểu thuế mới áp dụng từ kỳ lương tháng này.", "en": "So, to recap, the new tax brackets apply starting from this month's payroll.", "ipa": "/soʊ, tə ˈriˌkæp, ðə nu tæks ˈbrækɪts‿əˈplaɪ ˈstɑrɾɪŋ frəm ðɪs mʌnθs ˈpeɪroʊl/"}, {"topicRaw": "25-Personal Income Tax", "topicName": "Personal Income Tax", "topicOrder": 25, "stage": 4, "vi": "Bước tiếp theo: HR gửi email hướng dẫn ngắn và mở buổi hỏi đáp thứ Năm.", "en": "Next step: HR will email a short guide and host a Q&A on Thursday.", "ipa": "/nɛkst stɛp: ˌeɪtʃˈɑr wɪl‿ˈimeɪl‿ə ʃɔrt ɡaɪd‿ən hoʊst‿ə ˌkjuənˈeɪ ɑn ˈθɝzdeɪ/"}, {"topicRaw": "25-Personal Income Tax", "topicName": "Personal Income Tax", "topicOrder": 25, "stage": 5, "vi": "Thật lòng, nhiều người không đăng ký người phụ thuộc nên đóng thuế nhiều hơn cần.", "en": "If I'm being honest, many employees don't register dependents, so they pay more tax than they need to.", "ipa": "/ɪf‿aɪm ˈbiɪŋ‿ˈɑnəst, ˈmɛni ɪmˈplɔɪiz doʊnt ˈrɛdʒɪstɚ dɪˈpɛndənts, soʊ ðeɪ peɪ mɔr tæks ðən ðeɪ nid tu/"}, {"topicRaw": "25-Personal Income Tax", "topicName": "Personal Income Tax", "topicOrder": 25, "stage": 5, "vi": "Theo kinh nghiệm, thắc mắc về thuế thường đến sau tháng thưởng, khi thuế tăng vọt.", "en": "From my experience, most tax questions come after bonus months, when tax suddenly goes up.", "ipa": "/frʌm maɪ ɪkˈspɪriəns, moʊst tæks ˈkwɛstʃənz kʌm‿ˈæftɚ ˈboʊnəs mʌnθs, wɛn tæks ˈsʌdənli ɡoʊz‿ʌp/"}, {"topicRaw": "25-Personal Income Tax", "topicName": "Personal Income Tax", "topicOrder": 25, "stage": 5, "vi": "Suy cho cùng, nhân viên tin bảng lương hơn khi hiểu cách tính thuế.", "en": "At the end of the day, employees trust payroll more when they understand how tax is calculated.", "ipa": "/æt ði ɛnd‿əv ðə deɪ, ɪmˈplɔɪiz trʌst ˈpeɪroʊl mɔr wɛn ðeɪ ˌʌndɚˈstænd haʊ tæks‿ɪz ˈkælkjəˌleɪɾɪd/"}, {"topicRaw": "25-Personal Income Tax", "topicName": "Personal Income Tax", "topicOrder": 25, "stage": 5, "vi": "Điều tôi lo là khấu trừ thuế sai, dẫn đến bị phạt khi quyết toán.", "en": "My main worry is withholding tax incorrectly, which leads to penalties at year-end finalization.", "ipa": "/maɪ meɪn ˈwɝi ɪz wɪθˈhoʊldɪŋ tæks‿ˌɪnkəˈrɛktli, wɪtʃ lidz tə ˈpɛnəltiz‿ət jɪr‿ɛnd ˌfaɪnələˈzeɪʃən/"}, {"topicRaw": "25-Personal Income Tax", "topicName": "Personal Income Tax", "topicOrder": 25, "stage": 5, "vi": "Nếu không cập nhật MST sau khi đổi CCCD, hồ sơ thuế sẽ bị trả về.", "en": "If we don't update tax codes after the ID card change, our filings will be rejected.", "ipa": "/ɪf wi doʊnt‿ʌpˈdeɪt tæks koʊdz‿ˈæftɚ ði ˌaɪˈdi kɑrd tʃeɪndʒ, ˈaʊɚ ˈfaɪlɪŋz wɪl bi rɪˈdʒɛktɪd/"}, {"topicRaw": "25-Personal Income Tax", "topicName": "Personal Income Tax", "topicOrder": 25, "stage": 5, "vi": "Tôi e ngại trả thưởng dưới dạng phụ cấp chỉ để né thuế TNCN.", "en": "I'm not comfortable with paying bonuses as allowances just to avoid personal income tax.", "ipa": "/aɪm nɑt ˈkʌmftɚbəl wɪθ ˈpeɪɪŋ ˈboʊnəsɪz‿əz‿əˈlaʊənsɪz dʒʌst tu əˈvɔɪd ˈpɝsənəl‿ˈɪnˌkʌm tæks/"}, {"topicRaw": "25-Personal Income Tax", "topicName": "Personal Income Tax", "topicOrder": 25, "stage": 5, "vi": "Điều tôi lo nhất là thu nhập cộng tác viên thường bị sót trong báo cáo thuế.", "en": "My biggest concern is that freelancers' income is often missing from our tax reports.", "ipa": "/maɪ ˈbɪɡɪst kənˈsɝn‿ɪz ðæt ˈfriˌlænsɚz‿ˈɪnˌkʌm‿ɪz‿ˈɔfən ˈmɪsɪŋ frəm‿ˈaʊɚ tæks rɪˈpɔrts/"}, {"topicRaw": "25-Personal Income Tax", "topicName": "Personal Income Tax", "topicOrder": 25, "stage": 5, "vi": "Tôi đề xuất kèm hướng dẫn thuế ngắn trên phiếu lương, giải thích bằng lời dễ hiểu.", "en": "My recommendation is a short tax guide on the payslip that explains deductions in plain language.", "ipa": "/maɪ ˌrɛkəmɛnˈdeɪʃən‿ɪz‿ə ʃɔrt tæks ɡaɪd‿ɑn ðə ˈpeɪslɪp ðæɾ‿ɪkˈspleɪnz dɪˈdʌkʃənz‿ɪn pleɪn ˈlæŋɡwɪdʒ/"}, {"topicRaw": "25-Personal Income Tax", "topicName": "Personal Income Tax", "topicOrder": 25, "stage": 6, "vi": "Có hai điều chắc chắn: cái chết và thuế.", "en": "Nothing is certain except death and taxes.", "ipa": "/ˈnʌθɪŋ‿ɪz ˈsɝɾən‿ɪkˈsɛpt dɛθ‿ən ˈtæksɪz/"}, {"topicRaw": "25-Personal Income Tax", "topicName": "Personal Income Tax", "topicOrder": 25, "stage": 6, "vi": "Thuế đúng hôm nay là bình yên cuối năm.", "en": "Correct tax today means peace at year-end.", "ipa": "/kəˈrɛkt tæks təˈdeɪ minz pis‿ət jɪr‿ɛnd/"}, {"topicRaw": "25-Personal Income Tax", "topicName": "Personal Income Tax", "topicOrder": 25, "stage": 6, "vi": "Sau khi áp dụng mức giảm trừ mới, 38% nhân viên không còn phải nộp thuế TNCN.", "en": "With the new deductions, 38% of employees no longer pay any personal income tax.", "ipa": "/wɪθ ðə nu dɪˈdʌkʃənz, ˈθɝɾi eɪt pɚˈsɛnt‿əv‿ɪmˈplɔɪiz noʊ ˈlɔŋɡɚ peɪ ˈɛni ˈpɝsənəl‿ˈɪnˌkʌm tæks/"}, {"topicRaw": "25-Personal Income Tax", "topicName": "Personal Income Tax", "topicOrder": 25, "stage": 6, "vi": "Nếu không cập nhật biểu thuế kịp thời, sai sót sẽ dồn lại thành hoàn thuế hàng loạt khi quyết toán.", "en": "If we don't update the tax tables promptly, errors will pile up into mass refunds at finalization.", "ipa": "/ɪf wi doʊnt‿ʌpˈdeɪt ðə tæks ˈteɪbəlz ˈprɑmptli, ˈɛrɚz wɪl paɪl‿ʌp‿ˈɪntu mæs ˈrifʌndz‿ət ˌfaɪnələˈzeɪʃən/"}, {"topicRaw": "25-Personal Income Tax", "topicName": "Personal Income Tax", "topicOrder": 25, "stage": 6, "vi": "Tuân thủ thuế là bảo vệ cả công ty lẫn nhân viên.", "en": "Tax compliance protects both the company and its people.", "ipa": "/tæks kəmˈplaɪəns prəˈtɛkts boʊθ ðə ˈkʌmpəni ən‿ɪts ˈpipəl/"}, {"topicRaw": "25-Personal Income Tax", "topicName": "Personal Income Tax", "topicOrder": 25, "stage": 6, "vi": "Chi phí thuế cho nhân viên lương net chiếm 9% quỹ lương, cao hơn mức trung bình khối FDI.", "en": "Tax gross-ups for net-paid staff cost 9% of payroll, above the FDI average.", "ipa": "/tæks ɡroʊs‿ʌps fɚ nɛt peɪd stæf kɔst naɪn pɚˈsɛnt‿əv ˈpeɪroʊl, əˈbʌv ði ˌɛfdiˈaɪ ˈævərɪdʒ/"}, {"topicRaw": "25-Personal Income Tax", "topicName": "Personal Income Tax", "topicOrder": 25, "stage": 6, "vi": "Tôi đề xuất chuyển dần người mới sang hợp đồng gross, tiết kiệm khoảng 1 tỷ mỗi năm.", "en": "I propose moving new hires to gross contracts, saving roughly 1 billion VND a year.", "ipa": "/aɪ prəˈpoʊz ˈmuvɪŋ nu haɪɚz tə ɡroʊs ˈkɑntrækts, ˈseɪvɪŋ ˈrʌfli wʌn ˈbɪljən ˌviɛnˈdi ə jɪr/"}, {"topicRaw": "25-Personal Income Tax", "topicName": "Personal Income Tax", "topicOrder": 25, "stage": 6, "vi": "Mục tiêu là khấu trừ đúng ngay hằng tháng để quyết toán cuối năm gần như không chênh lệch.", "en": "The goal is accurate monthly withholding, so year-end finalization shows almost no variance.", "ipa": "/ðə ɡoʊl‿ɪz‿ˈækjɚət ˈmʌnθli wɪθˈhoʊldɪŋ, soʊ jɪr‿ɛnd ˌfaɪnələˈzeɪʃən ʃoʊz‿ˈɔlmoʊst noʊ ˈvɛriəns/"}, {"topicRaw": "26-PIT Finalization", "topicName": "PIT Finalization", "topicOrder": 26, "stage": 1, "vi": "Cá nhân tự quyết toán phải nộp hồ sơ trước ngày 30/4.", "en": "Individuals filing themselves must submit by April 30th.", "ipa": "/ˌɪndəˈvɪdʒəwəlz ˈfaɪlɪŋ ðɛmˈsɛlvz mʌst səbˈmɪt baɪ ˈeɪprəl ˈθɝɾiəθ/"}, {"topicRaw": "26-PIT Finalization", "topicName": "PIT Finalization", "topicOrder": 26, "stage": 1, "vi": "Công ty chỉ quyết toán thay cho nhân viên đang làm việc đã ủy quyền.", "en": "We file only for current employees who authorize us.", "ipa": "/wi faɪl‿ˈoʊnli fɚ ˈkɝənt‿ɛmˈplɔɪiz hu ˈɔθɚˌaɪz‿ʌs/"}, {"topicRaw": "26-PIT Finalization", "topicName": "PIT Finalization", "topicOrder": 26, "stage": 1, "vi": "Trong năm bạn có thu nhập từ cho thuê nhà hay làm tự do không?", "en": "Did you have rental or freelance income this year?", "ipa": "/dɪd ju həv ˈrɛntəl‿ɚ ˈfriˌlæns‿ˈɪnˌkʌm ðɪs jɪr/"}, {"topicRaw": "26-PIT Finalization", "topicName": "PIT Finalization", "topicOrder": 26, "stage": 1, "vi": "Bạn muốn nhận tiền hoàn thuế hay bù trừ cho năm sau?", "en": "Would you like a refund, or carry forward?", "ipa": "/wʊd ju laɪk‿ə rɪˈfʌnd, ɚ ˈkæri ˈfɔrwɚd/"}, {"topicRaw": "26-PIT Finalization", "topicName": "PIT Finalization", "topicOrder": 26, "stage": 1, "vi": "Vui lòng kiểm tra tờ khai lập sẵn trên eTax trước khi ký.", "en": "Please review the pre-filled return on eTax before signing.", "ipa": "/pliz rɪˈvju ðə pri fɪld rɪˈtɝn‿ɑn‿ˈiˌtæks bɪˈfɔr ˈsaɪnɪŋ/"}, {"topicRaw": "26-PIT Finalization", "topicName": "PIT Finalization", "topicOrder": 26, "stage": 1, "vi": "Vui lòng gửi lại giấy ủy quyền quyết toán đã ký trước ngày 15/2.", "en": "Please return the signed finalization authorization by February 15th.", "ipa": "/pliz rɪˈtɝn ðə saɪnd ˌfaɪnələˈzeɪʃən‿ˌɔθərəˈzeɪʃən baɪ ˈfɛbjuˌɛri ˌfɪfˈtinθ/"}, {"topicRaw": "26-PIT Finalization", "topicName": "PIT Finalization", "topicOrder": 26, "stage": 1, "vi": "Xin lỗi, tờ khai quyết toán của bạn bị thiếu thu nhập từ công ty cũ.", "en": "Sorry, your return omitted income from your previous employer.", "ipa": "/ˈsɑri, jɚ rɪˈtɝn‿oʊˈmɪɾəd‿ˈɪnˌkʌm frəm jɚ ˈpriviəs‿ɛmˈplɔɪɚ/"}, {"topicRaw": "26-PIT Finalization", "topicName": "PIT Finalization", "topicOrder": 26, "stage": 1, "vi": "Tôi sẽ nộp tờ khai bổ sung và gửi bạn thông báo tiếp nhận của cơ quan thuế.", "en": "I'll file an amended return and send the acknowledgment.", "ipa": "/aɪl faɪl‿ən‿əˈmɛndɪd rɪˈtɝn‿ən sɛnd ði ækˈnɑlɪdʒmənt/"}, {"topicRaw": "26-PIT Finalization", "topicName": "PIT Finalization", "topicOrder": 26, "stage": 2, "vi": "Theo luật, doanh nghiệp quyết toán thuế TNCN chậm nhất ngày cuối tháng thứ 3 sau năm tính thuế.", "en": "By law, PIT finalization is due three months after year-end.", "ipa": "/baɪ lɔ, pi aɪ ti ˌfaɪnələˈzeɪʃən‿ɪz du θri mʌnθs‿ˈæftɚ jɪr ɛnd/"}, {"topicRaw": "26-PIT Finalization", "topicName": "PIT Finalization", "topicOrder": 26, "stage": 2, "vi": "Chúng tôi thu ủy quyền, đối chiếu thu nhập, tính thuế rồi nộp tờ khai.", "en": "We collect authorizations, reconcile income, compute tax, then file.", "ipa": "/wi kəˈlɛkt‿ˌɔθɚəˈzeɪʃənz, ˈrɛkənˌsaɪl‿ˈɪnˌkʌm, kəmˈpjut tæks, ðɛn faɪl/"}, {"topicRaw": "26-PIT Finalization", "topicName": "PIT Finalization", "topicOrder": 26, "stage": 2, "vi": "Bạn có thể gửi chứng từ khấu trừ thuế của tất cả nơi bạn làm trong năm không?", "en": "Could you send withholding certificates from every employer this year?", "ipa": "/kʊd ju sɛnd wɪθˈhoʊldɪŋ sɚˈtɪfɪkəts frəm‿ˈɛvri ɛmˈplɔɪɚ ðɪs jɪr/"}, {"topicRaw": "26-PIT Finalization", "topicName": "PIT Finalization", "topicOrder": 26, "stage": 2, "vi": "Bạn có phiền đối chiếu tổng thu nhập năm với dữ liệu của cơ quan thuế không?", "en": "Would you mind cross-checking annual income against tax authority records?", "ipa": "/wʊd ju maɪnd krɔs ˈtʃɛkɪŋ‿ˈænjuəl‿ˈɪnˌkʌm‿əˈɡɛnst tæks‿əˈθɔrəti rəˈkɔrdz/"}, {"topicRaw": "26-PIT Finalization", "topicName": "PIT Finalization", "topicOrder": 26, "stage": 2, "vi": "Bạn phải nộp thêm thuế vì cả hai nơi trả lương đều đã tính giảm trừ bản thân.", "en": "You owe extra tax because both employers applied your personal deduction.", "ipa": "/ju oʊ ˈɛkstrə tæks bɪˈkɔz boʊθ‿ɪmˈplɔɪɚz‿əˈplaɪd jɚ ˈpɝsənəl dɪˈdʌkʃən/"}, {"topicRaw": "26-PIT Finalization", "topicName": "PIT Finalization", "topicOrder": 26, "stage": 2, "vi": "Nếu nộp tờ khai trễ hạn, bạn có thể bị phạt hành chính.", "en": "If you file late, you may face an administrative penalty.", "ipa": "/ɪf ju faɪl leɪt, ju meɪ feɪs‿ən‿ədˈmɪnəˌstreɪɾɪv ˈpɛnəlti/"}, {"topicRaw": "26-PIT Finalization", "topicName": "PIT Finalization", "topicOrder": 26, "stage": 2, "vi": "Rất tiếc, cơ quan thuế yêu cầu giải trình thêm nên việc hoàn thuế của bạn sẽ chậm.", "en": "Unfortunately, the tax office wants clarification, delaying your refund.", "ipa": "/ənˈfɔrtʃənətli, ðə tæks‿ˈɔfɪs wɑnts ˌklɛrəfəˈkeɪʃən, dɪˈleɪɪŋ jɚ rɪˈfʌnd/"}, {"topicRaw": "26-PIT Finalization", "topicName": "PIT Finalization", "topicOrder": 26, "stage": 2, "vi": "Tôi sẽ theo dõi trạng thái hoàn thuế trên hệ thống và cập nhật bạn mỗi tuần.", "en": "I'll monitor the refund status online and update you every week.", "ipa": "/aɪl ˈmɑnəɾɚ ðə ˈrifʌnd ˈstæɾəs‿ˈɑnˌlaɪn‿ən‿ʌpˈdeɪt ju ˈɛvri wik/"}, {"topicRaw": "26-PIT Finalization", "topicName": "PIT Finalization", "topicOrder": 26, "stage": 3, "vi": "Để tôi giải thích ai được ủy quyền và ai phải tự quyết toán.", "en": "Let me explain who authorizes us and who files themselves.", "ipa": "/lɛt mi ɪkˈspleɪn hu ˈɔθɚˌaɪzɪz‿ʌs‿ən hu faɪlz ðɛmˈsɛlvz/"}, {"topicRaw": "26-PIT Finalization", "topicName": "PIT Finalization", "topicOrder": 26, "stage": 3, "vi": "Để tôi làm rõ: người nghỉ giữa năm vẫn tự quyết toán được.", "en": "Let me clarify: people who left mid-year can still self-file.", "ipa": "/lɛt mi ˈklɛrəˌfaɪ: ˈpipəl hu lɛft mɪd jɪr kən stɪl sɛlf faɪl/"}, {"topicRaw": "26-PIT Finalization", "topicName": "PIT Finalization", "topicOrder": 26, "stage": 3, "vi": "Theo số liệu năm ngoái, 80% nhân viên đã ủy quyền cho công ty.", "en": "Based on last year's figures, 80% of employees authorized us.", "ipa": "/beɪst‿ɑn læst jɪrz ˈfɪɡjɚz, ˈeɪɾi pərˈsɛnt‿əv‿ɛmˈplɔɪiz‿ˈɔθɚˌaɪzd‿ʌs/"}, {"topicRaw": "26-PIT Finalization", "topicName": "PIT Finalization", "topicOrder": 26, "stage": 3, "vi": "Tôi đề xuất thu giấy ủy quyền từ tháng Một, đừng đợi phút cuối.", "en": "I recommend collecting authorizations from January, not last-minute.", "ipa": "/aɪ ˌrɛkəˈmɛnd kəˈlɛktɪŋ‿ˌɔθɚəˈzeɪʃənz frəm ˈdʒænjuˌɛri, nɑt læst ˈmɪnət/"}, {"topicRaw": "26-PIT Finalization", "topicName": "PIT Finalization", "topicOrder": 26, "stage": 3, "vi": "Tôi đề nghị đối chiếu dữ liệu thu nhập với cơ quan thuế trước.", "en": "I'd suggest reconciling income data with tax authority records first.", "ipa": "/aɪd səˈdʒɛst ˈrɛkənˌsaɪlɪŋ‿ˈɪnˌkʌm ˈdeɪɾə wɪθ tæks‿əˈθɔrəti rəˈkɔrdz fɝst/"}, {"topicRaw": "26-PIT Finalization", "topicName": "PIT Finalization", "topicOrder": 26, "stage": 3, "vi": "Theo tôi, quyết toán là việc của cả năm, không chỉ 3 tháng.", "en": "In my view, finalization is year-round, not a three-month rush.", "ipa": "/ɪn maɪ vju, ˌfaɪnələˈzeɪʃən‿ɪz jɪr raʊnd, nɑt‿ə θri mʌnθ rʌʃ/"}, {"topicRaw": "26-PIT Finalization", "topicName": "PIT Finalization", "topicOrder": 26, "stage": 3, "vi": "Tôi hiểu, nhưng có lương từ 2 nơi thì thường không ủy quyền được.", "en": "I see, but two employers usually means no authorization.", "ipa": "/aɪ si, bət tu ɛmˈplɔɪɚz ˈjuʒəwəli minz noʊ ˌɔθɚəˈzeɪʃən/"}, {"topicRaw": "26-PIT Finalization", "topicName": "PIT Finalization", "topicOrder": 26, "stage": 3, "vi": "Có lẽ nên gửi bản tóm tắt thu nhập năm vào tháng Một.", "en": "It might be worth sending annual income summaries in January.", "ipa": "/ɪt maɪt bi wɝθ ˈsɛndɪŋ‿ˈænjuəl‿ˈɪnˌkʌm ˈsʌmɚiz‿ɪn ˈdʒænjuˌɛri/"}, {"topicRaw": "26-PIT Finalization", "topicName": "PIT Finalization", "topicOrder": 26, "stage": 4, "vi": "Chúng ta chuyển sang quyết toán thuế, vì hạn nộp chỉ còn 3 tuần.", "en": "Let's move on to tax finalization, since the deadline is only three weeks away.", "ipa": "/lɛts muv‿ɑn tə tæks ˌfaɪnələˈzeɪʃən, sɪns ðə ˈdɛdˌlaɪn‿ɪz‿ˈoʊnli θri wiks‿əˈweɪ/"}, {"topicRaw": "26-PIT Finalization", "topicName": "PIT Finalization", "topicOrder": 26, "stage": 4, "vi": "Bạn trình bày tiến độ thu giấy ủy quyền của từng phòng nhé?", "en": "Can you take us through how many authorization forms each department has returned?", "ipa": "/kæn ju teɪk‿əs θru haʊ ˈmɛni ˌɔθərəˈzeɪʃən fɔrmz‿itʃ dɪˈpɑrtmənt hæz rɪˈtɝnd/"}, {"topicRaw": "26-PIT Finalization", "topicName": "PIT Finalization", "topicOrder": 26, "stage": 4, "vi": "Có một điều tôi lo: 25 người vẫn chưa gửi chứng từ công ty cũ.", "en": "One thing worries me: 25 people still haven't sent their old employers' certificates.", "ipa": "/wʌn θɪŋ ˈwɝiz mi: ˌtwɛntiˈfaɪv ˈpipəl stɪl ˈhævənt sɛnt ðɛr‿oʊld‿ɪmˈplɔɪɚz sɚˈtɪfɪkəts/"}, {"topicRaw": "26-PIT Finalization", "topicName": "PIT Finalization", "topicOrder": 26, "stage": 4, "vi": "Tôi hiểu nhân viên bận, tuy nhiên hạn nộp cho thuế không đổi.", "en": "I understand people are busy; however, the tax deadline won't move for us.", "ipa": "/aɪ ˌʌndɚˈstænd ˈpipəl‿ɚ ˈbɪzi; haʊˈɛvɚ, ðə tæks ˈdɛdˌlaɪn woʊnt muv fɚ‿ʌs/"}, {"topicRaw": "26-PIT Finalization", "topicName": "PIT Finalization", "topicOrder": 26, "stage": 4, "vi": "Hay chúng ta nhờ quản lý nhắc trực tiếp từng người trong team?", "en": "How about if we asked managers to remind each person on their team directly?", "ipa": "/haʊ əˈbaʊɾ‿ɪf wi æskt ˈmænɪdʒɚz tə rɪˈmaɪnd‿itʃ ˈpɝsən‿ɑn ðɛr tim dɪˈrɛktli/"}, {"topicRaw": "26-PIT Finalization", "topicName": "PIT Finalization", "topicOrder": 26, "stage": 4, "vi": "Không thể lùi hạn nộp, nhưng có thể hỗ trợ từng người làm trên eTax.", "en": "We can't extend the deadline, but we can help people file on eTax one by one.", "ipa": "/wi kænt‿ɪkˈstɛnd ðə ˈdɛdˌlaɪn, bət wi kən hɛlp ˈpipəl faɪl‿ɑn‿ˈiˌtæks wʌn baɪ wʌn/"}, {"topicRaw": "26-PIT Finalization", "topicName": "PIT Finalization", "topicOrder": 26, "stage": 4, "vi": "Tóm lại, mọi giấy tờ phải về HR trước ngày 15 tháng 3.", "en": "To summarize, all documents must reach HR by March 15th at the latest.", "ipa": "/tu ˈsʌməˌraɪz, ɔl ˈdɑkjəmənts mʌst ritʃ‿ˌeɪtʃˈɑr baɪ mɑrtʃ ˌfɪfˈtinθ‿ət ðə ˈleɪɾɪst/"}, {"topicRaw": "26-PIT Finalization", "topicName": "PIT Finalization", "topicOrder": 26, "stage": 4, "vi": "Bước tiếp theo: HR gửi danh sách người còn thiếu cho quản lý hôm nay.", "en": "As a next step, HR will send managers the list of missing documents today.", "ipa": "/æz‿ə nɛkst stɛp, ˌeɪtʃˈɑr wɪl sɛnd ˈmænɪdʒɚz ðə lɪst‿əv ˈmɪsɪŋ ˈdɑk   let flashcardData = [];

  const STAGE_TITLES = {
    1: 'Core HR & Payroll English',
    2: 'Explain & Request',

    4: 'Meeting & Negotiation',
    5: 'Report & Persuade',
