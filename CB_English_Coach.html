KPI không ai hiểu thì không thể thúc đẩy hiệu suất.", "en": "What really matters is that a KPI nobody understands can't drive anyone's performance.", "ipa": "/wʌt ˈriəli ˈmæɾɚz‿ɪz ðæɾ‿ə ˌkeɪpiˈaɪ ˈnoʊbɑdi ˌʌndɚˈstændz kænt draɪv‿ˈɛniˌwʌnz pɚˈfɔrməns/"}, {"topicRaw": "11-KPI & Performance", "topicName": "KPI & Performance", "topicOrder": 11, "stage": 5, "vi": "Rủi ro lớn nhất là mọi người chạy theo con số mà bỏ qua nhu cầu khách hàng.", "en": "The main risk is that people chase the numbers and ignore what customers actually need.", "ipa": "/ðə meɪn rɪsk‿ɪz ðæt ˈpipəl tʃeɪs ðə ˈnʌmbɚz‿ən‿ɪɡˈnɔr wʌt ˈkʌstəmɚz‿ˈæktʃuəli nid/"}, {"topicRaw": "11-KPI & Performance", "topicName": "KPI & Performance", "topicOrder": 11, "stage": 5, "vi": "Nếu không rà soát KPI giữa năm, mục tiêu sẽ lỗi thời trước kỳ đánh giá.", "en": "Unless we review KPIs mid-year, targets will be outdated long before the annual review.", "ipa": "/ənˈlɛs wi rɪˈvju ˌkeɪpiˈaɪz mɪd jɪr, ˈtɑrɡɪts wɪl bi ˌaʊtˈdeɪɾɪd lɔŋ bɪˈfɔr ði ˈænjuəl rɪˈvju/"}, {"topicRaw": "11-KPI & Performance", "topicName": "KPI & Performance", "topicOrder": 11, "stage": 5, "vi": "Tôi phản bác ép tỷ lệ xếp loại cố định, vì nó bất công với nhóm làm tốt.", "en": "I'd challenge forcing a fixed rating curve, because it punishes strong teams unfairly.", "ipa": "/aɪd ˈtʃælɪndʒ ˈfɔrsɪŋ‿ə fɪkst ˈreɪɾɪŋ kɝv, bɪˈkɔz‿ɪt ˈpʌnɪʃɪz strɔŋ timz‿ʌnˈfɛrli/"}, {"topicRaw": "11-KPI & Performance", "topicName": "KPI & Performance", "topicOrder": 11, "stage": 5, "vi": "Điều tôi lo nhất là quản lý cho gần như mọi người cùng một mức đánh giá.", "en": "What concerns me most is that managers give the same rating to almost everyone.", "ipa": "/wʌt kənˈsɝnz mi moʊst‿ɪz ðæt ˈmænɪdʒɚz ɡɪv ðə seɪm ˈreɪɾɪŋ tu ˈɔlmoʊst‿ˈɛvriˌwʌn/"}, {"topicRaw": "11-KPI & Performance", "topicName": "KPI & Performance", "topicOrder": 11, "stage": 5, "vi": "Tôi đề xuất trao đổi hằng quý để kỳ đánh giá cuối năm không có bất ngờ.", "en": "What I'd propose is quarterly check-ins, so the annual review never contains any surprises.", "ipa": "/wʌɾ‿aɪd prəˈpoʊz‿ɪz ˈkwɔrɾɚli tʃɛk‿ɪnz, soʊ ði ˈænjuəl rɪˈvju ˈnɛvɚ kənˈteɪnz‿ˈɛni sɚˈpraɪzɪz/"}, {"topicRaw": "11-KPI & Performance", "topicName": "KPI & Performance", "topicOrder": 11, "stage": 6, "vi": "Thứ gì đo được thì quản lý được.", "en": "What gets measured gets managed.", "ipa": "/wʌt ɡɛts ˈmɛʒɚd ɡɛts ˈmænɪdʒd/"}, {"topicRaw": "11-KPI & Performance", "topicName": "KPI & Performance", "topicOrder": 11, "stage": 6, "vi": "Phản hồi là món quà.", "en": "Feedback is a gift.", "ipa": "/ˈfidbæk‿ɪz‿ə ɡɪft/"}, {"topicRaw": "11-KPI & Performance", "topicName": "KPI & Performance", "topicOrder": 11, "stage": 6, "vi": "65% nhân viên được xếp loại xuất sắc, trong khi công ty chỉ đạt 90% kế hoạch doanh thu.", "en": "Sixty-five percent of employees were rated outstanding, while the company hit only 90% of its revenue plan.", "ipa": "/ˈsɪksti faɪv pɚˈsɛnt‿əv‿ɪmˈplɔɪiz wɚ ˈreɪɾɪd‿ˌaʊtˈstændɪŋ, waɪl ðə ˈkʌmpəni hɪɾ‿ˈoʊnli ˈnaɪnti pɚˈsɛnt‿əv‿ɪts ˈrɛvəˌnu plæn/"}, {"topicRaw": "11-KPI & Performance", "topicName": "KPI & Performance", "topicOrder": 11, "stage": 6, "vi": "Khi ai cũng xuất sắc, thưởng mất ý nghĩa và người giỏi thật sự thấy thiệt thòi.", "en": "When everyone is outstanding, bonuses lose meaning and genuine top performers feel short-changed.", "ipa": "/wɛn‿ˈɛvriˌwʌn‿ɪz‿ˌaʊtˈstændɪŋ, ˈboʊnəsɪz luz ˈminɪŋ‿ən ˈdʒɛnjəwən tɑp pɚˈfɔrmɚz fil ʃɔrt tʃeɪndʒd/"}, {"topicRaw": "11-KPI & Performance", "topicName": "KPI & Performance", "topicOrder": 11, "stage": 6, "vi": "Đo kết quả, nhưng cũng nhìn cách làm.", "en": "Measure the what, but also the how.", "ipa": "/ˈmɛʒɚ ðə wʌt, bəɾ‿ˈɔlsoʊ ðə haʊ/"}, {"topicRaw": "11-KPI & Performance", "topicName": "KPI & Performance", "topicOrder": 11, "stage": 6, "vi": "Ở các công ty có hiệu chỉnh điểm, nhóm xuất sắc thường chỉ chiếm 15 đến 20%.", "en": "In companies that calibrate ratings, the outstanding band is usually 15 to 20%.", "ipa": "/ɪn ˈkʌmpəniz ðæt ˈkæləˌbreɪt ˈreɪɾɪŋz, ði ˌaʊtˈstændɪŋ bænd‿ɪz ˈjuʒuəli ˌfɪfˈtin tə ˈtwɛnti pɚˈsɛnt/"}, {"topicRaw": "11-KPI & Performance", "topicName": "KPI & Performance", "topicOrder": 11, "stage": 6, "vi": "Tôi đề xuất họp hiệu chỉnh liên phòng trước khi chốt điểm, bắt đầu từ kỳ giữa năm.", "en": "I recommend cross-department calibration before scores are final, starting from the mid-year cycle.", "ipa": "/aɪ ˌrɛkəˈmɛnd krɔs dɪˈpɑrtmənt ˌkæləˈbreɪʃən bɪˈfɔr skɔrz‿ɚ ˈfaɪnəl, ˈstɑrtɪŋ frəm ðə mɪd jɪr ˈsaɪkəl/"}, {"topicRaw": "11-KPI & Performance", "topicName": "KPI & Performance", "topicOrder": 11, "stage": 6, "vi": "Mục tiêu là kết quả đánh giá phản ánh đúng kết quả kinh doanh và tạo khác biệt rõ cho người giỏi.", "en": "Our goal is ratings that mirror business results and clearly differentiate top performers.", "ipa": "/ˈaʊɚ ɡoʊl‿ɪz ˈreɪɾɪŋz ðæt ˈmɪrɚ ˈbɪznəs rɪˈzʌlts‿ən ˈklɪrli ˌdɪfəˈrɛnʃiˌeɪt tɑp pɚˈfɔrmɚz/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 1, "vi": "Đợt xét thăng chức mở từ ngày 1 đến ngày 15 tháng 3.", "en": "The promotion window runs from March 1st to 15th.", "ipa": "/ðə prəˈmoʊʃən ˈwɪndoʊ rʌnz frəm mɑrtʃ fɝst tə fɪfˈtinθ/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 1, "vi": "Thăng chức kèm mức tăng lương ít nhất 10% và phụ lục hợp đồng mới.", "en": "Promotion means a 10%+ raise and a contract annex.", "ipa": "/prəˈmoʊʃən minz‿ə tɛn pərˈsɛnt reɪz‿ən‿ə ˈkɑnˌtrækt‿ˈæˌnɛks/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 1, "vi": "Bạn đã trao đổi lộ trình thăng tiến với nhân viên này chưa?", "en": "Have you discussed the career path with this employee?", "ipa": "/həv ju dɪˈskʌst ðə kɚˈɪr pæθ wɪθ ðɪs‿ɛmˈplɔɪi/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 1, "vi": "Vị trí mới có thay đổi phạm vi quản lý hay chỉ đổi chức danh?", "en": "Does the role change scope, or just the title?", "ipa": "/dəz ðə roʊl tʃeɪndʒ skoʊp, ɚ dʒʌst ðə ˈtaɪɾəl/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 1, "vi": "Vui lòng gửi hồ sơ đề cử kèm kết quả đánh giá 2 năm gần nhất.", "en": "Please submit the nomination with two years of appraisals.", "ipa": "/pliz səbˈmɪt ðə ˌnɑməˈneɪʃən wɪθ tu jɪrz‿əv‿əˈpreɪzəlz/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 1, "vi": "Vui lòng giữ kín kết quả cho đến khi có quyết định chính thức.", "en": "Please keep the outcome confidential until it's official.", "ipa": "/pliz kip ði ˈaʊtˌkʌm ˌkɑnfəˈdɛnʃəl‿ənˈtɪl‿ɪts‿əˈfɪʃəl/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 1, "vi": "Xin lỗi, quyết định thăng chức của bạn ghi sai ngày hiệu lực.", "en": "Sorry, your promotion letter shows the wrong effective date.", "ipa": "/ˈsɑri, jɚ prəˈmoʊʃən ˈlɛɾɚ ʃoʊz ðə rɔŋ‿ɪˈfɛktɪv deɪt/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 1, "vi": "Tôi sẽ gửi quyết định và phụ lục hợp đồng để bạn ký trong tuần.", "en": "I'll send the promotion letter and annex this week.", "ipa": "/aɪl sɛnd ðə prəˈmoʊʃən ˈlɛɾɚ ən‿ˈæˌnɛks ðɪs wik/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 2, "vi": "Theo khung năng lực, thăng chức đòi hỏi đáp ứng năng lực của cấp mới, không chỉ thâm niên.", "en": "Under our framework, promotion requires next-level competencies, not just tenure.", "ipa": "/ˈʌndɚ aʊɚ ˈfreɪmˌwɝk, prəˈmoʊʃən riˈkwaɪɚz nɛkst ˈlɛvəl ˈkɑmpətɪnsiz, nɑt dʒʌst ˈtɛnjɚ/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 2, "vi": "Đề cử đi từ quản lý trực tiếp lên hội đồng nhân sự, rồi trình tổng giám đốc duyệt.", "en": "Nominations go from line manager to people committee, then CEO approval.", "ipa": "/ˌnɑməˈneɪʃənz ɡoʊ frəm laɪn ˈmænədʒɚ tə ˈpipəl kəˈmɪɾi, ðɛn si i oʊ əˈpruvəl/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 2, "vi": "Bạn có thể nêu 2 ví dụ cho thấy bạn ấy đã làm tốt ở cấp cao hơn không?", "en": "Could you give two examples of her performing at that level?", "ipa": "/kʊd ju ɡɪv tu ɪɡˈzæmpəlz‿əv hɚ pɚˈfɔrmɪŋ‿ət ðət ˈlɛvəl/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 2, "vi": "Bạn có phiền xác định người kế nhiệm trước khi bạn ấy chuyển vị trí không?", "en": "Would you mind naming a successor before she changes roles?", "ipa": "/wʊd ju maɪnd ˈneɪmɪŋ‿ə səkˈsɛsɚ bɪˈfɔr ʃi ˈtʃeɪndʒəz roʊlz/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 2, "vi": "Đề cử tạm hoãn vì vị trí quản lý mới chưa có trong ngân sách headcount.", "en": "Nomination is on hold; the new manager role isn't budgeted.", "ipa": "/ˌnɑməˈneɪʃən‿ɪz‿ɑn hoʊld; ðə nu ˈmænədʒɚ roʊl‿ˈɪzənt ˈbʌdʒɪtəd/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 2, "vi": "Nếu được duyệt, mức lương mới sẽ áp dụng từ kỳ lương tháng 4.", "en": "If approved, the new salary will apply from the April payroll.", "ipa": "/ɪf‿əˈpruvd, ðə nu ˈsæləri wɪl‿əˈplaɪ frəm ði ˈeɪprəl ˈpeɪroʊl/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 2, "vi": "Rất tiếc, đợt này bạn chưa được thăng chức, nhưng chúng ta cùng lập kế hoạch phát triển nhé.", "en": "Unfortunately, you weren't promoted this cycle, but let's plan your development.", "ipa": "/ənˈfɔrtʃənətli, ju ˈwɝənt prəˈmoʊɾɪd ðɪs ˈsaɪkəl, bət lɛts plæn jɚ dɪˈvɛləpmənt/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 2, "vi": "Tôi sẽ cập nhật sơ đồ tổ chức và thông báo cho các bộ phận liên quan.", "en": "I'll update the org chart and notify the relevant departments.", "ipa": "/aɪl‿ʌpˈdeɪt ði ɔrɡ tʃɑrɾ‿ən ˈnoʊɾəˌfaɪ ðə ˈrɛləvənt dɪˈpɑrtmənts/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 3, "vi": "Để tôi giải thích 3 tiêu chí dùng cho mọi quyết định thăng chức.", "en": "Let me explain the three criteria for every promotion decision.", "ipa": "/lɛt mi ɪkˈspleɪn ðə θri kraɪˈtɪriə fɚ ˈɛvri prəˈmoʊʃən dɪˈsɪʒən/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 3, "vi": "Để tôi làm rõ: thăng chức dựa trên năng lực, không phải thâm niên.", "en": "Let me clarify: promotion is based on capability, not tenure.", "ipa": "/lɛt mi ˈklɛrəˌfaɪ: prəˈmoʊʃən‿ɪz beɪst‿ɑn ˌkeɪpəˈbɪləti, nɑt ˈtɛnjɚ/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 3, "vi": "Theo đánh giá 2 năm, bạn ấy luôn vượt mục tiêu.", "en": "Based on two years of reviews, she consistently exceeds targets.", "ipa": "/beɪst‿ɑn tu jɪrz‿əv riˈvjuz, ʃi kənˈsɪstəntli ɪkˈsidz ˈtɑrɡəts/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 3, "vi": "Tôi đề xuất thử thách 3 tháng trước khi chốt vai trò quản lý.", "en": "I recommend a three-month trial before confirming any management promotion.", "ipa": "/aɪ ˌrɛkəˈmɛnd‿ə θri mʌnθ ˈtraɪəl bɪˈfɔr kənˈfɝmɪŋ‿ˈɛni ˈmænədʒmənt prəˈmoʊʃən/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 3, "vi": "Tôi đề nghị bạn ấy dẫn một dự án nhỏ để tăng tự tin.", "en": "I'd suggest she lead a small project to build confidence.", "ipa": "/aɪd səˈdʒɛst ʃi lɛd‿ə smɔl ˈprɑdʒɛkt tə bɪld ˈkɑnfədəns/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 3, "vi": "Theo tôi, chuyên môn giỏi chưa chắc quản lý giỏi.", "en": "In my view, great specialists aren't always great managers.", "ipa": "/ɪn maɪ vju, ɡreɪt ˈspɛʃələsts‿ˈɑrənt‿ˈɔlˌweɪz ɡreɪt ˈmænədʒɚz/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 3, "vi": "Tôi hiểu, nhưng thăng chức quá sớm có thể phản tác dụng.", "en": "I see your point, but promoting too early could backfire.", "ipa": "/aɪ si jɚ pɔɪnt, bət prəˈmoʊɾɪŋ tu ˈɝli kʊd ˈbækˌfaɪr/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 3, "vi": "Có lẽ nên có lộ trình chuyên gia song song lộ trình quản lý.", "en": "It might be worth creating an expert track alongside management.", "ipa": "/ɪt maɪt bi wɝθ kriˈeɪɾɪŋ‿ən‿ˈɛkspɚt træk‿əˈlɔŋˈsaɪd ˈmænədʒmənt/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 4, "vi": "Chúng ta chuyển sang danh sách đề cử, vì có 8 hồ sơ cần duyệt.", "en": "Let's turn to the nomination list, since we have eight cases to review.", "ipa": "/lɛts tɝn tə ðə ˌnɑməˈneɪʃən lɪst, sɪns wi hæv‿eɪt ˈkeɪsɪz tə rɪˈvju/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 4, "vi": "Bạn trình bày lý do đề cử và kết quả của từng người nhé?", "en": "Would you mind going over each nominee's case and their recent results?", "ipa": "/wʊd ju maɪnd ˈɡoʊɪŋ‿ˈoʊvɚ‿itʃ ˌnɑməˈniz keɪs‿ən ðɛr ˈrisənt rɪˈzʌlts/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 4, "vi": "Tôi muốn nêu lo ngại: 3 người được đề cử chưa có người kế nhiệm.", "en": "I'd like to raise a concern: three nominees have no successor for their current roles.", "ipa": "/aɪd laɪk tə reɪz‿ə kənˈsɝn: θri ˌnɑməˈniz hæv noʊ səkˈsɛsɚ fɚ ðɛr ˈkɝənt roʊlz/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 4, "vi": "Tôi hiểu bạn ấy rất giỏi, tuy nhiên chưa đủ 12 tháng ở vị trí này.", "en": "I get that she's excellent; however, she hasn't completed 12 months in her role.", "ipa": "/aɪ ɡɛt ðæt ʃiz‿ˈɛksələnt; haʊˈɛvɚ, ʃi ˈhæzənt kəmˈpliɾɪd twɛlv mʌnθs‿ɪn hɝ roʊl/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 4, "vi": "Hay chúng ta giao vai trò quyền trưởng nhóm trong 3 tháng?", "en": "Would it help if we make her acting team leader for three months first?", "ipa": "/wʊd‿ɪt hɛlp‿ɪf wi meɪk hɝ‿ˈæktɪŋ tim ˈlidɚ fɚ θri mʌnθs fɝst/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 4, "vi": "Không thể tăng lương ngay, nhưng có thể đổi chức danh từ tháng sau.", "en": "We  "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 5, "vi": "Rủi ro lớn nhất là người không được thăng chức mất động lực và tìm việc khác.", "en": "The biggest risk here is that people who aren't promoted lose motivation and start looking elsewhere.", "ipa": "/ðə ˈbɪɡɪst rɪsk hɪr‿ɪz ðæt ˈpipəl hu ɑrnt prəˈmoʊɾɪd luz ˌmoʊɾɪˈveɪʃən‿ən stɑrt ˈlʊkɪŋ‿ˈɛlsˌwɛr/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 5, "vi": "Nếu không giải thích rõ quyết định, tin đồn sẽ lan ra chỉ sau vài ngày.", "en": "If we fail to explain the decision clearly, rumors will fill the gap within days.", "ipa": "/ɪf wi feɪl tu ɪkˈspleɪn ðə dɪˈsɪʒən ˈklɪrli, ˈrumɚz wɪl fɪl ðə ɡæp wɪˈθɪn deɪz/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 5, "vi": "Tôi phản đối thăng chức chỉ dựa vào thâm niên, vì nó gửi sai thông điệp.", "en": "I'd push back on promoting based on seniority alone, because it sends the wrong message.", "ipa": "/aɪd pʊʃ bæk‿ɑn prəˈmoʊɾɪŋ beɪst‿ɑn ˌsinˈjɔrəɾi əˈloʊn, bɪˈkɔz‿ɪt sɛndz ðə rɔŋ ˈmɛsɪdʒ/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 5, "vi": "Điều tôi lo nhất là quản lý mới không được đào tạo trước khi dẫn dắt nhóm.", "en": "What worries me is that new managers get no training before they lead a team.", "ipa": "/wʌt ˈwɝiz mi ɪz ðæt nu ˈmænɪdʒɚz ɡɛt noʊ ˈtreɪnɪŋ bɪˈfɔr ðeɪ lid‿ə tim/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 5, "vi": "Tôi đề xuất thử thách 3 tháng có kèm cặp trước khi chính thức thăng chức quản lý.", "en": "My suggestion is a three-month trial with coaching before confirming any management promotion.", "ipa": "/maɪ səɡˈdʒɛstʃən‿ɪz‿ə θri mʌnθ ˈtraɪəl wɪθ ˈkoʊtʃɪŋ bɪˈfɔr kənˈfɝmɪŋ‿ˈɛni ˈmænɪdʒmənt prəˈmoʊʃən/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 6, "vi": "Thăng chức là để ghi nhận tương lai, không chỉ quá khứ.", "en": "Promotion recognizes ɚz ˈproʊɡræm fɚ ˌfɪfˈtin ˈpipəl, ˈkɔstɪŋ‿əˈbaʊt θri ˈhʌndrəd ˈmɪljən ˌviɛnˈdi/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 6, "vi": "Trong 2 năm, mục tiêu là một nửa vị trí quản lý được lấp từ bên trong.", "en": "Within two years, we aim to fill half of all management roles internally.", "ipa": "/wɪˈθɪn tu jɪrz, wi eɪm tə fɪl hæf‿əv‿ɔl ˈmænɪdʒmənt roʊlz‿ˌɪnˈtɝnəli/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 1, "vi": "Tỷ lệ nghỉ việc tự nguyện năm nay là 18%, cao nhất 3 năm qua.", "en": "Voluntary turnover is 18% this year, a three-year high.", "ipa": "/ˈvɑləntɛri ˈtɝˌnoʊvɚ ɪz‿eɪˈtin pərˈsɛnt ðɪs jɪr, ə θri jɪr haɪ/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 1, "vi": "Phần lớn người nghỉ cho biết lương chưa cạnh tranh và ít cơ hội phát triển.", "en": "Most leavers cite uncompetitive pay and limited growth opportunities.", "ipa": "/moʊst ˈlivɚz saɪɾ‿ənkəmˈpɛɾəɾɪv peɪ ən ˈlɪmɪɾɪd ɡroʊθ‿ˌɑpɚˈtunəɾiz/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 1, "vi": "Có ai trong team đang được đối thủ tiếp cận không?", "en": "Is anyone on your team being approached by competitors?", "ipa": "/ɪz‿ˈɛniˌwʌn‿ɑn jɚ tim ˈbiɪŋ‿əˈproʊtʃt baɪ kəmˈpɛɾətɚz/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 1, "vi": "Điều gì sẽ khiến bạn gắn bó với công ty thêm 2 năm nữa?", "en": "What would keep you here for another two years?", "ipa": "/wʌt wʊd kip ju hɪr fɚ əˈnʌðɚ tu jɪrz/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 1, "vi": "Vui lòng hoàn thành phỏng vấn nghỉ việc trước ngày làm việc cuối cùng.", "en": "Please complete the exit interview before your last day.", "ipa": "/pliz kəmˈplit ði ˈɛɡzɪt‿ˈɪntɚˌvju bɪˈfɔr jɚ læst deɪ/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 1, "vi": "Vui lòng bảo mật tuyệt đối danh sách nhân sự chủ chốt.", "en": "Please keep the key talent list strictly confidential.", "ipa": "/pliz kip ðə ki ˈtælənt lɪst ˈstrɪktli ˌkɑnfɪˈdɛnʃəl/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 1, "vi": "Xin lỗi vì chúng tôi phản hồi đề nghị xét lương của bạn chậm.", "en": "Sorry for the slow reply on your salary review.", "ipa": "/ˈsɑri fɚ ðə sloʊ rɪˈplaɪ ɑn jɚ ˈsælɚi ˌriˈvju/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 1, "vi": "Tôi sẽ gửi bạn đề xuất giữ chân trong tuần này.", "en": "I'll send you a retention proposal this week.", "ipa": "/aɪl sɛnd ju ə riˈtɛnʃən prəˈpoʊzəl ðɪs wik/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 2, "vi": "Theo chính sách, thưởng giữ chân chỉ chi khi bạn làm đủ thời gian cam kết.", "en": "Per policy, retention bonus is paid only after the full commitment.", "ipa": "/pɝ ˈpɑləsi, riˈtɛnʃən ˈboʊnəs‿ɪz peɪd‿ˈoʊnli ˈæftɚ ðə fʊl kəˈmɪtmənt/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 2, "vi": "Khi nhân sự chủ chốt nộp đơn, HR và quản lý gặp nhau trong 48 giờ để tìm phương án.", "en": "When key talent resigns, HR and manager meet within 48 hours.", "ipa": "/wɛn ki ˈtælənt rɪˈzaɪnz, eɪtʃ ɑr‿ən ˈmænədʒɚ mit wɪˈðɪn ˈfɔrɾi eɪt‿ˈaʊɚz/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 2, "vi": "Bạn có thể xếp hạng nhân viên của mình theo mức rủi ro nghỉ việc không?", "en": "Could you rank your team members by their flight risk?", "ipa": "/kʊd ju ræŋk jɚ tim ˈmɛmbɚz baɪ ðɛr flaɪt rɪsk/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 2, "vi": "Bạn có phiền có buổi trò chuyện giữ chân với 3 người này trong tháng không?", "en": "Would you mind holding stay conversations with these three this month?", "ipa": "/wʊd ju maɪnd ˈhoʊldɪŋ steɪ ˌkɑnvɚˈseɪʃənz wɪθ ðiz θri ðɪs mʌnθ/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 2, "vi": "Chúng tôi ưu tiên nhóm này vì lương của họ thấp hơn thị trường gần 20%.", "en": "We're prioritizing this group because they're paid nearly 20% below market.", "ipa": "/wɪr praɪˈɔrəˌtaɪzɪŋ ðɪs ɡrup bɪˈkɔz ðɛr peɪd ˈnɪrli ˈtwɛnti pɚˈsɛnt bɪˈloʊ ˈmɑrkɪt/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 2, "vi": "Nếu không đưa offer giữ chân trong 3 ngày, anh ấy sẽ nhận việc mới.", "en": "Without a counteroffer in three days, he'll take the new job.", "ipa": "/wɪˈθaʊt‿ə ˈkaʊntɚˌɔfɚ ɪn θri deɪz, hil teɪk ðə nu dʒɑb/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 2, "vi": "Rất tiếc, chúng tôi không thể đáp ứng mức offer bạn đã nhận.", "en": "Unfortunately, we're unable to match the offer you've received.", "ipa": "/ʌnˈfɔrtʃənətli, wɪr‿əˈneɪbəl tə mætʃ ði ˈɔfɚ juv rɪˈsivd/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 2, "vi": "Tôi sẽ cập nhật danh sách rủi ro nghỉ việc mỗi quý và gửi ban lãnh đạo.", "en": "I'll refresh the flight-risk list quarterly and share it with leadership.", "ipa": "/aɪl rɪˈfrɛʃ ðə flaɪt rɪsk lɪst ˈkwɔrtɚli ən ʃɛr‿ɪt wɪθ ˈlidɚˌʃɪp/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 3, "vi": "Để tôi giải thích chương trình phát triển nhân tài năm nay.", "en": "Let me explain how this year's talent development program works.", "ipa": "/lɛt mi ɪkˈspleɪn haʊ ðɪs jɪrz ˈtælənt dɪˈvɛləpmənt ˈproʊˌɡræm wɝks/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 3, "vi": "Để tôi làm rõ: vào nhóm nhân tài chưa phải thăng chức ngay.", "en": "Let me clarify: the talent pool isn't an immediate promotion.", "ipa": "/lɛt mi ˈklɛrəˌfaɪ: ðə ˈtælənt pul‿ˈɪzənt‿ən‿ˌɪˈmiˌdiət prəˈmoʊʃən/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 3, "vi": "Theo dữ liệu, 60% người nghỉ việc là trong năm đầu.", "en": "Based on data, 60% of resignations occur in year one.", "ipa": "/beɪst‿ɑn ˈdeɪɾə, ˈsɪksti pərˈsɛnt‿əv ˌrɛzɪɡˈneɪʃənz‿əˈkɝ ɪn jɪr wʌn/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 3, "vi": "Tôi đề xuất phỏng vấn giữ chân 20 nhân sự chủ chốt quý này.", "en": "I recommend stay interviews with 20 key employees this quarter.", "ipa": "/aɪ ˌrɛkəˈmɛnd steɪ ˈɪntɚˌvjuz wɪθ ˈtwɛni ki ɛmˈplɔɪiz ðɪs ˈkwɔrtɚ/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 3, "vi": "Tôi đề nghị so lương kỹ sư với thị trường trước kỳ xét lương.", "en": "I'd suggest benchmarking engineers' salaries against the market before reviews.", "ipa": "/aɪd səˈdʒɛst ˈbɛntʃˌmɑrkɪŋ‿ˈɛndʒəˈnɪrz ˈsælɚiz‿əˈɡɛnst ðə ˈmɑrkət bɪˈfɔr riˈvjuz/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 3, "vi": "Theo tôi, người ta nghỉ vì quản lý nhiều hơn vì lương.", "en": "In my view, managers drive resignations more than pay does.", "ipa": "/ɪn maɪ vju, ˈmænədʒɚz draɪv ˌrɛzɪɡˈneɪʃənz mɔr ðæn peɪ dəz/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 3, "vi": "Tôi hiểu, nhưng tăng lương không giải quyết mọi trường hợp nghỉ việc.", "en": "I see your point, but raises don't fix every departure.", "ipa": "/aɪ si jɚ pɔɪnt, bət ˈreɪzəz doʊnt fɪks‿ˈɛvri dɪˈpɑrtʃɚ/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 3, "vi": "Có lẽ nên cho người giỏi luân chuyển sang dự án mới mỗi năm.", "en": "It might be worth rotating top performers across projects yearly.", "ipa": "/ɪt maɪt bi wɝθ ˈroʊˌteɪɾɪŋ tɑp pɚˈfɔrmɚz‿əˈkrɔs ˈprɑdʒɛkts ˈjɪrli/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 4, "vi": "Chúng ta chuyển sang báo cáo nghỉ việc, vì tỷ lệ đang tăng.", "en": "Next, let's look at the turnover report, because the rate keeps rising.", "ipa": "/nɛkst, lɛts lʊk‿ət ðə ˈtɝˌnoʊvɚ rɪˈpɔrt, bɪˈkɔz ðə reɪt kips ˈraɪzɪŋ/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 4, "vi": "Bạn trình bày lý do nghỉ việc chính trong quý này nhé?", "en": "Could you walk us through the main reasons people left this quarter?", "ipa": "/kʊd ju wɔk‿əs θru ðə meɪn ˈrizənz ˈpipəl lɛft ðɪs ˈkwɔrɾɚ/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 4, "vi": "Tôi muốn lưu ý một điểm: 3 kỹ sư giỏi nhất đang bị headhunter tiếp cận.", "en": "I want to flag one issue: our three best engineers are being approached by headhunters.", "ipa": "/aɪ wɑnt tə flæɡ wʌn‿ˈɪʃu: ˈaʊɚ θri bɛst‿ˌɛndʒəˈnɪrz‿ɚ ˈbiɪŋ‿əˈproʊtʃt baɪ ˈhɛdˌhʌntɚz/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 4, "vi": "Tôi hiểu ngân sách eo hẹp, tuy nhiên mất người giỏi còn tốn hơn.", "en": "I appreciate that the budget is tight; however, losing top talent costs even more.", "ipa": "/aɪ əˈpriʃiˌeɪt ðæt ðə ˈbʌdʒɪɾ‿ɪz taɪt; haʊˈɛvɚ, ˈluzɪŋ tɑp ˈtælənt kɔsts‿ˈivən mɔr/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 4, "vi": "Hay chúng ta có thưởng giữ chân cho vị trí chủ chốt?", "en": "What if we introduced a retention bonus for the most critical roles?", "ipa": "/wʌɾ‿ɪf wi ˌɪntrəˈdust‿ə rɪˈtɛnʃən ˈboʊnəs fɚ ðə moʊst ˈkrɪɾɪkəl roʊlz/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 4, "vi": "Không thể tăng lương cho tất cả, nhưng có thể ưu tiên 10 người.", "en": "We're not able to give everyone a raise, but we can prioritize ten key people.", "ipa": "/wɪr nɑɾ‿ˈeɪbəl tə ɡɪv‿ˈɛvriˌwʌn‿ə reɪz, bət wi kən praɪˈɔrəˌtaɪz tɛn ki ˈpipəl/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 4, "vi": "Tóm lại, chúng ta tập trung giữ 10 người chủ chốt trong 6 tháng tới.", "en": "So, to recap, we'll focus on keeping ten key people over the next six months.", "ipa": "/soʊ, tə ˈriˌkæp, wil ˈfoʊkəs‿ɑn ˈkipɪŋ tɛn ki ˈpipəl‿ˈoʊvɚ ðə nɛkst sɪks mʌnθs/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 4, "vi": "Bước tiếp theo: mỗi quản lý gặp người chủ chốt trước cuối tháng.", "en": "Next step: each manager will meet their key people before month-end.", "ipa": "/nɛkst stɛp: itʃ ˈmænɪdʒɚ wɪl mit ðɛr ki ˈpipəl bɪˈfɔr mʌnθ‿ɛnd/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 5, "vi": "Thật lòng, ta thường chỉ biết người giỏi không vui khi họ đã nộp đơn.", "en": "Honestly, we usually notice a top performer is unhappy only after they've handed in their resignation.", "ipa": "/ˈɑnəstli, wi ˈjuʒuəli ˈnoʊɾɪs‿ə tɑp pɚˈfɔrmɚ‿ɪz‿ʌnˈhæpi ˈoʊnli ˈæftɚ ðeɪv ˈhændɪd‿ɪn ðɛr ˌrɛzɪɡˈneɪʃən/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 5, "vi": "Theo kinh nghiệm, người ta đến vì lương nhưng ở lại vì quản lý trực tiếp.", "en": "From my experience, people join for the salary but stay because of their direct manager.", "ipa": "/frʌm maɪ ɪkˈspɪriəns, ˈpipəl dʒɔɪn fɚ ðə ˈsæləri bət steɪ bɪˈkɔz‿əv ðɛr dɪˈrɛkt ˈmænɪdʒɚ/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 5, "vi": "Suy cho cùng, giữ một người giỏi rẻ hơn nhiều so với tuyển người thay thế.", "en": "At the end of the day, keeping a strong employee costs far less than replacing one.", "ipa": "/æt ði ɛnd‿əv ðə deɪ, ˈkipɪŋ‿ə strɔŋ‿ɪmˈplɔɪi kɔsts fɑr lɛs ðən rɪˈpleɪsɪŋ wʌn/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 5, "vi": "Điều tôi lo là kỹ sư chủ chốt đang được headhunter liên hệ hằng tuần.", "en": "My main worry is that our key engineers are being contacted by headhunters every week.", "ipa": "/maɪ meɪn ˈwɝi ɪz ðæɾ‿ˈaʊɚ ki ˌɛndʒəˈnɪrz‿ɚ ˈbiɪŋ ˈkɑntæktɪd baɪ ˈhɛdˌhʌntɚz‿ˈɛvri wik/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 5, "vi": "Nếu không có lộ trình rõ ràng, người có tham vọng sẽ phát triển ở nơi khác.", "en": "If we don't create clear career paths, ambitious people will build their careers somewhere else.", "ipa": "/ɪf wi doʊnt kriˈeɪt klɪr kəˈrɪr pæθs, æmˈbɪʃəs ˈpipəl wɪl bɪld ðɛr kəˈrɪrz ˈsʌmˌwɛr‿ɛls/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 5, "vi": "Tôi e ngại luôn trả theo offer mới, vì như vậy là khuyến khích dọa nghỉ.", "en": "I'm not comfortable with matching every counteroffer, because it teaches people that resigning works.", "ipa": "/aɪm nɑt ˈkʌmftɚbəl wɪθ ˈmætʃɪŋ‿ˈɛvri ˈkaʊntɚˌɔfɚ, bɪˈkɔz‿ɪt ˈtitʃɪz ˈpipəl ðæt rɪˈzaɪnɪŋ wɝks/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 5, "vi": "Điều tôi lo nhất là 3 vị trí then chốt chưa có người kế nhiệm.", "en": "My biggest concern is that we have no successor for three critical positions.", "ipa": "/maɪ ˈbɪɡɪst kənˈsɝn‿ɪz ðæt wi hæv noʊ səkˈsɛsɚ fɚ θri ˈkrɪɾɪkəl pəˈzɪʃənz/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 5, "vi": "Tôi đề xuất trò chuyện giữ chân định kỳ với người giỏi, bắt đầu từ khối kỹ thuật.", "en": "My recommendation is regular stay interviews with top performers, starting with the engineering team.", "ipa": "/maɪ ˌrɛkəmɛnˈdeɪʃən‿ɪz ˈrɛɡjəlɚ steɪ ˈɪntɚvjuz wɪθ tɑp pɚˈfɔrmɚz, ˈstɑrɾɪŋ wɪθ ði ˌɛndʒəˈnɪrɪŋ tim/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 6, "vi": "Người ta rời bỏ sếp, không phải công ty.", "en": "People leave managers, not companies.", "ipa": "/ˈpipəl liv ˈmænɪdʒɚz, nɑt ˈkʌmpəniz/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 6, "vi": "Giữ người cũ rẻ hơn tuyển người mới.", "en": "Keeping people is cheaper than replacing them.", "ipa": "/ˈkipɪŋ ˈpipəl‿ɪz ˈtʃipɚ ðən rɪˈpleɪsɪŋ ðɛm/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 6, "vi": "Mỗi người giỏi nghỉ việc khiến chúng ta tốn khoảng 6 tháng lương để tuyển và đào tạo người thay.", "en": "Every top performer who leaves costs us roughly six months' salary to replace and onboard.", "ipa": "/ˈɛvri tɑp pɚˈfɔrmɚ hu livz kɔsts‿əs ˈrʌfli sɪks mʌnθs ˈsæləri tə ˌriˈpleɪs‿ən‿ˈɑnˌbɔrd/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 6, "vi": "Với tỷ lệ 18%, mỗi năm chúng ta mất gần 4 tỷ đồng chỉ riêng cho chi phí thay thế.", "en": "At 18% turnover, we're losing nearly 4 billion VND a year in replacement costs alone.", "ipa": "/əɾ‿eɪˈtin pɚˈsɛnt ˈtɝˌnoʊvɚ, wɪr ˈluzɪŋ ˈnɪrli fɔr ˈbɪljən ˌviɛnˈdi ə jɪr‿ɪn rɪˈpleɪsmənt kɔsts‿əˈloʊn/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 6, "vi": "Đào tạo họ đủ tốt để họ có thể ra đi.", "en": "Train people well enough so they can leave.", "ipa": "/treɪn ˈpipəl wɛl‿ɪˈnʌf soʊ ðeɪ kən liv/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 6, "vi": "Mức trung bình ngành là 12%, tức chúng ta đang cao hơn 6 điểm phần trăm.", "en": "The industry average is 12%, which puts us six percentage points higher.", "ipa": "/ði ˈɪndəstri ˈævərɪdʒ‿ɪz twɛlv pɚˈsɛnt, wɪtʃ pʊts‿əs sɪks pɚˈsɛntədʒ pɔɪnts ˈhaɪɚ/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 6, "vi": "Tôi đề xuất quỹ điều chỉnh lương 1,5 tỷ cho 30 người chủ chốt, rẻ hơn nhiều so với tuyển thay.", "en": "I propose a 1.5 billion VND adjustment fund for 30 key people, far cheaper than replacing them.", "ipa": "/aɪ prəˈpoʊz‿ə wʌn pɔɪnt faɪv ˈbɪljən ˌviɛnˈdi əˈdʒʌstmənt fʌnd fɚ ˈθɝɾi ki ˈpipəl, fɑr ˈtʃipɚ ðən rɪˈpleɪsɪŋ ðɛm/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 6, "vi": "Mục tiêu năm tới là đưa tỷ lệ nghỉ việc về 12% và giữ 95% nhân sự chủ chốt.", "en": "We aim to bring turnover down to 12% and retain 95% of key talent next year.", "ipa": "/wi eɪm tə brɪŋ ˈtɝˌnoʊvɚ daʊn tə twɛlv pɚˈsɛnt‿ən rɪˈteɪn ˈnaɪnti faɪv pɚˈsɛnt‿əv ki ˈtælənt nɛkst jɪr/"}, {"topicRaw": "14-Benefits", "topicName": "Benefits", "topicOrder": 14, "stage": 1, "vi": "Gói bảo hiểm sức khỏe mới bao gồm nha khoa và khám thai.", "en": "The new health plan covers dental and maternity check-ups.", "ipa": "/ðə nu hɛlθ plæn ˈkʌvɚz ˈdɛntəl‿ən məˈtɝnɪti tʃɛk ʌps/"}, {"topicRaw": "14-Benefits", "topicName": "Benefits", "topicOrder": 14, "stage": 1, "vi": "Nhân viên được mua thêm bảo hiểm cho vợ/chồng và con với giá ưu đãi.", "en": "Employees can add spouses and children at a discount.", "ipa": "/ɛmˈplɔɪiz kən‿æd ˈspaʊsɪz‿ən ˈtʃɪldrən‿ət‿ə dɪˈskaʊnt/"}, {"topicRaw": "14-Benefits", "topicName": "Benefits", "topicOrder": 14, "stage": 1, "vi": "Bạn đã nộp hồ sơ bồi thường cho lần khám tuần trước chưa?", "en": "Have you filed the claim for last week's visit?", "ipa": "/həv ju faɪld ðə kleɪm fɚ læst wiks ˈvɪzɪt/"}, {"topicRaw": "14-Benefits", "topicName": "Benefits", "topicOrder": 14, "stage": 1, "vi": "Gói phúc lợi linh hoạt có những lựa chọn nào?", "en": "Which options are available under the flexible benefits scheme?", "ipa": "/wɪtʃ‿ˈɑpʃənz‿ɚ‿əˈveɪləbəl‿ˈʌndɚ ðə ˈflɛksəbəl ˈbɛnɪfɪts skim/"}, {"topicRaw": "14-Benefits", "topicName": "Benefits", "topicOrder": 14, "stage": 1, "vi": "Vui lòng nộp hóa đơn và đơn thuốc trong 30 ng cName": "Benefits", "topicOrder": 14, "stage": 6, "vi": "Phúc lợi chiếm 12% tổng chi phí nhân sự, nhưng chỉ 40% nhân viên hiểu rõ quyền lợi của mình.", "en": "Benefits make up 12% of total people costs, yet only 40% of employees understand what they're entitled to.", "ipa": "/ˈbɛnɪfɪts meɪk‿ʌp twɛlv pɚˈsɛnt‿əv ˈtoʊɾəl ˈpipəl kɔsts, jɛɾ‿ˈoʊnli ˈfɔrti pɚˈsɛnt‿əv‿ɪmˈplɔɪiz‿ˌʌndɚˈstænd wʌt ðɛr‿ɛnˈtaɪɾəld tu/"}, {"topicRaw": "14-Benefits", "topicName": "Benefits", "topicOrder": 14, "stage": 6, "vi": "Nếu nhân viên không thấy giá trị, phúc lợi chỉ là chi phí và không giúp giữ người.", "en": "If employees don't see the value, benefits become pure cost with no retention effect.", "ipa": "/ɪf‿ɪmˈplɔɪiz doʊnt si ðə ˈvælju, ˈbɛnɪfɪts bɪˈkʌm pjʊr kɔst wɪθ noʊ rɪˈtɛnʃən‿ɪˈfɛkt/"}, {"topicRaw": "14-Benefits", "topicName": "Benefits", "topicOrder": 14, "stage": 6, "vi": "Đúng nhu cầu quan trọng hơn nhiều lựa chọn.", "en": "The right fit beats more options.", "ipa": "/ðə raɪt fɪt bits mɔr‿ˈɑpʃənz/"}, {"topicRaw": "14-Benefits", "topicName": "Benefits", "topicOrder": 14, "stage": 6, "vi": "Các công ty có phúc lợi linh hoạt ghi nhận mức hài lòng cao hơn khoảng 25%.", "en": "Companies with flexible benefits report satisfaction scores roughly 25% higher.", "ipa": "/ˈkʌmpəniz wɪθ ˈflɛksəbəl ˈbɛnɪfɪts rɪˈpɔrt ˌsæɾəsˈfækʃən skɔrz ˈrʌfli ˈtwɛntiˌfaɪv pɚˈsɛnt ˈhaɪɚ/"}, {"topicRaw": "14-Benefits", "topicName": "Benefits", "topicOrder": 14, "stage": 6, "vi": "Tôi đề xuất chuyển sang phúc lợi linh hoạt với cùng ngân sách, kèm buổi giới thiệu cho từng phòng.", "en": "I propose moving to flexible benefits within the same budget, with a briefing for each department.", "ipa": "/aɪ prəˈpoʊz ˈmuvɪŋ tə ˈflɛksəbəl ˈbɛnɪfɪts wɪˈθɪn ðə seɪm ˈbʌdʒɪt, wɪθ‿ə ˈbrifɪŋ fɚ‿itʃ dɪˈpɑrtmənt/"}, {"topicRaw": "14-Benefits", "topicName": "Benefits", "topicOrder": 14, "stage": 6, "vi": "Đến cuối năm sau, mục tiêu là 80% nhân viên hiểu và dùng ít nhất 3 phúc lợi.", "en": "By the end of next year, we want 80% of staff to understand and use at least three benefits.", "ipa": "/baɪ ði ɛnd‿əv nɛkst jɪr, wi wɑnt‿ˈeɪɾi pɚˈsɛnt‿əv stæf tu ˌʌndɚˈstænd‿ən juz‿ət list θri ˈbɛnɪfɪts/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 1, "vi": "Từ tháng 7, khối vận hành sẽ báo cáo trực tiếp cho giám đốc vận hành.", "en": "From July, operations will report directly to the COO.", "ipa": "/frəm ˌdʒuˈlaɪ, ˌɑpɚˈeɪʃənz wɪl riˈpɔrt dɚˈɛktli tə ðə ku/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 1, "vi": "Sơ đồ tổ chức mới gồm 4 khối và 18 phòng ban.", "en": "The new org chart has four divisions, 18 departments.", "ipa": "/ðə nu ɔrɡ tʃɑrt həz fɔr dɪˈvɪʒənz, eɪˈtin dɪˈpɑrtmənts/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 1, "vi": "Sau tái cấu trúc, bạn quản lý trực tiếp bao nhiêu người?", "en": "How many direct reports will you have after restructuring?", "ipa": "/haʊ ˈmɛni dɚˈɛkt rɪˈpɔrts wɪl ju həv‿ˈæftɚ riˈstrʌktʃɚɪŋ/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 1, "vi": "Vị trí này báo cáo trực tiếp hay gián tiếp cho giám đốc khu vực?", "en": "Direct or dotted-line reporting to the regional director?", "ipa": "/dɚˈɛkt‿ɚ ˈdɑɾəd laɪn riˈpɔrtɪŋ tə ðə ˈridʒənəl dɚˈɛktɚ/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 1, "vi": "Vui lòng cập nhật mô tả công việc theo cơ cấu mới trước cuối tháng.", "en": "Update job descriptions for the new structure by month-end.", "ipa": "/əpˈdeɪt dʒɑb dɪˈskrɪpʃənz fɚ ðə nu ˈstrʌktʃɚ baɪ mʌnθ ɛnd/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 1, "vi": "Vui lòng giữ sơ đồ tổ chức dự thảo trong nhóm dự án.", "en": "Please keep the draft chart within the project team.", "ipa": "/pliz kip ðə dræft tʃɑrt wɪˈðɪn ðə ˈprɑdʒɛkt tim/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 1, "vi": "Xin lỗi, sơ đồ gửi hôm qua vẫn còn tên người đã nghỉ việc.", "en": "Sorry, yesterday's chart still lists people who've left.", "ipa": "/ˈsɑri, ˈjɛstɚˌdeɪz tʃɑrt stɪl lɪsts ˈpipəl huv lɛft/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 1, "vi": "Tôi sẽ gửi sơ đồ và ma trận phân quyền trong tuần này.", "en": "I'll share the chart and delegation matrix this week.", "ipa": "/aɪl ʃɛr ðə tʃɑrt‿ən ˌdɛləˈɡeɪʃən ˈmeɪtrɪks ðɪs wik/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 2, "vi": "Theo luật, thay đổi cơ cấu ảnh hưởng nhiều người phải có phương án sử dụng lao động.", "en": "By law, large restructures require a formal labor utilization plan.", "ipa": "/baɪ lɔ, lɑrdʒ riˈstrʌktʃɚz ˌriˈkwaɪɚ ə ˈfɔrməl ˈleɪbɚ ˌjuɾələˈzeɪʃən plæn/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 2, "vi": "Thay đổi cơ cấu phải qua phân tích tác động và tham vấn công đoàn trước khi thông báo.", "en": "Restructuring needs impact analysis and union consultation before announcement.", "ipa": "/riˈstrʌktʃɚɪŋ nidz‿ˌɪmˈpækt‿əˈnæləsəs‿ən ˈjunjən ˌkɑnsəlˈteɪʃən bɪˈfɔr‿əˈnaʊnsmənt/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 2, "vi": "Bạn có thể xác nhận ai sẽ duyệt chi phí sau khi gộp phòng không?", "en": "Could you confirm who holds budget approval after the merger?", "ipa": "/kʊd ju kənˈfɝm hu hoʊldz ˈbʌdʒɪt‿əˈpruvəl‿ˈæftɚ ðə ˈmɝdʒɚ/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 2, "vi": "Bạn có phiền gặp từng nhân viên bị ảnh hưởng trước khi thông báo chung không?", "en": "Would you mind meeting each affected employee before the general announcement?", "ipa": "/wʊd ju maɪnd ˈmiɾɪŋ‿itʃ‿əˈfɛktɪd‿ɪmˈplɔɪi bɪˈfɔr ðə ˈdʒɛnɚəl‿əˈnaʊnsmənt/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 2, "vi": "Chúng tôi gộp 2 nhóm vì chức năng trùng lặp và chi phí quản lý cao.", "en": "We're merging two teams because roles overlap and overhead is high.", "ipa": "/wɪr ˈmɝdʒɪŋ tu timz bɪˈkɔz roʊlz‿ˈoʊvɚˌlæp‿ən‿ˈoʊvɚˈhɛd‿ɪz haɪ/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 2, "vi": "Nếu vị trí của bạn bị ảnh hưởng, HR sẽ ưu tiên xem xét bố trí công việc khác.", "en": "If your role is affected, HR will first consider redeployment.", "ipa": "/ɪf jɚ roʊl‿ɪz‿əˈfɛktɪd, eɪtʃ ɑr wɪl fɝst kənˈsɪdɚ ˌridɪˈplɔɪmənt/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 2, "vi": "Rất tiếc, vị trí của bạn không còn trong cơ cấu mới, chúng ta cùng bàn phương án hỗ trợ.", "en": "Unfortunately, your role isn't in the new structure; let's discuss support.", "ipa": "/ənˈfɔrtʃənətli, jɚ roʊl‿ˈɪzənt‿ɪn ðə nu ˈstrʌktʃɚ; lɛts dɪˈskʌs səˈpɔrt/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 2, "vi": "Tôi sẽ giám sát việc bàn giao và cập nhật tiến độ cho bạn mỗi tuần.", "en": "I'll oversee the handover and give you a weekly progress update.", "ipa": "/aɪl‿ˈoʊvɚˌsi ðə ˈhændoʊvɚ‿ən ɡɪv ju ə ˈwikli ˈprɑɡrɛs‿ʌpˈdeɪt/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 3, "vi": "Để tôi giải thích vì sao cơ cấu mới có 3 khối.", "en": "Let me explain why the new structure has three divisions.", "ipa": "/lɛt mi ɪkˈspleɪn waɪ ðə nu ˈstrʌktʃɚ həz θri dɪˈvɪʒənz/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 3, "vi": "Để tôi làm rõ: không ai mất việc trong đợt này.", "en": "Let me clarify: nobody loses their job in this round.", "ipa": "/lɛt mi ˈklɛrəˌfaɪ: ˈnoʊˌbɑˌdi ˈluzəz ðɛr dʒɑb‿ɪn ðɪs raʊnd/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 3, "vi": "Theo phân tích, 2 phòng đang làm trùng 30% công việc.", "en": "Based on analysis, two departments overlap on 30% of work.", "ipa": "/beɪst‿ɑn‿əˈnæləsəs, tu dɪˈpɑrtmənts‿ˈoʊvɚˌlæp‿ɑn ˈθɝɾi pərˈsɛnt‿əv wɝk/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 3, "vi": "Tôi đề xuất gộp 2 nhóm hành chính thành một dịch vụ chung.", "en": "I recommend merging two admin teams into one shared service.", "ipa": "/aɪ ˌrɛkəˈmɛnd ˈmɝdʒɪŋ tu ˈædmɪn timz‿ˈɪntu wʌn ʃɛrd ˈsɝvəs/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 3, "vi": "Tôi đề nghị báo quản lý trước rồi mới công bố cho nhân viên.", "en": "I'd suggest briefing managers before announcing the change to employees.", "ipa": "/aɪd səˈdʒɛst ˈbrifɪŋ ˈmænɪdʒɚz bɪˈfɔr‿əˈnaʊnsɪŋ ðə tʃeɪndʒ tu ɪmˈplɔɪiz/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 3, "vi": "Theo tôi, cơ cấu cần đi theo chiến lược, không theo con người.", "en": "In my view, structure should follow strategy, not personalities.", "ipa": "/ɪn maɪ vju, ˈstrʌktʃɚ ʃʊd ˈfɑloʊ ˈstræɾədʒi, nɑt ˌpɝsəˈnælɪtiz/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 3, "vi": "Tôi hiểu, nhưng thêm 1 cấp quản lý sẽ làm chậm quyết định.", "en": "I see your point, but another layer will slow decisions.", "ipa": "/aɪ si jɚ pɔɪnt, bət‿əˈnʌðɚ ˈleɪɚ wɪl sloʊ dɪˈsɪʒənz/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 3, "vi": "Có lẽ nên thử cơ cấu mới ở 1 khối trước.", "en": "It might be worth piloting the structure in one division.", "ipa": "/ɪt maɪt bi wɝθ ˈpaɪlətɪŋ ðə ˈstrʌktʃɚ ɪn wʌn dɪˈvɪʒən/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 4, "vi": "Chúng ta chuyển sang cơ cấu mới, vì phải công bố trước quý sau.", "en": "Let's turn to the new structure, since we must announce it before next quarter.", "ipa": "/lɛts tɝn tə ðə nu ˈstrʌktʃɚ, sɪns wi mʌst‿əˈnaʊns‿ɪt bɪˈfɔr nɛkst ˈkwɔrɾɚ/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 4, "vi": "Bạn trình bày tuyến báo cáo mới của từng khối nhé?", "en": "Would you mind going over the new reporting lines for each division?", "ipa": "/wʊd ju maɪnd ˈɡoʊɪŋ‿ˈoʊvɚ ðə nu rɪˈpɔrɾɪŋ laɪnz fɚ‿itʃ dɪˈvɪʒən/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 4, "vi": "Tôi muốn nêu lo ngại: 4 người sẽ báo cáo cho 2 quản lý cùng lúc.", "en": "I'd like to raise a concern: four people would report to two managers at once.", "ipa": "/aɪd laɪk tə reɪz‿ə kənˈsɝn: fɔr ˈpipəl wʊd rɪˈpɔrt tə tu ˈmænɪdʒɚz‿ət wʌns/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 4, "vi": "Tôi hiểu cần thay đổi nhanh, tuy nhiên nhân viên cần thời gian thích nghi.", "en": "I get that we need to move fast; however, people need time to adjust.", "ipa": "/aɪ ɡɛt ðæt wi nid tə muv fæst; haʊˈɛvɚ, ˈpipəl nid taɪm tu əˈdʒʌst/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 4, "vi": "Hay chúng ta chuyển đổi theo 2 giai đoạn trong 6 tháng?", "en": "Would it help if we roll out the change in two phases over six months?", "ipa": "/wʊd‿ɪt hɛlp‿ɪf wi roʊl‿aʊt ðə tʃeɪndʒ‿ɪn tu ˈfeɪzɪz‿ˈoʊvɚ sɪks mʌnθs/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 4, "vi": "Không thể giữ cả 2 trưởng phòng, nhưng có thể tạo vai trò chuyên gia.", "en": "We can't keep both head positions, but we can create a senior expert role.", "ipa": "/wi kænt kip boʊθ hɛd pəˈzɪʃənz, bət wi kən kriˈeɪɾ‿ə ˈsinjɚ‿ˈɛkspɚt roʊl/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 4, "vi": "Tóm lại, cơ cấu mới áp dụng từ quý 1 với 3 khối chính.", "en": "To wrap up, the new structure starts in Q1 with three main divisions.", "ipa": "/tu ræp‿ʌp, ðə nu ˈstrʌktʃɚ stɑrts‿ɪn ˌkjuˈwʌn wɪθ θri meɪn dɪˈvɪʒənz/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 4, "vi": "Sau buổi họp này, HR gặp từng quản lý bị ảnh hưởng trong tuần này.", "en": "After this meeting, HR will meet each affected manager individually this week.", "ipa": "/ˈæftɚ ðɪs ˈmiɾɪŋ, ˌeɪtʃˈɑr wɪl miɾ‿itʃ‿əˈfɛktɪd ˈmænɪdʒɚ‿ˌɪndəˈvɪdʒuəli ðɪs wik/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 5, "vi": "Thật lòng, cơ cấu quá nhiều tầng nên quyết định mất hàng tuần thay vì hàng ngày.", "en": "To be frank, our current structure has too many layers, so decisions take weeks instead of days.", "ipa": "/tu bi fræŋk, ˈaʊɚ ˈkɝənt ˈstrʌktʃɚ hæz tu ˈmɛni ˈleɪɚz, soʊ dɪˈsɪʒənz teɪk wiks‿ɪnˈstɛd‿əv deɪz/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 5, "vi": "Theo kinh nghiệm, tái cơ cấu thất bại khi nhân viên nghe tin đồn trước.", "en": "What I've seen is that restructuring fails when people hear about it from rumors first.", "ipa": "/wʌɾ‿aɪv sin‿ɪz ðæt riˈstrʌktʃɚɪŋ feɪlz wɛn ˈpipəl hɪr‿əˈbaʊɾ‿ɪt frəm ˈrumɚz fɝst/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 5, "vi": "Mấu chốt là cơ cấu phải đi theo chiến lược, không phải ngược lại.", "en": "The bottom line is that structure should follow strategy, not the other way around.", "ipa": "/ðə ˈbɑɾəm laɪn‿ɪz ðæt ˈstrʌktʃɚ ʃʊd ˈfɑloʊ ˈstræɾədʒi, nɑt ði ˈʌðɚ weɪ əˈraʊnd/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 5, "vi": "Rủi ro lớn nhất là mất người giỏi khi chuyển đổi vì vai trò mới không rõ.", "en": "The biggest risk here is losing key people during the transition because nobody explained their new roles.", "ipa": "/ðə ˈbɪɡɪst rɪsk hɪr‿ɪz ˈluzɪŋ ki ˈpipəl ˈdʊrɪŋ ðə trænˈzɪʃən bɪˈkɔz ˈnoʊbɑdi ɪkˈspleɪnd ðɛr nu roʊlz/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 5, "vi": "Nếu tuyến báo cáo không rõ, nhân viên sẽ nhận chỉ đạo trái ngược từ hai quản lý.", "en": "If we fail to clarify reporting lines, people will keep getting conflicting instructions from two managers.", "ipa": "/ɪf wi feɪl tə ˈklɛrəˌfaɪ rɪˈpɔrɾɪŋ laɪnz, ˈpipəl wɪl kip ˈɡɛɾɪŋ kənˈflɪktɪŋ‿ɪnˈstrʌkʃənz frəm tu ˈmænɪdʒɚz/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 5, "vi": "Tôi phản đối công bố cơ cấu mới trước khi trao đổi với các quản lý liên quan.", "en": "I'd push back on announcing the new structure before we've talked to the affected managers.", "ipa": "/aɪd pʊʃ bæk‿ɑn‿əˈnaʊnsɪŋ ðə nu ˈstrʌktʃɚ bɪˈfɔr wiv tɔkt tə ði əˈfɛktɪd ˈmænɪdʒɚz/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 5, "vi": "Điều tôi lo nhất là 2 phòng đang làm cùng việc nhưng mục tiêu khác nhau.", "en": "What worries me is that two departments are doing the same work with different targets.", "ipa": "/wʌt ˈwɝiz mi ɪz ðæt tu dɪˈpɑrtmənts‿ɚ ˈduɪŋ ðə seɪm wɝk wɪθ ˈdɪfɚənt ˈtɑrɡɪts/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 5, "vi": "Tôi đề xuất triển khai thay đổi theo từng giai đoạn, bắt đầu với một nhóm thử nghiệm.", "en": "My suggestion is to roll out the change in phases, starting with a small pilot team.", "ipa": "/maɪ səɡˈdʒɛstʃən‿ɪz tə roʊl‿aʊt ðə tʃeɪndʒ‿ɪn ˈfeɪzɪz, ˈstɑrɾɪŋ wɪθ‿ə smɔl ˈpaɪlət tim/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 6, "vi": "Cơ cấu theo sau chiến lược.", "en": "Structure follows strategy.", "ipa": "/ˈstrʌktʃɚ ˈfɑloʊz ˈstræɾədʒi/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 6, "vi": "Thay đổi là điều duy nhất không đổi.", "en": "Change is the only constant.", "ipa": "/tʃeɪndʒ‿ɪz ði ˈoʊnli ˈkɑnstənt/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 6, "vi": "Từ nhân viên đến CEO có 6 cấp, nên mỗi quyết định mất trung bình 2 tuần.", "en": "We have six layers between frontline staff and the CEO, so an average decision takes two weeks.", "ipa": "/wi hæv sɪks ˈleɪɚz bɪˈtwin ˈfrʌntˌlaɪn stæf‿ən ðə ˌsiiˈoʊ, soʊ ən‿ˈævərɪdʒ dɪˈsɪʒən teɪks tu wiks/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 6, "vi": "Quá nhiều tầng nấc sẽ làm chậm phản ứng với thị trường và giữ chi phí quản lý ở mức cao.", "en": "Too many layers will slow our response to the market and keep overhead costs high.", "ipa": "/tu ˈmɛni ˈleɪɚz wɪl sloʊ ˈaʊɚ rɪˈspɑns tə ðə ˈmɑrkɪɾ‿ən kip‿ˈoʊvɚˈhɛd kɔsts haɪ/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 6, "vi": "Ít cấp hơn, quyết định nhanh hơn.", "en": "Fewer layers, faster decisions.", "ipa": "/ˈfjuɚ ˈleɪɚz, ˈfæstɚ dɪˈsɪʒənz/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 6, "vi": "Các đối thủ cùng quy mô chỉ có 4 cấp, khoảng 1 quản lý cho 8 nhân viên.", "en": "Competitors our size run four layers, with roughly one manager for every eight staff.", "ipa": "/kəmˈpɛɾɪɾɚz‿ˈaʊɚ saɪz rʌn fɔr ˈleɪɚz, wɪθ ˈrʌfli wʌn ˈmænɪdʒɚ fɚ‿ˈɛvri eɪt stæf/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 6, "vi": "Tôi đề xuất giảm còn 4 cấp trong 12 tháng, tiết kiệm khoảng 7% chi phí quản lý.", "en": "I propose reducing to four layers over 12 months, saving about 7% in overhead.", "ipa": "/aɪ prəˈpoʊz rəˈdusɪŋ tə fɔr ˈleɪɚz‿ˈoʊvɚ twɛlv mʌnθs, ˈseɪvɪŋ‿əˈbaʊt ˈsɛvən pɚˈsɛnt‿ɪn‿ˈoʊvɚˈhɛd/"}, {"topicRaw": "15-Org Structure & Direction", "topicName": "Org Structure & Direction", "topicOrder": 15, "stage": 6, "vi": "Mục tiêu là mọi quyết định vận hành được chốt trong 3 ngày làm việc.", "en": "The goal is for every operational decision to be made within three working days.", "ipa": "/ðə ɡoʊl‿ɪz fɚ‿ˈɛvri ˌɑpəˈreɪʃənəl dɪˈsɪʒən tə bi meɪd wɪˈθɪn θri ˈwɝkɪŋ deɪz/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 1, "vi": "Theo Bộ luật Lao động, hợp đồng xác định thời hạn không quá 36 tháng.", "en": "Labor Code: fixed-term contracts can't exceed 36 months.", "ipa": "/ˈleɪbɚ koʊd: fɪkst tɝm ˈkɑnˌtrækts kænt‿ɪkˈsid ˈθɝɾi sɪks mʌnθs/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 1, "vi": "Hợp đồng của bạn có điều khoản bảo mật kéo dài 2 năm sau khi nghỉ việc.", "en": "Your contract has a two-year post-employment confidentiality clause.", "ipa": "/jɚ ˈkɑnˌtrækt həz‿ə tu jɪr poʊst ɛmˈplɔɪmənt ˌkɑnfəˌdɛnʃiˈæləti klɔz/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 1, "vi": "Đây là hợp đồng xác định thời hạn hay không xác định thời hạn?", "en": "Is this a fixed-term contract or an indefinite one?", "ipa": "/ɪz ðɪs‿ə fɪkst tɝm ˈkɑntrækt‿ɚ‿ən‿ɪnˈdɛfənət wʌn/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 1, "vi": "Bạn đã ký phụ lục điều chỉnh lương có hiệu lực từ tháng 1 chưa?", "en": "Have you signed the salary amendment annex effective January?", "ipa": "/hæv ju saɪnd ðə ˈsæləri əˈmɛndmənt‿ˈænɛks‿ɪˈfɛktɪv ˈdʒænjuˌɛri/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 1, "vi": "Vui lòng ký và gửi lại 1 bản hợp đồng gốc trong vòng 3 ngày.", "en": "Please sign and return one original within three days.", "ipa": "/pliz saɪn‿ən rɪˈtɝn wʌn‿ɚˈɪdʒənəl wɪˈðɪn θri deɪz/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 1, "vi": "Vui lòng đọc kỹ các điều khoản thử việc trước khi ký.", "en": "Please read the probation terms carefully before signing.", "ipa": "/pliz rid ðə proʊˈbeɪʃən tɝmz ˈkɛrfəli bɪˈfɔr ˈsaɪnɪŋ/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 1, "vi": "Xin lỗi, hợp đồng của bạn ghi sai chức danh, chúng tôi sẽ phát hành lại.", "en": "Sorry, wrong job title on your contract; we'll reissue.", "ipa": "/ˈsɑri, rɔŋ dʒɑb ˈtaɪɾəl‿ɑn jɚ ˈkɑnˌtrækt; wil riˈɪʃu/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 1, "vi": "Tôi sẽ gửi bạn bản scan khi hai bên đã ký đầy đủ.", "en": "I'll email a scan once both parties have signed.", "ipa": "/aɪl‿iˈmeɪl‿ə skæn wʌns boʊθ ˈpɑrtiz həv saɪnd/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 2, "vi": "Nếu vẫn tiếp tục làm việc sau khi hết hạn, trong 30 ngày phải ký hợp đồng mới.", "en": "After expiry, continued work needs a new contract within 30 days.", "ipa": "/ˈæftɚ ˌɛkˈspaɪri, kənˈtɪnjud wɝk nidz‿ə nu ˈkɑnˌtrækt wɪˈðɪn ˈθɝɾi deɪz/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 2, "vi": "Gia hạn cần quản lý đề xuất trước 45 ngày, HR soạn thảo và giám đốc ký.", "en": "Renewals: manager recommends 45 days ahead, HR drafts, director signs.", "ipa": "/rɪˈnuəlz: ˈmænədʒɚ ˌrɛkəˈmɛndz ˈfɔrɾi faɪv deɪz‿əˈhɛd, eɪtʃ ɑr dræfts, dɚˈɛktɚ saɪnz/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 2, "vi": "Bạn có thể xác nhận muốn gia hạn hay chấm dứt hợp đồng của nhân viên này không?", "en": "Could you confirm whether to renew or end this contract?", "ipa": "/kʊd ju kənˈfɝm ˈwɛðɚ tə rɪˈnu ɚ ɛnd ðɪs ˈkɑnˌtrækt/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 2, "vi": "Bạn có phiền ký phụ lục thay đổi nơi làm việc trước ngày điều chuyển không?", "en": "Would you mind signing the workplace change annex before transfer?", "ipa": "/wʊd ju maɪnd ˈsaɪnɪŋ ðə ˈwɝkˌpleɪs tʃeɪndʒ‿ˈæˌnɛks bɪˈfɔr trænsˈfɝ/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 2, "vi": "Lần này phải ký không xác định thời hạn vì bạn đã ký 2 hợp đồng có thời hạn.", "en": "This must be indefinite, since you've had two fixed-term contracts.", "ipa": "/ðɪs mʌst bi ˌɪnˈdɛfənət, sɪns juv həd tu fɪkst tɝm ˈkɑnˌtrækts/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 2, "vi": "Nếu bạn nghỉ việc khi đang có hợp đồng không xác định thời hạn, bạn cần báo trước 45 ngày.", "en": "Resigning from an indefinite contract requires 45 days' notice.", "ipa": "/rɪˈzaɪnɪŋ frəm‿ən‿ˌɪnˈdɛfənət ˈkɑnˌtrækt riˈkwaɪɚz ˈfɔrɾi faɪv deɪz ˈnoʊɾəs/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 2, "vi": "Rất tiếc, hợp đồng của bạn sẽ hết hạn vào cuối tháng sau và không được gia hạn.", "en": "Unfortunately, your contract expires end of next month, without renewal.", "ipa": "/ənˈfɔrtʃənətli, jɚ ˈkɑnˌtrækt‿ɪkˈspaɪɚz‿ɛnd‿əv nɛkst mʌnθ, wɪˈθaʊt rɪˈnuəl/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 2, "vi": "Tôi sẽ gửi bạn thông báo bằng văn bản cùng danh mục bàn giao.", "en": "I'll send you written notice along with the handover checklist.", "ipa": "/aɪl sɛnd ju ˈrɪɾən ˈnoʊɾɪs‿əˈlɔŋ wɪθ ðə ˈhændoʊvɚ ˈtʃɛklɪst/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 3, "vi": "Để tôi giải thích khác biệt giữa hợp đồng có và không thời hạn.", "en": "Let me explain the differences between fixed-term and indefinite contracts.", "ipa": "/lɛt mi ɪkˈspleɪn ðə ˈdɪfɚənsɪz bɪˈtwin fɪkst tɝm‿ən‿ˌɪnˈdɛfənət ˈkɑnˌtrækts/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 3, "vi": "Để tôi làm rõ: điều khoản bảo mật vẫn áp dụng sau khi nghỉ.", "en": "Let me clarify: confidentiality still applies after you leave.", "ipa": "/lɛt mi ˈklɛrəˌfaɪ: ˌkɑnfəˌdɛnʃiˈæləti stɪl‿əˈplaɪz‿ˈæftɚ ju liv/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 3, "vi": "Theo rà soát, 8 hợp đồng sẽ hết hạn trong tháng sau.", "en": "Based on our review, eight contracts expire next month.", "ipa": "/beɪst‿ɑn‿aʊɚ ˌriˈvju, eɪt ˈkɑnˌtrækts‿ɪkˈspaɪr nɛkst mʌnθ/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 3, "vi": "Tôi đề xuất cập nhật mẫu hợp đồng theo luật mới.", "en": "I recommend updating our contract template to the new law.", "ipa": "/aɪ ˌrɛkəˈmɛnd‿əpˈdeɪɾɪŋ‿aʊɚ ˈkɑnˌtrækt ˈtɛmplət tə ðə nu lɔ/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 3, "vi": "Tôi đề nghị dùng hợp đồng điện tử, đỡ thời gian và in ấn.", "en": "I'd suggest e-contracts to save time and printing costs.", "ipa": "/aɪd səˈdʒɛst‿i ˈkɑnˌtrækts tə seɪv taɪm‿ən ˈprɪntɪŋ kɑsts/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 3, "vi": "Theo tôi, điều khoản không cạnh tranh cần rõ ràng và thực tế hơn.", "en": "In my view, the non-compete clause needs clearer, realistic wording.", "ipa": "/ɪn maɪ vju, ðə nɑn kəmˈpit klɔz nidz ˈklɪrɚ, ˌriəˈlɪstɪk ˈwɝdɪŋ/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 3, "vi": "Tôi hiểu, nhưng luật không cho thử việc 2 lần.", "en": "I see your point, but the law bars two probations.", "ipa": "/aɪ si jɚ pɔɪnt, bət ðə lɔ bɑrz tu proʊˈbeɪʃənz/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 3, "vi": "Có lẽ nên nhờ luật sư rà soát hợp đồng cấp quản lý.", "en": "It might be worth a lawyer reviewing senior contracts.", "ipa": "/ɪt maɪt bi wɝθ‿ə ˈlɔjɚ riˈvjuɪŋ ˈsinjɚ ˈkɑnˌtrækts/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 4, "vi": "Chúng ta chuyển sang hợp đồng sắp hết hạn, vì có 8 trường hợp trong tháng này.", "en": "Next, let's look at the expiring contracts, since there are eight cases this month.", "ipa": "/nɛkst, lɛts lʊk‿ət ði ɪkˈspaɪɚɪŋ ˈkɑntrækts, sɪns ðɛr‿ɚ‿eɪt ˈkeɪsɪz ðɪs mʌnθ/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 4, "vi": "Bạn trình bày các thay đổi trong mẫu hợp đồng mới nhé?", "en": "Could you walk us through the main changes in the new contract template?", "ipa": "/kʊd ju wɔk‿əs θru ðə meɪn ˈtʃeɪndʒɪz‿ɪn ðə nu ˈkɑntrækt ˈtɛmplət/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 4, "vi": "Tôi muốn lưu ý một điểm: một số hợp đồng chưa có phụ lục lương mới.", "en": "I want to flag one issue: several contracts still lack updated salary annexes.", "ipa": "/aɪ wɑnt tə flæɡ wʌn‿ˈɪʃu: ˈsɛvrəl ˈkɑntrækts stɪl læk‿ʌpˈdeɪɾɪd ˈsæləri ˈænɛksɪz/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 4, "vi": "Tôi hiểu quản lý muốn linh hoạt, tuy nhiên hợp đồng phải đúng luật.", "en": "I appreciate that managers want flexibility; however, every contract must follow the law.", "ipa": "/aɪ əˈpriʃiˌeɪt ðæt ˈmænɪdʒɚz wɑnt ˌflɛksəˈbɪləɾi; haʊˈɛvɚ, ˈɛvri ˈkɑntrækt mʌst ˈfɑloʊ ðə lɔ/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 4, "vi": "Hay chúng ta cài nhắc tự động 45 ngày trước khi hết hạn?", "en": "What if we set automatic reminders 45 days before each contract expires?", "ipa": "/wʌɾ‿ɪf wi sɛɾ‿ˌɔɾəˈmæɾɪk rɪˈmaɪndɚz ˌfɔrɾiˈfaɪv deɪz bɪˈfɔr‿itʃ ˈkɑntrækt‿ɪkˈspaɪɚz/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 4, "vi": "Không thể sửa điều khoản này, nhưng có thể thêm phụ lục.", "en": "We're not able to change this clause, but we can add an annex to clarify it.", "ipa": "/wɪr nɑɾ‿ˈeɪbəl tə tʃeɪndʒ ðɪs klɔz, bət wi kən‿æd‿ən‿ˈænɛks tə ˈklɛrəˌfaɪ ɪt/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 4, "vi": "Tóm lại, hợp đồng sắp hết hạn cần quyết định trước ngày 15.", "en": "So, to recap, every expiring contract needs a renewal decision by the 15th.", "ipa": "/soʊ, tə ˈriˌkæp, ˈɛvri ɪkˈspaɪɚɪŋ ˈkɑntrækt nidz‿ə rɪˈnuəl dɪˈsɪʒən baɪ ðə ˌfɪfˈtinθ/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 4, "vi": "Bước tiếp theo: quản lý gửi quyết định gia hạn cho HR trước thứ Sáu.", "en": "Next step: managers will send their renewal decisions to HR by Friday.", "ipa": "/nɛkst stɛp: ˈmænɪdʒɚz wɪl sɛnd ðɛr rɪˈnuəl dɪˈsɪʒənz tu ˌeɪtʃˈɑr baɪ ˈfraɪdeɪ/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 5, "vi": "Thật lòng, nhiều mẫu hợp đồng đã cũ, không còn đúng Bộ luật Lao động hiện hành.", "en": "If I'm being honest, many of our contract templates are outdated and don't reflect the current Labor Code.", "ipa": "/ɪf‿aɪm ˈbiɪŋ‿ˈɑnəst, ˈmɛni əv‿ˈaʊɚ ˈkɑntrækt ˈtɛmpləts‿ɚ‿ˌaʊtˈdeɪɾɪd‿ən doʊnt rɪˈflɛkt ðə ˈkɝənt ˈleɪbɚ koʊd/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 5, "vi": "Theo kinh nghiệm, tranh chấp hợp đồng thường bắt đầu từ mô tả công việc, điều khoản mơ hồ.", "en": "From my experience, most contract disputes start with vague job descriptions and unclear terms.", "ipa": "/frʌm maɪ ɪkˈspɪriəns, moʊst ˈkɑntrækt dɪˈspjuts stɑrt wɪθ veɪɡ dʒɑb dɪˈskrɪpʃənz‿ən‿ʌnˈklɪr tɝmz/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 5, "vi": "Suy cho cùng, hợp đồng rõ ràng bảo vệ cả công ty lẫn nhân viên.", "en": "At the end of the day, a clear contract protects both the company and the employee.", "ipa": "/æt ði ɛnd‿əv ðə deɪ, ə klɪr ˈkɑntrækt prəˈtɛkts boʊθ ðə ˈkʌmpəni ən ði ɪmˈplɔɪi/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 5, "vi": "Điều tôi lo là hợp đồng hết hạn tự thành không thời hạn mà ta không duyệt.", "en": "My main worry is that expired contracts automatically become indefinite ones without our approval.", "ipa": "/maɪ meɪn ˈwɝi ɪz ðæɾ‿ɪkˈspaɪɚd ˈkɑntrækts‿ˌɔɾəˈmæɾɪkli bɪˈkʌm‿ɪnˈdɛfənət wʌnz wɪˈθaʊɾ‿ˈaʊɚ‿əˈpruvəl/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 5, "vi": "Nếu không theo dõi ngày hết hạn, chúng ta sẽ tiếp tục gia hạn trễ.", "en": "If we don't track expiry dates, we'll keep renewing contracts after they've already expired.", "ipa": "/ɪf wi doʊnt træk‿ɪkˈspaɪri deɪts, wil kip rɪˈnuɪŋ ˈkɑntrækts‿ˈæftɚ ðeɪv‿ɔlˈrɛdi ɪkˈspaɪɚd/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 5, "vi": "Tôi e ngại điều khoản không cạnh tranh 2 năm, vì ở Việt Nam khó thực thi.", "en": "I'm not comfortable with a two-year non-compete clause, because it's hard to enforce in Vietnam.", "ipa": "/aɪm nɑt ˈkʌmftɚbəl wɪθ‿ə tu jɪr nɑn kəmˈpit klɔz, bɪˈkɔz‿ɪts hɑrd tu ɪnˈfɔrs‿ɪn ˌviɛtˈnɑm/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 5, "vi": "Điều tôi lo nhất là vài quản lý hứa những điều không có trong hợp đồng.", "en": "My biggest concern is that some managers promise terms that aren't written in the contract.", "ipa": "/maɪ ˈbɪɡɪst kənˈsɝn‿ɪz ðæt səm ˈmænɪdʒɚz ˈprɑmɪs tɝmz ðæɾ‿ɑrnt ˈrɪɾən‿ɪn ðə ˈkɑntrækt/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 5, "vi": "Tôi đề xuất nhờ luật sư rà soát toàn bộ mẫu hợp đồng mỗi năm một lần.", "en": "My recommendation is to have a lawyer review all contract templates once a year.", "ipa": "/maɪ ˌrɛkəmɛnˈdeɪʃən‿ɪz tə hæv‿ə ˈlɔjɚ rɪˈvju ɔl ˈkɑntrækt ˈtɛmpləts wʌns‿ə jɪr/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 6, "vi": "Giấy trắng mực đen.", "en": "Put it in writing.", "ipa": "/pʊɾ‿ɪɾ‿ɪn ˈraɪɾɪŋ/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 6, "vi": "Hợp đồng rõ ràng giữ mối quan hệ tốt đẹp.", "en": "Clear contracts keep good relationships.", "ipa": "/klɪr ˈkɑntrækts kip ɡʊd rɪˈleɪʃənʃɪps/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 6, "vi": "22% hợp đồng sắp hết hạn chưa có quyết định gia hạn, có trường hợp đã quá 30 ngày.", "en": "Twenty-two percent of expiring contracts have no renewal decision, and some are already past 30 days.", "ipa": "/ˈtwɛntiˌtu pɚˈsɛnt‿əv‿ɪkˈspaɪɚɪŋ ˈkɑntrækts hæv noʊ rɪˈnuəl dɪˈsɪʒən, ən səm‿ɚ‿ɔlˈrɛdi pæst ˈθɝɾi deɪz/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 6, "vi": "Hợp đồng quá 30 ngày không ký mới sẽ thành không xác định thời hạn, làm giảm tính linh hoạt nhân sự.", "en": "Contracts left unsigned past 30 days become indefinite, reducing our workforce flexibility.", "ipa": "/ˈkɑntrækts lɛft‿ənˈsaɪnd pæst ˈθɝɾi deɪz bɪˈkʌm‿ɪnˈdɛfənət, rəˈdusɪŋ‿ˈaʊɚ ˈwɝkˌfɔrs ˌflɛksəˈbɪləɾi/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 6, "vi": "Hợp đồng tốt bảo vệ cả hai bên.", "en": "A good contract protects both sides.", "ipa": "/ə ɡʊd ˈkɑntrækt prəˈtɛkts boʊθ saɪdz/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 6, "vi": "Các công ty quản lý tốt cảnh báo từ 60 ngày trước hạn và gần như không có hợp đồng quá hạn.", "en": "Well-run companies trigger expiry alerts at 60 days and have almost no overdue contracts.", "ipa": "/wɛl rʌn ˈkʌmpəniz ˈtrɪɡɚ‿ɪkˈspaɪri əˈlɝts‿ət ˈsɪksti deɪz‿ən hæv‿ˈɔlmoʊst noʊ ˈoʊvɚˈdu ˈkɑntrækts/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 6, "vi": "Tôi đề xuất cảnh báo tự động trước 60 ngày và yêu cầu quản lý phản hồi trong 10 ngày.", "en": "I propose automatic 60-day alerts, with managers required to respond within 10 days.", "ipa": "/aɪ prəˈpoʊz‿ˌɔɾəˈmæɾɪk ˈsɪksti deɪ əˈlɝts, wɪθ ˈmænɪdʒɚz rɪˈkwaɪɚd tə rɪˈspɑnd wɪˈθɪn tɛn deɪz/"}, {"topicRaw": "16-Labor Contracts", "topicName": "Labor Contracts", "topicOrder": 16, "stage": 6, "vi": "Mục tiêu là không còn hợp đồng quá hạn và 100% hồ sơ được số hóa trước quý 3.", "en": "We're targeting zero overdue contracts and fully digitized files by Q3.", "ipa": "/wɪr ˈtɑrɡəɾɪŋ ˈzɪroʊ ˈoʊvɚˈdu ˈkɑntrækts‿ən ˈfʊli ˈdɪdʒəˌtaɪzd faɪlz baɪ kju θri/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 1, "vi": "Nội quy có hiệu lực sau 15 ngày kể từ khi nộp hồ sơ đăng ký.", "en": "Internal rules take effect 15 days after registration filing.", "ipa": "/ˌɪnˈtɝnəl rulz teɪk‿ɪˈfɛkt fɪfˈtin deɪz‿ˈæftɚ ˌrɛdʒɪˈstreɪʃən ˈfaɪlɪŋ/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 1, "vi": "Đoàn thanh tra lao động sẽ đến công ty vào tuần sau.", "en": "A labor inspection team will visit next week.", "ipa": "/ə ˈleɪbɚ ˌɪnˈspɛkʃən tim wɪl ˈvɪzɪt nɛkst wik/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 1, "vi": "Chúng ta đã nộp báo cáo sử dụng lao động 6 tháng cuối năm chưa?", "en": "Have we filed the second-half labor usage report yet?", "ipa": "/hæv wi faɪld ðə ˈsɛkənd hæf ˈ
