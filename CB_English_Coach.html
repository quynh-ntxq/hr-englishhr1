n: HR receives, legal joins, documents are checked before release.", "ipa": "/ɑn‿ˌɪnˈspɛkʃən: eɪtʃ ɑr rəˈsivz, ˈliɡəl dʒɔɪnz, ˈdɑkjəmənts‿ɚ tʃɛkt bɪˈfɔr riˈlis/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 2, "vi": "Bạn có thể rà soát toàn bộ hợp đồng ngắn hạn đang sử dụng không?", "en": "Could you review all the short-term contracts we're currently using?", "ipa": "/kʊd ju rɪˈvju ɔl ðə ˌʃɔrtˈtɝm ˈkɑntrækts wɪr ˈkɝəntli ˈjuzɪŋ/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 2, "vi": "Bạn có phiền giữ toàn bộ hồ sơ gốc ở một nơi đến khi thanh tra kết thúc không?", "en": "Would you mind keeping all original files together until inspection ends?", "ipa": "/wʊd ju maɪnd ˈkipɪŋ‿ɔl‿ɚˈɪdʒənəl faɪlz təˈɡɛðɚ ənˈtɪl‿ˌɪnˈspɛkʃən‿ɛndz/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 2, "vi": "Chúng ta bị nhắc nhở vì chưa tổ chức đối thoại định kỳ tại nơi làm việc.", "en": "We received a warning because we hadn't held periodic workplace dialogues.", "ipa": "/wi rɪˈsivd‿ə ˈwɔrnɪŋ bɪˈkɔz wi ˈhædənt hɛld ˌpɪriˈɑdɪk ˈwɝkˌpleɪs ˈdaɪəˌlɔɡz/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 2, "vi": "Nếu không khắc phục vi phạm đúng hạn, công ty có thể bị phạt và bị truy nộp.", "en": "Unfixed violations may bring fines and back payments.", "ipa": "/ʌnˈfɪkst vaɪəˈleɪʃənz meɪ brɪŋ faɪnz‿ən bæk ˈpeɪmənts/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 2, "vi": "Rất tiếc, đoàn thanh tra kết luận chúng ta đóng bảo hiểm thấp hơn mức quy định.", "en": "Unfortunately, inspectors found our insurance contributions below the required level.", "ipa": "/ənˈfɔrtʃənətli, ˌɪnˈspɛktɚz faʊnd‿aʊɚ ˌɪnˈʃʊrəns ˌkɑntrəˈbjuʃənz bɪˈloʊ ðə riˈkwaɪɚd ˈlɛvəl/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 2, "vi": "Tôi sẽ theo dõi việc khắc phục và báo cáo đoàn thanh tra đúng hạn.", "en": "I'll track corrective actions and report back to inspectors on time.", "ipa": "/aɪl træk kɚˈɛktɪv‿ˈækʃənz‿ən riˈpɔrt bæk tə ˌɪnˈspɛktɚz‿ɑn taɪm/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 3, "vi": "Để tôi giải thích các thay đổi chính của luật lao động năm nay.", "en": "Let me explain this year's main labor law changes.", "ipa": "/lɛt mi ɪkˈspleɪn ðɪs jɪrz meɪn ˈleɪbɚ lɔ ˈtʃeɪndʒəz/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 3, "vi": "Để tôi làm rõ: nội quy chỉ có hiệu lực sau khi đăng ký.", "en": "Let me clarify: internal rules take effect only once registered.", "ipa": "/lɛt mi ˈklɛrəˌfaɪ: ˌɪnˈtɝnəl rulz teɪk‿ɪˈfɛkt‿ˈoʊnli wʌns ˈrɛdʒɪstɚd/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 3, "vi": "Theo kết quả kiểm tra nội bộ, có 3 điểm cần khắc phục.", "en": "Based on the internal audit, three issues need fixing.", "ipa": "/beɪst‿ɑn ði ˌɪnˈtɝnəl‿ˈɔdɪt, θri ˈɪʃuz nid ˈfɪksɪŋ/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 3, "vi": "Tôi đề xuất cập nhật nội quy theo Bộ luật Lao động mới.", "en": "I recommend updating internal rules to the new Labor Code.", "ipa": "/aɪ ˌrɛkəˈmɛnd‿əpˈdeɪɾɪŋ‿ˌɪnˈtɝnəl rulz tə ðə nu ˈleɪbɚ koʊd/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 3, "vi": "Tôi đề nghị bảng kiểm tuân thủ đơn giản hằng tháng cho chi nhánh.", "en": "I'd suggest a simple monthly compliance checklist for branches.", "ipa": "/aɪd səˈdʒɛst‿ə ˈsɪmpəl ˈmʌnθli kəmˈplaɪəns ˈtʃɛˌklɪst fɚ ˈbræntʃəz/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 3, "vi": "Theo tôi, tuân thủ là trách nhiệm của mọi quản lý, không chỉ HR.", "en": "In my view, compliance is every manager's job, not HR's.", "ipa": "/ɪn maɪ vju, kəmˈplaɪəns‿ɪz‿ˈɛvri ˈmænɪdʒɚz dʒɑb, nɑt‿ˈeɪˈtʃɑrz/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 3, "vi": "Tôi hiểu ý bạn, nhưng cách làm đó rủi ro về pháp lý.", "en": "I see your point, but that approach is legally risky.", "ipa": "/aɪ si jɚ pɔɪnt, bət ðət‿əˈproʊtʃ‿ɪz ˈliɡəli ˈrɪski/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 3, "vi": "Có lẽ nên thuê đơn vị độc lập rà soát mỗi năm.", "en": "It might be worth hiring an independent reviewer yearly.", "ipa": "/ɪt maɪt bi wɝθ ˈhaɪrɪŋ‿ən‿ˌɪndɪˈpɛndənt riˈvjuɚ ˈjɪrli/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 4, "vi": "Chúng ta chuyển sang kết quả kiểm tra, vì thanh tra đến tháng sau.", "en": "Let's move on to the audit results, since labor inspectors are visiting next month.", "ipa": "/lɛts muv‿ɑn tə ði ˈɔdɪt rɪˈzʌlts, sɪns ˈleɪbɚ‿ɪnˈspɛktɚz‿ɚ ˈvɪzɪɾɪŋ nɛkst mʌnθ/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 4, "vi": "Bạn trình bày 3 điểm chưa tuân thủ và cách khắc phục nhé?", "en": "Can you take us through the three gaps and how we plan to fix them?", "ipa": "/kæn ju teɪk‿əs θru ðə θri ɡæps‿ən haʊ wi plæn tə fɪks ðɛm/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 4, "vi": "Có một điều tôi lo: 15 nhân viên chưa có hợp đồng bằng văn bản.", "en": "One thing worries me: 15 employees still don't have written contracts.", "ipa": "/wʌn θɪŋ ˈwɝiz mi: ˌfɪfˈtin‿ɪmˈplɔɪiz stɪl doʊnt hæv ˈrɪɾən ˈkɑntrækts/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 4, "vi": "Tôi hiểu các phòng đang bận, tuy nhiên hạn khắc phục là bắt buộc.", "en": "I understand departments are busy; however, the correction deadline is not optional.", "ipa": "/aɪ ˌʌndɚˈstænd dɪˈpɑrtmənts‿ɚ ˈbɪzi; haʊˈɛvɚ, ðə kəˈrɛkʃən ˈdɛdˌlaɪn‿ɪz nɑɾ‿ˈɑpʃənəl/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 4, "vi": "Hay chúng ta cử 1 đầu mối tuân thủ ở mỗi phòng ban để hỗ trợ HR?", "en": "What if each department appointed one compliance contact to support HR?", "ipa": "/wʌɾ‿ɪf‿itʃ dɪˈpɑrtmənt‿əˈpɔɪntɪd wʌn kəmˈplaɪəns ˈkɑntækt tə səˈpɔrɾ‿ˌeɪtʃˈɑr/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 4, "vi": "Không thể sửa hết trong tuần, nhưng có thể ưu tiên rủi ro cao trước.", "en": "We can't fix everything this week, but we can handle the high-risk items first.", "ipa": "/wi kænt fɪks‿ˈɛvriˌθɪŋ ðɪs wik, bət wi kən ˈhændəl ðə haɪ rɪsk‿ˈaɪɾəmz fɝst/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 4, "vi": "Tóm lại, cả 3 điểm phải được khắc phục trước khi thanh tra.", "en": "To summarize, all three gaps must be fixed before the inspection date.", "ipa": "/tu ˈsʌməˌraɪz, ɔl θri ɡæps mʌst bi fɪkst bɪˈfɔr ði ɪnˈspɛkʃən deɪt/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 4, "vi": "Bước tiếp theo: pháp chế rà soát hồ sơ và báo cáo trước ngày 20.", "en": "As a next step, legal will review the files and report back by the 20th.", "ipa": "/æz‿ə nɛkst stɛp, ˈliɡəl wɪl rɪˈvju ðə faɪlz‿ən rɪˈpɔrt bæk baɪ ðə ˈtwɛntiəθ/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 5, "vi": "Thật lòng, chúng ta chỉ lo tuân thủ khi sắp thanh tra, vậy là quá muộn.", "en": "Honestly, we only take compliance seriously when an inspection is announced, and that's too late.", "ipa": "/ˈɑnəstli, wi ˈoʊnli teɪk kəmˈplaɪəns ˈsɪriəsli wɛn‿ən‿ɪnˈspɛkʃən‿ɪz‿əˈnaʊnst, ən ðæts tu leɪt/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 5, "vi": "Theo kinh nghiệm, thiếu sót giấy tờ nhỏ bị phạt nhiều hơn vi phạm lớn.", "en": "In my experience, small paperwork gaps cause more fines than serious violations do.", "ipa": "/ɪn maɪ ɪkˈspɪriəns, smɔl ˈpeɪpɚˌwɝk ɡæps kɔz mɔr faɪnz ðən ˈsɪriəs ˌvaɪəˈleɪʃənz du/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 5, "vi": "Điều quan trọng là tuân thủ luôn rẻ hơn tiền phạt hay thiệt hại uy tín.", "en": "What really matters is that compliance is cheaper than any fine or damage to our reputation.", "ipa": "/wʌt ˈriəli ˈmæɾɚz‿ɪz ðæt kəmˈplaɪəns‿ɪz ˈtʃipɚ ðən‿ˈɛni faɪn‿ɚ ˈdæmɪdʒ tu ˈaʊɚ ˌrɛpjəˈteɪʃən/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 5, "vi": "Rủi ro lớn nhất là luật mới có hiệu lực khi quy chế nội bộ chưa cập nhật.", "en": "The main risk is that new regulations take effect before our internal policies are updated.", "ipa": "/ðə meɪn rɪsk‿ɪz ðæt nu ˌrɛɡjəˈleɪʃənz teɪk‿ɪˈfɛkt bɪˈfɔr‿ˈaʊɚ‿ɪnˈtɝnəl ˈpɑləsiz‿ɚ‿ʌpˈdeɪɾɪd/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 5, "vi": "Nếu chưa đăng ký nội quy mới, không thể dùng nó để xử lý kỷ luật.", "en": "Unless we register the updated work rules, we can't legally use them in disciplinary cases.", "ipa": "/ənˈlɛs wi ˈrɛdʒɪstɚ ði ʌpˈdeɪɾɪd wɝk rulz, wi kænt ˈliɡəli juz ðəm‿ɪn ˈdɪsəpləˌnɛri ˈkeɪsɪz/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 5, "vi": "Tôi phản bác bỏ qua bước rà soát pháp lý, kể cả khi hạn rất gấp.", "en": "I'd challenge skipping the legal review, even if the deadline is very tight.", "ipa": "/aɪd ˈtʃælɪndʒ ˈskɪpɪŋ ðə ˈliɡəl rɪˈvju, ˈivən‿ɪf ðə ˈdɛdˌlaɪn‿ɪz ˈvɛri taɪt/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 5, "vi": "Điều tôi lo nhất là mỗi chi nhánh hiểu cùng một quy định theo cách khác nhau.", "en": "What concerns me most is that each branch interprets the same regulation in a different way.", "ipa": "/wʌt kənˈsɝnz mi moʊst‿ɪz ðæɾ‿itʃ bræntʃ‿ɪnˈtɝprɪts ðə seɪm ˌrɛɡjəˈleɪʃən‿ɪn‿ə ˈdɪfɚənt weɪ/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 5, "vi": "Tôi đề xuất bảng kiểm tuân thủ hằng quý, mỗi chi nhánh tự điền và ký.", "en": "What I'd propose is a quarterly compliance checklist that every branch completes and signs.", "ipa": "/wʌɾ‿aɪd prəˈpoʊz‿ɪz‿ə ˈkwɔrɾɚli kəmˈplaɪəns ˈtʃɛklɪst ðæɾ‿ˈɛvri bræntʃ kəmˈplits‿ən saɪnz/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 6, "vi": "Biết luật để không phạm luật.", "en": "Know the rules to stay within them.", "ipa": "/noʊ ðə rulz tə steɪ wɪˈθɪn ðɛm/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 6, "vi": "Tuân thủ rẻ hơn khắc phục.", "en": "Compliance costs less than correction.", "ipa": "/kəmˈplaɪəns kɔsts lɛs ðən kəˈrɛkʃən/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 6, "vi": "Đợt tự kiểm tra phát hiện 11 điểm chưa tuân thủ, trong đó 4 điểm có mức phạt đáng kể.", "en": "Our self-audit found 11 compliance gaps, four of which carry significant penalties.", "ipa": "/ˈaʊɚ sɛlf‿ˈɔdɪt faʊnd‿ɪˈlɛvən kəmˈplaɪəns ɡæps, fɔr‿əv wɪtʃ ˈkæri səɡˈnɪfɪkənt ˈpɛnəltiz/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 6, "vi": "Mức phạt với tổ chức gấp đôi cá nhân, nên mỗi vi phạm có thể lên đến hàng trăm triệu đồng.", "en": "Fines for organizations are double those for individuals, so each violation could cost hundreds of millions of dong.", "ipa": "/faɪnz fɚ‿ˌɔrɡənəˈzeɪʃənz‿ɚ ˈdʌbəl ðoʊz fɚ‿ˌɪndəˈvɪdʒəwəlz, soʊ itʃ ˌvaɪəˈleɪʃən kʊd kɔst ˈhʌndrədz‿əv ˈmɪljənz‿əv dɔŋ/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 6, "vi": "Làm đúng khi không ai nhìn mới là chính trực.", "en": "Integrity is doing right when no one is watching.", "ipa": "/ɪnˈtɛɡrəɾi ɪz ˈduɪŋ raɪt wɛn noʊ wʌn‿ɪz ˈwɑtʃɪŋ/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 6, "vi": "Các doanh nghiệp FDI trong khu công nghiệp của ta tự kiểm tra 2 lần mỗi năm và hiếm khi bị phạt.", "en": "FDI companies in our industrial park self-audit twice a year and are rarely fined.", "ipa": "/ˌɛfdiˈaɪ ˈkʌmpəniz‿ɪn‿ˈaʊɚ‿ˌɪnˈdʌstriəl pɑrk sɛlf‿ˈɔdɪt twaɪs‿ə jɪr‿ən‿ɚ ˈrɛrli faɪnd/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 6, "vi": "Tôi đề xuất khắc phục 4 điểm rủi ro cao trong 30 ngày, chi phí dưới 50 triệu.", "en": "I propose fixing the four high-risk gaps within 30 days, at a cost under 50 million VND.", "ipa": "/aɪ prəˈpoʊz ˈfɪksɪŋ ðə fɔr haɪ rɪsk ɡæps wɪˈθɪn ˈθɝɾi deɪz, əɾ‿ə kɔst‿ˈʌndɚ ˈfɪfti ˈmɪljən ˌviɛnˈdi/"}, {"topicRaw": "17-Compliance", "topicName": "Compliance", "topicOrder": 17, "stage": 6, "vi": "Mục tiêu là không có kết luận vi phạm nào trong đợt thanh tra năm tới.", "en": "Our goal is a clean result, with zero findings, at next year's inspection.", "ipa": "/ˈaʊɚ ɡoʊl‿ɪz‿ə klin rɪˈzʌlt, wɪθ ˈzɪroʊ ˈfaɪndɪŋz, ət nɛkst jɪrz‿ɪnˈspɛkʃən/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 1, "vi": "Thời hiệu xử lý kỷ luật là 6 tháng kể từ ngày xảy ra vi phạm.", "en": "Disciplinary action expires six months after the violation.", "ipa": "/ˈdɪsəpləˌnɛri ˈækʃən‿ɪkˈspaɪɚz sɪks mʌnθs‿ˈæftɚ ðə vaɪəˈleɪʃən/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 1, "vi": "Có 4 hình thức: khiển trách, kéo dài thời hạn nâng lương, cách chức và sa thải.", "en": "Four measures: reprimand, delayed raise, demotion, or dismissal.", "ipa": "/fɔr ˈmɛʒɚz: ˈrɛprəˌmænd, dɪˈleɪd reɪz, dɪˈmoʊʃən, ɚ dɪˈsmɪsəl/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 1, "vi": "Bạn đã thu thập đủ bằng chứng và lập biên bản vi phạm chưa?", "en": "Have you gathered evidence and documented the violation?", "ipa": "/həv ju ˈɡæðɚd‿ˈɛvədəns‿ən ˈdɑkjəˌmɛntəd ðə vaɪəˈleɪʃən/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 1, "vi": "Nhân viên này có đại diện công đoàn cần mời không?", "en": "Does this employee have a union rep to invite?", "ipa": "/dəz ðɪs‿ɛmˈplɔɪi həv‿ə ˈjunjən rɛp tə ˌɪnˈvaɪt/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 1, "vi": "Vui lòng lập biên bản ngay khi xảy ra sự việc, có chữ ký người chứng kiến.", "en": "Please record the incident immediately, with a witness signature.", "ipa": "/pliz ˈrɛkɚd ði ˈɪnsɪdənt‿ɪˈmidiətli, wɪθ‿ə ˈwɪtnəs ˈsɪɡnətʃɚ/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 1, "vi": "Vui lòng không trừ lương thay cho kỷ luật, vì luật cấm việc này.", "en": "Don't cut pay as punishment; the law prohibits it.", "ipa": "/doʊnt kʌt peɪ əz ˈpʌnɪʃmənt; ðə lɔ proʊˈhɪbəts‿ɪt/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 1, "vi": "Xin lỗi, thông báo họp kỷ luật gửi trễ nên chúng ta phải dời lịch.", "en": "Sorry, the notice was late; we must reschedule.", "ipa": "/ˈsɑri, ðə ˈnoʊɾəs wəz leɪt; wi mʌst riˈskɛdʒul/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 1, "vi": "Quyết định sẽ được gửi cho nhân viên và công đoàn sau buổi họp.", "en": "Decision goes to the employee and union afterward.", "ipa": "/dɪˈsɪʒən ɡoʊz tə ði ɛmˈplɔɪi ən ˈjunjən‿ˈæftɚwɚd/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 2, "vi": "Theo luật, không được xử lý kỷ luật lao động nữ trong thời gian mang thai.", "en": "By law, an employee can't be disciplined while she's pregnant.", "ipa": "/baɪ lɔ, ən‿ɪmˈplɔɪi kænt bi ˈdɪsəplənd waɪl ʃiz ˈprɛɡnənt/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 2, "vi": "Quy trình gồm lập biên bản, thông báo, họp xử lý có người đại diện, rồi ra quyết định.", "en": "Process: record the breach, give notice, hold hearing with representation, decide.", "ipa": "/ˈprɑˌsɛs: rəˈkɔrd ðə britʃ, ɡɪv ˈnoʊɾəs, hoʊld ˈhirɪŋ wɪθ ˌrɛprəzɛnˈteɪʃən, ˌdɪˈsaɪd/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 2, "vi": "Bạn có thể xác nhận trước đây nhân viên này đã bị nhắc nhở bằng văn bản chưa?", "en": "Could you confirm whether this employee received a written reminder before?", "ipa": "/kʊd ju kənˈfɝm ˈwɛðɚ ðɪs‿ɪmˈplɔɪi rɪˈsivd‿ə ˈrɪɾən rɪˈmaɪndɚ bɪˈfɔr/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 2, "vi": "Bạn có phiền tham dự buổi họp với vai trò người chứng kiến không?", "en": "Would you mind attending the hearing as a witness?", "ipa": "/wʊd ju maɪnd‿əˈtɛndɪŋ ðə ˈhɪrɪŋ‿əz‿ə ˈwɪtnəs/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 2, "vi": "Chúng ta phải hoãn họp vì nhân viên đang nghỉ ốm có xác nhận của cơ sở y tế.", "en": "We must postpone the hearing; the employee has certified sick leave.", "ipa": "/wi mʌst poʊstˈpoʊn ðə ˈhirɪŋ; ði ɛmˈplɔɪi həz ˈsɝɾəˌfaɪd sɪk liv/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 2, "vi": "Nếu vắng mặt sau 3 lần thông báo hợp lệ, buổi họp vẫn có thể tiến hành.", "en": "If absent after three valid notices, the hearing can proceed.", "ipa": "/ɪf‿ˈæbsənt‿ˈæftɚ θri ˈvælɪd ˈnoʊɾəsəz, ðə ˈhirɪŋ kən prəˈsid/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 2, "vi": "Rất tiếc, hành vi này thuộc trường hợp sa thải theo nội quy đã đăng ký.", "en": "Unfortunately, this conduct qualifies for dismissal under our registered work rules.", "ipa": "/ʌnˈfɔrtʃənətli, ðɪs ˈkɑndəkt ˈkwɑləˌfaɪz fɚ dɪsˈmɪsəl‿ˈʌndɚ‿ˈaʊɚ ˈrɛdʒɪstɚd wɝk rulz/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 2, "vi": "Tôi sẽ lưu toàn bộ hồ sơ và theo dõi thời điểm được xóa kỷ luật.", "en": "I'll file all records and track when discipline can be cleared.", "ipa": "/aɪl faɪl‿ɔl rəˈkɔrdz‿ən træk wɛn ˈdɪsəplən kən bi klɪrd/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 3, "vi": "Để tôi giải thích quy trình xử lý kỷ luật theo luật lao động.", "en": "Let me explain the legal disciplinary process under labor law.", "ipa": "/lɛt mi ɪkˈspleɪn ðə ˈliɡəl ˈdɪsəpləˌnɛri ˈprɑˌsɛs‿ˈʌndɚ ˈleɪbɚ lɔ/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 3, "vi": "Để tôi làm rõ: thư nhắc nhở chưa phải là hình thức kỷ luật.", "en": "Let me clarify: a written reminder isn't formal discipline.", "ipa": "/lɛt mi ˈklɛrəˌfaɪ: ə ˈrɪɾən riˈmaɪndɚ ˈɪzənt ˈfɔrməl ˈdɪsəplən/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 3, "vi": "Theo hồ sơ, đây là lần vi phạm thứ 3 trong 6 tháng.", "en": "Based on records, it's the third violation in six months.", "ipa": "/beɪst‿ɑn rəˈkɔrdz, ɪts ðə θɝd vaɪəˈleɪʃən‿ɪn sɪks mʌnθs/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 3, "vi": "Tôi đề xuất ghi nhận bằng văn bản trước khi xử lý kỷ luật.", "en": "I recommend documenting each incident in writing before formal action.", "ipa": "/aɪ ˌrɛkəˈmɛnd ˈdɑkjəməntɪŋ‿itʃ‿ˈɪnsədənt‿ɪn ˈraɪɾɪŋ bɪˈfɔr ˈfɔrməl‿ˈækʃən/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 3, "vi": "Tôi đề nghị cho anh ấy 30 ngày cải thiện trước khi leo thang.", "en": "I'd suggest giving him 30 days to improve before escalating.", "ipa": "/aɪd səˈdʒɛst ˈɡɪvɪŋ hɪm ˈθɝɾi deɪz tə ˌɪmˈpruv bɪˈfɔr‿ˈɛskəˌleɪɾɪŋ/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 3, "vi": "Theo tôi, quản lý nên nói sớm, đừng đợi nghiêm trọng.", "en": "In my view, managers should address issues before they're serious.", "ipa": "/ɪn maɪ vju, ˈmænədʒɚz ʃʊd‿ˈæˌdrɛs‿ˈɪʃuz bɪˈfɔr ðɛr ˈsɪriəs/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 3, "vi": "Tôi hiểu, nhưng không thể sa thải khi thiếu bằng chứng.", "en": "I see, but we can't dismiss anyone without solid evidence.", "ipa": "/aɪ si, bət wi kænt dɪˈsmɪs‿ˈɛniˌwʌn wɪˈθaʊt ˈsɑləd‿ˈɛvədəns/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 3, "vi": "Có lẽ nên nhờ pháp chế xem hồ sơ trước.", "en": "It might be worth having legal review the file first.", "ipa": "/ɪt maɪt bi wɝθ ˈhævɪŋ ˈliɡəl ˌriˈvju ðə faɪl fɝst/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 4, "vi": "Chúng ta chuyển sang vụ việc ở kho, vì thời hiệu xử lý sắp hết.", "en": "Let's turn to the warehouse case, since the legal time limit is running out.", "ipa": "/lɛts tɝn tə ðə ˈwɛrˌhaʊs keɪs, sɪns ðə ˈliɡəl taɪm ˈlɪmɪɾ‿ɪz ˈrʌnɪŋ‿aʊt/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 4, "vi": "Bạn trình bày diễn biến sự việc và bằng chứng đã có nhé?", "en": "Would you mind going over what happened and the evidence we have so far?", "ipa": "/wʊd ju maɪnd ˈɡoʊɪŋ‿ˈoʊvɚ wʌt ˈhæpənd‿ən ði ˈɛvɪdəns wi hæv soʊ fɑr/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 4, "vi": "Tôi muốn nêu lo ngại: chưa có biên bản lần vi phạm đầu.", "en": "I'd like to raise a concern: we don't have minutes from the first incident.", "ipa": "/aɪd laɪk tə reɪz‿ə kənˈsɝn: wi doʊnt hæv ˈmɪnəts frəm ðə fɝst‿ˈɪnsɪdənt/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 4, "vi": "Tôi hiểu quản lý muốn sa thải ngay, tuy nhiên phải đúng quy trình.", "en": "I get that the manager wants a dismissal; however, we must follow the process.", "ipa": "/aɪ ɡɛt ðæt ðə ˈmænɪdʒɚ wɑnts‿ə dɪsˈmɪsəl; haʊˈɛvɚ, wi mʌst ˈfɑloʊ ðə ˈprɑsɛs/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 4, "vi": "Hay chúng ta áp dụng kéo dài thời hạn nâng lương 6 tháng?", "en": "Would it help if we chose a six-month delay to his next pay raise instead?", "ipa": "/wʊd‿ɪt hɛlp‿ɪf wi tʃoʊz‿ə sɪks mʌnθ dɪˈleɪ tə hɪz nɛkst peɪ reɪz‿ɪnˈstɛd/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 4, "vi": "Không thể sa thải lần này, nhưng có thể khiển trách bằng văn bản.", "en": "We can't dismiss him this time, but we can issue a formal written reprimand.", "ipa": "/wi kænt dɪsˈmɪs hɪm ðɪs taɪm, bət wi kən‿ˈɪʃu ə ˈfɔrməl ˈrɪɾən ˈrɛprəˌmænd/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 4, "vi": "Tóm lại, buổi họp kỷ luật sẽ diễn ra có mặt công đoàn.", "en": "To wrap up, the disciplinary hearing will go ahead with the union present.", "ipa": "/tu ræp‿ʌp, ðə ˈdɪsəpləˌnɛri ˈhɪrɪŋ wɪl ɡoʊ əˈhɛd wɪθ ðə ˈjunjən ˈprɛzənt/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 4, "vi": "Sau buổi họp, HR gửi thông báo họp trước ít nhất 5 ngày làm việc.", "en": "After this meeting, HR will send him the meeting notice at least five working days ahead.", "ipa": "/ˈæftɚ ðɪs ˈmiɾɪŋ, ˌeɪtʃˈɑr wɪl sɛnd hɪm ðə ˈmiɾɪŋ ˈnoʊɾɪs‿ət list faɪv ˈwɝkɪŋ deɪz‿əˈhɛd/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 5, "vi": "Thật lòng, nhiều quản lý né nói chuyện khó cho đến khi quá muộn.", "en": "To be frank, many managers avoid difficult conversations until the problem is too big to fix.", "ipa": "/tu bi fræŋk, ˈmɛni ˈmænɪdʒɚz‿əˈvɔɪd ˈdɪfɪkəlt ˌkɑnvɚˈseɪʃənz‿ənˈtɪl ðə ˈprɑbləm‿ɪz tu bɪɡ tə fɪks/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 5, "vi": "Theo kinh nghiệm, phần lớn tranh chấp kỷ luật thua vì sai quy trình, không phải sự việc.", "en": "What I've seen is that most disciplinary disputes are lost because of procedural mistakes, not facts.", "ipa": "/wʌɾ‿aɪv sin‿ɪz ðæt moʊst ˈdɪsəpləˌnɛri dɪˈspjuts‿ɚ lɔst bɪˈkɔz‿əv prəˈsidʒɚəl mɪˈsteɪks, nɑt fækts/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 5, "vi": "Mấu chốt là kỷ luật phải công bằng, nhất quán và có hồ sơ.", "en": "The bottom line is that discipline must be fair, consistent, and properly documented.", "ipa": "/ðə ˈbɑɾəm laɪn‿ɪz ðæt ˈdɪsəplɪn mʌst bi fɛr, kənˈsɪstənt, ən ˈprɑpɚli ˈdɑkjəmɛntɪd/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 5, "vi": "Rủi ro lớn nhất là bị kiện và công ty phải nhận lại người, trả lương những ngày nghỉ.", "en": "The biggest risk here is a lawsuit that forces us to reinstate the employee with back pay.", "ipa": "/ðə ˈbɪɡɪst rɪsk hɪr‿ɪz‿ə ˈlɔˌsut ðæt ˈfɔrsɪz‿əs tə ˌriɪnˈsteɪt ði ɪmˈplɔɪi wɪθ bæk peɪ/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 5, "vi": "Nếu không xử lý vi phạm nhỏ, cả team sẽ nghĩ nội quy không quan trọng.", "en": "If we fail to address small violations, the whole team will think the rules don't matter.", "ipa": "/ɪf wi feɪl tu əˈdrɛs smɔl ˌvaɪəˈleɪʃənz, ðə hoʊl tim wɪl θɪŋk ðə rulz doʊnt ˈmæɾɚ/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 5, "vi": "Tôi phản đối sa thải ngay, vì chúng ta chưa có đủ bằng chứng.", "en": "I'd push back on an immediate dismissal, because we don't have enough evidence yet.", "ipa": "/aɪd pʊʃ bæk‿ɑn‿ən‿ɪˈmidiət dɪsˈmɪsəl, bɪˈkɔz wi doʊnt hæv‿ɪˈnʌf‿ˈɛvɪdəns jɛt/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 5, "vi": "Điều tôi lo nhất là mỗi quản lý xử lý cùng lỗi một cách khác.", "en": "What worries me is that each manager handles the same violation differently.", "ipa": "/wʌt ˈwɝiz mi ɪz ðæɾ‿itʃ ˈmænɪdʒɚ ˈhændəlz ðə seɪm ˌvaɪəˈleɪʃən ˈdɪfrəntli/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 5, "vi": "Tôi đề xuất đào tạo quản lý về quy trình kỷ luật trong quý này.", "en": "My suggestion is to train all managers on the disciplinary process this quarter.", "ipa": "/maɪ səɡˈdʒɛstʃən‿ɪz tə treɪn‿ɔl ˈmænɪdʒɚz‿ɑn ðə ˈdɪsəpləˌnɛri ˈprɑsɛs ðɪs ˈkwɔrɾɚ/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 6, "vi": "Công bằng không có nghĩa là giống nhau cho tất cả.", "en": "Fair doesn't always mean the same for everyone.", "ipa": "/fɛr ˈdʌzənt‿ˈɔlˌweɪz min ðə seɪm fɚ‿ˈɛvriˌwʌn/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 6, "vi": "Kỷ luật là để sửa sai, không phải để trừng phạt.", "en": "Discipline is for correction, not punishment.", "ipa": "/ˈdɪsəplɪn‿ɪz fɚ kəˈrɛkʃən, nɑt ˈpʌnɪʃmənt/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 6, "vi": "3 trong 5 vụ sa thải năm ngoái bị khiếu nại, và cả 3 đều sai thủ tục.", "en": "Three of last year's five dismissals were challenged, and all three had procedural flaws.", "ipa": "/θri əv læst jɪrz faɪv dɪˈsmɪsəlz wɚ ˈtʃæləndʒd, ən‿ɔl θri hæd prəˈsidʒɚəl flɔz/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 6, "vi": "Sa thải trái luật có thể buộc công ty nhận lại người, trả lương những ngày không làm và bồi thường thêm.", "en": "An unlawful dismissal can force us to reinstate the employee, pay back wages, and add compensation.", "ipa": "/ən‿ənˈlɔfəl dɪsˈmɪsəl kən fɔrs‿əs tə ˌriɪnˈsteɪt ði ɪmˈplɔɪi, peɪ bæk ˈweɪdʒəz, ən‿æd ˌkɑmpənˈseɪʃən/"}, {"topicRaw": "18-Discipline & Warnings", "topicName": "Discipline & Warnings", "topicOrder": 18, "stage": 6, "vi": "Đúng quy trình quan n‿ˈaɪɾəˌmaɪzd ˈpeɪˌslɪp/"}, {"topicRaw": "19-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 2, "vi": "Chu kỳ gồm thu thập dữ liệu, tính lương, kiểm tra chéo, phê duyệt và chuyển khoản.", "en": "Cycle: data collection, calculation, cross-check, approval, bank transfer.", "ipa": "/ˈsaɪkəl: ˈdeɪɾə kəˈlɛkʃən, ˌkælkjəˈleɪʃən, krɔs tʃɛk, əˈpruvəl, bæŋk trænsˈfɝ/"}, {"topicRaw": "19-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 2, "vi": "Bạn có thể giải trình vì sao quỹ lương tháng này tăng 7% không?", "en": "Could you explain why total payroll is up 7% this month?", "ipa": "/kʊd ju ɪkˈspleɪn waɪ ˈtoʊɾəl ˈpeɪroʊl‿ɪz‿ʌp ˈsɛvən pɚˈsɛnt ðɪs mʌnθ/"}, {"topicRaw": "19-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 2, "vi": "Bạn có phiền khóa dữ liệu chấm công sau khi chốt để tránh sửa muộn không?", "en": "Would you mind locking attendance after cut-off to stop late edits?", "ipa": "/wʊd ju maɪnd ˈlɑkɪŋ‿əˈtɛndəns‿ˈæftɚ kʌt ɔf tə stɑp leɪt‿ˈɛdɪts/"}, {"topicRaw": "19-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 2, "vi": "Quỹ lương tăng vì có 15 người mới và khoản truy lĩnh tăng lương từ tháng 1.", "en": "Payroll rose due to 15 new hires and retroactive January raises.", "ipa": "/ˈpeɪˌroʊl roʊz du tə fɪfˈtin nu ˈhaɪɚz‿ən ˌrɛtroʊˈæktɪv ˈdʒænjuˌɛri ˈreɪzəz/"}, {"topicRaw": "19-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 2, "vi": "Khi nhân viên nghỉ việc, các khoản thanh toán cuối cùng phải chi trong 14 ngày làm việc.", "en": "On leaving, final settlement must be paid within 14 working days.", "ipa": "/ɑn ˈlivɪŋ, ˈfaɪnəl ˈsɛɾəlmənt mʌst bi peɪd wɪˈðɪn fɔrˈtin ˈwɝkɪŋ deɪz/"}, {"topicRaw": "19-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 2, "vi": "Rất tiếc, ngân hàng đã trả về 3 giao dịch do sai số tài khoản.", "en": "Unfortunately, the bank rejected three transfers due to incorrect account numbers.", "ipa": "/ʌnˈfɔrtʃənətli, ðə bæŋk rɪˈdʒɛktɪd θri trænsˈfɝz du tu ˌɪnkəˈrɛkt‿əˈkaʊnt ˈnʌmbɚz/"}, {"topicRaw": "19-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 2, "vi": "Tôi sẽ chuyển lại 3 khoản này ngay khi nhận được thông tin đúng.", "en": "I'll reprocess those three payments once I have correct details.", "ipa": "/aɪl riˈprɔsɛs ðoʊz θri ˈpeɪmənts wʌns‿aɪ həv kɚˈɛkt dɪˈteɪlz/"}, {"topicRaw": "19-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 3, "vi": "Để tôi giải thích cách tính lương cho người vào giữa tháng.", "en": "Let me explain how we calculate pay for mid-month joiners.", "ipa": "/lɛt mi ɪkˈspleɪn haʊ wi ˈkælkjəˌleɪt peɪ fɚ mɪd mʌnθ ˈdʒɔɪnɚz/"}, {"topicRaw": "19-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 3, "vi": "Để tôi làm rõ: lương tháng 13 không nằm trong lương tháng 12.", "en": "Let me clarify: 13th-month pay is separate from December salary.", "ipa": "/lɛt mi ˈklɛrəˌfaɪ: θɝˈtinθ mʌnθ peɪ ɪz ˈsɛpɚˌeɪt frəm dɪˈsɛmbɚ ˈsælɚi/"}, {"topicRaw": "19-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 3, "vi": "Theo số liệu, chi phí lương tăng 5% so với tháng trước.", "en": "Based on figures, payroll is up 5% from last month.", "ipa": "/beɪst‿ɑn ˈfɪɡjɚz, ˈpeɪˌroʊl‿ɪz‿ʌp faɪv pərˈsɛnt frəm læst mʌnθ/"}, {"topicRaw": "19-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 3, "vi": "Tôi đề xuất chấm công tự động để giảm lỗi nhập liệu.", "en": "I recommend automated timekeeping to reduce manual entry errors.", "ipa": "/aɪ ˌrɛkəˈmɛnd‿ˈɔɾəˌmeɪɾɪd ˈtaɪmˌkipɪŋ tə rəˈdus ˈmænjuəl‿ˈɛntri ˈɛrɚz/"}, {"topicRaw": "19-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 3, "vi": "Tôi đề nghị chốt dữ liệu sớm 2 ngày trong tháng có lễ.", "en": "I'd suggest cutting off two days earlier in holiday months.", "ipa": "/aɪd səˈdʒɛst ˈkʌɾɪŋ‿ɔf tu deɪz‿ˈɝliɚ ɪn ˈhɑləˌdeɪ mʌnθs/"}, {"topicRaw": "19-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 3, "vi": "Theo tôi, cần người thứ 2 kiểm tra bảng lương trước khi chi.", "en": "In my view, payroll needs a second checker before payment.", "ipa": "/ɪn maɪ vju, ˈpeɪˌroʊl nidz‿ə ˈsɛkənd ˈtʃɛkɚ bɪˈfɔr ˈpeɪmənt/"}, {"topicRaw": "19-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 3, "vi": "Tôi hiểu bạn cần gấp, nhưng bảng lương chưa được CFO duyệt.", "en": "I understand the urgency, but the CFO hasn't approved it.", "ipa": "/aɪ ˌʌndɚˈstænd ði ˈɝdʒənsi, bət ðə si ɛf oʊ ˈhæzənt‿əˈpruvd‿ɪt/"}, {"topicRaw": "19-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 3, "vi": "Có lẽ nên gửi phiếu lương qua ứng dụng HR thay vì email.", "en": "It might be worth sending payslips via HR app instead.", "ipa": "/ɪt maɪt bi wɝθ ˈsɛndɪŋ ˈpeɪˌslɪps ˈvaɪə eɪtʃ ɑr‿æp‿ˌɪnˈstɛd/"}, {"topicRaw": "19-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 4, "vi": "Chúng ta chuyển sang mục lương nhé, vì chỉ còn 10 phút.", "en": "Next, let's look at payroll, since we only have 10 minutes left.", "ipa": "/nɛkst, lɛts lʊk‿ət ˈpeɪroʊl, sɪns wi ˈoʊnli hæv tɛn ˈmɪnəts lɛft/"}, {"topicRaw": "19-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 4, "vi": "Bạn trình bày lịch chạy lương tháng này và các rủi ro được không?", "en": "Could you walk us through this month's payroll timeline and any risks?", "ipa": "/kʊd ju wɔk‿əs θru ðɪs mʌnθs ˈpeɪroʊl ˈtaɪmlaɪn‿ən‿ˈɛni rɪsks/"}, {"topicRaw": "19-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 4, "vi": "Tôi muốn lưu ý một điểm: dữ liệu của 2 chi nhánh hôm nay vẫn còn thiếu.", "en": "I want to flag one issue: data from two branches is still missing today.", "ipa": "/aɪ wɑnt tə flæɡ wʌn‿ˈɪʃu: ˈdeɪɾə frəm tu ˈbræntʃɪz‿ɪz stɪl ˈmɪsɪŋ təˈdeɪ/"}, {"topicRaw": "19-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 4, "vi": "Tôi hiểu việc này gấp, tuy nhiên lương phải được duyệt trước khi chi.", "en": "I appreciate that it's urgent; however, payroll must be approved before any payment goes out.", "ipa": "/aɪ əˈpriʃiˌeɪt ðæɾ‿ɪts‿ˈɝdʒənt; haʊˈɛvɚ, ˈpeɪroʊl mʌst bi əˈpruvd bɪˈfɔr‿ˈɛni ˈpeɪmənt ɡoʊz‿aʊt/"}, {"topicRaw": "19-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 4, "vi": "Hay dời hạn chốt công lên ngày 20 để có thêm thời gian kiểm tra?", "en": "What if we move the timesheet cut-off to the 20th to allow more review time?", "ipa": "/wʌɾ‿ɪf wi muv ðə ˈtaɪmʃit kʌɾ‿ɔf tə ðə ˈtwɛntiəθ tu əˈlaʊ mɔr rɪˈvju taɪm/"}, {"topicRaw": "19-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 4, "vi": "Không thể ứng toàn bộ lương, nhưng có thể ứng 50% vào thứ Sáu.", "en": "We're not able to advance the full salary, but we can advance 50% this Friday.", "ipa": "/wɪr nɑɾ‿ˈeɪbəl tu ədˈvæns ðə fʊl ˈsæləri, bət wi kən‿ədˈvæns ˈfɪfti pɚˈsɛnt ðɪs ˈfraɪdeɪ/"}, {"topicRaw": "19-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 4, "vi": "Tóm lại, lương trả ngày 25 và phiếu lương sẽ gửi qua email sau.", "en": "So, to recap, salaries will be paid on the 25th, and payslips will follow by email.", "ipa": "/soʊ, tə ˈriˌkæp, ˈsæləriz wɪl bi peɪd‿ɑn ðə ˌtwɛntiˈfɪfθ, ən ˈpeɪslɪps wɪl ˈfɑloʊ baɪ ˈimeɪl/"}, {"topicRaw": "19-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 4, "vi": "Bước tiếp theo: kế toán xác nhận số liệu cuối với HR trước trưa thứ Tư.", "en": "Next step: accounting will confirm the final figures with HR by Wednesday noon.", "ipa": "/nɛkst stɛp: əˈkaʊntɪŋ wɪl kənˈfɝm ðə ˈfaɪnəl ˈfɪɡjɚz wɪθ‿ˌeɪtʃˈɑr baɪ ˈwɛnzdeɪ nun/"}, {"topicRaw": "19-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 5, "vi": "Thật lòng, quy trình lương đã tốt hơn, nhưng vẫn dựa nhiều vào kiểm tra tay.", "en": "If I'm being honest, our payroll process has improved, but we still rely too much on manual checks.", "ipa": "/ɪf‿aɪm ˈbiɪŋ‿ˈɑnəst, ˈaʊɚ ˈpeɪroʊl ˈprɑsɛs hæz‿ɪmˈpruvd, bət wi stɪl rɪˈlaɪ tu mʌtʃ‿ɑn ˈmænjuəl tʃɛks/"}, {"topicRaw": "19-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 5, "vi": "Theo kinh nghiệm của tôi, đa số lỗi lương đến từ dữ liệu trễ, không phải tính sai.", "en": "From my experience, most payroll errors come from late data, not from wrong calculations.", "ipa": "/frʌm maɪ ɪkˈspɪriəns, moʊst ˈpeɪroʊl‿ˈɛrɚz kʌm frəm leɪt ˈdeɪɾə, nɑt frəm rɔŋ ˌkælkjəˈleɪʃənz/"}, {"topicRaw": "19-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 5, "vi": "Suy cho cùng, nếu dữ liệu đầu vào không sạch, không hệ thống nào tính lương đúng được.", "en": "At the end of the day, without clean input data, no system can produce accurate payroll.", "ipa": "/æt ði ɛnd‿əv ðə deɪ, wɪˈθaʊt klin‿ˈɪnpʊt ˈdeɪɾə, noʊ ˈsɪstəm kən prəˈdus‿ˈækjɚət ˈpeɪroʊl/"}, {"topicRaw": "19-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 5, "vi": "Điều tôi lo là trả lương trễ, có thể nhanh chóng làm mất niềm tin vào cả công ty.", "en": "My main worry is late salary payments, which could quickly damage trust in the whole company.", "ipa": "/maɪ meɪn ˈwɝi ɪz leɪt ˈsæləri ˈpeɪmənts, wɪtʃ kʊd ˈkwɪkli ˈdæmɪdʒ trʌst‿ɪn ðə hoʊl ˈkʌmpəni/"}, {"topicRaw": "19-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 5, "vi": "Nếu không tự động hóa nhập chấm công, mỗi tháng chúng ta vẫn mất 2 ngày công.", "en": "If we don't automate the timesheet import, we'll keep losing two working days every month.", "ipa": "/ɪf wi doʊnt‿ˈɔɾəmeɪt ðə ˈtaɪmʃiɾ‿ˈɪmpɔrt, wil kip ˈluzɪŋ tu ˈwɝkɪŋ deɪz‿ˈɛvri mʌnθ/"}, {"topicRaw": "19-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 5, "vi": "Tôi e ngại cắt thời gian rà soát, vì phiếu lương sai tốn hơn trễ hạn.", "en": "I'm not comfortable with cutting review time, because one wrong payslip costs more than a delay.", "ipa": "/aɪm nɑt ˈkʌmftɚbəl wɪθ ˈkʌɾɪŋ rɪˈvju taɪm, bɪˈkɔz wʌn rɔŋ ˈpeɪslɪp kɔsts mɔr ðən‿ə dɪˈleɪ/"}, {"topicRaw": "19-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 5, "vi": "Điều tôi lo nhất là cả bảng lương phụ thuộc vào một người không có người dự phòng.", "en": "My biggest concern is that the entire payroll depends on one person with no backup.", "ipa": "/maɪ ˈbɪɡɪst kənˈsɝn‿ɪz ðæt ði ɪnˈtaɪɚ ˈpeɪroʊl dɪˈpɛndz‿ɑn wʌn ˈpɝsən wɪθ noʊ ˈbækʌp/"}, {"topicRaw": "19-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 5, "vi": "Tôi đề xuất đào tạo người dự phòng chạy lương ngay quý này, trước cao điểm cuối năm.", "en": "My recommendation is to train a backup payroll officer this quarter, before the year-end peak.", "ipa": "/maɪ ˌrɛkəmɛnˈdeɪʃən‿ɪz tə treɪn‿ə ˈbækʌp ˈpeɪroʊl‿ˈɔfəsɚ ðɪs ˈkwɔrɾɚ, bɪˈfɔr ðə jɪr‿ɛnd pik/"}, {"topicRaw": "19-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 6, "vi": "Nhập rác thì ra rác.", "en": "Garbage in, garbage out.", "ipa": "/ˈɡɑrbɪdʒ‿ɪn, ˈɡɑrbɪdʒ‿aʊt/"}, {"topicRaw": "19-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 6, "vi": "Trả lương đúng và đúng hạn là lời hứa, không chỉ là một công việc.", "en": "Paying people right and on time is a promise, not just a task.", "ipa": "/ˈpeɪɪŋ ˈpipəl raɪɾ‿ən‿ɑn taɪm‿ɪz‿ə ˈprɑmɪs, nɑt dʒʌst‿ə tæsk/"}, {"topicRaw": "19-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 6, "vi": "Mỗi kỳ lương mất 6 ngày công, trong đó 60% thời gian dành cho kiểm tra thủ công.", "en": "Each payroll cycle takes six working days, and 60% of that time goes on manual checks.", "ipa": "/itʃ ˈpeɪroʊl ˈsaɪkəl teɪks sɪks ˈwɝkɪŋ deɪz, ən ˈsɪksti pɚˈsɛnt‿əv ðæt taɪm ɡoʊz‿ɑn ˈmænjuəl tʃɛks/"}, {"topicRaw": "19-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 6, "vi": "Khi quy mô lên 1.000 người, cách làm hiện tại sẽ cần thêm 2 nhân sự lương.", "en": "Once headcount reaches 1,000, the current process will need two more payroll staff.", "ipa": "/wʌns ˈhɛdˌkaʊnt ˈritʃəz wʌn ˈθaʊzənd, ðə ˈkɝənt ˈprɑsɛs wɪl nid tu mɔr ˈpeɪroʊl stæf/"}, {"topicRaw": "19-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 6, "vi": "Bảng lương không chỉ là con số, mà là sinh kế.", "en": "Payroll isn't just numbers; it's people's livelihoods.", "ipa": "/ˈpeɪroʊl‿ˈɪzənt dʒʌst ˈnʌmbɚz; ɪts ˈpipəlz ˈlaɪvlihʊdz/"}, {"topicRaw": "19-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 6, "vi": "Các công ty tự động hóa đối chiếu chỉ cần 2 ngày để đóng kỳ lương.", "en": "Companies that automate reconciliation close payroll in just two days.", "ipa": "/ˈkʌmpəniz ðæɾ‿ˈɔɾəmeɪt ˌrɛkənsɪliˈeɪʃən kloʊs ˈpeɪroʊl‿ɪn dʒʌst tu deɪz/"}, {"topicRaw": "19-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 6, "vi": "Tôi đề xuất đầu tư công cụ đối chiếu tự động khoảng 200 triệu, hoàn vốn trong khoảng 14 tháng.", "en": "I recommend a 200 million VND reconciliation tool, with payback in about 14 months.", "ipa": "/aɪ ˌrɛkəˈmɛnd‿ə tu ˈhʌndrəd ˈmɪljən ˌviɛnˈdi ˌrɛkənsɪliˈeɪʃən tul, wɪθ ˈpeɪˌbæk‿ɪn‿əˈbaʊt ˈfɔrˈtin mʌnθs/"}, {"topicRaw": "19-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 6, "vi": "Mục tiêu là đóng kỳ lương trong 3 ngày với độ chính xác 99,8%.", "en": "We aim to close payroll in three days at 99.8% accuracy.", "ipa": "/wi eɪm tə kloʊs ˈpeɪroʊl‿ɪn θri deɪz‿ət ˈnaɪnti naɪn pɔɪnt‿eɪt pɚˈsɛnt‿ˈækjɚəsi/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 1, "vi": "Khung lương bậc này từ 18 đến 26 triệu, điểm giữa là 22 triệu.", "en": "Grade range: 18 to 26 million VND, midpoint 22.", "ipa": "/ɡreɪd reɪndʒ: eɪˈtin tə ˈtwɛni sɪks ˈmɪljən vi ɛn di, ˈmɪdˌpɔɪnt ˈtwɛni tu/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 1, "vi": "Tỷ lệ so với điểm giữa khung của bạn là 0,92, hơi thấp hơn điểm giữa.", "en": "Your compa-ratio is 0.92, slightly below the midpoint.", "ipa": "/jɚ ˈkɑmpə ˈreɪʃiˌoʊ ɪz ˈzɪroʊ pɔɪnt ˈnaɪnti tu, ˈslaɪtli bɪˈloʊ ðə ˈmɪdˌpɔɪnt/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 1, "vi": "Con số này đã gồm phụ cấp hay chỉ là lương cơ bản?", "en": "Does this include allowances, or just base salary?", "ipa": "/dəz ðɪs‿ˌɪnˈklud‿əˈlaʊənsɪz, ɚ dʒʌst beɪs ˈsælɚi/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 1, "vi": "Vị trí này tương ứng với bậc nào trong cơ cấu lương mới?", "en": "Which grade is this role in the new structure?", "ipa": "/wɪtʃ ɡreɪd‿ɪz ðɪs roʊl‿ɪn ðə nu ˈstrʌktʃɚ/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 1, "vi": "Vui lòng dùng khung lương mới cho mọi offer từ tháng này.", "en": "Use the new ranges for offers from this month.", "ipa": "/jus ðə nu ˈreɪndʒəz fɚ ˈɔfɚz frəm ðɪs mʌnθ/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 1, "vi": "Vui lòng không hứa mức tăng nào trước khi được duyệt chính thức.", "en": "Please don't promise any increase before it's formally approved.", "ipa": "/pliz doʊnt ˈprɑmɪs‿ˈɛni ˈɪnkris bɪˈfɔr‿ɪts ˈfɔrməli əˈpruvd/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 1, "vi": "Xin lỗi, phụ lục lương của bạn chưa cập nhật mức tăng từ tháng 4.", "en": "Sorry, your salary annex lacks the April increase.", "ipa": "/ˈsɑri, jɚ ˈsælɚi ˈæˌnɛks læks ði ˈeɪprəl‿ˌɪnˈkris/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 1, "vi": "Tôi sẽ gửi bạn thư điều chỉnh lương và phụ lục trong tuần này.", "en": "I'll send your salary letter and annex this week.", "ipa": "/aɪl sɛnd jɚ ˈsælɚi ˈlɛɾɚ ən‿ˈæˌnɛks ðɪs wik/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 2, "vi": "Theo luật, lương trong hợp đồng không được thấp hơn lương tối thiểu vùng.", "en": "By law, contract salaries can't fall below the regional minimum wage.", "ipa": "/baɪ lɔ, ˈkɑntrækt ˈsæləriz kænt fɔl bɪˈloʊ ðə ˈridʒənəl ˈmɪnəməm weɪdʒ/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 2, "vi": "Đợt xét lương gồm khảo sát thị trường, phân bổ ngân sách, quản lý đề xuất và hiệu chỉnh.", "en": "Salary review: market benchmarking, budget allocation, manager proposals, calibration.", "ipa": "/ˈsælɚi ˌriˈvju: ˈmɑrkət ˈbɛntʃˌmɑrkɪŋ, ˈbʌdʒɪt‿ˌæləˈkeɪʃən, ˈmænədʒɚ prəˈpoʊzəlz, ˌkæləˈbreɪʃən/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 2, "vi": "Bạn có thể đề xuất mức tăng trong phạm vi ngân sách 7% của phòng không?", "en": "Could you propose increases within your department's 7% merit budget?", "ipa": "/kʊd ju prəˈpoʊz‿ˈɪnkrisɪz wɪˈθɪn jɚ dɪˈpɑrtmənts ˈsɛvən pɚˈsɛnt ˈmɛrɪt ˈbʌdʒɪt/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 2, "vi": "Bạn có phiền giải thích lý do đề xuất tăng 20% cho trường hợp này không?", "en": "Would you mind justifying the 20% increase you proposed here?", "ipa": "/wʊd ju maɪnd ˈdʒʌstəˌfaɪɪŋ ðə ˈtwɛni pərˈsɛnt‿ˌɪnˈkris ju prəˈpoʊzd hɪr/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 2, "vi": "Người dưới điểm giữa khung được tăng nhiều hơn để thu hẹp chênh lệch nội bộ.", "en": "Employees below the midpoint get larger increases to close internal gaps.", "ipa": "/ɪmˈplɔɪiz bɪˈloʊ ðə ˈmɪdˌpɔɪnt ɡɛt ˈlɑrdʒɚ‿ˈɪnkrisɪz tə kloʊs‿ɪnˈtɝnəl ɡæps/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 2, "vi": "Nếu lương đã chạm trần khung, phần tăng sẽ được chi dưới dạng một khoản một lần.", "en": "At the range maximum, increases are paid as a lump sum.", "ipa": "/ət ðə reɪndʒ ˈmæksəməm, ɪnˈkrisəz‿ɚ peɪd‿əz‿ə lʌmp sʌm/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 2, "vi": "Rất tiếc, năm nay công ty không có ngân sách tăng lương đồng loạt.", "en": "Unfortunately, there's no budget for a general salary increase this year.", "ipa": "/ʌnˈfɔrtʃənətli, ðɛrz noʊ ˈbʌdʒɪt fɚ‿ə ˈdʒɛnɚəl ˈsæləri ˈɪnkris ðɪs jɪr/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 2, "vi": "Tôi sẽ đảm bảo lương mới được cập nhật p pay.", "ipa": "/ɪn maɪ vju, fɛr peɪ ˈmæɾɚz mɔr ðæn tɑp peɪ/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 3, "vi": "Tôi hiểu, nhưng tăng lương cho 1 người sẽ lệch cả team.", "en": "I see, but raising one person would unbalance the team.", "ipa": "/aɪ si, bət ˈreɪzɪŋ wʌn ˈpɝsən wʊd‿ənˈbæləns ðə tim/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 3, "vi": "Có lẽ nên tăng theo hiệu suất thay vì tăng đồng loạt.", "en": "It might be worth using merit-based increases, not flat rates.", "ipa": "/ɪt maɪt bi wɝθ ˈjuzɪŋ ˈmɛrət beɪst‿ɪnˈkrisəz, nɑt flæt reɪts/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 4, "vi": "Chúng ta chuyển sang xét tăng lương năm nay, bắt đầu từ khối kỹ thuật.", "en": "Let's move on to this year's salary review, starting with the technical team.", "ipa": "/lɛts muv‿ɑn tə ðɪs jɪrz ˈsæləri rɪˈvju, ˈstɑrɾɪŋ wɪθ ðə ˈtɛknɪkəl tim/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 4, "vi": "Bạn trình bày cơ cấu lương mới và cách xếp bậc được không?", "en": "Can you take us through the new salary structure and how grades are set?", "ipa": "/kæn ju teɪk‿əs θru ðə nu ˈsæləri ˈstrʌktʃɚ‿ən haʊ ɡreɪdz‿ɚ sɛt/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 4, "vi": "Có một điều tôi lo: 3 kỹ sư đang hưởng lương dưới điểm giữa thị trường.", "en": "One thing worries me: three engineers are paid below the market midpoint.", "ipa": "/wʌn θɪŋ ˈwɝiz mi: θri ˌɛndʒəˈnɪrz‿ɚ peɪd bɪˈloʊ ðə ˈmɑrkɪt ˈmɪdˌpɔɪnt/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 4, "vi": "Tôi hiểu đề nghị này, tuy nhiên mức offer đã chạm trần khung lương.", "en": "I understand the request; however, this offer is already at the top of ri jɪrz, soʊ ðeɪ noʊ ˈlɔŋɡɚ rɪˈflɛkt ðə ˈmɑrkɪt/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 5, "vi": "Theo kinh nghiệm, người ta nghỉ vì chênh lệch bất công nhiều hơn vì lương thấp.", "en": "In my experience, people leave over unfair pay gaps more often than over low pay.", "ipa": "/ɪn maɪ ɪkˈspɪriəns, ˈpipəl liv‿ˈoʊvɚ‿ʌnˈfɛr peɪ ɡæps mɔr‿ˈɔfən ðən‿ˈoʊvɚ loʊ peɪ/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 5, "vi": "Điều quan trọng là lương phải công bằng nội bộ trước khi cạnh tranh bên ngoài.", "en": "What really matters is that pay must be fair inside before it can compete outside.", "ipa": "/wʌt ˈriəli ˈmæɾɚz‿ɪz ðæt peɪ mʌst bi fɛr‿ɪnˈsaɪd bɪˈfɔr‿ɪt kən kəmˈpiɾ‿ˌaʊtˈsaɪd/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 5, "vi": "Rủi ro lớn nhất là mất kỹ sư giỏi vào tay đối thủ trả cao hơn 15%.", "en": "The main risk is losing key engineers to competitors who pay 15% more.", "ipa": "/ðə meɪn rɪsk‿ɪz ˈluzɪŋ ki ˌɛndʒəˈnɪrz tə kəmˈpɛɾɪɾɚz hu peɪ ˌfɪfˈtin pɚˈsɛnt mɔr/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 5, "vi": "Nếu năm nay không điều chỉnh khung lương, tuyển vị trí kỹ thuật sẽ càng khó.", "en": "Unless we adjust the bands this year, hiring for technical roles will only get harder.", "ipa": "/ənˈlɛs wi əˈdʒʌst ðə bændz ðɪs jɪr, ˈhaɪɚɪŋ fɚ ˈtɛknɪkəl roʊlz wɪl‿ˈoʊnli ɡɛt ˈhɑrdɚ/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 5, "vi": "Tôi phản bác tăng đều cho mọi người, vì người làm kém cũng được như người giỏi.", "en": "I'd challenge a flat increase for everyone, because it rewards low performers equally.", "ipa": "/aɪd ˈtʃælɪndʒ‿ə flæɾ‿ˈɪnkris fɚ‿ˈɛvriˌwʌn, bɪˈkɔz‿ɪt rɪˈwɔrdz loʊ pɚˈfɔrmɚz‿ˈikwəli/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 5, "vi": "Điều tôi lo nhất là người mới đang hưởng lương cao hơn người cũ cùng vị trí.", "en": "What concerns me most is that new hires now earn more than experienced staff in the same role.", "ipa": "/wʌt kənˈsɝnz mi moʊst‿ɪz ðæt nu haɪɚz naʊ ɝn mɔr ðən‿ɪkˈspɪriənst stæf‿ɪn ðə seɪm roʊl/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 5, "vi": "Tôi đề xuất khảo sát lương thị trường trước kỳ xét và xử lý chênh lệch lớn trước.", "en": "What I'd propose is to run a market survey before the review and fix the biggest gaps first.", "ipa": "/wʌɾ‿aɪd prəˈpoʊz‿ɪz tə rʌn‿ə ˈmɑrkɪt ˈsɝveɪ bɪˈfɔr ðə rɪˈvju ən fɪks ðə ˈbɪɡɪst ɡæps fɝst/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 6, "vi": "Trả lương bằng hạt đậu thì nhận về toàn khỉ.", "en": "Pay peanuts, get monkeys.", "ipa": "/peɪ ˈpinʌts, ɡɛt ˈmʌŋkiz/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 6, "vi": "Công bằng quan trọng hơn con số tuyệt đối.", "en": "Fairness matters more than the absolute number.", "ipa": "/ˈfɛrnəs ˈmæɾɚz mɔr ðən ði ˈæbsəˌlut ˈnʌmbɚ/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 6, "vi": "35% nhân viên đang dưới 90% điểm giữa khung, phần lớn là người làm lâu năm.", "en": "Thirty-five percent of employees sit below 90% of the midpoint, most of them long-serving staff.", "ipa": "/ˈθɝdiˌfaɪv pɚˈsɛnt‿əv‿ɪmˈplɔɪiz sɪt bɪˈloʊ ˈnaɪnti pɚˈsɛnt‿əv ðə ˈmɪdˌpɔɪnt, moʊst‿əv ðəm lɔŋ ˈsɝvɪŋ stæf/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 6, "vi": "Nếu không xử lý, chênh lệch giữa người mới và người cũ sẽ ngày càng lớn và làm giảm tinh thần.", "en": "Left unaddressed, the gap between new hires and tenured staff will keep widening and erode morale.", "ipa": "/lɛft‿ˌʌnəˈdrɛst, ðə ɡæp bɪˈtwin nu haɪɚz‿ən ˈtɛnjɚd stæf wɪl kip ˈwaɪdənɪŋ‿ən‿ɪˈroʊd məˈræl/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 6, "vi": "Lương công bằng giữ người, không phải lương cao nhất.", "en": "Fair pay, not the highest pay, keeps good people.", "ipa": "/fɛr peɪ, nɑt ðə ˈhaɪɪst peɪ, kips ɡʊd ˈpipəl/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 6, "vi": "Thị trường năm nay tăng lương khoảng 7 đến 8%, trong khi chúng ta chỉ dự trù 5%.", "en": "The market is moving seven to eight percent this year, while we've only budgeted 5%.", "ipa": "/ðə ˈmɑrkɪɾ‿ɪz ˈmuvɪŋ ˈsɛvən tu eɪt pɚˈsɛnt ðɪs jɪr, waɪl wiv‿ˈoʊnli ˈbʌdʒɪɾəd faɪv pɚˈsɛnt/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 6, "vi": "Tôi đề xuất thêm 1,5% ngân sách riêng cho nhóm dưới khung, tổng khoảng 900 triệu.", "en": "I propose an extra 1.5% budget for below-range employees, about 900 million VND in total.", "ipa": "/aɪ prəˈpoʊz‿ən‿ˈɛkstrə wʌn pɔɪnt faɪv pɚˈsɛnt ˈbʌdʒɪt fɚ bɪˈloʊ reɪndʒ‿ɪmˈplɔɪiz, əˈbaʊt naɪn ˈhʌndrəd ˈmɪljən ˌviɛnˈdi ɪn ˈtoʊɾəl/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 6, "vi": "Trong 2 năm, mục tiêu là 90% nhân viên nằm trong khoảng 90 đến 110% điểm giữa.", "en": "Within two years, we want 90% of staff paid between 90 and 110% of the midpoint.", "ipa": "/wɪˈθɪn tu jɪrz, wi wɑnt ˈnaɪnti pɚˈsɛnt‿əv stæf peɪd bɪˈtwin ˈnaɪnti ən wʌn ˈhʌndrəd tɛn pɚˈsɛnt‿əv ðə ˈmɪdˌpɔɪnt/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 1, "vi": "Phụ cấp chức vụ và phụ cấp thâm niên thuộc tiền lương đóng bảo hiểm.", "en": "Position and seniority allowances count toward insurance contribution salary.", "ipa": "/pəˈzɪʃən‿ən siˈnjɔrɪti əˈlaʊənsɪz kaʊnt təˈwɔrd‿ˌɪnˈʃʊrəns ˌkɑntrəˈbjuʃən ˈsælɚi/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 1, "vi": "Phụ cấp điện thoại là mức khoán hằng tháng, không cần nộp hóa đơn.", "en": "The phone allowance is fixed monthly, with no receipts.", "ipa": "/ðə foʊn‿əˈlaʊəns‿ɪz fɪkst ˈmʌnθli, wɪθ noʊ rɪˈsits/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 1, "vi": "Phụ cấp xăng xe này có được miễn thuế TNCN không?", "en": "Is this fuel allowance exempt from personal income tax?", "ipa": "/ɪz ðɪs ˈfjuəl‿əˈlaʊəns‿ɪɡˈzɛmpt frəm ˈpɝsənəl‿ˈɪnˌkʌm tæks/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 1, "vi": "Khoản phụ cấp này có được ghi trong hợp đồng lao động không?", "en": "Is this allowance specified in the employment contract?", "ipa": "/ɪz ðɪs‿əˈlaʊəns ˈspɛsəˌfaɪd‿ɪn ði ɛmˈplɔɪmənt ˈkɑntrækt/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 1, "vi": "Vui lòng nộp hóa đơn điện tử đúng tên công ty để thanh toán công tác phí.", "en": "Please submit company-name e-invoices for travel expenses.", "ipa": "/pliz səbˈmɪt ˈkʌmpəˌni neɪm‿ˈiˌɪnvɔɪsɪz fɚ ˈtrævəl‿ɪkˈspɛnsəz/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 1, "vi": "Vui lòng tách phụ cấp nhà ở thành dòng riêng trên phiếu lương.", "en": "Please show housing allowance as a separate payslip line.", "ipa": "/pliz ʃoʊ ˈhaʊzɪŋ‿əˈlaʊəns‿əz‿ə ˈsɛpɚˌeɪt ˈpeɪˌslɪp laɪn/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 1, "vi": "Xin lỗi, phụ cấp ăn trưa tháng này bị chi trùng 2 lần.", "en": "Sorry, this month's meal allowance was paid twice.", "ipa": "/ˈsɑri, ðɪs mʌnθs mil‿əˈlaʊəns wəz peɪd twaɪs/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 1, "vi": "Khoản chi thừa sẽ được thu hồi kỳ sau, có thông báo trước cho bạn.", "en": "The overpayment will be recovered next month, with notice.", "ipa": "/ði ˈoʊvɚˌpeɪmənt wɪl bi rəˈkʌvɚd nɛkst mʌnθ, wɪθ ˈnoʊɾəs/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 2, "vi": "Theo quy định thuế TNCN, tiền ăn giữa ca chỉ được miễn thuế trong mức khống chế.", "en": "PIT exempts meal allowances only up to a cap.", "ipa": "/pi aɪ ti ɪɡˈzɛmpts mil‿əˈlaʊənsɪz‿ˈoʊnli ʌp tə ə kæp/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 2, "vi": "Tạm ứng công tác được duyệt trước chuyến đi và quyết toán trong 5 ngày sau khi về.", "en": "Travel advances: approved before trip, settled within five days of return.", "ipa": "/ˈtrævəl‿ədˈvænsəz: əˈpruvd bɪˈfɔr trɪp, ˈsɛɾəld wɪˈðɪn faɪv deɪz‿əv rɪˈtɝn/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 2, "vi": "Bạn có thể xác nhận phụ cấp nào được trả cố định hằng tháng không?", "en": "Could you confirm which allowances are fixed monthly payments?", "ipa": "/kʊd ju kənˈfɝm wɪtʃ‿əˈlaʊənsɪz‿ɚ fɪkst ˈmʌnθli ˈpeɪmənts/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 2, "vi": "Bạn có phiền gửi quyết định áp dụng phụ cấp trách nhiệm cho vị trí này không?", "en": "Would you mind sending the approval for this role's responsibility allowance?", "ipa": "/wʊd ju maɪnd ˈsɛndɪŋ ði əˈpruvəl fɚ ðɪs roʊlz rɪˌspɑnsəˈbɪləɾi əˈlaʊəns/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 2, "vi": "Phụ cấp này phải đóng bảo hiểm vì nó cố định và được ghi trong hợp đồng.", "en": "This allowance counts for insurance because it's fixed and contractual.", "ipa": "/ðɪs‿əˈlaʊəns kaʊnts fɚ ˌɪnˈʃʊrəns bɪˈkɔz‿ɪts fɪkst‿ən kənˈtræktʃuəl/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 2, "vi": "Nếu bạn nghỉ không lương cả tháng, phụ cấp cố định của tháng đó cũng không được chi.", "en": "On unpaid leave for the full month, fixed allowances aren't paid.", "ipa": "/ɑn‿ənˈpeɪd liv fɚ ðə fʊl mʌnθ, fɪkst‿əˈlaʊənsɪz‿ˈɑrənt peɪd/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 2, "vi": "Rất tiếc, khoản phụ cấp nhà ở này sẽ được tính vào thu nhập chịu thuế.", "en": "Unfortunately, this housing allowance will be treated as taxable income.", "ipa": "/ʌnˈfɔrtʃənətli, ðɪs ˈhaʊzɪŋ‿əˈlaʊəns wɪl bi ˈtriɾɪd‿əz ˈtæksəbəl‿ˈɪnˌkʌm/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 2, "vi": "Tôi sẽ gửi kế toán bảng phân loại phụ cấp chịu thuế và miễn thuế.", "en": "I'll send accounting a breakdown of taxable and exempt allowances.", "ipa": "/aɪl sɛnd‿əˈkaʊntɪŋ‿ə ˈbreɪkdaʊn‿əv ˈtæksəbəl‿ən‿ɪɡˈzɛmpt‿əˈlaʊənsɪz/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 3, "vi": "Để tôi giải thích phụ cấp nào được miễn thuế và nào chịu thuế.", "en": "Let me explain which allowances are tax-exempt and which taxable.", "ipa": "/lɛt mi ɪkˈspleɪn wɪtʃ‿əˈlaʊənsɪz‿ɚ tæks ɪɡˈzɛmpt‿ən wɪtʃ ˈtæksəbəl/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 3, "vi": "Để tôi làm rõ: phụ cấp này không tính vào lương đóng bảo hiểm.", "en": "Let me clarify: this allowance isn't in insurance contribution salary.", "ipa": "/lɛt mi ˈklɛrəˌfaɪ: ðɪs‿əˈlaʊəns‿ˈɪzənt‿ɪn‿ˌɪnˈʃʊrəns ˌkɑntrəˈbjuʃən ˈsælɚi/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 3, "vi": "Theo rà soát, công ty đang có 9 loại phụ cấp khác nhau.", "en": "Based on our review, we pay nine different allowance types.", "ipa": "/beɪst‿ɑn‿aʊɚ ˌriˈvju, wi peɪ naɪn ˈdɪfɚənt‿əˈlaʊəns taɪps/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 3, "vi": "Tôi đề xuất gộp các phụ cấp nhỏ thành một khoản cố định.", "en": "I recommend combining small allowances into one fixed payment.", "ipa": "/aɪ ˌrɛkəˈmɛnd kəmˈbaɪnɪŋ smɔl‿əˈlaʊənsɪz‿ˈɪntu wʌn fɪkst ˈpeɪmənt/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 3, "vi": "Tôi đề nghị dùng thẻ công ty cho công tác phí, đỡ giấy tờ.", "en": "I'd suggest corporate cards for travel expenses to cut paperwork.", "ipa": "/aɪd səˈdʒɛst ˈkɔrpɚət kɑrdz fɚ ˈtrævəl‿ɪkˈspɛnsəz tə kʌt ˈpeɪpɚˌwɝk/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 3, "vi": "Theo tôi, mỗi phụ cấp cần có mục đích rõ ràng, bảo vệ được.", "en": "In my view, every allowance needs a clear, defensible purpose.", "ipa": "/ɪn maɪ vju, ˈɛvri əˈlaʊəns nidz‿ə klɪr, dɪˈfɛnsəbəl ˈpɝpəs/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 3, "vi": "Tôi hiểu, nhưng phụ cấp này phải có chứng từ hợp lệ.", "en": "I see your point, but this allowance needs valid documents.", "ipa": "/aɪ si jɚ pɔɪnt, bət ðɪs‿əˈlaʊəns nidz ˈvælɪd ˈdɑkjəmənts/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 3, "vi": "Có lẽ nên rà soát chính sách phụ cấp trước kỳ tăng lương.", "en": "It might be worth reviewing allowances before the salary review.", "ipa": "/ɪt maɪt bi wɝθ riˈvjuɪŋ‿əˈlaʊənsɪz bɪˈfɔr ðə ˈsælɚi ˌriˈvju/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 4, "vi": "Chúng ta chuyển sang chính sách phụ cấp, vì có nhiều câu hỏi về thuế.", "en": "Let's turn to the allowance policy, since we've had many tax questions.", "ipa": "/lɛts tɝn tə ði əˈlaʊəns ˈpɑləsi, sɪns wiv hæd ˈmɛni tæks ˈkwɛstʃənz/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 4, "vi": "Bạn trình bày khoản nào chịu thuế và khoản nào miễn thuế nhé?", "en": "Would you mind going over which allowances are taxable and which aren't?", "ipa": "/wʊd ju maɪnd ˈɡoʊɪŋ‿ˈoʊvɚ wɪtʃ‿əˈlaʊənsɪz‿ɚ ˈtæksəbəl‿ən wɪtʃ‿ɑrnt/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 4, "vi": "Tôi muốn nêu lo ngại: mỗi chi nhánh trả phụ cấp xăng khác nhau.", "en": "I'd like to raise a concern: each branch pays a different fuel allowance.", "ipa": "/aɪd laɪk tə reɪz‿ə kənˈsɝn: itʃ bræntʃ peɪz‿ə ˈdɪfɚənt ˈfjuəl‿əˈlaʊəns/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 4, "vi": "Tôi hiểu nhân viên quen phụ cấp cũ, tuy nhiên cần thống nhất.", "en": "I get that staff are used to the old allowances; however, we need one policy.", "ipa": "/aɪ ɡɛt ðæt stæf‿ɚ juzd tə ði oʊld‿əˈlaʊənsɪz; haʊˈɛvɚ, wi nid wʌn ˈpɑləsi/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 4, "vi": "Hay chúng ta chuyển 2 khoản phụ cấp nhỏ vào lương cơ bản?", "en": "Would it help if we moved two small allowances into the basic salary instead?", "ipa": "/wʊd‿ɪt hɛlp‿ɪf wi muvd tu smɔl‿əˈlaʊənsɪz‿ˈɪntu ðə ˈbeɪsɪk ˈsæləri ɪnˈstɛd/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 4, "vi": "Không thể bỏ phụ cấp ngay, nhưng có thể chuyển đổi trong 6 tháng.", "en": "We can't remove the allowances overnight, but we can phase them out over six months.", "ipa": "/wi kænt rɪˈmuv ði əˈlaʊənsɪz‿ˌoʊvɚˈnaɪt, bət wi kən feɪz ðəm‿aʊɾ‿ˈoʊvɚ sɪks mʌnθs/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 4, "vi": "Tóm lại, chính sách phụ cấp mới áp dụng từ quý sau.", "en": "To wrap up, the new allowance policy will apply from next quarter onward.", "ipa": "/tu ræp‿ʌp, ðə nu əˈlaʊəns ˈpɑləsi wɪl‿əˈplaɪ frəm nɛkst ˈkwɔrɾɚ‿ˈɑnwɚd/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 4, "vi": "Sau buổi họp này, kế toán tính tác động thuế và gửi trước thứ Tư.", "en": "After this meeting, accounting will calculate the tax impact and share it by Wednesday.", "ipa": "/ˈæftɚ ðɪs ˈmiɾɪŋ, əˈkaʊntɪŋ wɪl ˈkælkjəleɪt ðə tæks‿ˈɪmpækt‿ən ʃɛr‿ɪt baɪ ˈwɛnzdeɪ/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 5, "vi": "Thật lòng, vài khoản phụ cấp chỉ để giảm thuế, và kiểm toán sẽ nhận ra.", "en": "To be frank, some of our allowances exist only to lower tax, and auditors will notice that.", "ipa": "/tu bi fræŋk, səm‿əv‿ˈaʊɚ‿əˈlaʊənsɪz‿ɪɡˈzɪst‿ˈoʊnli tə ˈloʊɚ tæks, ən‿ˈɔdəɾɚz wɪl ˈnoʊɾɪs ðæt/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 5, "vi": "Theo kinh nghiệm, phụ cấp đơn giản ít bị khiếu nại hơn nhiều khoản lặt vặt.", "en": "What I've seen is that simple allowance policies cause fewer complaints than long lists of small items.", "ipa": "/wʌɾ‿aɪv sin‿ɪz ðæt ˈsɪmpəl‿əˈlaʊəns ˈpɑləsiz kɔz ˈfjuɚ kəmˈpleɪnts ðən lɔŋ lɪsts‿əv smɔl‿ˈaɪɾəmz/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 5, "vi": "Mấu chốt là mỗi khoản phụ cấp phải có mục đích và quy định rõ ràng.", "en": "The bottom line is that every allowance should have a clear purpose and clear rules.", "ipa": "/ðə ˈbɑɾəm laɪn‿ɪz ðæɾ‿ˈɛvri əˈlaʊəns ʃʊd hæv‿ə klɪr ˈpɝpəs‿ən klɪr rulz/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 5, "vi": "Rủi ro lớn nhất là khi thanh tra, thuế coi phụ cấp là thu nhập chịu thuế.", "en": "The biggest risk here is that tax authorities treat these allowances as taxable income during an inspection.", "ipa": "/ðə ˈbɪɡɪst rɪsk hɪr‿ɪz ðæt tæks‿əˈθɔrəɾiz trit ðiz‿əˈlaʊənsɪz‿əz ˈtæksəbəl‿ˈɪnˌkʌm ˈdʊrɪŋ‿ən‿ɪnˈspɛkʃən/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 5, "vi": "Nếu không rà soát phụ cấp, chúng ta sẽ tiếp tục trả cho những khoản không ai dùng.", "en": "If we fail to review the allowance list, we'll keep paying for benefits nobody actually uses.", "ipa": "/ɪf wi feɪl tə rɪˈvju ði əˈlaʊəns lɪst, wil kip ˈpeɪɪŋ fɚ ˈbɛnɪfɪts ˈnoʊbɑdi ˈæktʃuəli ˈjuzɪz/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 5, "vi": "Tôi phản đối thêm phụ cấp mới, vì sau này sẽ rất khó cắt bỏ.", "en": "I'd push back on adding a new allowance, because it would be very hard to remove later.", "ipa": "/aɪd pʊʃ bæk‿ɑn‿ˈædɪŋ‿ə nu əˈlaʊəns, bɪˈkɔz‿ɪt wʊd bi ˈvɛri hɑrd tə rɪˈmuv ˈleɪɾɚ/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 5, "vi": "Điều tôi lo nhất là mỗi chi nhánh trả phụ cấp khác nhau cho cùng việc.", "en": "What worries me is that staff in different branches get different allowances for the same job.", "ipa": "/wʌt ˈwɝiz mi ɪz ðæt stæf‿ɪn ˈdɪfɚənt ˈbræntʃɪz ɡɛt ˈdɪfɚənt‿əˈlaʊənsɪz fɚ ðə seɪm dʒɑb/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 5, "vi": "Tôi đề xuất gộp các phụ cấp nhỏ vào lương cơ bản và chỉ giữ khoản thiết yếu.", "en": "My suggestion is to merge small allowances into the base salary and keep only essential ones.", "ipa": "/maɪ səɡˈdʒɛstʃən‿ɪz tə mɝdʒ smɔl‿əˈlaʊənsɪz‿ˈɪntu ðə beɪs ˈsæləri ən kip‿ˈoʊnli ɪˈsɛnʃəl wʌnz/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 6, "vi": "Đơn giản là đỉnh cao của sự tinh tế.", "en": "Simplicity is the ultimate sophistication.", "ipa": "/sɪmˈplɪsəɾi ɪz ði ˈʌltəmət səˌfɪstɪˈkeɪʃən/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 6, "vi": "Phụ cấp tốt là phụ cấp ai cũng hiểu.", "en": "A good allowance is one everyone understands.", "ipa": "/ə ɡʊd‿əˈlaʊəns‿ɪz wʌn‿ˈɛvriˌwʌn‿ˌʌndɚˈstændz/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 6, "vi": "Chúng ta đang trả 11 loại phụ cấp, chiếm 28% tổng thu nhập, nhưng 5 loại thiếu căn cứ rõ ràng.", "en": "We pay 11 types of allowances, worth 28% of total pay, but five lack a clear basis.", "ipa": "/wi peɪ ɪˈlɛvən taɪps‿əv‿əˈlaʊənsɪz, wɝθ ˈtwɛnti eɪt pɚˈsɛnt‿əv ˈtoʊɾəl peɪ, bət faɪv læk‿ə klɪr ˈbeɪsɪs/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 6, "vi": "Khi thanh tra, các khoản này có thể bị truy thu bảo hiểm và thuế cho nhiều năm.", "en": "In an inspection, these items could trigger back payments of insurance and tax for several years.", "ipa": "/ɪn‿ən‿ɪnˈspɛkʃən, ðiz‿ˈaɪɾəmz kʊd ˈtrɪɡɚ bæk ˈpeɪmənts‿
