  // ===================
  // TTS
  // ===================
  let cachedVoices = [];
  let canAutoSpeak = false;
  let pendingSpeakText = null;
  let pendingSpeakLang = null;
  let selectedViVoice = localStorage.getItem('cbcoach_vi_voice') || '';
  let selectedEnVoice = localStorage.getItem('cbcoach_en_voice') || '';
  let viSpeedPreset = parseFloat(localStorage.getItem('cbcoach_vi_speed') || '1.15');
  let enSpeedPreset = parseFloat(localStorage.getItem('cbcoach_en_speed') || '1');
  let isMuted = localStorage.getItem('cbcoach_muted') === '1';

  const refreshVoices = () => { cachedVoices = speechSynthesis.getVoices(); populateVoiceSelectors(); };
  speechSynthesis.onvoiceschanged = refreshVoices; refreshVoices();
  setTimeout(refreshVoices, 400); // fallback: một số trình duyệt không bắn sự kiện voiceschanged

  function pickVoice(langCode) {
    if (!cachedVoices.length) refreshVoices();
    const matches = cachedVoices.filter(v => v.lang?.toLowerCase().startsWith(langCode.slice(0, 2).toLowerCase()));
    if (matches.length === 0) return null;
    return matches.find(v => v.localService) || matches[0];
  }

  function getVoiceByName(name) {
    if (!name) return null;
    return cachedVoices.find(v => v.name === name) || null;
  }

  function fillVoiceSelect(id, langPrefix, selectedName) {
    const sel = document.getElementById(id);
    if (!sel) return;
    const voices = cachedVoices.filter(v => v.lang?.toLowerCase().startsWith(langPrefix));
    sel.innerHTML = '';
    if (voices.length === 0) {
      const opt = document.createElement('option');
      opt.value = ''; opt.innerText = 'Đang tải giọng đọc...';
      sel.appendChild(opt);
      sel.disabled = true;
      return;
    }
    sel.disabled = false;
    voices.forEach(v => {
      const opt = document.createElement('option');
      opt.value = v.name;
      opt.innerText = v.name + (v.localService ? '' : ' (cần mạng)');
      sel.appendChild(opt);
    });
    const hasSelected = voices.some(v => v.name === selectedName);
    sel.value = hasSelected ? selectedName : (voices.find(v => v.localService)?.name || voices[0].name);
  }

  function populateVoiceSelectors() {
    fillVoiceSelect('voiceViSelect', 'vi', selectedViVoice);
    fillVoiceSelect('voiceEnSelect', 'en', selectedEnVoice);
  }

  function speakText(text, langCode, rate = 1, onEnd = null) {
    if (!text) { if (onEnd) onEnd(); return; }
    try {
      if (speechSynthesis.speaking) speechSynthesis.cancel();
      try { speechSynthesis.resume(); } catch (e) {}
      const u = new SpeechSynthesisUtterance(text);
      u.lang = langCode;
      u.rate = rate;
      u.volume = isMuted ? 0 : 1;
      let v = null;
      if (langCode === 'vi-VN') v = getVoiceByName(document.getElementById('voiceViSelect')?.value) || pickVoice(langCode);
      else v = getVoiceByName(document.getElementById('voiceEnSelect')?.value) || pickVoice(langCode);
      if (v) u.voice = v;
      let started = false;
      u.onstart = () => { started = true; };
      if (onEnd) { u.onend = onEnd; u.onerror = onEnd; }
      speechSynthesis.speak(u);
      // Safari watchdog: if speech was silently dropped after a long idle period
      // (known WebKit bug), retry once.
      setTimeout(() => {
        if (!started && !speechSynthesis.speaking && !isMuted) {
          try { speechSynthesis.resume(); speechSynthesis.speak(u); } catch (e) {}
        }
      }, 500);
    } catch (e) { console.warn('TTS error:', e); if (onEnd) onEnd(); }
  }

  const enableAutoSpeakOnce = () => {
    if (!canAutoSpeak) {
      canAutoSpeak = true;
      if (pendingSpeakText) {
        const text = pendingSpeakText, lang = pendingSpeakLang;
        pendingSpeakText = null; pendingSpeakLang = null;
        speakText(text, lang, lang === 'vi-VN' ? viSpeedPreset : 1);
      }
    }
    document.removeEventListener('click', enableAutoSpeakOnce, true);
    document.removeEventListener('keydown', enableAutoSpeakOnce, true);
  };
  document.addEventListener('click', enableAutoSpeakOnce, true);
  document.addEventListener('keydown', enableAutoSpeakOnce, true);

  // ===================
  // HELPERS
  // ===================
  function parseTopic(raw) {
    if (!raw) return { order: Infinity, name: '', raw: '' };
    const s = String(raw).trim();
    const m = s.match(/^\s*(\d+)\s*-\s*(.+)$/);
    if (m) return { order: parseInt(m[1], 10), name: m[2].trim(), raw: s };
    return { order: Infinity, name: s, raw: s };
  }

  // ===================
  // NẠP DỮ LIỆU CÂU LUYỆN (nhúng sẵn, không cần fetch)
  // ===================
  function loadEmbeddedFlashcardData() {
    flashcardData = EMBEDDED_FLASHCARD_DATA.map(row => ({ ...row }));
    renderStageChips();
    renderTopicChips();
  }

  // ===================
  // NẠP EXCEL (chỉ dùng để lấy dữ liệu Đoạn nghe)
  // ===================
  async function tryLoadExcelFiles() {
    for (const file of possibleFiles) {
      try {
        const res = await fetch(file);
        if (!res.ok) continue;
        const buffer = await res.arrayBuffer();
        const workbook = XLSX.read(buffer, { type: 'array' });

        if (workbook.SheetNames.includes('LISTENING')) {
          const json2 = XLSX.utils.sheet_to_json(workbook.Sheets['LISTENING']);
          listeningData = json2.map(row => {
            const parsed = parseTopic(row['CHU_DE']);
            const questions = [1, 2].map(n => ({
              q: (row[`Q${n}`] ?? '').toString().trim(),
              options: [row[`Q${n}_A`], row[`Q${n}_B`], row[`Q${n}_C`]].map(v => (v ?? '').toString().trim()),
              answer: (row[`Q${n}_ANSWER`] ?? '').toString().trim().toUpperCase()
            })).filter(qq => qq.q);
            return {
              topicRaw: parsed.raw, topicName: parsed.name, topicOrder: parsed.order,
              type: (row['TYPE'] ?? '').toString().trim().toLowerCase(),
              title: (row['TITLE'] ?? '').toString().trim(),
              scriptEn: (row['SCRIPT_EN'] ?? '').toString(),
              scriptVi: (row['SCRIPT_VI'] ?? '').toString(),
              questions
            };
          }).filter(i => i.topicName && i.scriptEn && (i.type === 'dialogue' || i.type === 'monologue') && i.questions.length > 0);
          renderListenTopicChips();
        }
        return;
      } catch (err) { console.log('Không đọc được file (chỉ ảnh hưởng Đoạn nghe):', file, err); }
    }
    console.log('Không tìm thấy file Excel cho Đoạn nghe — phần Luyện câu vẫn hoạt động bình thường vì dữ liệu đã nhúng sẵn.');
  }

  function currentSourceData() { return flashcardData.filter(d => allStagesSelected || selectedStages.has(d.stage)); }

  // ===================
  // STAGE CHIPS
  // ===================
  function renderStageChips() {
    const container = document.getElementById('stageChips');
    const stages = [...new Set(flashcardData.map(d => d.stage))].sort((a, b) => a - b);
    container.innerHTML = '';

    const allChip = document.createElement('div');
    allChip.className = 'chip all-chip' + (allStagesSelected ? ' selected' : '');
    allChip.innerText = 'Tất cả';
    allChip.addEventListener('click', () => {
      allStagesSelected = true;
      selectedStages = new Set();
      refreshStageChipStyles();
      updateStageDesc();
      renderTopicChips();
    });
    container.appendChild(allChip);

    stages.forEach(s => {
      const chip = document.createElement('div');
      chip.className = 'chip stage-chip' + (!allStagesSelected && selectedStages.has(s) ? ' selected' : '');
      chip.dataset.stage = s;
      chip.innerText = `Stage ${s}`;
      chip.addEventListener('click', () => {
        allStagesSelected = false;
        if (selectedStages.has(s)) selectedStages.delete(s);
        else selectedStages.add(s);
        if (selectedStages.size === 0) allStagesSelected = true;
        refreshStageChipStyles();
        updateStageDesc();
        renderTopicChips();
      });
      container.appendChild(chip);
    });

    updateStageDesc();
  }

  function refreshStageChipStyles() {
    const container = document.getElementById('stageChips');
    const allChip = container.querySelector('.all-chip');
    allChip.classList.toggle('selected', allStagesSelected);
    container.querySelectorAll('.stage-chip').forEach(chip => {
      chip.classList.toggle('selected', !allStagesSelected && selectedStages.has(parseInt(chip.dataset.stage, 10)));
    });
  }

  function updateStageDesc() {
    const el = document.getElementById('stageDesc');
    if (!el) return;
    if (allStagesSelected) { el.innerText = 'Tất cả các Stage'; return; }
    const stages = [...selectedStages].sort((a, b) => a - b);
    el.innerText = stages.map(s => STAGE_TITLES[s]).filter(Boolean).join(' · ');
  }

  // ===================
  // TOPIC CHIPS
  // ===================
  function getTopicsList() {
    const source = currentSourceData();
    const topicMap = new Map();
    for (const d of source) {
      if (!topicMap.has(d.topicName)) topicMap.set(d.topicName, { name: d.topicName, order: d.topicOrder });
      else if (d.topicOrder < topicMap.get(d.topicName).order) topicMap.set(d.topicName, { name: d.topicName, order: d.topicOrder });
    }
    return Array.from(topicMap.values()).sort((a, b) => a.order === b.order ? a.name.localeCompare(b.name) : a.order - b.order);
  }

  function renderTopicChips() {
    const container = document.getElementById('topicChips');
    const topics = getTopicsList();
    const topicNames = new Set(topics.map(t => t.name));

    if (!allSelected) {
      // Keep the user's topic selection when switching Stage — only drop
      // topics that genuinely don't exist for the newly selected Stage(s).
      selectedTopics = new Set([...selectedTopics].filter(name => topicNames.has(name)));
      if (selectedTopics.size === 0) allSelected = true;
    }

    container.innerHTML = '';

    const allChip = document.createElement('div');
    allChip.className = 'chip all-chip selected';
    allChip.innerText = 'Tất cả';
    allChip.addEventListener('click', () => {
      allSelected = true;
      selectedTopics = new Set();
      refreshChipStyles();
      applyFilter();
    });
    container.appendChild(allChip);

    topics.forEach(t => {
      const chip = document.createElement('div');
      chip.className = 'chip';
      chip.dataset.topic = t.name;
      const prefix = Number.isFinite(t.order) ? `${t.order}-` : '';
      chip.innerText = prefix + t.name;
      chip.addEventListener('click', () => {
        allSelected = false;
        if (selectedTopics.has(t.name)) selectedTopics.delete(t.name);
        else selectedTopics.add(t.name);
        if (selectedTopics.size === 0) allSelected = true;
        refreshChipStyles();
        applyFilter();
      });
      container.appendChild(chip);
    });

    document.getElementById('emptyNote').innerText = '';

    refreshChipStyles();
    applyFilter();
  }

  function refreshChipStyles() {
    const container = document.getElementById('topicChips');
    const allChip = container.querySelector('.all-chip');
    allChip.classList.toggle('selected', allSelected);
    container.querySelectorAll('.chip:not(.all-chip)').forEach(chip => {
      chip.classList.toggle('selected', !allSelected && selectedTopics.has(chip.dataset.topic));
    });
  }

  function applyFilter() {
    stopAutoPlay();
    const source = currentSourceData();
    filteredData = allSelected ? [...source] : source.filter(i => selectedTopics.has(i.topicName));

    usedIndexes = [];
    updateProgress(0, filteredData.length);
    document.getElementById('nextBtn').disabled = filteredData.length === 0;
    document.getElementById('showAnswerBtn').disabled = true;

    const qEl = document.getElementById('question');

    hideAnswer();

    if (filteredData.length > 0) {
      nextQuestion();
    } else {
      qEl.innerText = source.length === 0 ? 'Chưa có dữ liệu.' : 'Vui lòng chọn ít nhất một chủ đề!';
    }
  }

  function updateProgress(done, total) {
    document.getElementById('progressText').innerText = `${done}/${total}`;
    const pct = total === 0 ? 0 : Math.round((done / total) * 100);
    document.getElementById('progressFill').style.width = pct + '%';
  }

  function hideAnswer() {
    document.getElementById('answerBlock').classList.remove('show');
    document.getElementById('answer').innerText = '';
    document.getElementById('ipa').innerText = '';
  }

  // ===================
  // CÂU HỎI
  // ===================
  function renderAnswer(q) {
    const el = document.getElementById('answer');
    const t = q.en, rs = [];
    (q.hl || []).forEach(c => { const i = t.indexOf(c); if (i >= 0) rs.push([i, i + c.length]); });
    rs.sort((x, y) => x[0] - y[0]);
    const mg = [];
    rs.forEach(r => { const l = mg[mg.length - 1]; if (l && r[0] <= l[1]) l[1] = Math.max(l[1], r[1]); else mg.push([...r]); });
    const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    let out = '', p = 0;
    mg.forEach(r => { out += esc(t.slice(p, r[0])) + '<span class="hl">' + esc(t.slice(r[0], r[1])) + '</span>'; p = r[1]; });
    el.innerHTML = out + esc(t.slice(p));
  }

  function pickNextQuestion() {
    if (filteredData.length === 0) return null;
    if (usedIndexes.length === filteredData.length) usedIndexes = [];

    const available = filteredData.map((_, i) => i).filter(i => !usedIndexes.includes(i));
    currentIndex = available[Math.floor(Math.random() * available.length)];
    usedIndexes.push(currentIndex);

    const q = filteredData[currentIndex];
    hideAnswer();

    document.getElementById('question').innerText = q.vi;
    renderAnswer(q);

    updateProgress(usedIndexes.length, filteredData.length);
    document.getElementById('showAnswerBtn').disabled = autoPlayActive ? true : false;

    return q;
  }

  function nextQuestion() {
    if (autoPlayActive) return;
    const q = pickNextQuestion();
    if (!q) return;

    if (canAutoSpeak) speakText(q.vi, 'vi-VN', viSpeedPreset);
    else { pendingSpeakText = q.vi; pendingSpeakLang = 'vi-VN'; }
  }

  function showAnswer(speak = true) {
    const text = document.getElementById('answer').innerText;
    document.getElementById('answerBlock').classList.add('show');

    const q = filteredData[currentIndex];
    const ipaEl = document.getElementById('ipa');
    if (q?.ipa) {
      const t = q.ipa.trim();
      ipaEl.innerText = /^\/.*\/$/.test(t) ? t : `/${t}/`;
    } else ipaEl.innerText = '';

    if (speak) speakText(text, 'en-US', enSpeedPreset);
  }

  function updateMuteBtn() {
    const btn = document.getElementById('replayBtn');
    btn.classList.toggle('muted', isMuted);
    btn.innerHTML = isMuted
      ? '<i class="fa-solid fa-volume-xmark"></i>'
      : '<i class="fa-solid fa-volume-high"></i>';
    btn.title = isMuted ? 'Đang tắt tiếng - bấm để bật lại' : 'Tắt/bật tiếng';
  }

  function toggleMute() {
    isMuted = !isMuted;
    localStorage.setItem('cbcoach_muted', isMuted ? '1' : '0');
    updateMuteBtn();
    if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
  }

  // ===================
  // TỰ ĐỘNG CHẠY (LUYỆN CÂU)
  // ===================
  function updateAutoPlayBtn() {
    const btn = document.getElementById('autoPlayBtn');
    btn.classList.toggle('running', autoPlayActive);
    btn.innerHTML = autoPlayActive
      ? '<i class="fa-solid fa-stop"></i> Dừng'
      : '<i class="fa-solid fa-play"></i> Tự động chạy';
  }

  function stopAutoPlay() {
    if (!autoPlayActive && !autoPlayTimeoutId) return;
    autoPlayActive = false;
    if (autoPlayTimeoutId) { clearTimeout(autoPlayTimeoutId); autoPlayTimeoutId = null; }
    if (reflexKeepAliveId) { clearInterval(reflexKeepAliveId); reflexKeepAliveId = null; }
    if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
    updateAutoPlayBtn();
    document.getElementById('nextBtn').disabled = filteredData.length === 0;
    document.getElementById('showAnswerBtn').disabled = currentIndex < 0;
    updateRepeatBadge(0, 0);
  }

  function startAutoPlay() {
    if (filteredData.length === 0) return;
    autoPlayActive = true;
    updateAutoPlayBtn();
    document.getElementById('nextBtn').disabled = true;
    document.getElementById('showAnswerBtn').disabled = true;
    if (autoPlayMode === 'reflex') autoStepReflex();
    else autoStepRead();
  }

  const REFLEX_TIMING = {
    1: { wait: 8000, flash: 0 },
    2: { wait: 8000, flash: 0 },
    3: { wait: 8000, flash: 0 },
    4: { wait: 8000, flash: 0 },
    5: { wait: 8000, flash: 0 },
    6: { wait: 8000, flash: 0 },
  };

  function autoStepReflex() {
    if (!autoPlayActive) return;
    const q = pickNextQuestion();
    if (!q) { stopAutoPlay(); return; }
    const timing = REFLEX_TIMING[q.stage] || REFLEX_TIMING[1];
    speakText(q.vi, 'vi-VN', viSpeedPreset, () => {
      if (!autoPlayActive) return;
      // Keep Safari's speech engine "awake" during the long silent thinking
      // gap; WebKit can suspend it after a few seconds of idle, which
      // silently drops the next speak() call.
      const keepAliveId = setInterval(() => {
        try { speechSynthesis.resume(); } catch (e) {}
      }, 2000);
      reflexKeepAliveId = keepAliveId;
      autoPlayTimeoutId = setTimeout(() => {
        clearInterval(keepAliveId);
        reflexKeepAliveId = null;
        if (!autoPlayActive) return;
        showAnswer(false);
        let speechDone = false;
        let minTimeDone = false;
        const tryAdvance = () => {
          if (speechDone && minTimeDone && autoPlayActive) autoStepReflex();
        };
        speakText(document.getElementById('answer').innerText, 'en-US', enSpeedPreset, () => {
          speechDone = true;
          tryAdvance();
        });
        autoPlayTimeoutId = setTimeout(() => {
          minTimeDone = true;
          tryAdvance();
        }, timing.flash);
      }, timing.wait);
    });
  }

  const READ_REPEAT_COUNT = 12;

  function autoStepRead() {
    if (!autoPlayActive) return;
    const q = pickNextQuestion();
    if (!q) { stopAutoPlay(); return; }
    showAnswer(false);
    autoReadRepeatOnce(q, 1);
  }

  function autoReadRepeatOnce(q, repIndex) {
    if (!autoPlayActive) return;
    updateRepeatBadge(repIndex, READ_REPEAT_COUNT);
    speakText(q.en, 'en-US', enSpeedPreset, () => {
      if (!autoPlayActive) return;
      autoPlayTimeoutId = setTimeout(() => {
        if (!autoPlayActive) return;
        if (repIndex < READ_REPEAT_COUNT) {
          autoReadRepeatOnce(q, repIndex + 1);
        } else {
          updateRepeatBadge(0, 0);
          autoStepRead();
        }
      }, 1000);
    });
  }

  function updateRepeatBadge(current, total) {
    const el = document.getElementById('progressText');
    if (!el) return;
    const base = `${usedIndexes.length}/${filteredData.length}`;
    el.innerText = current > 0 ? `${base} · Lặp ${current}/${total}` : base;
  }

  document.getElementById('autoPlayBtn').addEventListener('click', () => {
    if (autoPlayActive) stopAutoPlay();
    else startAutoPlay();
  });

  document.querySelectorAll('.auto-mode-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.auto-mode-btn').forEach(b => b.classList.toggle('active', b === btn));
      autoPlayMode = btn.dataset.mode;
      if (autoPlayActive) {
        if (autoPlayTimeoutId) { clearTimeout(autoPlayTimeoutId); autoPlayTimeoutId = null; }
        if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
        if (autoPlayMode === 'reflex') autoStepReflex();
        else autoStepRead();
      }
    });
  });

  // ===================
  // CÀI ĐẶT GIỌNG ĐỌC
  // ===================
  function initSettingsPanel() {
    const toggle = document.getElementById('settingsToggle');
    const panel = document.getElementById('settingsPanel');
    toggle.addEventListener('click', () => {
      toggle.classList.toggle('open');
      panel.classList.toggle('open');
    });

    document.getElementById('voiceViSelect').addEventListener('change', (e) => {
      selectedViVoice = e.target.value;
      localStorage.setItem('cbcoach_vi_voice', selectedViVoice);
    });
    document.getElementById('voiceEnSelect').addEventListener('change', (e) => {
      selectedEnVoice = e.target.value;
      localStorage.setItem('cbcoach_en_voice', selectedEnVoice);
    });

    const speedBtns = document.querySelectorAll('.speed-btn');
    let closestBtn = null, closestDiff = Infinity;
    speedBtns.forEach(btn => {
      const val = parseFloat(btn.dataset.speed);
      const diff = Math.abs(val - viSpeedPreset);
      if (diff < closestDiff) { closestDiff = diff; closestBtn = btn; }
    });
    speedBtns.forEach(btn => {
      const val = parseFloat(btn.dataset.speed);
      btn.classList.toggle('active', btn === closestBtn);
      btn.addEventListener('click', () => {
        viSpeedPreset = val;
        localStorage.setItem('cbcoach_vi_speed', String(val));
        speedBtns.forEach(b => b.classList.toggle('active', b === btn));
        if (currentIndex >= 0 && filteredData[currentIndex]) {
          speakText(filteredData[currentIndex].vi, 'vi-VN', viSpeedPreset);
        }
      });
    });

    const enSlider = document.getElementById('enSpeedSlider');
    const enValueLabel = document.getElementById('enSpeedValue');
    enSpeedPreset = Math.min(1, Math.max(0.6, enSpeedPreset));
    enSlider.value = enSpeedPreset;
    enValueLabel.innerText = enSpeedPreset.toFixed(2).replace(/0$/, '') + 'x';
    enSlider.style.setProperty('--fill', `${((enSpeedPreset - 0.6) / (1 - 0.6)) * 100}%`);
    let enSliderDebounce = null;
    enSlider.addEventListener('input', () => {
      const val = parseFloat(enSlider.value);
      enSpeedPreset = val;
      enValueLabel.innerText = val.toFixed(2).replace(/0$/, '') + 'x';
      enSlider.style.setProperty('--fill', `${((val - 0.6) / (1 - 0.6)) * 100}%`);
      localStorage.setItem('cbcoach_en_speed', String(val));
      if (enSliderDebounce) clearTimeout(enSliderDebounce);
      enSliderDebounce = setTimeout(() => {
        if (currentIndex >= 0 && filteredData[currentIndex]) {
          speakText(filteredData[currentIndex].en, 'en-US', enSpeedPreset);
        }
      }, 300);
    });
  }

  // ===================
  // CHẾ ĐỘ ĐOẠN NGHE
  // ===================
  function getListenTopicsList() {
    const map = new Map();
    for (const d of listeningData) {
      if (!map.has(d.topicName)) map.set(d.topicName, { name: d.topicName, order: d.topicOrder });
    }
    return Array.from(map.values()).sort((a, b) => a.order - b.order);
  }

  function renderListenTopicChips() {
    const container = document.getElementById('listenTopicChips');
    const topics = getListenTopicsList();
    container.innerHTML = '';
    topics.forEach((t, idx) => {
      const chip = document.createElement('div');
      chip.className = 'chip' + (idx === 0 ? ' selected' : '');
      chip.dataset.topic = t.name;
      const prefix = Number.isFinite(t.order) ? `${t.order}-` : '';
      chip.innerText = prefix + t.name;
      chip.addEventListener('click', () => {
        container.querySelectorAll('.chip').forEach(c => c.classList.toggle('selected', c === chip));
        selectListenTopic(t.name);
      });
      container.appendChild(chip);
    });
    if (topics.length > 0) selectListenTopic(topics[0].name);
  }

  function selectListenTopic(topicName) {
    currentListenTopic = listeningData.find(d => d.topicName === topicName);
    if (!currentListenTopic) return;

    stopListenLoop();

    document.getElementById('listenTypeBadge').innerText = currentListenTopic.type === 'monologue' ? 'Đoạn văn' : 'Hội thoại';
    document.getElementById('listenTitle').innerText = currentListenTopic.title || currentListenTopic.topicName;

    document.getElementById('transcriptBox').classList.remove('show');
    document.getElementById('transcriptToggleBtn').innerHTML = '<i class="fa-solid fa-file-lines"></i> Hiện transcript &amp; bản dịch';

    renderTranscript();
    renderQuiz();
  }

  function renderTranscript() {
    const box = document.getElementById('transcriptBox');
    const enLines = currentListenTopic.scriptEn.split('\n').filter(Boolean);
    const viLines = currentListenTopic.scriptVi.split('\n').filter(Boolean);
    box.innerHTML = '';
    enLines.forEach((enLine, i) => {
      const viLine = viLines[i] || '';
      let speaker = '', enText = enLine, viText = viLine;
      const m = enLine.match(/^([A-Z]):\s*(.*)$/);
      const mv = viLine.match(/^([A-Z]):\s*(.*)$/);
      if (m) { speaker = m[1]; enText = m[2]; }
      if (mv) { viText = mv[2]; }

      const row = document.createElement('div');
      row.className = 'transcript-line';
      row.innerHTML = `
        <div class="transcript-en">${speaker ? `<span class="speaker-tag">${speaker}</span>` : ''}${enText}</div>
        <div class="transcript-vi">${viText}</div>
      `;
      box.appendChild(row);
    });
  }

  function stripSpeaker(line) {
    const m = line.match(/^[A-Z]:\s*(.*)$/);
    return m ? m[1] : line;
  }

  function stopListenLoop() {
    listenLoopActive = false;
    listenLoopLang = null;
    listenPlayQueue = [];
    if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
    setPlayBtnState('listenPlayEnBtn', false, 'Nghe tiếng Anh', 'fa-play');
    setPlayBtnState('listenPlayViBtn', false, 'Nghe bản dịch', 'fa-language');
  }

  function setPlayBtnState(btnId, playing, label, iconClass) {
    const btn = document.getElementById(btnId);
    btn.classList.toggle('playing', playing);
    btn.innerHTML = playing
      ? '<i class="fa-solid fa-stop"></i> Dừng'
      : `<i class="fa-solid ${iconClass}"></i> ${label}`;
  }

  function toggleLoopPlay(lines, langCode, btnId, label, iconClass) {
    if (listenLoopActive && listenLoopLang === langCode) {
      stopListenLoop();
      return;
    }
    stopListenLoop();
    listenLoopActive = true;
    listenLoopLang = langCode;
    setPlayBtnState(btnId, true, label, iconClass);
    listenPlayQueue = lines.slice();
    playNextInQueue(langCode, lines, btnId, label, iconClass);
  }

  function playNextInQueue(langCode, fullLines, btnId, label, iconClass) {
    if (!listenLoopActive || listenLoopLang !== langCode) return;
    if (listenPlayQueue.length === 0) {
      listenPlayQueue = fullLines.slice();
    }
    const text = stripSpeaker(listenPlayQueue.shift());
    if (!text) { playNextInQueue(langCode, fullLines, btnId, label, iconClass); return; }
    const u = new SpeechSynthesisUtterance(text);
    u.lang = langCode;
    u.rate = langCode === 'vi-VN' ? viSpeedPreset : enSpeedPreset;
    u.volume = isMuted ? 0 : 1;
    let v = null;
    if (langCode === 'vi-VN') v = getVoiceByName(document.getElementById('voiceViSelect')?.value) || pickVoice(langCode);
    else v = getVoiceByName(document.getElementById('voiceEnSelect')?.value) || pickVoice(langCode);
    if (v) u.voice = v;
    u.onend = () => {
      if (listenLoopActive && listenLoopLang === langCode) {
        playNextInQueue(langCode, fullLines, btnId, label, iconClass);
      }
    };
    speechSynthesis.speak(u);
  }

  function renderQuiz() {
    const wrap = document.getElementById('quizWrap');
    wrap.innerHTML = '';
    currentListenTopic.questions.forEach((q, qi) => {
      const qEl = document.createElement('div');
      qEl.className = 'quiz-q';
      qEl.innerText = `${qi + 1}. ${q.q}`;
      wrap.appendChild(qEl);

      q.options.forEach((opt, oi) => {
        if (!opt) return;
        const letter = String.fromCharCode(65 + oi);
        const btn = document.createElement('button');
        btn.className = 'quiz-opt';
        btn.innerText = `${letter}. ${opt}`;
        btn.addEventListener('click', () => {
          const allOptsForQ = Array.from(wrap.children).filter(el => {
            return el.classList.contains('quiz-opt') && el.dataset.qIndex == qi;
          });
          allOptsForQ.forEach(o => { o.disabled = true; });
          if (letter === q.answer) btn.classList.add('correct');
          else {
            btn.classList.add('wrong');
            allOptsForQ.forEach(o => { if (o.innerText.startsWith(q.answer + '.')) o.classList.add('correct'); });
          }
        });
        btn.dataset.qIndex = qi;
        wrap.appendChild(btn);
      });
    });
  }

  document.getElementById('modeFlashcardBtn').addEventListener('click', () => {
    document.getElementById('modeFlashcardBtn').classList.add('active');
    document.getElementById('modeListenBtn').classList.remove('active');
    document.getElementById('flashcardMode').style.display = '';
    document.getElementById('listenMode').style.display = 'none';
    stopListenLoop();
  });
  document.getElementById('modeListenBtn').addEventListener('click', () => {
    document.getElementById('modeListenBtn').classList.add('active');
    document.getElementById('modeFlashcardBtn').classList.remove('active');
    document.getElementById('flashcardMode').style.display = 'none';
    document.getElementById('listenMode').style.display = '';
    stopAutoPlay();
    if (speechSynthesis.speaking) speechSynthesis.cancel();
  });
  document.getElementById('listenPlayEnBtn').addEventListener('click', () => {
    if (!currentListenTopic) return;
    toggleLoopPlay(currentListenTopic.scriptEn.split('\n').filter(Boolean), 'en-US', 'listenPlayEnBtn', 'Nghe tiếng Anh', 'fa-play');
  });
  document.getElementById('listenPlayViBtn').addEventListener('click', () => {
    if (!currentListenTopic) return;
    toggleLoopPlay(currentListenTopic.scriptVi.split('\n').filter(Boolean), 'vi-VN', 'listenPlayViBtn', 'Nghe bản dịch', 'fa-language');
  });
  document.getElementById('transcriptToggleBtn').addEventListener('click', () => {
    const box = document.getElementById('transcriptBox');
    const btn = document.getElementById('transcriptToggleBtn');
    box.classList.toggle('show');
    btn.innerHTML = box.classList.contains('show')
      ? '<i class="fa-solid fa-eye-slash"></i> Ẩn transcript'
      : '<i class="fa-solid fa-file-lines"></i> Hiện transcript &amp; bản dịch';
  });

  // ===================
  // SỰ KIỆN
  // ===================
  document.getElementById('nextBtn').addEventListener('click', nextQuestion);
  document.getElementById('showAnswerBtn').addEventListener('click', showAnswer);
  document.getElementById('replayBtn').addEventListener('click', toggleMute);
  updateMuteBtn();

  initSettingsPanel();
  loadEmbeddedFlashcardData();
  tryLoadExcelFiles();
</script>
</body>
