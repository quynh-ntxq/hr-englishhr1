", "topicName": "KPI & Performance", "topicOrder": 11, "stage": 5, "vi": "Tôi đề xuất trao đổi hằng quý để kỳ đánh giá cuối năm không có bất ngờ.", "en": "What I'd propose is quarterly check-ins, so the annual review never contains any surprises.", "ipa": "/wʌɾ‿aɪd prəˈpoʊz‿ɪz ˈkwɔrɾɚli tʃɛk‿ɪnz, soʊ ði ˈænjuəl rɪˈvju ˈnɛvɚ kənˈteɪnz‿ˈɛni sɚˈpraɪzɪz/"}, {"topicRaw": "11-KPI & Performance", "topicName": "KPI & Performance", "topicOrder": 11, "stage": 6, "vi": "Thứ gì đo được thì quản lý được.", "en": "What gets measured gets managed.", "ipa": "/wʌt ɡɛts ˈmɛʒɚd ɡɛts ˈmænɪdʒd/"}, {"topicRaw": "11-KPI & Performance", "topicName": "KPI & Performance", "topicOrder": 11, "stage": 6, "vi": "Phản hồi là món quà.", "en": "Feedback is a gift.", "ipa": "/ˈfidbæk‿ɪz‿ə ɡɪft/"}, {"topicRaw": "11-KPI & Performance", "topicName": "KPI & Performance", "topicOrder": 11, "stage": 6, "vi": "65% nhân viên được xếp loại xuất sắc, trong khi công ty chỉ đạt 90% kế hoạch doanh thu.", "en": "65% of employees rated outstanding, yet the company hit only 90% of revenue plan.", "ipa": "/ˈsɪksti faɪv pərˈsɛnt‿əv‿ɛmˈplɔɪiz ˈreɪɾɪd‿ˌaʊtˈstændɪŋ, jɛt ðə ˈkʌmpəˌni hɪt‿ˈoʊnli ˈnaɪnti pərˈsɛnt‿əv ˈrɛvəˌnu plæn/"}, {"topicRaw": "11-KPI & Performance", "topicName": "KPI & Performance", "topicOrder": 11, "stage": 6, "vi": "Khi ai cũng xuất sắc, thưởng mất ý nghĩa và người giỏi thật sự thấy thiệt thòi.", "en": "When everyone is outstanding, bonuses lose meaning and genuine top performers feel short-changed.", "ipa": "/wɛn‿ˈɛvriˌwʌn‿ɪz‿ˌaʊtˈstændɪŋ, ˈboʊnəsɪz luz ˈminɪŋ‿ən ˈdʒɛnjəwən tɑp pɚˈfɔrmɚz fil ʃɔrt tʃeɪndʒd/"}, {"topicRaw": "11-KPI & Performance", "topicName": "KPI & Performance", "topicOrder": 11, "stage": 6, "vi": "Đo kết quả, nhưng cũng nhìn cách làm.", "en": "Measure the what, but also the how.", "ipa": "/ˈmɛʒɚ ðə wʌt, bəɾ‿ˈɔlsoʊ ðə haʊ/"}, {"topicRaw": "11-KPI & Performance", "topicName": "KPI & Performance", "topicOrder": 11, "stage": 6, "vi": "Ở các công ty có hiệu chỉnh điểm, nhóm xuất sắc thường chỉ chiếm 15 đến 20%.", "en": "In companies that calibrate ratings, the outstanding band is usually 15 to 20%.", "ipa": "/ɪn ˈkʌmpəniz ðæt ˈkæləˌbreɪt ˈreɪɾɪŋz, ði ˌaʊtˈstændɪŋ bænd‿ɪz ˈjuʒuəli ˌfɪfˈtin tə ˈtwɛnti pɚˈsɛnt/"}, {"topicRaw": "11-KPI & Performance", "topicName": "KPI & Performance", "topicOrder": 11, "stage": 6, "vi": "Tôi đề xuất họp hiệu chỉnh liên phòng trước khi chốt điểm, bắt đầu từ kỳ giữa năm.", "en": "I recommend cross-department calibration before scores are final, starting from the mid-year cycle.", "ipa": "/aɪ ˌrɛkəˈmɛnd krɔs dɪˈpɑrtmənt ˌkæləˈbreɪʃən bɪˈfɔr skɔrz‿ɚ ˈfaɪnəl, ˈstɑrtɪŋ frəm ðə mɪd jɪr ˈsaɪkəl/"}, {"topicRaw": "11-KPI & Performance", "topicName": "KPI & Performance", "topicOrder": 11, "stage": 6, "vi": "Mục tiêu là kết quả đánh giá phản ánh đúng kết quả kinh doanh và tạo khác biệt rõ cho người giỏi.", "en": "Our goal is ratings that mirror business results and clearly differentiate top performers.", "ipa": "/ˈaʊɚ ɡoʊl‿ɪz ˈreɪɾɪŋz ðæt ˈmɪrɚ ˈbɪznəs rɪˈzʌlts‿ən ˈklɪrli ˌdɪfəˈrɛnʃiˌeɪt tɑp pɚˈfɔrmɚz/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 1, "vi": "Đợt xét thăng chức năm nay mở từ ngày 1 đến ngày 15 tháng 3.", "en": "This year's promotion window runs from March 1st to 15th.", "ipa": "/ðɪs jɪrz prəˈmoʊʃən ˈwɪndoʊ rʌnz frəm mɑrtʃ fɝst tə ˌfɪfˈtinθ/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 1, "vi": "Thăng chức kèm mức tăng lương ít nhất 10% và phụ lục hợp đồng mới.", "en": "Promotions come with at least a 10% raise and an updated contract annex.", "ipa": "/prəˈmoʊʃənz kʌm wɪθ‿ət list‿ə tɛn pɚˈsɛnt reɪz‿ən‿ən‿ʌpˈdeɪɾɪd ˈkɑntrækt‿ˈænɛks/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 1, "vi": "Bạn đã trao đổi lộ trình thăng tiến với nhân viên này chưa?", "en": "Have you discussed the career path with this employee yet?", "ipa": "/hæv ju dɪˈskʌst ðə kəˈrɪr pæθ wɪθ ðɪs‿ɪmˈplɔɪi jɛt/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 1, "vi": "Vị trí mới có thay đổi phạm vi quản lý hay chỉ đổi chức danh?", "en": "Does the new role change the reporting scope, or just the job title?", "ipa": "/dʌz ðə nu roʊl tʃeɪndʒ ðə rɪˈpɔrtɪŋ skoʊp, ɚ dʒʌst ðə dʒɑb ˈtaɪɾəl/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 1, "vi": "Vui lòng gửi hồ sơ đề cử kèm kết quả đánh giá 2 năm gần nhất.", "en": "Please submit the nomination with the last two years' appraisal results.", "ipa": "/pliz səbˈmɪt ðə ˌnɑməˈneɪʃən wɪθ ðə læst tu jɪrz‿əˈpreɪzəl rɪˈzʌlts/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 1, "vi": "Vui lòng chưa thông báo kết quả cho nhân viên đến khi có quyết định chính thức.", "en": "Please don't share the outcome with the employee until the decision is official.", "ipa": "/pliz doʊnt ʃɛr ði ˈaʊtˌkʌm wɪθ ði ɪmˈplɔɪi ənˈtɪl ðə dɪˈsɪʒən‿ɪz‿əˈfɪʃəl/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 1, "vi": "Xin lỗi, quyết định thăng chức của bạn ghi sai ngày hiệu lực.", "en": "Sorry, your promotion letter shows the wrong effective date.", "ipa": "/ˈsɑri, jɚ prəˈmoʊʃən ˈlɛɾɚ ʃoʊz ðə rɔŋ‿ɪˈfɛktɪv deɪt/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 1, "vi": "Tôi sẽ gửi quyết định và phụ lục hợp đồng mới để bạn ký trong tuần.", "en": "I'll send the promotion letter and new contract annex for signature this week.", "ipa": "/aɪl sɛnd ðə prəˈmoʊʃən ˈlɛɾɚ‿ən nu ˈkɑntrækt‿ˈænɛks fɚ ˈsɪɡnətʃɚ ðɪs wik/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 2, "vi": "Theo khung năng lực, thăng chức đòi hỏi đáp ứng năng lực của cấp mới, không chỉ thâm niên.", "en": "Under our framework, promotion requires meeting next-level competencies, not just tenure.", "ipa": "/ˈʌndɚ aʊɚ ˈfreɪmˌwɝk, prəˈmoʊʃən riˈkwaɪɚz ˈmiɾɪŋ nɛkst ˈlɛvəl ˈkɑmpətɪnsiz, nɑt dʒʌst ˈtɛnjɚ/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 2, "vi": "Đề cử đi từ quản lý trực tiếp lên hội đồng nhân sự, rồi trình tổng giám đốc duyệt.", "en": "Nominations go from the line manager to the people committee, then to the CEO.", "ipa": "/ˌnɑməˈneɪʃənz ɡoʊ frəm ðə laɪn ˈmænədʒɚ tə ðə ˈpipəl kəˈmɪɾi, ðɛn tə ðə si i oʊ/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 2, "vi": "Bạn có thể nêu 2 ví dụ cho thấy bạn ấy đã làm tốt ở cấp cao hơn không?", "en": "Could you give two examples of her already performing at the next level?", "ipa": "/kʊd ju ɡɪv tu ɪɡˈzæmpəlz‿əv hɝ‿ɔlˈrɛdi pɚˈfɔrmɪŋ‿ət ðə nɛkst ˈlɛvəl/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 2, "vi": "Bạn có phiền xác định người kế nhiệm trước khi bạn ấy chuyển vị trí không?", "en": "Would you mind identifying a successor before she moves into the new role?", "ipa": "/wʊd ju maɪnd‿aɪˈdɛntəˌfaɪɪŋ‿ə səkˈsɛsɚ bɪˈfɔr ʃi muvz‿ˈɪntu ðə nu roʊl/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 2, "vi": "Đề cử tạm hoãn vì vị trí quản lý mới chưa có trong ngân sách headcount.", "en": "The nomination is on hold; the new manager role isn't in the headcount budget.", "ipa": "/ðə ˌnɑməˈneɪʃən‿ɪz‿ɑn hoʊld; ðə nu ˈmænədʒɚ roʊl‿ˈɪzənt‿ɪn ðə ˈhɛdˌkaʊnt ˈbʌdʒɪt/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 2, "vi": "Nếu được duyệt, mức lương mới sẽ áp dụng từ kỳ lương tháng 4.", "en": "If approved, the new salary will apply from the April payroll.", "ipa": "/ɪf‿əˈpruvd, ðə nu ˈsæləri wɪl‿əˈplaɪ frəm ði ˈeɪprəl ˈpeɪroʊl/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 2, "vi": "Rất tiếc, đợt này bạn chưa được thăng chức, nhưng tôi muốn cùng bạn lập kế hoạch phát triển.", "en": "Unfortunately, you weren't promoted this cycle, but let's build a development plan together.", "ipa": "/ənˈfɔrtʃənətli, ju ˈwɝənt prəˈmoʊɾɪd ðɪs ˈsaɪkəl, bət lɛts bɪld‿ə dɪˈvɛləpmənt plæn təˈɡɛðɚ/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 2, "vi": "Tôi sẽ cập nhật sơ đồ tổ chức và thông báo cho các bộ phận liên quan.", "en": "I'll update the org chart and notify the relevant departments.", "ipa": "/aɪl‿ʌpˈdeɪt ði ɔrɡ tʃɑrɾ‿ən ˈnoʊɾəˌfaɪ ðə ˈrɛləvənt dɪˈpɑrtmənts/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 3, "vi": "Để tôi giải thích 3 tiêu chí dùng cho mọi quyết định thăng chức.", "en": "Let me explain the three criteria we use for every promotion decision.", "ipa": "/lɛt mi ɪkˈspleɪn ðə θri kraɪˈtɪriə wi juz fɚ‿ˈɛvri prəˈmoʊʃən dɪˈsɪʒən/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 3, "vi": "Để tôi làm rõ: thăng chức dựa trên năng lực, không phải thâm niên.", "en": "Let me clarify: promotion is based on capability, not years of service.", "ipa": "/lɛt mi ˈklɛrəˌfaɪ: prəˈmoʊʃən‿ɪz beɪst‿ɑn ˌkeɪpəˈbɪləɾi, nɑt jɪrz‿əv ˈsɝvɪs/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 3, "vi": "Theo đánh giá 2 năm, bạn ấy luôn vượt mục tiêu.", "en": "Based on two years of reviews, she has consistently exceeded her targets.", "ipa": "/beɪst‿ɑn tu jɪrz‿əv rɪˈvjuz, ʃi hæz kənˈsɪstəntli ɪkˈsidɪd hɝ ˈtɑrɡɪts/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 3, "vi": "Tôi đề xuất thử thách 3 tháng trước khi chốt vai trò quản lý.", "en": "I recommend a three-month trial period before confirming any management promotion.", "ipa": "/aɪ ˌrɛkəˈmɛnd‿ə θri mʌnθ ˈtraɪəl ˈpɪriəd bɪˈfɔr kənˈfɝmɪŋ‿ˈɛni ˈmænɪdʒmənt prəˈmoʊʃən/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 3, "vi": "Tôi đề nghị cho bạn ấy dẫn 1 dự án nhỏ để tăng tự tin.", "en": "I'd suggest letting her lead a small project first to build confidence.", "ipa": "/aɪd səˈdʒɛst ˈlɛɾɪŋ hɝ lid‿ə smɔl ˈprɑdʒɛkt fɝst tə bɪld ˈkɑnfədəns/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 3, "vi": "Theo tôi, chuyên môn giỏi chưa chắc quản lý giỏi.", "en": "In my view, a great specialist doesn't always make a great manager.", "ipa": "/ɪn maɪ vju, ə ɡreɪt ˈspɛʃəlɪst ˈdʌzənt‿ˈɔlˌweɪz meɪk‿ə ɡreɪt ˈmænɪdʒɚ/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 3, "vi": "Tôi hiểu, nhưng thăng chức quá sớm có thể phản tác dụng với mọi người.", "en": "I see your point, but promoting too early could backfire on everyone.", "ipa": "/aɪ si jɚ pɔɪnt, bət prəˈmoʊɾɪŋ tu ˈɝli kʊd ˈbækˌfaɪɚ‿ɑn‿ˈɛvriˌwʌn/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 3, "vi": "Có lẽ nên có lộ trình chuyên gia song song lộ trình quản lý.", "en": "It might be worth creating an expert track alongside the management track.", "ipa": "/ɪt maɪt bi wɝθ kriˈeɪɾɪŋ‿ən‿ˈɛkspɚt træk‿əˌlɔŋˈsaɪd ðə ˈmænɪdʒmənt træk/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 4, "vi": "Chúng ta chuyển sang danh sách đề cử, vì có 8 hồ sơ cần duyệt.", "en": "Let's turn to the nomination list, since we have eight cases to review.", "ipa": "/lɛts tɝn tə ðə ˌnɑməˈneɪʃən lɪst, sɪns wi hæv‿eɪt ˈkeɪsɪz tə rɪˈvju/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 4, "vi": "Bạn trình bày lý do đề cử và kết quả của từng người nhé?", "en": "Would you mind going over each nominee's case and their recent results?", "ipa": "/wʊd ju maɪnd ˈɡoʊɪŋ‿ˈoʊvɚ‿itʃ ˌnɑməˈniz keɪs‿ən ðɛr ˈrisənt rɪˈzʌlts/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 4, "vi": "Tôi muốn nêu lo ngại: 3 người được đề cử chưa có người kế nhiệm.", "en": "I'd like to raise a concern: three nominees have no successor for their roles.", "ipa": "/aɪd laɪk tə reɪz‿ə kənˈsɝn: θri ˌnɑməˈniz həv noʊ səkˈsɛsɚ fɚ ðɛr roʊlz/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 4, "vi": "Tôi hiểu bạn ấy rất giỏi, tuy nhiên chưa đủ 12 tháng ở vị trí này.", "en": "I get that she's excellent; however, she hasn't completed 12 months in her role.", "ipa": "/aɪ ɡɛt ðæt ʃiz‿ˈɛksələnt; haʊˈɛvɚ, ʃi ˈhæzənt kəmˈpliɾɪd twɛlv mʌnθs‿ɪn hɝ roʊl/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 4, "vi": "Hay chúng ta giao vai trò quyền trưởng nhóm trong 3 tháng?", "en": "Would it help if we make her acting team leader for three months first?", "ipa": "/wʊd‿ɪt hɛlp‿ɪf wi meɪk hɝ‿ˈæktɪŋ tim ˈlidɚ fɚ θri mʌnθs fɝst/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 4, "vi": "Không thể tăng lương ngay, nhưng có thể đổi chức danh từ tháng sau.", "en": "We can't give a raise now, but we can change her title next month.", "ipa": "/wi kænt ɡɪv‿ə reɪz naʊ, bət wi kən tʃeɪndʒ hɚ ˈtaɪɾəl nɛkst mʌnθ/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 4, "vi": "Tóm lại, 5 hồ sơ được duyệt, 3 hồ sơ xem lại kỳ sau.", "en": "To wrap up, five nominations are approved, and three will be reviewed next cycle.", "ipa": "/tu ræp‿ʌp, faɪv ˌnɑməˈneɪʃənz‿ɚ‿əˈpruvd, ən θri wɪl bi rɪˈvjud nɛkst ˈsaɪkəl/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 4, "vi": "Sau buổi họp này, HR gửi quyết định và gặp từng người trước thứ Sáu.", "en": "After this meeting, HR will issue the letters and meet each person before Friday.", "ipa": "/ˈæftɚ ðɪs ˈmiɾɪŋ, ˌeɪtʃˈɑr wɪl‿ˈɪʃu ðə ˈlɛɾɚz‿ən miɾ‿itʃ ˈpɝsən bɪˈfɔr ˈfraɪdeɪ/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 5, "vi": "Thật lòng, thăng chức người giỏi chuyên môn có thể mất chuyên gia và tạo ra quản lý yếu.", "en": "Honestly, promoting our best specialist may lose an expert and create a weak manager.", "ipa": "/ˈɑnəstli, prəˈmoʊɾɪŋ‿aʊɚ bɛst ˈspɛʃələst meɪ luz‿ən‿ˈɛkspɚt‿ən kriˈeɪt‿ə wik ˈmænədʒɚ/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 5, "vi": "Theo kinh nghiệm, thăng chức thiếu tiêu chí rõ ràng dễ gây bất mãn cả nhóm.", "en": "What I've seen is that promotions without clear criteria create resentment across the team.", "ipa": "/wʌt‿aɪv sin‿ɪz ðət prəˈmoʊʃənz wɪˈθaʊt klɪr kraɪˈtɪriə kriˈeɪt rɪˈzɛntmənt‿əˈkrɔs ðə tim/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 5, "vi": "Mấu chốt là thăng chức nên dựa trên tiềm năng, không chỉ thành tích cũ.", "en": "The bottom line is that promotion should reward future potential, not just past performance.", "ipa": "/ðə ˈbɑɾəm laɪn‿ɪz ðæt prəˈmoʊʃən ʃʊd rɪˈwɔrd ˈfjutʃɚ pəˈtɛnʃəl, nɑt dʒʌst pæst pɚˈfɔrməns/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 5, "vi": "Rủi ro lớn nhất là người không được thăng chức mất động lực và tìm việc khác.", "en": "The biggest risk is that people who aren't promoted lose motivation and look elsewhere.", "ipa": "/ðə ˈbɪɡəst rɪsk‿ɪz ðət ˈpipəl hu ˈɑrənt prəˈmoʊɾɪd luz ˌmoʊɾəˈveɪʃən‿ən lʊk‿ˈɛlˌswɛr/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 5, "vi": "Nếu không giải thích rõ quyết định, tin đồn sẽ lan ra chỉ sau vài ngày.", "en": "If we don't explain the decision clearly, rumors will fill the gap within days.", "ipa": "/ɪf wi doʊnt‿ɪkˈspleɪn ðə dɪˈsɪʒən ˈklɪrli, ˈrumɚz wɪl fɪl ðə ɡæp wɪˈðɪn deɪz/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 5, "vi": "Tôi phản đối thăng chức chỉ dựa vào thâm niên, vì nó gửi sai thông điệp.", "en": "I'd push back on promoting based on seniority alone; it sends the wrong message.", "ipa": "/aɪd pʊʃ bæk‿ɑn prəˈmoʊɾɪŋ beɪst‿ɑn siˈnjɔrɪti əˈloʊn; ɪt sɛndz ðə rɔŋ ˈmɛsədʒ/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 5, "vi": "Điều tôi lo nhất là quản lý mới không được đào tạo trước khi dẫn dắt nhóm.", "en": "What worries me is that new managers get no training before leading a team.", "ipa": "/wʌt ˈwɝiz mi ɪz ðət nu ˈmænədʒɚz ɡɛt noʊ ˈtreɪnɪŋ bɪˈfɔr ˈlidɪŋ‿ə tim/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 5, "vi": "Tôi đề xuất thử thách 3 tháng có kèm cặp trước khi chính thức thăng chức quản lý.", "en": "My suggestion is a three-month trial with coaching before confirming any management promotion.", "ipa": "/maɪ səɡˈdʒɛstʃən‿ɪz‿ə θri mʌnθ ˈtraɪəl wɪθ ˈkoʊtʃɪŋ bɪˈfɔr kənˈfɝmɪŋ‿ˈɛni ˈmænɪdʒmənt prəˈmoʊʃən/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 6, "vi": "Thăng chức là để ghi nhận tương lai, không chỉ quá khứ.", "en": "Promotion recognizes potential, not just the past.", "ipa": "/prəˈmoʊʃən ˈrɛkəɡˌnaɪzɪz pəˈtɛnʃəl, nɑt dʒʌst ðə pæst/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 6, "vi": "Chức danh mới đi kèm trách nhiệm mới.", "en": "A new title comes with new responsibilities.", "ipa": "/ə nu ˈtaɪɾəl kʌmz wɪθ nu rɪˌspɑnsəˈbɪləɾiz/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 6, "vi": "80% vị trí quản lý năm nay tuyển từ bên ngoài, cho thấy nguồn kế cận nội bộ đang mỏng.", "en": "80% of manager roles were filled externally this year; our internal pipeline is thin.", "ipa": "/ˈeɪɾi pərˈsɛnt‿əv ˈmænədʒɚ roʊlz wɚ fɪld‿ɪkˈstɝnəli ðɪs jɪr; aʊɚ ˌɪnˈtɝnəl ˈpaɪˌplaɪn‿ɪz θɪn/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 6, "vi": "Không thấy lộ trình rõ ràng, người giỏi nhất sẽ tìm cơ hội thăng tiến ở nơi khác.", "en": "Without a visible career path, our best people will look for promotion elsewhere.", "ipa": "/wɪˈθaʊɾ‿ə ˈvɪzəbəl kəˈrɪr pæθ, ˈaʊɚ bɛst ˈpipəl wɪl lʊk fɚ prəˈmoʊʃən‿ˈɛlsˌwɛr/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 6, "vi": "Phát triển con người là trách nhiệm của quản lý.", "en": "Growing people is a manager's job.", "ipa": "/ˈɡroʊɪŋ ˈpipəl‿ɪz‿ə ˈmænɪdʒɚz dʒɑb/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 6, "vi": "Các công ty dẫn đầu lấp khoảng 60% vị trí quản lý bằng nguồn nội bộ.", "en": "Leading companies fill around 60% of management roles from within.", "ipa": "/ˈlidɪŋ ˈkʌmpəniz fɪl‿əˈraʊnd ˈsɪksti pɚˈsɛnt‿əv ˈmænɪdʒmənt roʊlz frəm wɪˈθɪn/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 6, "vi": "Tôi đề xuất chương trình quản lý kế cận 12 tháng cho 15 người, chi phí khoảng 300 triệu.", "en": "I propose a 12-month future leaders program for 15 people, about 300 million VND.", "ipa": "/aɪ prəˈpoʊz‿ə twɛlv mʌnθ ˈfjutʃɚ ˈlidɚz ˈproʊˌɡræm fɚ fɪfˈtin ˈpipəl, əˈbaʊt θri ˈhʌndrəd ˈmɪljən vi ɛn di/"}, {"topicRaw": "12-Promotion", "topicName": "Promotion", "topicOrder": 12, "stage": 6, "vi": "Trong 2 năm, mục tiêu là một nửa vị trí quản lý được lấp từ bên trong.", "en": "Within two years, we aim to fill half of all management roles internally.", "ipa": "/wɪˈθɪn tu jɪrz, wi eɪm tə fɪl hæf‿əv‿ɔl ˈmænɪdʒmənt roʊlz‿ˌɪnˈtɝnəli/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 1, "vi": "Tỷ lệ nghỉ việc tự nguyện năm nay là 18%, cao nhất 3 năm qua.", "en": "Voluntary turnover this year is 18%, the highest in three years.", "ipa": "/ˈvɑlənˌtɛri ˈtɝˌnoʊvɚ ðɪs jɪr‿ɪz‿eɪˈtin pɚˈsɛnt, ðə ˈhaɪɪst‿ɪn θri jɪrz/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 1, "vi": "Phần lớn người nghỉ cho biết lương chưa cạnh tranh và ít cơ hội phát triển.", "en": "Most leavers cite uncompetitive pay and limited growth opportunities.", "ipa": "/moʊst ˈlivɚz saɪɾ‿ənkəmˈpɛɾəɾɪv peɪ ən ˈlɪmɪɾɪd ɡroʊθ‿ˌɑpɚˈtunəɾiz/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 1, "vi": "Bạn có biết ai trong team đang được đối thủ tiếp cận không?", "en": "Do you know if anyone on your team is being approached by competitors?", "ipa": "/du ju noʊ ɪf‿ˈɛniˌwʌn‿ɑn jɚ tim‿ɪz ˈbiɪŋ‿əˈproʊtʃt baɪ kəmˈpɛɾɪɾɚz/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 1, "vi": "Điều gì sẽ khiến bạn muốn gắn bó với công ty thêm 2 năm nữa?", "en": "What would make you want to stay with us for another two years?", "ipa": "/wʌt wʊd meɪk ju wɑnt tə steɪ wɪθ‿əs fɚ‿əˈnʌðɚ tu jɪrz/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 1, "vi": "Vui lòng hoàn thành phỏng vấn nghỉ việc trước ngày làm việc cuối cùng.", "en": "Please complete the exit interview before your last working day.", "ipa": "/pliz kəmˈplit ði ˈɛɡzɪɾ‿ˈɪntɚvju bɪˈfɔr jɚ læst ˈwɝkɪŋ deɪ/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 1, "vi": "Vui lòng bảo mật tuyệt đối danh sách nhân sự chủ chốt.", "en": "Please keep the key talent list strictly confidential.", "ipa": "/pliz kip ðə ki ˈtælənt lɪst ˈstrɪktli ˌkɑnfɪˈdɛnʃəl/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 1, "vi": "Xin lỗi vì chúng tôi phản hồi đề nghị xét lương của bạn chậm.", "en": "Sorry we were slow to respond to your salary review request.", "ipa": "/ˈsɑri wi wɚ sloʊ tə rɪˈspɑnd tə jɚ ˈsæləri rɪˈvju rɪˈkwɛst/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 1, "vi": "Tôi sẽ gửi bạn đề xuất giữ chân trong tuần này để bạn cân nhắc.", "en": "I'll send you a retention proposal this week for your consideration.", "ipa": "/aɪl sɛnd ju ə rɪˈtɛnʃən prəˈpoʊzəl ðɪs wik fɚ jɚ kənˌsɪdəˈreɪʃən/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 2, "vi": "Theo chính sách, thưởng giữ chân chỉ chi khi bạn làm đủ thời gian cam kết.", "en": "Under our policy, retention bonuses are only paid if you complete the commitment period.", "ipa": "/ˈʌndɚ aʊɚ ˈpɑləsi, riˈtɛnʃən ˈboʊnəsɪz‿ɚ ˈoʊnli peɪd‿ɪf ju kəmˈplit ðə kəˈmɪtmənt ˈpɪriəd/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 2, "vi": "Khi nhân sự chủ chốt nộp đơn, HR và quản lý gặp nhau trong 48 giờ để tìm phương án.", "en": "If key talent resigns, HR and the manager meet within 48 hours.", "ipa": "/ɪf ki ˈtælənt rɪˈzaɪnz, eɪtʃ ɑr‿ən ðə ˈmænədʒɚ mit wɪˈðɪn ˈfɔrɾi eɪt‿ˈaʊɚz/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 2, "vi": "Bạn có thể xếp hạng nhân viên của mình theo mức rủi ro nghỉ việc không?", "en": "Could you rank your team members by their flight risk?", "ipa": "/kʊd ju ræŋk jɚ tim ˈmɛmbɚz baɪ ðɛr flaɪt rɪsk/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 2, "vi": "Bạn có phiền có buổi trò chuyện giữ chân với 3 người này trong tháng không?", "en": "Would you mind holding stay conversations with these three people this month?", "ipa": "/wʊd ju maɪnd ˈhoʊldɪŋ steɪ ˌkɑnvɚˈseɪʃənz wɪθ ðiz θri ˈpipəl ðɪs mʌnθ/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 2, "vi": "Chúng tôi ưu tiên nhóm này vì lương của họ thấp hơn thị trường gần 20%.", "en": "We're prioritizing this group because they're paid nearly 20% below market.", "ipa": "/wɪr praɪˈɔrəˌtaɪzɪŋ ðɪs ɡrup bɪˈkɔz ðɛr peɪd ˈnɪrli ˈtwɛnti pɚˈsɛnt bɪˈloʊ ˈmɑrkɪt/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 2, "vi": "Nếu không đưa offer giữ chân trong 3 ngày, anh ấy sẽ nhận việc mới.", "en": "If we don't make a counteroffer within three days, he'll accept the new job.", "ipa": "/ɪf wi doʊnt meɪk‿ə ˈkaʊntɚˌɔfɚ wɪˈðɪn θri deɪz, hil‿ækˈsɛpt ðə nu dʒɑb/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 2, "vi": "Rất tiếc, chúng tôi không thể đáp ứng mức offer bạn đã nhận.", "en": "Unfortunately, we're unable to match the offer you've received.", "ipa": "/ʌnˈfɔrtʃənətli, wɪr‿əˈneɪbəl tə mætʃ ði ˈɔfɚ juv rɪˈsivd/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 2, "vi": "Tôi sẽ cập nhật danh sách rủi ro nghỉ việc mỗi quý và gửi ban lãnh đạo.", "en": "I'll refresh the flight-risk list every quarter and share it with the leadership team.", "ipa": "/aɪl rɪˈfrɛʃ ðə flaɪt rɪsk lɪst‿ˈɛvri ˈkwɔrtɚ‿ən ʃɛr‿ɪt wɪθ ðə ˈlidɚˌʃɪp tim/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 3, "vi": "Để tôi giải thích chương trình phát triển nhân tài năm nay.", "en": "Let me explain how this year's talent development program will work.", "ipa": "/lɛt mi ɪkˈspleɪn haʊ ðɪs jɪrz ˈtælənt dɪˈvɛləpmənt ˈproʊɡræm wɪl wɝk/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 3, "vi": "Để tôi làm rõ: vào nhóm nhân tài chưa phải thăng chức ngay.", "en": "Let me clarify: joining the talent pool doesn't mean an immediate promotion.", "ipa": "/lɛt mi ˈklɛrəˌfaɪ: ˈdʒɔɪnɪŋ ðə ˈtælənt pul ˈdʌzənt min‿ən‿ɪˈmidiət prəˈmoʊʃən/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 3, "vi": "Theo dữ liệu, 60% người nghỉ việc là trong năm đầu.", "en": "Based on our data, 60% of resignations happen within the first year.", "ipa": "/beɪst‿ɑn‿ˈaʊɚ ˈdeɪɾə, ˈsɪksti pɚˈsɛnt‿əv ˌrɛzɪɡˈneɪʃənz ˈhæpən wɪˈθɪn ðə fɝst jɪr/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 3, "vi": "Tôi đề xuất phỏng vấn giữ chân với 20 người chủ chốt trong quý này.", "en": "I recommend stay interviews with our 20 most critical employees this quarter.", "ipa": "/aɪ ˌrɛkəˈmɛnd steɪ ˈɪntɚvjuz wɪθ‿ˈaʊɚ ˈtwɛnti moʊst ˈkrɪɾɪkəl‿ɪmˈplɔɪiz ðɪs ˈkwɔrɾɚ/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 3, "vi": "Tôi đề nghị so sánh lương kỹ sư với thị trường trước kỳ xét lương.", "en": "I'd suggest benchmarking our engineers' salaries against the market before reviews.", "ipa": "/aɪd səˈdʒɛst ˈbɛntʃmɑrkɪŋ‿ˈaʊɚ‿ˌɛndʒəˈnɪrz ˈsæləriz‿əˈɡɛnst ðə ˈmɑrkɪt bɪˈfɔr rɪˈvjuz/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 3, "vi": "Theo tôi, người ta nghỉ vì quản lý nhiều hơn vì lương.", "en": "In my view, people leave managers more often than they leave salaries.", "ipa": "/ɪn maɪ vju, ˈpipəl liv ˈmænɪdʒɚz mɔr‿ˈɔfən ðən ðeɪ liv ˈsæləriz/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 3, "vi": "Tôi hiểu, nhưng tăng lương không giải quyết mọi lý do nghỉ.", "en": "I see your point, but a raise won't fix every reason people leave.", "ipa": "/aɪ si jɚ pɔɪnt, bəɾ‿ə reɪz woʊnt fɪks‿ˈɛvri ˈrizən ˈpipəl liv/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 3, "vi": "Có lẽ nên cho người giỏi luân chuyển sang dự án mới mỗi năm.", "en": "It might be worth rotating top performers into new projects every year.", "ipa": "/ɪt maɪt bi wɝθ ˈroʊˌteɪɾɪŋ tɑp pɚˈfɔrmɚz‿ˈɪntu nu ˈprɑdʒɛkts‿ˈɛvri jɪr/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 4, "vi": "Chúng ta chuyển sang báo cáo nghỉ việc, vì tỷ lệ đang tăng.", "en": "Next, let's look at the turnover report, because the rate keeps rising.", "ipa": "/nɛkst, lɛts lʊk‿ət ðə ˈtɝˌnoʊvɚ rɪˈpɔrt, bɪˈkɔz ðə reɪt kips ˈraɪzɪŋ/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 4, "vi": "Bạn trình bày lý do nghỉ việc chính trong quý này nhé?", "en": "Could you walk us through the main reasons people left this quarter?", "ipa": "/kʊd ju wɔk‿əs θru ðə meɪn ˈrizənz ˈpipəl lɛft ðɪs ˈkwɔrɾɚ/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 4, "vi": "Tôi muốn lưu ý một điểm: 3 kỹ sư giỏi nhất đang bị headhunter tiếp cận.", "en": "I want to flag one issue: headhunters are approaching our three best engineers.", "ipa": "/aɪ wɑnt tə flæɡ wʌn‿ˈɪʃu: ˈhɛdˌhʌntɚz‿ɚ əˈproʊtʃɪŋ‿aʊɚ θri bɛst‿ˈɛndʒəˈnɪrz/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 4, "vi": "Tôi hiểu ngân sách eo hẹp, tuy nhiên mất người giỏi còn tốn hơn.", "en": "I appreciate that the budget is tight; however, losing top talent costs even more.", "ipa": "/aɪ əˈpriʃiˌeɪt ðæt ðə ˈbʌdʒɪɾ‿ɪz taɪt; haʊˈɛvɚ, ˈluzɪŋ tɑp ˈtælənt kɔsts‿ˈivən mɔr/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 4, "vi": "Hay chúng ta có thưởng giữ chân cho vị trí chủ chốt?", "en": "What if we introduced a retention bonus for the most critical roles?", "ipa": "/wʌɾ‿ɪf wi ˌɪntrəˈdust‿ə rɪˈtɛnʃən ˈboʊnəs fɚ ðə moʊst ˈkrɪɾɪkəl roʊlz/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 4, "vi": "Không thể tăng lương cho tất cả, nhưng có thể ưu tiên 10 người.", "en": "We can't give everyone a raise, but we can prioritize ten key people.", "ipa": "/wi kænt ɡɪv‿ˈɛvriˌwʌn‿ə reɪz, bət wi kən praɪˈɔrəˌtaɪz tɛn ki ˈpipəl/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 4, "vi": "Tóm lại, chúng ta tập trung giữ 10 người chủ chốt trong 6 tháng tới.", "en": "To recap, we'll focus on keeping ten key people over the next six months.", "ipa": "/tə ˈriˌkæp, wil ˈfoʊkəs‿ɑn ˈkipɪŋ tɛn ki ˈpipəl‿ˈoʊvɚ ðə nɛkst sɪks mʌnθs/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 4, "vi": "Bước tiếp theo: mỗi quản lý gặp người chủ chốt trước cuối tháng.", "en": "Next step: each manager will meet their key people before month-end.", "ipa": "/nɛkst stɛp: itʃ ˈmænɪdʒɚ wɪl mit ðɛr ki ˈpipəl bɪˈfɔr mʌnθ‿ɛnd/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 5, "vi": "Thật lòng, ta thường chỉ biết người giỏi không vui khi họ đã nộp đơn.", "en": "Honestly, we usually notice an unhappy top performer only after they've resigned.", "ipa": "/ˈɑnəstli, wi ˈjuʒəwəli ˈnoʊɾəs‿ən‿ənˈhæpi tɑp pɚˈfɔrmɚ ˈoʊnli ˈæftɚ ðeɪv rɪˈzaɪnd/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 5, "vi": "Theo kinh nghiệm, người ta đến vì lương nhưng ở lại vì quản lý trực tiếp.", "en": "From my experience, people join for the salary but stay for their direct manager.", "ipa": "/frəm maɪ ɪkˈspɪriəns, ˈpipəl dʒɔɪn fɚ ðə ˈsælɚi bət steɪ fɚ ðɛr dɚˈɛkt ˈmænədʒɚ/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 5, "vi": "Suy cho cùng, giữ một người giỏi rẻ hơn nhiều so với tuyển người thay thế.", "en": "Ultimately, keeping a strong employee costs far less than replacing one.", "ipa": "/ˈʌltəmətli, ˈkipɪŋ‿ə strɔŋ‿ɛmˈplɔɪi kɑsts fɑr lɛs ðæn rɪˈpleɪsɪŋ wʌn/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 5, "vi": "Điều tôi lo là kỹ sư chủ chốt đang được headhunter liên hệ hằng tuần.", "en": "My main worry is that headhunters contact our key engineers every week.", "ipa": "/maɪ meɪn ˈwɝi ɪz ðət ˈhɛdˌhʌntɚz ˈkɑnˌtækt‿aʊɚ ki ˈɛndʒəˈnɪrz‿ˈɛvri wik/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 5, "vi": "Nếu không có lộ trình rõ ràng, người có tham vọng sẽ phát triển ở nơi khác.", "en": "Without clear career paths, ambitious people will build their careers elsewhere.", "ipa": "/wɪˈθaʊt klɪr kɚˈɪr pæðz, æmˈbɪʃəs ˈpipəl wɪl bɪld ðɛr kɚˈɪrz‿ˈɛlˌswɛr/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 5, "vi": "Tôi e ngại luôn trả theo offer mới, vì như vậy là khuyến khích dọa nghỉ.", "en": "I'm not comfortable with matching every counteroffer, because it teaches people that resigning works.", "ipa": "/aɪm nɑt ˈkʌmftɚbəl wɪθ ˈmætʃɪŋ‿ˈɛvri ˈkaʊntɚˌɔfɚ, bɪˈkɔz‿ɪt ˈtitʃɪz ˈpipəl ðæt rɪˈzaɪnɪŋ wɝks/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 5, "vi": "Điều tôi lo nhất là 3 vị trí then chốt chưa có người kế nhiệm.", "en": "My biggest concern is that we have no successor for three critical positions.", "ipa": "/maɪ ˈbɪɡɪst kənˈsɝn‿ɪz ðæt wi hæv noʊ səkˈsɛsɚ fɚ θri ˈkrɪɾɪkəl pəˈzɪʃənz/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 5, "vi": "Tôi đề xuất trò chuyện giữ chân định kỳ với người giỏi, bắt đầu từ khối kỹ thuật.", "en": "My recommendation is regular stay interviews with top performers, starting with the engineering team.", "ipa": "/maɪ ˌrɛkəmɛnˈdeɪʃən‿ɪz ˈrɛɡjəlɚ steɪ ˈɪntɚvjuz wɪθ tɑp pɚˈfɔrmɚz, ˈstɑrɾɪŋ wɪθ ði ˌɛndʒəˈnɪrɪŋ tim/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 6, "vi": "Người ta rời bỏ sếp, không phải công ty.", "en": "People leave managers, not companies.", "ipa": "/ˈpipəl liv ˈmænɪdʒɚz, nɑt ˈkʌmpəniz/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 6, "vi": "Giữ người cũ rẻ hơn tuyển người mới.", "en": "Keeping people is cheaper than replacing them.", "ipa": "/ˈkipɪŋ ˈpipəl‿ɪz ˈtʃipɚ ðən rɪˈpleɪsɪŋ ðɛm/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 6, "vi": "Mỗi người giỏi nghỉ việc khiến chúng ta tốn khoảng 6 tháng lương để tuyển và đào tạo người thay.", "en": "Every top performer who leaves costs roughly six months' salary to replace and onboard.", "ipa": "/ˈɛvri tɑp pɚˈfɔrmɚ hu livz kɑsts ˈrʌfli sɪks mɑnθs ˈsælɚi tə ˌriˈpleɪs‿ən‿ˈɑnˌbɔrd/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 6, "vi": "Với tỷ lệ 18%, mỗi năm chúng ta mất gần 4 tỷ đồng chỉ riêng cho chi phí thay thế.", "en": "At 18% turnover, replacement costs alone reach nearly 4 billion VND a year.", "ipa": "/ət‿eɪˈtin pərˈsɛnt ˈtɝˌnoʊvɚ, rɪˈpleɪsmənt kɑsts‿əˈloʊn ritʃ ˈnɪrli fɔr ˈbɪljən vi ɛn di ə jɪr/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 6, "vi": "Đào tạo họ đủ tốt để họ có thể ra đi.", "en": "Train people well enough so they can leave.", "ipa": "/treɪn ˈpipəl wɛl‿ɪˈnʌf soʊ ðeɪ kən liv/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 6, "vi": "Mức trung bình ngành là 12%, tức chúng ta đang cao hơn 6 điểm phần trăm.", "en": "The industry average is 12%, which puts us six percentage points higher.", "ipa": "/ði ˈɪndəstri ˈævərɪdʒ‿ɪz twɛlv pɚˈsɛnt, wɪtʃ pʊts‿əs sɪks pɚˈsɛntədʒ pɔɪnts ˈhaɪɚ/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 6, "vi": "Tôi đề xuất quỹ điều chỉnh lương 1,5 tỷ cho 30 người chủ chốt, rẻ hơn nhiều so với tuyển thay.", "en": "I propose a 1.5 billion VND adjustment fund for 30 key people; it's cheaper.", "ipa": "/aɪ prəˈpoʊz‿ə wʌn pɔɪnt faɪv ˈbɪljən vi ɛn di əˈdʒʌstmənt fʌnd fɚ ˈθɝɾi ki ˈpipəl; ɪts ˈtʃipɚ/"}, {"topicRaw": "13-Talent & Retention", "topicName": "Talent & Retention", "topicOrder": 13, "stage": 6, "vi": "Mục tiêu năm tới là đưa tỷ lệ nghỉ việc về 12% và giữ 95% nhân sự chủ chốt.", "en": "We aim to bring turnover down to 12% and retain 95% of key talent.", "ipa": "/wi eɪm tə brɪŋ ˈtɝˌnoʊvɚ daʊn tə twɛlv pərˈsɛnt‿ən rɪˈteɪn ˈnaɪnti faɪv pərˈsɛnt‿əv ki ˈtælənt/"}, {"topicRaw": "14-Benefits", "topicName": "Benefits", "topicOrder": 14, "stage": 1, "vi": "Gói bảo hiểm sức khỏe mới bao gồm nha khoa và khám thai.", "en": "The new health plan covers dental care and maternity check-ups.", "ipa": "/ðə nu hɛlθ plæn ˈkʌvɚz ˈdɛntəl kɛr‿ən məˈtɝnəɾi tʃɛk‿ʌps/"}, {"topicRaw": "14-Benefits", "topicName": "Benefits", "topicOrder": 14, "stage": 1, "vi": "Nhân viên được mua thêm bảo hiểm cho vợ/chồng và con với giá ưu đãi.", "en": "Employees can add z/"}, {"topicRaw": "14-Benefits", "topicName": "Benefits", "topicOrder": 14, "stage": 2, "vi": "Phí bảo hiểm nhân thọ có tích lũy công ty mua cho nhân viên phải chịu thuế TNCN.", "en": "Company-paid life insurance premiums with a savings component are taxable for PIT.", "ipa": "/ˈkʌmpəˌni peɪd laɪf‿ˌɪnˈʃʊrəns ˈprimiəmz wɪθ‿ə ˈseɪvɪŋz kəmˈpoʊnənt‿ɚ ˈtæksəbəl fɚ pi aɪ ti/"}, {"topicRaw": "14-Benefits", "topicName": "Benefits", "topicOrder": 14, "stage": 2, "vi": "Đăng ký phúc lợi mở mỗi năm một lần, trừ các sự kiện như kết hôn hay sinh con.", "en": "Enrollment opens once a year, except for life events like marriage or childbirth.", "ipa": "/ɛnˈroʊlmənt‿ˈoʊpənz wʌns‿ə jɪr, ɪkˈsɛpt fɚ laɪf‿ɪˈvɛnts laɪk ˈmɛrɪdʒ‿ɚ ˈtʃaɪldˌbɝθ/"}, {"topicRaw": "14-Benefits", "topicName": "Benefits", "topicOrder": 14, "stage": 2, "vi": "Bạn có thể gửi bảng so sánh quyền lợi giữa gói cũ và gói mới không?", "en": "Could you send a side-by-side comparison of the old and new plans?", "ipa": "/kʊd ju sɛnd‿ə ˈsaɪdbaɪˈsaɪd kəmˈpɛrɪsən‿əv ði oʊld‿ən nu plænz/"}, {"topicRaw": "14-Benefits", "topicName": "Benefits", "topicOrder": 14, "stage": 2, "vi": "Bạn có phiền nhắc team cập nhật thông tin người phụ thuộc không?", "en": "Would you mind reminding your team to update their dependent details?", "ipa": "/wʊd ju maɪnd rɪˈmaɪndɪŋ jɚ tim tu ʌpˈdeɪt ðɛr dɪˈpɛndənt ˈditeɪlz/"}, {"topicRaw": "14-Benefits", "topicName": "Benefits", "topicOrder": 14, "stage": 2, "vi": "Phí bảo hiểm năm sau tăng vì tỷ lệ bồi thường năm nay vượt 85%.", "en": "Next year's premium is rising because our claims ratio exceeded 85% this year.", "ipa": "/nɛkst jɪrz ˈprimiəm‿ɪz ˈraɪzɪŋ bɪˈkɔz‿ˈaʊɚ kleɪmz ˈreɪʃiˌoʊ ɪkˈsidɪd‿ˈeɪɾi faɪv pɚˈsɛnt ðɪs jɪr/"}, {"topicRaw": "14-Benefits", "topicName": "Benefits", "topicOrder": 14, "stage": 2, "vi": "Nếu nghỉ việc giữa năm, bảo hiểm sức khỏe của bạn còn hiệu lực đến hết tháng đó.", "en": "If you leave mid-year, your health cover stays valid until month-end.", "ipa": "/ɪf ju liv mɪd jɪr, jɚ hɛl
