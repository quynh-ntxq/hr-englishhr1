<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>C&B English Coach - Luyện tiếng Anh HR/Payroll</title>
<meta name="theme-color" content="#0B3D5C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --navy:#0B3D5C;
    --navy-dark:#062638;
    --accent:#0F9D8C;
    --green:#1DB954;
    --orange:#E08A00;
    --bg1:#08283D;
    --bg2:#136B7A;
    --card:#ffffff;
    --text:#1f2430;
    --muted:#8a90a2;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    font-family:'Inter',system-ui,sans-serif;
    background:
      radial-gradient(circle at 15% 10%, rgba(255,255,255,0.10), transparent 40%),
      radial-gradient(circle at 90% 85%, rgba(255,255,255,0.08), transparent 45%),
      linear-gradient(135deg, var(--bg1), var(--bg2));
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding: clamp(10px, 4vw, 30px);
  }

  .app{
    width:100%;
    max-width:760px;
    margin-top: clamp(6px, 2vh, 24px);
  }

  .card{
    background: var(--card);
    border-radius: 24px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.25), 0 4px 12px rgba(0,0,0,0.08);
    padding: clamp(18px, 4vw, 34px);
    overflow:hidden;
    position:relative;
  }

  .brand{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-bottom: 4px;
  }
  .brand .logo-dot{
    width:14px;height:14px;border-radius:50%;
    background: linear-gradient(135deg, var(--accent), #ff8a00);
    flex-shrink:0;
  }
  .brand h1{
    font-family:'Poppins',sans-serif;
    font-weight:800;
    letter-spacing:0.5px;
    font-size: clamp(1.3em, 4.5vw, 1.7em);
    color: var(--navy);
    margin:0;
  }
  .subtitle{
    text-align:center;
    color: var(--muted);
    font-size: clamp(0.82em, 2.6vw, 0.95em);
    margin: 2px 0 18px;
  }

  /* SETTINGS GEAR + PANEL */
  .settings-toggle{
    position:absolute;
    top: clamp(14px, 3vw, 22px);
    right: clamp(14px, 3vw, 22px);
    width:36px;height:36px;
    border-radius:50%;
    border:none;
    background:#f0f1f6;
    color:var(--navy);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1em;
    transition: transform .3s ease, background .2s ease;
    z-index:2;
  }
  .settings-toggle.open{ transform: rotate(75deg); background:var(--navy); color:#fff; }

  .settings-panel{
    max-height:0;
    opacity:0;
    overflow:hidden;
    transition: max-height .3s ease, opacity .25s ease, margin .3s ease;
    background:#f7f8fd;
    border-radius:16px;
  }
  .settings-panel.open{
    max-height:420px;
    opacity:1;
    margin-bottom:16px;
    padding: 14px 16px;
  }
  .settings-row{ margin-bottom:12px; }
  .settings-row:last-child{ margin-bottom:0; }
  .settings-row label{
    display:block;
    font-size:0.78em;
    font-weight:600;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.05em;
    margin-bottom:6px;
  }
  .settings-row select{
    width:100%;
    padding:9px 10px;
    border-radius:10px;
    border:1.5px solid #e2e5f0;
    background:#fff;
    color:var(--text);
    font-size:0.85em;
    font-family:'Inter',sans-serif;
  }
  .settings-row select:disabled{ color:var(--muted); }
  .speed-options{ display:flex; gap:8px; }
  .speed-btn, .speed-btn-en{
    flex:1;
    border:1.5px solid #e2e5f0;
    background:#fff;
    color:#3a4160;
    font-weight:600;
    font-size:0.82em;
    padding:8px 6px;
    border-radius:10px;
    cursor:pointer;
    transition: all .15s ease;
  }
  .speed-btn.active, .speed-btn-en.active{
    background: var(--navy);
    border-color: var(--navy);
    color:#fff;
  }

  .speed-value-label{
    font-weight:700;
    color: var(--navy);
    margin-left:4px;
    text-transform:none;
  }
  .speed-slider{
    width:100%;
    height:6px;
    border-radius:999px;
    outline:none;
    appearance:none;
    -webkit-appearance:none;
    background: linear-gradient(to right, var(--navy) 0%, var(--navy) var(--fill, 50%), #e2e5f0 var(--fill, 50%), #e2e5f0 100%);
    margin-top:8px;
    cursor:pointer;
  }
  .speed-slider::-webkit-slider-thumb{
    appearance:none;
    -webkit-appearance:none;
    width:20px;height:20px;
    border-radius:50%;
    background:#fff;
    border:3px solid var(--navy);
    cursor:pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }
  .speed-slider::-moz-range-thumb{
    width:20px;height:20px;
    border-radius:50%;
    background:#fff;
    border:3px solid var(--navy);
    cursor:pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }
  .speed-slider::-moz-range-progress{
    background: var(--navy);
    height:6px;
    border-radius:999px;
  }

  /* MODE TABS */
  .mode-tabs{
    display:flex;
    gap:8px;
    margin-bottom:16px;
    background:#f0f1f6;
    border-radius:14px;
    padding:4px;
  }
  .mode-tab{
    flex:1;
    border:none;
    background:transparent;
    color:var(--muted);
    font-weight:700;
    font-size: clamp(0.8em, 2.8vw, 0.9em);
    padding:10px 8px;
    border-radius:10px;
    cursor:pointer;
    transition: all .18s ease;
  }
  .mode-tab.active{
    background:#fff;
    color:var(--navy);
    box-shadow: 0 3px 10px rgba(0,0,0,0.1);
  }

  /* LISTENING VIEW */
  .listen-card{
    background: linear-gradient(160deg, #f7f8fd, #eef0fb);
    border-radius: 18px;
    padding: clamp(18px, 4.5vw, 28px);
    margin-bottom: 16px;
  }
  .listen-title{
    font-family:'Poppins',sans-serif;
    font-weight:700;
    font-size: clamp(1.05em, 4vw, 1.3em);
    color: var(--navy);
    margin-bottom:4px;
  }
  .listen-type-badge{
    display:inline-block;
    font-size:0.72em;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.04em;
    color: var(--accent);
    background:#e5f7f4;
    padding:3px 10px;
    border-radius:999px;
    margin-bottom:12px;
  }
  .listen-play-row{
    display:flex;
    gap:10px;
    margin-bottom:14px;
  }
  .listen-play-btn{
    border:none;
    background: var(--navy);
    color:#fff;
    font-weight:700;
    font-size: clamp(0.68em, 3.2vw, 0.85em);
    padding:11px 8px;
    border-radius:12px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
    flex:1;
    justify-content:center;
    white-space:nowrap;
    overflow:hidden;
  }
  .listen-play-btn.secondary{
    background:#fff;
    color:var(--navy);
    border:1.5px solid #dfe2f0;
  }
  .listen-play-btn.playing{
    background:#c0392b;
  }
  .listen-play-btn.secondary.playing{
    background:#fdecea;
    color:#c0392b;
    border-color:#c0392b;
  }
  .transcript-toggle{
    border:none;
    background:none;
    color:var(--accent);
    font-weight:700;
    font-size:0.82em;
    cursor:pointer;
    padding:4px 0;
    margin-bottom:10px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .transcript-box{
    display:none;
    background:#fff;
    border-radius:14px;
    padding:14px 16px;
    margin-bottom:14px;
    max-height:280px;
    overflow-y:auto;
  }
  .transcript-box.show{ display:block; }
  .transcript-line{
    margin-bottom:10px;
    line-height:1.5;
  }
  .transcript-line:last-child{ margin-bottom:0; }
  .transcript-en{
    font-weight:600;
    color:var(--text);
    font-size:0.92em;
  }
  .transcript-vi{
    color:var(--muted);
    font-size:0.85em;
    margin-top:2px;
  }
  .speaker-tag{
    display:inline-block;
    font-size:0.72em;
    font-weight:700;
    color: var(--accent);
    margin-right:6px;
  }
  .quiz-wrap{
    margin-top:6px;
  }
  .quiz-q{
    font-weight:700;
    font-size:0.9em;
    color:var(--text);
    margin:14px 0 8px;
  }
  .quiz-q:first-child{ margin-top:0; }
  .quiz-opt{
    display:block;
    width:100%;
    text-align:left;
    border:1.5px solid #e2e5f0;
    background:#fff;
    color:var(--text);
    font-size:0.85em;
    padding:10px 12px;
    border-radius:10px;
    margin-bottom:8px;
    cursor:pointer;
    transition: all .15s ease;
  }
  .quiz-opt.correct{
    background:#e7f8ec;
    border-color: var(--green);
    color:#146c2e;
    font-weight:700;
  }
  .quiz-opt.wrong{
    background:#fdecea;
    border-color:#e0574a;
    color:#a02f24;
    font-weight:700;
  }
  .quiz-opt:disabled{ cursor:default; }

  /* TOPIC CHIPS */
  .topics-wrap{
    margin-bottom: 14px;
  }
  .topics-label{
    font-size:0.78em;
    color:var(--muted);
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.06em;
    margin-bottom:8px;
    display:block;
  }
  .topic-chips{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    max-height: 180px;
    overflow-y:auto;
    padding: 2px 2px 6px;
  }
  .chip{
    border: 1.5px solid #e2e5f0;
    background:#fafbff;
    color:#3a4160;
    font-size: clamp(0.76em, 2.4vw, 0.85em);
    font-weight:600;
    padding: 8px 14px;
    border-radius: 999px;
    cursor:pointer;
    white-space:nowrap;
    transition: all .18s ease;
    user-select:none;
  }
  .chip:active{ transform: scale(0.96); }
  .chip.selected{
    background: var(--navy);
    border-color: var(--navy);
    color:#fff;
  }
  .chip.all-chip{
    background:#fff3ee;
    border-color:#ffd2c2;
    color:var(--accent);
  }
  .chip.all-chip.selected{
    background: var(--accent);
    border-color: var(--accent);
    color:#fff;
  }
  .chip.stage-chip.selected{
    background: var(--accent);
    border-color: var(--accent);
    color:#fff;
  }
  .stage-desc{
    font-size:0.78em;
    color:var(--muted);
    font-style:italic;
    margin: 6px 2px 0;
  }

  /* QUESTION AREA */
  .stage{
    background: linear-gradient(160deg, #f7f8fd, #eef0fb);
    border-radius: 18px;
    padding: clamp(20px, 5vw, 34px) clamp(16px, 4vw, 26px);
    text-align:center;
    min-height: 190px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-bottom: 16px;
  }
  .question{
    font-family:'Poppins',sans-serif;
    font-weight:700;
    font-size: clamp(1.2em, 5vw, 1.7em);
    color: var(--text);
    line-height:1.35;
  }
  .question.compact{ font-size: clamp(1.05em, 4.2vw, 1.35em); }

  .replay-btn{
    border:none;
    background:#fff;
    color:var(--navy);
    width:38px;height:38px;
    border-radius:50%;
    box-shadow: 0 3px 10px rgba(0,0,0,0.12);
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-size:0.95em;
    transition: transform .15s ease;
  }
  .replay-btn:active{ transform: scale(0.9); }
  .replay-btn.muted{ background:#fdecea; color:#c0392b; }

  .answer-block{
    max-height:0;
    opacity:0;
    overflow:hidden;
    transition: max-height .35s ease, opacity .3s ease, margin .3s ease;
  }
  .answer-block.show{
    max-height:220px;
    opacity:1;
    margin-top:6px;
  }
  .answer{
    font-family:'Poppins',sans-serif;
    font-weight:600;
    font-size: clamp(1.05em, 4vw, 1.25em);
    color: var(--green);
  }
  .ipa{
    font-size: clamp(0.85em, 3vw, 1em);
    color: var(--orange);
    font-weight:600;
    margin-top:6px;
  }

  .empty-note{
    color: var(--muted);
    font-style: italic;
    font-size:0.82em;
    text-align:center;
    margin: -6px 0 12px;
  }

  /* PROGRESS */
  .progress-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:16px;
  }
  .progress-bar{
    flex:1;
    height:8px;
    background:#eceefa;
    border-radius:999px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background: linear-gradient(90deg, var(--navy), #5b6fd6);
    border-radius:999px;
    transition: width .3s ease;
  }
  .progress-text{
    font-size:0.82em;
    font-weight:700;
    color:var(--navy);
    white-space:nowrap;
    min-width:52px;
    text-align:right;
  }

  /* AUTO PLAY */
  .auto-row{
    display:grid;
    grid-template-columns: 3fr 3fr 4fr;
    gap:8px;
    margin-bottom:12px;
  }
  .auto-mode-btn{
    border:none;
    background:#f0f1f6;
    color:var(--muted);
    font-weight:700;
    font-size: clamp(0.72em, 3vw, 0.78em);
    padding:11px 4px;
    border-radius:12px;
    cursor:pointer;
    white-space:nowrap;
    overflow:hidden;
  }
  .auto-mode-btn.active{
    background:#fff;
    color:var(--navy);
    box-shadow: 0 0 0 1.5px var(--navy) inset;
  }
  .btn-autoplay{
    border:none;
    border-radius:12px;
    padding:11px 6px;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size: clamp(0.72em, 3vw, 0.85em);
    cursor:pointer;
    background: var(--orange);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    white-space:nowrap;
    overflow:hidden;
    transition: transform .12s ease;
  }
  .btn-autoplay:active{ transform: scale(0.97); }
  .btn-autoplay.running{
    background:#c0392b;
  }

  /* ACTION BUTTONS */
  .actions{
    display:flex;
    gap:12px;
  }
  .btn{
    flex:1;
    border:none;
    border-radius: 16px;
    padding: 15px 10px;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size: clamp(0.85em, 3vw, 1em);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition: transform .12s ease, box-shadow .2s ease;
  }
  .btn:active{ transform: scale(0.97); }
  .btn:disabled{ opacity:0.45; cursor:not-allowed; transform:none; }
  .btn-primary{
    background: var(--navy);
    color:#fff;
    box-shadow: 0 8px 20px rgba(0,47,135,0.3);
  }
  .btn-secondary{
    background: var(--green);
    color:#fff;
    box-shadow: 0 8px 20px rgba(29,185,84,0.3);
  }

  footer{
    text-align:center;
    color:rgba(255,255,255,0.75);
    font-size:0.78em;
    margin-top:16px;
    padding-bottom: 8px;
  }

  @media (max-width:480px){
    .actions{ flex-direction:column; }
  }
</style>
</head>
<body>
  <div class="app">
    <div class="card">
      <button class="settings-toggle" id="settingsToggle" title="Cài đặt giọng đọc"><i class="fa-solid fa-gear"></i></button>
      <div class="brand"><span class="logo-dot"></span><h1>C&amp;B ENGLISH COACH</h1></div>
      <p class="subtitle">Luyện tiếng Anh HR - Payroll - C&amp;B mỗi ngày, đủ 5 Stage từ cơ bản đến phản xạ tự nhiên</p>

      <div class="settings-panel" id="settingsPanel">
        <div class="settings-row">
          <label>Giọng đọc tiếng Việt</label>
          <select id="voiceViSelect"></select>
        </div>
        <div class="settings-row">
          <label>Giọng đọc tiếng Anh</label>
          <select id="voiceEnSelect"></select>
        </div>
        <div class="settings-row">
          <label>Tốc độ đọc câu hỏi tiếng Việt</label>
          <div class="speed-options">
            <button class="speed-btn" data-speed="0.8">Chậm</button>
            <button class="speed-btn" data-speed="1">Vừa</button>
            <button class="speed-btn" data-speed="1.3">Nhanh</button>
          </div>
        </div>
        <div class="settings-row">
          <label>Tốc độ đọc tiếng Anh <span id="enSpeedValue" class="speed-value-label">1.0x</span></label>
          <input type="range" id="enSpeedSlider" class="speed-slider" min="0.6" max="1" step="0.05" value="1">
        </div>
      </div>

      <div class="mode-tabs">
        <button class="mode-tab active" id="modeFlashcardBtn"><i class="fa-solid fa-layer-group"></i> Luyện câu</button>
        <button class="mode-tab" id="modeListenBtn"><i class="fa-solid fa-headphones"></i> Đoạn nghe</button>
      </div>

      <div id="flashcardMode">
        <div class="topics-wrap">
          <span class="topics-label">Chọn Stage</span>
          <div class="topic-chips" id="stageChips"></div>
          <div class="stage-desc" id="stageDesc"></div>
        </div>

        <div class="topics-wrap">
          <span class="topics-label">Chọn chủ đề</span>
          <div class="topic-chips" id="topicChips">Đang tải dữ liệu...</div>
        </div>

        <div class="stage">
          <div class="question" id="question">Chưa có dữ liệu.</div>
          <button class="replay-btn" id="replayBtn" title="Tắt/bật tiếng"><i class="fa-solid fa-volume-high"></i></button>
          <div class="answer-block" id="answerBlock">
            <div class="answer" id="answer"></div>
            <div class="ipa" id="ipa"></div>
          </div>
        </div>

        <div class="empty-note" id="emptyNote"></div>

        <div class="progress-row">
          <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
          <div class="progress-text" id="progressText">0/0</div>
        </div>

        <div class="auto-row">
          <button class="auto-mode-btn active" id="autoModeReflexBtn" data-mode="reflex">Phản xạ</button>
          <button class="auto-mode-btn" id="autoModeReadBtn" data-mode="read">Đọc câu</button>
          <button class="btn-autoplay" id="autoPlayBtn"><i class="fa-solid fa-play"></i> Tự động chạy</button>
        </div>

        <div class="actions">
          <button class="btn btn-primary" id="showAnswerBtn" disabled><i class="fa-solid fa-eye"></i> Xem đáp án</button>
          <button class="btn btn-secondary" id="nextBtn" disabled><i class="fa-solid fa-shuffle"></i> Câu tiếp theo</button>
        </div>
      </div>

      <div id="listenMode" style="display:none;">
        <div class="topics-wrap">
          <span class="topics-label">Chọn chủ đề</span>
          <div class="topic-chips" id="listenTopicChips">Đang tải dữ liệu...</div>
        </div>

        <div class="listen-card" id="listenCard">
          <div class="listen-type-badge" id="listenTypeBadge">Hội thoại</div>
          <div class="listen-title" id="listenTitle">Chưa chọn chủ đề</div>

          <div class="listen-play-row">
            <button class="listen-play-btn" id="listenPlayEnBtn"><i class="fa-solid fa-play"></i> Nghe tiếng Anh</button>
            <button class="listen-play-btn secondary" id="listenPlayViBtn"><i class="fa-solid fa-language"></i> Nghe bản dịch</button>
          </div>

          <button class="transcript-toggle" id="transcriptToggleBtn"><i class="fa-solid fa-file-lines"></i> Hiện transcript &amp; bản dịch</button>
          <div class="transcript-box" id="transcriptBox"></div>

          <div class="quiz-wrap" id="quizWrap"></div>
        </div>
      </div>
    </div>
    <footer>C&amp;B English Coach &middot; Luyện tiếng Anh chuyên ngành HR/Payroll mỗi ngày</footer>
  </div>

<script>
  // ===================
  // DỮ LIỆU & TRẠNG THÁI
  // ===================
  // ===================

ctions", "topicOrder": 13, "stage": 1, "vi": "Phần điều chỉnh sẽ được phản ánh trong bảng lương tháng sau.", "en": "The correction will be reflected in next month's payroll.", "ipa": "/ðə kəˈrɛkʃən wɪl bi rɪˈflɛktɪd ɪn nɛkst mʌnθs ˈpeɪroʊl/"}, {"topicRaw": "13-Errors and Corrections", "topicName": "Errors and Corrections", "topicOrder": 13, "stage": 2, "vi": "Nếu phát hiện sai sót trong bảng lương, chúng tôi phải sửa ngay lập tức.", "en": "If we find an error in the payroll, we must correct it immediately.", "ipa": "/ɪf wi faɪnd ən ˈɛrər ɪn ðə ˈpeɪˌroʊl, wi məst kərˈɛkt ɪt ˌɪˈmiˌdiətli/"}, {"topicRaw": "13-Errors and Corrections", "topicName": "Errors and Corrections", "topicOrder": 13, "stage": 2, "vi": "Báo cáo điều chỉnh phải được nộp để giải thích sự thay đổi.", "en": "A correction report must be submitted to explain the adjustment.", "ipa": "/ə kərˈɛkʃən rɪˈpɔrt məst bi səbˈmɪtəd tɪ ɪkˈspleɪn ðə əˈʤəstmənt/"}, {"topicRaw": "13-Errors and Corrections", "topicName": "Errors and Corrections", "topicOrder": 13, "stage": 2, "vi": "Chúng tôi xin lỗi vì sai sót và sẽ phát hành phiếu lương đã sửa.", "en": "We apologize for the mistake and will issue a revised payslip.", "ipa": "/wi əˈpɑləˌʤaɪz fər ðə mɪˈsteɪk ənd wɪl ˈɪʃu ə rɪˈvaɪzd ˈpeɪslɪp/"}, {"topicRaw": "13-Errors and Corrections", "topicName": "Errors and Corrections", "topicOrder": 13, "stage": 2, "vi": "Vui lòng thông báo cho chúng tôi trong vòng ba ngày nếu phát hiện sai lệch.", "en": "Please notify us within three days, if you find any discrepancy.", "ipa": "/pliz ˈnoʊtəˌfaɪ ˈjuˈɛs wɪˈθɪn θri deɪz ɪf ju faɪnd ˈɛni dɪˈskrɛpənsi/"}, {"topicRaw": "13-Errors and Corrections", "topicName": "Errors and Corrections", "topicOrder": 13, "stage": 2, "vi": "Chúng tôi lưu lại nhật ký của tất cả các điều chỉnh để phục vụ kiểm toán.", "en": "We keep a log of all corrections for audit purposes.", "ipa": "/wi kip ə lɔg əv ɔl kərˈɛkʃənz fər ˈɔdɪt ˈpərpəsɪz/"}, {"topicRaw": "13-Errors and Corrections", "topicName": "Errors and Corrections", "topicOrder": 13, "stage": 3, "vi": "Tôi có thể giải thích cách chúng tôi xử lý sai sót lương khi xảy ra.", "en": "I can explain how we handle payroll errors, when they occur.", "ipa": "/aɪ kən ɪkˈspleɪn haʊ wi ˈhændəl ˈpeɪˌroʊl ˈɛrərz wɪn ðeɪ əˈkər/"}, {"topicRaw": "13-Errors and Corrections", "topicName": "Errors and Corrections", "topicOrder": 13, "stage": 3, "vi": "Chúng tôi khuyên nên báo cáo bất kỳ sai sót nào ngay khi phát hiện.", "en": "We advise reporting any error as soon as it is discovered.", "ipa": "/wi ədˈvaɪz rɪˈpɔrtɪŋ ˈɛni ˈɛrər ɛz sun ɛz ɪt ɪz dɪˈskəvərd/"}, {"topicRaw": "13-Errors and Corrections", "topicName": "Errors and Corrections", "topicOrder": 13, "stage": 3, "vi": "Dựa trên rà soát của chúng tôi, sai sót này do lỗi nhập liệu.", "en": "Based on our review, this error was caused by a data entry mistake.", "ipa": "/beɪst ɔn ɑr ˌrivˈju, ðɪs ˈɛrər wɑz kɔzd baɪ ə ˈdætə ˈɛntri mɪˈsteɪk/"}, {"topicRaw": "13-Errors and Corrections", "topicName": "Errors and Corrections", "topicOrder": 13, "stage": 3, "vi": "Tôi đề xuất thêm bước kiểm tra chéo để tránh sai sót trong tương lai.", "en": "I recommend adding a double check step to prevent future errors.", "ipa": "/aɪ ˌrɛkəˈmɛnd ˈædɪŋ ə ˈdəbəl ʧɛk stɛp tɪ prɪˈvɛnt fˈjuʧər ˈɛrərz/"}, {"topicRaw": "13-Errors and Corrections", "topicName": "Errors and Corrections", "topicOrder": 13, "stage": 3, "vi": "Để tôi làm rõ việc điều chỉnh sẽ ảnh hưởng thế nào đến phiếu lương tháng này.", "en": "Let me clarify how the correction will affect this month's payslip.", "ipa": "/lɛt mi ˈklɛrəˌfaɪ haʊ ðə kərˈɛkʃən wɪl əˈfɛkt ðɪs mənθs ˈpeɪslɪp/"}, {"topicRaw": "13-Errors and Corrections", "topicName": "Errors and Corrections", "topicOrder": 13, "stage": 4, "vi": "Hãy chuyển sang thảo luận về sai sót lương của tháng trước.", "en": "Let's move on to discuss the payroll error from last month.", "ipa": "/lɛts muv ɔn tɪ dɪˈskəs ðə ˈpeɪˌroʊl ˈɛrər frəm læst mənθ/"}, {"topicRaw": "13-Errors and Corrections", "topicName": "Errors and Corrections", "topicOrder": 13, "stage": 4, "vi": "Anh/chị có thể giải thích nguyên nhân gây ra sai sót này trong báo cáo không?", "en": "Could you explain what caused this error in the report?", "ipa": "/kʊd ju ɪkˈspleɪn wət kɔzd ðɪs ˈɛrər ɪn ðə rɪˈpɔrt?/"}, {"topicRaw": "13-Errors and Corrections", "topicName": "Errors and Corrections", "topicOrder": 13, "stage": 4, "vi": "Tôi muốn nêu mối lo ngại về việc điều chỉnh đang mất quá nhiều thời gian.", "en": "I'd like to raise a concern about how long the correction is taking.", "ipa": "/aɪd laɪk tɪ reɪz ə kənˈsərn əˈbaʊt haʊ lɔŋ ðə kərˈɛkʃən ɪz ˈteɪkɪŋ/"}, {"topicRaw": "13-Errors and Corrections", "topicName": "Errors and Corrections", "topicOrder": 13, "stage": 4, "vi": "Tóm lại, việc điều chỉnh sẽ hoàn tất vào ngày mai.", "en": "To summarize, the correction will be completed by tomorrow.", "ipa": "/tɪ ˈsəmərˌaɪz, ðə kərˈɛkʃən wɪl bi kəmˈplitɪd baɪ təˈmɑˌroʊ/"}, {"topicRaw": "13-Errors and Corrections", "topicName": "Errors and Corrections", "topicOrder": 13, "stage": 4, "vi": "Hãy thống nhất một quy trình để tránh loại sai sót này trong tương lai.", "en": "Let's agree on a process to prevent this type of error in the future.", "ipa": "/lɛts əˈgri ɔn ə ˈprɔˌsɛs tɪ prɪˈvɛnt ðɪs taɪp əv ˈɛrər ɪn ðə fˈjuʧər/"}, {"topicRaw": "13-Errors and Corrections", "topicName": "Errors and Corrections", "topicOrder": 13, "stage": 5, "vi": "Thật ra, tôi nghĩ cách chúng ta xử lý sai sót quan trọng hơn chính sai sót đó.", "en": "Honestly, I think how we handle an error matters more than the error itself.", "ipa": "/ˈɑnəstli, aɪ θɪŋk haʊ wi ˈhændəl ən ˈɛrər ˈmætərz mɔr ðən ðə ˈɛrər ˌɪtˈsɛlf/"}, {"topicRaw": "13-Errors and Corrections", "topicName": "Errors and Corrections", "topicOrder": 13, "stage": 5, "vi": "Nếu tôi mắc sai sót, tôi sẽ thông báo cho khách hàng trước khi họ phát hiện ra.", "en": "If I made a mistake, I'd inform the client, before they noticed it.", "ipa": "/ɪf aɪ meɪd ə mɪˈsteɪk, aɪd ˌɪnˈfɔrm ðə klaɪənt ˌbiˈfɔr ðeɪ ˈnoʊtɪst ɪt/"}, {"topicRaw": "13-Errors and Corrections", "topicName": "Errors and Corrections", "topicOrder": 13, "stage": 5, "vi": "Theo kinh nghiệm của tôi, hầu hết sai sót đến từ việc nhập liệu vội vàng.", "en": "From my experience, most errors come from rushed data entry.", "ipa": "/frəm maɪ ɪkˈspɪriəns, moʊst ˈɛrərz kəm frəm rəʃt ˈdætə ˈɛntri/"}, {"topicRaw": "13-Errors and Corrections", "topicName": "Errors and Corrections", "topicOrder": 13, "stage": 5, "vi": "Tôi tin rằng bước kiểm tra chéo giúp ngăn ngừa hầu hết sai sót về lương.", "en": "I believe a double check step prevents most payroll errors.", "ipa": "/aɪ bɪˈliv ə ˈdəbəl ʧɛk stɛp prɪˈvɛnts moʊst ˈpeɪˌroʊl ˈɛrərz/"}, {"topicRaw": "13-Errors and Corrections", "topicName": "Errors and Corrections", "topicOrder": 13, "stage": 5, "vi": "Điều tôi rút ra được là nhận lỗi nhanh chóng giúp nhận được nhiều sự tôn trọng hơn.", "en": "What I've learned is that owning up to an error quickly earns more respect.", "ipa": "/wət aɪv ˈlərnɪd ɪz ðət ˈoʊnɪŋ əp tɪ ən ˈɛrər kˈwɪkli ərnz mɔr rɪˈspɛkt/"}, {"topicRaw": "14-Meetings", "topicName": "Meetings", "topicOrder": 14, "stage": 1, "vi": "Chúng ta có thể sắp xếp một cuộc họp vào sáng mai được không?", "en": "Can we schedule a meeting for tomorrow morning?", "ipa": "/kən wi ˈskɛʤʊl ə ˈmitɪŋ fər təˈmɑˌroʊ ˈmɔrnɪŋ?/"}, {"topicRaw": "14-Meetings", "topicName": "Meetings", "topicOrder": 14, "stage": 1, "vi": "Tôi sẽ gửi lời mời họp qua email.", "en": "I will send the meeting invitation by email.", "ipa": "/aɪ wɪl sɛnd ðə ˈmitɪŋ ˌɪnvɪˈteɪʃən baɪ iˈmeɪl/"}, {"topicRaw": "14-Meetings", "topicName": "Meetings", "topicOrder": 14, "stage": 1, "vi": "Xin lỗi, tôi sẽ đến trễ cuộc họp năm phút.", "en": "Sorry, I will be five minutes late for the meeting.", "ipa": "/ˈsɑri, aɪ wɪl bi faɪv ˈmɪnəts leɪt fər ðə ˈmitɪŋ/"}, {"topicRaw": "14-Meetings", "topicName": "Meetings", "topicOrder": 14, "stage": 1, "vi": "Anh/chị có thể nhắc lại được không?", "en": "Could you please repeat that?", "ipa": "/kʊd ju pliz rɪˈpit ðət?/"}, {"topicRaw": "14-Meetings", "topicName": "Meetings", "topicOrder": 14, "stage": 1, "vi": "Cảm ơn mọi người đã tham gia cuộc họp hôm nay.", "en": "Thank you all for joining today's meeting.", "ipa": "/θæŋk ju ɔl fər ˈʤɔɪnɪŋ ˈtudeɪz ˈmitɪŋ/"}, {"topicRaw": "14-Meetings", "topicName": "Meetings", "topicOrder": 14, "stage": 2, "vi": "Vui lòng chuẩn bị chương trình họp trước khi bắt đầu.", "en": "Please prepare the meeting agenda, before we start.", "ipa": "/pliz priˈpɛr ðə ˈmitɪŋ əˈʤɛndə ˌbiˈfɔr wi stɑrt/"}, {"topicRaw": "14-Meetings", "topicName": "Meetings", "topicOrder": 14, "stage": 2, "vi": "Tôi sẽ ghi chú và chia sẻ biên bản họp sau đó.", "en": "I will take notes and share the minutes afterward.", "ipa": "/aɪ wɪl teɪk noʊts ənd ʃɛr ðə ˈmɪnəts ˈæftərwərd/"}, {"topicRaw": "14-Meetings", "topicName": "Meetings", "topicOrder": 14, "stage": 2, "vi": "Chúng ta cần xác nhận đặt phòng họp trước.", "en": "We need to confirm the meeting room booking in advance.", "ipa": "/wi nid tɪ kənˈfərm ðə ˈmitɪŋ rum ˈbʊkɪŋ ɪn ədˈvæns/"}, {"topicRaw": "14-Meetings", "topicName": "Meetings", "topicOrder": 14, "stage": 2, "vi": "Hãy giữ cuộc họp này trong ba mươi phút.", "en": "Let's keep this meeting to thirty minutes.", "ipa": "/lɛts kip ðɪs ˈmitɪŋ tɪ ˈθərˌdi ˈmɪnəts/"}, {"topicRaw": "14-Meetings", "topicName": "Meetings", "topicOrder": 14, "stage": 2, "vi": "Tôi sẽ mời thêm bộ phận kế toán tham gia buổi thảo luận này.", "en": "I will loop in the accounting team for this discussion.", "ipa": "/aɪ wɪl lup ɪn ðə əˈkaʊnɪŋ tim fər ðɪs dɪˈskəʃən/"}, {"topicRaw": "14-Meetings", "topicName": "Meetings", "topicOrder": 14, "stage": 3, "vi": "Tôi đề xuất gửi chương trình họp trước một ngày.", "en": "I recommend sending the agenda a day, before the meeting.", "ipa": "/aɪ ˌrɛkəˈmɛnd ˈsɛndɪŋ ðə əˈʤɛndə ə deɪ ˌbiˈfɔr ðə ˈmitɪŋ/"}, {"topicRaw": "14-Meetings", "topicName": "Meetings", "topicOrder": 14, "stage": 3, "vi": "Để tôi giải thích mục đích của i đề xuất áp dụng giải pháp tạm thời trong khi chúng ta điều tra thêm.", "en": "I suggest we set up a temporary solution, while we investigate further.", "ipa": "/aɪ səˈʤɛst wi sɛt əp ə ˈtɛmpərˌɛri səˈluʃən waɪl wi ˌɪnˈvɛstəˌgeɪt ˈfərðər/"}, {"topicRaw": "15-Discussing Issues and Problems", "topicName": "Discussing Issues and Problems", "topicOrder": 15, "stage": 3, "vi": "Hãy để tôi trình bày cách chúng tôi dự định giải quyết vấn đề này.", "en": "Let me walk you through how we plan to resolve this.", "ipa": "/lɛt mi wɔk ju θru haʊ wi plæn tɪ riˈzɑlv ðɪs/"}, {"topicRaw": "15-Discussing Issues and Problems", "topicName": "Discussing Issues and Problems", "topicOrder": 15, "stage": 4, "vi": "Hãy chuyển sang vấn đề chúng ta đã thảo luận trước đó.", "en": "Let's move on to the issue we discussed earlier.", "ipa": "/lɛts muv ɔn tɪ ðə ˈɪʃu wi dɪˈskəst ˈərliər/"}, {"topicRaw": "15-Discussing Issues and Problems", "topicName": "Discussing Issues and Problems", "topicOrder": 15, "stage": 4, "vi": "Anh/chị có thể trình bày điều gì đã xảy ra không?", "en": "Could you walk us through what went wrong?", "ipa": "/kʊd ju wɔk ˈjuˈɛs θru wət wɛnt rɔŋ?/"}, {"topicRaw": "15-Discussing Issues and Problems", "topicName": "Discussing Issues and Problems", "topicOrder": 15, "stage": 4, "vi": "Tôi muốn nêu mối lo ngại về vấn đề lặp lại này.", "en": "I'd like to raise a concern about this recurring problem.", "ipa": "/aɪd laɪk tɪ reɪz ə kənˈsərn əˈbaʊt ðɪs rɪˈkərɪŋ ˈprɑbləm/"}, {"topicRaw": "15-Discussing Issues and Problems", "topicName": "Discussing Issues and Problems", "topicOrder": 15, "stage": 4, "vi": "Tóm lại, chúng ta đã thống nhất kế hoạch khắc phục trước thứ Sáu.", "en": "To summarize, we agreed on a plan to fix this by Friday.", "ipa": "/tɪ ˈsəmərˌaɪz, wi əˈgrid ɔn ə plæn tɪ fɪks ðɪs baɪ ˈfraɪˌdeɪ/"}, {"topicRaw": "15-Discussing Issues and Problems", "topicName": "Discussing Issues and Problems", "topicOrder": 15, "stage": 4, "vi": "Hãy phân công người theo dõi sát vấn đề này.", fficult Conversations", "topicName": "Conflict Resolution and Difficult Conversations", "topicOrder": 16, "stage": 1, "vi": "Tôi hiểu anh/chị đang khó chịu, hãy cùng nói chuyện về việc này.", "en": "I understand you are upset, let's talk about it.", "ipa": "/aɪ ˌəndərˈstænd ju ər ˈəpˌsɛt, lɛts tɔk əˈbaʊt ɪt/"}, {"topicRaw": "16-Conflict Resolution and Difficult Conversations", "topicName": "Conflict Resolution and Difficult Conversations", "topicOrder": 16, "stage": 1, "vi": "Tôi xin lỗi vì sự hiểu lầm này.", "en": "I'm sorry for the misunderstanding.", "ipa": "/əm ˈsɑri fər ðə ˌmɪsəndərˈstændɪŋ/"}, {"topicRaw": "16-Conflict Resolution and Difficult Conversations", "topicName": "Conflict Resolution and Difficult Conversations", "topicOrder": 16, "stage": 1, "vi": "Chúng ta có thể cùng tìm ra giải pháp không?", "en": "Can we find a solution together?", "ipa": "/kən wi faɪnd ə səˈluʃən təˈgɛðər?/"}, {"topicRaw": "16-Conflict Resolution and Difficult Conversations", "topicName": "Conflict Resolution and Difficult Conversations", "topicOrder": 16, "stage": 1, "vi": "Tôi không có ý làm anh/chị khó chịu.", "en": "I did not mean to upset you.", "ipa": "/aɪ dɪd nɑt min tɪ ˈəpˌsɛt ju/"}, {"topicRaw": "16-Conflict Resolution and Difficult Conversations", "topicName": "Conflict Resolution and Difficult Conversations", "topicOrder": 16, "stage": 1, "vi": "Hãy bình tĩnh và trao đổi rõ ràng về việc này.", "en": "Let's stay calm and discuss this clearly.", "ipa": "/lɛts steɪ kɑm ənd dɪˈskəs ðɪs ˈklɪrli/"}, {"topicRaw": "16-Conflict Resolution and Difficult Conversations", "topicName": "Conflict Resolution and Difficult Conversations", "topicOrder": 16, "stage": 2, "vi": "Tôi hiểu sự bức xúc của anh/chị và tôi muốn giúp giải quyết việc này.", "en": "I understand your frustration, and I want to help resolve this.", "ipa": "/aɪ ˌəndərˈstænd jʊr frəˈstreɪʃən, ənd aɪ wɔnt tɪ hɛlp riˈzɑlv ðɪs/"}, {"topicRaw": "16-Conflict Resolution and Difficult Conversations", "topicName": "Conflict Resolution and Difficult Conversations", "topicOrder": 16, "stage": 2, "vi": "Hãy tập trung vào sự việc thay vì cảm xúc.", "en": "Let's focus on the facts rather than the emotions.", "ipa": "/lɛts ˈfoʊkɪs ɔn ðə fækts ˈrəðər ðən ðə ˈɪˌmoʊʃənz/"}, {"topicRaw": "16-Conflict Resolution and Difficult Conversations", "topicName": "Conflict Resolution and Difficult Conversations", "topicOrder": 16, "stage": 2, "vi": "Tôi muốn nghe quan điểm của anh/chị về việc này.", "en": "I'd like to hear your perspective on this matter.", "ipa": "/aɪd laɪk tɪ hir jʊr pərˈspɛktɪv ɔn ðɪs ˈmætər/"}, {"topicRaw": "16-Conflict Resolution and Difficult Conversations", "topicName": "Conflict Resolution and Difficult Conversations", "topicOrder": 16, "stage": 2, "vi": "Chúng ta nên tìm một giải pháp dung hòa cho cả hai bên.", "en": "We should find a compromise that works for both sides.", "ipa": "/wi ʃʊd faɪnd ə ˈkɑmprəˌmaɪz ðət wərks fər boʊθ saɪdz/"}, {"topicRaw": "16-Conflict Resolution and Difficult Conversations", "topicName": "Conflict Resolution and Difficult Conversations", "topicOrder": 16, "stage": 2, "vi": "Hãy thống nhất các bước tiếp theo để tránh việc này lặp lại.", "en": "Let's agree on the next steps to avoid this happening again.", "ipa": "/lɛts əˈgri ɔn ðə nɛkst stɛps tɪ əˈvɔɪd ðɪs ˈhæpənɪŋ əˈgɛn/"}, {"topicRaw": "16-Conflict Resolution and Difficult Conversations", "topicName": "Conflict Resolution and Difficult Conversations", "topicOrder": 16, "stage": 3, "vi": "Tôi hiểu tình huống này khá khó chịu, để tôi giải thích chuyện đã xảy ra.", "en": "I understand this situation is frustrating, let me explain what happened.", "ipa": "/aɪ ˌəndərˈstænd ðɪs ˌsɪʧuˈeɪʃən ɪz ˈfrəˌstreɪtɪŋ, lɛt mi ɪkˈspleɪn wət ˈhæpənd/"}, {"topicRaw": "16-Conflict Resolution and Difficult Conversations", "topicName": "Conflict Resolution and Difficult Conversations", "topicOrder": 16, "stage": 3, "vi": "Tôi đề xuất chúng ta nên đối mặt trực tiếp thay vì né tránh vấn đề này.", "en": "I recommend we address this directly rather than avoid it.", "ipa": "/aɪ ˌrɛkəˈmɛnd wi ˈæˌdrɛs ðɪs dɪˈrɛkli ˈrəðər ðən əˈvɔɪd ɪt/"}, {"topicRaw": "16-Conflict Resolution and Difficult Conversations", "topicName": "Conflict Resolution and Difficult Conversations", "topicOrder": 16, "stage": 3, "vi": "Dựa trên ý kiến của cả hai bên, tôi đề xuất một giải pháp trung hòa.", "en": "Based on both sides' input, I suggest a middle-ground solution.", "ipa": "/beɪst ɔn boʊθ saɪdz' ˈɪnˌpʊt, aɪ səˈʤɛst ə ˈmɪdəl graʊnd səˈluʃən/"}, {"topicRaw": "16-Conflict Resolution and Difficult Conversations", "topicName": "Conflict Resolution and Difficult Conversations", "topicOrder": 16, "stage": 3, "vi": "Tôi khuyên nên trao đổi việc này riêng tư.", "en": "I would advise having this conversation in private.", "ipa": "/aɪ wʊd ədˈvaɪz ˈhævɪŋ ðɪs ˌkɑnvərˈseɪʃən ɪn ˈpraɪvət/"}, {"topicRaw": "16-Conflict Resolution and Difficult Conversations", "topicName": "Conflict Resolution and Difficult Conversations", "topicOrder": 16, "stage": 3, "vi": "Để tôi làm rõ ý định của mình để tránh hiểu lầm thêm.", "en": "Let me clarify my intention so there is no more misunderstanding.", "ipa": "/lɛt mi ˈklɛrəˌfaɪ maɪ ˌɪnˈtɛnʧən soʊ ðɛr ɪz noʊ mɔr ˌmɪsəndərˈstændɪŋ/"}, {"topicRaw": "16-Conflict Resolution and Difficult Conversations", "topicName": "Conflict Resolution and Difficult Conversations", "topicOrder": 16, "stage": 4, "vi": "Tôi muốn nêu một vấn đề nhạy cảm cần được giải quyết.", "en": "I'd like to raise a sensitive issue we need to resolve.", "ipa": "/aɪd laɪk tɪ reɪz ə ˈsɛnsɪtɪv ˈɪʃu wi nid tɪ riˈzɑlv/"}, {"topicRaw": "16-Conflict Resolution and Difficult Conversations", "topicName": "Conflict Resolution and Difficult Conversations", "topicOrder": 16, "stage": 4, "vi": "Chúng ta có thể dành chút thời gian để nghe cả hai phía không?", "en": "Could we take a moment to hear both sides of this?", "ipa": "/kʊd wi teɪk ə ˈmoʊmənt tɪ hir boʊθ saɪdz əv ðɪs?/"}, {"topicRaw": "16-Conflict Resolution and Difficult Conversations", "topicName": "Conflict Resolution and Difficult Conversations", "topicOrder": 16, "stage": 4, "vi": "Hãy tìm điểm chung trước khi tiếp tục.", "en": "Let's find common ground, before we continue.", "ipa": "/lɛts faɪnd ˈkɑmən graʊnd ˌbiˈfɔr wi kənˈtɪnju/"}, {"topicRaw": "16-Conflict Resolution and Difficult Conversations", "topicName": "Conflict Resolution and Difficult Conversations", "topicOrder": 16, "stage": 4, "vi": "Tóm lại, cả hai bên đã đồng ý cùng tiến về phía trước.", "en": "To summarize, both sides agreed to move forward together.", "ipa": "/tɪ ˈsəmərˌaɪz, boʊθ saɪdz əˈgrid tɪ muv ˈfɔrwərd təˈgɛðər/"}, {"topicRaw": "16-Conflict Resolution and Difficult Conversations", "topicName": "Conflict Resolution and Difficult Conversations", "topicOrder": 16, "stage": 4, "vi": "Hãy thống nhất sẽ xem lại việc này nếu vấn đề lặp lại.", "en": "Let's agree to revisit this, if the issue comes up again.", "ipa": "/lɛts əˈgri tɪ riˈvɪzɪt ðɪs ɪf ðə ˈɪʃu kəmz əp əˈgɛn/"}, {"topicRaw": "16-Conflict Resolution and Difficult Conversations", "topicName": "Conflict Resolution and Difficult Conversations", "topicOrder": 16, "stage": 5, "vi": "Thật ra, tôi nghĩ hầu hết xung đột đến từ kỳ vọng không rõ ràng.", "en": "Honestly, I think most conflicts come from unclear expectations.", "ipa": "/ˈɑnəstli, aɪ θɪŋk moʊst ˈkɑnflɪkts kəm frəm ənˈklɪr ˌɛkspɛkˈteɪʃənz/"}, {"topicRaw": "16-Conflict Resolution and Difficult Conversations", "topicName": "Conflict Resolution and Difficult Conversations", "topicOrder": 16, "stage": 5, "vi": "Nếu đồng nghiệp không đồng ý với tôi, tôi sẽ lắng nghe trước khi phản hồi.", "en": "If a colleague disagreed with me, I'd listen before responding.", "ipa": "/ɪf ə ˈkɑlig dɪsəˈgrid wɪθ mi, aɪd ˈlɪsən ˌbiˈfɔr rɪˈspɑndɪŋ/"}, {"topicRaw": "16-Conflict Resolution and Difficult Conversations", "topicName": "Conflict Resolution and Difficult Conversations", "topicOrder": 16, "stage": 5, "vi": "Theo kinh nghiệm của tôi, giữ bình tĩnh giúp hạ nhiệt hầu hết các bất đồng.", "en": "From my experience, staying calm de-escalates most disagreements.", "ipa": "/frəm maɪ ɪkˈspɪriəns, steɪɪŋ kɑm diˌɛskəˈleɪts moʊst ˌdɪsəˈgrimənts/"}, {"topicRaw": "16-Conflict Resolution and Difficult Conversations", "topicName": "Conflict Resolution and Difficult Conversations", "topicOrder": 16, "stage": 5, "vi": "Tôi tin rằng giải quyết xung đột sớm giúp tránh những vấn đề lớn hơn sau này.", "en": "I believe addressing conflict early prevents bigger problems later.", "ipa": "/aɪ bɪˈliv æˈdrɛsɪŋ ˈkɑnflɪkt ˈərli prɪˈvɛnts ˈbɪgər ˈprɑbləmz ˈleɪtər/"}, {"topicRaw": "16-Conflict Resolution and Difficult Conversations", "topicName": "Conflict Resolution and Difficult Conversations", "topicOrder": 16, "stage": 5, "vi": "Điều tôi rút ra được là lắng nghe quan trọng hơn việc chứng minh mình đúng.", "en": "What I've learned is that listening matters more than being right.", "ipa": "/wət aɪv ˈlərnɪd ɪz ðət ˈlɪsənɪŋ ˈmætərz mɔr ðən biɪŋ raɪt/"}, {"topicRaw": "17-Email and Written Communication", "topicName": "Email and Written Communication", "topicOrder": 17, "stage": 1, "vi": "Tôi sẽ gửi email cho anh/chị kèm thông tin chi tiết.", "en": "I will send you an email with the details.", "ipa": "/aɪ wɪl sɛnd ju ən iˈmeɪl wɪθ ðə ˈditeɪlz/"}, {"topicRaw": "17-Email and Written Communication", "topicName": "Email and Written Communication", "topicOrder": 17, "stage": 1, "vi": "Vui lòng kiểm tra hộp thư để xem tin nhắn của tôi.", "en": "Please check your inbox for my message.", "ipa": "/pliz ʧɛk jʊr ˈɪnˌbɑks fər maɪ ˈmɛsɪʤ/"}, {"topicRaw": "17-Email and Written Communication", "topicName": "Email and Written Communication", "topicOrder": 17, "stage": 1, "vi": "Tôi đã đính kèm tệp trong email này.", "en": "I have attached the file to this email.", "ipa": "/aɪ hæv əˈtæʧt ðə faɪl tɪ ðɪs iˈmeɪl/"}, {"topicRaw": "17-Email and Written Communication", "topicName": "Email and Written Communication", "topicOrder": 17, "stage": 1, "vi": "Vui lòng phản hồi email này càng sớm càng tốt. terday.", "ipa": "/aɪ sɛnt ə ˈfɑloʊˌəp iˈmeɪl ˈæftər ɑr ˈmitɪŋ ˈjɛstərˌdeɪ/"}, {"topicRaw": "17-Email and Written Communication", "topicName": "Email and Written Communication", "topicOrder": 17, "stage": 4, "vi": "Anh/chị có thể xác nhận quyết định này bằng văn bản sau cuộc họp không?", "en": "Could you confirm this decision in writing, after the meeting?", "ipa": "/kʊd ju kənˈfərm ðɪs dɪˈsɪʒən ɪn ˈraɪtɪŋ ˈæftər ðə ˈmitɪŋ?/"}, {"topicRaw": "17-Email and Written Communication", "topicName": "Email and Written Communication", "topicOrder": 17, "stage": 4, "vi": "Tôi muốn nêu một điểm đã được đề cập trong chuỗi email.", "en": "I'd like to raise a point that was mentioned in the email thread.", "ipa": "/aɪd laɪk tɪ reɪz ə pɔɪnt ðət wɑz ˈmɛnʃənd ɪn ðə iˈmeɪl θrɛd/"}, {"topicRaw": "17-Email and Written Communication", "topicName": "Email and Written Communication", "topicOrder": 17, "stage": 4, "vi": "Tóm lại, tôi sẽ gửi biên bản họp qua email hôm nay.", "en": "To summarize, I will send meeting minutes by email today.", "ipa": "/tɪ ˈsəmərˌaɪz, aɪ wɪl sɛnd ˈmitɪŋ ˈmɪnəts baɪ iˈmeɪl təˈdeɪ/"}, {"topicRaw": "17-Email and Written Communication", "topicName": "Email and Written Communication", "topicOrder": 17, "stage": 4, "vi": "Hãy ghi lại các việc cần làm bằng văn bản trước khi kết thúc cuộc họp.", "en": "Let's put the action items in writing, before we close the meeting.", "ipa": "/lɛts pʊt ðə ˈækʃən ˈaɪtəmz ɪn ˈraɪtɪŋ ˌbiˈfɔr wi kloʊz ðə ˈmitɪŋ/"}, {"topicRaw": "17-Email and Written Communication", "topicName": "Email and Written Communication", "topicOrder": 17, "stage": 5, "vi": "Thật ra, tôi nghĩ tiêu đề email rõ ràng giúp tiết kiệm thời gian cho mọi người.", "en": "Honestly, I think a clear subject line saves everyone time.", "ipa": "/ˈɑnəstli, aɪ θɪŋk ə klɪr ˈsəbʤɪkt laɪn seɪvz ˈɛvriˌwən taɪm/"}, {"topicRaw": "17-Email and Written Communication", "topicName": "Email and Written Communication", "topicOrder": 17, "stage": 5, "vi": "Nếu một email không rõ ràng, tôi sẽ  "Do you think this candidate needs one more technical interview round?", "ipa": "/du ju θɪŋk ðɪs ˈkændɪdət nidz wʌn mɔr ˈtɛknɪkəl ˈɪntərvju raʊnd/"}, {"topicRaw": "19-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 19, "stage": 2, "vi": "Anh/chị có muốn tôi sắp xếp buổi gặp trực tiếp với ứng viên không?", "en": "Would you like me to arrange an in-person meeting with the candidate?", "ipa": "/wʊd ju laɪk mi tu əˈreɪndʒ ən ɪn ˈpɜrsən ˈmitɪŋ wɪð ðə ˈkændɪdət/"}, {"topicRaw": "19-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 19, "stage": 2, "vi": "Theo anh/chị, mức lương đề xuất có hợp lý không?", "en": "In your opinion, is the proposed salary reasonable?", "ipa": "/ɪn jɔr əˈpɪnjən ɪz ðə prəˈpoʊzd ˈsæləri ˈrizənəbəl/"}, {"topicRaw": "19-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 19, "stage": 2, "vi": "Anh/chị có thể xác nhận trước khi chúng tôi gửi offer không?", "en": "Can you confirm, before we send the offer?", "ipa": "/kæn ju kənˈfɜrm bɪˈfɔr wi sɛnd ði ˈɑfər/"}, {"topicRaw": "19-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 19, "stage": 2, "vi": "Anh/chị có thể cho tôi biết ấn tượng ban đầu về ứng viên không?", "en": "Can you share your first impression of the candidate?", "ipa": "/kæn ju ʃɛr jɔr fɜrst ɪmˈprɛʃən ʌv ðə ˈkændɪdət/"}, {"topicRaw": "19-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 19, "stage": 2, "vi": "So với ứng viên khác, anh/chị thấy người này thế nào?", "en": "Compared to the other candidates, how do you find this one?", "ipa": "/kəmˈpɛrd tu ði ˈʌðər ˈkændɪdəts haʊ du ju faɪnd ðɪs wʌn/"}, {"topicRaw": "19-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 19, "stage": 2, "vi": "Anh/chị nghĩ ứng viên cần đào tạo thêm ở mảng nào?", "en": "Which area do you think the candidate needs more training in?", "ipa": "/wɪtʃ ˈɛriə du ju θɪŋk ðə ˈkændɪdət nidz mɔr ˈtreɪnɪŋ ɪn/"}, {"topicRaw": "19-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 19, "stage": 2, "vi": "Chúng ta nên thống nhất trước khi thông báo cho ứng viên.", "en": "We should align, before informing the candidate.", "ipa": "/wi ʃʊd əˈlaɪn bɪˈfɔr ɪnˈfɔrmɪŋ ðə ˈkændɪdət/"}, {"topicRaw": "19-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 19, "stage": 3, "vi": "Anh/chị cảm thấy ứng viên còn thiếu kinh nghiệm quản lý dự án thực tế đúng không?", "en": "Do you feel the candidate lacks hands-on project management experience?", "ipa": "/du ju fil ðə ˈkændɪdət læks hændz ɑn ˈprɑdʒɛkt ˈmænɪdʒmənt ɪkˈspɪriəns/"}, {"topicRaw": "19-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 19, "stage": 3, "vi": "Tôi cần trao đổi thêm với anh/chị trước khi đưa ra quyết định cuối cùng.", "en": "I need to discuss further with you, before making the final decision.", "ipa": "/aɪ nid tu dɪˈskʌs ˈfɜrðər wɪð ju bɪˈfɔr ˈmeɪkɪŋ ðə ˈfaɪnəl dɪˈsɪʒən/"}, {"topicRaw": "19-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 19, "stage": 3, "vi": "Anh/chị có nghĩ ứng viên phù hợp hơn với vị trí khác trong phòng ban không?", "en": "Do you think the candidate would be a better fit for a different role in the department?", "ipa": "/du ju θɪŋk ðə ˈkændɪdət wʊd bi ə ˈbɛtər fɪt fɔr ə ˈdɪfərənt roʊl ɪn ðə dɪˈpɑrtmənt/"}, {"topicRaw": "19-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 19, "stage": 3, "vi": "Anh/chị có ấn tượng với khả năng giải quyết vấn đề của ứng viên trong buổi phỏng vấn không?", "en": "Were you impressed by the candidate's problem-solving skills during the interview?", "ipa": "/wɜr ju ɪmˈprɛst baɪ ðə ˈkændɪdəts ˈprɑbləm ˈsɑlvɪŋ skɪlz ˈdʊrɪŋ ði ˈɪntərvju/"}, {"topicRaw": "19-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 19, "stage": 3, "vi": "Anh/chị mong đợi điều gì cụ thể ở người đảm nhận vị trí này?", "en": "What specifically are you looking for in someone for this role?", "ipa": "/wʌt spəˈsɪfɪkli ɑr ju ˈlʊkɪŋ fɔr ɪn ˈsʌmˌwʌn fɔr ðɪs roʊl/"}, {"topicRaw": "19-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 19, "stage": 3, "vi": "Anh/chị có đang phân vân giữa hai ứng viên cuối cùng không?", "en": "Are you still torn between the final two candidates?", "ipa": "/ɑr ju stɪl tɔrn bɪˈtwin ðə ˈfaɪnəl tu ˈkændɪdəts/"}, {"topicRaw": "19-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 19, "stage": 3, "vi": "Anh/chị có thể chia sẻ lý do vì sao không chọn ứng viên còn lại không?", "en": "Can you share why you didn't choose the other candidate?", "ipa": "/kæn ju ʃɛr waɪ ju ˈdɪdənt tʃuz ði ˈʌðər ˈkændɪdət/"}, {"topicRaw": "19-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 19, "stage": 3, "vi": "Anh/chị cần đưa ra quyết định trước khi ứng viên nhận offer khác.", "en": "You need to decide, before the candidate accepts another offer.", "ipa": "/ju nid tu dɪˈsaɪd bɪˈfɔr ðə ˈkændɪdət əkˈsɛpts əˈnʌðər ˈɑfər/"}, {"topicRaw": "19-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 19, "stage": 3, "vi": "Chúng tôi cần sự đồng thuận giữa HR và anh/chị trước khi tiến hành offer.", "en": "We need alignment between HR and you, before proceeding with the offer.", "ipa": "/wi nid əˈlaɪnmənt bɪˈtwin eɪtʃ ɑr ænd ju bɪˈfɔr prəˈsidɪŋ wɪð ði ˈɑfər/"}, {"topicRaw": "19-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 19, "stage": 3, "vi": "Anh/chị nghĩ ứng viên sẽ hòa nhập nhanh với văn hóa team không?", "en": "Do you think the candidate will adapt quickly to the team culture?", "ipa": "/du ju θɪŋk ðə ˈkændɪdət wɪl əˈdæpt ˈkwɪkli tu ðə tim ˈkʌltʃər/"}, {"topicRaw": "19-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 19, "stage": 4, "vi": "Anh/chị có phần do dự vì ứng viên chưa có kinh nghiệm trong ngành năng lượng đúng không?", "en": "Are you a bit hesitant, because the candidate lacks industry experience in energy?", "ipa": "/ɑr ju ə bɪt ˈhɛzɪtənt bɪˈkɔz ðə ˈkændɪdət læks ˈɪndəstri ɪkˈspɪriəns ɪn ˈɛnərdʒi/"}, {"topicRaw": "19-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 19, "stage": 4, "vi": "Tôi nghĩ tiềm năng học hỏi của ứng viên có thể bù đắp cho điều đó, anh/chị nghĩ sao?", "en": "I think the candidate's learning potential could compensate for that, what do you think?", "ipa": "/aɪ θɪŋk ðə ˈkændɪdəts ˈlɜrnɪŋ pəˈtɛnʃəl kʊd ˈkɑmpənˌseɪt fɔr ðæt wʌt du ju θɪŋk/"}, {"topicRaw": "19-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 19, "stage": 4, "vi": "Anh/chị nên cân nhắc kỹ hơn trước khi từ chối một ứng viên tiềm năng như vậy.", "en": "You should think twice, before rejecting such a promising candidate.", "ipa": "/ju ʃʊd θɪŋk twaɪs bɪˈfɔr rɪˈdʒɛktɪŋ sʌtʃ ə ˈprɑmɪsɪŋ ˈkændɪdət/"}, {"topicRaw": "19-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 19, "stage": 4, "vi": "HR và anh/chị dường như đang đánh giá khác nhau về mức độ phù hợp của ứng viên.", "en": "HR and you seem to have different assessments of the candidate's fit.", "ipa": "/eɪtʃ ɑr ænd ju sim tu hæv ˈdɪfərənt əˈsɛsmənts ʌv ðə ˈkændɪdəts fɪt/"}, {"topicRaw": "19-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 19, "stage": 4, "vi": "Anh/chị có thể đưa ra phản hồi cụ thể hơn thay vì chỉ nói cảm thấy chưa ổn không?", "en": "Could you give more specif petitors.", "ipa": "/wi nid tu ˈænəlaɪz wɪtʃ ˈtælənt grup ɪz æt ˈhaɪɪst rɪsk ʌv ˈbiɪŋ ˈhɛdˌhʌntɪd baɪ kəmˈpɛtɪtərz/"}, {"topicRaw": "22-Talent", "topicName": "Talent", "topicOrder": 22, "stage": 3, "vi": "Việc thiếu minh bạch về lộ trình thăng tiến đang khiến một số nhân viên giỏi cân nhắc rời đi.", "en": "Lack of transparency about promotion paths is making some top performers consider leaving.", "ipa": "/læk ʌv trænsˈpɛrənsi əˈbaʊt prəˈmoʊʃən pæθs ɪz ˈmeɪkɪŋ sʌm tɑp pərˈfɔrmərz kənˈsɪdər ˈlivɪŋ/"}, {"topicRaw": "22-Talent", "topicName": "Talent", "topicOrder": 22, "stage": 3, "vi": "Chúng tôi cần xây dựng bản đồ kỹ năng để xác định nhân tài tiềm năng cần phát triển.", "en": "We need to build a skills map to identify high-potential talent for development.", "ipa": "/wi nid tu bɪld ə skɪlz mæp tu aɪˈdɛntɪfaɪ haɪ pəˈtɛnʃəl ˈtælənt fɔr dɪˈvɛləpmənt/"}, {"topicRaw": "22-Talent", "topicName": "Talent", "topicOrder": 22, "stage": 3, "vi": "Chúng ta nên có chính sách giữ chân riêng cho nhóm nhân sự chủ chốt có nguy cơ bị hunt.", "en": "We should have a dedicated retention policy for key talent at risk of being poached.", "ipa": "/wi ʃʊd hæv ə ˈdɛdɪkeɪtɪd rɪˈtɛnʃən ˈpɑləsi fɔr ki ˈtælənt æt rɪsk ʌv ˈbiɪŋ ˈpoʊtʃt/"}, {"topicRaw": "22-Talent", "topicName": "Talent", "topicOrder": 22, "stage": 3, "vi": "Việc đối chiếu mức lương thị trường thường xuyên giúp công ty không bị động trước đối thủ.", "en": "Regularly benchmarking market salaries keeps the company from being caught off guard by competitors.", "ipa": "/ˈrɛgjələrli ˈbɛntʃmɑrkɪŋ ˈmɑrkɪt ˈsæləriz kips ðə ˈkʌmpəni frʌm ˈbiɪŋ kɔt ɔf gɑrd baɪ kəmˈpɛtɪtərz/"}, {"topicRaw": "22-Talent", "topicName": "Talent", "topicOrder": 22, "stage": 3, "vi": "Chúng tôi cần cải thiện trải nghiệm nhân viên để giảm nguy cơ mất nhân tài vào tay đối thủ.", "en": "We need to improve employee experience to reduce the risk of losing talent to competitors.", "ipa": "/wi nid tu ɪmˈpruv ɛmˈplɔi ɪkˈspɪriəns tu rɪˈdus ðə rɪsk ʌv ˈluzɪŋ ˈtælənt tu kəmˈ tem to detect employees showing signs of wanting to leave.", "ipa": "/wi nid ən ˈɜrli ˈwɔrnɪŋ ˈsɪstəm tu dɪˈtɛkt ɛmˈplɔiz ˈʃoʊɪŋ saɪnz ʌv ˈwɑntɪŋ tu liv/"}, {"topicRaw": "22-Talent", "topicName": "Talent", "topicOrder": 22, "stage": 4, "vi": "Việc đầu tư vào thương hiệu nhà tuyển dụng cần được xem là chiến lược dài hạn, không phải chi phí ngắn hạn.", "en": "Investing in the employer brand should be seen as a long-term strategy, not a short-term cost.", "ipa": "/ɪnˈvɛstɪŋ ɪn ði ɛmˈplɔɪər brænd ʃʊd bi sin æz ə lɔŋ tɜrm ˈstrætədʒi nɑt ə ʃɔrt tɜrm kɔst/"}, {"topicRaw": "22-Talent", "topicName": "Talent", "topicOrder": 22, "stage": 4, "vi": "Chúng ta cần cân nhắc chương trình cổ phần hoặc thưởng giữ chân cho nhân sự cấp cao quan trọng.", "en": "We need to consider equity or retention bonus programs for critical senior talent.", "ipa": "/wi nid tu kənˈsɪdər ˈɛkwəti ɔr rɪˈtɛnʃən ˈboʊnəs ˈproʊgræmz fɔr ˈkrɪtɪkəl ˈsinjər ˈtælənt/"}, {"topicRaw": "22-Talent", "topicName": "Talent", "topicOrder": 22, "stage": 4, "vi": "Đối thủ cạnh tranh sẵn sàng trả cao hơn 20-30% để giành nhân tài giỏi từ chúng ta.", "en": "Competitors are willing to pay 20-30% more to poach top talent from us.", "ipa": "/kəmˈpɛtɪtərz ɑr ˈwɪlɪŋ tu peɪ ˈtwɛnti tu ˈθɜrti pərˈsɛnt mɔr tu poʊtʃ tɑp ˈtælənt frʌm ʌs/"}, {"topicRaw": "22-Talent", "topicName": "Talent", "topicOrder": 22, "stage": 5, "vi": "Đừng đợi đến khi nhân viên giỏi nộp đơn nghỉ việc mới nhận ra họ đã bị đối thủ hunt từ lâu.", "en": "Don't wait until a top employee resigns to realize they've long been headhunted by a competitor.", "ipa": "/doʊnt weɪt ənˈtɪl ə tɑp ɛmˈplɔi rɪˈzaɪnz tu ˈrɪəlaɪz ðeɪv lɔŋ bɪn ˈhɛdˌhʌntɪd baɪ ə kəmˈpɛtɪtər/"}, {"topicRaw": "22-Talent", "topicName": "Talent", "topicOrder": 22, "stage": 5, "vi": "Nhân tài thật sự không rời đi vì tiền, họ rời đi vì không nhìn thấy tương lai ở đây.", "en": "Real talent doesn't leave for money, they leave because they can't see a future here.", "ipa": "/ril ˈtælənt ˈdʌzənt liv fɔr ˈmʌni ð   const STAGE_TITLES = {
    1: 'Survival English at Work',
    2: 'HR & Payroll English',

    4: 'Meeting English',
    5: 'Think and Respond in English'
