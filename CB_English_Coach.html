-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 4, "vi": "Bước tiếp theo: kế toán xác nhận số liệu cuối với HR trước trưa thứ Tư.", "en": "Next step: accounting will confirm the final figures with HR by Wednesday noon.", "ipa": "/nɛkst stɛp: əˈkaʊntɪŋ wɪl kənˈfɝm ðə ˈfaɪnəl ˈfɪɡjɚz wɪθ‿ˌeɪtʃˈɑr baɪ ˈwɛnzdeɪ nun/"}, {"topicRaw": "19-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 5, "vi": "Thật lòng, quy trình lương đã tốt hơn, nhưng vẫn dựa nhiều vào kiểm tra tay.", "en": "Honestly, our payroll process has improved, but we still rely on manual checks.", "ipa": "/ˈɑnəstli, aʊɚ ˈpeɪˌroʊl ˈprɑˌsɛs həz‿ˌɪmˈpruvd, bət wi stɪl rɪˈlaɪ ɑn ˈmænjuəl tʃɛks/"}, {"topicRaw": "19-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 5, "vi": "Theo kinh nghiệm của tôi, đa số lỗi lương đến từ dữ liệu trễ, không phải tính sai.", "en": "From my experience, most payroll errors come from late data, not from wrong calculations.", "ipa": "/frʌm maɪ ɪkˈspɪriəns, moʊst ˈpeɪroʊl‿ˈɛrɚz kʌm frəm leɪt ˈdeɪɾə, nɑt frəm rɔŋ ˌkælkjəˈleɪʃənz/"}, {"topicRaw": "19-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 5, "vi": "Suy cho cùng, nếu dữ liệu đầu vào không sạch, không hệ thống nào tính lương đúng được.", "en": "Ultimately, without clean input data, no system can produce accurate payroll.", "ipa": "/ˈʌltəmətli, wɪˈθaʊt klin‿ˈɪnˌpʊt ˈdeɪɾə, noʊ ˈsɪstəm kən prəˈdus‿ˈækjɚət ˈpeɪˌroʊl/"}, {"topicRaw": "19-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 5, "vi": "Điều tôi lo là trả lương trễ, có thể nhanh chóng làm mất niềm tin vào cả công ty.", "en": "My main worry is late salary payments, which could quickly damage trust.", "ipa": "/maɪ meɪn ˈwɝi ɪz leɪt ˈsælɚi ˈpeɪmənts, wɪtʃ kʊd ˈkwɪkli ˈdæmədʒ trʌst/"}, {"topicRaw": "19-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 5, "vi": "Nếu không tự động hóa nhập chấm công, mỗi tháng chúng ta vẫn mất 2 ngày công.", "en": "Without automating the timesheet import, we'll keep losing two ˈmænjuəl tʃɛks/"}, {"topicRaw": "19-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 6, "vi": "Khi quy mô lên 1.000 người, cách làm hiện tại sẽ cần thêm 2 nhân sự lương.", "en": "Once headcount reaches 1,000, the current process will need two more payroll staff.", "ipa": "/wʌns ˈhɛdˌkaʊnt ˈritʃəz wʌn ˈθaʊzənd, ðə ˈkɝənt ˈprɑsɛs wɪl nid tu mɔr ˈpeɪroʊl stæf/"}, {"topicRaw": "19-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 6, "vi": "Bảng lương không chỉ là con số, mà là sinh kế.", "en": "Payroll isn't just numbers; it's people's livelihoods.", "ipa": "/ˈpeɪroʊl‿ˈɪzənt dʒʌst ˈnʌmbɚz; ɪts ˈpipəlz ˈlaɪvlihʊdz/"}, {"topicRaw": "19-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 6, "vi": "Các công ty tự động hóa đối chiếu chỉ cần 2 ngày để đóng kỳ lương.", "en": "Companies that automate reconciliation close payroll in just two days.", "ipa": "/ˈkʌmpəniz ðæɾ‿ˈɔɾəmeɪt ˌrɛkənsɪliˈeɪʃən kloʊs ˈpeɪroʊl‿ɪn dʒʌst tu deɪz/"}, {"topicRaw": "19-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 6, "vi": "Tôi đề xuất đầu tư công cụ đối chiếu tự động khoảng 200 triệu, hoàn vốn trong khoảng 14 tháng.", "en": "I recommend a 200 million VND reconciliation tool, with payback in about 14 months.", "ipa": "/aɪ ˌrɛkəˈmɛnd‿ə tu ˈhʌndrəd ˈmɪljən ˌviɛnˈdi ˌrɛkənsɪliˈeɪʃən tul, wɪθ ˈpeɪˌbæk‿ɪn‿əˈbaʊt ˈfɔrˈtin mʌnθs/"}, {"topicRaw": "19-Payroll", "topicName": "Payroll", "topicOrder": 19, "stage": 6, "vi": "Mục tiêu là đóng kỳ lương trong 3 ngày với độ chính xác 99,8%.", "en": "We aim to close payroll in three days at 99.8% accuracy.", "ipa": "/wi eɪm tə kloʊs ˈpeɪroʊl‿ɪn θri deɪz‿ət ˈnaɪnti naɪn pɔɪnt‿eɪt pɚˈsɛnt‿ˈækjɚəsi/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 1, "vi": "Khung lương bậc này từ 18 đến 26 triệu, điểm giữa là 22 triệu.", "en": "This grade's range is 18 to 26 million VND, with a midpoint of 22.", "ipa": "/ðɪs ɡreɪdz reɪndʒ‿ɪz‿eɪˈtin tə ˈtwɛnti sɪks ˈmɪljən ˌviɛnˈdi, wɪθ‿ə ˈmɪdˌpɔɪnt‿əv ˈtwɛntiˌtu/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 1, "vi": "Tỷ lệ so với điểm giữa khung của bạn là 0,92, tức hơi thấp hơn điểm giữa.", "en": "Your compa-ratio is 0.92, meaning you're slightly below the midpoint.", "ipa": "/jɚ ˈkɑmpə ˈreɪʃiˌoʊ ɪz ˈzɪroʊ pɔɪnt naɪn tu, ˈminɪŋ jʊr ˈslaɪtli bɪˈloʊ ðə ˈmɪdˌpɔɪnt/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 1, "vi": "Con số này đã gồm phụ cấp hay chỉ là lương cơ bản?", "en": "Does this figure include allowances, or is it base salary only?", "ipa": "/dʌz ðɪs ˈfɪɡjɚ‿ɪnˈklud‿əˈlaʊənsɪz, ɚ‿ɪz‿ɪt beɪs ˈsæləri ˈoʊnli/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 1, "vi": "Vị trí này tương ứng với bậc nào trong cơ cấu lương mới?", "en": "Which grade does this role map to in the new salary structure?", "ipa": "/wɪtʃ ɡreɪd dʌz ðɪs roʊl mæp tu ɪn ðə nu ˈsæləri ˈstrʌktʃɚ/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 1, "vi": "Vui lòng dùng khung lương mới cho mọi offer từ tháng này.", "en": "Please use the new ranges for all offers from this month onward.", "ipa": "/pliz juz ðə nu ˈreɪndʒɪz fɚ‿ɔl‿ˈɔfɚz frəm ðɪs mʌnθ‿ˈɑnwɚd/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 1, "vi": "Vui lòng không hứa mức tăng nào trước khi được duyệt chính thức.", "en": "Please don't promise any increase before it's formally approved.", "ipa": "/pliz doʊnt ˈprɑmɪs‿ˈɛni ˈɪnkris bɪˈfɔr‿ɪts ˈfɔrməli əˈpruvd/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 1, "vi": "Xin lỗi, phụ lục lương của bạn chưa cập nhật mức tăng từ tháng 4.", "en": "Sorry, your salary annex hasn't been updated with the April increase.", "ipa": "/ˈsɑri, jɚ ˈsæləri ˈænɛks ˈhæzənt bɪn‿ʌpˈdeɪɾɪd wɪθ ði ˈeɪprəl‿ˈɪnkris/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 1, "vi": "Tôi sẽ gửi bạn thư điều chỉnh lương và phụ lục mới trong tuần này.", "en": "I'll send your salary letter and updated annex this week.", "ipa": "/aɪl sɛnd jɚ ˈsæləri ˈlɛɾɚ‿ən‿ʌpˈdeɪɾɪd‿ˈænɛks ðɪs wik/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 2, "vi": "Theo luật, lương trong hợp đồng không được thấp hơn lương tối thiểu vùng.", "en": "By law, contract salaries can't fall below the regional minimum wage.", "ipa": "/baɪ lɔ, ˈkɑntrækt ˈsæləriz kænt fɔl bɪˈloʊ ðə ˈridʒənəl ˈmɪnəməm weɪdʒ/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 2, "vi": "Đợt xét lương gồm khảo sát thị trường, phân bổ ngân sách, quản lý đề xuất và hiệu chỉnh.", "en": "The salary review covers market benchmarking, budget allocation, manager proposals, and calibration.", "ipa": "/ðə ˈsæləri rɪˈvju ˈkʌvɚz ˈmɑrkɪt ˈbɛntʃmɑrkɪŋ, ˈbʌdʒɪɾ‿ˌæləˈkeɪʃən, ˈmænɪdʒɚ prəˈpoʊzəlz, ən ˌkæləˈbreɪʃən/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 2, "vi": "Bạn có thể đề xuất mức tăng trong phạm vi ngân sách 7% của phòng không?", "en": "Could you propose increases within your department's 7% merit budget?", "ipa": "/kʊd ju prəˈpoʊz‿ˈɪnkrisɪz wɪˈθɪn jɚ dɪˈpɑrtmənts ˈsɛvən pɚˈsɛnt ˈmɛrɪt ˈbʌdʒɪt/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 2, "vi": "Bạn có phiền giải thích lý do đề xuất tăng 20% cho trường hợp này không?", "en": "Would you mind justifying the 20% increase you've proposed for this case?", "ipa": "/wʊd ju maɪnd ˈdʒʌstəˌfaɪɪŋ ðə ˈtwɛnti pɚˈsɛnt‿ˈɪnkris juv prəˈpoʊzd fɚ ðɪs keɪs/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 2, "vi": "Người dưới điểm giữa khung được tăng nhiều hơn để thu hẹp chênh lệch nội bộ.", "en": "Employees below the midpoint get larger increases to close internal gaps.", "ipa": "/ɪmˈplɔɪiz bɪˈloʊ ðə ˈmɪdˌpɔɪnt ɡɛt ˈlɑrdʒɚ‿ˈɪnkrisɪz tə kloʊs‿ɪnˈtɝnəl ɡæps/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 2, "vi": "Nếu lương đã chạm trần khung, phần tăng sẽ được chi dưới dạng một khoản một lần.", "en": "If salary is already at the range maximum, the increase becomes a lump sum.", "ipa": "/ɪf ˈsælɚi ɪz‿ɔlˈrɛdi ət ðə reɪndʒ ˈmæksəməm, ði ˌɪnˈkris bɪˈkʌmz‿ə lʌmp sʌm/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 2, "vi": "Rất tiếc, năm nay công ty không có ngân sách tăng lương đồng loạt.", "en": "Unfortunately, there's no budget for a general salary increase this year.", "ipa": "/ʌnˈfɔrtʃənətli, ðɛrz noʊ ˈbʌdʒɪt fɚ‿ə ˈdʒɛnɚəl ˈsæləri ˈɪnkris ðɪs jɪr/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 2, "vi": "Tôi sẽ đảm bảo lương mới được cập nhật vào hệ thống trước kỳ lương tháng 4.", "en": "I'll make sure the new salaries are loaded into the system before April payroll.", "ipa": "/aɪl meɪk ʃʊr ðə nu ˈsæləriz‿ɚ ˈloʊdɪd‿ˈɪntu ðə ˈsɪstəm bɪˈfɔr‿ˈeɪprəl ˈpeɪroʊl/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 3, "vi": "Để tôi giải thích cách xây dựng khung lương dựa trên dữ liệu thị trường.", "en": "Let me explain how we build our salary ranges using market data.", "ipa": "/lɛt mi ɪkˈspleɪn haʊ wi bɪld‿ˈaʊɚ ˈsæləri ˈreɪndʒɪz ˈjuzɪŋ ˈmɑrkɪt ˈdeɪɾə/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 3, "vi": "Để tôi làm rõ: khung lương là hướng dẫn, không phải cam kết.", "en": "Let me clarify: ranges are guidelines, not promises.", "ipa": "/lɛt mi ˈklɛrəˌfaɪ: ˈreɪndʒəz‿ɚ ˈɡaɪdˌlaɪnz, nɑt ˈprɑməsəz/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 3, "vi": "Theo khảo sát thị trường, lương kỹ sư của ta thấp hơn 10%.", "en": "Based on the market survey, our engineers are paid about 10% below market.", "ipa": "/beɪst‿ɑn ðə ˈmɑrkɪt ˈsɝveɪ, ˈaʊɚ‿ˌɛndʒəˈnɪrz‿ɚ peɪd‿əˈbaʊt tɛn pɚˈsɛnt bɪˈloʊ ˈmɑrkɪt/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 3, "vi": "Tôi đề xuất rà soát khung lương mỗi năm theo thị trường.", "en": "I recommend reviewing our salary ranges against the market every year.", "ipa": "/aɪ ˌrɛkəˈmɛnd rɪˈvjuɪŋ‿ˈaʊɚ ˈsæləri ˈreɪndʒɪz‿əˈɡɛnst ðə ˈmɑrkɪɾ‿ˈɛvri jɪr/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 3, "vi": "Tôi đề nghị công khai khung lương cho từng bậc.", "en": "I'd suggest sharing the salary range for each grade with employees.", "ipa": "/aɪd səˈdʒɛst ˈʃɛrɪŋ ðə ˈsæləri reɪndʒ fɚ‿itʃ ɡreɪd wɪθ‿ɪmˈplɔɪiz/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 3, "vi": "Theo tôi, lương công bằng quan trọng hơn lương cao.", "en": "In my view, fair pay matters more to employees than the highest pay.", "ipa": "/ɪn maɪ vju, fɛr peɪ ˈmæɾɚz mɔr tu ɪmˈplɔɪiz ðən ðə ˈhaɪɪst peɪ/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 3, "vi": "Tôi hiểu, nhưng tăng lương cho 1 người sẽ lệch cả team.", "en": "I see your point, but one exception would create imbalance across the team.", "ipa": "/aɪ si jɚ pɔɪnt, bət wʌn‿ɪkˈsɛpʃən wʊd kriˈeɪɾ‿ɪmˈbæləns‿əˈkrɔs ðə tim/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 3, "vi": "Có lẽ nên tăng theo hiệu suất thay vì tăng đồng loạt.", "en": "It might be worth using merit-based increases instead of a flat rate.", "ipa": "/ɪt maɪt bi wɝθ ˈjuzɪŋ ˈmɛrɪt beɪst‿ˈɪnkrisɪz‿ɪnˈstɛd‿əv‿ə flæt reɪt/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 4, "vi": "Chúng ta chuyển sang xét tăng lương năm nay, bắt đầu từ khối kỹ thuật.", "en": "Let's move on to this year's salary review, starting with the technical team.", "ipa": "/lɛts muv‿ɑn tə ðɪs jɪrz ˈsæləri rɪˈvju, ˈstɑrɾɪŋ wɪθ ðə ˈtɛknɪkəl tim/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 4, "vi": "Bạn trình bày cơ cấu lương mới và cách xếp bậc được không?", "en": "Can you take us through the new salary structure and how grades are set?", "ipa": "/kæn ju teɪk‿əs θru ðə nu ˈsæləri ˈstrʌktʃɚ‿ən haʊ ɡreɪdz‿ɚ sɛt/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 4, "vi": "Có một điều tôi lo: 3 kỹ sư đang hưởng lương dưới điểm giữa thị trường.", "en": "One thing worries me: three engineers are paid below the market midpoint.", "ipa": "/wʌn θɪŋ ˈwɝiz mi: θri ˌɛndʒəˈnɪrz‿ɚ peɪd bɪˈloʊ ðə ˈmɑrkɪt ˈmɪdˌpɔɪnt/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 4, "vi": "Tôi hiểu đề nghị này, tuy nhiên mức offer đã chạm trần khung lương.", "en": "I understand; however, this offer is already at the top of the band.", "ipa": "/aɪ ˌʌndɚˈstænd; ˌhaʊˈɛvɚ, ðɪs‿ˈɔfɚ ɪz‿ɔlˈrɛdi ət ðə tɑp‿əv ðə bænd/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 4, "vi": "Hay tăng 8% bây giờ và xét lại sau 6 tháng dựa trên kết quả?", "en": "How about 8% now, and review again in six months based on results?", "ipa": "/haʊ əˈbaʊt‿eɪt pərˈsɛnt naʊ, ən ˌriˈvju əˈɡɛn‿ɪn sɪks mʌnθs beɪst‿ɑn rɪˈzʌlts/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 4, "vi": "Chúng tôi không thể tăng lương cơ bản, nhưng có thể tăng thưởng cuối năm.", "en": "We can't raise the base salary, but we can increase the year-end bonus.", "ipa": "/wi kænt reɪz ðə beɪs ˈsælɚi, bət wi kən‿ˌɪnˈkris ðə jɪr ɛnd ˈboʊnəs/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 4, "vi": "Tóm lại, ngân sách tăng lương năm nay là 7% quỹ lương, chia theo hiệu suất.", "en": "To summarize, this year's merit budget is 7% of total payroll, split by performance.", "ipa": "/tu ˈsʌməˌraɪz, ðɪs jɪrz ˈmɛrɪt ˈbʌdʒɪɾ‿ɪz ˈsɛvən pɚˈsɛnt‿əv ˈtoʊɾəl ˈpeɪroʊl, splɪt baɪ pɚˈfɔrməns/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 4, "vi": "Bước tiếp theo: HR gửi khung lương cập nhật cho các quản lý trước thứ Sáu.", "en": "Next step: HR will send the updated salary bands to managers by Friday.", "ipa": "/nɛkst stɛp: eɪtʃ ɑr wɪl sɛnd ði əpˈdeɪɾɪd ˈsælɚi bændz tə ˈmænədʒɚz baɪ ˈfraɪdi/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 5, "vi": "Thật lòng, khung lương 3 năm chưa cập nhật nên không còn sát thị trường.", "en": "Honestly, our salary bands are three years old and no longer reflect the market.", "ipa": "/ˈɑnəstli, aʊɚ ˈsælɚi bændz‿ɚ θri jɪrz‿oʊld‿ən noʊ ˈlɔŋɡɚ rɪˈflɛkt ðə ˈmɑrkət/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 5, "vi": "Theo kinh nghiệm, người ta nghỉ vì chênh lệch bất công nhiều hơn vì lương thấp.", "en": "In my experience, people leave over unfair pay gaps more often than low pay.", "ipa": "/ɪn maɪ ɪkˈspɪriəns, ˈpipəl liv‿ˈoʊvɚ ənˈfɛr peɪ ɡæps mɔr‿ˈɔfən ðæn loʊ peɪ/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 5, "vi": "Điều quan trọng là lương phải công bằng nội bộ trước khi cạnh tranh bên ngoài.", "en": "What really matters is that pay is fair internally before it competes externally.", "ipa": "/wʌt ˈrɪli ˈmæɾɚz‿ɪz ðət peɪ ɪz fɛr‿ˌɪnˈtɝnəli bɪˈfɔr‿ɪt kəmˈpits‿ɪkˈstɝnəli/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 5, "vi": "Rủi ro lớn nhất là mất kỹ sư giỏi vào tay đối thủ trả cao hơn 15%.", "en": "The main risk is losing key engineers to competitors who pay 15% more.", "ipa": "/ðə meɪn rɪsk‿ɪz ˈluzɪŋ ki ˌɛndʒəˈnɪrz tə kəmˈpɛɾɪɾɚz hu peɪ ˌfɪfˈtin pɚˈsɛnt mɔr/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 5, "vi": "Nếu năm nay không điều chỉnh khung lương, tuyển vị trí kỹ thuật sẽ càng khó.", "en": "Unless we adjust the bands this year, technical hiring will only get harder.", "ipa": "/ənˈlɛs wi əˈdʒʌst ðə bændz ðɪs jɪr, ˈtɛknɪkəl ˈhaɪrɪŋ wɪl‿ˈoʊnli ɡɛt ˈhɑrdɚ/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 5, "vi": "Tôi phản bác tăng đều cho mọi người, vì người làm kém cũng được như người giỏi.", "en": "I'd challenge a flat increase for everyone, because it rewards low performers equally.", "ipa": "/aɪd ˈtʃælɪndʒ‿ə flæɾ‿ˈɪnkris fɚ‿ˈɛvriˌwʌn, bɪˈkɔz‿ɪt rɪˈwɔrdz loʊ pɚˈfɔrmɚz‿ˈikwəli/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 5, "vi": "Điều tôi lo nhất là người mới đang hưởng lương cao hơn người cũ cùng vị trí.", "en": "What concerns me most is that new hires now earn more than experienced staff.", "ipa": "/wʌt kənˈsɝnz mi moʊst‿ɪz ðət nu ˈhaɪɚz naʊ ɝn mɔr ðæn‿ɪkˈspɪriənst stæf/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 5, "vi": "Tôi đề xuất khảo sát lương thị trường trước kỳ xét và xử lý chênh lệch lớn trước.", "en": "What I'd propose is a market survey first, then fixing the biggest gaps.", "ipa": "/wʌt‿aɪd prəˈpoʊz‿ɪz‿ə ˈmɑrkət sɚˈveɪ fɝst, ðɛn ˈfɪksɪŋ ðə ˈbɪɡəst ɡæps/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 6, "vi": "Trả lương bằng hạt đậu thì nhận về toàn khỉ.", "en": "Pay peanuts, get monkeys.", "ipa": "/peɪ ˈpinʌts, ɡɛt ˈmʌŋkiz/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 6, "vi": "Công bằng quan trọng hơn con số tuyệt đối.", "en": "Fairness matters more than the absolute number.", "ipa": "/ˈfɛrnəs ˈmæɾɚz mɔr ðən ði ˈæbsəˌlut ˈnʌmbɚ/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 6, "vi": "35% nhân viên đang dưới 90% điểm giữa khung, phần lớn là người làm lâu năm.", "en": "35% of employees sit below 90% of the midpoint, mostly long-serving staff.", "ipa": "/ˈθɝɾi faɪv pərˈsɛnt‿əv‿ɛmˈplɔɪiz sɪt bɪˈloʊ ˈnaɪnti pərˈsɛnt‿əv ðə ˈmɪdˌpɔɪnt, ˈmoʊstli lɔŋ ˈsɝvɪŋ stæf/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 6, "vi": "Nếu không xử lý, chênh lệch giữa người mới và người cũ sẽ ngày càng lớn và làm giảm tinh thần.", "en": "Left unaddressed, the gap between new and tenured staff will widen and erode morale.", "ipa": "/lɛft‿ˌʌnəˈdrɛst, ðə ɡæp bɪˈtwin nu ən ˈtɛnjɚd stæf wɪl ˈwaɪdən‿ən‿ɪˈroʊd mɚˈæl/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 6, "vi": "Lương công bằng giữ người, không phải lương cao nhất.", "en": "Fair pay, not the highest pay, keeps good people.", "ipa": "/fɛr peɪ, nɑt ðə ˈhaɪɪst peɪ, kips ɡʊd ˈpipəl/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 6, "vi": "Thị trường năm nay tăng lương khoảng 7 đến 8%, trong khi chúng ta chỉ dự trù 5%.", "en": "The market is moving seven to eight percent this year; we've budgeted only 5%.", "ipa": "/ðə ˈmɑrkət‿ɪz ˈmuvɪŋ ˈsɛvən tə eɪt pɚˈsɛnt ðɪs jɪr; wiv ˈbʌdʒɪtəd‿ˈoʊnli faɪv pərˈsɛnt/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 6, "vi": "Tôi đề xuất thêm 1,5% ngân sách riêng cho nhóm dưới khung, tổng khoảng 900 triệu.", "en": "I propose an extra 1.5% budget for below-range employees, about 900 million VND.", "ipa": "/aɪ prəˈpoʊz‿ən‿ˈɛkstrə wʌn pɔɪnt faɪv pərˈsɛnt ˈbʌdʒɪt fɚ bɪˈloʊ reɪndʒ‿ɛmˈplɔɪiz, əˈbaʊt naɪn ˈhʌndrəd ˈmɪljən vi ɛn di/"}, {"topicRaw": "20-Salary & Salary Guide", "topicName": "Salary & Salary Guide", "topicOrder": 20, "stage": 6, "vi": "Trong 2 năm, mục tiêu là 90% nhân viên nằm trong khoảng 90 đến 110% điểm giữa.", "en": "Within two years, we want 90% of staff within 90–110% of midpoint.", "ipa": "/wɪˈðɪn tu jɪrz, wi wɑnt ˈnaɪnti pərˈsɛnt‿əv stæf wɪˈðɪn ˈnaɪnti wʌn ˈhʌndrəd tɛn pərˈsɛnt‿əv ˈmɪdˌpɔɪnt/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 1, "vi": "Phụ cấp chức vụ và phụ cấp thâm niên thuộc tiền lương đóng bảo hiểm.", "en": "Position and seniority allowances are included in the insurance contribution base.", "ipa": "/pəˈzɪʃən‿ən ˌsinˈjɔrəɾi əˈlaʊənsɪz‿ɚ‿ɪnˈkludɪd‿ɪn ði ɪnˈʃʊrəns ˌkɑntrəˈbjuʃən beɪs/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 1, "vi": "Phụ cấp điện thoại là mức khoán hằng tháng, không cần nộp hóa đơn.", "en": "The phone allowance is a fixed monthly amount, with no receipts needed.", "ipa": "/ðə foʊn‿əˈlaʊəns‿ɪz‿ə fɪkst ˈmʌnθli əˈmaʊnt, wɪθ noʊ rɪˈsits ˈnidəd/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 1, "vi": "Phụ cấp xăng xe này có được miễn thuế TNCN không?", "en": "Is this fuel allowance exempt from personal income tax?", "ipa": "/ɪz ðɪs ˈfjuəl‿əˈlaʊəns‿ɪɡˈzɛmpt frəm ˈpɝsənəl‿ˈɪnˌkʌm tæks/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 1, "vi": "Khoản phụ cấp này có được ghi trong hợp đồng lao động không?", "en": "Is this allowance specified in the employment contract?", "ipa": "/ɪz ðɪs‿əˈlaʊəns ˈspɛsəˌfaɪd‿ɪn ði ɛmˈplɔɪmənt ˈkɑntrækt/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 1,  "Bạn có thể xác nhận phụ cấp nào được trả cố định hằng tháng không?", "en": "Could you confirm which allowances are paid at a fixed monthly rate?", "ipa": "/kʊd ju kənˈfɝm wɪtʃ‿əˈlaʊənsɪz‿ɚ peɪd‿əɾ‿ə fɪkst ˈmʌnθli reɪt/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 2, "vi": "Bạn có phiền gửi quyết định áp dụng phụ cấp trách nhiệm cho vị trí này không?", "en": "Would you mind sending the approval for this role's responsibility allowance?", "ipa": "/wʊd ju maɪnd ˈsɛndɪŋ ði əˈpruvəl fɚ ðɪs roʊlz rɪˌspɑnsəˈbɪləɾi əˈlaʊəns/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 2, "vi": "Phụ cấp này phải đóng bảo hiểm vì nó cố định và được ghi trong hợp đồng.", "en": "This allowance is subject to insurance because it's fixed and written into the contract.", "ipa": "/ðɪs‿əˈlaʊəns‿ɪz ˈsʌbdʒɪkt tu ɪnˈʃʊrəns bɪˈkɔz‿ɪts fɪkst‿ən ˈrɪɾən‿ˈɪntu ðə ˈkɑntrækt/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 2, "vi": "Nếu bạn nghỉ không lương cả tháng, phụ cấp cố định của tháng đó cũng không được chi.", "en": "If you take a full month of unpaid leave, fixed allowances aren't paid.", "ipa": "/ɪf ju teɪk‿ə fʊl mʌnθ‿əv‿ənˈpeɪd liv, fɪkst‿əˈlaʊənsɪz‿ˈɑrənt peɪd/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 2, "vi": "Rất tiếc, khoản phụ cấp nhà ở này sẽ được tính vào thu nhập chịu thuế.", "en": "Unfortunately, this housing allowance will be treated as taxable income.", "ipa": "/ʌnˈfɔrtʃənətli, ðɪs ˈhaʊzɪŋ‿əˈlaʊəns wɪl bi ˈtriɾɪd‿əz ˈtæksəbəl‿ˈɪnˌkʌm/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 2, "vi": "Tôi sẽ gửi kế toán bảng phân loại phụ cấp chịu thuế và miễn thuế.", "en": "I'll send accounting a breakdown of taxable and exempt allowances.", "ipa": "/aɪl sɛnd‿əˈkaʊntɪŋ‿ə ˈbreɪkdaʊn‿əv ˈtæksəbəl‿ən‿ɪɡˈzɛmpt‿əˈlaʊənsɪz/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 3, "vi": "Để tôi giải thích phụ cấp nào được miễn thuế và nào chịu thuế.", "en": "Let me explain which allowances are tax-exempt and which are taxable.", "ipa": "/lɛt mi ɪkˈspleɪn wɪtʃ‿əˈlaʊənsɪz‿ɚ tæks‿ɪɡˈzɛmpt‿ən wɪtʃ‿ɚ ˈtæksəbəl/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 3, "vi": "Để tôi làm rõ: phụ cấp này không tính vào lương đóng bảo hiểm.", "en": "Let me clarify: this allowance isn't included in the salary for social insurance.", "ipa": "/lɛt mi ˈklɛrəˌfaɪ: ðɪs‿əˈlaʊəns‿ˈɪzənt‿ɪnˈkludɪd‿ɪn ðə ˈsæləri fɚ ˈsoʊʃəl‿ɪnˈʃʊrəns/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 3, "vi": "Theo rà soát, công ty đang có 9 loại phụ cấp khác nhau.", "en": "Based on our review, we currently pay nine different types of allowances.", "ipa": "/beɪst‿ɑn‿ˈaʊɚ rɪˈvju, wi ˈkɝəntli peɪ naɪn ˈdɪfɚənt taɪps‿əv‿əˈlaʊənsɪz/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 3, "vi": "Tôi đề xuất gộp các phụ cấp nhỏ thành một khoản cố định.", "en": "I recommend combining the small allowances into one fixed monthly payment.", "ipa": "/aɪ ˌrɛkəˈmɛnd kəmˈbaɪnɪŋ ðə smɔl‿əˈlaʊənsɪz‿ˈɪntu wʌn fɪkst ˈmʌnθli ˈpeɪmənt/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 3, "vi": "Tôi đề nghị thanh toán công tác phí bằng thẻ công ty, đỡ giấy tờ.", "en": "I'd suggest paying travel expenses with corporate cards to reduce paperwork.", "ipa": "/aɪd səˈdʒɛst ˈpeɪɪŋ ˈtrævəl‿ɪkˈspɛnsɪz wɪθ ˈkɔrpərət kɑrdz tə rɪˈdus ˈpeɪpɚˌwɝk/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 3, "vi": "Theo tôi, mỗi phụ cấp cần có mục đích rõ ràng và bảo vệ được.", "en": "In my view, every allowance should have a clear and defensible purpose.", "ipa": "/ɪn maɪ vju, ˈɛvri əˈlaʊəns ʃʊd hæv‿ə klɪr‿ən dɪˈfɛnsəbəl ˈpɝpəs/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 3, "vi": "Tôi hiểu, nhưng phụ cấp này phải có chứng từ hợp lệ.", "en": "I see your point, but this allowance needs proper supporting documents.", "ipa": "/aɪ si jɚ pɔɪnt, bət ðɪs‿əˈlaʊəns nidz ˈprɑpɚ səˈpɔrɾɪŋ ˈdɑkjəmənts/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 3, "vi": "Có lẽ nên rà soát chính sách phụ cấp trước kỳ tăng lương.", "en": "It might be worth reviewing the allowance policy before the salary review.", "ipa": "/ɪt maɪt bi wɝθ rɪˈvjuɪŋ ði əˈlaʊəns ˈpɑləsi bɪˈfɔr ðə ˈsæləri rɪˈvju/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 4, "vi": "Chúng ta chuyển sang chính sách phụ cấp, vì có nhiều câu hỏi về thuế.", "en": "Let's turn to the allowance policy, since we've had many tax questions.", "ipa": "/lɛts tɝn tə ði əˈlaʊəns ˈpɑləsi, sɪns wiv hæd ˈmɛni tæks ˈkwɛstʃənz/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 4, "vi": "Bạn trình bày khoản nào chịu thuế và khoản nào miễn thuế nhé?", "en": "Would you mind going over which allowances are taxable and which aren't?", "ipa": "/wʊd ju maɪnd ˈɡoʊɪŋ‿ˈoʊvɚ wɪtʃ‿əˈlaʊənsɪz‿ɚ ˈtæksəbəl‿ən wɪtʃ‿ɑrnt/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 4, "vi": "Tôi muốn nêu lo ngại: mỗi chi nhánh trả phụ cấp xăng khác nhau.", "en": "I'd like to raise a concern: each branch pays a different fuel allowance.", "ipa": "/aɪd laɪk tə reɪz‿ə kənˈsɝn: itʃ bræntʃ peɪz‿ə ˈdɪfɚənt ˈfjuəl‿əˈlaʊəns/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 4, "vi": "Tôi hiểu nhân viên quen phụ cấp cũ, tuy nhiên cần thống nhất.", "en": "I get that staff like the old allowances; however, we need one policy.", "ipa": "/aɪ ɡɛt ðət stæf laɪk ði oʊld‿əˈlaʊənsɪz; ˌhaʊˈɛvɚ, wi nid wʌn ˈpɑləsi/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 4, "vi": "Hay chúng ta chuyển 2 khoản phụ cấp nhỏ vào lương cơ bản?", "en": "Would it help if we moved two small allowances into the basic salary instead?", "ipa": "/wʊd‿ɪt hɛlp‿ɪf wi muvd tu smɔl‿əˈlaʊənsɪz‿ˈɪntu ðə ˈbeɪsɪk ˈsæləri ɪnˈstɛd/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 4, "vi": "Không thể bỏ phụ cấp ngay, nhưng có thể chuyển đổi trong 6 tháng.", "en": "We can't remove allowances overnight, but we can phase them out over six months.", "ipa": "/wi kænt riˈmuv‿əˈlaʊənsɪz‿ˈoʊvɚˈnaɪt, bət wi kən feɪz ðɛm‿aʊt‿ˈoʊvɚ sɪks mʌnθs/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 4, "vi": "Tóm lại, chính sách phụ cấp mới áp dụng từ quý sau.", "en": "To wrap up, the new allowance policy will apply from next quarter onward.", "ipa": "/tu ræp‿ʌp, ðə nu əˈlaʊəns ˈpɑləsi wɪl‿əˈplaɪ frəm nɛkst ˈkwɔrɾɚ‿ˈɑnwɚd/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 4, "vi": "Sau buổi họp này, kế toán tính tác động thuế và gửi trước thứ Tư.", "en": "After this meeting, accounting will calculate the tax impact and share it by Wednesday.", "ipa": "/ˈæftɚ ðɪs ˈmiɾɪŋ, əˈkaʊntɪŋ wɪl ˈkælkjəleɪt ðə tæks‿ˈɪmpækt‿ən ʃɛr‿ɪt baɪ ˈwɛnzdeɪ/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 5, "vi": "Thật lòng, vài khoản phụ cấp chỉ để giảm thuế, và kiểm toán sẽ nhận ra.", "en": "To be frank, some allowances exist only to lower tax, and auditors will notice.", "ipa": "/tə bi fræŋk, sʌm‿əˈlaʊənsɪz‿ɪɡˈzɪst‿ˈoʊnli tə ˈloʊɚ tæks, ən‿ˈɑdətɚz wɪl ˈnoʊɾəs/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 5, "vi": "Theo kinh nghiệm, phụ cấp đơn giản ít bị khiếu nại hơn nhiều khoản lặt vặt.", "en": "What I've seen is that simple allowance policies cause fewer complaints than long lists.", "ipa": "/wʌt‿aɪv sin‿ɪz ðət ˈsɪmpəl‿əˈlaʊəns ˈpɑləsiz kɑz ˈfjuɚ kəmˈpleɪnts ðæn lɔŋ lɪsts/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 5, "vi": "Mấu chốt là mỗi khoản phụ cấp phải có mục đích và quy định rõ ràng.", "en": "The bottom line: every allowance needs a clear purpose and clear rules.", "ipa": "/ðə ˈbɑɾəm laɪn: ˈɛvri əˈlaʊəns nidz‿ə klɪr ˈpɝpəs‿ən klɪr rulz/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 5, "vi": "Rủi ro lớn nhất là khi thanh tra, thuế coi phụ cấp là thu nhập chịu thuế.", "en": "The biggest risk is that tax authorities treat these allowances as taxable income.", "ipa": "/ðə ˈbɪɡəst rɪsk‿ɪz ðət tæks‿əˈθɔrətiz trit ðiz‿əˈlaʊənsɪz‿əz ˈtæksəbəl‿ˈɪnˌkʌm/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 5, "vi": "Nếu không rà soát phụ cấp, chúng ta sẽ tiếp tục trả cho những khoản không ai dùng.", "en": "If we don't review the allowance list, we'll keep paying for benefits nobody uses.", "ipa": "/ɪf wi doʊnt ˌriˈvju ði əˈlaʊəns lɪst, wil kip ˈpeɪɪŋ fɚ ˈbɛnəfɪts ˈnoʊˌbɑˌdi ˈjusəz/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 5, "vi": "Tôi phản đối thêm phụ cấp mới, vì sau này sẽ rất khó cắt bỏ.", "en": "I'd push back on adding allowances; they're hard to remove later.", "ipa": "/aɪd pʊʃ bæk‿ɑn‿ˈædɪŋ‿əˈlaʊənsɪz; ðɛr hɑrd tə riˈmuv ˈleɪɾɚ/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 5, "vi": "Điều tôi lo nhất là mỗi chi nhánh trả phụ cấp khác nhau cho cùng việc.", "en": "What worries me is that different branches pay different allowances for the same job.", "ipa": "/wʌt ˈwɝiz mi ɪz ðət ˈdɪfɚənt ˈbræntʃəz peɪ ˈdɪfɚənt‿əˈlaʊənsɪz fɚ ðə seɪm dʒɑb/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 5, "vi": "Tôi đề xuất gộp các phụ cấp nhỏ vào lương cơ bản và chỉ giữ khoản thiết yếu.", "en": "My suggestion is to merge small allowances into base salary and keep essential ones.", "ipa": "/maɪ səˈdʒɛstʃən‿ɪz tə mɝdʒ smɔl‿əˈlaʊənsɪz‿ˈɪntu beɪs ˈsælɚi ən kip‿ɛˈsɛnʃəl wʌnz/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 6, "vi": "Đơn giản là đỉnh cao của sự tinh tế.", "en": "Simplicity is the ultimate sophistication.", "ipa": "/sɪmˈplɪsəɾi ɪz ði ˈʌltəmət səˌfɪstɪˈkeɪʃən/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 6, "vi": "Phụ cấp tốt là phụ cấp ai cũng hiểu.", "en": "A good allowance is one everyone understands.", "ipa": "/ə ɡʊd‿əˈlaʊəns‿ɪz wʌn‿ˈɛvriˌwʌn‿ˌʌndɚˈstændz/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 6, "vi": "Chúng ta đang trả 11 loại phụ cấp, chiếm 28% tổng thu nhập, nhưng 5 loại thiếu căn cứ rõ ràng.", "en": "We pay 11 allowance types, 28% of pay; five lack a clear basis.", "ipa": "/wi peɪ ɪˈlɛvən‿əˈlaʊəns taɪps, ˈtwɛni eɪt pərˈsɛnt‿əv peɪ; faɪv læk‿ə klɪr ˈbeɪsəs/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 6, "vi": "Khi thanh tra, các khoản này có thể bị truy thu bảo hiểm và thuế cho nhiều năm.", "en": "In an inspection, these items could trigger several years of back insurance and tax.", "ipa": "/ɪn‿ən‿ˌɪnˈspɛkʃən, ðiz‿ˈaɪɾəmz kʊd ˈtrɪɡɚ ˈsɛvrəl jɪrz‿əv bæk‿ˌɪnˈʃʊrəns‿ən tæks/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 6, "vi": "Phụ cấp để hỗ trợ công việc, không để lách thuế.", "en": "Allowances support the job; they're not a tax loophole.", "ipa": "/əˈlaʊənsɪz səˈpɔrt ðə dʒɑb; ðɛr nɑɾ‿ə tæks ˈluphoʊl/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 6, "vi": "Các công ty cùng ngành thường giữ phụ cấp dưới 15% tổng thu nhập.", "en": "Peers in our industry usually keep allowances below 15% of total pay.", "ipa": "/pɪrz‿ɪn‿ˈaʊɚ‿ˈɪndəstri ˈjuʒuəli kip‿əˈlaʊənsɪz bɪˈloʊ ˌfɪfˈtin pɚˈsɛnt‿əv ˈtoʊɾəl peɪ/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 6, "vi": "Tôi đề xuất gộp 5 khoản thiếu căn cứ vào lương cơ bản, chi phí bảo hiểm tăng khoảng 3%.", "en": "I propose folding five unclear items into base pay; insurance costs rise about 3%.", "ipa": "/aɪ prəˈpoʊz ˈfoʊldɪŋ faɪv‿ənˈklɪr‿ˈaɪɾəmz‿ˈɪntu beɪs peɪ; ˌɪnˈʃʊrəns kɑsts raɪz‿əˈbaʊt θri pərˈsɛnt/"}, {"topicRaw": "21-Allowances", "topicName": "Allowances", "topicOrder": 21, "stage": 6, "vi": "Mục tiêu là cơ cấu thu nhập đơn giản, minh bạch và không có rủi ro truy thu.", "en": "The aim is a simple, transparent pay structure with no exposure to back payments.", "ipa": "/ði eɪm‿ɪz‿ə ˈsɪmpəl, trænˈspɛrənt peɪ ˈstrʌktʃɚ wɪθ noʊ ɪkˈspoʊʒɚ tə bæk ˈpeɪmənts/"}, {"topicRaw": "22-Overtime", "topicName": "Overtime", "topicOrder": 22, "stage": 1, "vi": "Làm thêm vào ban đêm được trả thêm 20% lương giờ làm việc ban ngày.", "en": "Night overtime carries an extra 20% of the normal daytime hourly rate.", "ipa": "/naɪɾ‿ˈoʊvɚˌtaɪm ˈkæriz‿ən‿ˈɛkstrə ˈtwɛnti pɚˈsɛnt‿əv ðə ˈnɔrməl ˈdeɪˌtaɪm‿ˈaʊɚli reɪt/"}, {"topicRaw": "22-Overtime", "topicName": "Overtime", "topicOrder": 22, "stage": 1, "vi": "Chỉ được bố trí làm thêm khi người lao động đồng ý, trừ trường hợp khẩn cấp.", "en": "Overtime can only be scheduled with the employee's consent, except in emergencies.", "ipa": "/ˈoʊvɚˌtaɪm kən‿ˈoʊnli bi ˈskɛdʒuld wɪθ ði ɪmˈplɔɪiz kənˈsɛnt, ɪkˈsɛpt‿ɪn‿ɪˈmɝdʒənsiz/"}, {"topicRaw": "22-Overtime", "topicName": "Overtime", "topicOrder": 22, "stage": 1, "vi": "Những giờ này được trả tiền làm thêm hay cho nghỉ bù?", "en": "Will these hours be paid as overtime or given as time off in lieu?", "ipa": "/wɪl ðiz‿ˈaʊɚz bi peɪd‿əz‿ˈoʊvɚˌtaɪm‿ɚ ˈɡɪvən‿əz taɪm‿ɔf‿ɪn lu/"}, {"topicRaw": "22-Overtime", "topicName": "Overtime", "topicOrder": 22, "stage": 1, "vi": "Team bạn còn bao nhiêu giờ làm thêm trước khi chạm trần 40 giờ?", "en": "How many overtime hours does your team have left before hitting the 40-hour cap?", "ipa": "/haʊ ˈmɛni ˈoʊvɚˌtaɪm‿ˈaʊɚz dʌz jɚ tim hæv lɛft bɪˈfɔr ˈhɪɾɪŋ ðə ˈfɔrti aʊɚ kæp/"}, {"topicRaw": "22-Overtime", "topicName": "Overtime", "topicOrder": 22, "stage": 1, "vi": "Vui lòng lấy văn bản đồng ý làm thêm của từng nhân vi : 3, "vi": "Có lẽ nên xem lại cách chia ca để giảm làm thêm.", "en": "It might be worth redesigning the shift pattern to reduce overtime.", "ipa": "/ɪt maɪt bi wɝθ ˌridɪˈzaɪnɪŋ ðə ʃɪft ˈpæɾɚn tə rɪˈdus‿ˈoʊvɚˌtaɪm/"}, {"topicRaw": "22-Overtime", "topicName": "Overtime", "topicOrder": 22, "stage": 4, "vi": "Chúng ta chuyển sang báo cáo làm thêm, vì chi phí đang vượt ngân sách.", "en": "Next, let's look at the overtime report, since costs are running over budget.", "ipa": "/nɛkst, lɛts lʊk‿ət ði ˈoʊvɚˌtaɪm rɪˈpɔrt, sɪns kɔsts‿ɚ ˈrʌnɪŋ‿ˈoʊvɚ ˈbʌdʒɪt/"}, {"topicRaw": "22-Overtime", "topicName": "Overtime", "topicOrder": 22, "stage": 4, "vi": "Bạn trình bày phòng nào làm thêm nhiều nhất và lý do nhé?", "en": "Could you walk us through which teams work the most overtime and why?", "ipa": "/kʊd ju wɔk‿əs θru wɪtʃ timz wɝk ðə moʊst‿ˈoʊvɚˌtaɪm‿ən waɪ/"}, {"topicRaw": "22-Overtime", "topicName": "Overtime", "topicOrder": 22, "stage": 4, "vi": "Tôi muốn lưu ý một điểm: 6 nhân viên kho đã vượt 40 giờ tháng này.", "en": "I want to flag one issue: six warehouse staff exceeded 40 hours this month.", "ipa": "/aɪ wɑnt tə flæɡ wʌn‿ˈɪʃu: sɪks ˈwɛrˌhaʊs stæf‿ɪkˈsidəd ˈfɔrɾi ˈaʊɚz ðɪs mʌnθ/"}, {"topicRaw": "22-Overtime", "topicName": "Overtime", "topicOrder": 22, "stage": 4, "vi": "Tôi hiểu đơn hàng đang tăng, tuy nhiên không thể vượt giới hạn làm thêm theo luật.", "en": "I appreciate that orders are rising; however, we can't break the legal overtime limit.", "ipa": "/aɪ əˈpriʃiˌeɪt ðæɾ‿ˈɔrdɚz‿ɚ ˈraɪzɪŋ; haʊˈɛvɚ, wi kænt breɪk ðə ˈliɡəl‿ˈoʊvɚˌtaɪm ˈlɪmɪt/"}, {"topicRaw": "22-Overtime", "topicName": "Overtime", "topicOrder": 22, "stage": 4, "vi": "Hay chúng ta thuê thêm nhân viên thời vụ trong 2 tháng tới?", "en": "What if we brought in temporary staff for the next two months?", "ipa": "/wʌɾ‿ɪf wi brɔɾ‿ɪn ˈtɛmpɚˌɛri stæf fɚ ðə nɛkst tu mʌnθs/"}, {"topicRaw": "22-Overtime", "topicName": "Overtime", "topicOrder": 22, "stage": 4, "vi": "Không thể tăng giờ làm thêm, nhưng có thể thêm 1 ca tối là vượt trần 40 giờ mỗi tháng theo luật và bị phạt.", "en": "My main worry is exceeding the 40-hour monthly legal cap, which means fines.", "ipa": "/maɪ meɪn ˈwɝi ɪz‿ɪkˈsidɪŋ ðə ˈfɔrɾi ˈaʊɚ ˈmʌnθli ˈliɡəl kæp, wɪtʃ minz faɪnz/"}, {"topicRaw": "22-Overtime", "topicName": "Overtime", "topicOrder": 22, "stage": 5, "vi": "Nếu không tuyển thêm 2 người, chi phí làm thêm sẽ tiếp tục tăng mỗi quý.", "en": "If we don't hire two more people, overtime costs will keep rising every quarter.", "ipa": "/ɪf wi doʊnt haɪɚ tu mɔr ˈpipəl, ˈoʊvɚˌtaɪm kɔsts wɪl kip ˈraɪzɪŋ‿ˈɛvri ˈkwɔrɾɚ/"}, {"topicRaw": "22-Overtime", "topicName": "Overtime", "topicOrder": 22, "stage": 5, "vi": "Tôi e ngại làm thêm không lương, kể cả khi nhân viên nói họ sẵn lòng.", "en": "I'm not comfortable with unpaid overtime, even if employees say they're happy to stay.", "ipa": "/aɪm nɑt ˈkʌmfɚtəbəl wɪθ‿ənˈpeɪd‿ˈoʊvɚˌtaɪm, ˈivɪn‿ɪf‿ɛmˈplɔɪiz seɪ ðɛr ˈhæpi tə steɪ/"}, {"topicRaw": "22-Overtime", "topicName": "Overtime", "topicOrder": 22, "stage": 5, "vi": "Điều tôi lo nhất là nhân viên mệt sau ca dài dễ mắc lỗi an toàn hơn.", "en": "My biggest concern is that tired staff on long shifts make more safety mistakes.", "ipa": "/maɪ ˈbɪɡɪst kənˈsɝn‿ɪz ðæt taɪɚd stæf‿ɑn lɔŋ ʃɪfts meɪk mɔr ˈseɪfti mɪˈsteɪks/"}, {"topicRaw": "22-Overtime", "topicName": "Overtime", "topicOrder": 22, "stage": 5, "vi": "Tôi đề xuất so sánh chi phí làm thêm với chi phí tuyển trước ngân sách năm sau.", "en": "My recommendation is to compare overtime costs with hiring costs before next year's budget.", "ipa": "/maɪ ˌrɛkəmɛnˈdeɪʃən‿ɪz tə kəmˈpɛr‿ˈoʊvɚˌtaɪm kɔsts wɪθ ˈhaɪɚɪŋ kɔsts bɪˈfɔr nɛkst jɪrz ˈbʌdʒɪt/"}, {"topicRaw": "22-Overtime", "topicName": "Overtime", "topicOrder": 22, "stage": 6, "vi": "Làm việc thông minh, không phải làm việc lâu hơn.", "en": "Work smarter, not longer.", "ipa": "/wɝk ˈsmɑrɾɚ, nɑt ˈlɔŋɡɚ/"}, {"topicRaw": "22-Overtime", "topicName": "Overtime", "topicOrder": 22, "stage": 6, "vi": "Giờ làm thêm là tín hiệu, không phải giả
