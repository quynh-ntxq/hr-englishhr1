ained.", "ipa": "/maɪ ˈbɪɡɪst kənˈsɝn‿ɪz ðæt wi faʊnd ði ˈɛrɚ‿ˈoʊnli ˈæftɚ‿ɪmˈplɔɪiz kəmˈpleɪnd/", "hl": ["My biggest concern", "only after employees complained"]}, {"topicRaw": "4-Errors & Problem Solving", "topicName": "Errors & Problem Solving", "topicOrder": 4, "stage": 5, "vi": "Tôi đề xuất họp rút kinh nghiệm ngắn sau mỗi lỗi lớn, không đổ lỗi cho ai.", "en": "My recommendation is a short lessons-learned review after every major error, without blaming anyone.", "ipa": "/maɪ ˌrɛkəmɛnˈdeɪʃən‿ɪz‿ə ʃɔrt ˈlɛsənz lɝnd rɪˈvju ˈæftɚ‿ˈɛvri ˈmeɪdʒɚ‿ˈɛrɚ, wɪˈθaʊt ˈbleɪmɪŋ‿ˈɛniˌwʌn/", "hl": ["My recommendation is", "lessons-learned review", "without blaming anyone"]}, {"topicRaw": "4-Errors & Problem Solving", "topicName": "Errors & Problem Solving", "topicOrder": 4, "stage": 6, "vi": "Sai một ly, đi một dặm.", "en": "A small mistake can lead to a big problem.", "ipa": "/ə smɔl mɪˈsteɪk kən lid tu ə bɪɡ ˈprɑbləm/"}, {"topicRaw": "4-Errors & Problem Solving", "topicName": "Errors & Problem Solving", "topicOrder": 4, "stage": 6, "vi": "Ai cũng mắc lỗi, quan trọng là cách sửa.", "en": "Everyone makes mistakes; what matters is how we fix them.", "ipa": "/ˈɛvriˌwʌn meɪks mɪˈsteɪks; wʌt ˈmæɾɚz‿ɪz haʊ wi fɪks ðɛm/"}, {"topicRaw": "4-Errors & Problem Solving", "topicName": "Errors & Problem Solving", "topicOrder": 4, "stage": 6, "vi": "70% lỗi lương năm nay đến từ dữ liệu đầu vào, không phải từ khâu tính.", "en": "Seventy percent of this year's payroll errors came from input data, not from calculations.", "ipa": "/ˈsɛvənti pɚˈsɛnt‿əv ðɪs jɪrz ˈpeɪroʊl‿ˈɛrɚz keɪm frəm‿ˈɪnpʊt ˈdeɪɾə, nɑt frəm ˌkælkjəˈleɪʃənz/", "hl": ["input data", "not from calculations"]}, {"topicRaw": "4-Errors & Problem Solving", "topicName": "Errors & Problem Solving", "topicOrder": 4, "stage": 6, "vi": "Nếu cứ sửa lỗi thủ công, chi phí sửa sẽ tăng theo quy mô nhân sự.", "en": "If we keep fixing errors manually, correction costs will grow with our headcount.", "ipa": "/ɪf wi kip ˈfɪksɪŋ‿ˈɛrɚz ˈmænjuəli, kɚˈɛkʃən kɑsts wɪl ɡroʊ wɪθ‿aʊɚ ˈhɛdˌkaʊnt/", "hl": ["If we keep fixing errors manually", "correction costs"]}, {"topicRaw": "4-Errors & Problem Solving", "topicName": "Errors & Problem Solving", "topicOrder": 4, "stage": 6, "vi": "Mỗi lỗi là một bài học miễn phí.", "en": "Every mistake is a free lesson.", "ipa": "/ˈɛvri mɪˈsteɪk‿ɪz‿ə fri ˈlɛsən/"}, {"topicRaw": "4-Errors & Problem Solving", "topicName": "Errors & Problem Solving", "topicOrder": 4, "stage": 6, "vi": "Chuẩn ngành về độ chính xác bảng lương là 99,5%, chúng ta hiện mới đạt 98,7%.", "en": "The industry benchmark for payroll accuracy is 99.5%; we're currently at 98.7%.", "ipa": "/ði ˈɪndəstri ˈbɛntʃˌmɑrk fɚ ˈpeɪroʊl‿ˈækjɚəsi ɪz ˈnaɪnti naɪn pɔɪnt faɪv pɚˈsɛnt; wɪr ˈkɝəntli ət ˈnaɪnti eɪt pɔɪnt ˈsɛvən pɚˈsɛnt/", "hl": ["industry benchmark", "payroll accuracy"]}, {"topicRaw": "4-Errors & Problem Solving", "topicName": "Errors & Problem Solving", "topicOrder": 4, "stage": 6, "vi": "Tôi đề xuất kiểm tra tự động trước khi duyệt: chi phí thấp, chặn phần lớn lỗi nhập liệu.", "en": "I propose automated validation before approval; it's low-cost and catches most input errors.", "ipa": "/aɪ prəˈpoʊz‿ˈɔɾəˌmeɪɾɪd ˌvæləˈdeɪʃən bɪˈfɔr‿əˈpruvəl; ɪts loʊ kɑst‿ən ˈkætʃəz moʊst‿ˈɪnˌpʊt‿ˈɛrɚz/", "hl": ["I propose", "automated validation", "input errors"]}, {"topicRaw": "4-Errors & Problem Solving", "topicName": "Errors & Problem Solving", "topicOrder": 4, "stage": 6, "vi": "Mục tiêu: đạt độ chính xác 99,5% trong 2 quý và duy trì ổn định.", "en": "We aim to reach 99.5% accuracy within two quarters and sustain it.", "ipa": "/wi eɪm tə ritʃ ˈnaɪnti naɪn pɔɪnt faɪv pɚˈsɛnt‿ˈækjɚəsi wɪˈθɪn tu ˈkwɔrtɚz‿ən səˈsteɪn‿ɪt/", "hl": ["We aim to reach", "sustain it"]}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 1, "vi": "Hai bên đã nộp bản tường trình và HR đang xác minh sự việc.", "en": "Both parties have submitted written statements, and HR is verifying the facts.", "ipa": "/boʊθ ˈpɑrtiz hæv səbˈmɪɾɪd ˈrɪɾən ˈsteɪtmənts, ən‿ˌeɪtʃˈɑr‿ɪz ˈvɛrəˌfaɪɪŋ ðə fækts/", "hl": ["written statements", "verifying the facts"]}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 1, "vi": "Buổi trao đổi hôm nay được bảo mật và chỉ nhằm làm rõ sự việc.", "en": "Today's conversation is confidential and purely fact-finding.", "ipa": "/təˈdeɪz ˌkɑnvɚˈseɪʃən‿ɪz ˌkɑnfɪˈdɛnʃəl‿ən ˈpjʊrli fækt ˈfaɪndɪŋ/", "hl": ["confidential", "fact-finding"]}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 1, "vi": "Bạn có thể kể lại sự việc theo trình tự thời gian không?", "en": "Could you walk me through what happened, in chronological order?", "ipa": "/kʊd ju wɔk mi θru wʌt ˈhæpənd, ɪn ˌkrɑnəˈlɑdʒɪkəl‿ˈɔrdɚ/", "hl": ["walk me through what happened", "chronological order"]}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 1, "vi": "Có ai khác có mặt và chứng kiến sự việc không?", "en": "Was anyone else present who witnessed the incident?", "ipa": "/wəz‿ˈɛniˌwʌn‿ɛls ˈprɛzənt hu ˈwɪtnəst ði ˈɪnsɪdənt/", "hl": ["witnessed the incident"]}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 1, "vi": "Vui lòng tập trung vào hành vi cụ thể, không nhận xét về con người.", "en": "Please focus on specific behaviors rather than personal judgments.", "ipa": "/pliz ˈfoʊkəs‿ɑn spɪˈsɪfɪk bɪˈheɪvjɚz ˈræðɚ ðən ˈpɝsənəl ˈdʒʌdʒmənts/", "hl": ["specific behaviors", "personal judgments"]}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 1, "vi": "Vui lòng không trao đổi việc này với đồng nghiệp trong lúc đang xác minh.", "en": "Please don't discuss this with colleagues while the investigation is ongoing.", "ipa": "/pliz doʊnt dɪˈskʌs ðɪs wɪθ ˈkɑliɡz waɪl ði ˌɪnˌvɛstəˈɡeɪʃən‿ɪz‿ˈɑnˌɡoʊɪŋ/", "hl": ["Please don't discuss this", "investigation is ongoing"]}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 1, "vi": "Tôi xin lỗi vì phản hồi khiếu nại của bạn chậm hơn đã hứa.", "en": "I'm sorry our response to your grievance took longer than promised.", "ipa": "/aɪm ˈsɑri ˈaʊɚ rɪˈspɑns tə jɚ ˈɡrivəns tʊk ˈlɔŋɡɚ ðən ˈprɑməst/", "hl": ["I'm sorry", "took longer than promised"]}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 1, "vi": "Chúng ta thống nhất gặp lại sau 2 tuần để đánh giá tiến triển.", "en": "Let's agree to meet again in two weeks to review progress.", "ipa": "/lɛts‿əˈɡri tə miɾ‿əˈɡɛn‿ɪn tu wiks tə rɪˈvju ˈprɑɡrɛs/", "hl": ["Let's agree to meet again", "review progress"]}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 2, "vi": "Theo quy tắc ứng xử, khiếu nại quấy rối phải được xử lý trong 5 ngày làm việc.", "en": "Under our code of conduct, harassment complaints must be addressed within five working days.", "ipa": "/ˈʌndɚ‿ˈaʊɚ koʊd‿əv ˈkɑndəkt, həˈræsmənt kəmˈpleɪnts mʌst bi əˈdrɛst wɪˈθɪn faɪv ˈwɝkɪŋ deɪz/", "hl": ["Under our code of conduct", "within five working days"]}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 2, "vi": "HR gặp riêng từng bên trước, rồi điều phối buổi trao đổi chung nếu phù hợp.", "en": "HR meets each party separately first, then facilitates a joint conversation if appropriate.", "ipa": "/ˌeɪtʃˈɑr mits‿itʃ ˈpɑrti ˈsɛpərətli fɝst, ðɛn fəˈsɪləˌteɪts‿ə dʒɔɪnt ˌkɑnvɚˈseɪʃən‿ɪf‿əˈproʊpriət/", "hl": ["separately first", "joint conversation"]}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 2, "vi": "Bạn có thể nêu một ví dụ cụ thể để tôi hiểu rõ hơn không?", "en": "Could you give me a specific example so I understand the situation better?", "ipa": "/kʊd ju ɡɪv mi ə spɪˈsɪfɪk‿ɪɡˈzæmpəl soʊ aɪ ˌʌndɚˈstænd ðə ˌsɪtʃuˈeɪʃən ˈbɛɾɚ/", "hl": ["specific example", "understand the situation"]}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 2, "vi": "Bạn có phiền ghi lại bằng văn bản nếu sự việc tương tự tái diễn không?", "en": "Would you mind keeping a written record if anything similar happens again?", "ipa": "/wʊd ju maɪnd ˈkipɪŋ‿ə ˈrɪɾən ˈrɛkɚd‿ɪf‿ˈɛniˌθɪŋ ˈsɪməlɚ ˈhæpənz‿əˈɡɛn/", "hl": ["keeping a written record", "anything similar"]}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 2, "vi": "Tôi đề nghị có người trung lập tham gia vì căng thẳng đã kéo dài nhiều tuần.", "en": "I'd suggest a neutral third party join, since tensions have been building for weeks.", "ipa": "/aɪd səˈdʒɛst‿ə ˈnutrəl θɝd ˈpɑrti dʒɔɪn, sɪns ˈtɛntʃənz hæv bɪn ˈbɪldɪŋ fɚ wiks/", "hl": ["I'd suggest", "neutral third party", "tensions have been building"]}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 2, "vi": "Nếu không đạt được thỏa thuận, vụ việc sẽ được chuyển lên ban giám đốc.", "en": "If we can't reach an agreement, the case will be escalated to senior management.", "ipa": "/ɪf wi kænt ritʃ‿ən‿əˈɡrimənt, ðə keɪs wɪl bi ˈɛskəˌleɪɾɪd tə ˈsinjɚ ˈmænɪdʒmənt/", "hl": ["If we can't reach an agreement", "escalated to senior management"]}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 2, "vi": "Rất tiếc, bằng chứng hiện có chưa đủ để xác nhận khiếu nại của bạn.", "en": "Unfortunately, the evidence we have isn't sufficient to substantiate your complaint.", "ipa": "/ʌnˈfɔrtʃənətli, ði ˈɛvɪdəns wi hæv‿ˈɪzənt səˈfɪʃənt tə səbˈstæntʃiˌeɪt jɚ kəmˈpleɪnt/", "hl": ["Unfortunately", "isn't sufficient to substantiate"]}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 2, "vi": "Tôi sẽ gửi biên bản cho cả hai bên ký xác nhận trước thứ Sáu.", "en": "I'll send the minutes to both parties for signature by Friday.", "ipa": "/aɪl sɛnd ðə ˈmɪnəts tə boʊθ ˈpɑrtiz fɚ ˈsɪɡnətʃɚ baɪ ˈfraɪdeɪ/", "hl": ["I'll send the minutes", "for signature by Friday"]}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 3, "vi": "Để tôi giải thích quy trình xử lý khiếu nại gồm những bước nào.", "en": "Let me explain the steps we follow when handling a complaint.", "ipa": "/lɛt mi ɪkˈspleɪn ðə stɛps wi ˈfɑloʊ wɛn ˈhændlɪŋ‿ə kəmˈpleɪnt/", "hl": ["Let me explain the steps", "handling a complaint"]}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 3, "vi": "Để tôi làm rõ: mục tiêu là giải pháp, không phải đổ lỗi.", "en": "Let me clarify: our goal is to find a solution, not to blame anyone.", "ipa": "/lɛt mi ˈklɛrəˌfaɪ: ˈaʊɚ ɡoʊl‿ɪz tə faɪnd‿ə səˈluʃən, nɑt tə bleɪm‿ˈɛniˌwʌn/", "hl": ["Let me clarify", "find a solution, not to blame"]}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 3, "vi": "Theo những gì tôi nghe, đây là vấn đề giao tiếp.", "en": "Based on what I've heard, this is a communication issue.", "ipa": "/beɪst‿ɑn wʌɾ‿aɪv hɝd, ðɪs‿ɪz‿ə kəmˌjunəˈkeɪʃən‿ˈɪʃu/", "hl": ["Based on what I've heard", "communication issue"]}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 3, "vi": "Tôi đề xuất hai bên gặp nhau với HR làm trung gian.", "en": "I recommend a joint meeting with HR acting as a neutral mediator.", "ipa": "/aɪ ˌrɛkəˈmɛnd‿ə dʒɔɪnt ˈmiɾɪŋ wɪθ‿ˌeɪtʃˈɑr‿ˈæktɪŋ‿əz‿ə ˈnutrəl ˈmidiˌeɪɾɚ/", "hl": ["I recommend a joint meeting", "neutral mediator"]}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 3, "vi": "Tôi đề nghị thống nhất lại vai trò của từng người trong dự án.", "en": "I'd suggest clarifying each person's role and responsibilities on the project.", "ipa": "/aɪd səˈdʒɛst ˈklɛrəˌfaɪɪŋ‿itʃ ˈpɝsənz roʊl‿ən rɪˌspɑnsəˈbɪləɾiz‿ɑn ðə ˈprɑdʒɛkt/", "hl": ["I'd suggest clarifying", "role and responsibilities"]}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 3, "vi": "Theo tôi, cả hai bên đều có lý, nhưng cách giao tiếp khác nhau.", "en": "In my view, both sides have valid points, but they communicate differently.", "ipa": "/ɪn maɪ vju, boʊθ saɪdz hæv ˈvælɪd pɔɪnts, bət ðeɪ kəˈmjunəkeɪt ˈdɪfrəntli/", "hl": ["In my view", "valid points", "communicate differently"]}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 3, "vi": "Tôi hiểu cảm giác của bạn, nhưng cách phản ứng đó chưa phù hợp.", "en": "I understand how you feel, but that reaction wasn't appropriate.", "ipa": "/aɪ ˌʌndɚˈstænd haʊ ju fil, bət ðæt riˈækʃən ˈwʌzənt‿əˈproʊpriət/", "hl": ["I understand how you feel, but", "wasn't appropriate"]}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 3, "vi": "Có lẽ nên tạm chuyển một người sang dự án khác.", "en": "It might be worth moving one person to another project for now.", "ipa": "/ɪt maɪt bi wɝθ ˈmuvɪŋ wʌn ˈpɝsən tu əˈnʌðɚ ˈprɑdʒɛkt fɚ naʊ/", "hl": ["It might be worth moving", "for now"]}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 4, "vi": "Chúng ta chuyển sang tình hình của team, vì vấn đề đang lan rộng.", "en": "Let's move on to the team situation, because the issue is starting to spread.", "ipa": "/lɛts muv‿ɑn tə ðə tim ˌsɪtʃuˈeɪʃən, bɪˈkɔz ði ˈɪʃu ɪz ˈstɑrɾɪŋ tə sprɛd/", "hl": ["Let's move on to", "starting to spread"]}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 4, "vi": "Bạn chia sẻ góc nhìn của mình và điều bạn mong muốn được không?", "en": "Can you take us through your perspective and what you'd like to change?", "ipa": "/kæn ju teɪk‿əs θru jɚ pɚˈspɛktɪv‿ən wʌt jud laɪk tə tʃeɪndʒ/", "hl": ["take us through your perspective", "what you'd like to change"]}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 4, "vi": "Có một điều tôi lo: mâu thuẫn này đang ảnh hưởng cả team.", "en": "One thing worries me: this conflict is affecting the whole team.", "ipa": "/wʌn θɪŋ ˈwɝiz mi: ðɪs ˈkɑnflɪkt‿ɪz‿əˈfɛktɪŋ ðə hoʊl tim/", "hl": ["One thing worries me", "affecting the whole team"]}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 4, "vi": "Tôi hiểu bạn bức xúc, tuy nhiên chúng ta cần tôn trọng nhau.", "en": "I understand you're frustrated; however, we need to stay respectful.", "ipa": "/aɪ ˌʌndɚˈstænd jʊr ˈfrʌstreɪɾɪd; haʊˈɛvɚ, wi nid tə steɪ rɪˈspɛktfəl/", "hl": ["I understand you're frustrated; however", "stay respectful"]}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 4, "vi": "Hay chúng ta thống nhất quy tắc làm việc chung và rà soát sau 1 tháng?", "en": "How about agreeing on shared working rules and reviewing them after a month?", "ipa": "/haʊ əˈbaʊt‿əˈɡriɪŋ‿ɑn ʃɛrd ˈwɝkɪŋ rulz‿ən riˈvjuɪŋ ðɛm‿ˈæftɚ ə mʌnθ/", "hl": ["How about agreeing on", "shared working rules"]}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 4, "vi": "Chúng tôi không thể đổi quản lý, nhưng có thể hỗ trợ coaching.", "en": "We won't be able to change your manager, but we can offer coaching.", "ipa": "/wi woʊnt bi ˈeɪbəl tə tʃeɪndʒ jɚ ˈmænɪdʒɚ, bət wi kən‿ˈɔfɚ ˈkoʊtʃɪŋ/", "hl": ["We won't be able to", "but we can offer coaching"]}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 4, "vi": "Tóm lại, hai bên đã đồng ý cách làm việc mới.", "en": "To summarize, both sides have agreed on a new way of working.", "ipa": "/tu ˈsʌməˌraɪz, boʊθ saɪdz hæv‿əˈɡrid‿ɑn‿ə nu weɪ əv ˈwɝkɪŋ/", "hl": ["To summarize", "a new way of working"]}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 4, "vi": "Bước tiếp theo: HR sẽ gặp lại từng bên sau 2 tuần.", "en": "As a next step, HR will meet each side again in two weeks.", "ipa": "/əz‿ə nɛkst stɛp, eɪtʃ ɑr wɪl mit‿itʃ saɪd‿əˈɡɛn‿ɪn tu wiks/", "hl": ["As a next step", "meet each side again"]}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 5, "vi": "Thật lòng, né tránh mâu thuẫn nhiều tháng đã khiến việc này khó giải quyết hơn.", "en": "Honestly, avoiding this conflict for months has made the situation much harder to fix.", "ipa": "/ˈɑnəstli, əˈvɔɪdɪŋ ðɪs ˈkɑnflɪkt fɚ mʌnθs hæz meɪd ðə ˌsɪtʃuˈeɪʃən mʌtʃ ˈhɑrdɚ tə fɪks/", "hl": ["Honestly", "harder to fix"]}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 5, "vi": "Theo kinh nghiệm, mâu thuẫn thường do vai trò không rõ, không phải do tính cách.", "en": "In my experience, most conflicts come from unclear roles, not bad personalities.", "ipa": "/ɪn maɪ ɪkˈspɪriəns, moʊst kənˈflɪkts kʌm frəm‿ənˈklɪr roʊlz, nɑt bæd ˌpɝsəˈnælɪtiz/", "hl": ["In my experience", "unclear roles, not bad personalities"]}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 5, "vi": "Điều quan trọng là tập trung vào vấn đề, không phải ai đúng ai sai.", "en": "What really matters is focusing on the issue, not on who is right.", "ipa": "/wʌt ˈrɪli ˈmæɾɚz‿ɪz ˈfoʊkəsɪŋ‿ɑn ði ˈɪʃu, nɑt‿ɑn hu ɪz raɪt/", "hl": ["What really matters is", "focusing on the issue"]}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 5, "vi": "Rủi ro lớn nhất là mọi người bắt đầu chọn phe và cả nhóm bị ảnh hưởng.", "en": "The main risk is that others start taking sides and the whole team suffers.", "ipa": "/ðə meɪn rɪsk‿ɪz ðət‿ˈʌðɚz stɑrt ˈteɪkɪŋ saɪdz‿ən ðə hoʊl tim ˈsʌfɚz/", "hl": ["The main risk is", "taking sides"]}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 5, "vi": "Nếu không can thiệp ngay, một trong hai nhân viên giỏi này có thể sẽ nghỉ.", "en": "Unless we step in now, one of these two strong employees will probably resign.", "ipa": "/ənˈlɛs wi stɛp‿ɪn naʊ, wʌn‿əv ðiz tu strɔŋ‿ɪmˈplɔɪiz wɪl ˈprɑbəbli rɪˈzaɪn/", "hl": ["Unless we step in now", "will probably resign"]}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 5, "vi": "Tôi phản bác chuyển một người sang nhóm khác trước khi nghe cả hai bên.", "en": "I'd challenge moving one person to another team before we hear both sides.", "ipa": "/aɪd ˈtʃælɪndʒ ˈmuvɪŋ wʌn ˈpɝsən tu əˈnʌðɚ tim bɪˈfɔr wi hɪr boʊθ saɪdz/", "hl": ["I'd challenge moving", "before we hear both sides"]}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 5, "vi": "Điều tôi lo nhất là quản lý thấy vấn đề nhưng chọn im lặng.", "en": "What concerns me most is that the manager sees the problem but stays silent.", "ipa": "/wʌt kənˈsɝnz mi moʊst‿ɪz ðət ðə ˈmænədʒɚ siz ðə ˈprɑbləm bət steɪz ˈsaɪlənt/", "hl": ["What concerns me most", "stays silent"]}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 5, "vi": "Tôi đề xuất họp có điều phối với cả hai, rồi chốt thỏa thuận bằng văn bản.", "en": "What I'd propose is a facilitated meeting with both, then a written agreement.", "ipa": "/wʌt‿aɪd prəˈpoʊz‿ɪz‿ə fəˈsɪləˌteɪɾɪd ˈmiɾɪŋ wɪθ boʊθ, ðɛn‿ə ˈrɪɾən‿əˈɡrimənt/", "hl": ["What I'd propose is", "facilitated meeting", "written agreement"]}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 6, "vi": "Một điều nhịn, chín điều lành.", "en": "A moment of patience prevents a lot of trouble.", "ipa": "/ə ˈmoʊmənt‿əv ˈpeɪʃəns prɪˈvɛnts‿ə lɑɾ‿əv ˈtrʌbəl/"}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 6, "vi": "Lắng nghe để hiểu, không phải để trả lời.", "en": "Listen to understand, not to reply.", "ipa": "/ˈlɪsən tu ˌʌndɚˈstænd, nɑt tə rɪˈplaɪ/"}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Conflict & Difficult Conversations", "topicOrder": 5, "stage": 6, "vi": "Năm nay có 14 khiếu nại nội bộ, gấp đôi năm ngoái, chủ yếu liên quan quản lý trực tiếp.", "en": "We logged 14 internal grievances this year, double last year, mostly involving direct managers.", "ipa": "/wi lɔɡd ˈfɔrˈtin‿ɪnˈtɝnəl ˈɡrivənsəz ðɪs jɪr, ˈdʌbəl læst jɪr, ˈmoʊstli ɪnˈvɑlvɪŋ dɪˈrɛkt ˈmænɪdʒɚz/", "hl": ["internal grievances", "direct managers"]}, {"topicRaw": "5-Conflict & Difficult Conversations", "topicName": "Co Balance", "topicName": "Work-life Balance", "topicOrder": 7, "stage": 3, "vi": "Theo khảo sát, 40% nhân viên cảm thấy kiệt sức.", "en": "Based on the survey, 40% of staff feel burned out.", "ipa": "/beɪst‿ɑn ðə ˈsɝveɪ, ˈfɔrɾi pɚˈsɛnt‿əv stæf fil bɝnd‿aʊt/"}, {"topicRaw": "7-Work-life Balance", "topicName": "Work-life Balance", "topicOrder": 7, "stage": 3, "vi": "Tôi đề xuất không họp sau 5h chiều, trừ trường hợp khẩn.", "en": "I recommend no meetings after 5 PM, except for real emergencies.", "ipa": "/aɪ ˌrɛkəˈmɛnd noʊ ˈmiɾɪŋz‿ˈæftɚ faɪv ˌpiˈɛm, ɪkˈsɛpt fɚ ril‿ɪˈmɝdʒənsiz/"}, {"topicRaw": "7-Work-life Balance", "topicName": "Work-life Balance", "topicOrder": 7, "stage": 3, "vi": "Tôi đề nghị chương trình sức khỏe tinh thần, nhân viên dùng được kín đáo.", "en": "I'd suggest a mental health support program that employees can use confidentially.", "ipa": "/aɪd səˈdʒɛst‿ə ˈmɛntəl hɛlθ səˈpɔrt ˈproʊɡræm ðæɾ‿ɪmˈplɔɪiz kən juz ˌkɑnfəˈdɛnʃəli/"}, {"topicRaw": "7-Work-life Balance", "topicName": "Work-life Balance", "topicOrder": 7, "stage": 3, "vi": "Theo tôi, quản lý nên làm gương về cân bằng công việc.", "en": "In my view, managers should model work-life balance.", "ipa": "/ɪn maɪ vju, ˈmænədʒɚz ʃʊd ˈmɑdəl wɝk laɪf ˈbæləns/"}, {"topicRaw": "7-Work-life Balance", "topicName": "Work-life Balance", "topicOrder": 7, "stage": 3, "vi": "Tôi hiểu ý bạn, nhưng nghỉ ngơi không phải là lười biếng.", "en": "I see your point, but taking a rest doesn't mean someone is lazy.", "ipa": "/aɪ si jɚ pɔɪnt, bət ˈteɪkɪŋ‿ə rɛst ˈdʌzənt min ˈsʌmˌwʌn‿ɪz ˈleɪzi/"}, {"topicRaw": "7-Work-life Balance", "topicName": "Work-life Balance", "topicOrder": 7, "stage": 3, "vi": "Có lẽ nên thử tuần làm việc 4,5 ngày vào mùa hè.", "en": "It might be worth trying a 4.5-day week in summer.", "ipa": "/ɪt maɪt bi wɝθ ˈtraɪɪŋ‿ə fɔr pɔɪnt faɪv deɪ wik‿ɪn ˈsʌmɚ/"}, {"topicRaw": "7-Work-life Balance", "topicName": "Work-life Balance", "topicOrder": 7, "stage": 4, "vi": "Chúng ta chuyển sang khảo sát sức khỏe tinh thần, vì có vài con số đáng lo.", "en": "Next, let's look at the wellbeing survey, because some results are worrying.", "ipa": "/nɛkst, lɛts lʊk‿ət ðə ˈwɛlˌbiɪŋ ˈsɝveɪ, bɪˈkɔz səm rɪˈzʌlts‿ɚ ˈwɝiɪŋ/"}, {"topicRaw": "7-Work-life Balance", "topicName": "Work-life Balance", "topicOrder": 7, "stage": 4, "vi": "Bạn trình bày những phòng có mức căng thẳng cao nhất được không?", "en": "Could you walk us through the departments with the highest stress levels?", "ipa": "/kʊd ju wɔk‿əs θru ðə dɪˈpɑrtmənts wɪθ ðə ˈhaɪɪst strɛs ˈlɛvəlz/"}, {"topicRaw": "7-Work-life Balance", "topicName": "Work-life Balance", "topicOrder": 7, "stage": 4, "vi": "Tôi muốn lưu ý một điểm: team payroll đã làm thêm 3 tháng liền.", "en": "I want to flag one issue: payroll has worked overtime for three months straight.", "ipa": "/aɪ wɑnt tə flæɡ wʌn‿ˈɪʃu: ˈpeɪroʊl hæz wɝkt‿ˈoʊvɚˌtaɪm fɚ θri mʌnθs streɪt/"}, {"topicRaw": "7-Work-life Balance", "topicName": "Work-life Balance", "topicOrder": 7, "stage": 4, "vi": "Tôi hiểu việc đang nhiều, tuy nhiên sức khỏe nhân viên phải được ưu tiên.", "en": "I appreciate that the workload is heavy; however, people's health has to come first.", "ipa": "/aɪ əˈpriʃiˌeɪt ðæt ðə ˈwɝkˌloʊd‿ɪz ˈhɛvi; haʊˈɛvɚ, ˈpipəlz hɛlθ hæz tə kʌm fɝst/"}, {"topicRaw": "7-Work-life Balance", "topicName": "Work-life Balance", "topicOrder": 7, "stage": 4, "vi": "Hay chúng ta cho nghỉ bù sau mỗi đợt cao điểm?", "en": "What if we gave time off after every peak period?", "ipa": "/wʌɾ‿ɪf wi ɡeɪv taɪm‿ɔf‿ˈæftɚ‿ˈɛvri pik ˈpɪriəd/"}, {"topicRaw": "7-Work-life Balance", "topicName": "Work-life Balance", "topicOrder": 7, "stage": 4, "vi": "Chúng tôi không thể giảm việc ngay, nhưng có thể tuyển thêm thời vụ.", "en": "We're not able to cut the workload now, but we can hire temporary help.", "ipa": "/wɪr nɑɾ‿ˈeɪbəl tə kʌt ðə ˈwɝkˌloʊd naʊ, bət wi kən haɪɚ ˈtɛmpɚˌɛri hɛlp/"}, {"topicRaw": "7-Work-life Balance", "topicName": "Work-life Balance", "topicOrder": 7, "stage": 4, "vi": "Tóm lại, nghỉ bù áp dụng từ tháng sau cho mọi phòng ban.", "en": "So, to recap, the time-off policy starts next month for all departments.", "ipa": "/soʊ, tə ˈriˌkæp, ðə taɪm‿ɔf ˈpɑləsi stɑrts nɛkst mʌnθ fɚ‿ɔl dɪˈpɑrtmənts/"}, {"topicRaw": "7-Work-life Balance", "topicName": "Work-life Balance", "topicOrder": 7, "stage": 4, "vi": "Bước tiếp theo: HR khảo sát lại sau 3 tháng và báo cáo ban giám đốc.", "en": "Next step: HR re-runs the survey in three months and reports to the board.", "ipa": "/nɛkst stɛp: eɪtʃ ɑr reɪ rʌnz ðə sɚˈveɪ ɪn θri mʌnθs‿ən rɪˈpɔrts tə ðə bɔrd/"}, {"topicRaw": "7-Work-life Balance", "topicName": "Work-life Balance", "topicOrder": 7, "stage": 5, "vi": "Thật lòng, văn hóa làm quá giờ khiến mọi người kiệt sức, số liệu nghỉ việc đã chứng minh.", "en": "Honestly, our long-hours culture is burning people out, and turnover data proves it.", "ipa": "/ˈɑnəstli, aʊɚ lɔŋ ˈaʊɚz ˈkʌltʃɚ ɪz ˈbɝnɪŋ ˈpipəl‿aʊt, ən ˈtɝˌnoʊvɚ ˈdeɪɾə pruvz‿ɪt/"}, {"topicRaw": "7-Work-life Balance", "topicName": "Work-life Balance", "topicOrder": 7, "stage": 5, "vi": "Theo kinh nghiệm, nhân viên được nghỉ ngơi đủ ít sai sót và xử lý việc nhanh hơn.", "en": "From my experience, rested employees make fewer mistakes and solve problems faster.", "ipa": "/frʌm maɪ ɪkˈspɪriəns, ˈrɛstɪd‿ɪmˈplɔɪiz meɪk ˈfjuɚ mɪˈsteɪks‿ən sɑlv ˈprɑbləmz ˈfæstɚ/"}, {"topicRaw": "7-Work-life Balance", "topicName": "Work-life Balance", "topicOrder": 7, "stage": 5, "vi": "Suy cho cùng, cân bằng không phải đặc quyền, mà giúp hiệu suất bền vững.", "en": "Ultimately, balance isn't a perk; it's what keeps performance sustainable.", "ipa": "/ˈʌltəmətli, ˈbæləns‿ˈɪzənt‿ə pɝk; ɪts wʌt kips pɚˈfɔrməns səˈsteɪnəbəl/"}, {"topicRaw": "7-Work-life Balance", "topicName": "Work-life Balance", "topicOrder": 7, "stage": 5, "vi": "Điều tôi lo là người giỏi nhất kiệt sức, vì họ luôn nhận nhiều việc nhất.", "en": "My main worry is burnout among our best people; they carry the most work.", "ipa": "/maɪ meɪn ˈwɝi ɪz ˈbɝˌnaʊt‿əˈmʌŋ‿aʊɚ bɛst ˈpipəl; ðeɪ ˈkæri ðə moʊst wɝk/"}, {"topicRaw": "7-Work-life Balance", "topicName": "Work-life Balance", "topicOrder": 7, "stage": 5, "vi": "Nếu không tôn trọng cuối tuần, mọi người sẽ không cố thêm khi thật sự cần.", "en": "If we don't respect weekends, people won't give extra effort when it matters.", "ipa": "/ɪf wi doʊnt rɪˈspɛkt ˈwiˌkɛndz, ˈpipəl woʊnt ɡɪv‿ˈɛkstrə ˈɛfɚt wɛn‿ɪt ˈmæɾɚz/"}, {"topicRaw": "7-Work-life Balance", "topicName": "Work-life Balance", "topicOrder": 7, "stage": 5, "vi": "Tôi e ngại khen người trả lời email lúc nửa đêm, vì đó là tấm gương xấu.", "en": "I'm not comfortable praising people who reply at midnight; it sets an unhealthy example.", "ipa": "/aɪm nɑt ˈkʌmfɚtəbəl ˈpreɪzɪŋ ˈpipəl hu rɪˈplaɪ ət ˈmɪdˌnaɪt; ɪt sɛts‿ən‿ənˈhɛlθi ɪɡˈzæmpəl/"}, {"topicRaw": "7-Work-life Balance", "topicName": "Work-life Balance", "topicOrder": 7, "stage": 5, "vi": "Điều tôi lo nhất là chính quản lý làm gương xấu khi làm việc mọi cuối tuần.", "en": "My biggest concern is that managers set a bad example by working every weekend.", "ipa": "/maɪ ˈbɪɡɪst kənˈsɝn‿ɪz ðæt ˈmænɪdʒɚz sɛɾ‿ə bæd‿ɪɡˈzæmpəl baɪ ˈwɝkɪŋ‿ˈɛvri ˈwikɛnd/"}, {"topicRaw": "7-Work-life Balance", "topicName": "Work-life Balance", "topicOrder": 7, "stage": 5, "vi": "Tôi đề xuất quy định rõ về liên lạc ngoài giờ, quản lý phải làm gương trước.", "en": "My recommendation is a clear after-hours contact policy, and managers must follow it first.", "ipa": "/maɪ ˌrɛkəmɛnˈdeɪʃən‿ɪz‿ə klɪr‿ˈæftɚ‿ˈaʊɚz ˈkɑntækt ˈpɑləsi, ən ˈmænɪdʒɚz mʌst ˈfɑloʊ ɪt fɝst/"}, {"topicRaw": "7-Work-life Balance", "topicName": "Work-life Balance", "topicOrder": 7, "stage": 6, "vi": "Làm việc chăm chỉ, nghỉ ngơi đúng lúc.", "en": "Work hard, rest well.", "ipa": "/wɝk hɑrd, rɛst wɛl/"}, {"topicRaw": "7-Work-life Balance", "topicName": "Work-life Balance", "topicOrder": 7, "stage": 6, "vi": "Không thể rót nước từ một chiếc cốc rỗng.", "en": "You can't pour from an empty cup.", "ipa": "/ju kænt pɔr frəm‿ən‿ˈɛmpti kʌp/"}, {"topicRaw": "7-Work-life Balance", "topicName": "Work-life Balance", "topicOrder": 7, "stage": 6, "vi": "40% nhân viên còn hơn 8 ngày phép vào tháng 10, cho thấy mọi người không dám nghỉ.", "en": "40% of staff still had over eight leave days in October; people aren't resting.", "ipa": "/ˈfɔrɾi pərˈsɛnt‿əv stæf stɪl həd‿ˈoʊvɚ eɪt liv deɪz‿ɪn‿ɑkˈtoʊbɚ; ˈpipəl‿ˈɑrənt ˈrɛstɪŋ/"}, {"topicRaw": "7-Work-life Balance", "topicName": "Work-life Balance", "topicOrder": 7, "stage": 6, "vi": "Kiệt sức kéo dài làm tăng nghỉ ốm và nghỉ việc, tốn kém hơn nhiều so với một tuần nghỉ phép.", "en": "Prolonged burnout drives up sick leave and turnover, costing more than a week's holiday.", "ipa": "/prəˈlɔŋd ˈbɝˌnaʊt draɪvz‿ʌp sɪk liv‿ən ˈtɝˌnoʊvɚ, ˈkɔstɪŋ mɔr ðæn‿ə wiks ˈhɑləˌdeɪ/"}, {"topicRaw": "7-Work-life Balance", "topicName": "Work-life Balance", "topicOrder": 7, "stage": 6, "vi": "Sếp làm gương, team làm theo.", "en": "Teams follow what leaders do.", "ipa": "/timz ˈfɑloʊ wʌt ˈlidɚz du/"}, {"topicRaw": "7-Work-life Balance", "topicName": "Work-life Balance", "topicOrder": 7, "stage": 6, "vi": "Các công ty có chính sách không email ngoài giờ ghi nhận điểm gắn kết cao hơn khoảng 15%.", "en": "Companies with an after-hours email policy report engagement scores around 15% higher.", "ipa": "/ˈkʌmpəniz wɪθ‿ən‿ˈæftɚ‿ˈaʊɚz‿ˈimeɪl ˈpɑləsi rɪˈpɔrɾ‿ɪnˈɡeɪdʒmənt skɔrz‿əˈraʊnd ˌfɪfˈtin pɚˈsɛnt ˈhaɪɚ/"}, {"topicRaw": "7-Work-life Balance", "topicName": "Work-life Balance", "topicOrder": 7, "stage": 6, "vi": "Tôi đề xuất bắt buộc nghỉ ít nhất 5 ngày liên tục mỗi năm, thí điểm trước với khối văn phòng.", "en": "I propose a mandatory five-day consecutive break each year, piloted first with office staff.", "ipa": "/aɪ prəˈpoʊz‿ə ˈmændəˌtɔri ˈfaɪvˌdeɪ kənˈsɛkjəɾɪv breɪk‿itʃ jɪr, ˈpaɪləɾɪd fɝst wɪθ‿ˈɔfɪs stæf/"}, {"topicRaw": "7-Work-life Balance", "topicName": "Work-life Balance", "topicOrder": 7, "stage": 6, "vi": "Mục tiêu năm sau là 90% nhân viên dùng hết phép và điểm kiệt sức giảm 20%.", "en": "Next year's goal: 90% of employees use their full leave; burnout scores fall 20%.", "ipa": "/nɛkst jɪrz ɡoʊl: ˈnaɪnti pərˈsɛnt‿əv‿ɛmˈplɔɪiz jus ðɛr fʊl liv; ˈbɝˌnaʊt skɔrz fɔl ˈtwɛni pərˈsɛnt/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 1, "vi": "Vòng này gồm phỏng vấn năng lực và một bài tình huống ngắn khoảng 20 phút.", "en": "This round includes a competency interview and a short 20-minute case exercise.", "ipa": "/ðɪs raʊnd‿ɪnˈkludz‿ə ˈkɑmpəɾənsi ˈɪntɚvju ən‿ə ʃɔrt ˈtwɛnti ˈmɪnət keɪs‿ˈɛksɚˌsaɪz/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 1, "vi": "Gói thu nhập gồm lương gross, thưởng tháng 13 và bảo hiểm sức khỏe tư nhân.", "en": "The package includes a gross salary, a 13th-month bonus, and private health cover.", "ipa": "/ðə ˈpækɪdʒ‿ɪnˈkludz‿ə ɡroʊs ˈsæləri, ə ˌθɝˈtinθ mʌnθ ˈboʊnəs, ən ˈpraɪvət hɛlθ ˈkʌvɚ/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 1, "vi": "Thời gian báo trước nghỉ việc ở công ty hiện tại của bạn là bao lâu?", "en": "What's your notice period with your current employer?", "ipa": "/wʌts jɚ ˈnoʊɾɪs ˈpɪriəd wɪθ jɚ ˈkɝənt‿ɪmˈplɔɪɚ/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 1, "vi": "Mức lương mong muốn của bạn là bao nhiêu, gross hay net?", "en": "What are your salary expectations, and is that figure gross or net?", "ipa": "/wʌɾ‿ɚ jɚ ˈsæləri ˌɛkspɛkˈteɪʃənz, ən‿ɪz ðæt ˈfɪɡjɚ ɡroʊs‿ɚ nɛt/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 1, "vi": "Vui lòng mang bản gốc bằng cấp để đối chiếu vào ngày đầu đi làm.", "en": "Please bring your original certificates for verification on your first day.", "ipa": "/pliz brɪŋ jɚ‿əˈrɪdʒənəl sɚˈtɪfɪkəts fɚ ˌvɛrəfəˈkeɪʃən‿ɑn jɚ fɝst deɪ/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 1, "vi": "Vui lòng ký mẫu đồng ý để chúng tôi kiểm tra thông tin tham chiếu.", "en": "Please sign the consent form so we can carry out reference checks.", "ipa": "/pliz saɪn ðə kənˈsɛnt fɔrm soʊ wi kən ˈkæri aʊt ˈrɛfɚəns tʃɛks/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 1, "vi": "Xin lỗi, chúng tôi cần dời lịch vì người phỏng vấn có việc đột xuất.", "en": "Apologies, we need to reschedule because the interviewer has an urgent conflict.", "ipa": "/əˈpɑləˌdʒiz, wi nid tə riˈskɛdʒul bɪˈkɔz ði ˈɪntɚˌvjuɚ hæz‿ən‿ˈɝdʒənt ˈkɑnflɪkt/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 1, "vi": "Tôi sẽ gửi thư mời nhận việc kèm bản mô tả công việc trong ngày mai.", "en": "I'll send the offer letter and job description by tomorrow.", "ipa": "/aɪl sɛnd ði ˈɔfɚ ˈlɛɾɚ‿ən dʒɑb dɪˈskrɪpʃən baɪ təˈmɑroʊ/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 2, "vi": "Theo luật, thử việc với vị trí cần trình độ cao đẳng trở lên tối đa 60 ngày.", "en": "By law, probation for roles requiring a college degree is capped at 60 days.", "ipa": "/baɪ lɔ, proʊˈbeɪʃən fɚ roʊlz riˈkwaɪɚɪŋ‿ə ˈkɑlɪdʒ dɪˈɡri ɪz kæpt‿ət ˈsɪksti deɪz/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 2, "vi": "Quy trình gồm sàng lọc hồ sơ, phỏng vấn HR, phỏng vấn chuyên môn, rồi kiểm tra tham chiếu.", "en": "The process covers CV screening, an HR interview, a technical interview, then reference checks.", "ipa": "/ðə ˈprɑsɛs ˈkʌvɚz ˌsiˈvi ˈskrinɪŋ, ən‿ˌeɪtʃˈɑr‿ˈɪntɚvju, ə ˈtɛknɪkəl‿ˈɪntɚvju, ðɛn ˈrɛfɚəns tʃɛks/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 2, "vi": "Bạn có thể chia sẻ lý do bạn muốn rời công việc hiện tại không?", "en": "Could you share what's prompting you to leave your current role?", "ipa": "/kʊd ju ʃɛr wʌts ˈprɑmptɪŋ ju tə liv jɚ ˈkɝənt roʊl/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 2, "vi": "Bạn có phiền gửi phiếu lương gần nhất để chúng tôi xác nhận thu nhập hiện tại không?", "en": "Would you mind sharing your latest payslip so we can verify your current package?", "ipa": "/wʊd ju maɪnd ˈʃɛrɪŋ jɚ ˈleɪɾɪst ˈpeɪˌslɪp soʊ wi kən ˈvɛrəˌfaɪ jɚ ˈkɝənt ˈpækɪdʒ/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 2, "vi": "Lương thử việc là 85% lương chính thức vì đó là mức tối thiểu theo luật.", "en": "Probation pay is 85% of the full salary, which is the legal minimum.", "ipa": "/proʊˈbeɪʃən peɪ ɪz‿ˈeɪɾi faɪv pərˈsɛnt‿əv ðə fʊl ˈsælɚi, wɪtʃ‿ɪz ðə ˈliɡəl ˈmɪnəməm/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 2, "vi": "Nếu bạn nhận offer trước thứ Sáu, chúng tôi có thể giữ ngày bắt đầu đầu tháng sau.", "en": "If you accept by Friday, we can hold a start date early next month.", "ipa": "/ɪf ju əkˈsɛpt baɪ ˈfraɪdeɪ, wi kən hoʊld‿ə stɑrt deɪɾ‿ˈɝli nɛkst mʌnθ/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 2, "vi": "Rất tiếc, chúng tôi quyết định chưa tiếp tục với hồ sơ của bạn ở giai đoạn này.", "en": "Unfortunately, we've decided not to move forward with your application at this stage.", "ipa": "/ʌnˈfɔrtʃənətli, wiv dɪˈsaɪdɪd nɑt tə muv ˈfɔrwɚd wɪθ jɚ‿ˌæpləˈkeɪʃən‿ət ðɪs steɪdʒ/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 2, "vi": "Tôi sẽ báo bạn ngay khi hội đồng tuyển dụng có quyết định cuối cùng.", "en": "I'll keep you posted as soon as the hiring panel reaches a final decision.", "ipa": "/aɪl kip ju ˈpoʊstɪd‿əz sun‿əz ðə ˈhaɪɚɪŋ ˈpænəl ˈritʃəz‿ə ˈfaɪnəl dɪˈsɪʒən/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 3, "vi": "Để tôi giải thích quy trình tuyển dụng và các vòng tiếp theo.", "en": "Let me explain our hiring process and what the next rounds look like.", "ipa": "/lɛt mi ɪkˈspleɪn‿ˈaʊɚ ˈhaɪɚɪŋ ˈprɑsɛs‿ən wʌt ðə nɛkst raʊndz lʊk laɪk/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 3, "vi": "Để tôi làm rõ: mức lương cuối cùng phụ thuộc vào kết quả đánh giá.", "en": "Let me clarify: the final salary depends on your assessment results.", "ipa": "/lɛt mi ˈklɛrəˌfaɪ: ðə ˈfaɪnəl ˈsæləri dɪˈpɛndz‿ɑn jɚ‿əˈsɛsmənt rɪˈzʌlts/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 3, "vi": "Theo CV, bạn đã quản lý team 5 người trong 2 năm.", "en": "Based on your CV, you've managed a team of five for two years.", "ipa": "/beɪst‿ɑn jɚ ˌsiˈvi, juv ˈmænɪdʒd‿ə tim‿əv faɪv fɚ tu jɪrz/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 3, "vi": "Tôi đề xuất bạn chuẩn bị ví dụ cụ thể cho vòng quản lý tuần sau.", "en": "I recommend preparing specific examples for the manager round next week.", "ipa": "/aɪ ˌrɛkəˈmɛnd prɪˈpɛrɪŋ spɪˈsɪfɪk‿ɪɡˈzæmpəlz fɚ ðə ˈmænɪdʒɚ raʊnd nɛkst wik/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 3, "vi": "Tôi đề nghị bạn tìm hiểu thêm sản phẩm trước vòng 2.", "en": "I'd suggest learning more about our products before the second interview.", "ipa": "/aɪd səˈdʒɛst ˈlɝnɪŋ mɔr‿əˈbaʊɾ‿ˈaʊɚ ˈprɑdəkts bɪˈfɔr ðə ˈsɛkənd‿ˈɪntɚvju/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 3, "vi": "Theo tôi, kinh nghiệm của bạn hợp với vị trí senior hơn.", "en": "In my view, your experience fits the senior role better than this one.", "ipa": "/ɪn maɪ vju, jɚ‿ɪkˈspɪriəns fɪts ðə ˈsinjɚ roʊl ˈbɛɾɚ ðən ðɪs wʌn/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 3, "vi": "Tôi hiểu, nhưng đây đã là mức cao nhất của khung lương.", "en": "I see your point, but this is already the top of the range.", "ipa": "/aɪ si jɚ pɔɪnt, bət ðɪs‿ɪz‿ɔlˈrɛdi ðə tɑp‿əv ðə reɪndʒ/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 3, "vi": "Có lẽ nên thêm 1 bài test kỹ năng ngắn ở vòng sau.", "en": "It might be worth adding a short skills test to the next round.", "ipa": "/ɪt maɪt bi wɝθ‿ˈædɪŋ‿ə ʃɔrt skɪlz tɛst tə ðə nɛkst raʊnd/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 4, "vi": "Chúng ta chuyển sang 2 ứng viên cuối, vì cần chốt trong tuần.", "en": "Let's move on to the two finalists, since we need a decision this week.", "ipa": "/lɛts muv‿ɑn tə ðə tu ˈfaɪnəlɪsts, sɪns wi nid‿ə dɪˈsɪʒən ðɪs wik/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 4, "vi": "Bạn trình bày điểm mạnh và điểm yếu của từng ứng viên nhé?", "en": "Can you take us through each finalist's main strengths and possible weaknesses?", "ipa": "/kæn ju teɪk‿əs θru itʃ ˈfaɪnəlɪsts meɪn strɛŋkθs‿ən ˈpɑsəbəl ˈwiknəsɪz/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 4, "vi": "Có một điều tôi lo: ứng viên A có khoảng trống 6 tháng trong CV.", "en": "One thing worries me: candidate A has a six-month gap in her CV.", "ipa": "/wʌn θɪŋ ˈwɝiz mi: ˈkændɪdəɾ‿eɪ hæz‿ə sɪks mʌnθ ɡæp‿ɪn hɝ ˌsiˈvi/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 4, "vi": "Tôi hiểu ứng viên B giỏi, tuy nhiên mức lương vượt ngân sách 20%.", "en": "I understand candidate B is strong; however, her salary request is 20% over budget.", "ipa": "/aɪ ˌʌndɚˈstænd ˈkændɪdət bi ɪz strɔŋ; haʊˈɛvɚ, hɝ ˈsæləri rɪˈkwɛst‿ɪz ˈtwɛnti pɚˈsɛnt‿ˈoʊvɚ ˈbʌdʒɪt/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 4, "vi": "Hay chúng ta mời ứng viên A làm 1 bài tình huống ngắn?", "en": "How about if we invite candidate A to do a short practical case?", "ipa": "/haʊ əˈbaʊɾ‿ɪf wi ɪnˈvaɪt ˈkændɪdəɾ‿eɪ tə du ə ʃɔrt ˈpræktɪkəl keɪs/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 4, "vi": "Không thể tăng ngân sách, nhưng có thể thêm thưởng ký hợp đồng.", "en": "We can't increase the budget, but we can offer a sign-on bonus.", "ipa": "/wi kænt‿ˌɪnˈkris ðə ˈbʌdʒɪt, bət wi kən‿ˈɔfɚ ə saɪn ɑn ˈboʊnəs/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 4, "vi": "Tóm lại, ứng viên A là lựa chọn đầu, ứng viên B dự phòng.", "en": "To summarize, candidate A is our first choice, and candidate B is the backup.", "ipa": "/tu ˈsʌməˌraɪz, ˈkændɪdəɾ‿eɪ ɪz‿ˈaʊɚ fɝst tʃɔɪs, ən ˈkændɪdət bi ɪz ðə ˈbækʌp/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 4, "vi": "Bước tiếp theo: HR kiểm tra tham chiếu và gửi offer trước thứ Sáu.", "en": "As a next step, HR will run reference checks and send the offer Friday.", "ipa": "/əz‿ə nɛkst stɛp, eɪtʃ ɑr wɪl rʌn ˈrɛfɚəns tʃɛks‿ən sɛnd ði ˈɔfɚ ˈfraɪdi/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 5, "vi": "Thật lòng, ứng viên trả lời tốt, nhưng tôi chưa nghe kết quả cụ thể từ vai trò cũ.", "en": "Honestly, she answered well, but I didn't hear concrete results from her past roles.", "ipa": "/ˈɑnəstli, ʃi ˈænsɚd wɛl, bət‿aɪ ˈdɪdənt hir kənˈkrit rɪˈzʌlts frəm hɚ pæst roʊlz/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 5, "vi": "Theo kinh nghiệm, ứng viên biết đặt câu hỏi hay thường hòa nhập nhanh hơn.", "en": "In my experience, candidates who ask smart questions usually adapt faster after joining.", "ipa": "/ɪn maɪ ɪkˈspɪriəns, ˈkændɪdəts hu æsk smɑrt ˈkwɛstʃənz ˈjuʒuəli əˈdæpt ˈfæstɚ‿ˈæftɚ ˈdʒɔɪnɪŋ/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 5, "vi": "Điều quan trọng là kỹ năng đào tạo được, còn thái độ khó thay đổi hơn nhiều.", "en": "What really matters: skills can be trained, but attitude is much harder to change.", "ipa": "/wʌt ˈrɪli ˈmæɾɚz: skɪlz kən bi treɪnd, bət‿ˈæɾəˌtud‿ɪz mʌtʃ ˈhɑrdɚ tə tʃeɪndʒ/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 5, "vi": "Rủi ro lớn nhất là tuyển vội, vì tuyển sai tốn hơn nhiều so với để trống.", "en": "The main risk is hiring fast; a wrong hire costs more than a vacancy.", "ipa": "/ðə meɪn rɪsk‿ɪz ˈhaɪrɪŋ fæst; ə rɔŋ ˈhaɪɚ kɑsts mɔr ðæn‿ə ˈveɪkənsi/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 5, "vi": "Nếu không phản hồi trong 1 tuần, ứng viên giỏi sẽ nhận offer nơi khác.", "en": "Unless we reply within a week, the best candidates will accept other offers.", "ipa": "/ənˈlɛs wi rɪˈplaɪ wɪˈðɪn‿ə wik, ðə bɛst ˈkændədeɪts wɪl‿ækˈsɛpt‿ˈʌðɚ ˈɔfɚz/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 5, "vi": "Tôi phản bác đánh giá ứng viên qua giọng tiếng Anh thay vì năng lực thật.", "en": "I'd challenge judging candidates by their English accent rather than their actual skills.", "ipa": "/aɪd ˈtʃælɪndʒ ˈdʒʌdʒɪŋ ˈkændɪdəts baɪ ðɛr‿ˈɪŋɡlɪʃ‿ˈæksɛnt ˈræðɚ ðən ðɛr‿ˈæktʃuəl skɪlz/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 5, "vi": "Điều tôi lo nhất là mỗi người phỏng vấn dùng tiêu chí khác nhau cho cùng vị trí.", "en": "What concerns me most is that each interviewer uses different criteria for one role.", "ipa": "/wʌt kənˈsɝnz mi moʊst‿ɪz ðət‿itʃ‿ˈɪntɚˌvjuɚ ˈjusəz ˈdɪfɚənt kraɪˈtɪriə fɚ wʌn roʊl/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 5, "vi": "Tôi đề xuất phỏng vấn có cấu trúc, cùng bộ câu hỏi chính cho mọi ứng viên.", "en": "What I'd propose is a structured interview with the same core questions for everyone.", "ipa": "/wʌt‿aɪd prəˈpoʊz‿ɪz‿ə ˈstrʌktʃɚd‿ˈɪntɚˌvju wɪθ ðə seɪm kɔr ˈkwɛstʃənz fɚ ˈɛvriˌwʌn/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 6, "vi": "Tuyển chậm, sa thải nhanh.", "en": "Hire slow, fire fast.", "ipa": "/haɪɚ sloʊ, faɪɚ fæst/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 6, "vi": "Tuyển vì thái độ, đào tạo kỹ năng.", "en": "Hire for attitude, train for skills.", "ipa": "/haɪɚ fɚ‿ˈæɾɪˌtud, treɪn fɚ skɪlz/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 6, "vi": "Thời gian tuyển trung bình 45 ngày, và 1/3 ứng viên giỏi rút lui trước vòng cuối.", "en": "Our average time-to-hire is 45 days; a third of strong candidates drop out.", "ipa": "/aʊɚ ˈævɚɪdʒ taɪm tə ˈhaɪɚ ɪz ˈfɔrɾi faɪv deɪz; ə θɝd‿əv strɔŋ ˈkændədeɪts drɑp‿aʊt/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 6, "vi": "Nếu quy trình vẫn chậm, chúng ta sẽ tiếp tục mất người giỏi vào tay đối thủ nhanh hơn.", "en": "If the process stays this slow, we'll keep losing top talent to faster competitors.", "ipa": "/ɪf ðə ˈprɑˌsɛs steɪz ðɪs sloʊ, wil kip ˈluzɪŋ tɑp ˈtælənt tə ˈfæstɚ kəmˈpɛɾətɚz/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 6, "vi": "Câu hỏi hay mang lại câu trả lời thật.", "en": "Good questions get honest answers.", "ipa": "/ɡʊd ˈkwɛstʃənz ɡɛɾ‿ˈɑnəst‿ˈænsɚz/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 6, "vi": "Đối thủ chính chốt offer trong khoảng 3 tuần, nhanh gấp đôi chúng ta.", "en": "Our main competitor closes offers in about three weeks, twice as fast as us.", "ipa": "/aʊɚ meɪn kəmˈpɛɾətɚ ˈkloʊzɪz‿ˈɔfɚz‿ɪn‿əˈbaʊt θri wiks, twaɪs‿əz fæst‿əz‿ʌs/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 6, "vi": "Tôi đề xuất gộp 2 vòng phỏng vấn chuyên môn, rút thời gian tuyển xuống còn 25 ngày.", "en": "I propose merging the two technical rounds, which would cut time-to-hire to 25 days.", "ipa": "/aɪ prəˈpoʊz ˈmɝdʒɪŋ ðə tu ˈtɛknɪkəl raʊndz, wɪtʃ wʊd kʌt taɪm tə haɪɚ tə ˈtwɛntiˌfaɪv deɪz/"}, {"topicRaw": "8-Interview (Candidate)", "topicName": "Interview (Candidate)", "topicOrder": 8, "stage": 6, "vi": "Năm sau, mục tiêu tỷ lệ nhận offer 85% và phản hồi mọi ứng viên trong 48 giờ.", "en": "Next year, we're targeting an 85% offer acceptance rate and 48-hour feedback.", "ipa": "/nɛkst jɪr, wɪr ˈtɑrɡətɪŋ‿ən‿ˈeɪɾi faɪv pərˈsɛnt‿ˈɔfɚ ækˈsɛptəns reɪt‿ən ˈfɔrɾi eɪt ˈaʊɚ ˈfidˌbæk/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 1, "vi": "Tôi đã đính kèm phiếu đánh giá năng lực của cả 3 ứng viên.", "en": "I've attached the competency scorecards for all three candidates.", "ipa": "/aɪv‿əˈtætʃt ðə ˈkɑmpəɾənsi ˈskɔrˌkɑrdz fɚ‿ɔl θri ˈkændɪdəts/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 1, "vi": "Ứng viên B đề nghị mức lương ở điểm giữa khung, vẫn trong ngân sách.", "en": "Candidate B is asking for the midpoint of the range, which is within budget.", "ipa": "/ˈkændɪdət bi ɪz‿ˈæskɪŋ fɚ ðə ˈmɪdˌpɔɪnt‿əv ðə reɪndʒ, wɪtʃ‿ɪz wɪˈθɪn ˈbʌdʒɪt/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 1, "vi": "Bạn đánh giá thế nào về khả năng giải quyết vấn đề của ứng viên A?", "en": "How would you rate candidate A's problem-solving skills?", "ipa": "/haʊ wʊd ju reɪt ˈkændɪdəɾ‿eɪz ˈprɑbləm ˈsɑlvɪŋ skɪlz/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 1, "vi": "Theo bạn, ứng viên này cần bao lâu để làm việc hiệu quả hoàn toàn?", "en": "How long do you think this candidate would need to become fully productive?", "ipa": "/haʊ lɔŋ du ju θɪŋk ðɪs ˈkændɪdət wʊd nid tə bɪˈkʌm ˈfʊli prəˈdʌktɪv/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 1, "vi": "Vui lòng chấm điểm riêng từng tiêu chí thay vì đưa ấn tượng chung.", "en": "Please score each criterion separately rather than giving an overall impression.", "ipa": "/pliz skɔr‿itʃ kraɪˈtɪriən ˈsɛpərətli ˈræðɚ ðən ˈɡɪvɪŋ‿ən‿ˈoʊvəˌrɔl‿ˌɪmˈprɛʃən/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 1, "vi": "Vui lòng gửi nhận xét trong 24 giờ, khi ấn tượng còn rõ.", "en": "Please submit feedback within 24 hours, while your impressions are still fresh.", "ipa": "/pliz səbˈmɪt ˈfidbæk wɪˈθɪn ˈtwɛntiˌfɔr‿ˈaʊɚz, waɪl jɚ‿ɪmˈprɛʃənz‿ɚ stɪl frɛʃ/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 1, "vi": "Xin lỗi, tôi chưa chuyển bạn kết quả bài đánh giá của ứng viên C.", "en": "Sorry, I haven't forwarded candidate C's assessment results yet.", "ipa": "/ˈsɑri, aɪ ˈhævənt ˈfɔrwɚdɪd ˈkændɪdət siz‿əˈsɛsmənt rɪˈzʌlts jɛt/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 1, "vi": "Tôi sẽ chuyển quyết định của bạn và bắt đầu soạn offer ngay hôm nay.", "en": "I'll pass on your decision and start drafting the offer today.", "ipa": "/aɪl pæs‿ɑn jɚ dɪˈsɪʒən‿ən stɑrt ˈdræftɪŋ ði ˈɔfɚ təˈdeɪ/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 2, "vi": "Theo quy định, mọi quyết định tuyển dụng cần ít nhất 2 phiếu đánh giá độc lập.", "en": "Under our policy, every hiring decision needs at least two independent scorecards.", "ipa": "/ˈʌndɚ‿ˈaʊɚ ˈpɑləsi, ˈɛvri ˈhaɪɚɪŋ dɪˈsɪʒən nidz‿ət list tu ˌɪndɪˈpɛndənt ˈskɔrˌkɑrdz/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 2, "vi": "Sau vòng cuối, HR tổng hợp điểm, kiểm tra tham chiếu, rồi trình duyệt offer.", "en": "After the final round, HR consolidates scores, runs reference checks, and submits the offer.", "ipa": "/ˈæftɚ ðə ˈfaɪnəl raʊnd, eɪtʃ ɑr kənˈsɑlɪˌdeɪts skɔrz, rʌnz ˈrɛfɚəns tʃɛks, ən ˌsʌbˈmɪts ði ˈɔfɚ/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 2, "vi": "Bạn có thể giải thích vì sao bạn chấm ứng viên này thấp ở tiêu chí giao tiếp không?", "en": "Could you explain why you scored this candidate low on communication?", "ipa": "/kʊd ju ɪkˈspleɪn waɪ ju skɔrd ðɪs ˈkændɪdət loʊ ɑn kəmˌjunəˈkeɪʃən/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 2, "vi": "Bạn có phiền tránh hỏi về kế hoạch kết hôn hay sinh con không? Đó là phân biệt đối xử.", "en": "Would you mind avoiding questions about marriage or family plans? They're discriminatory.", "ipa": "/wʊd ju maɪnd‿əˈvɔɪdɪŋ ˈkwɛstʃənz‿əˈbaʊt ˈmɛrɪdʒ‿ɚ ˈfæməli plænz ðɛr dɪˈskrɪmənəˌtɔri/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 2, "vi": "Tôi đề nghị thêm vòng 3 vì điểm của hai người phỏng vấn chênh nhau nhiều.", "en": "I'd suggest a third round, since the two interviewers' scores differ significantly.", "ipa": "/aɪd səˈdʒɛst‿ə θɝd raʊnd, sɪns ðə tu ˈɪntɚˌvjuɚz skɔrz ˈdɪfɚ sɪɡˈnɪfɪkəntli/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 2, "vi": "Nếu muốn trả cao hơn khung, bạn cần giám đốc duyệt ngoại lệ.", "en": "To offer above the range, you'll need an exception approved by the director.", "ipa": "/tə ˈɔfɚ əˈbʌv ðə reɪndʒ, jul nid‿ən‿ɪkˈsɛpʃən‿əˈpruvd baɪ ðə dɚˈɛktɚ/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 2, "vi": "Rất tiếc, ứng viên bạn chọn đã nhận offer ở nơi khác sáng nay.", "en": "Unfortunately, your preferred candidate accepted another offer this morning.", "ipa": "/ʌnˈfɔrtʃənətli, jɚ prəˈfɝd ˈkændɪdəɾ‿əkˈsɛptɪd‿əˈnʌðɚ‿ˈɔfɚ ðɪs ˈmɔrnɪŋ/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 2, "vi": "Tôi sẽ gửi bạn danh sách dự phòng trước thứ Tư để không lỡ tiến độ.", "en": "I'll send you the backup shortlist by Wednesday so we stay on schedule.", "ipa": "/aɪl sɛnd ju ðə ˈbækʌp ˈʃɔrtˌlɪst baɪ ˈwɛnzdeɪ soʊ wi steɪ ɑn ˈskɛdʒul/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 3, "vi": "Để tôi giải thích cách dùng bảng chấm điểm cho từng tiêu chí.", "en": "Let me explain how to use the scorecard for each competency.", "ipa": "/lɛt mi ɪkˈspleɪn haʊ tə juz ðə ˈskɔrˌkɑrd fɚ‿itʃ ˈkɑmpəɾənsi/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 3, "vi": "Để tôi làm rõ: \"chưa phù hợp\" cần đi kèm lý do cụ thể.", "en": "Let me clarify: \"not a fit\" always needs a specific reason.", "ipa": "/lɛt mi ˈklɛrəˌfaɪ: nɑɾ‿ə fɪɾ‿ˈɔlˌweɪz nidz‿ə spɪˈsɪfɪk ˈrizən/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 3, "vi": "Theo điểm đánh giá, ứng viên B cao hơn ở cả 4 tiêu chí.", "en": "Based on the scores, candidate B is ahead on all four criteria.", "ipa": "/beɪst‿ɑn ðə skɔrz, ˈkændɪdət bi ɪz‿əˈhɛd‿ɑn‿ɔl fɔr kraɪˈtɪriə/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 3, "vi": "Tôi đề xuất phỏng vấn theo cặp để giảm thiên kiến cá nhân khi tuyển.", "en": "I recommend paired interviews to reduce individual bias in hiring decisions.", "ipa": "/aɪ ˌrɛkəˈmɛnd pɛrd‿ˈɪntɚvjuz tə rɪˈdus‿ˌɪndəˈvɪdʒuəl bias‿ɪn ˈhaɪɚɪŋ dɪˈsɪʒənz/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 3, "vi": "Tôi đề nghị phản hồi ứng viên trong vòng 48 giờ sau phỏng vấn.", "en": "I'd suggest giving candidates feedback within 48 hours of the interview.", "ipa": "/aɪd səˈdʒɛst ˈɡɪvɪŋ ˈkændɪdəts ˈfidbæk wɪˈθɪn ˈfɔrɾi eɪɾ‿ˈaʊɚz‿əv ði ˈɪntɚvju/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 3, "vi": "Theo tôi, thái độ học hỏi quan trọng hơn kinh nghiệm với vị trí này.", "en": "In my view, a learning attitude matters more than experience for this role.", "ipa": "/ɪn maɪ vju, ə ˈlɝnɪŋ‿ˈæɾɪˌtud ˈmæɾɚz mɔr ðən‿ɪkˈspɪriəns fɚ ðɪs roʊl/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 3, "vi": "Tôi hiểu bạn cần người gấp, nhưng tuyển sai còn tốn hơn.", "en": "I see your point, but a wrong hire costs more than waiting.", "ipa": "/aɪ si jɚ pɔɪnt, bəɾ‿ə rɔŋ haɪɚ kɔsts mɔr ðən ˈweɪɾɪŋ/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 3, "vi": "Có lẽ nên thêm 1 bài tập tình huống ở vòng cuối.", "en": "It might be worth adding a case exercise to the final round.", "ipa": "/ɪt maɪt bi wɝθ‿ˈædɪŋ‿ə keɪs‿ˈɛksɚˌsaɪz tə ðə ˈfaɪnəl raʊnd/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 4, "vi": "Chúng ta chuyển sang nhận xét 3 ứng viên vòng cuối cho vị trí quản lý kinh doanh.", "en": "Let's turn to feedback on the three finalists for the sales manager role.", "ipa": "/lɛts tɝn tə ˈfidbæk‿ɑn ðə θri ˈfaɪnəlɪsts fɚ ðə seɪlz ˈmænɪdʒɚ roʊl/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 4, "vi": "Bạn trình bày điểm đánh giá và lý do chính được không?", "en": "Would you mind going over your scores and the main reasons behind them?", "ipa": "/wʊd ju maɪnd ˈɡoʊɪŋ‿ˈoʊvɚ jɚ skɔrz‿ən ðə meɪn ˈrizənz bɪˈhaɪnd ðɛm/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 4, "vi": "Tôi muốn nêu lo ngại: 2 người phỏng vấn cho ứng viên này điểm rất khác nhau.", "en": "I'd like to raise a concern: two interviewers gave this candidate very different scores.", "ipa": "/aɪd laɪk tə reɪz‿ə kənˈsɝn: tu ˈɪntɚˌvjuɚz ɡeɪv ðɪs ˈkændɪdət ˈvɛri ˈdɪfɚənt skɔrz/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 4, "vi": "Tôi hiểu bạn thích ứng viên này, nhưng cần bằng chứng cụ thể.", "en": "I get that you like this candidate; however, we need evidence, not feelings.", "ipa": "/aɪ ɡɛt ðət ju laɪk ðɪs ˈkændədeɪt; ˌhaʊˈɛvɚ, wi nid‿ˈɛvədəns, nɑt ˈfilɪŋz/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 4, "vi": "Hay mời 2 ứng viên tốt nhất làm thêm vòng bài tập tình huống ngắn?", "en": "Would it help to invite the top two candidates to a short case study?", "ipa": "/wʊd‿ɪt hɛlp tə ˌɪnˈvaɪt ðə tɑp tu ˈkændədeɪts tə ə ʃɔrt keɪs ˈstʌdi/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 4, "vi": "Không thể nâng khung lương, nhưng có thể thưởng khi nhận việc.", "en": "We can't raise the salary range, but we can offer a sign-on bonus.", "ipa": "/wi kænt reɪz ðə ˈsæləri reɪndʒ, bət wi kən‿ˈɔfɚ‿ə saɪn‿ɑn ˈboʊnəs/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 4, "vi": "Tóm lại, ứng viên A là lựa chọn đầu tiên, ứng viên B là dự phòng.", "en": "To wrap up, candidate A is our first choice, and B is the backup.", "ipa": "/tə ræp‿ʌp, ˈkændədeɪt‿ə ɪz‿aʊɚ fɝst tʃɔɪs, ən bi ɪz ðə ˈbæˌkʌp/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 4, "vi": "Sau buổi họp này, HR kiểm tra tham chiếu và gửi offer trước thứ Năm.", "en": "After this meeting, HR will check references and send the offer by Thursday.", "ipa": "/ˈæftɚ ðɪs ˈmiɾɪŋ, ˌeɪtʃˈɑr wɪl tʃɛk ˈrɛfrənsɪz‿ən sɛnd ði ˈɔfɚ baɪ ˈθɝzdeɪ/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 5, "vi": "Thật lòng, nhận xét chỉ ghi phù hợp, tôi cần ví dụ cụ thể để phản hồi ứng viên.", "en": "Honestly, \"good fit\" isn't enough; I need specific examples to share with the candidate.", "ipa": "/ˈɑnəstli, ɡʊd fɪt‿ˈɪzənt‿ɪˈnʌf; aɪ nid spəˈsɪfɪk‿ɪɡˈzæmpəlz tə ʃɛr wɪθ ðə ˈkændədeɪt/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 5, "vi": "Theo kinh nghiệm, quản lý ghi chép khi phỏng vấn thường quyết định công bằng hơn.", "en": "What I've seen is that managers who take notes make fairer hiring decisions.", "ipa": "/wʌt‿aɪv sin‿ɪz ðət ˈmænədʒɚz hu teɪk noʊts meɪk ˈfɛrɚ ˈhaɪrɪŋ dɪˈsɪʒənz/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 5, "vi": "Mấu chốt là tuyển theo nhu cầu vị trí, không theo cảm tình cá nhân.", "en": "The bottom line: we hire for the role's needs, not personal chemistry.", "ipa": "/ðə ˈbɑɾəm laɪn: wi ˈhaɪɚ fɚ ðə roʊlz nidz, nɑt ˈpɝsɪnəl ˈkɛməstri/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 5, "vi": "Rủi ro lớn nhất là mất ứng viên giỏi vì phản hồi mất hơn 1 tuần.", "en": "The biggest risk is losing a strong candidate because feedback took over a week.", "ipa": "/ðə ˈbɪɡəst rɪsk‿ɪz ˈluzɪŋ‿ə strɔŋ ˈkændədeɪt bɪˈkɔz ˈfidˌbæk tʊk‿ˈoʊvɚ ə wik/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 5, "vi": "Nếu không thống nhất tiêu chí trước, mọi tranh luận sau đó sẽ thành chuyện cá nhân.", "en": "If we fail to agree on criteria before interviews, every debate afterward becomes personal.", "ipa": "/ɪf wi feɪl tu əˈɡri ɑn kraɪˈtɪriə bɪˈfɔr‿ˈɪntɚvjuz, ˈɛvri dɪˈbeɪɾ‿ˈæftɚwɚd bɪˈkʌmz ˈpɝsənəl/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 5, "vi": "Tôi phản đối loại cô ấy vì thừa kinh nghiệm, khi rõ ràng cô ấy muốn vị trí.", "en": "I'd push back on rejecting her as overqualified, since she clearly wants this role.", "ipa": "/aɪd pʊʃ bæk‿ɑn rɪˈdʒɛktɪŋ hɝ‿əz‿ˌoʊvɚˈkwɑləˌfaɪd, sɪns ʃi ˈklɪrli wɑnts ðɪs roʊl/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 5, "vi": "Điều tôi lo nhất là chúng ta cứ tuyển người suy nghĩ giống hệt cả nhóm.", "en": "What worries me is that we keep hiring people who think exactly alike.", "ipa": "/wʌt ˈwɝiz mi ɪz ðət wi kip ˈhaɪrɪŋ ˈpipəl hu θɪŋk‿ɪɡˈzæktli əˈlaɪk/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 5, "vi": "Tôi đề xuất phiếu chấm điểm đơn giản, mỗi người phỏng vấn điền trong 24 giờ.", "en": "My suggestion is a simple scorecard that every interviewer fills in within 24 hours.", "ipa": "/maɪ səɡˈdʒɛstʃən‿ɪz‿ə ˈsɪmpəl ˈskɔrˌkɑrd ðæɾ‿ˈɛvri ˈɪntɚˌvjuɚ fɪlz‿ɪn wɪˈθɪn ˌtwɛntiˈfɔr‿ˈaʊɚz/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 6, "vi": "Tuyển đúng người là quyết định quan trọng nhất của quản lý.", "en": "Hiring the right person is a manager's most important decision.", "ipa": "/ˈhaɪɚɪŋ ðə raɪt ˈpɝsən‿ɪz‿ə ˈmænɪdʒɚz moʊst‿ɪmˈpɔrɾənt dɪˈsɪʒən/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 6, "vi": "Dữ liệu tốt hơn cảm giác.", "en": "Evidence beats gut feeling.", "ipa": "/ˈɛvɪdəns bits ɡʌt ˈfilɪŋ/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 6, "vi": "30% người mới nghỉ trong 6 tháng đầu, và phần lớn chỉ được một người phỏng vấn.", "en": "30% of new hires left within six months, and most met only one interviewer.", "ipa": "/ˈθɝɾi pərˈsɛnt‿əv nu ˈhaɪɚz lɛft wɪˈðɪn sɪks mʌnθs, ən moʊst mɛt‿ˈoʊnli wʌn‿ˈɪntɚˌvjuɚ/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 6, "vi": "Một quyết định tuyển sai có thể tốn đến gấp 3 lần lương năm của vị trí đó.", "en": "A bad hire can cost up to three times the position's annual salary.", "ipa": "/ə bæd haɪɚ kən kɔst‿ʌp tə θri taɪmz ðə pəˈzɪʃənz‿ˈænjuəl ˈsæləri/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 6, "vi": "Đa dạng góc nhìn giúp quyết định tốt hơn.", "en": "Diverse perspectives lead to better decisions.", "ipa": "/dɪˈvɝs pɚˈspɛktɪvz lid tə ˈbɛɾɚ dɪˈsɪʒənz/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 6, "vi": "Các nhóm dùng phỏng vấn có cấu trúc giữ chân người mới tốt hơn rõ rệt so với trò chuyện tự do.", "en": "Teams using structured interviews retain new hires noticeably better than those using informal chats.", "ipa": "/timz ˈjuzɪŋ ˈstrʌktʃɚd‿ˈɪntɚvjuz rɪˈteɪn nu haɪɚz ˈnoʊɾɪsəbli ˈbɛɾɚ ðən ðoʊz ˈjuzɪŋ‿ˌɪnˈfɔrməl tʃæts/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 6, "vi": "Tôi đề xuất phiếu chấm chuẩn cho mọi vị trí và 1 buổi đào tạo người phỏng vấn mỗi quý.", "en": "I propose standard scorecards for every role and one interviewer training session each quarter.", "ipa": "/aɪ prəˈpoʊz ˈstændɚd ˈskɔrˌkɑrdz fɚ‿ˈɛvri roʊl‿ən wʌn‿ˈɪntɚˌvjuɚ ˈtreɪnɪŋ ˈsɛʃən‿itʃ ˈkwɔrtɚ/"}, {"topicRaw": "9-Interview Feedback (Line Manager)", "topicName": "Interview Feedback (Line Manager)", "topicOrder": 9, "stage": 6, "vi": "Mục tiêu là đưa tỷ lệ người mới nghỉ trong 6 tháng đầu xuống dưới 15%.", "en": "The goal is to bring six-month attrition for new hires below 15%.", "ipa": "/ðə ɡoʊl‿ɪz tə brɪŋ sɪks mʌnθ‿əˈtrɪʃən fɚ nu haɪɚz bɪˈloʊ ˌfɪfˈtin pɚˈsɛnt/"}, {"topicRaw": "10-Training", "topicName": "Training", "topicOrder": 10, "stage": 1, "vi": "Đào tạo an toàn lao động là bắt buộc trước khi nhân viên mới vào xưởng.", "en": "Safety training is mandatory before new hires can enter the production floor.", "ipa": "/ˈseɪfti ˈtreɪnɪŋ‿ɪz ˈmændəˌtɔri bɪˈfɔr nu haɪɚz kən‿ˈɛntɚ ðə prəˈdʌkʃən flɔr/"}, {"topicRaw": "10-Training", "topicName": "Training", "topicOrder": 10, "stage": 1, "vi": "Công ty tài trợ 100% học phí nếu bạn hoàn thành khóa học đúng hạn.", "en": "The company covers 100% of the course fee if you complete it on time.", "ipa": "/ðə ˈkʌmpəni ˈkʌvɚz wʌn ˈhʌndrəd pɚˈsɛnt‿əv ðə kɔrs fi ɪf ju kəmˈpliɾ‿ɪɾ‿ɑn taɪm/"}, {"topicRaw": "10-Training", "topicName": "Training", "topicOrder": 10, "stage": 1, "vi": "Bạn muốn học trực tiếp trên lớp hay theo hình thức trực tuyến?", "en": "Would you prefer the classroom version or the online format?", "ipa": "/wʊd ju prəˈfɝ ðə ˈklæsrum ˈvɝʒən‿ɚ ði ˈɑnˌlaɪn ˈfɔrˌmæt/"}, {"topicRaw": "10-Training", "topicName": "Training", "topicOrder": 10, "stage": 1, "v s to your manager; HR then checks the budget.", "ipa": "/ə ˈtreɪnɪŋ rɪˈkwɛst ɡoʊz tə jɚ ˈmænədʒɚ; eɪtʃ ɑr ðɛn tʃɛks ðə ˈbʌdʒɪt/"}, {"topicRaw": "10-Training", "topicName": "Training", "topicOrder": 10, "stage": 2, "vi": "Bạn có thể tổ chức buổi chia sẻ ngắn cho team sau khi học xong không?", "en": "Could you run a short knowledge-sharing session for the team afterward?", "ipa": "/kʊd ju rʌn‿ə ʃɔrt ˈnɑlədʒ ˈʃɛrɪŋ ˈsɛʃən fɚ ðə tim‿ˈæftɚwɚd/"}, {"topicRaw": "10-Training", "topicName": "Training", "topicOrder": 10, "stage": 2, "vi": "Bạn có phiền điền phiếu đánh giá khóa học trong hôm nay không?", "en": "Would you mind filling in the course evaluation survey today?", "ipa": "/wʊd ju maɪnd ˈfɪlɪŋ‿ɪn ðə kɔrs‿ɪˌvæljuˈeɪʃən ˈsɝveɪ təˈdeɪ/"}, {"topicRaw": "10-Training", "topicName": "Training", "topicOrder": 10, "stage": 2, "vi": "Bạn cần ký cam kết làm việc 2 năm vì khóa học trị giá hơn 50 triệu.", "en": "You'll need a two-year commitment because the course costs over 50 million VND.", "ipa": "/jul nid‿ə tu jɪr kəˈmɪtmənt bɪˈkɔz ðə kɔrs kɑsts‿ˈoʊvɚ ˈfɪfti ˈmɪljən vi ɛn di/"}, {"topicRaw": "10-Training", "topicName": "Training", "topicOrder": 10, "stage": 2, "vi": "Nếu nghỉ việc trước thời hạn cam kết, bạn sẽ hoàn trả chi phí theo tỷ lệ.", "en": "If you resign before the commitment ends, you'll repay the cost pro-rata.", "ipa": "/ɪf ju rɪˈzaɪn bɪˈfɔr ðə kəˈmɪtmənt‿ɛndz, jul riˈpeɪ ðə kɑst proʊ ˈræɾə/"}, {"topicRaw": "10-Training", "topicName": "Training", "topicOrder": 10, "stage": 2, "vi": "Rất tiếc, ngân sách đào tạo năm nay đã hết nên khóa này chuyển sang năm sau.", "en": "Unfortunately, this year's training budget is used up, so we'll defer this course.", "ipa": "/ənˈfɔrtʃənətli, ðɪs jɪrz ˈtreɪnɪŋ ˈbʌdʒɪt‿ɪz juzd‿ʌp, soʊ wil dɪˈfɝ ðɪs kɔrs/"}, {"topicRaw": "10-Training", "topicName": "Training", "topicOrder": 10, "stage": 2, "vi": "Tôi sẽ theo dõi việc áp dụng kỹ năng và báo lại sau 3 tháng.", "en": "I'll track how the skills are applied and report back in three months." opicOrder": 10, "stage": 3, "vi": "Tôi hiểu ý bạn, nhưng khóa này bắt buộc theo luật an toàn.", "en": "I see your point, but this course is required by safety regulations.", "ipa": "/aɪ si jɚ pɔɪnt, bət ðɪs kɔrs‿ɪz rɪˈkwaɪɚd baɪ ˈseɪfti ˌrɛɡjəˈleɪʃənz/"}, {"topicRaw": "10-Training", "topicName": "Training", "topicOrder": 10, "stage": 3, "vi": "Có lẽ nên đo kết quả đào tạo 3 tháng sau mỗi khóa học.", "en": "It might be worth measuring training results three months after each course.", "ipa": "/ɪt maɪt bi wɝθ ˈmɛʒɚɪŋ ˈtreɪnɪŋ rɪˈzʌlts θri mʌnθs‿ˈæftɚ‿itʃ kɔrs/"}, {"topicRaw": "10-Training", "topicName": "Training", "topicOrder": 10, "stage": 4, "vi": "Chúng ta chuyển sang kế hoạch đào tạo năm sau, vì cần chốt ngân sách.", "en": "Next, let's look at next year's training plan, because the budget is due soon.", "ipa": "/nɛkst, lɛts lʊk‿ət nɛkst jɪrz ˈtreɪnɪŋ plæn, bɪˈkɔz ðə ˈbʌdʒɪɾ‿ɪz du sun/"}, {"topicRaw": "10-Training", "topicName": "Training", "topicOrder": 10, "stage": 4, "vi": "Bạn trình bày các khóa ưu tiên và chi phí dự kiến nhé?", "en": "Could you walk us through the priority courses and their estimated costs?", "ipa": "/kʊd ju wɔk‿əs θru ðə praɪˈɔrəɾi ˈkɔrsɪz‿ən ðɛr‿ˈɛstəˌmeɪɾɪd kɔsts/"}, {"topicRaw": "10-Training", "topicName": "Training", "topicOrder": 10, "stage": 4, "vi": "Tôi muốn lưu ý một điểm: chỉ 40% người học áp dụng được vào việc.", "en": "I want to flag one issue: only 40% of learners apply what they learn.", "ipa": "/aɪ wɑnt tə flæɡ wʌn‿ˈɪʃu: ˈoʊnli ˈfɔrɾi pɚˈsɛnt‿əv ˈlɝnɚz‿əˈplaɪ wʌt ðeɪ lɝn/"}, {"topicRaw": "10-Training", "topicName": "Training", "topicOrder": 10, "stage": 4, "vi": "Tôi hiểu các team đều muốn đào tạo, tuy nhiên ngân sách có hạn.", "en": "I appreciate that every team wants training; however, our budget is limited this year.", "ipa": "/aɪ əˈpriʃiˌeɪt ðæɾ‿ˈɛvri tim wɑnts ˈtreɪnɪŋ; haʊˈɛvɚ, ˈaʊɚ ˈbʌdʒɪɾ‿ɪz ˈlɪmɪɾɪd ðɪs jɪr/"}, {"topicRaw": "10-Training", "topicName": "Training", "topicOrder": 10, "stage": 4, "vi": "Hay chúng ta mời c
